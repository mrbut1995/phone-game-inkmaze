<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Bo góc chuẩn App Icon Android / iOS (Squircle rx=28) -->
    <clipPath id="appIconClip">
      <rect x="2" y="2" width="124" height="124" rx="28"/>
    </clipPath>

    <!-- Đổ bóng nổi khối cho cây bút chì (như ảnh 1) -->
    <filter id="pencilShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#1E2830" flood-opacity="0.35"/>
    </filter>

    <!-- Đổ bóng nhẹ cho khối bàn cờ trên trang vở -->
    <filter id="cardBoardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2D2115" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- ================= 1. NỀN VỞ Ô LY HỌC SINH ================= -->
  <g clip-path="url(#appIconClip)">
    <!-- Màu giấy kem ngà đặc trưng -->
    <rect width="128" height="128" fill="#FAF5EB"/>

    <!-- Lưới ô ly mỏng sổ tay (khoảng cách 16px) -->
    <g stroke="#8FB9D2" stroke-width="0.85" opacity="0.45">
      <line x1="16" y1="0" x2="16" y2="128"/><line x1="32" y1="0" x2="32" y2="128"/>
      <line x1="48" y1="0" x2="48" y2="128"/><line x1="64" y1="0" x2="64" y2="128"/>
      <line x1="80" y1="0" x2="80" y2="128"/><line x1="96" y1="0" x2="96" y2="128"/>
      <line x1="112" y1="0" x2="112" y2="128"/>
      <line x1="0" y1="16" x2="128" y2="16"/><line x1="0" y1="32" x2="128" y2="32"/>
      <line x1="0" y1="48" x2="128" y2="48"/><line x1="0" y1="64" x2="128" y2="64"/>
      <line x1="0" y1="80" x2="128" y2="80"/><line x1="0" y1="96" x2="128" y2="96"/>
      <line x1="0" y1="112" x2="128" y2="112"/>
    </g>

    <!-- Đường kẻ lề đỏ vở học sinh bên trái -->
    <line x1="20" y1="0" x2="20" y2="128" stroke="#D84444" stroke-width="2" opacity="0.85"/>

    <!-- ================= 2. BÀN CỜ 3x3 MỞ RỘNG TO RÕ (86 x 86 px) ================= -->
    <!-- Tọa độ từ x=21, y=21 đến 107, mỗi ô rộng gần 29px -->
    <g filter="url(#cardBoardShadow)">
      <rect x="21" y="21" width="86" height="86" rx="18" fill="#FFFDF8" stroke="#3D779B" stroke-width="2.5"/>
      
      <!-- Lưới phân chia 3x3 ô màu xanh mực nhạt -->
      <g stroke="#8FB9D2" stroke-width="1.6" opacity="0.65">
        <line x1="49.6" y1="21" x2="49.6" y2="107"/>
        <line x1="78.3" y1="21" x2="78.3" y2="107"/>
        <line x1="21" y1="49.6" x2="107" y2="49.6"/>
        <line x1="21" y1="78.3" x2="107" y2="78.3"/>
      </g>
    </g>

    <!-- ================= 3. CÁC CON SỐ TRONG GRID TO BẢN (FONT 24px - 26px) ================= -->
    <g font-family="'Segoe UI', Roboto, sans-serif" font-weight="950" text-anchor="middle" dominant-baseline="central" fill="#1E3F57">
      <!-- Số 1 (Ô góc trên trái) -->
      <text x="35.5" y="35.5" font-size="25">1</text>
      
      <!-- Số 2 (Ô giữa trên) -->
      <text x="64" y="35.5" font-size="25">2</text>
      
      <!-- Số 3 (Ô giữa trái) -->
      <text x="35.5" y="64" font-size="25">3</text>
      
      <!-- Số 4 (Ô góc dưới phải - màu đỏ lề tạo điểm nhấn) -->
      <text x="92.5" y="92.5" font-size="25" fill="#D84444">4</text>
    </g>

    <!-- ================= 4. ĐƯỜNG MŨI TÊN MÊ CUNG NÉT ĐẬM (MAZE ARROW) ================= -->
    <!-- Uốn lượn qua các ô và phóng mũi tên thoát ra mép phải (như ảnh 2) -->
    <g stroke="#1D4B6E" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 10 64 L 35.5 64 L 35.5 92.5 L 64 92.5 L 64 64 L 102 64 L 115 64" fill="none" stroke-width="4.5"/>
      <!-- Đầu mũi tên nhọn ở lối ra -->
      <polygon points="112,57 123,64 112,71" fill="#1D4B6E" stroke="none"/>
    </g>
    <!-- Lõi mực phát sáng của đường vẽ -->
    <path d="M 10 64 L 35.5 64 L 35.5 92.5 L 64 92.5 L 64 64 L 102 64" fill="none" stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ================= 5. BÚT CHÌ VÀNG TỐI GIẢN (45 ĐỘ NHƯ ẢNH 1) ================= -->
    <!-- Đặt tại góc trên phải, ngòi chì chỉ vào tâm ô đang giải -->
    <g transform="translate(64, 26) rotate(-45)" filter="url(#pencilShadow)">
      <!-- Thân bút chì vàng cam -->
      <rect x="-8" y="-36" width="16" height="34" rx="2.5" fill="#F59E0B"/>
      <!-- Sọc vân gỗ thân bút -->
      <rect x="-2.5" y="-36" width="5" height="34" fill="#D97706"/>
      <!-- Phần gỗ gọt hình nón -->
      <polygon points="-8,-2 8,-2 0,12" fill="#FDE68A"/>
      <!-- Ngòi chì đen than -->
      <polygon points="-3,7 3,7 0,12" fill="#1E283A"/>
    </g>
  </g>

  <!-- Viền bo ngoài icon chuẩn App Store / Google Play -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="#6EA0C8" stroke-width="2.5"/>
</svg>