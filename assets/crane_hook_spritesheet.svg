<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 90" width="512" height="90">
  <defs>
    <!-- Template cụm móc cẩu hoàn chỉnh gắn trục quay tại (0, 0) -->
    <g id="hook_pendulum">
      <line x1="0" y1="0" x2="0" y2="63" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" />
      <line x1="0" y1="0" x2="0" y2="63" stroke="#64748b" stroke-width="1.0" stroke-dasharray="4,1.5" />
      <rect x="-6" y="60" width="12" height="12" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="0.8" />
      <circle cx="0" cy="66" r="4.2" fill="#334155" stroke="#0f172a" stroke-width="0.7" />
      <circle cx="0" cy="66" r="1.4" fill="#ffffff" />
      <path d="M 0,74 C 4,74 7,77 7,81 C 7,85 2,86 -2,85 C -6,84 -7,80 -7,77 L -5,77 C -5,79 -4,82 -1,83 C 2,83 4,82 4,80 C 4,77 1,76 0,76 Z" fill="#cbd5e1" stroke="#1e293b" stroke-width="0.7" />
      <line x1="-1" y1="76" x2="-6" y2="78" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </defs>

  <!-- FRAME 0: Góc 0° (Thẳng đứng) -->
  <g transform="translate(32, 2)">
    <circle cx="0" cy="0" r="2.5" fill="#64748b" />
    <g transform="rotate(0)"><use href="#hook_pendulum" /></g>
  </g>

  <!-- FRAME 1: Góc +14° (Nghiêng phải) -->
  <g transform="translate(96, 2)">
    <circle cx="0" cy="0" r="2.5" fill="#64748b" />
    <g transform="rotate(14)"><use href="#hook_pendulum" /></g>
  </g>

  <!-- FRAME 2: Góc +20° (Đỉnh phải cực đại) -->
  <g transform="translate(160, 2)">
    <circle cx="0" cy="0" r="2.5" fill="#64748b" />
    <g transform="rotate(20)"><use href="#hook_pendulum" /></g>
  </g>

  <!-- FRAME 3: Góc +14° (Hạ về phải) -->
  <g transform="translate(224, 2)">
    <circle cx="0" cy="0" r="2.5" fill="#64748b" />
    <g transform="rotate(14)"><use href="#hook_pendulum" /></g>
  </g>

  <!-- FRAME 4: Góc 0° (Thẳng đứng) -->
  <g transform="translate(288, 2)">
    <circle cx="0" cy="0" r="2.5" fill="#64748b" />
    <g transform="rotate(0)"><use href="#hook_pendulum" /></g>
  </g>

  <!-- FRAME 5: Góc -14° (Nghiêng trái) -->
  <g transform="translate(352, 2)">
    <circle cx="0" cy="0" r="2.5" fill="#64748b" />
    <g transform="rotate(-14)"><use href="#hook_pendulum" /></g>
  </g>

  <!-- FRAME 6: Góc -20° (Đỉnh trái cực đại) -->
  <g transform="translate(416, 2)">
    <circle cx="0" cy="0" r="2.5" fill="#64748b" />
    <g transform="rotate(-20)"><use href="#hook_pendulum" /></g>
  </g>

  <!-- FRAME 7: Góc -14° (Hạ về trái, chuẩn bị loop về F0) -->
  <g transform="translate(480, 2)">
    <circle cx="0" cy="0" r="2.5" fill="#64748b" />
    <g transform="rotate(-14)"><use href="#hook_pendulum" /></g>
  </g>
</svg>