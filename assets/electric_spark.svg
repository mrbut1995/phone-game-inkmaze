<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -32 64 64" width="64" height="64">
  <defs>
    <!-- Vầng hào quang hồ quang điện nổ -->
    <radialGradient id="plasmaGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- 1. QUẦNG SÁNG PLASMA TRUNG TÂM -->
  <circle cx="0" cy="0" r="24" fill="url(#plasmaGlow)" />
  
  <!-- 2. CÁC NHÁNH TIA SÉT NỔ RA 4 HƯỚNG -->
  <!-- Nhánh chính chạy ngang dây -->
  <path d="M -24,2 L -14,-4 L -6,3 L 0,-2 L 7,5 L 16,-3 L 25,1" 
        fill="none" stroke="#00f5d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <!-- Lõi tia sét siêu sáng màu trắng nóng -->
  <path d="M -24,2 L -14,-4 L -6,3 L 0,-2 L 7,5 L 16,-3 L 25,1" 
        fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Nhánh phụ phóng lên trên -->
  <path d="M -4,-2 L -8,-14 L -3,-18 L -6,-25" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-linecap="round" />
  <!-- Nhánh phụ phóng xuống dưới -->
  <path d="M 5,3 L 11,12 L 8,18 L 14,24" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" />

  <!-- 3. TÀN LỬA VÀNG/CYAN BẮN TUNG TÓE -->
  <circle cx="-16" cy="-12" r="1.4" fill="#ffffff" />
  <circle cx="18" cy="-10" r="1.2" fill="#00f5d4" />
  <circle cx="-12" cy="16" r="1.2" fill="#00f5d4" />
  <circle cx="20" cy="14" r="1.5" fill="#ffffff" />
  <circle cx="0" cy="-20" r="1.0" fill="#a7f3d0" />
  <circle cx="-2" cy="22" r="1.0" fill="#38bdf8" />
</svg>