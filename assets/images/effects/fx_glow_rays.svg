<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Tia sáng tỏa ra từ rương: 6 tia dài + 6 tia ngắn xen kẽ (chu kỳ lặp 60°) -> xoay đúng 60° là lặp liền mạch -->
  <defs>
    <radialGradient id="rayFade" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="256">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFE08A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="url(#rayFade)">
    <!-- Tia dài -->
    <path d="M256 256 L240 0 H272 Z"/>
    <path transform="rotate(60 256 256)" d="M256 256 L240 0 H272 Z"/>
    <path transform="rotate(120 256 256)" d="M256 256 L240 0 H272 Z"/>
    <path transform="rotate(180 256 256)" d="M256 256 L240 0 H272 Z"/>
    <path transform="rotate(240 256 256)" d="M256 256 L240 0 H272 Z"/>
    <path transform="rotate(300 256 256)" d="M256 256 L240 0 H272 Z"/>
    <!-- Tia ngắn -->
    <path transform="rotate(30 256 256)" d="M256 256 L243 70 H269 Z"/>
    <path transform="rotate(90 256 256)" d="M256 256 L243 70 H269 Z"/>
    <path transform="rotate(150 256 256)" d="M256 256 L243 70 H269 Z"/>
    <path transform="rotate(210 256 256)" d="M256 256 L243 70 H269 Z"/>
    <path transform="rotate(270 256 256)" d="M256 256 L243 70 H269 Z"/>
    <path transform="rotate(330 256 256)" d="M256 256 L243 70 H269 Z"/>
  </g>
</svg>
