<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 510" width="377.5" height="255" style="overflow: visible;">
  <defs>
    <!-- Đổ bóng của panel -->
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <!-- Hiệu ứng nổ/va chạm khi đi đè đường cũ -->
    <filter id="deadClashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#DC2626" flood-opacity="0.75"/>
    </filter>

    <!-- Họa tiết gạch chéo ô đã đi qua -->
    <pattern id="visitedHatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="12" x2="12" y2="0" stroke="#2575A7" stroke-width="1.2" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- PANEL MINH HỌA CHÍNH -->
  <g filter="url(#uiShadow)">
    <rect width="377.5" height="255" rx="22" fill="#FEFDFA" stroke="#2575A7" stroke-width="3"/>

    <!-- NỬA TRÁI: ĐI VÀO ĐƯỜNG CŨ (GAME OVER) -->
    <g transform="translate(45, 30)">
      <rect width="155" height="197.5" rx="18" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
      <rect x="15" y="16" width="92.5" height="14" rx="8" fill="#FEE2E2"/>

      <!-- Lưới mini 2x2 thể hiện việc quay đầu đè nét cũ -->
      <g transform="translate(65, 65)">
        <rect width="90" height="90" rx="14" fill="#FFFFFF" stroke="#BACEDC" stroke-width="2"/>
        <line x1="90" y1="0" x2="90" y2="180" stroke="#BACEDC" stroke-width="1.5"/>
        <line x1="0" y1="90" x2="180" y2="90" stroke="#BACEDC" stroke-width="1.5"/>

        <!-- Ô [0,0] và [1,0] đã đi -->
        <rect x="0" y="0" width="45" height="45" fill="#2575A7" fill-opacity="0.15"/>
        <rect x="0" y="0" width="45" height="45" fill="url(#visitedHatch)"/>

        <!-- Đường nét vẽ đi từ [0,0] sang [1,0] rồi quay đè ngược lại -->
        <path d="M 45 45 L 135 45" stroke="#2575A7" stroke-width="8" stroke-linecap="round"/>
        <path d="M 135 45 L 80 45" stroke="#DC2626" stroke-width="8" stroke-linecap="round"/>

        <!-- Điểm va chạm nổ gãy nét -->
        <g transform="translate(75, 45)" filter="url(#deadClashGlow)">
          <circle cx="0" cy="0" r="14" fill="#EF4444"/>
          <circle cx="0" cy="0" r="7" fill="#FDE047"/>
          <path d="M -10 -10 L 10 10 M 10 -10 L -10 10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- NỬA PHẢI: BẪY CÔ LẬP Ô TRỐNG (HẾT ĐƯỜNG ĐI) -->
    <g transform="translate(400, 30)">
      <rect width="155" height="197.5" rx="18" fill="#FFFDF8" stroke="#F59E0B" stroke-width="2"/>
      <rect x="20" y="16" width="87.5" height="14" rx="8" fill="#FEF3C7"/>

      <!-- Lưới mini thể hiện ô trống bị vây kín -->
      <g transform="translate(65, 65)">
        <rect width="90" height="90" rx="14" fill="#FFFFFF" stroke="#BACEDC" stroke-width="2"/>
        <line x1="90" y1="0" x2="90" y2="180" stroke="#BACEDC" stroke-width="1.5"/>
        <line x1="0" y1="90" x2="180" y2="90" stroke="#BACEDC" stroke-width="1.5"/>

        <!-- 3 ô xung quanh đã đi và khóa lại -->
        <rect x="0" y="0" width="45" height="45" fill="#2575A7" fill-opacity="0.15"/>
        <rect x="0" y="0" width="45" height="45" fill="url(#visitedHatch)"/>
        <rect x="90" y="0" width="45" height="45" fill="#2575A7" fill-opacity="0.15"/>
        <rect x="90" y="0" width="45" height="45" fill="url(#visitedHatch)"/>
        <rect x="90" y="90" width="45" height="45" fill="#2575A7" fill-opacity="0.15"/>
        <rect x="90" y="90" width="45" height="45" fill="url(#visitedHatch)"/>

        <!-- Ô [0,1] bị cô lập -->
        <rect x="4" y="94" width="41" height="41" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
      </g>
    </g>

    <!-- THANH CHÂN HÌNH -->
    <rect x="20" y="448" width="357.5" height="22" rx="10" fill="#F4EFE6"/>
  </g>
</svg>