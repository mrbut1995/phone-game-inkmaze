  <circle cx="26" cy="50" r="4.5" fill="#F2F1EB" stroke="#DBDCCF" stroke-width="1.2"/>
  <circle cx="26" cy="132" r="4.5" fill="#F2F1EB" stroke="#DBDCCF" stroke-width="1.2"/>
  <circle cx="26" cy="214" r="4.5" fill="#F2F1EB" stroke="#DBDCCF" stroke-width="1.2"/>

  <!-- Các đường kẻ ngang ghi chú -->
  <line x1="72" y1="107" x2="722" y2="107" stroke="#DBDCCF" stroke-width="1.5"/>
  <line x1="72" y1="197" x2="722" y2="197" stroke="#DBDCCF" stroke-width="2.5"/>

