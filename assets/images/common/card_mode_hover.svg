  </g>

  <!-- Nếp gấp góc phải trên -->
  <path d="M 738 2 L 778 42 H 738 V 2 Z" fill="#E4E2D5" stroke="#DBDCCF" stroke-width="2" stroke-linejoin="round"/>

  <!-- Gáy sổ & 3 lỗ bấm giấy -->
