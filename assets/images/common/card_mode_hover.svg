      <feGaussianBlur stdDeviation="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.27 0 0 0 0 0.26 0 0 0 0 0.19 0 0 0 0.15 0"/>
      <feBlend mode="normal" in2="bgFix" result="shadow"/>
      <feBlend mode="normal" in="SourceGraphic" in2="shadow" result="shape"/>
    </filter>
  </defs>

  <!-- Lớp giấy lót bên dưới -->
