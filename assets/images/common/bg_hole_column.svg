<!-- Cột lỗ bấm: 1 lỗ giữa dải gáy rộng 36px (canvas 540) = 72px @2×. Chu kỳ dọc 120 canvas-px = 240px @2×.
     Script thu về 36×120 (`hole_density = 2`), Parallax2D lặp dọc. Godot import thẳng SVG scale 1.
     KHÔNG dùng <filter> (ThorVG bỏ qua): bóng lõm = cung tối + cung sáng. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 240" width="72" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="36" cy="120" r="15" fill="#F4EFE6"/>
  <path d="M 23.60 115.49 A 13.2 13.2 0 0 1 48.40 115.49" fill="none" stroke="#8B8260" stroke-opacity="0.30" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M 48.40 124.51 A 13.2 13.2 0 0 1 23.60 124.51" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="36" cy="120" r="15" fill="none" stroke="#DBDCCF" stroke-width="1.5"/>
</svg>