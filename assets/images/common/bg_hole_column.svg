<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240" width="1080" height="240">
  <defs>
    <!-- Filter tạo bóng lõm tự nhiên vào lòng lỗ -->
    <filter id="paperHoleShadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feOffset dy="2" />
      <feGaussianBlur stdDeviation="2" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#8B8260" flood-opacity="0.3" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- Tâm x=65 (chính giữa dải gáy 0-130px), y=120 (giữa nhịp 240px) -->
  <g>
    <!-- Thân lỗ có bóng chìm -->
    <circle cx="65" cy="120" r="18" fill="#F4EFE6" filter="url(#paperHoleShadow)" />
    <!-- Vòng mép bấm sắc nét -->
    <circle cx="65" cy="120" r="18" fill="none" stroke="#DBDCCF" stroke-width="1.5" />
  </g>
</svg>