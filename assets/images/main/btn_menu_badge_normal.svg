<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 224 224" width="112" height="112">
  <!-- Nút "Sổ tay thành tựu" trên Main Screen: sticker huy chương vẽ tay dán trên giấy ô ly -->
