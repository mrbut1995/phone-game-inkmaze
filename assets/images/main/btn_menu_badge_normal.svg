  <circle cx="100" cy="104" r="34" fill="none" stroke="#D8A75B" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- nét vẽ tay trang trí -->
  <path d="M186 46 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 Z" fill="#8FB9D2"/>
  <path d="M26 158 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" fill="#8FB9D2"/>
  <path d="M32 54 h15 M39.5 46.5 v15" stroke="#8FB9D2" stroke-width="2.4" stroke-linecap="round"/>
</svg>
