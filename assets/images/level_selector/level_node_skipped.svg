<?xml version='1.0' encoding='utf-8'?>
<!-- Level Node: Skipped - Paper card with warning/skip indicator (76x94) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 212 262" width="76" height="94">
  <defs>
    <filter id="skipDropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.18" />
    </filter>
    <clipPath id="skipClip"><rect width="200" height="250" rx="32"/></clipPath>
  </defs>
  <g filter="url(#skipDropShadow)">
    <!-- Main card body -->
    <rect width="200" height="250" rx="32" fill="#FEFDFA"/>
    <!-- Notebook lines inside -->
    <g clip-path="url(#skipClip)">
      <rect width="200" height="250" fill="#E8A020" fill-opacity="0.05"/>
      <line x1="0" y1="65" x2="200" y2="65" stroke="#8FB9D2" stroke-width="2.5" opacity="0.4"/>
      <line x1="0" y1="110" x2="200" y2="110" stroke="#8FB9D2" stroke-width="2.5" opacity="0.4"/>
      <line x1="0" y1="155" x2="200" y2="155" stroke="#8FB9D2" stroke-width="2.5" opacity="0.4"/>
      <line x1="0" y1="200" x2="200" y2="200" stroke="#8FB9D2" stroke-width="2.5" opacity="0.4"/>
      <!-- Orange margin line -->
      <line x1="38" y1="0" x2="38" y2="250" stroke="#E8A020" stroke-width="4.5" opacity="0.85"/>
    </g>
    <!-- Border - amber/orange -->
    <rect width="200" height="250" rx="32" fill="none" stroke="#E8A020" stroke-width="7"/>
    <!-- Top shine -->
    <line x1="44" y1="4" x2="170" y2="4" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>
    <!-- Warning indicator in center -->
    <g transform="translate(100, 110)">
      <!-- Triangle outline -->
      <polygon points="0,-40 36,22 -36,22" fill="#E8A020" fill-opacity="0.12" stroke="#E8A020" stroke-width="5" stroke-linejoin="round"/>
      <!-- Exclamation mark -->
      <line x1="0" y1="-20" x2="0" y2="5" stroke="#E8A020" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="15" r="3.5" fill="#E8A020"/>
    </g>
  </g>
</svg>
