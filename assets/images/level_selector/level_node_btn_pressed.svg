<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224" width="112" height="112">
  <defs>
    <linearGradient id="faceP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7DFCB" />
      <stop offset="0.45" stop-color="#F1E9D7" />
      <stop offset="1" stop-color="#F6EFDF" />
    </linearGradient>
  </defs>

  <!-- Nút màn chơi — NHẤN: mặt nút lún xuống 10px thiết kế (= 5px hiển thị), chỉ còn lộ gờ 2px -->
