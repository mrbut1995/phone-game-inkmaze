  <rect x="13" y="25" width="198" height="186" rx="47" fill="#2F6E96" />
  <rect x="16" y="26" width="192" height="180" rx="44" fill="url(#faceP)"
        stroke="#2F6E96" stroke-width="6" />
  <!-- Bóng đổ vào phía trong (cảm giác lún) -->
  <line x1="58" y1="46" x2="166" y2="46" stroke="#B9AC92" stroke-width="7"
        stroke-linecap="round" opacity="0.35" />
  <line x1="70" y1="188" x2="154" y2="188" stroke="#C9BEA6" stroke-width="5"
        stroke-linecap="round" opacity="0.35" />
