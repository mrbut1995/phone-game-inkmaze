<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Đổ bóng nhẹ cho ngôi sao nổi trên mặt giấy -->
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#8C5302" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#starShadow)">
    <!-- Thân ngôi sao vàng nét bo góc mềm -->
    <path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" 
          fill="#FBBF24" stroke="#D97706" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Vệt sáng highlight góc trên -->
    <path d="M 24 8 L 28 16.5 L 37 17.8" fill="none" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>