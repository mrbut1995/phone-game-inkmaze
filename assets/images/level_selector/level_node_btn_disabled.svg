<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224" width="112" height="112">
  <defs>
    <linearGradient id="faceD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EFE8" />
      <stop offset="1" stop-color="#E4E0D5" />
    </linearGradient>
    <pattern id="hatchD" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#B7C2CB" stroke-width="3" opacity="0.5" />
    </pattern>
    <clipPath id="clipD"><rect x="16" y="22" width="192" height="180" rx="44" /></clipPath>
  </defs>

  <!-- Nút màn chơi — KHOÁ: xám, thấp hơn nút thường 6px thiết kế (gờ chỉ lộ 6px), có gạch chéo mờ -->
  <rect x="13" y="31" width="198" height="186" rx="47" fill="#5A6B78" fill-opacity="0.10" />
  <rect x="13" y="25" width="198" height="186" rx="47" fill="#93A3B0" />
  <rect x="16" y="22" width="192" height="180" rx="44" fill="url(#faceD)"
        stroke="#A9B8C4" stroke-width="6" />
  <g clip-path="url(#clipD)">
    <rect x="16" y="22" width="192" height="180" fill="url(#hatchD)" opacity="0.35" />
  </g>
  <line x1="58" y1="42" x2="166" y2="42" stroke="#FFFFFF" stroke-width="8"
        stroke-linecap="round" opacity="0.55" />
</svg>
