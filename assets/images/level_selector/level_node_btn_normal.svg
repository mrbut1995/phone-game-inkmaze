<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224" width="112" height="112">
  <defs>
    <linearGradient id="faceN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8" />
      <stop offset="1" stop-color="#F4EBD8" />
    </linearGradient>
  </defs>

  <!-- Nút màn chơi — THƯỜNG: khối giấy có GỜ ĐÁY (kiểu nút nổi), mặt nút cao 12px so với gờ -->
  <!-- Bóng đặt dưới gờ -->
  <rect x="13" y="31" width="198" height="186" rx="47" fill="#1E3D52" fill-opacity="0.18" />
  <!-- Gờ đáy (xanh mực đậm) — phần ló ra dưới mặt nút: 12px thiết kế = 6px hiển thị -->
  <rect x="13" y="25" width="198" height="186" rx="47" fill="#2F6E96" />
  <!-- Mặt nút -->
  <rect x="16" y="16" width="192" height="180" rx="44" fill="url(#faceN)"
        stroke="#3D83AE" stroke-width="6" />
  <!-- Lằn sáng trên đỉnh mặt nút -->
  <line x1="58" y1="36" x2="166" y2="36" stroke="#FFFFFF" stroke-width="8"
        stroke-linecap="round" opacity="0.85" />
  <!-- Vệt bóng mờ dưới đáy mặt nút -->
  <line x1="70" y1="178" x2="154" y2="178" stroke="#C9BEA6" stroke-width="6"
        stroke-linecap="round" opacity="0.5" />
</svg>
