<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224" width="112" height="112">
  <defs>
    <linearGradient id="faceN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8" />
      <stop offset="1" stop-color="#F4EBD8" />
    </linearGradient>
    <filter id="shadowN" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#1E3D52" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Nút màn chơi — trạng thái THƯỜNG: khối giấy nổi, viền mực xanh -->
  <rect x="16" y="16" width="192" height="192" rx="44" fill="url(#faceN)"
        stroke="#3D83AE" stroke-width="7" filter="url(#shadowN)" />
  <!-- Lằn sáng trên đỉnh nút (độ nổi) -->
  <line x1="58" y1="38" x2="166" y2="38" stroke="#FFFFFF" stroke-width="8"
        stroke-linecap="round" opacity="0.85" />
  <!-- Vệt bóng mờ dưới đáy nút -->
  <line x1="70" y1="188" x2="154" y2="188" stroke="#C9BEA6" stroke-width="6"
        stroke-linecap="round" opacity="0.5" />
</svg>
