<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 0 50 67" width="50" height="67">
  <defs>
    <filter id="unlockShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1E2830" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#unlockShadow)">
    <!-- Quai khóa bật nhấc lên và mở sang phải -->
    <path d="M 22 26 L 22 13 A 10 10 0 0 1 42 13 L 42 19" 
          fill="none" stroke="#2E7D32" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Thân ổ khóa (Viền xanh lá tươi thể hiện đã mở) -->
    <rect x="13" y="26" width="38" height="32" rx="8" fill="#FFFDF8" stroke="#2E7D32" stroke-width="3.5"/>

    <!-- Lỗ khóa -->
    <circle cx="32" cy="39" r="3.5" fill="#2E7D32"/>
    <polygon points="30.5,41 33.5,41 34.5,48 29.5,48" fill="#2E7D32"/>
  </g>
</svg>