<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <filter id="cursorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#2575A7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#cursorGlow)">
    <!-- Vòng hào quang ngoài -->
    <circle cx="30" cy="30" r="24" fill="#2575A7" fill-opacity="0.2"/>
    <!-- Vòng đệm trắng -->
    <circle cx="30" cy="30" r="16" fill="#FFFFFF" stroke="#2575A7" stroke-width="3"/>
    <!-- Tâm mực chỉ vị trí -->
    <circle cx="30" cy="30" r="8" fill="#2575A7"/>
  </g>
</svg>