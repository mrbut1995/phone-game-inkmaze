<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 56 56" width="28" height="28">
  <defs>
    <filter id="cursorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FACC15" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#cursorGlow)">
    <g transform="translate(30, 30) rotate(-45)">
      <!-- Thân bút dạ quang dẹt to bản -->
      <path d="M -9 -5 L -10 -20 L 10 -20 L 9 -5 Z" fill="#2575A7" stroke="#1E283A" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="-8" y="-18" width="8" height="1.5" fill="#FACC15" opacity="0.8"/>

      <!-- Cổ bút chuyển tiếp nón dẹt -->
      <path d="M -6 6 L -8 -5 L 8 -5 L 6 6 Z" fill="#1E283A" stroke="#1E283A" stroke-width="1.6"/>

      <!-- Đầu nỉ vát xéo lưỡi đục (Chisel tip) màu vàng neon -->
      <path d="M -4 7 L -2 18 L 3 20.5 L 4 9.5 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- Mảng vát đỉnh lưỡi đục -->
      <polygon points="-2,18 3,20.5 4,16 0,14" fill="#FEF08A"/>

      <!-- Vệt highlight phát sáng ở đầu ngòi -->
      <circle cx="0.5" cy="21.5" r="1.6" fill="#FACC15"/>
    </g>
  </g>
</svg>