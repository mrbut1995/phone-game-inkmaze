<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 56 56" width="56" height="56">
  <defs>
    <filter id="glowNight" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#2563EB" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#glowNight)">
    <g transform="translate(30, 30) rotate(-45)">
      <!-- Cổ bút xanh đen bóng đêm huyền bí -->
      <path d="M -7 -10 L -9 -20 L 9 -20 L 7 -10 Z" fill="#0F172A" stroke="#020617" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="-8" y="-12" width="16" height="3" rx="1" fill="#60A5FA" stroke="#020617" stroke-width="0.8"/>
      
      <!-- Lá ngòi kim loại xanh sapphire sâu thẳm -->
      <path d="M 0 19 L -1.5 19 C -4 13.5 -10 9 -10 3 C -10 -2 -8 -6 -7 -10 L 0 -10 Z" fill="#1E3A8A" stroke="#020617" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M 0 19 L 1.5 19 C 4 13.5 10 9 10 3 C 10 -2 8 -6 7 -10 L 0 -10 Z" fill="#93C5FD" stroke="#020617" stroke-width="1.8" stroke-linejoin="round"/>
      
      <!-- Chạm khắc họa tiết ngôi sao bầu trời đêm -->
      <path d="M 0 2 L 0.8 4 L 3 4 L 1.3 5.3 L 2 7.2 L 0 6 L -2 7.2 L -1.3 5.3 L -3 4 L -0.8 4 Z" fill="#BAE6FD" stroke="#1D4ED8" stroke-width="0.5"/>
      
      <!-- Lỗ thở mực xanh đêm thẳm -->
      <circle cx="0" cy="5" r="2.2" fill="#1E40AF" stroke="#020617" stroke-width="1.2"/>
      <line x1="0" y1="7.2" x2="0" y2="19.5" stroke="#1D4ED8" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Giọt mực xanh sâu thẳm -->
      <circle cx="0" cy="22" r="1.5" fill="#3B82F6"/>
      <!-- Điểm sáng tinh tú lấp lánh (Star glint) -->
      <circle cx="-5" cy="18" r="0.9" fill="#FFFFFF"/>
    </g>
  </g>
</svg>