<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 56 56" width="28" height="28">
  <defs>
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#glowOrange)">
    <g transform="translate(30, 30) rotate(-45)">
      <!-- Thân bút dạ quang thân dẹt màu cam sữa -->
      <path d="M -10 -5 L -10 -21 C -10 -22 -8 -23 0 -23 C 8 -23 10 -22 10 -21 L 10 -5 Z" fill="#FDBA74" stroke="#9A3412" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="-8.5" y="-19" width="8.5" height="2" rx="1.5" fill="#F97316" opacity="0.8"/>
      <!-- Cổ bút nhựa chuyển tiếp -->
      <path d="M -7 5 L -10 -5 L 10 -5 L 7 5 Z" fill="#7C2D12" stroke="#451A03" stroke-width="1.5"/>
      <path d="M -4.5 5 L -4.5 9 L 4.5 9 L 4.5 5 Z" fill="#431407"/>
      <!-- Ngòi vát lưỡi đục dạ quang cam vàng -->
      <path d="M -3.5 9 L -2 17 L 3.5 21 L 3.5 12 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1.4" stroke-linejoin="round"/>
      <polygon points="-2,17 3.5,21 3.5,16 0,13" fill="#FEF08A"/>
      <!-- Vệt sáng dạ quang nổi bật -->
      <circle cx="2" cy="21.5" r="1.6" fill="#F59E0B"/>
    </g>
  </g>
</svg>