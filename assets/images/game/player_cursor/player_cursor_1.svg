<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 56 56" width="56" height="56">
  <defs>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2575A7" flood-opacity="0.5" />
    </filter>
  </defs>
  <g filter="url(#glowBlue)">
    <g transform="translate(30, 30) rotate(-45)">
      <!-- Cổ bút nhựa xanh học trò -->
      <path d="M -7 -10 L -9 -20 L 9 -20 L 7 -10 Z" fill="#2575A7" stroke="#1E283A" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="-8" y="-12" width="16" height="3" rx="1" fill="#E2E8F0" stroke="#1E283A" stroke-width="0.8"/>
      <!-- Lá ngòi kim loại thép bạc -->
      <path d="M 0 19 L -1.5 19 C -4 13.5 -10 9 -10 3 C -10 -2 -8 -6 -7 -10 L 0 -10 Z" fill="#CBD5E1" stroke="#1E283A" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M 0 19 L 1.5 19 C 4 13.5 10 9 10 3 C 10 -2 8 -6 7 -10 L 0 -10 Z" fill="#FFFFFF" stroke="#1E283A" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Lỗ thở & khe dẫn mực xanh -->
      <circle cx="0" cy="5" r="2.2" fill="#2575A7" stroke="#1E283A" stroke-width="1.2"/>
      <line x1="0" y1="7.2" x2="0" y2="19.5" stroke="#1E283A" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Giọt mực xanh định vị -->
      <circle cx="0" cy="22" r="1.4" fill="#2575A7"/>
    </g>
  </g>
</svg>