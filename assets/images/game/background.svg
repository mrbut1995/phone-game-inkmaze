<?xml version="1.0" encoding="utf-8"?>
<!-- TRANG GIẤY — xuất PNG 1080×1920 ghi đè `assets/images-png/game/background.png`.
     Được Godot ghép bằng NinePatchRect (xem background.gd), nên PHẢI giữ đúng hình học sau:
       · gáy sổ 0–72, đường chỉ x=72, lề đỏ x=84        → "mảnh TRÁI"  = 0…96   (không bị lặp/kéo)
       · lưới ô 48px bắt đầu đúng x=72, đúng 21 ô nguyên tới mép phải (72 + 21×48 = 1080)
       · đường chính 240px tại x=72,312,552,792,1032      → ô cuối (1032–1080) mở đầu bằng 1 đường chính
       · "mảnh GIỮA" = 96…816 (720px = 3 chu kỳ 240) được LÁT GẠCH khi canvas rộng hơn
       · "mảnh PHẢI"  = 816…1080 chứa viền phải (bóng mép giấy + đường khép) — luôn hiện đủ, không bị cắt
       · trục dọc: 1920 = 8 chu kỳ 240 → lát gạch dọc liền mạch cho màn cao (9:19.5 · 9:21)
     Không dùng <filter>. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Lưới caro: chu kỳ 240 = 5 ô × 48; gốc pattern đặt đúng x=72 (sau gáy). Đường chính nằm TRỌN trong ô. -->
    <pattern id="notebookGrid" x="72" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
      <path d="M 48 0 V 240 M 96 0 V 240 M 144 0 V 240 M 192 0 V 240" fill="none" stroke="#DDE5E9" stroke-width="1.4"/>
      <path d="M 0 48 H 240 M 0 96 H 240 M 0 144 H 240 M 0 192 H 240" fill="none" stroke="#DDE5E9" stroke-width="1.4"/>
      <path d="M 240 1 H 1 V 240" fill="none" stroke="#CBD9E2" stroke-width="2"/>
    </pattern>
    <!-- Bóng mép giấy bên phải: tối dần về mép (gradient — ThorVG hỗ trợ) -->
    <linearGradient id="edgeShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#8B8260" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#8B8260" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#8B8260" stop-opacity="0.14"/>
    </linearGradient>
    <!-- Bóng nhẹ sát đường chỉ gáy: tạo cảm giác giấy lõm vào gáy -->
    <linearGradient id="seamShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B8260" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8B8260" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Nền giấy ngà -->
  <rect width="1080" height="1920" fill="#FFFDF7"/>
  <!-- Lưới: từ sau gáy tới tận mép phải (21 ô nguyên) -->
  <rect x="72" y="0" width="1008" height="1920" fill="url(#notebookGrid)"/>
  <!-- Dải gáy sổ + bóng lõm + đường chỉ -->
  <rect x="0" y="0" width="72" height="1920" fill="#FFFCF0"/>
  <rect x="72" y="0" width="14" height="1920" fill="url(#seamShade)"/>
  <line x1="72" y1="0" x2="72" y2="1920" stroke="#DBDCCF" stroke-width="2"/>
  <!-- Lề đỏ vở học sinh -->
  <line x1="84" y1="0" x2="84" y2="1920" stroke="#DFAEAC" stroke-width="3"/>

  <!-- VIỀN PHẢI: bóng mép giấy + đường khép cuối lưới + vệt sáng mép ngoài -->
  <rect x="1040" y="0" width="40" height="1920" fill="url(#edgeShade)"/>
  <line x1="1075" y1="0" x2="1075" y2="1920" stroke="#CBD9E2" stroke-width="3"/>
  <line x1="1079" y1="0" x2="1079" y2="1920" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
</svg>
