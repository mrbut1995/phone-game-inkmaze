<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 138" width="250" height="138">
  <!-- Thẻ giấy 250x138 cho HUD Minesweeper / Sum Path: giấy trắng + viền xanh + lề xanh + dòng kẻ ngang.
       Viền vẽ bằng 2 hình FILL lồng nhau -> không bị cắt nét ở mép viewBox. -->
  <rect width="250" height="138" rx="20" fill="#6EA0C8"/>
  <rect x="3" y="3" width="244" height="132" rx="17" fill="#FEFDFA"/>

  <!-- Dòng kẻ ngang kiểu vở học sinh -->
  <g stroke="#9FC0D6" stroke-width="2" opacity="0.5">
    <line x1="30" y1="46" x2="238" y2="46"/>
    <line x1="30" y1="86" x2="238" y2="86"/>
    <line x1="30" y1="126" x2="238" y2="126"/>
  </g>

  <!-- Lề xanh sổ tay -->
  <line x1="18" y1="3" x2="18" y2="135" stroke="#3D83AE" stroke-width="2.5"/>
</svg>
