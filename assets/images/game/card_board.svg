<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 13 1010 1016" width="505" height="508">
  <defs>
    
    <filter id="boardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1E1610" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E1610" flood-opacity="0.10" />
    </filter>

    
    <clipPath id="boardClip">
      <rect x="20" y="20" width="490" height="490" rx="28"/>
    </clipPath>
  </defs>

  
  <g clip-path="url(#boardClip)">
    <rect x="20" y="20" width="490" height="490" fill="#FEFDFA"/>
    <!-- Lề đỏ vở học sinh -->
    <line x1="62" y1="20" x2="62" y2="1000" stroke="#D84444" stroke-width="3"/>
  </g>

  <!-- Viền mực xanh bo góc -->
  <rect x="20" y="20" width="490" height="490" rx="28" fill="none" stroke="#6EA0C8" stroke-width="6" filter="url(#boardShadow)"/>

  
  <line x1="55" y1="23" x2="965" y2="23" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round" />
</svg>