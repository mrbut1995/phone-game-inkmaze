<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -6 84 87" width="84" height="87">
  <defs>
    <filter id="restartShadowNorm" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Nút Restart 70x70 đúng size mockup (chừa 20px lề cho đổ bóng) -->
  <g filter="url(#restartShadowNorm)">
    <rect width="70" height="70" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <!-- Icon khởi động lại: cung tròn hở + mũi tên (đúng hình mockup/matchup_level.svg) -->
    <path d="M 50 25 A 15 15 0 1 0 52 42" fill="none" stroke="#3D83AE" stroke-width="4" stroke-linecap="round"/>
    <polyline points="42,20 52,24 50,34" fill="none" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
