<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 3 308 77" width="154" height="38.5">
  <defs>
    
    <filter id="shadow-normal" x="-10%" y="-15%" width="125%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#22394A" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#22394A" flood-opacity="0.06" />
    </filter>

    <!-- Họa tiết ô ly -->
    <pattern id="grid-normal" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#90BBD4" stroke-width="0.9" opacity="0.65" />
    </pattern>

    <clipPath id="clip-normal">
      <rect x="15" y="12" width="145" height="28" rx="12" />
    </clipPath>
  </defs>

  
  <g filter="url(#shadow-normal)">
    <g clip-path="url(#clip-normal)">
      <!-- Nền giấy kem -->
      <rect x="15" y="12" width="145" height="28" fill="#FAF5EB" />
      <!-- Lưới ô ly -->
      <rect x="15" y="12" width="145" height="28" fill="url(#grid-normal)" />
      <!-- Lề đỏ vở -->
      <line x1="55" y1="12" x2="55" y2="68" stroke="#D84444" stroke-width="2.5" />
    </g>

    <!-- Viền mực xanh -->
    <rect x="15" y="12" width="145" height="28" rx="12" fill="none" stroke="#3D83AE" stroke-width="2" />
  </g>
</svg>