<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -4 638 140" width="638" height="140">
  <defs>
    <filter id="cardChallengeShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Thẻ THỬ THÁCH 624x125 (rộng bằng 2 thẻ thường + khe 12px) - bản trống, chữ do Label trong scene vẽ -->
