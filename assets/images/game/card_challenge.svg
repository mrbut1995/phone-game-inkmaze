    <rect width="624" height="125" rx="20" fill="#FEFDFA" stroke="#F59E0B" stroke-width="3.5"/>
    <line x1="22" y1="0" x2="22" y2="125" stroke="#F59E0B" stroke-width="2.5"/>
  </g>
</svg>
