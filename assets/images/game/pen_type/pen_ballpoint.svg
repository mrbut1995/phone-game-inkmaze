<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 56 56" width="56" height="56">
  <defs>
    <filter id="cursorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2575A7" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#cursorGlow)">
    <g transform="translate(30, 30) rotate(-45)">
      <!-- Thân bút sơn xanh -->
      <path d="M -6 -7 L -7 -20 L 7 -20 L 6 -7 Z" fill="#2575A7" stroke="#1E283A" stroke-width="1.6" stroke-linejoin="round"/>
      
      <!-- Đệm cao su cầm tay (Rubber grip có rãnh) -->
      <path d="M -6 6 L -6 -7 L 6 -7 L 6 6 Z" fill="#1E40AF" stroke="#1E283A" stroke-width="1.6"/>
      <line x1="-5" y1="-3" x2="5" y2="-3" stroke="#1E283A" stroke-width="1" opacity="0.5"/>
      <line x1="-5" y1="1" x2="5" y2="1" stroke="#1E283A" stroke-width="1" opacity="0.5"/>
      
      <!-- Đầu nón kim loại (Metal cone) -->
      <path d="M -5 6 L -1.5 18 L 1.5 18 L 5 6 Z" fill="#E2E8F0" stroke="#1E283A" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 0 6 L 0 18 L 1.5 18 L 5 6 Z" fill="#FFFFFF" opacity="0.6"/>

      <!-- Viên bi kim loại ở đầu ngòi (Ball bearing) -->
      <circle cx="0" cy="19.5" r="1.3" fill="#1E283A"/>
      <!-- Chấm mực xanh ở đầu bi -->
      <circle cx="0" cy="21.5" r="1.2" fill="#2575A7"/>
    </g>
  </g>
</svg>