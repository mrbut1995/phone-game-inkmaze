<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 56 56" width="56" height="56">
  <defs>
    <!-- Vòng phát sáng vàng neon dạ quang -->
    <filter id="highlighterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FACC15" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#highlighterGlow)">
    <g transform="translate(30, 30) rotate(-45)">
      <!-- 1. Thân bút dẹt to bản (Flat Barrel) -->
      <path d="M -10 -5 L -10 -21 C -10 -22 -8 -23 0 -23 C 8 -23 10 -22 10 -21 L 10 -5 Z" 
            fill="#2575A7" stroke="#1E283A" stroke-width="1.8" stroke-linejoin="round"/>
      
      <!-- Nẹp tem / Vạch trang trí dẹt trên thân -->
      <rect x="-8.5" y="-19" width="17" height="4" rx="1.5" fill="#FACC15" opacity="0.9"/>
      <line x1="-5" y1="-5" x2="-5" y2="-13" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4"/>

      <!-- 2. Cổ bút nhựa đen chuyển tiếp (Shoulder & Collar) -->
      <path d="M -7 5 L -10 -5 L 10 -5 L 7 5 Z" fill="#1E283A" stroke="#1E283A" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M -4.5 5 L -4.5 9 L 4.5 9 L 4.5 5 Z" fill="#334155" stroke="#1E283A" stroke-width="1.2"/>

      <!-- 3. Ngòi nỉ to bản vát xéo lưỡi đục (Chisel Tip) -->
      <!-- Mặt nghiêng của lưỡi đục -->
      <path d="M -3.5 9 L -2 17 L 3.5 21 L 3.5 12 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- Diện cắt vát phẳng ở đỉnh ngòi -->
      <polygon points="-2,17 3.5,21 3.5,16 0,13" fill="#FEF08A"/>

      <!-- 4. Vệt mực dạ quang phát sáng tại đỉnh trỏ -->
      <circle cx="2" cy="21.5" r="1.5" fill="#FEF08A"/>
    </g>
  </g>
</svg>