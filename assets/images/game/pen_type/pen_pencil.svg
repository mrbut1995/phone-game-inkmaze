<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 56 56" width="28" height="28">
  <defs>
    <filter id="cursorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2575A7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#cursorGlow)">
    <!-- Con trỏ Đầu bút chì phác thảo nghiêng 45 độ -->
    <g transform="translate(30, 30) rotate(-45)">
      <!-- 1. Thân bút chì lục giác sơn xanh -->
      <path d="M -8 -8 L -8 -22 L 8 -22 L 8 -8 Z" fill="#2575A7" stroke="#1E283A" stroke-width="1.8" stroke-linejoin="round"/>
      <line x1="-2.7" y1="-8" x2="-2.7" y2="-22" stroke="#1E283A" stroke-width="1" opacity="0.35"/>
      <line x1="2.7" y1="-8" x2="2.7" y2="-22" stroke="#1E283A" stroke-width="1" opacity="0.35"/>

      <!-- 2. Phần gỗ gọt nón có cạnh lượn sóng (Sharpened Wood) -->
      <path d="M -8 -8 L 0 14 L 8 -8 C 6 -6 4 -8 2.7 -8 C 1 -6 -1 -6 -2.7 -8 C -4 -8 -6 -6 -8 -8 Z" fill="#FEF3C7" stroke="#1E283A" stroke-width="1.8" stroke-linejoin="round"/>

      <!-- 3. Ngòi than chì đen nhọn hoắt -->
      <path d="M -3 6 L 0 14 L 3 6 Z" fill="#1E283A"/>
      <!-- Chấm điểm định vị nhỏ -->
      <circle cx="0" cy="17" r="1.3" fill="#2575A7"/>
    </g>
  </g>
</svg>