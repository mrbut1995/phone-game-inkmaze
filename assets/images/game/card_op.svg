<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="56" height="56">
  <!-- Thẻ TOÁN TỬ 112x112 (HUD Sum Path): mẩu giấy nhỏ nằm GIỮA thẻ TỔNG và thẻ MỤC TIÊU.
       Giấy trắng + viền xanh + lề ĐỎ + dòng kẻ ngang (đồng bộ với 2 thẻ lớn). -->
  <rect width="56" height="56" rx="18" fill="#6EA0C8"/>
  <rect x="3" y="3" width="53" height="53" rx="15" fill="#FEFDFA"/>

  <!-- Dòng kẻ ngang kiểu vở học sinh -->
  <g stroke="#9FC0D6" stroke-width="2" opacity="0.5">
    <line x1="16" y1="42" x2="106" y2="42"/>
    <line x1="16" y1="74" x2="106" y2="74"/>
  </g>

  <!-- Lề đỏ sổ tay -->
  <line x1="11" y1="3" x2="11" y2="109" stroke="#D84444" stroke-width="2.5"/>
</svg>
