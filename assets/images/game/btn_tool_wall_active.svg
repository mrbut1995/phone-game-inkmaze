<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -4 374 155" width="374" height="155">
  <defs>
    <filter id="toolWallShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Nút 360x140 đúng size mockup (chừa 20px lề cho đổ bóng) -->
  <g filter="url(#toolWallShadow)">
    <rect width="360" height="140" rx="26" fill="#C4843A" stroke="#9E6322" stroke-width="4"/>
    <line x1="35" y1="0" x2="35" y2="140" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
    <!-- Icon tường gạch -->
    <g transform="translate(55, 48)" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round">
      <rect x="0" y="4" width="40" height="32" rx="6" stroke-width="3"/>
      <line x1="0" y1="20" x2="40" y2="20"/>
      <line x1="20" y1="4" x2="20" y2="20"/>
    </g>
  </g>
</svg>
