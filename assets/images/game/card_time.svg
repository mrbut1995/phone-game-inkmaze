    <rect width="306" height="125" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <line x1="22" y1="0" x2="22" y2="125" stroke="#3D83AE" stroke-width="2.5"/>
  </g>
</svg>
