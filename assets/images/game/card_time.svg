<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -4 320 140" width="320" height="140">
  <defs>
    <filter id="cardTimeShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Thẻ THỜI GIAN 306x125 đúng size mockup - bản trống, không text/icon (chừa 20px lề cho đổ bóng) -->
