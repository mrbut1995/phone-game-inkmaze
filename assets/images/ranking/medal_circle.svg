<!-- Huy chương trắng — tô màu bằng self_modulate (vàng/bạc/đồng). Toạ độ vẽ ở cỡ 1x, viewBox gấp đôi (xuất PNG 176x176 hoặc 88x88). Không dùng filter. -->
