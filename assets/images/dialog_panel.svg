<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 10 638 481" width="638" height="481">
  <defs>
    
    <filter id="modal-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#182E3E" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#182E3E" flood-opacity="0.1" />
    </filter>

    <pattern id="modal-grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#90BBD4" stroke-width="0.85" opacity="0.65" />
    </pattern>

    <clipPath id="modal-clip">
      <rect x="20" y="16" width="600" height="440" rx="18" />
    </clipPath>
  </defs>

  <g filter="url(#modal-shadow)">
    
    <g clip-path="url(#modal-clip)">
      <!-- 1. Nền giấy ngà chính -->
      <rect x="20" y="16" width="600" height="440" fill="#FAF5EB" />

      <!-- 2. Lưới ô ly phần thân (Body) -->
      <rect x="20" y="76" width="600" height="314" fill="url(#modal-grid-pattern)" />

      <!-- 3. Khu vực Header (y: 16 -> 76, cao 60px) -->
      <rect x="20" y="16" width="600" height="60" fill="#F4EEDF" />
      <line x1="20" y1="76" x2="620" y2="76" stroke="#3D83AE" stroke-width="2" />

      
      <line x1="90" y1="76" x2="90" y2="390" stroke="#D84444" stroke-width="2.5" />

      <!-- 5. Khu vực Footer (y: 390 -> 456, cao 66px) -->
      <rect x="20" y="390" width="600" height="66" fill="#F4EEDF" />
      <line x1="20" y1="390" x2="620" y2="390" stroke="#3D83AE" stroke-width="1.8" stroke-dasharray="6 4" />
    </g>

    <!-- Viền khung ngoài -->
    <rect x="20" y="16" width="600" height="440" rx="18" fill="none" stroke="#3D83AE" stroke-width="2.4" />
  </g>
</svg>