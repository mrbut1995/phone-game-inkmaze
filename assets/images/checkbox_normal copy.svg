      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E384D" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1E384D" flood-opacity="0.08" />
    </filter>
  </defs>

  <g filter="url(#cb-shadow-checked)">
