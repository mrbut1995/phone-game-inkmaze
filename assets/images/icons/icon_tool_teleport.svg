<?xml version="1.0" encoding="utf-8"?>
<!-- InkMaze — icon công cụ DỊCH CHUYỂN (thay icon HOÀN TÁC cũ). 32x32, cùng quy ước 1024 viewBox với các icon_tool_*.svg -->
<svg width="32" height="32" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- vệt nhảy: cung nét đứt phía dưới mũi tên -->
  <path d="M150 800 Q 512 980 874 800" fill="none" stroke="#9FC0D6" stroke-width="56" stroke-linecap="round" stroke-dasharray="70 80" />
  <!-- mũi tên nhảy chéo lên: thân -->
  <path d="M250 700 L 610 340" fill="none" stroke="#3D83AE" stroke-width="96" stroke-linecap="round" />
  <!-- đầu mũi tên -->
  <path d="M420 300 L 660 290 L 650 530 Z" fill="#3D83AE" />
  <!-- tia sáng góc trên phải -->
  <path d="M790 150 L 812 232 L 894 254 L 812 276 L 790 358 L 768 276 L 686 254 L 768 232 Z" fill="#FFB89A" />
  <!-- ô đích (chấm tròn) góc dưới trái -->
  <circle cx="210" cy="800" r="64" fill="#6EA0C8" />
  <circle cx="210" cy="800" r="26" fill="#FAF5EB" />
</svg>
