  <!-- Thân 2 nốt nhạc (Stems) -->
  <line x1="16" y1="18" x2="16" y2="34" stroke="#224C6D" stroke-width="3.2"/>
  <line x1="33" y1="13" x2="33" y2="29" stroke="#224C6D" stroke-width="3.2"/>

  <!-- 2 đầu nốt nhạc đặc ruột, nghiêng góc tự nhiên -->
  <ellipse cx="12" cy="34" rx="5.5" ry="4" transform="rotate(-20 12 34)" fill="#224C6D" stroke="#224C6D" stroke-width="1.5"/>
  <ellipse cx="29" cy="29" rx="5.5" ry="4" transform="rotate(-20 29 29)" fill="#224C6D" stroke="#224C6D" stroke-width="1.5"/>
</svg>