<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sóng âm thanh phát ra (dùng màu xanh #8FB9D2) -->
  <path d="M37 20 C40 22.5 40 26.5 37 29" stroke="#8FB9D2" stroke-width="2.6"/>
  <path d="M42 16 C46 20.5 46 28.5 42 33" stroke="#8FB9D2" stroke-width="2.6"/>

  <!-- Thanh xà nối 2 nốt (Beam) -->
