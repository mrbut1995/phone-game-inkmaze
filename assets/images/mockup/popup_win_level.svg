<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Lưới vở nền gốc phía dưới -->
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <!-- Đổ bóng tự nhiên của một tờ giấy thật đặt trên bàn -->
    <filter id="paperSlipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2D2115" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2D2115" flood-opacity="0.12"/>
    </filter>

    <filter id="stampShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8A2323" flood-opacity="0.2"/>
    </filter>

    <!-- Sticker sao vàng thủ công -->
    <g id="sticker-star">
      <path d="M 30 4 L 38 20 L 56 22 L 42 34 L 46 52 L 30 43 L 14 52 L 18 34 L 4 22 L 22 20 Z" 
            fill="#FBBF24" stroke="#D97706" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 30 10 L 34 20 L 46 22" fill="none" stroke="#FEF3C7" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ================= 1. NỀN VỞ Ô LY PHÍA DƯỚI (VẪN NHÌN THẤY RÕ) ================= -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <!-- Lớp phủ bóng râm mờ nhẹ tự nhiên (không làm đen kịt màn hình) -->
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.32"/>

  <!-- ================= 2. MẢNH GIẤY GHI CHÚ WIN POPUP ================= -->
  <!-- Đặt tại x=115, y=390, kích thước 850 x 1120 px -->
  <g transform="translate(115, 390)">

    <!-- TỜ GIẤY TRẮNG NGÀ CÓ ĐỔ BÓNG NỔI -->
    <g filter="url(#paperSlipShadow)">
      <!-- Mặt giấy bo nhẹ góc -->
      <rect width="850" height="1120" rx="18" fill="#FFFDF9"/>
      
      <!-- Hàng lỗ bấm ghim giấy trang trí mép trái -->
      <g fill="#EAE3D2" opacity="0.6">
        <circle cx="24" cy="80" r="7"/><circle cx="24" cy="180" r="7"/><circle cx="24" cy="280" r="7"/>
        <circle cx="24" cy="380" r="7"/><circle cx="24" cy="480" r="7"/><circle cx="24" cy="580" r="7"/>
        <circle cx="24" cy="680" r="7"/><circle cx="24" cy="780" r="7"/><circle cx="24" cy="880" r="7"/>
        <circle cx="24" cy="980" r="7"/><circle cx="24" cy="1080" r="7"/>
      </g>

      <!-- Đường kẻ ngang mờ của tờ giấy nháp -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.35">
        <line x1="60" y1="200" x2="790" y2="200"/><line x1="60" y1="270" x2="790" y2="270"/>
        <line x1="60" y1="340" x2="790" y2="340"/><line x1="60" y1="410" x2="790" y2="410"/>
        <line x1="60" y1="480" x2="790" y2="480"/><line x1="60" y1="550" x2="790" y2="550"/>
        <line x1="60" y1="620" x2="790" y2="620"/><line x1="60" y1="690" x2="790" y2="690"/>
        <line x1="60" y1="760" x2="790" y2="760"/><line x1="60" y1="830" x2="790" y2="830"/>
        <line x1="60" y1="900" x2="790" y2="900"/>
      </g>

      <!-- Đường kẻ lề đỏ riêng của mảnh giấy -->
      <line x1="75" y1="0" x2="75" y2="1120" stroke="#D84444" stroke-width="2.5" opacity="0.85"/>
      <!-- Viền mực bút bi xanh bao quanh mảnh giấy -->
      <rect width="850" height="1120" rx="18" fill="none" stroke="#6EA0C8" stroke-width="3"/>
    </g>

    <!-- DẢI BĂNG DÍNH WASHI TAPE TRONG SUỐT DÁN MÉP TRÊN -->
    <g transform="translate(315, -22)">
      <rect width="220" height="48" rx="4" fill="#E8DFCA" fill-opacity="0.82" stroke="#D1C6AE" stroke-width="1.5"/>
      <!-- Họa tiết caro trên băng dính -->
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" 
            stroke="#B5A98F" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- CON DẤU MỘC ĐỎ CHẤM BÀI: "XUẤT SẮC" (GÓC PHẢI) -->
    <g transform="translate(640, 95) rotate(12)" filter="url(#stampShadow)">
      <ellipse cx="60" cy="35" rx="75" ry="42" fill="none" stroke="#D84444" stroke-width="3.5" stroke-dasharray="8 4"/>
      <ellipse cx="60" cy="35" rx="68" ry="35" fill="#D84444" fill-opacity="0.08" stroke="#D84444" stroke-width="2"/>
      <text x="60" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#D84444" letter-spacing="2">XUẤT SẮC</text>
      <text x="60" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#D84444">★ ĐẠT ★</text>
    </g>

    <!-- NỘI DUNG VIẾT BẰNG BÚT BI TRÊN MẢNH GIẤY -->
    <g transform="translate(115, 90)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="#224C6D">KẾT QUẢ MÀN CHƠI</text>
      <text x="0" y="36" font-family="sans-serif" font-size="22" font-weight="700" fill="#718B9E">Màn 04 • Bàn cờ 5×5 (Classic Maze)</text>
    </g>

    <!-- 3 STICKER NGÔI SAO DÁN TRÊN GIẤY -->
    <g transform="translate(425, 235)">
      <g transform="translate(-140, -10) scale(1.3)"><use href="#sticker-star"/></g>
      <g transform="translate(-40, -35) scale(1.6)"><use href="#sticker-star"/></g>
      <g transform="translate(65, -10) scale(1.3)"><use href="#sticker-star"/></g>
    </g>

    <!-- BẢNG ĐIỂM GHI TAY BẰNG BÚT BI XANH & ĐỎ -->
    <g transform="translate(115, 380)">
      <!-- Dòng 1 -->
      <text x="0" y="40" font-family="sans-serif" font-size="24" font-weight="700" fill="#4B6A82">Thời gian giải mã:</text>
      <text x="640" y="40" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#224C6D">00:48s</text>

      <!-- Dòng 2 -->
      <text x="0" y="110" font-family="sans-serif" font-size="24" font-weight="700" fill="#4B6A82">Số bước sử dụng:</text>
      <text x="640" y="110" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#2E7D32">11 / 20 Bước (Dư 9)</text>

      <!-- Dòng 3 -->
      <text x="0" y="180" font-family="sans-serif" font-size="24" font-weight="700" fill="#4B6A82">Va chạm tường vô hình:</text>
      <text x="640" y="180" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#2E7D32">0 lần (Hoàn hảo)</text>

      <!-- Dòng Tổng Điểm Gạch Chân -->
      <line x1="0" y1="220" x2="640" y2="220" stroke="#3D83AE" stroke-width="2"/>
      <text x="0" y="275" font-family="sans-serif" font-size="28" font-weight="800" fill="#224C6D">TỔNG ĐIỂM:</text>
      <text x="640" y="275" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#D84444">+2,850 PTS</text>
    </g>

    <!-- CÁC NÚT DẠNG NHÃN DÁN / STICKER TICKET Ở CHÂN MẢNH GIẤY -->
    <g transform="translate(115, 870)">
      <!-- Nút Chơi lại (Giấy trắng ngà kẹp viền) -->
      <g transform="translate(0, 0)" style="cursor: pointer;">
        <rect width="180" height="96" rx="16" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
        <path d="M98 38 A 15 15 0 1 0 102 54" fill="none" stroke="#3D83AE" stroke-width="3" stroke-linecap="round"/>
        <polyline points="92,34 102,37 98,47" fill="none" stroke="#3D83AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="90" y="74" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#718B9E">CHƠI LẠI</text>
      </g>

      <!-- Nút Màn chơi kế tiếp (Miếng giấy dán màu mực xanh nổi bật) -->
      <g transform="translate(215, 0)" style="cursor: pointer;">
        <rect width="425" height="96" rx="18" fill="#3D83AE" stroke="#256286" stroke-width="3.5"/>
        <line x1="32" y1="0" x2="32" y2="96" stroke="#FAF5EB" stroke-width="2.5" opacity="0.6"/>
        <text x="240" y="58" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="1">MÀN KẾ TIẾP ›</text>
      </g>
    </g>

    <text x="425" y="1035" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" font-weight="600" fill="#718B9E">
      ~ Ghi chú: Đường đi không phạm bất kỳ tường cấm nào ~
    </text>
  </g>
</svg>