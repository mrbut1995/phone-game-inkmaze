<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Lưới vở nền mờ phía dưới -->
    <pattern id="bgGridSettings" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <!-- Đổ bóng tự nhiên cho mảnh giấy cài đặt -->
    <filter id="settingsPaperShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2D2115" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2D2115" flood-opacity="0.10"/>
    </filter>

    <!-- Đổ bóng nút trượt Slider Thumb -->
    <filter id="thumbShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ================= 1. NỀN VỞ GAME ĐANG CHƠI PHÍA DƯỚI ================= -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGridSettings)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <!-- Lớp phủ bóng râm mờ tự nhiên (Dim Backdrop) -->
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.35"/>

  <!-- ================= 2. MẢNH GIẤY GHI CHÉP CÀI ĐẶT (850 x 1120 px) ================= -->
  <!-- Đặt tại x=115, y=390 -->
  <g transform="translate(115, 390)">

    <!-- TỜ GIẤY TRẮNG NGÀ CÓ BÓNG NỔI -->
    <g filter="url(#settingsPaperShadow)">
      <rect width="850" height="1120" rx="18" fill="#FFFDF9"/>

      <!-- Hàng lỗ bấm ghim mép trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="24" cy="80" r="7"/><circle cx="24" cy="180" r="7"/><circle cx="24" cy="280" r="7"/>
        <circle cx="24" cy="380" r="7"/><circle cx="24" cy="480" r="7"/><circle cx="24" cy="580" r="7"/>
        <circle cx="24" cy="680" r="7"/><circle cx="24" cy="780" r="7"/><circle cx="24" cy="880" r="7"/>
        <circle cx="24" cy="980" r="7"/><circle cx="24" cy="1080" r="7"/>
      </g>

      <!-- Dòng kẻ ngang mờ của trang giấy -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.32">
        <line x1="60" y1="180" x2="790" y2="180"/><line x1="60" y1="260" x2="790" y2="260"/>
        <line x1="60" y1="340" x2="790" y2="340"/><line x1="60" y1="420" x2="790" y2="420"/>
        <line x1="60" y1="500" x2="790" y2="500"/><line x1="60" y1="580" x2="790" y2="580"/>
        <line x1="60" y1="660" x2="790" y2="660"/><line x1="60" y1="740" x2="790" y2="740"/>
        <line x1="60" y1="820" x2="790" y2="820"/>
      </g>

      <!-- Đường lề đỏ vở học sinh -->
      <line x1="75" y1="0" x2="75" y2="1120" stroke="#D84444" stroke-width="2.5" opacity="0.85"/>
      <!-- Viền mực xanh bao quanh mảnh giấy -->
      <rect width="850" height="1120" rx="18" fill="none" stroke="#6EA0C8" stroke-width="3"/>
    </g>

    <!-- DẢI BĂNG DÍNH WASHI TAPE DÁN TRÊN ĐỈNH -->
    <g transform="translate(315, -22)">
      <rect width="220" height="48" rx="4" fill="#E8DFCA" fill-opacity="0.85" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" 
            stroke="#B5A98F" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- TIÊU ĐỀ POPUP (BÚT MỰC ĐẬM) -->
    <g transform="translate(115, 80)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="#224C6D">TẠM DỪNG VÁN CHƠI</text>
      <text x="0" y="34" font-family="sans-serif" font-size="20" font-weight="700" fill="#718B9E">Cài đặt âm thanh &amp; trải nghiệm</text>
    </g>

    <!-- DẤU MỘC TRÒN: "PAUSE ⏸" Ở GÓC PHẢI -->
    <g transform="translate(640, 60) rotate(8)">
      <circle cx="45" cy="45" r="42" fill="none" stroke="#3D83AE" stroke-width="2.5" stroke-dasharray="6 3"/>
      <circle cx="45" cy="45" r="36" fill="#3D83AE" fill-opacity="0.08"/>
      <!-- 2 vạch Pause -->
      <line x1="39" y1="32" x2="39" y2="58" stroke="#3D83AE" stroke-width="4" stroke-linecap="round"/>
      <line x1="51" y1="32" x2="51" y2="58" stroke="#3D83AE" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- VẠCH NGĂN HEADER -->
    <line x1="115" y1="150" x2="740" y2="150" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- ================= 3. PHẦN CÀI ĐẶT ÂM THANH (SLIDER BARS) ================= -->
    <g transform="translate(115, 175)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="800" fill="#3D83AE" letter-spacing="1.5">ÂM THANH</text>

      <!-- MỤC 1: NHẠC NỀN (BGM) - SLIDER 70% -->
      <g transform="translate(0, 50)">
        <text x="0" y="24" font-family="sans-serif" font-size="22" font-weight="700" fill="#224C6D">🎵 Nhạc nền (BGM)</text>
        <!-- Thanh Slider Bar -->
        <g transform="translate(260, 16)">
          <!-- Rãnh nền 280px -->
          <rect width="280" height="10" rx="5" fill="#EAE4D5" stroke="#90BBD4" stroke-width="1"/>
          <!-- Vạch tiến trình 70% = 196px -->
          <rect width="196" height="10" rx="5" fill="#3D83AE"/>
          <!-- Con trượt Thumb tại x = 196 -->
          <g transform="translate(196, 5)" filter="url(#thumbShadow)" style="cursor: pointer;">
            <circle cx="0" cy="0" r="13" fill="#FAF5EB" stroke="#3D83AE" stroke-width="2.2"/>
            <circle cx="0" cy="0" r="3.5" fill="#D84444"/>
          </g>
        </g>
        <!-- Số phần trăm -->
        <text x="620" y="24" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#3D83AE">70%</text>
      </g>

      <!-- MỤC 2: HIỆU ỨNG ÂM THANH (SFX) - SLIDER 85% -->
      <g transform="translate(0, 125)">
        <text x="0" y="24" font-family="sans-serif" font-size="22" font-weight="700" fill="#224C6D">🔔 Hiệu ứng (SFX)</text>
        <g transform="translate(260, 16)">
          <rect width="280" height="10" rx="5" fill="#EAE4D5" stroke="#90BBD4" stroke-width="1"/>
          <!-- Vạch tiến trình 85% = 238px -->
          <rect width="238" height="10" rx="5" fill="#3D83AE"/>
          <g transform="translate(238, 5)" filter="url(#thumbShadow)" style="cursor: pointer;">
            <circle cx="0" cy="0" r="13" fill="#FAF5EB" stroke="#3D83AE" stroke-width="2.2"/>
            <circle cx="0" cy="0" r="3.5" fill="#D84444"/>
          </g>
        </g>
        <text x="620" y="24" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#3D83AE">85%</text>
      </g>
    </g>

    <!-- VẠCH NGĂN PHÂN ĐOẠN -->
    <line x1="115" y1="380" x2="740" y2="380" stroke="#8FB9D2" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- ================= 4. PHẦN TÙY CHỌN TRẢI NGHIỆM (CHECKBOXES) ================= -->
    <g transform="translate(115, 405)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="800" fill="#3D83AE" letter-spacing="1.5">TÙY CHỌN BÀN CỜ</text>

      <!-- MỤC 3: RUNG PHẢN HỒI (CHECKBOX CHECKED) -->
      <g transform="translate(0, 48)" style="cursor: pointer;">
        <!-- Checkbox Checked có dấu tick đỏ -->
        <rect width="36" height="36" rx="8" fill="#FAF5EB" stroke="#3D83AE" stroke-width="2.2"/>
        <path d="M 8 18 L 15 25 L 28 10" fill="none" stroke="#D84444" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="26" font-family="sans-serif" font-size="22" font-weight="700" fill="#224C6D">Rung khi đâm tường (Haptic feedback)</text>
      </g>

      <!-- MỤC 4: GỢI Ý CẠNH AN TOÀN (CHECKBOX EMPTY) -->
      <g transform="translate(0, 110)" style="cursor: pointer;">
        <!-- Checkbox Empty chưa tích -->
        <rect width="36" height="36" rx="8" fill="#FAF5EB" stroke="#3D83AE" stroke-width="2.2"/>
        <text x="52" y="26" font-family="sans-serif" font-size="22" font-weight="700" fill="#224C6D">Tự động đánh dấu cạnh an toàn</text>
      </g>
    </g>

    <!-- ================= 5. HỘP STICKER TÓM TẮT TRẠNG THÁI VÁN CHƠI ================= -->
    <!-- Dạng một mẩu giấy ghi chú vàng nhạt kẹp trên phiếu -->
    <g transform="translate(115, 590)">
      <rect width="630" height="115" rx="14" fill="#FEF9E7" stroke="#F59E0B" stroke-width="2"/>
      <rect x="25" y="-8" width="45" height="18" fill="#E6DFCC" opacity="0.8"/>

      <g transform="translate(30, 42)">
        <text x="0" y="0" font-family="sans-serif" font-size="16" font-weight="700" fill="#B45309">TIẾN ĐỘ HIỆN TẠI</text>
        <text x="0" y="38" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#92400E">TẦNG 04 • DUNGEON</text>
      </g>
      <g transform="translate(360, 42)">
        <text x="0" y="0" font-family="sans-serif" font-size="16" font-weight="700" fill="#B45309">BƯỚC CÒN LẠI</text>
        <text x="0" y="38" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#D84444">14 / 20 👣</text>
      </g>
    </g>

    <!-- ================= 6. CỤM NÚT ĐIỀU KHIỂN DẠNG THẺ GIẤY ================= -->
    <g transform="translate(115, 750)">
      <!-- NÚT CHÍNH: TIẾP TỤC CHƠI (PRIMARY BUTTON) -->
      <g transform="translate(0, 0)" style="cursor: pointer;">
        <rect width="630" height="96" rx="18" fill="#3D83AE" stroke="#256286" stroke-width="3.5"/>
        <line x1="32" y1="0" x2="32" y2="96" stroke="#FAF5EB" stroke-width="2.5" opacity="0.6"/>
        <!-- Icon Play tam giác -->
        <polygon points="75,34 75,62 98,48" fill="#FAF5EB"/>
        <text x="345" y="58" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">TIẾP TỤC CHƠI</text>
      </g>

      <!-- CẶP NÚT PHỤ Ở DƯỚI (SECONDARY BUTTONS) -->
      <g transform="translate(0, 120)">
        <!-- Nút Chơi lại (Restart) -->
        <g transform="translate(0, 0)" style="cursor: pointer;">
          <rect width="300" height="88" rx="16" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
          <path d="M85 34 A 14 14 0 1 0 88 48" fill="none" stroke="#3D83AE" stroke-width="3" stroke-linecap="round"/>
          <polyline points="80,30 88,33 85,42" fill="none" stroke="#3D83AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="175" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#224C6D">CHƠI LẠI</text>
        </g>

        <!-- Nút Về Menu (Quit) -->
        <g transform="translate(330, 0)" style="cursor: pointer;">
          <rect width="300" height="88" rx="16" fill="#FEFDFA" stroke="#BAC7CF" stroke-width="2.5"/>
          <!-- Icon ngôi nhà tối giản -->
          <path d="M75 54 L75 42 L88 30 L101 42 L101 54 Z" fill="none" stroke="#718B9E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="175" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#718B9E">VỀ MENU</text>
        </g>
      </g>
    </g>

    <!-- Dòng chữ nhỏ dưới đáy mảnh giấy -->
    <text x="425" y="1055" text-anchor="middle" font-family="sans-serif" font-size="17" font-style="italic" fill="#718B9E">
      ~ Trò chơi đang được tạm dừng • Chúc bạn giải mã thành công ~
    </text>
  </g>
</svg>