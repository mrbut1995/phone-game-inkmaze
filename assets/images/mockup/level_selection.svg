    <text x="60" y="52" font-family="sans-serif" font-size="26" font-weight="800" fill="#244E6E">CHƯƠNG 1: BÀN CỜ NHẬP MÔN (7×7)</text>
    <text x="920" y="52" text-anchor="end" font-family="sans-serif" font-size="22" font-weight="700" fill="#3D83AE">ĐỔI CHƯƠNG ›</text>

