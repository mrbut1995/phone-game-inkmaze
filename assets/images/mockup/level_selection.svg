    <g transform="translate(18, 12) scale(0.95)"><use href="#star-full"/></g>
    <text x="125" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#224C6D">28<tspan font-size="20" fill="#718B9E">/45</tspan></text>
  </g>

  <!-- ================= 4. KHUNG THÔNG TIN CHƯƠNG (CHAPTER BANNER) ================= -->
  <g transform="translate(55, 195)" filter="url(#uiShadow)">
    <rect width="970" height="140" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <!-- Lề đỏ -->
    <line x1="36" y1="0" x2="36" y2="140" stroke="#D84444" stroke-width="3"/>

