    <g transform="translate(60, 80)">
      <!-- Rãnh Bar -->
      <rect width="760" height="14" rx="7" fill="#EAE4D5" stroke="#90BBD4" stroke-width="1.2"/>
      <!-- Progressing line (65% = 494px) -->
      <rect width="494" height="14" rx="7" fill="#3D83AE"/>
      <!-- Tỉ lệ hoàn thành -->
      <text x="830" y="14" font-family="sans-serif" font-size="22" font-weight="800" fill="#3D83AE">65%</text>
    </g>
  </g>

