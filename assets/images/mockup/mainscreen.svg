<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- 1. Lưới vở học sinh nền 40px -->
    <pattern id="mainNotebookGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.55"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.18"/>
    </pattern>

    <!-- 2. Đổ bóng tự nhiên của mảnh giấy lớn trên bàn -->
    <filter id="mainSheetShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#2D2115" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2D2115" flood-opacity="0.10"/>
    </filter>

    <!-- Đổ bóng thẻ dán bên trong -->
    <filter id="stickerShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.12"/>
    </filter>

    <!-- Đổ bóng kim loại cho ghim kẹp giấy -->
    <filter id="clipShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.25"/>
    </filter>

    <!-- Hào quang phát sáng cho đường nối logo -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#2575A7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ================= 1. NỀN VỞ Ô LY HỌC SINH ================= -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#mainNotebookGrid)"/>
  <!-- Lề đỏ vở học trò -->
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>

  <!-- Nét vẽ nháp bằng bút chì xung quanh tờ giấy (Doodles) -->
  <!-- Dưới trái: Sơ đồ nháp 3x3 -->
  <g transform="translate(15, 1680)" opacity="0.4" stroke="#7A8F9B" stroke-width="2" fill="none">
    <rect width="70" height="70"/>
    <text x="35" y="45" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#7A8F9B" stroke="none">?</text>
  </g>

  <!-- Trên phải: Mũi tên bút chì nháp -->
  <g transform="translate(970, 110)" opacity="0.45" stroke="#7A8F9B" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 0 40 Q 30 10 60 20"/>
    <polyline points="45,15 60,20 55,35"/>
  </g>

  <!-- ================= 2. STATUS BAR ANDROID ================= -->
  <g fill="#3D5A73" font-family="-apple-system, sans-serif" font-size="28" font-weight="600">
    <text x="60" y="55">09:41</text>
    <g transform="translate(940, 34)" stroke="#3D5A73" stroke-width="3" fill="none">
      <path d="M0 16 A 16 16 0 0 1 24 16" stroke-linecap="round"/>
      <circle cx="12" cy="24" r="2" fill="#3D5A73"/>
    </g>
    <rect x="980" y="36" width="44" height="22" rx="5" fill="none" stroke="#3D5A73" stroke-width="3"/>
    <rect x="984" y="40" width="28" height="14" rx="2" fill="#3D5A73"/>
  </g>

  <!-- ================= 3. MẢNH GIẤY MENU CHÍNH (880 x 1560 px) ================= -->
  <!-- Đặt tại x=100, y=160 -->
  <g transform="translate(100, 160)">

    <!-- THÂN TỜ GIẤY CÓ BÓNG NỔI TỰ NHIÊN -->
    <g filter="url(#mainSheetShadow)">
      <rect width="880" height="1560" rx="22" fill="#FFFDF8"/>

      <!-- Hàng lỗ bấm ghim sổ tay mép trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="26" cy="100" r="8"/><circle cx="26" cy="220" r="8"/><circle cx="26" cy="340" r="8"/>
        <circle cx="26" cy="460" r="8"/><circle cx="26" cy="580" r="8"/><circle cx="26" cy="700" r="8"/>
        <circle cx="26" cy="820" r="8"/><circle cx="26" cy="940" r="8"/><circle cx="26" cy="1060" r="8"/>
        <circle cx="26" cy="1180" r="8"/><circle cx="26" cy="1300" r="8"/><circle cx="26" cy="1420" r="8"/>
      </g>

      <!-- Các dòng kẻ ngang mờ của sổ -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.32">
        <line x1="65" y1="180" x2="815" y2="180"/><line x1="65" y1="260" x2="815" y2="260"/>
        <line x1="65" y1="340" x2="815" y2="340"/><line x1="65" y1="420" x2="815" y2="420"/>
        <line x1="65" y1="500" x2="815" y2="500"/><line x1="65" y1="580" x2="815" y2="580"/>
        <line x1="65" y1="660" x2="815" y2="660"/><line x1="65" y1="740" x2="815" y2="740"/>
        <line x1="65" y1="820" x2="815" y2="820"/><line x1="65" y1="900" x2="815" y2="900"/>
        <line x1="65" y1="980" x2="815" y2="980"/><line x1="65" y1="1060" x2="815" y2="1060"/>
        <line x1="65" y1="1140" x2="815" y2="1140"/><line x1="65" y1="1220" x2="815" y2="1220"/>
        <line x1="65" y1="1300" x2="815" y2="1300"/><line x1="65" y1="1380" x2="815" y2="1380"/>
        <line x1="65" y1="1460" x2="815" y2="1460"/>
      </g>

      <!-- Lề đỏ của mảnh giấy -->
      <line x1="80" y1="0" x2="80" y2="1560" stroke="#D84444" stroke-width="2.5" opacity="0.85"/>
      <!-- Viền mực xanh bao quanh -->
      <rect width="880" height="1560" rx="22" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    </g>

    <!-- DẢI BĂNG DÍNH WASHI TAPE TRÊN ĐỈNH GIỮA -->
    <g transform="translate(330, -22)">
      <rect width="220" height="48" rx="4" fill="#E8DFCA" fill-opacity="0.85" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" 
            stroke="#B5A98F" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- GHIM KẸP GIẤY KIM LOẠI Ở GÓC TRÊN TRÁI -->
    <g transform="translate(110, -18)" filter="url(#clipShadow)">
      <path d="M 0 50 L 0 12 A 12 12 0 0 1 24 12 L 24 60 A 18 18 0 0 1 -12 60 L -12 18" 
            fill="none" stroke="#7A8F9B" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- ================= 4. KHU VỰC LOGO GAME (HEADER) ================= -->
    <g transform="translate(440, 85)" text-anchor="middle">
      <!-- Nhãn thể loại -->
            <!-- Phác thảo Doodle Mê Cung 3x3 Mini -->
      <g transform="translate(-60, -40)" stroke="#3D83AE" stroke-linecap="round">
        <rect x="0" y="0" width="120" height="120" rx="14" fill="#F4F8FA" stroke-width="3"/>
        <line x1="40" y1="0" x2="40" y2="120" stroke-width="1.5" opacity="0.5"/>
        <line x1="80" y1="0" x2="80" y2="120" stroke-width="1.5" opacity="0.5"/>
        <line x1="0" y1="40" x2="120" y2="40" stroke-width="1.5" opacity="0.5"/>
        <line x1="0" y1="80" x2="120" y2="80" stroke-width="1.5" opacity="0.5"/>
        
        <!-- Đường vẽ nối từ S lên F -->
        <path d="M 20 100 L 20 60 L 60 60 L 60 20 L 100 20" fill="none" stroke="#2575A7" stroke-width="6" stroke-linejoin="round"/>
        <text x="20" y="16" font-family="sans-serif" font-size="16" font-weight="900" fill="#2E7D32" stroke="none">S</text>
        <text x="100" y="26" font-family="sans-serif" font-size="16" font-weight="900" fill="#D97706" stroke="none">F</text>
      </g>

      <rect x="-140" y="90" width="280" height="34" rx="8" fill="#F4EFE6" stroke="#D1E2ED" stroke-width="1.5"/>
      <text y="114" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#3D83AE" letter-spacing="3">LOGIC &amp; PUZZLE</text>

      <!-- TÊN GAME: NUMBER MAZE VIẾT TAY ĐẬM ĐÀ -->
      <text y="182" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="950" fill="#224C6D" letter-spacing="2">NUMBER MAZE</text>
      <text y="228" font-family="sans-serif" font-size="20" font-weight="700" fill="#718B9E">Mê Cung Suy Luận • Vở Ô Ly</text>

      <!-- Sơ đồ minh họa mini: [S] ➔ [2] ➔ [F] -->
      <!-- <g transform="translate(-160, 155)"> -->
        <!-- Đường nối phát sáng -->
        <!-- <line x1="35" y1="35" x2="285" y2="35" stroke="#2575A7" stroke-width="8" stroke-linecap="round" filter="url(#logoGlow)"/> -->
        <!-- <line x1="35" y1="35" x2="285" y2="35" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/> -->

        <!-- Ô S (Start) -->
        <!-- <g transform="translate(0, 0)"> -->
          <!-- <rect width="70" height="70" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/> -->
          <!-- <text x="35" y="47" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#2E7D32">S</text> -->
        <!-- </g> -->
        <!-- Ô Số 2 (Manh mối tường) -->
        <!-- <g transform="translate(125, 0)"> -->
          <!-- <rect width="70" height="70" rx="14" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/> -->
          <!-- <text x="35" y="47" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#224C6D">2</text> -->
        <!-- </g> -->
        <!-- Ô F (Finish) -->
        <!-- <g transform="translate(250, 0)"> -->
          <!-- <rect width="70" height="70" rx="14" fill="#FFF8E1" stroke="#F59E0B" stroke-width="3"/> -->
          <!-- <text x="35" y="47" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#D97706">F</text> -->
        <!-- </g> -->
      <!-- </g> -->
    </g>

    <!-- Đường phân cách Header đôi -->
    <line x1="100" y1="340" x2="780" y2="340" stroke="#3D83AE" stroke-width="2"/>
    <line x1="100" y1="345" x2="780" y2="345" stroke="#8FB9D2" stroke-width="1"/>

    <!-- ================= 5. CỤM 3 THẺ CHỌN CHẾ ĐỘ CHƠI (MODE SELECTION) ================= -->

    <!-- CHẾ ĐỘ 1: DUNGEON MODE (CHẾ ĐỘ CHÍNH - ENDLESS) -->
    <g transform="translate(100, 380)" filter="url(#stickerShadow)" style="cursor: pointer;">
      <!-- Thẻ dán màu mực xanh đậm nổi bật nhất -->
      <rect width="680" height="230" rx="24" fill="#3D83AE" stroke="#235A7D" stroke-width="4"/>
      <!-- Lề sáng tạo vân giấy vở -->
      <line x1="38" y1="0" x2="38" y2="230" stroke="#FAF5EB" stroke-width="3" opacity="0.65"/>

      <!-- Nhãn "CHẾ ĐỘ CỐT LÕI" -->
      <rect x="55" y="22" width="165" height="32" rx="8" fill="#FBBF24"/>
      <text x="137" y="44" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#78350F" letter-spacing="1">CHẾ ĐỘ CHÍNH</text>

      <!-- Icon Lâu đài / Tháp ngục -->
      <g transform="translate(60, 80)">
        <circle cx="45" cy="45" r="42" fill="#256286"/>
        <text x="45" y="58" text-anchor="middle" font-size="44">🏰</text>
      </g>

      <!-- Tiêu đề & Mô tả từ GDD -->
      <text x="175" y="105" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="950" fill="#FFFFFF" letter-spacing="1">DUNGEON MODE</text>
      <text x="175" y="142" font-family="sans-serif" font-size="20" font-weight="600" fill="#BAE6FD">Vượt tầng vô tận • Tường ẩn tăng dần</text>
      <text x="175" y="172" font-family="sans-serif" font-size="18" font-weight="600" fill="#BAE6FD">Bảo toàn số bước để tiến sâu nhất</text>

      <!-- Huy hiệu kỷ lục cá nhân góc phải -->
      <g transform="translate(485, 172)">
        <rect width="165" height="36" rx="10" fill="#20506E"/>
        <text x="82" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#FDE68A">KỶ LỤC: TẦNG 18</text>
      </g>

      <!-- Mũi tên điều hướng sang phải -->
      <path d="M 625 115 L 640 115 M 633 105 L 643 115 L 633 125" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- CHẾ ĐỘ 2: CLASSIC MAZE (MÊ CUNG CỔ ĐIỂN - 1 TẦNG THUA NGAY) -->
    <g transform="translate(100, 640)" filter="url(#stickerShadow)" style="cursor: pointer;">
      <rect width="680" height="210" rx="24" fill="#FEFDFA" stroke="#F59E0B" stroke-width="3.5"/>
      <line x1="38" y1="0" x2="38" y2="210" stroke="#F59E0B" stroke-width="3"/>

      <!-- Nhãn "THỬ THÁCH TỐC ĐỘ" -->
      <rect x="55" y="20" width="165" height="30" rx="8" fill="#FEF3C7"/>
      <text x="137" y="41" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#B45309" letter-spacing="1">THỬ THÁCH TỐC ĐỘ</text>

      <!-- Icon Tia chớp -->
      <g transform="translate(60, 75)">
        <circle cx="45" cy="45" r="42" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
        <text x="45" y="58" text-anchor="middle" font-size="44">⚡</text>
      </g>

      <text x="175" y="98" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#224C6D">CLASSIC MAZE</text>
      <text x="175" y="132" font-family="sans-serif" font-size="20" font-weight="600" fill="#718B9E">1 Tầng duy nhất • Đâm tường = Thua ngay</text>
      <text x="175" y="162" font-family="sans-serif" font-size="18" font-weight="600" fill="#9CA3AF">Đua thời gian giải nhanh nhất</text>

      <!-- Huy hiệu thành tích thời gian -->
      <g transform="translate(485, 152)">
        <rect width="165" height="36" rx="10" fill="#FEF3C7"/>
        <text x="82" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#D97706">NHANH NHẤT: 32s</text>
      </g>

      <path d="M 625 105 L 640 105 M 633 95 L 643 105 L 633 115" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- CHẾ ĐỘ 3: DAILY CHALLENGE (THỬ THÁCH HẰNG NGÀY) -->
    <g transform="translate(100, 880)" filter="url(#stickerShadow)" style="cursor: pointer;">
      <rect width="680" height="210" rx="24" fill="#FEFDFA" stroke="#D84444" stroke-width="3.5"/>
      <line x1="38" y1="0" x2="38" y2="210" stroke="#D84444" stroke-width="3"/>

      <!-- Nhãn "MỖI NGÀY 1 CÂU ĐỐ" -->
      <rect x="55" y="20" width="165" height="30" rx="8" fill="#FEE2E2"/>
      <text x="137" y="41" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#B91C1C" letter-spacing="1">MỖI NGÀY 1 CÂU ĐỐ</text>

      <!-- Icon Lịch ngày -->
      <g transform="translate(60, 75)">
        <circle cx="45" cy="45" r="42" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
        <text x="45" y="58" text-anchor="middle" font-size="44">📅</text>
      </g>

      <text x="175" y="98" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#224C6D">DAILY CHALLENGE</text>
      <text x="175" y="132" font-family="sans-serif" font-size="20" font-weight="600" fill="#718B9E">Thử thách theo ngày • Bàn cờ đặc biệt</text>
      <text x="175" y="162" font-family="sans-serif" font-size="18" font-weight="600" fill="#9CA3AF">Tích lũy sao &amp; duy trì chuỗi Streak</text>

      <!-- Huy hiệu Streak -->
      <g transform="translate(485, 152)">
        <rect width="165" height="36" rx="10" fill="#FEE2E2"/>
        <text x="82" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#D84444">🔥 STREAK: 7 NGÀY</text>
      </g>

      <path d="M 625 105 L 640 105 M 633 95 L 643 105 L 633 115" stroke="#D84444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Đường phân cách Footer -->
    <line x1="100" y1="1130" x2="780" y2="1130" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- ================= 6. CỤM 3 NÚT CÔNG CỤ PHỤ (TIỆN ÍCH DẠNG THẺ GIẤY) ================= -->
    <g transform="translate(100, 1170)">
      <!-- Nút 1: BẢNG XẾP HẠNG -->
      <g transform="translate(0, 0)" style="cursor: pointer;">
        <rect width="210" height="110" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
        <text x="105" y="52" text-anchor="middle" font-size="32">🏆</text>
        <text x="105" y="88" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#224C6D">XẾP HẠNG</text>
      </g>

      <!-- Nút 2: LUẬT CHƠI / HƯỚNG DẪN -->
      <g transform="translate(235, 0)" style="cursor: pointer;">
        <rect width="210" height="110" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
        <text x="105" y="52" text-anchor="middle" font-size="32">📖</text>
        <text x="105" y="88" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#224C6D">LUẬT CHƠI</text>
      </g>

      <!-- Nút 3: CÀI ĐẶT -->
      <g transform="translate(470, 0)" style="cursor: pointer;">
        <rect width="210" height="110" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
        <text x="105" y="52" text-anchor="middle" font-size="32">⚙️</text>
        <text x="105" y="88" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#224C6D">CÀI ĐẶT</text>
      </g>
    </g>

    <!-- DÒNG ĐỀ TỰA CUỐI TỜ GIẤY -->
    <text x="440" y="1370" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" font-weight="600" fill="#718B9E">
      ~ Mỗi con số là một manh mối • Vạch lối thoát an toàn ~
    </text>

    <!-- Con dấu mực đỏ đóng ở góc dưới phải -->
    <g transform="translate(680, 1400) rotate(-10)" opacity="0.85">
      <rect width="130" height="42" rx="8" fill="none" stroke="#D84444" stroke-width="2.5" stroke-dasharray="6 3"/>
      <text x="65" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#D84444">VER 1.0.0</text>
    </g>
  </g>

  <!-- ================= 7. ANDROID HOME GESTURE BAR ================= -->
  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>