<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1640" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF5EB; }
      .line-minor { stroke: #8FB9D2; stroke-width: 1.2; stroke-linecap: square; }
      .line-major { stroke: #3D83AE; stroke-width: 2.2; stroke-linecap: square; }
      .line-red   { stroke: #D84444; stroke-width: 2.6; stroke-linecap: square; }
    </style>
  </defs>

  <!-- Nền giấy màu kem -->
  <rect width="920" height="1640" class="bg" />

  <!-- CÁC ĐƯỜNG KẺ NGANG (y: 0 -> 41 ô, mỗi ô 40px) -->
  <g>
    <!-- Nhóm 1 (y: 1 đến 4 mỏng, 5 đậm) -->
    <line x1="0" y1="40" x2="920" y2="40" class="line-minor" />
    <line x1="0" y1="80" x2="920" y2="80" class="line-minor" />
    <line x1="0" y1="120" x2="920" y2="120" class="line-minor" />
    <line x1="0" y1="160" x2="920" y2="160" class="line-minor" />
    <line x1="0" y1="200" x2="920" y2="200" class="line-major" />

    <!-- Nhóm 2 -->
    <line x1="0" y1="240" x2="920" y2="240" class="line-minor" />
    <line x1="0" y1="280" x2="920" y2="280" class="line-minor" />
    <line x1="0" y1="320" x2="920" y2="320" class="line-minor" />
    <line x1="0" y1="360" x2="920" y2="360" class="line-minor" />
    <line x1="0" y1="400" x2="920" y2="400" class="line-major" />

    <!-- Nhóm 3 -->
    <line x1="0" y1="440" x2="920" y2="440" class="line-minor" />
    <line x1="0" y1="480" x2="920" y2="480" class="line-minor" />
    <line x1="0" y1="520" x2="920" y2="520" class="line-minor" />
    <line x1="0" y1="560" x2="920" y2="560" class="line-minor" />
    <line x1="0" y1="600" x2="920" y2="600" class="line-major" />

    <!-- Nhóm 4 -->
    <line x1="0" y1="640" x2="920" y2="640" class="line-minor" />
    <line x1="0" y1="680" x2="920" y2="680" class="line-minor" />
    <line x1="0" y1="720" x2="920" y2="720" class="line-minor" />
    <line x1="0" y1="760" x2="920" y2="760" class="line-minor" />
    <line x1="0" y1="800" x2="920" y2="800" class="line-major" />

    <!-- Nhóm 5 -->
    <line x1="0" y1="840" x2="920" y2="840" class="line-minor" />
    <line x1="0" y1="880" x2="920" y2="880" class="line-minor" />
    <line x1="0" y1="920" x2="920" y2="920" class="line-minor" />
    <line x1="0" y1="960" x2="920" y2="960" class="line-minor" />
    <line x1="0" y1="1000" x2="920" y2="1000" class="line-major" />

    <!-- Nhóm 6 -->
    <line x1="0" y1="1040" x2="920" y2="1040" class="line-minor" />
    <line x1="0" y1="1080" x2="920" y2="1080" class="line-minor" />
    <line x1="0" y1="1120" x2="920" y2="1120" class="line-minor" />
    <line x1="0" y1="1160" x2="920" y2="1160" class="line-minor" />
    <line x1="0" y1="1200" x2="920" y2="1200" class="line-major" />

    <!-- Nhóm 7 -->
    <line x1="0" y1="1240" x2="920" y2="1240" class="line-minor" />
    <line x1="0" y1="1280" x2="920" y2="1280" class="line-minor" />
    <line x1="0" y1="1320" x2="920" y2="1320" class="line-minor" />
    <line x1="0" y1="1360" x2="920" y2="1360" class="line-minor" />
    <line x1="0" y1="1400" x2="920" y2="1400" class="line-major" />

    <!-- Nhóm 8 -->
    <line x1="0" y1="1440" x2="920" y2="1440" class="line-minor" />
    <line x1="0" y1="1480" x2="920" y2="1480" class="line-minor" />
    <line x1="0" y1="1520" x2="920" y2="1520" class="line-minor" />
    <line x1="0" y1="1560" x2="920" y2="1560" class="line-minor" />
    <line x1="0" y1="1600" x2="920" y2="1600" class="line-major" />
  </g>

  <!-- CÁC ĐƯỜNG KẺ DỌC (x: 0 -> 23 ô, mỗi ô 40px) -->
  <g>
    <!-- Ô 1 mỏng -->
    <line x1="40" y1="0" x2="40" y2="1640" class="line-minor" />

    <!-- Ô 3 đến 5 mỏng -->
    <line x1="120" y1="0" x2="120" y2="1640" class="line-minor" />
    <line x1="160" y1="0" x2="160" y2="1640" class="line-minor" />
    <line x1="200" y1="0" x2="200" y2="1640" class="line-minor" />
    <!-- Vạch đậm 1 (x = 6) -->
    <line x1="240" y1="0" x2="240" y2="1640" class="line-major" />

    <!-- Vạch mỏng 7 đến 10 -->
    <line x1="280" y1="0" x2="280" y2="1640" class="line-minor" />
    <line x1="320" y1="0" x2="320" y2="1640" class="line-minor" />
    <line x1="360" y1="0" x2="360" y2="1640" class="line-minor" />
    <line x1="400" y1="0" x2="400" y2="1640" class="line-minor" />
    <!-- Vạch đậm 2 (x = 11) -->
    <line x1="440" y1="0" x2="440" y2="1640" class="line-major" />

    <!-- Vạch mỏng 12 đến 15 -->
    <line x1="480" y1="0" x2="480" y2="1640" class="line-minor" />
    <line x1="520" y1="0" x2="520" y2="1640" class="line-minor" />
    <line x1="560" y1="0" x2="560" y2="1640" class="line-minor" />
    <line x1="600" y1="0" x2="600" y2="1640" class="line-minor" />
    <!-- Vạch đậm 3 (x = 16) -->
    <line x1="640" y1="0" x2="640" y2="1640" class="line-major" />

    <!-- Vạch mỏng 17 đến 20 -->
    <line x1="680" y1="0" x2="680" y2="1640" class="line-minor" />
    <line x1="720" y1="0" x2="720" y2="1640" class="line-minor" />
    <line x1="760" y1="0" x2="760" y2="1640" class="line-minor" />
    <line x1="800" y1="0" x2="800" y2="1640" class="line-minor" />
    <!-- Vạch đậm 4 (x = 21) -->
    <line x1="840" y1="0" x2="840" y2="1640" class="line-major" />

    <!-- Vạch mỏng 22 -->
    <line x1="880" y1="0" x2="880" y2="1640" class="line-minor" />

    <!-- ĐƯỜNG LỀ ĐỎ (ở vị trí x = 2, cách lề trái 80px) -->
    <line x1="80" y1="0" x2="80" y2="1640" class="line-red" />
  </g>
</svg>