<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch màu dusty lavender tối -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#6A5A82"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#8B7CA8"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#796B96"/>

  <!-- Confetti mờ ở các góc -->
  <circle cx="30" cy="30" r="3" fill="#FDD158" opacity="0.5"/>
  <rect x="142" y="30" width="5" height="5" fill="#FF6E97" opacity="0.5" transform="rotate(30 142 30)"/>
  <circle cx="32" cy="144" r="3.5" fill="#48CDE0" opacity="0.5"/>
  <polygon points="144,142 147,148 141,148" fill="#D2BCFD" opacity="0.5"/>

  <!-- Ruy băng chéo xoăn màu Hồng và Teal -->
  <line x1="24" y1="24" x2="152" y2="152" stroke="#FF6E97" stroke-width="12" stroke-linecap="round"/>
  <line x1="152" y1="24" x2="24" y2="152" stroke="#48CDE0" stroke-width="12" stroke-linecap="round"/>

  <!-- Bóng tròn sau ổ khóa -->
  <circle cx="88" cy="94" r="32" fill="#32174E" opacity="0.45"/>

  <!-- Ổ khóa Teal chunky đè lên trên ruy băng -->
  <g transform="translate(88 88)">
    <!-- Quai khóa màu lavender #D2BCFD -->
    <path d="M-18 -8 V-24 A18 18 0 0 1 18 -24 V-8" fill="none" stroke="#D2BCFD" stroke-width="9" stroke-linecap="round"/>
    <!-- Thân khóa Teal #48CDE0 -->
    <rect x="-28" y="-8" width="56" height="46" rx="9" fill="#48CDE0"/>
    <!-- Băng đáy tối màu #2A9AB0 -->
    <path d="M-28 17 Q-28 38 -9 38 L9 38 Q28 38 28 17 L28 12 L-28 12 Z" fill="#2A9AB0"/>
    <!-- Lỗ khóa hình ngôi sao vàng #FDD158 -->
    <polygon points="0,5 2.5,11 8.5,11 4,14.5 5.5,20.5 0,17 -5.5,20.5 -4,14.5 -8.5,11 -2.5,11" fill="#FDD158"/>
  </g>
</svg>