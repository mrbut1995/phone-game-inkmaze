<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505 508" width="505" height="508">
  <defs>
    <!-- Đổ bóng tím đậm mềm dưới khung -->
    <filter id="party-board-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1B092E" flood-opacity="0.6"/>
    </filter>
    <filter id="star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Bóng đổ toàn khung -->
  <g filter="url(#party-board-shadow)">
    <!-- Viền vàng mỏng (Gold rim #FDD158) -->
    <rect x="15" y="14" width="475" height="478" rx="26" fill="#FDD158"/>
    <!-- Thân khung màu tím #5B2E86 -->
    <rect x="17.5" y="16.5" width="470" height="473" rx="24" fill="#5B2E86"/>
    <!-- Gờ sáng trên đỉnh tạo độ dày khối giấy -->
    <path d="M42 16.5 Q17.5 16.5 17.5 41 L17.5 46 Q17.5 22 42 22 L463 22 Q487.5 22 487.5 46 L487.5 41 Q487.5 16.5 463 16.5 Z" fill="#753DAA"/>
  </g>

  <!-- LÒNG BÀN CỜ 5x5: Deep purple #32174E (~87% chiều rộng = 440x440) -->
  <rect x="32.5" y="38" width="440" height="440" rx="14" fill="#240F39"/>
  <rect x="32.5" y="38" width="440" height="440" rx="14" fill="#32174E"/>
  <!-- Vát bóng chìm phía trong -->
  <rect x="32.5" y="38" width="440" height="5" fill="#1B092E" opacity="0.6"/>

  <!-- Ngôi sao vàng lớn ở đỉnh giữa (Five-point star đổ bóng 2 nửa) -->
  <g filter="url(#star-glow)">
    <polygon points="252.5,9 256.5,21 269,21 259,28.5 263,40 252.5,32.5 242,40 246,28.5 236,21 248.5,21" fill="#E0B13D"/>
    <polygon points="252.5,9 256.5,21 269,21 259,28.5 263,40 252.5,32.5" fill="#FDD158"/>
  </g>

  <!-- Chùm bóng bay Pastel ở góc trên bên trái -->
  <g>
    <!-- Dây bóng uốn lượn -->
    <path d="M36 40 Q30 48 38 54 Q44 60 40 68" fill="none" stroke="#F5B7DD" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M50 36 Q56 46 48 52 Q44 58 52 66" fill="none" stroke="#D2BCFD" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Bóng Lavender -->
    <circle cx="48" cy="30" r="11" fill="#D2BCFD"/>
    <ellipse cx="45" cy="27" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 45 27)"/>
    <polygon points="46,40 50,40 48,43" fill="#D2BCFD"/>
    <!-- Bóng Teal -->
    <circle cx="62" cy="36" r="9" fill="#48CDE0"/>
    <ellipse cx="60" cy="33" rx="2" ry="3" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 60 33)"/>
    <polygon points="60,44 64,44 62,47" fill="#48CDE0"/>
    <!-- Bóng Hồng (Pink #FF6E97) -->
    <circle cx="34" cy="34" r="11" fill="#FF6E97"/>
    <ellipse cx="31" cy="31" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 31 31)"/>
    <polygon points="32,44 36,44 34,47" fill="#FF6E97"/>
  </g>

  <!-- Chùm bóng bay Pastel ở góc trên bên phải -->
  <g>
    <path d="M470 40 Q476 48 468 54 Q462 60 466 68" fill="none" stroke="#48CDE0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M456 36 Q450 46 458 52 Q462 58 454 66" fill="none" stroke="#F5B7DD" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Bóng Hồng -->
    <circle cx="456" cy="30" r="11" fill="#FF6E97"/>
    <ellipse cx="453" cy="27" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 453 27)"/>
    <polygon points="454,40 458,40 456,43" fill="#FF6E97"/>
    <!-- Bóng Lavender -->
    <circle cx="442" cy="36" r="9" fill="#D2BCFD"/>
    <ellipse cx="440" cy="33" rx="2" ry="3" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 440 33)"/>
    <polygon points="440,44 444,44 442,47" fill="#D2BCFD"/>
    <!-- Bóng Teal -->
    <circle cx="470" cy="34" r="11" fill="#48CDE0"/>
    <ellipse cx="467" cy="31" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 467 31)"/>
    <polygon points="468,44 472,44 470,47" fill="#48CDE0"/>
  </g>

  <!-- Confetti rải rác quanh mép khung -->
  <g>
    <!-- Trái -->
    <rect x="22" y="160" width="5" height="5" rx="1.5" fill="#FDD158" transform="rotate(25 22 160)"/>
    <circle cx="25" cy="280" r="2.5" fill="#FF6E97"/>
    <rect x="20" y="380" width="6" height="4" rx="1" fill="#48CDE0" transform="rotate(-30 20 380)"/>
    <!-- Phải -->
    <circle cx="482" cy="170" r="2.5" fill="#48CDE0"/>
    <rect x="478" y="270" width="5" height="5" rx="1.5" fill="#FDD158" transform="rotate(40 478 270)"/>
    <circle cx="480" cy="370" r="3" fill="#F5B7DD"/>
    <!-- Đỉnh -->
    <polygon points="160,18 164,25 156,25" fill="#FF6E97"/>
    <polygon points="345,18 349,25 341,25" fill="#48CDE0"/>
  </g>

  <!-- Góc dưới trái: Lát bánh kem sinh nhật nhỏ -->
  <g transform="translate(24 466)">
    <path d="M4 18 L24 2 L24 18 Z" fill="#F5B7DD"/>
    <path d="M4 18 L24 10 L24 18 Z" fill="#FF6E97"/>
    <!-- Lớp kem chảy -->
    <path d="M4 18 Q14 16 24 18" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Nến vàng trên bánh -->
    <rect x="20" y="-3" width="2.5" height="7" rx="1" fill="#48CDE0"/>
    <circle cx="21.2" cy="-6" r="2" fill="#FDD158"/>
  </g>

  <!-- Góc dưới phải: Hộp quà xinh xắn kèm nơ -->
  <g transform="translate(458 466)">
    <rect x="0" y="8" width="22" height="18" rx="3" fill="#48CDE0"/>
    <!-- Dải ruy băng hồng -->
    <rect x="8.5" y="8" width="5" height="18" fill="#FF6E97"/>
    <!-- Nắp hộp -->
    <rect x="-2" y="4" width="26" height="5" rx="1.5" fill="#2A9AB0"/>
    <rect x="8.5" y="4" width="5" height="5" fill="#FF6E97"/>
    <!-- Nơ vàng bên trên -->
    <ellipse cx="7" cy="2" rx="4" ry="2.5" fill="#FDD158" transform="rotate(-20 7 2)"/>
    <ellipse cx="15" cy="2" rx="4" ry="2.5" fill="#FDD158" transform="rotate(20 15 2)"/>
    <circle cx="11" cy="2.5" r="2" fill="#E0B13D"/>
  </g>
</svg>