<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#A88FE0"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#D2BCFD"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#EAE0FE"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#E2D4FE"/>

  <!-- Đĩa trung tâm màu xám tím desaturated -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#4B3D61"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#7E7196"/>

  <!-- Bánh sinh nhật màu nhạt (desaturated) -->
  <g opacity="0.6">
    <rect x="56" y="104" width="64" height="20" rx="4" fill="#A38FA8"/>
    <rect x="66" y="84" width="44" height="20" rx="3" fill="#8F7E9B"/>
    <!-- Nến tắt lửa, chỉ còn bấc nến đen nhỏ -->
    <rect x="74" y="72" width="4" height="12" rx="1" fill="#786B85"/>
    <line x1="76" y1="72" x2="76" y2="69" stroke="#32174E" stroke-width="1.2"/>
    <rect x="86" y="68" width="4" height="16" rx="1" fill="#786B85"/>
    <line x1="88" y1="68" x2="88" y2="65" stroke="#32174E" stroke-width="1.2"/>
    <rect x="98" y="72" width="4" height="12" rx="1" fill="#786B85"/>
    <line x1="100" y1="72" x2="100" y2="69" stroke="#32174E" stroke-width="1.2"/>
  </g>

  <!-- Ruy băng bắt chéo phủ qua bánh -->
  <polygon points="50,86 122,126 126,120 54,80" fill="#A89BBF"/>
  <polygon points="54,126 126,86 122,80 50,120" fill="#9384AB"/>

  <!-- Ổ khóa xám nhỏ ở tâm -->
  <g transform="translate(88 104)">
    <path d="M-6 -4 V-10 A6 6 0 0 1 6 -10 V-4" fill="none" stroke="#D2BCFD" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="-9" y="-4" width="18" height="14" rx="3.5" fill="#6C6080"/>
    <circle cx="0" cy="2" r="1.8" fill="#32174E"/>
  </g>
</svg>