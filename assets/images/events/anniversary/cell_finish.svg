<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="cake-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Gạch nền Lavender -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#A88FE0"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#D2BCFD"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#EAE0FE"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#E2D4FE"/>

  <!-- Đĩa tròn trung tâm màu Purple #5B2E86 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#32174E"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#5B2E86"/>

  <!-- Vầng sáng vàng mờ sau bánh -->
  <circle cx="88" cy="85" r="34" fill="#FDD158" opacity="0.3" filter="url(#cake-glow)"/>

  <!-- Bánh sinh nhật nhiều tầng (Tiered cake) -->
  <g>
    <!-- Tầng đáy -->
    <rect x="56" y="104" width="64" height="20" rx="4" fill="#FF6E97"/>
    <!-- Lớp kem lượn sóng Teal -->
    <path d="M56 104 Q64 110 72 104 Q80 110 88 104 Q96 110 104 104 Q112 110 120 104 L120 108 Q112 114 104 108 Q96 114 88 108 Q80 114 72 108 Q64 114 56 108 Z" fill="#48CDE0"/>

    <!-- Tầng trên -->
    <rect x="66" y="84" width="44" height="20" rx="3" fill="#D2BCFD"/>
    <!-- Lớp kem lượn sóng Hồng -->
    <path d="M66 84 Q73 89 80 84 Q88 89 96 84 Q103 89 110 84 L110 88 Q103 93 96 88 Q88 93 80 88 Q73 93 66 88 Z" fill="#FF6E97"/>

    <!-- 3 cây nến -->
    <rect x="74" y="70" width="4" height="14" rx="1" fill="#48CDE0"/>
    <rect x="86" y="66" width="4" height="18" rx="1" fill="#FF6E97"/>
    <rect x="98" y="70" width="4" height="14" rx="1" fill="#48CDE0"/>

    <!-- Ngọn lửa nến vàng rực -->
    <ellipse cx="76" cy="65" rx="2.5" ry="4" fill="#FDD158"/>
    <ellipse cx="88" cy="61" rx="2.8" ry="4.5" fill="#FDD158"/>
    <ellipse cx="100" cy="65" rx="2.5" ry="4" fill="#FDD158"/>

    <!-- Ngôi sao vàng đỉnh cao nhất -->
    <polygon points="88,44 90,48 94,48 91,51 92,55 88,53 84,55 85,51 82,48 86,48" fill="#FDD158"/>
  </g>
</svg>