<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn 340x504 (rx=28) -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Nền đồi nghĩa địa tối phẳng (Vùng an toàn cho chữ) -->
    <linearGradient id="cemeterySoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A072E"/>
      <stop offset="0.3" stop-color="#120421"/>
      <stop offset="0.75" stop-color="#0C0217"/>
      <stop offset="1" stop-color="#06010C"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- 1. Mảng đất nghĩa địa phía dưới (giữ nguyên vị trí y: 218/242 -> 504) -->
    <path d="M 0 242 Q 85 218 170 238 T 340 230 L 340 504 L 0 504 Z" fill="url(#cemeterySoil)"/>

    <!-- 2. Viền mép đồi dạ quang ma quái màu cam tím ngăn cách với detail -->
    <path d="M 0 242 Q 85 218 170 238 T 340 230" fill="none" stroke="#E85D04" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 0 247 Q 85 223 170 243 T 340 235" fill="none" stroke="#9C27B0" stroke-opacity="0.45" stroke-width="1.8"/>
  </g>
</svg>