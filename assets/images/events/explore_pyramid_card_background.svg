<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn 340x504 -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Ánh trăng tròn sa mạc tỏa sáng -->
    <radialGradient id="desertMoonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFBE3" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFE9A8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E7A95A" stop-opacity="0"/>
    </radialGradient>

    <!-- Vàng kim loại Ai Cập cổ đại (Egyptian Gold Foil) -->
    <linearGradient id="egyptGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4BD"/>
      <stop offset="0.35" stop-color="#F2C14E"/>
      <stop offset="0.7" stop-color="#D49424"/>
      <stop offset="1" stop-color="#8C5807"/>
    </linearGradient>

    <!-- Khối đá kim tự tháp hứng sáng -->
    <linearGradient id="pyramidLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B25D"/>
      <stop offset="0.6" stop-color="#D9802B"/>
      <stop offset="1" stop-color="#B86018"/>
    </linearGradient>

    <!-- Khối đá kim tự tháp đổ bóng -->
    <linearGradient id="pyramidShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#853E0F"/>
      <stop offset="0.6" stop-color="#5E2606"/>
      <stop offset="1" stop-color="#3D1502"/>
    </linearGradient>

    <!-- Biểu tượng Ankh mạ vàng chạm ngọc Lapis Lazuli -->
    <g id="golden_ankh_symbol">
      <path d="M 0 -22 C 7 -22, 12 -16, 12 -9 C 12 -1, 4 3, 4 9 L -4 9 C -4 3, -12 -1, -12 -9 C -12 -16, -7 -22, 0 -22 Z" 
            fill="url(#egyptGold)" stroke="#4A2600" stroke-width="1.2"/>
      <ellipse cx="0" cy="-9" rx="5" ry="7" fill="#2E1505"/>
      <rect x="-16" y="9" width="32" height="7" rx="2" fill="url(#egyptGold)" stroke="#4A2600" stroke-width="1.2"/>
      <rect x="-4.5" y="16" width="9" height="26" rx="2" fill="url(#egyptGold)" stroke="#4A2600" stroke-width="1.2"/>
      <circle cx="0" cy="12.5" r="2.8" fill="#1E88E5" stroke="#0D47A1" stroke-width="0.8"/>
      <circle cx="-0.8" cy="11.7" r="0.8" fill="#E3F2FD"/>
    </g>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- 1. VẦNG TRĂNG SA MẠC & CÁC VÌ SAO ĐÊM -->
    <circle cx="242" cy="115" r="95" fill="url(#desertMoonGlow)"/>
    <circle cx="242" cy="115" r="42" fill="#FFF4C4"/>
    <circle cx="232" cy="104" r="8" fill="#F7DA8D" opacity="0.45"/>
    <circle cx="258" cy="126" r="11" fill="#F7DA8D" opacity="0.35"/>

    <!-- Các vì sao lấp lánh -->
    <path d="M 42 75 Q 42 81 47 81 Q 42 81 42 87 Q 42 81 37 81 Q 42 81 42 75 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 125 65 Q 125 70 129 70 Q 125 70 125 75 Q 125 70 121 70 Q 125 70 125 65 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 305 78 Q 305 83 310 83 Q 305 83 305 88 Q 305 83 300 83 Q 305 83 305 78 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 165 110 Q 165 114 168 114 Q 165 114 165 118 Q 165 114 162 114 Q 165 114 165 110 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- 2. QUẦN THỂ KIM TỰ THÁP GIZA 3D CHI TIẾT -->
    <!-- Đụn cát đệm phía sau -->
    <path d="M -10 215 Q 80 185 180 205 Q 260 220 350 195 L 350 260 L -10 260 Z" fill="#75350F" opacity="0.6"/>

    <!-- Đại Kim Tự Tháp chính -->
    <g transform="translate(10, -5)">
      <polygon points="105,142 10,255 125,255" fill="url(#pyramidLit)"/>
      <polygon points="105,142 125,255 205,255" fill="url(#pyramidShadow)"/>
      <polygon points="105,142 88,162 108,162" fill="url(#egyptGold)"/>
      <polygon points="105,142 108,162 122,162" fill="#D49424"/>
      <line x1="68" y1="185" x2="140" y2="185" stroke="#4A1E04" stroke-width="1.2" opacity="0.45"/>
      <line x1="45" y1="212" x2="165" y2="212" stroke="#4A1E04" stroke-width="1.5" opacity="0.45"/>
      <line x1="25" y1="236" x2="188" y2="236" stroke="#4A1E04" stroke-width="1.5" opacity="0.45"/>
    </g>

    <!-- Kim tự tháp phụ bên phải -->
    <g transform="translate(15, -5)">
      <polygon points="220,165 130,255 235,255" fill="url(#pyramidLit)" opacity="0.9"/>
      <polygon points="220,165 235,255 315,255" fill="url(#pyramidShadow)" opacity="0.95"/>
      <polygon points="220,165 206,182 223,182" fill="url(#egyptGold)"/>
      <polygon points="220,165 223,182 236,182" fill="#D49424"/>
      <line x1="180" y1="202" x2="268" y2="202" stroke="#381502" stroke-width="1.2" opacity="0.4"/>
      <line x1="150" y1="228" x2="295" y2="228" stroke="#381502" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- Kim tự tháp nhỏ góc trái xa xăm -->
    <polygon points="18,208 -10,255 45,255" fill="#A8551E" opacity="0.75"/>
    <polygon points="18,208 45,255 75,255" fill="#4E1E05" opacity="0.8"/>

    <!-- 3. BIỂU TƯỢNG ANKH VÀNG & BỤI CÁT VÀNG -->
    <!-- Biểu tượng Ankh bên trái -->
    <g transform="translate(62, 142) scale(0.95)">
      <circle cx="0" cy="5" r="32" fill="#FFD54F" opacity="0.18"/>
      <use href="#golden_ankh_symbol"/>
    </g>

    <!-- Bụi cát vàng lấp lánh -->
    <circle cx="160" cy="180" r="1.8" fill="#FFE082" opacity="0.85"/>
    <circle cx="175" cy="165" r="2.2" fill="#FFD54F" opacity="0.75"/>
    <circle cx="190" cy="195" r="1.5" fill="#FFE082" opacity="0.9"/>
    <circle cx="280" cy="185" r="2" fill="#FFD54F" opacity="0.8"/>

    <!-- 4. BỌ HUNG SCARAB CHẠM KHẮC Ở GÓC PHẢI MÉP ĐÙN CÁT -->
    <g transform="translate(308, 238) scale(0.65)" opacity="0.9">
      <ellipse cx="0" cy="0" rx="9" ry="12" fill="url(#egyptGold)"/>
      <ellipse cx="0" cy="2" rx="6" ry="8" fill="#1565C0"/>
      <circle cx="0" cy="-7" r="4" fill="url(#egyptGold)"/>
      <path d="M -9 0 L -14 -4 M 9 0 L 14 -4 M -8 6 L -13 9 M 8 6 L 13 9" stroke="#FFA000" stroke-width="1.5"/>
    </g>
  </g>
</svg>