<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#9CC5E8"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#CDE9FE"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#EAF5FE"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#B3DCFB"/>

  <!-- Đĩa trung tâm màu xám xanh desaturated #4D6282 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#202D40"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#4D6282"/>

  <!-- Đồng hồ màu xám mờ (Dull gray-blue clock) -->
  <g transform="translate(88 85)">
    <circle cx="0" cy="0" r="28" fill="#758AA8"/>
    <circle cx="0" cy="0" r="22" fill="#93A7C2"/>

    <!-- Kim đồng hồ tối mờ -->
    <rect x="-1.8" y="-12" width="3.6" height="13" rx="1.8" fill="#3D4E66"/>
    <rect x="-1.2" y="-17" width="2.4" height="18" rx="1.2" fill="#3D4E66"/>
    <circle cx="0" cy="0" r="2.8" fill="#3D4E66"/>
  </g>

  <!-- Dây xích bắt chéo khóa chặt đồng hồ -->
  <line x1="68" y1="65" x2="108" y2="105" stroke="#7A8FA8" stroke-width="4.5" stroke-dasharray="6 3.5" stroke-linecap="round"/>
  <line x1="108" y1="65" x2="68" y2="105" stroke="#667B94" stroke-width="4.5" stroke-dasharray="6 3.5" stroke-linecap="round"/>

  <!-- Ổ khóa nhỏ màu xám ở tâm -->
  <g transform="translate(88 85)">
    <path d="M-5 -3 V-8 A5 5 0 0 1 5 -8 V-3" fill="none" stroke="#B8C5D6" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-7" y="-3" width="14" height="11" rx="2.5" fill="#586A82"/>
    <circle cx="0" cy="2" r="1.3" fill="#16305E"/>
  </g>
</svg>