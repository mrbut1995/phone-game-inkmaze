    <line x1="6" y1="6" x2="11" y2="11" stroke="#5CBAED" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="0" y2="15" stroke="#5CBAED" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="6" x2="-11" y2="11" stroke="#5CBAED" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="-15" y2="0" stroke="#5CBAED" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="-11" y2="-11" stroke="#5CBAED" stroke-width="2" stroke-linecap="round"/>
    <!-- Chùm nhỏ màu vàng #FBCB5C kế bên -->
    <g transform="translate(-24 -8)">
      <line x1="0" y1="-4" x2="0" y2="-8" stroke="#FBCB5C" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="3" y1="-3" x2="6" y2="-6" stroke="#FBCB5C" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="4" y1="0" x2="8" y2="0" stroke="#FBCB5C" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="3" y1="3" x2="6" y2="6" stroke="#FBCB5C" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="0" y1="4" x2="0" y2="8" stroke="#FBCB5C" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-3" y1="3" x2="-6" y2="6" stroke="#FBCB5C" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-4" y1="0" x2="-8" y2="0" stroke="#FBCB5C" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-3" y1="-3" x2="-6" y2="-6" stroke="#FBCB5C" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- MẢNH CONFETTI TAM GIÁC DỌC CÁC VIỀN -->
