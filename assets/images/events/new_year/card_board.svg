<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505 508" width="505" height="508">
  <defs>
    <!-- Đổ bóng màu xanh đêm sâu dưới khung -->
    <filter id="nye-board-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020717" flood-opacity="0.75"/>
    </filter>
    <filter id="gold-glow-top" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Bóng đổ toàn khung -->
  <g filter="url(#nye-board-shadow)">
    <!-- Viền mỏng Gold #FBCB5C -->
    <rect x="15" y="14" width="475" height="478" rx="26" fill="#FBCB5C"/>
    <!-- Thân khung màu Navy #16305E -->
    <rect x="17.5" y="16.5" width="470" height="473" rx="24" fill="#16305E"/>
    <!-- Gờ sáng trên đỉnh tạo độ dày khối giấy -->
    <path d="M42 16.5 Q17.5 16.5 17.5 41 L17.5 46 Q17.5 22 42 22 L463 22 Q487.5 22 487.5 46 L487.5 41 Q487.5 16.5 463 16.5 Z" fill="#244580"/>
  </g>

  <!-- LÒNG BÀN CỜ 5x5: Deep Navy #040F2B (440x440 chuẩn vuông, ~87% chiều rộng) -->
  <rect x="32.5" y="38" width="440" height="440" rx="14" fill="#020817"/>
  <rect x="32.5" y="38" width="440" height="440" rx="14" fill="#040F2B"/>
  <!-- Vát bóng chìm mép trong -->
  <rect x="32.5" y="38" width="440" height="5" fill="#01050F" opacity="0.7"/>

  <!-- MẶT TRĂNG KHUYẾT VÀNG Ở ĐỈNH GIỮA (GOLD CRESCENT MOON) -->
  <g transform="translate(252.5 22)" filter="url(#gold-glow-top)">
    <path d="M-6 -10 C0 -10 6 -4 6 4 C6 10 2 15 -5 16 C1 14 3 8 2 2 C1 -4 -3 -8 -6 -10 Z" fill="#FBCB5C"/>
  </g>

  <!-- PHÁO HOA ĐƯỜNG NÉT Ở GÓC TRÊN TRÁI (Vàng, Hồng, Sky-Blue) -->
  <g transform="translate(56 36)">
    <!-- Chùm pháo hoa chính màu Vàng -->
    <line x1="0" y1="-8" x2="0" y2="-15" stroke="#FBCB5C" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-6" x2="11" y2="-11" stroke="#FBCB5C" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="15" y2="0" stroke="#FBCB5C" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="6" x2="11" y2="11" stroke="#FBCB5C" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="0" y2="15" stroke="#FBCB5C" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="6" x2="-11" y2="11" stroke="#FBCB5C" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="-15" y2="0" stroke="#FBCB5C" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="-11" y2="-11" stroke="#FBCB5C" stroke-width="2" stroke-linecap="round"/>
    <!-- Chùm nhỏ màu hồng Pink #E8507F kế bên -->
    <g transform="translate(24 -8)">
      <line x1="0" y1="-4" x2="0" y2="-8" stroke="#E8507F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="3" y1="-3" x2="6" y2="-6" stroke="#E8507F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="4" y1="0" x2="8" y2="0" stroke="#E8507F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="3" y1="3" x2="6" y2="6" stroke="#E8507F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="0" y1="4" x2="0" y2="8" stroke="#E8507F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-3" y1="3" x2="-6" y2="6" stroke="#E8507F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-4" y1="0" x2="-8" y2="0" stroke="#E8507F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-3" y1="-3" x2="-6" y2="-6" stroke="#E8507F" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- PHÁO HOA Ở GÓC TRÊN PHẢI (Sky-Blue & Vàng) -->
  <g transform="translate(448 36)">
    <!-- Chùm Sky-Blue #5CBAED -->
