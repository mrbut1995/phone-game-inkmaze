<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="key-nye-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 2 tia lấp lánh màu trắng (Sparkles) -->
  <path d="M135 38 Q135 48 125 48 Q135 48 135 58 Q135 48 145 48 Q135 48 135 38 Z" fill="#FFFFFF"/>
  <path d="M38 125 Q38 133 30 133 Q38 133 38 141 Q38 133 46 133 Q38 133 38 125 Z" fill="#FFFFFF"/>

  <!-- Chìa khóa vàng xoay nghiêng 40 độ từ tâm -->
  <g transform="translate(88 88) rotate(-40) translate(-88 -88)" filter="url(#key-nye-glow)">
    <!-- Chuôi chìa khóa: Ngôi sao pháo hoa 8 cánh (Eight-ray firework starburst bow) -->
    <g>
      <!-- Các tia pháo hoa 8 hướng bung tỏa -->
      <!-- Tia chữ thập đứng và ngang -->
      <polygon points="88,14 93,42 90,46 86,46 83,42" fill="#FBCB5C"/>
      <polygon points="122,48 94,53 90,50 90,46 94,43" fill="#FBCB5C"/>
      <polygon points="88,82 83,54 86,50 90,50 93,54" fill="#D9A63A"/>
      <polygon points="54,48 82,43 86,46 86,50 82,53" fill="#D9A63A"/>

      <!-- Tia chéo 4 góc -->
      <polygon points="112,24 93,45 88,43 89,39 108,20" fill="#FBCB5C"/>
      <polygon points="112,72 89,57 88,53 93,51 116,76" fill="#D9A63A"/>
      <polygon points="64,72 83,51 88,53 87,57 60,76" fill="#D9A63A"/>
      <polygon points="64,24 87,39 88,43 83,45 68,20" fill="#FBCB5C"/>

      <!-- Vòng tròn vàng ở tâm đài sao -->
      <circle cx="88" cy="48" r="14" fill="#FBCB5C"/>
      <!-- Lỗ tròn tâm chìa khóa -->
      <circle cx="88" cy="48" r="8" fill="#040F2B"/>
      <circle cx="88" cy="48" r="4" fill="#FBCB5C"/>
    </g>

    <!-- Thân chìa khóa vàng với vát bóng vàng sẫm #D9A63A -->
    <rect x="83.5" y="66" width="9" height="78" rx="4" fill="#D9A63A"/>
    <rect x="83.5" y="66" width="4.5" height="78" rx="2" fill="#FBCB5C"/>

    <!-- Răng chìa khóa (Bit) góc cạnh sắc nét -->
    <path d="M92 112 L110 112 Q113 112 113 115 L113 122 Q113 125 110 125 L92 125 Z" fill="#D9A63A"/>
    <path d="M92 112 L110 112 Q113 112 113 115 L113 118 L92 118 Z" fill="#FBCB5C"/>

    <path d="M92 130 L106 130 Q109 130 109 133 L109 140 Q109 143 106 143 L92 143 Z" fill="#D9A63A"/>
    <path d="M92 130 L106 130 Q109 130 109 133 L109 136 L92 136 Z" fill="#FBCB5C"/>

    <!-- Chóp đáy chuôi chìa -->
    <circle cx="88" cy="149" r="5" fill="#D9A63A"/>
    <circle cx="88" cy="148" r="3" fill="#FBCB5C"/>
  </g>
</svg>