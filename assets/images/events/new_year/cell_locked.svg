<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch màu dusty slate-blue sẫm #6E82A3 -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#475773"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#6E82A3"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#5E7294"/>

  <!-- Hạt confetti đa sắc ở các góc -->
  <polygon points="32,30 36,25 38,32" fill="#FBCB5C"/>
  <polygon points="144,30 148,36 140,35" fill="#E8507F"/>
  <polygon points="30,144 36,140 35,148" fill="#5CBAED"/>
  <polygon points="144,142 148,148 140,147" fill="#FBCB5C"/>

  <!-- Ruy băng chéo màu Sky-Blue và Pink đan buộc ở tâm -->
  <line x1="24" y1="24" x2="152" y2="152" stroke="#5CBAED" stroke-width="11" stroke-linecap="round"/>
  <line x1="152" y1="24" x2="24" y2="152" stroke="#E8507F" stroke-width="11" stroke-linecap="round"/>

  <!-- Bóng tròn sau ổ khóa -->
  <circle cx="88" cy="94" r="32" fill="#040F2B" opacity="0.6"/>

  <!-- Ổ khóa Navy chunky ở trung tâm với lỗ khóa vàng -->
  <g transform="translate(88 88)">
    <!-- Quai khóa thép màu Sky-Blue #5CBAED -->
    <path d="M-18 -8 V-24 A18 18 0 0 1 18 -24 V-8" fill="none" stroke="#5CBAED" stroke-width="9" stroke-linecap="round"/>
    <!-- Thân khóa Navy #16305E -->
    <rect x="-28" y="-8" width="56" height="46" rx="9" fill="#16305E"/>
    <!-- Băng đáy tối màu #071730 -->
    <path d="M-28 17 Q-28 38 -9 38 L9 38 Q28 38 28 17 L28 12 L-28 12 Z" fill="#071730"/>
    <!-- Lỗ khóa vàng Gold #FBCB5C -->
    <circle cx="0" cy="11" r="5" fill="#FBCB5C"/>
    <polygon points="-3,12 3,12 2,24 -2,24" fill="#FBCB5C"/>
  </g>
</svg>