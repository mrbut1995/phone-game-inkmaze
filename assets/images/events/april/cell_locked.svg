<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch màu lavender tối #BAA4C7 -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#8D759C"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#BAA4C7"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#A892B6"/>

  <!-- Họa tiết chấm bi nhỏ (Polka dots) -->
  <circle cx="32" cy="32" r="3" fill="#D9C7E5"/>
  <circle cx="144" cy="32" r="3" fill="#D9C7E5"/>
  <circle cx="32" cy="144" r="3" fill="#D9C7E5"/>
  <circle cx="144" cy="144" r="3" fill="#D9C7E5"/>

  <!-- Ruy băng hồng #FF73CA bắt chéo buộc ở tâm -->
  <line x1="24" y1="24" x2="152" y2="152" stroke="#FF73CA" stroke-width="12" stroke-linecap="round"/>
  <line x1="152" y1="24" x2="24" y2="152" stroke="#FF73CA" stroke-width="12" stroke-linecap="round"/>
  <!-- Nếp gấp tạo khối bóng ruy băng -->
  <line x1="152" y1="24" x2="24" y2="152" stroke="#D94FA8" stroke-width="4" stroke-linecap="round"/>

  <!-- Bóng tròn sau ổ khóa -->
  <circle cx="88" cy="94" r="32" fill="#3A0648" opacity="0.45"/>

  <!-- Ổ khóa Violet chunky nằm trên nơ ruy băng -->
  <g transform="translate(88 88)">
    <!-- Quai khóa thép màu hồng nhạt #FDC1E3 -->
    <path d="M-18 -8 V-24 A18 18 0 0 1 18 -24 V-8" fill="none" stroke="#FDC1E3" stroke-width="9" stroke-linecap="round"/>
    <!-- Thân khóa Violet #7A43F6 -->
    <rect x="-28" y="-8" width="56" height="46" rx="9" fill="#7A43F6"/>
    <!-- Băng đáy tối màu #4B2699 -->
    <path d="M-28 17 Q-28 38 -9 38 L9 38 Q28 38 28 17 L28 12 L-28 12 Z" fill="#4B2699"/>
    <!-- Lỗ khóa hình ngôi sao vàng Lemon Yellow #FBEC77 -->
    <polygon points="0,5 2.5,11 8.5,11 4,14.5 5.5,20.5 0,17 -5.5,20.5 -4,14.5 -8.5,11 -2.5,11" fill="#FBEC77"/>
  </g>
</svg>