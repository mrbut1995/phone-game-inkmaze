<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="fla-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FF73CA" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- Chân đứng mảnh khảnh -->
  <path d="M30 38 L30 50 L26 50" fill="none" stroke="#FF73CA" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Thân chim hồng hạc mập mạp phát sáng mềm -->
  <g filter="url(#fla-glow)">
    <!-- Thân tròn Hot-Pink #FF73CA -->
    <ellipse cx="31" cy="30" rx="12" ry="10" fill="#FF73CA"/>
    <!-- Cổ chữ S và đầu tròn -->
    <path d="M25 32 C23 25 18 24 18 18 C18 13 23 11 25 14 C27 17 23 22 29 28 Z" fill="#FF73CA"/>
    <circle cx="21" cy="15" r="5.5" fill="#FF73CA"/>
    <!-- Mỏ chim: gốc hồng, chóp mận đậm #3A0648 -->
    <path d="M16 16 L11 19 Q11 21 14 20 L16 18 Z" fill="#3A0648"/>
    <!-- Cánh chim hồng nhạt #FDC1E3 -->
    <path d="M26 27 C29 25 38 25 41 29 C41 34 34 36 28 35 Z" fill="#FDC1E3"/>
    <!-- Mắt đen tròn có đốm sáng trắng -->
    <circle cx="19.5" cy="14" r="1.5" fill="#000000"/>
    <circle cx="19" cy="13.5" r="0.6" fill="#FFFFFF"/>
  </g>
</svg>