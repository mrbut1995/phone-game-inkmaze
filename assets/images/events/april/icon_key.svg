<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="key-mystery-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 2 tia lấp lánh màu trắng (Sparkles) -->
  <path d="M135 38 Q135 48 125 48 Q135 48 135 58 Q135 48 145 48 Q135 48 135 38 Z" fill="#FFFFFF"/>
  <path d="M38 125 Q38 133 30 133 Q38 133 38 141 Q38 133 46 133 Q38 133 38 125 Z" fill="#FFFFFF"/>

  <!-- Chìa khóa xoay 40 độ từ tâm -->
  <g transform="translate(88 88) rotate(-40) translate(-88 -88)" filter="url(#key-mystery-glow)">
    <!-- Chuôi chìa khóa: Ngôi sao 5 cánh Lemon Yellow #FBEC77 -->
    <g>
      <polygon points="88,18 97,42 122,42 102,57 110,81 88,66 66,81 74,57 54,42 79,42" fill="#E6D352"/>
      <polygon points="88,18 97,42 122,42 102,57 110,81 88,66" fill="#FBEC77"/>
      <!-- Lỗ tròn tâm ngôi sao -->
      <circle cx="88" cy="52" r="10" fill="#3A0648"/>
      <circle cx="88" cy="52" r="5" fill="#FBEC77"/>
    </g>

    <!-- Thân chìa khóa Violet #7A43F6 với vát tối #4B2699 -->
    <rect x="83.5" y="78" width="9" height="66" rx="4" fill="#4B2699"/>
    <rect x="83.5" y="78" width="4.5" height="66" rx="2" fill="#7A43F6"/>

    <!-- Răng chìa khóa (Bit) góc cạnh kiểu paper-cut -->
    <path d="M92 110 L110 110 Q113 110 113 113 L113 120 Q113 123 110 123 L92 123 Z" fill="#4B2699"/>
    <path d="M92 110 L110 110 Q113 110 113 113 L113 116 L92 116 Z" fill="#7A43F6"/>

    <path d="M92 128 L106 128 Q109 128 109 131 L109 138 Q109 141 106 141 L92 141 Z" fill="#4B2699"/>
    <path d="M92 128 L106 128 Q109 128 109 131 L109 134 L92 134 Z" fill="#7A43F6"/>

    <!-- Chóp đáy chuôi chìa -->
    <circle cx="88" cy="144" r="5" fill="#4B2699"/>
    <circle cx="88" cy="143" r="3" fill="#7A43F6"/>
  </g>
</svg>