<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn 340x504 -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Ánh nắng ấm ban mai tỏa rạng -->
    <radialGradient id="springSunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFEE6" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFF5A8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFF5A8" stop-opacity="0"/>
    </radialGradient>

    <!-- Cành cây anh đào nâu gỗ -->
    <linearGradient id="sakuraWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8D5341"/>
      <stop offset="0.5" stop-color="#6E3A2A"/>
      <stop offset="1" stop-color="#4E2316"/>
    </linearGradient>

    <!-- Mẫu hoa anh đào 5 cánh chi tiết -->
    <g id="sakura_blossom">
      <circle cx="0" cy="-6.5" r="4.8" fill="#FFB7CE"/>
      <circle cx="6.2" cy="-2" r="4.8" fill="#FFB7CE"/>
      <circle cx="3.8" cy="5.5" r="4.8" fill="#FFB7CE"/>
      <circle cx="-3.8" cy="5.5" r="4.8" fill="#FFB7CE"/>
      <circle cx="-6.2" cy="-2" r="4.8" fill="#FFB7CE"/>
      <circle cx="0" cy="-5" r="3" fill="#FFE4ED" opacity="0.85"/>
      <circle cx="4.8" cy="-1.5" r="3" fill="#FFE4ED" opacity="0.85"/>
      <circle cx="3" cy="4.2" r="3" fill="#FFE4ED" opacity="0.85"/>
      <circle cx="-3" cy="4.2" r="3" fill="#FFE4ED" opacity="0.85"/>
      <circle cx="-4.8" cy="-1.5" r="3" fill="#FFE4ED" opacity="0.85"/>
      <circle cx="0" cy="0" r="2.8" fill="#FFD54F"/>
      <circle cx="0" cy="0" r="1.3" fill="#E65100"/>
    </g>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- 1. MẶT TRỜI MÙA XUÂN, CẦU VỒNG & MÂY TRẮNG -->
    <circle cx="52" cy="88" r="82" fill="url(#springSunAura)"/>
    <circle cx="52" cy="88" r="26" fill="#FFF275"/>

    <g opacity="0.45" fill="none" stroke-linecap="round">
      <path d="M 28 240 A 136 136 0 0 1 312 240" stroke="#FF8FA3" stroke-width="6"/>
      <path d="M 35 240 A 129 129 0 0 1 305 240" stroke="#FFD166" stroke-width="6"/>
      <path d="M 42 240 A 122 122 0 0 1 298 240" stroke="#FFF275" stroke-width="6"/>
      <path d="M 49 240 A 115 115 0 0 1 291 240" stroke="#06D6A0" stroke-width="6"/>
      <path d="M 56 240 A 108 108 0 0 1 284 240" stroke="#118AB2" stroke-width="6"/>
    </g>

    <g transform="translate(68, 142) scale(0.85)" fill="#FFFFFF" fill-opacity="0.95">
      <ellipse cx="0" cy="0" rx="26" ry="12"/>
      <circle cx="-12" cy="-8" r="12"/><circle cx="6" cy="-13" r="15"/><circle cx="20" cy="-4" r="10"/>
    </g>
    <g transform="translate(295, 148) scale(0.7)" fill="#FFFFFF" fill-opacity="0.95">
      <ellipse cx="0" cy="0" rx="26" ry="12"/>
      <circle cx="-12" cy="-8" r="12"/><circle cx="6" cy="-13" r="15"/><circle cx="20" cy="-4" r="10"/>
    </g>

    <!-- 2. CÀNH HOA ANH ĐÀO & MƯA CÁNH HOA -->
    <g>
      <path d="M 350 60 Q 295 76 258 106 Q 230 128 198 126" 
            fill="none" stroke="url(#sakuraWood)" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 265 102 Q 252 82 235 78" 
            fill="none" stroke="url(#sakuraWood)" stroke-width="4" stroke-linecap="round"/>
      <path d="M 225 127 Q 212 142 195 140" 
            fill="none" stroke="url(#sakuraWood)" stroke-width="2.8" stroke-linecap="round"/>

      <g transform="translate(322, 68) scale(1.15)"><use href="#sakura_blossom"/></g>
      <g transform="translate(298, 80) scale(1.2)"><use href="#sakura_blossom"/></g>
      <g transform="translate(275, 94) scale(1.1)"><use href="#sakura_blossom"/></g>
      <g transform="translate(254, 108) scale(1.25)"><use href="#sakura_blossom"/></g>
      <g transform="translate(234, 122) scale(1.1)"><use href="#sakura_blossom"/></g>
      <g transform="translate(208, 126) scale(0.95)"><use href="#sakura_blossom"/></g>
      <g transform="translate(238, 80) scale(1.0)"><use href="#sakura_blossom"/></g>
      <g transform="translate(196, 140) scale(0.85)"><use href="#sakura_blossom"/></g>

      <circle cx="335" cy="55" r="3.5" fill="#FF4081"/>
      <circle cx="282" cy="74" r="3.2" fill="#FF4081"/>
      <circle cx="220" cy="76" r="3.2" fill="#FF4081"/>

      <ellipse cx="198" cy="158" rx="4.5" ry="2.6" fill="#FFB7CE" transform="rotate(30 198 158)"/>
      <ellipse cx="248" cy="168" rx="4.5" ry="2.6" fill="#FFB7CE" transform="rotate(-20 248 168)"/>
      <ellipse cx="178" cy="192" rx="4.2" ry="2.5" fill="#FFB7CE" transform="rotate(45 178 192)"/>
      <ellipse cx="128" cy="148" rx="4.2" ry="2.5" fill="#FFB7CE" transform="rotate(10 128 148)"/>
      <ellipse cx="58" cy="168" rx="4.2" ry="2.5" fill="#FFB7CE" transform="rotate(-30 58 168)"/>
      <ellipse cx="295" cy="188" rx="4.5" ry="2.6" fill="#FFB7CE" transform="rotate(20 295 188)"/>
    </g>

    <!-- 3. BƯỚM XUÂN 3D -->
    <g transform="translate(118, 110) scale(0.95)">
      <ellipse cx="-9" cy="-5" rx="10" ry="12" fill="#FF85A1" transform="rotate(-25 -9 -5)"/>
      <ellipse cx="9" cy="-5" rx="10" ry="12" fill="#FF85A1" transform="rotate(25 9 -5)"/>
      <ellipse cx="-7" cy="8" rx="6.5" ry="8" fill="#FFD166" transform="rotate(20 -7 8)"/>
      <ellipse cx="7" cy="8" rx="6.5" ry="8" fill="#FFD166" transform="rotate(-20 7 8)"/>
      <circle cx="0" cy="1" r="2.6" fill="#3D1A24"/>
      <line x1="0" y1="0" x2="-6" y2="-12" stroke="#3D1A24" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="6" y2="-12" stroke="#3D1A24" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <g transform="translate(195, 185) scale(0.72)">
      <ellipse cx="-9" cy="-5" rx="10" ry="12" fill="#C9A7FF" transform="rotate(-25 -9 -5)"/>
      <ellipse cx="9" cy="-5" rx="10" ry="12" fill="#C9A7FF" transform="rotate(25 9 -5)"/>
      <ellipse cx="-7" cy="8" rx="6.5" ry="8" fill="#48CAE4" transform="rotate(20 -7 8)"/>
      <ellipse cx="7" cy="8" rx="6.5" ry="8" fill="#48CAE4" transform="rotate(-20 7 8)"/>
      <circle cx="0" cy="1" r="2.6" fill="#240D36"/>
      <line x1="0" y1="0" x2="-5" y2="-11" stroke="#240D36" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="5" y2="-11" stroke="#240D36" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>