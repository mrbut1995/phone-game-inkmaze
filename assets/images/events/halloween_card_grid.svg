<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Lưới ô ly 30x30 giống daily, đổi sang nét sáng tím nhạt cho nền tối -->
    <pattern id="gd" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#CDB8FF" stroke-width="1" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="340" height="504" fill="url(#gd)"/>
  <!-- Lề vở (giống lề đỏ của daily, dùng cam của Halloween) -->
  <line x1="14" y1="0" x2="14" y2="504" stroke="#E85D04" stroke-width="3" opacity="0.35"/>
</svg>
