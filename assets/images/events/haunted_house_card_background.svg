<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn thẻ sự kiện 340x504 -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Nền đêm u ám xanh ngọc bích đen Mansion -->
    <linearGradient id="bg_mansion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2B30"/>
      <stop offset="0.38" stop-color="#0B1F24"/>
      <stop offset="0.75" stop-color="#071417"/>
      <stop offset="1" stop-color="#030A0C"/>
    </linearGradient>

    <!-- Lưới ô ly mờ nhận diện Design System -->
    <pattern id="gw" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#5BD99A" stroke-width="1" opacity="0.06"/>
    </pattern>

    <!-- Hào quang mặt trăng xanh ngọc dạ quang (Teal/Mint Moon Glow) -->
    <radialGradient id="mintMoonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8FFF5" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#BFFFDC" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#5BD99A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0E2B30" stop-opacity="0"/>
    </radialGradient>

    <!-- Ánh sáng cửa sổ ma quái vàng chanh -->
    <radialGradient id="windowGold" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#FFF59D"/>
      <stop offset="0.7" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </radialGradient>

    <!-- Ánh sáng cửa sổ xanh ngọc dạ quang -->
    <radialGradient id="windowTeal" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#E0FFF0"/>
      <stop offset="0.6" stop-color="#7CF2C0"/>
      <stop offset="1" stop-color="#26A69A"/>
    </radialGradient>

    <!-- Màn sương đêm tâm linh huyền ảo -->
    <linearGradient id="ghostlyFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFFAE8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#5BD99A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#050B0D" stop-opacity="0"/>
    </linearGradient>

    <!-- Nền đồi tối phẳng (Vùng an toàn cho chữ) -->
    <linearGradient id="mansionSoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1C20"/>
      <stop offset="0.3" stop-color="#061214"/>
      <stop offset="0.75" stop-color="#040C0E"/>
      <stop offset="1" stop-color="#020607"/>
    </linearGradient>

    <!-- Dơi bóng đêm -->
    <g id="mansion_bat">
      <path d="M 0 0 C -6 -10 -18 -8 -26 2 C -20 -2 -15 0 -12 5 C -8 1 -5 2 0 8 C 5 2 8 1 12 5 C 15 0 20 -2 26 2 C 18 -8 6 -10 0 0 Z" 
            fill="#03080A"/>
    </g>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- ============================================== -->
    <!-- 1. BẦU TRỜI ĐÊM U ÁM & TRĂNG XANH DẠ QUANG     -->
    <!-- ============================================== -->
    <rect width="340" height="504" fill="url(#bg_mansion)"/>
    <rect width="340" height="504" fill="url(#gw)"/>

    <!-- Mặt trăng xanh ngọc huyền ảo (x = 245, y = 110) -->
    <circle cx="245" cy="110" r="95" fill="url(#mintMoonGlow)"/>
    <circle cx="245" cy="110" r="44" fill="#E8FFF5"/>
    <circle cx="232" cy="98" r="9" fill="#BCEFD9" opacity="0.6"/>
    <circle cx="262" cy="122" r="8" fill="#BCEFD9" opacity="0.5"/>
    <circle cx="254" cy="92" r="5.5" fill="#BCEFD9" opacity="0.45"/>

    <!-- Mây sương mù trôi ngang mặt trăng -->
    <path d="M 180 102 Q 230 85 295 106 Q 250 120 180 102 Z" fill="#0A1E22" opacity="0.75"/>
    <path d="M 220 128 Q 260 116 310 130 Q 270 140 220 128 Z" fill="#0A1E22" opacity="0.65"/>

    <!-- Sao ma mị xanh nhạt -->
    <circle cx="45" cy="75" r="1.5" fill="#BFFFDC" opacity="0.8"/>
    <circle cx="115" cy="60" r="2" fill="#BFFFDC" opacity="0.9"/>
    <circle cx="160" cy="85" r="1.5" fill="#BFFFDC" opacity="0.7"/>
    <circle cx="295" cy="65" r="1.8" fill="#BFFFDC" opacity="0.85"/>
    <path d="M 75 95 Q 75 99 79 99 Q 75 99 75 103 Q 75 99 71 99 Q 75 99 75 95 Z" fill="#E8FFF5" opacity="0.9"/>

    <!-- Cành cây khô cong queo vươn qua vầng trăng -->
    <g stroke="#03080A" stroke-linecap="round" fill="none">
      <path d="M 350 110 Q 305 95 280 110 Q 255 125 220 115" stroke-width="4.5"/>
      <path d="M 295 102 Q 285 80 265 75" stroke-width="2.5"/>
      <path d="M 260 118 Q 250 135 235 130" stroke-width="2"/>
      <path d="M 280 82 Q 270 68 280 58" stroke-width="1.8"/>
    </g>

    <!-- ============================================== -->
    <!-- 2. DINH THỰ GOTHIC CỔ ĐIỂN 3D NGUY NGA         -->
    <!-- (Tọa lạc sừng sững giữa màn sương, x = 40..290)-->
    <!-- ============================================== -->
    <g transform="translate(0, 0)">
      <!-- LỚP THÀNH PHỤ PHÍA SAU -->
      <polygon points="120,135 155,75 190,135" fill="#050E10"/>
      <rect x="135" y="130" width="40" height="40" fill="#050E10"/>

      <!-- THÁP NHỌN BÊN TRÁI -->
      <g transform="translate(48, 115)">
        <polygon points="22,-32 0,25 44,25" fill="#040C0E"/>
        <!-- Cọc nhọn đỉnh tháp -->
        <line x1="22" y1="-42" x2="22" y2="-32" stroke="#040C0E" stroke-width="2.5"/>
        <rect x="2" y="25" width="40" height="115" fill="#050E11"/>
        <!-- Cửa sổ tháp trái phát sáng -->
        <rect x="14" y="42" width="16" height="24" rx="8" fill="url(#windowGold)"/>
        <line x1="22" y1="42" x2="22" y2="66" stroke="#040C0E" stroke-width="1.5"/>
        <line x1="14" y1="54" x2="30" y2="54" stroke="#040C0E" stroke-width="1.5"/>
        <rect x="14" y="85" width="16" height="24" rx="8" fill="url(#windowTeal)"/>
        <line x1="22" y1="85" x2="22" y2="109" stroke="#040C0E" stroke-width="1.5"/>
      </g>

      <!-- THÁP NHỌN BÊN PHẢI -->
      <g transform="translate(248, 115)">
        <polygon points="22,-32 0,25 44,25" fill="#040C0E"/>
        <line x1="22" y1="-42" x2="22" y2="-32" stroke="#040C0E" stroke-width="2.5"/>
        <rect x="2" y="25" width="40" height="115" fill="#050E11"/>
        <!-- Cửa sổ tháp phải phát sáng -->
        <rect x="14" y="42" width="16" height="24" rx="8" fill="url(#windowTeal)"/>
        <line x1="22" y1="42" x2="22" y2="66" stroke="#040C0E" stroke-width="1.5"/>
        <rect x="14" y="85" width="16" height="24" rx="8" fill="url(#windowGold)"/>
        <line x1="22" y1="85" x2="22" y2="109" stroke="#040C0E" stroke-width="1.5"/>
      </g>

      <!-- TÒA NHÀ TRUNG TÂM (MAIN MANSION HALL) -->
      <g transform="translate(84, 130)">
        <!-- Mái nhọn Gothic chính -->
        <polygon points="86,-30 -8,45 180,45" fill="#040B0D"/>
        <line x1="86" y1="-45" x2="86" y2="-30" stroke="#040B0D" stroke-width="3"/>
        <circle cx="86" cy="-45" r="3" fill="#040B0D"/>
        <!-- Ống khói cổ xưa -->
        <rect x="145" y="-12" width="14" height="35" fill="#040C0E"/>
        <!-- Thân nhà chính -->
        <rect x="0" y="45" width="172" height="98" fill="#061215"/>

        <!-- Ban công sắt uốn hoa văn tầng 2 -->
        <line x1="15" y1="92" x2="157" y2="92" stroke="#03080A" stroke-width="3"/>
        <path d="M 20 85 Q 26 92 32 85 Q 38 92 44 85 Q 50 92 56 85 Q 62 92 68 85 Q 74 92 80 85 Q 86 92 92 85 Q 98 92 104 85 Q 110 92 116 85 Q 122 92 128 85 Q 134 92 140 85 Q 146 92 152 85" 
              stroke="#03080A" stroke-width="2" fill="none"/>

        <!-- Các ô cửa sổ tầng trên -->
        <rect x="25" y="55" width="18" height="28" rx="8" fill="url(#windowGold)"/>
        <rect x="77" y="52" width="18" height="31" rx="8" fill="url(#windowTeal)"/>
        <rect x="129" y="55" width="18" height="28" rx="8" fill="url(#windowGold)"/>

        <!-- CỔNG VÒM CHÍNH BIỆT THỰ PHÁT SÁNG HÀO QUANG -->
        <path d="M 68 143 L 68 108 A 18 18 0 0 1 104 108 L 104 143 Z" fill="#03080A"/>
        <path d="M 72 143 L 72 110 A 14 14 0 0 1 100 110 L 100 143 Z" fill="url(#windowGold)" opacity="0.85"/>
        <line x1="86" y1="102" x2="86" y2="143" stroke="#03080A" stroke-width="2"/>
        <!-- Cửa sổ tầng dưới -->
        <rect x="25" y="105" width="18" height="26" rx="8" fill="url(#windowTeal)"/>
        <rect x="129" y="105" width="18" height="26" rx="8" fill="url(#windowGold)"/>
      </g>
    </g>

    <!-- Đàn dơi bóng đêm chao lượn quanh lâu đài -->
    <g transform="translate(110, 105) scale(0.75)"><use href="#mansion_bat"/></g>
    <g transform="translate(138, 85) scale(0.5)"><use href="#mansion_bat"/></g>
    <g transform="translate(295, 175) scale(0.6)"><use href="#mansion_bat"/></g>
    <g transform="translate(38, 145) scale(0.45)"><use href="#mansion_bat"/></g>

    <!-- ============================================== -->
    <!-- 3. MÀN SƯƠNG MÙ TÂM LINH DÀY ĐẶC CHÂN TƯỜNG     -->
    <!-- ============================================== -->
    <ellipse cx="100" cy="242" rx="140" ry="24" fill="url(#ghostlyFog)"/>
    <ellipse cx="250" cy="238" rx="130" ry="22" fill="url(#ghostlyFog)"/>
    <ellipse cx="170" cy="246" rx="200" ry="26" fill="url(#ghostlyFog)"/>

    <!-- ============================================== -->
    <!-- 4. ĐỒI ĐẤT TỐI & VÙNG NỀN AN TOÀN (SAFE ZONE)   -->
    <!-- Đường chân đồi uốn lượn tại y ≈ 242            -->
    <!-- ============================================== -->
    <path d="M 0 242 Q 85 218 170 238 T 340 230 L 340 504 L 0 504 Z" fill="url(#mansionSoil)"/>

    <!-- Viền gờ đồi dạ quang xanh ngọc bích sắc nét -->
    <path d="M 0 242 Q 85 218 170 238 T 340 230" fill="none" stroke="#5BD99A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 0 247 Q 85 223 170 243 T 340 235" fill="none" stroke="#00E676" stroke-opacity="0.35" stroke-width="1.8"/>

    <!-- ============================================== -->
    <!-- 5. TRỤ CỔNG ĐÁ GOTHIC & HOA VĂN SẮT UỐN HAI BÊN-->
    <!-- (Xếp nép sát 2 mép ngoài, giữ sạch vùng giữa)   -->
    <!-- ============================================== -->
    <!-- Trụ cổng đá bên trái -->
    <g transform="translate(12, 218)">
      <rect x="0" y="10" width="22" height="32" fill="#040B0D" stroke="#0A1E22" stroke-width="1.5"/>
      <polygon points="-2,10 11,-4 24,10" fill="#040B0D"/>
      <!-- Đèn bão treo trên đỉnh trụ phát sáng -->
      <circle cx="11" cy="2" r="5" fill="#7CF2C0" opacity="0.6"/>
      <circle cx="11" cy="2" r="2.5" fill="#FFFFFF"/>
      <!-- Hoa văn sắt uốn mép ngoài -->
      <path d="M 22 22 Q 32 15 30 30" stroke="#040B0D" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Trụ cổng đá bên phải -->
    <g transform="translate(306, 212)">
      <rect x="0" y="10" width="22" height="32" fill="#040B0D" stroke="#0A1E22" stroke-width="1.5"/>
      <polygon points="-2,10 11,-4 24,10" fill="#040B0D"/>
      <circle cx="11" cy="2" r="5" fill="#FFD54F" opacity="0.6"/>
      <circle cx="11" cy="2" r="2.5" fill="#FFFFFF"/>
      <path d="M 0 22 Q -10 15 -8 30" stroke="#040B0D" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Đốm sáng dạ quang tâm linh bay lơ lửng -->
    <circle cx="58" cy="245" r="1.8" fill="#7CF2C0" opacity="0.8"/>
    <circle cx="282" cy="242" r="1.8" fill="#FFD86B" opacity="0.8"/>

    <!-- ============================================== -->
    <!-- 6. VÙNG AN TOÀN TRỐNG (SAFE ZONE: y ≈ 244–504)  -->
    <!-- Nền ngọc bích đen huyền bí phẳng tuyệt đối:    -->
    <!-- - Tiêu đề Biệt Thự Ma Ám (y: 260 - 310)        -->
    <!-- - Phụ đề 2 dòng          (y: 325 - 350)        -->
    <!-- - Hộp tiến độ & 2 quà    (y: 356 - 438)        -->
    <!-- - Nút CTA Vào Biệt Thự   (y: 448 - 494)        -->
    <!-- ============================================== -->
  </g>

  <!-- Viền sáng trắng bao quanh card đặc trưng chuẩn Design System -->
  <rect x="1.5" y="1.5" width="337" height="501" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
</svg>