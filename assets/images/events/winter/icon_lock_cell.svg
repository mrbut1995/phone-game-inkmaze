<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="keyhole-winter-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bóng tròn màu Deep Navy mềm bên dưới -->
  <ellipse cx="88" cy="148" rx="46" ry="14" fill="#0E203C" opacity="0.5"/>

  <!-- Quai khóa thép màu Ice Blue #8ABFEF -->
  <path d="M64 80 V52 A24 24 0 0 1 112 52 V80" fill="none" stroke="#8ABFEF" stroke-width="14" stroke-linecap="round"/>
  <!-- Điểm nhấn vát sáng trên đỉnh quai -->
  <path d="M72 43 A20 20 0 0 1 104 43" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <!-- Chiếc khăn len mùa đông ấm áp vắt qua quai khóa (Winter scarf detail) -->
  <path d="M58 56 Q48 42 64 42 Q74 42 76 54 Q80 68 62 70" fill="none" stroke="#4A7FB5" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="60" cy="54" rx="4.5" ry="3" fill="#B8D9F8" transform="rotate(-15 60 54)"/>

  <!-- Thân khóa chunky Navy #132B50 -->
  <rect x="48" y="78" width="80" height="62" rx="14" fill="#0A182E"/>
  <rect x="48" y="74" width="80" height="62" rx="14" fill="#132B50"/>

  <!-- Gờ sáng trên thân khóa -->
  <path d="M62 74 Q48 74 48 88 L48 91 Q48 77 62 77 L114 77 Q128 77 128 91 L128 88 Q128 74 114 74 Z" fill="#2B527E"/>

  <!-- Băng đáy tối màu #0E203C -->
  <path d="M48 112 Q48 136 72 136 L104 136 Q128 136 128 112 L128 106 L48 106 Z" fill="#0E203C"/>

  <!-- Lỗ khóa hình giọt nước phát sáng màu vàng ấm #FED136 -->
  <g filter="url(#keyhole-winter-glow)">
    <circle cx="88" cy="101" r="6.5" fill="#FED136"/>
    <polygon points="84.5,102 91.5,102 89.5,120 86.5,120" fill="#FED136"/>
    <circle cx="88" cy="101" r="2.5" fill="#FFFDF2"/>
  </g>
</svg>