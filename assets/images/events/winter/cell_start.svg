<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền Ice-Blue nhạt -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#B3D3EF"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#EAF3FC"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFFFFF"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#D4E7F9"/>

  <!-- Đĩa tròn trung tâm Slate Blue #4A7FB5 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#24507E"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#4A7FB5"/>
  <path d="M54 33 Q36 33 36 51 L36 54 Q36 36 54 36 L122 36 Q140 36 140 54 L140 51 Q140 33 122 33 Z" fill="#6A9DD1"/>

  <!-- Gò tuyết phủ ở chân cọc chỉ đường -->
  <ellipse cx="88" cy="124" rx="34" ry="8" fill="#FFFFFF"/>

  <!-- BIỂN GỖ CHỈ ĐƯỜNG MÙA ĐÔNG (WOODEN SIGNPOST) CẮM TRÊN TUYẾT -->
  <g>
    <!-- Trụ gỗ cắm đứng -->
    <rect x="84" y="62" width="8" height="62" rx="2" fill="#132B50"/>

    <!-- Biển chỉ dẫn hình mũi tên chỉ sang phải có tuyết phủ trên lưng -->
    <path d="M64 70 L104 70 L118 82 L104 94 L64 94 Z" fill="#132B50"/>
    <!-- Lớp tuyết trắng dày phủ trên mép biển -->
    <path d="M62 70 Q90 64 118 82 L114 84 Q90 68 64 74 Z" fill="#FFFFFF"/>

    <!-- Cây thông nhỏ tuyết phủ cạnh cọc chỉ đường -->
    <g transform="translate(116 102)">
      <polygon points="0,22 4,10 8,22" fill="#132B50"/>
      <polygon points="1,14 4,8 7,14" fill="#FFFFFF"/>
    </g>
  </g>
</svg>