<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="snowman-glow-sel" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#FED136" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Khung bo góc nét đứt màu vàng ấm #FED136 -->
  <rect x="4.5" y="4.5" width="45" height="45" rx="10" fill="none" stroke="#FED136" stroke-width="2.5" stroke-dasharray="5 3.5"/>

  <!-- Người tuyết phóng to nhẹ (scale 1.08), đính sparkle vàng trên mũ và phát sáng rực rỡ -->
  <g transform="translate(27 27) scale(1.08) translate(-27 -27)" filter="url(#snowman-glow-sel)">
    <circle cx="27" cy="36" r="11" fill="#FFFFFF"/>
    <ellipse cx="27" cy="27" rx="6" ry="1.5" fill="#D4E7F9"/>
    <circle cx="27" cy="21" r="8" fill="#FFFFFF"/>

    <ellipse cx="27" cy="14" rx="8" ry="2" fill="#1B2433"/>
    <rect x="22" y="7" width="10" height="7" rx="1" fill="#1B2433"/>
    <rect x="22" y="12" width="10" height="1.8" fill="#FED136"/>

    <circle cx="24" cy="20" r="1.3" fill="#1B2433"/>
    <circle cx="23.6" cy="19.6" r="0.4" fill="#FFFFFF"/>
    <circle cx="30" cy="20" r="1.3" fill="#1B2433"/>
    <circle cx="29.6" cy="19.6" r="0.4" fill="#FFFFFF"/>

    <polygon points="27,21 34,23 27,24" fill="#FF7A2F"/>

    <circle cx="24" cy="25" r="0.6" fill="#1B2433"/>
    <circle cx="26" cy="26" r="0.6" fill="#1B2433"/>
    <circle cx="28" cy="26" r="0.6" fill="#1B2433"/>
    <circle cx="30" cy="25" r="0.6" fill="#1B2433"/>

    <ellipse cx="20.5" cy="22.5" rx="1.6" ry="1" fill="#FFB0B0" opacity="0.75"/>
    <ellipse cx="33.5" cy="22.5" rx="1.6" ry="1" fill="#FFB0B0" opacity="0.75"/>

    <circle cx="27" cy="33" r="1.2" fill="#1B2433"/>
    <circle cx="27" cy="38" r="1.2" fill="#1B2433"/>

    <!-- Ngôi sao vàng lấp lánh trên chóp mũ -->
    <polygon points="27,2 28,4.5 30.5,4.5 28.5,6 29.5,8.5 27,7 24.5,8.5 25.5,6 23.5,4.5 26,4.5" fill="#FED136"/>
  </g>
</svg>