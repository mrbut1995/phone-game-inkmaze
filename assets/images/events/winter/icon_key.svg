<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="key-winter-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 2 tia lấp lánh màu trắng (White sparkles) -->
  <path d="M135 38 Q135 48 125 48 Q135 48 135 58 Q135 48 145 48 Q135 48 135 38 Z" fill="#FFFFFF"/>
  <path d="M38 125 Q38 133 30 133 Q38 133 38 141 Q38 133 46 133 Q38 133 38 125 Z" fill="#FFFFFF"/>

  <!-- Chìa khóa vàng xoay nghiêng 40 độ từ tâm -->
  <g transform="translate(88 88) rotate(-40) translate(-88 -88)" filter="url(#key-winter-glow)">
    <!-- Chuôi chìa khóa: Bông tuyết 6 cánh (Snowflake Bow) -->
    <g>
      <!-- Vòng tròn tâm vàng -->
      <circle cx="88" cy="46" r="22" fill="#D9A63A"/>
      <circle cx="88" cy="44" r="22" fill="#FED136"/>

      <!-- 6 nhánh hoa tuyết tỏa ra từ tâm -->
      <!-- Nhánh đứng -->
      <rect x="86" y="16" width="4" height="56" rx="2" fill="#FED136"/>
      <polygon points="88,14 84,22 92,22" fill="#FED136"/>
      <!-- Nhánh chéo 1 -->
      <g transform="rotate(60 88 44)">
        <rect x="86" y="16" width="4" height="56" rx="2" fill="#FED136"/>
        <polygon points="88,14 84,22 92,22" fill="#FED136"/>
      </g>
      <!-- Nhánh chéo 2 -->
      <g transform="rotate(120 88 44)">
        <rect x="86" y="16" width="4" height="56" rx="2" fill="#FED136"/>
        <polygon points="88,14 84,22 92,22" fill="#FED136"/>
      </g>

      <!-- Lỗ tròn tâm chuôi chìa khóa -->
      <circle cx="88" cy="44" r="9" fill="#0E203C"/>
      <circle cx="88" cy="44" r="4.5" fill="#FED136"/>
    </g>

    <!-- Thân chìa khóa vàng với vát bóng sẫm #D9A63A -->
    <rect x="83.5" y="68" width="9" height="76" rx="4" fill="#D9A63A"/>
    <rect x="83.5" y="68" width="4.5" height="76" rx="2" fill="#FED136"/>

    <!-- Răng chìa khóa (Bit) hình khối tinh thể góc cạnh sắc nét -->
    <path d="M92 112 L110 112 Q113 112 113 115 L113 122 Q113 125 110 125 L92 125 Z" fill="#D9A63A"/>
    <path d="M92 112 L110 112 Q113 112 113 115 L113 118 L92 118 Z" fill="#FED136"/>

    <path d="M92 130 L106 130 Q109 130 109 133 L109 140 Q109 143 106 143 L92 143 Z" fill="#D9A63A"/>
    <path d="M92 130 L106 130 Q109 130 109 133 L109 136 L92 136 Z" fill="#FED136"/>

    <!-- Chóp đáy chuôi chìa tròn xoe -->
    <circle cx="88" cy="148" r="5" fill="#D9A63A"/>
    <circle cx="88" cy="147" r="3" fill="#FED136"/>
  </g>
</svg>