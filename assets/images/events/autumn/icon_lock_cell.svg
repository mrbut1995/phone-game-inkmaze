<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Bóng tròn màu nâu ấm mềm bên dưới -->
  <ellipse cx="88" cy="148" rx="46" ry="14" fill="#5A2A0C" opacity="0.45"/>

  <!-- 2 chiếc lá khô cài phía sau ổ khóa (Tucked dry leaves) -->
  <g>
    <!-- Lá phong cam bên trái -->
    <path d="M46 64 L50 67 L53 62 L52 69 L58 68 L54 73 L57 77 L51 75 L50 79 L48 74 L43 76 L45 72 L41 68 L47 68 Z" fill="#E27017" transform="rotate(-18 46 64)"/>
    <!-- Lá sồi đỏ bên phải -->
    <path d="M124 60 Q130 54 136 60 Q140 66 134 71 Q128 75 124 71 Q118 66 124 60 Z" fill="#B83020" transform="rotate(22 124 60)"/>
  </g>

  <!-- Quai khóa thép sáng màu #E8C98A -->
  <path d="M64 80 V52 A24 24 0 0 1 112 52 V80" fill="none" stroke="#E8C98A" stroke-width="14" stroke-linecap="round"/>
  <!-- Điểm nhấn vát sáng trên đỉnh quai khóa -->
  <path d="M72 43 A20 20 0 0 1 104 43" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Thân khóa đồng chunky #C98A2B -->
  <rect x="48" y="78" width="80" height="62" rx="14" fill="#A86F1D"/>
  <rect x="48" y="74" width="80" height="62" rx="14" fill="#C98A2B"/>

  <!-- Gờ sáng trên đỉnh thân khóa -->
  <path d="M62 74 Q48 74 48 88 L48 91 Q48 77 62 77 L114 77 Q128 77 128 91 L128 88 Q128 74 114 74 Z" fill="#E0A748"/>

  <!-- Băng đáy tối màu #8A5A1C -->
  <path d="M48 112 Q48 136 72 136 L104 136 Q128 136 128 112 L128 106 L48 106 Z" fill="#8A5A1C"/>

  <!-- Lỗ khóa hình giọt nước Deep Brown #280E01 -->
  <circle cx="88" cy="101" r="6.5" fill="#280E01"/>
  <polygon points="84.5,102 91.5,102 89.5,120 86.5,120" fill="#280E01"/>
</svg>