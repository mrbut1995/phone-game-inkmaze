<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#DCA36E"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#FFE3BD"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFF2DF"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#FFCD98"/>

  <!-- Đĩa trung tâm màu xám nâu desaturated #7D6452 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#423226"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#7D6452"/>

  <!-- Gốc cây mùa đông lạnh / cửa đóng -->
  <g fill="#423226">
    <path d="M64 120 L68 76 Q76 72 88 72 Q100 72 108 76 L112 120 Q122 124 126 126 L50 126 Q54 124 64 120 Z"/>
    <circle cx="88" cy="84" r="5" fill="#2E2219"/>
    <!-- Cửa chính tối sầm -->
    <path d="M82 100 Q88 94 94 100 L94 122 L82 122 Z" fill="#2E2219"/>
  </g>

  <!-- 2 thanh gỗ bắt chéo chắn cửa (Crossed wooden planks) -->
  <polygon points="76,104 98,118 96,121 74,107" fill="#6B4B32"/>
  <polygon points="74,117 96,103 98,106 76,120" fill="#573C27"/>

  <!-- Ổ khóa đồng nhỏ ở tâm cửa -->
  <g transform="translate(88 112)">
    <!-- Quai khóa thép sáng -->
    <path d="M-5 -3 V-8 A5 5 0 0 1 5 -8 V-3" fill="none" stroke="#E8C98A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Thân khóa đồng -->
    <rect x="-7" y="-3" width="14" height="11" rx="2.5" fill="#C98A2B"/>
    <circle cx="0" cy="2" r="1.3" fill="#280E01"/>
  </g>
</svg>