<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505 508" width="505" height="508">
  <defs>
    <!-- Đổ bóng màu nâu ấm mềm dưới khay gỗ -->
    <filter id="autumn-board-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1A0700" flood-opacity="0.65"/>
    </filter>
    <filter id="gold-sparkle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Bóng đổ toàn khung -->
  <g filter="url(#autumn-board-shadow)">
    <!-- Viền mỏng Pumpkin Orange #E27017 -->
    <rect x="15" y="14" width="475" height="478" rx="26" fill="#E27017"/>
    <!-- Thân khay gỗ màu Warm Brown #5A2A0C -->
    <rect x="17.5" y="16.5" width="470" height="473" rx="24" fill="#5A2A0C"/>
    <!-- Gờ sáng trên đỉnh tạo độ dày thớ gỗ -->
    <path d="M42 16.5 Q17.5 16.5 17.5 41 L17.5 46 Q17.5 22 42 22 L463 22 Q487.5 22 487.5 46 L487.5 41 Q487.5 16.5 463 16.5 Z" fill="#753811"/>
  </g>

  <!-- LÒNG BÀN CỜ 5x5: Deep Brown #280E01 (440x440 chuẩn vuông, ~87% chiều rộng) -->
  <rect x="32.5" y="38" width="440" height="440" rx="14" fill="#1C0900"/>
  <rect x="32.5" y="38" width="440" height="440" rx="14" fill="#280E01"/>
  <!-- Vát bóng chìm mép trong khay -->
  <rect x="32.5" y="38" width="440" height="5" fill="#140600" opacity="0.6"/>

  <!-- HÀNG LÁ MÙA THU DỌC CẠNH TRÊN (Lá phong & lá sồi: Cam, Đỏ, Vàng) -->
  <g>
    <!-- Nhóm lá bên trái -->
    <!-- Lá phong đỏ #B83020 -->
    <path d="M48 24 L52 27 L56 22 L55 28 L62 28 L57 32 L60 36 L54 34 L52 38 L50 33 L44 35 L47 31 L42 27 L49 27 Z" fill="#B83020"/>
    <!-- Lá sồi cam #E27017 -->
    <path d="M85 24 Q90 20 95 24 Q98 28 94 32 Q90 35 86 32 Q82 28 85 24 Z" fill="#E27017"/>
    <!-- Lá phong vàng #F4AC3D -->
    <path d="M120 22 L124 25 L128 20 L127 26 L134 26 L129 30 L132 34 L126 32 L124 36 L122 31 L116 33 L119 29 L114 25 L121 25 Z" fill="#F4AC3D"/>
    <!-- Lá sồi đỏ sẫm #AE311B -->
    <path d="M158 25 Q163 21 168 25 Q171 29 167 33 Q163 36 159 33 Q155 29 158 25 Z" fill="#AE311B"/>
    <!-- Lá vàng nhỏ -->
    <path d="M196 23 L200 26 L204 21 L203 27 L210 27 L205 31 L208 35 L202 33 L200 37 L198 32 L192 34 L195 30 L190 26 L197 26 Z" fill="#F7B13F"/>

    <!-- Nhóm lá bên phải -->
    <path d="M298 23 L302 26 L306 21 L305 27 L312 27 L307 31 L310 35 L304 33 L302 37 L300 32 L294 34 L297 30 L292 26 L299 26 Z" fill="#F7B13F"/>
    <path d="M336 25 Q341 21 346 25 Q349 29 345 33 Q341 36 337 33 Q333 29 336 25 Z" fill="#AE311B"/>
    <path d="M374 22 L378 25 L382 20 L381 26 L388 26 L383 30 L386 34 L380 32 L378 36 L376 31 L370 33 L373 29 L368 25 L375 25 Z" fill="#F4AC3D"/>
    <path d="M412 24 Q417 20 422 24 Q425 28 421 32 Q417 35 413 32 Q409 28 412 24 Z" fill="#E27017"/>
    <path d="M448 24 L452 27 L456 22 L455 28 L462 28 L457 32 L460 36 L454 34 L452 38 L450 33 L444 35 L447 31 L442 27 L449 27 Z" fill="#B83020"/>
  </g>

  <!-- Sparkle vàng ấm ở tâm đỉnh giữa -->
  <g filter="url(#gold-sparkle-glow)">
    <path d="M252.5 12 Q252.5 21 245 21 Q252.5 21 252.5 30 Q252.5 21 260 21 Q252.5 21 252.5 12 Z" fill="#F4AC3D"/>
    <circle cx="252.5" cy="21" r="2" fill="#FFE3BD"/>
  </g>

  <!-- Góc dưới trái: Nấm đốm đỏ & 2 hạt dẻ xinh xắn -->
  <g transform="translate(36 462)">
    <!-- Cây nấm đốm đỏ -->
    <path d="M12 14 L12 24 L8 24 L8 14 Z" fill="#FFE3BD"/>
    <path d="M2 14 C2 6 18 6 18 14 Z" fill="#B83020"/>
    <circle cx="6" cy="10" r="1.5" fill="#FFE3BD"/>
    <circle cx="14" cy="10" r="1.2" fill="#FFE3BD"/>
    <circle cx="10" cy="8" r="1.2" fill="#FFE3BD"/>
    <!-- Hạt dẻ 1 -->
    <g transform="translate(24 10) rotate(15)">
      <path d="M2 4 C2 0 10 0 10 4 Z" fill="#5A2A0C"/>
      <path d="M2 4 C2 10 10 10 10 4 Z" fill="#E27017"/>
    </g>
    <!-- Hạt dẻ 2 -->
    <g transform="translate(34 14) rotate(-20)">
      <path d="M2 3 C2 0 8 0 8 3 Z" fill="#5A2A0C"/>
      <path d="M2 3 C2 8 8 8 8 3 Z" fill="#E27017"/>
    </g>
  </g>

  <!-- Góc dưới phải: Nấm đốm đỏ & hạt dẻ đối xứng -->
  <g transform="translate(432 462)">
    <!-- Hạt dẻ 1 -->
    <g transform="translate(0 14) rotate(20)">
      <path d="M2 3 C2 0 8 0 8 3 Z" fill="#5A2A0C"/>
      <path d="M2 3 C2 8 8 8 8 3 Z" fill="#E27017"/>
    </g>
    <!-- Hạt dẻ 2 -->
    <g transform="translate(10 10) rotate(-15)">
      <path d="M2 4 C2 0 10 0 10 4 Z" fill="#5A2A0C"/>
      <path d="M2 4 C2 10 10 10 10 4 Z" fill="#E27017"/>
    </g>
    <!-- Cây nấm đốm đỏ -->
    <path d="M26 14 L26 24 L22 24 L22 14 Z" fill="#FFE3BD"/>
    <path d="M16 14 C16 6 32 6 32 14 Z" fill="#B83020"/>
    <circle cx="20" cy="10" r="1.5" fill="#FFE3BD"/>
    <circle cx="28" cy="10" r="1.2" fill="#FFE3BD"/>
    <circle cx="24" cy="8" r="1.2" fill="#FFE3BD"/>
  </g>
</svg>