<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn 340x504 -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Chuông vàng kim loại 3D -->
    <radialGradient id="bellGold" cx="35%" cy="30%" r="65%">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="0.4" stop-color="#FFD54F"/>
      <stop offset="0.8" stop-color="#FF9800"/>
      <stop offset="1" stop-color="#C66900"/>
    </radialGradient>

    <!-- Mũi cà chua chú hề bóng 3D -->
    <radialGradient id="clownNose" cx="35%" cy="30%" r="65%">
      <stop offset="0" stop-color="#FF8DA1"/>
      <stop offset="0.4" stop-color="#FF1744"/>
      <stop offset="1" stop-color="#B70028"/>
    </radialGradient>

    <!-- Độ bóng 3D mặt cười -->
    <radialGradient id="faceShade" cx="35%" cy="30%" r="65%">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="0.6" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#FFCA28"/>
    </radialGradient>

    <!-- Mẫu quả chuông vàng lục lạc -->
    <g id="jester_bell">
      <circle cx="0" cy="0" r="9" fill="url(#bellGold)"/>
      <ellipse cx="-2.5" cy="-2.5" rx="3" ry="1.8" fill="#FFFFFF" opacity="0.65"/>
      <path d="M -5 3 L 5 3 M 0 3 L 0 7" stroke="#8D4F00" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="0" cy="3" r="1.5" fill="#8D4F00"/>
    </g>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- 1. DÂY CỜ TAM GIÁC LỄ HỘI -->
    <g opacity="0.85">
      <path d="M -10 65 Q 85 85 180 70 Q 260 58 350 72" stroke="#3B0A45" stroke-width="1.8" fill="none"/>
      <polygon points="15,69 35,72 25,95" fill="#E91E63"/>
      <polygon points="50,75 70,77 60,100" fill="#00BCD4"/>
      <polygon points="85,78 105,79 95,103" fill="#FFC107"/>
      <polygon points="120,77 140,76 130,100" fill="#7C3AED"/>
      <polygon points="155,73 175,70 165,94" fill="#FF5722"/>
      <polygon points="210,65 230,62 220,86" fill="#00BCD4"/>
      <polygon points="245,61 265,60 255,84" fill="#E91E63"/>
      <polygon points="280,62 300,64 290,88" fill="#FFC107"/>
    </g>

    <!-- 2. DẢI RUY-BĂNG XOẮN 3D BÊN TRÁI -->
    <path d="M 18 100 Q 30 115 16 130 Q 32 145 20 160 Q 34 175 22 190" 
          stroke="#7C3AED" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 20 102 Q 32 117 18 132 Q 34 147 22 162 Q 36 177 24 192" 
          stroke="#C4B5FD" stroke-width="1.8" fill="none" opacity="0.6"/>

    <!-- 3. MẶT CƯỜI HỀ TINH NGHỊCH -->
    <g transform="translate(72, 165)">
      <circle r="28" fill="url(#faceShade)" stroke="#3B0A45" stroke-width="2.5"/>
      <path d="M -14 -6 A 5 5 0 0 1 -4 -6" fill="none" stroke="#3B0A45" stroke-width="3" stroke-linecap="round"/>
      <circle cx="10" cy="-6" r="3.5" fill="#3B0A45"/>
      <circle cx="11.5" cy="-7.5" r="1.2" fill="#FFFFFF"/>
      <circle cx="0" cy="2" r="7" fill="url(#clownNose)"/>
      <path d="M -15 8 Q 0 24 15 8" fill="#3B0A45" stroke="#3B0A45" stroke-width="1.5"/>
      <path d="M -6 14 Q 0 24 6 14 Z" fill="#FF4081"/>
      <circle cx="-16" cy="4" r="5" fill="#FF80AB" opacity="0.5"/>
      <circle cx="16" cy="4" r="5" fill="#FF80AB" opacity="0.5"/>
    </g>

    <!-- 4. MŨ CHÚ HỀ BA NGỌN RỰC RỠ -->
    <g transform="translate(225, 145) rotate(8) scale(0.92)">
      <ellipse cx="0" cy="45" rx="52" ry="12" fill="#3B0A45" opacity="0.25"/>

      <!-- Ngọn 1: Hồng cánh sen -->
      <g>
        <path d="M -35 35 C -65 25 -95 -5 -85 -30 C -60 -2 -35 15 -10 35 Z" 
              fill="#E91E63" stroke="#3B0A45" stroke-width="3" stroke-linejoin="round"/>
        <g transform="translate(-86, -30)"><use href="#jester_bell"/></g>
      </g>

      <!-- Ngọn 2: Tím hoàng gia -->
      <g>
        <path d="M -22 35 C -25 -15 -10 -55 0 -62 C 10 -55 25 -15 22 35 Z" 
              fill="#7C3AED" stroke="#3B0A45" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="0,-48 8,-32 0,-16 -8,-32" fill="#FDE68A" opacity="0.9"/>
        <g transform="translate(0, -62)"><use href="#jester_bell"/></g>
      </g>

      <!-- Ngọn 3: Xanh ngọc -->
      <g>
        <path d="M 10 35 C 35 15 60 -2 85 -30 C 95 -5 65 25 35 35 Z" 
              fill="#00BCD4" stroke="#3B0A45" stroke-width="3" stroke-linejoin="round"/>
        <g transform="translate(86, -30)"><use href="#jester_bell"/></g>
      </g>

      <!-- Đai nẹp chân mũ -->
      <rect x="-50" y="32" width="100" height="22" rx="10" fill="#3B0A45"/>
      <g fill="#FDE68A">
        <polygon points="-36,43 -28,35 -20,43 -28,51"/>
        <polygon points="-8,43 0,35 8,43 0,51"/>
        <polygon points="20,43 28,35 36,43 28,51"/>
      </g>
    </g>

    <!-- 5. PHÁO GIẤY CONFETTI & NGÔI SAO LẤP LÁNH -->
    <rect x="135" y="105" width="12" height="12" rx="2" fill="#E91E63" transform="rotate(25 141 111)"/>
    <rect x="295" y="115" width="13" height="13" rx="2" fill="#00BCD4" transform="rotate(45 301 121)"/>
    <circle cx="150" cy="148" r="6.5" fill="#FFD54F"/>
    <circle cx="310" cy="175" r="5.5" fill="#E91E63"/>
    <polygon points="120,185 128,193 118,200" fill="#7C3AED"/>
    <polygon points="280,85 292,89 284,98" fill="#FF5722"/>

    <path d="M 180 170 Q 180 176 186 176 Q 180 176 180 182 Q 180 176 174 176 Q 180 176 180 170 Z" fill="#FFFFFF"/>
    <path d="M 45 110 Q 45 115 50 115 Q 45 115 45 120 Q 45 115 40 115 Q 45 115 45 110 Z" fill="#FFFFFF"/>

    <!-- 6. HAI CHUÔNG NHỎ ĐIỂM XUYẾT MÉP VIỀN -->
    <g transform="translate(18, 245) scale(0.65)"><use href="#jester_bell"/></g>
    <g transform="translate(322, 238) scale(0.65)"><use href="#jester_bell"/></g>
  </g>
</svg>