<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="key-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 40-degree tilted golden key centered -->
  <g transform="translate(88, 88) rotate(40)">
    <!-- Warm glow -->
    <g fill="#FFD567" opacity="0.4" filter="url(#key-glow)">
      <circle cx="-28" cy="0" r="22"/>
      <rect x="-14" y="-5" width="60" height="10" rx="3"/>
    </g>

    <!-- Key Body (Amber shading layer) -->
    <circle cx="-28" cy="0" r="20" fill="#E9A93A"/>
    <circle cx="-28" cy="0" r="10" fill="#163237"/>
    <rect x="-14" y="-5" width="58" height="10" rx="3" fill="#E9A93A"/>
    <!-- Teeth -->
    <rect x="28" y="4" width="7" height="15" rx="2" fill="#E9A93A"/>
    <rect x="38" y="4" width="6" height="11" rx="2" fill="#E9A93A"/>

    <!-- Key Top Highlight (Moon Yellow #FFD567) -->
    <circle cx="-29" cy="-1.5" r="18" fill="#FFD567"/>
    <circle cx="-29" cy="-1.5" r="9" fill="#163237"/>
    <rect x="-14" y="-6" width="56" height="7" rx="2.5" fill="#FFD567"/>
    <rect x="27" y="3" width="7" height="14" rx="2" fill="#FFD567"/>
    <rect x="37" y="3" width="6" height="10" rx="2" fill="#FFD567"/>
  </g>

  <!-- Two white-yellow sparkles -->
  <g fill="#FFF3C4">
    <polygon points="125,40 128,48 136,51 128,54 125,62 122,54 114,51 122,48"/>
    <polygon points="52,122 54,127 59,129 54,131 52,136 50,131 45,129 50,127"/>
  </g>
</svg>