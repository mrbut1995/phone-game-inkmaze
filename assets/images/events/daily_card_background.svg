<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Pattern lưới ô ly nhạt -->
    <pattern id="gd" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#163A58" stroke-width="1" opacity="0.07"/>
    </pattern>

    <!-- Nền gradient Card Daily -->
    <linearGradient id="bg_daily" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="0.55" stop-color="#FFF6EC"/>
      <stop offset="1" stop-color="#FFE9E4"/>
    </linearGradient>

    <!-- Clip path bo góc card -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>
  </defs>

  <!-- CHỈ THÂN CARD (340x504). Gờ đáy + bóng đổ do StyleBox "Lip" trong scene vẽ -->
  <g clip-path="url(#cardClip)">
    <rect width="340" height="504" fill="url(#bg_daily)"/>
    <rect width="340" height="504" fill="url(#gd)"/>
    <line x1="14" y1="0" x2="14" y2="504" stroke="#D84444" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- Viền bo đỏ ngoài card -->
  <rect x="1.5" y="1.5" width="337" height="501" rx="27" fill="none" stroke="#D84444" stroke-opacity="0.9" stroke-width="3"/>
</svg>
