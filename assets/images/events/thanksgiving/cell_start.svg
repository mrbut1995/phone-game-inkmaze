<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền Cream -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#DDBB7D"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#FFE3B0"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFF2D6"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#FAD28B"/>

  <!-- Đĩa tròn trung tâm Pumpkin Orange #E37015 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#A84C03"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#E37015"/>
  <path d="M54 33 Q36 33 36 51 L36 54 Q36 36 54 36 L122 36 Q140 36 140 54 L140 51 Q140 33 122 33 Z" fill="#F58B38"/>

  <!-- BIỂN CHỈ DẪN BẰNG GỖ TREO (HANGING WOODEN SIGNPOST) -->
  <g>
    <!-- Trụ cột gỗ dọc màu Dark Brown #5A2A0C -->
    <rect x="83" y="60" width="10" height="64" rx="2" fill="#5A2A0C"/>

    <!-- 2 sợi dây xích treo biển -->
    <line x1="72" y1="64" x2="72" y2="72" stroke="#2B0A01" stroke-width="2"/>
    <line x1="104" y1="64" x2="104" y2="72" stroke="#2B0A01" stroke-width="2"/>

    <!-- Tấm biển gỗ hình mũi tên chỉ sang phải Wood-Brown #864618 -->
    <path d="M60 72 L102 72 L116 84 L102 96 L60 96 Z" fill="#864618"/>
    <!-- Vát gờ sáng trên biển gỗ -->
    <path d="M60 72 L102 72 L116 84 L110 84 L99 75 L60 75 Z" fill="#B06023"/>

    <!-- Hạt dẻ nhỏ dưới chân cột (Acorn) -->
