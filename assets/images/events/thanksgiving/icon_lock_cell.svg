<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Bóng tròn màu Dark Brown mềm bên dưới -->
  <ellipse cx="88" cy="148" rx="46" ry="14" fill="#2B0A01" opacity="0.45"/>

  <!-- Vòng dây thừng và 2 chiếc lá khô cài sau quai khóa (Rope & Dry Leaves) -->
  <g>
    <!-- Vòng dây thừng luồn qua quai -->
    <path d="M58 60 Q48 46 62 44 Q70 42 72 54 Q76 68 58 70" fill="none" stroke="#FFE3B0" stroke-width="4.5" stroke-dasharray="6 3" stroke-linecap="round"/>
    <!-- 2 lá khô cài sau thân khóa -->
    <!-- Lá phong cam bên trái -->
    <path d="M44 64 L48 67 L51 62 L50 69 L56 68 L52 73 L55 77 L49 75 L48 79 L46 74 L41 76 L43 72 L39 68 L45 68 Z" fill="#E37015" transform="rotate(-18 44 64)"/>
    <!-- Lá sồi đỏ bên phải -->
    <path d="M124 60 Q130 54 136 60 Q140 66 134 71 Q128 75 124 71 Q118 66 124 60 Z" fill="#BA3A21" transform="rotate(22 124 60)"/>
  </g>

  <!-- Quai khóa thép sáng màu Light Brass #E8C98A -->
  <path d="M64 80 V52 A24 24 0 0 1 112 52 V80" fill="none" stroke="#E8C98A" stroke-width="14" stroke-linecap="round"/>
  <!-- Điểm nhấn vát sáng trên đỉnh quai -->
  <path d="M72 43 A20 20 0 0 1 104 43" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

  <!-- Thân khóa đồng chunky #C98A2B -->
  <rect x="48" y="78" width="80" height="62" rx="14" fill="#8A5A1C"/>
  <rect x="48" y="74" width="80" height="62" rx="14" fill="#C98A2B"/>

  <!-- Gờ sáng trên thân khóa -->
  <path d="M62 74 Q48 74 48 88 L48 91 Q48 77 62 77 L114 77 Q128 77 128 91 L128 88 Q128 74 114 74 Z" fill="#E8C98A"/>

  <!-- Băng đáy tối màu #8A5A1C -->
  <path d="M48 112 Q48 136 72 136 L104 136 Q128 136 128 112 L128 106 L48 106 Z" fill="#8A5A1C"/>

  <!-- Lỗ khóa hình giọt nước Deep Brown #2B0A01 -->
  <circle cx="88" cy="101" r="6.5" fill="#2B0A01"/>
  <polygon points="84.5,102 91.5,102 89.5,120 86.5,120" fill="#2B0A01"/>
</svg>