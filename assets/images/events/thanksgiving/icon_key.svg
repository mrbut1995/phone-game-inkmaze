<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="key-harvest-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 2 tia lấp lánh màu kem (Cream sparkles) -->
  <path d="M135 38 Q135 48 125 48 Q135 48 135 58 Q135 48 145 48 Q135 48 135 38 Z" fill="#FFE3B0"/>
  <path d="M38 125 Q38 133 30 133 Q38 133 38 141 Q38 133 46 133 Q38 133 38 125 Z" fill="#FFE3B0"/>

  <!-- Chìa khóa vàng xoay nghiêng 40 độ từ tâm -->
  <g transform="translate(88 88) rotate(-40) translate(-88 -88)" filter="url(#key-harvest-glow)">
    <!-- Chuôi chìa khóa: Quả bí ngô tròn màu cam (Pumpkin bow) -->
    <g>
      <!-- Dây leo xoăn màu xanh/nâu trên cuống -->
      <path d="M92 18 Q98 12 94 8 Q88 10 90 16" fill="none" stroke="#5A2A0C" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Cuống quả bí ngô màu Dark Brown -->
      <path d="M86 24 L86 16 L90 16 L90 24 Z" fill="#5A2A0C"/>

      <!-- Quả bí ngô cam Pumpkin Orange #E37015 -->
      <ellipse cx="88" cy="46" r="26" fill="#C95A08"/>
      <ellipse cx="88" cy="44" r="26" fill="#E37015"/>
      <ellipse cx="88" cy="44" rx="18" ry="26" fill="#F58B38"/>
      <ellipse cx="88" cy="44" rx="9" ry="26" fill="#E37015"/>

      <!-- Lỗ tròn tâm quả bí -->
      <circle cx="88" cy="44" r="8" fill="#2B0A01"/>
      <circle cx="88" cy="44" r="4" fill="#FBBB5A"/>
    </g>

    <!-- Thân chìa khóa vàng Golden Yellow với vát bóng sẫm -->
    <rect x="83.5" y="68" width="9" height="76" rx="4" fill="#B87B14"/>
    <rect x="83.5" y="68" width="4.5" height="76" rx="2" fill="#FBBB5A"/>

    <!-- Răng chìa khóa (Bit) góc cạnh kiểu lát gỗ thu hoạch -->
    <path d="M92 112 L110 112 Q113 112 113 115 L113 122 Q113 125 110 125 L92 125 Z" fill="#B87B14"/>
    <path d="M92 112 L110 112 Q113 112 113 115 L113 118 L92 118 Z" fill="#FBBB5A"/>

    <path d="M92 130 L106 130 Q109 130 109 133 L109 140 Q109 143 106 143 L92 143 Z" fill="#B87B14"/>
    <path d="M92 130 L106 130 Q109 130 109 133 L109 136 L92 136 Z" fill="#FBBB5A"/>

    <!-- Chóp đáy chuôi chìa tròn xoe -->
    <circle cx="88" cy="148" r="5" fill="#B87B14"/>
    <circle cx="88" cy="147" r="3" fill="#FBBB5A"/>
  </g>
</svg>