<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="turkey-glow-sel" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#FBBB5A" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Khung bo góc nét đứt màu Golden Yellow #FBBB5A -->
  <rect x="4.5" y="4.5" width="45" height="45" rx="10" fill="none" stroke="#FBBB5A" stroke-width="2.5" stroke-dasharray="5 3.5"/>

  <!-- 2 chân cam nhỏ -->
  <line x1="24" y1="42" x2="24" y2="48" stroke="#E37015" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="42" x2="30" y2="48" stroke="#E37015" stroke-width="2" stroke-linecap="round"/>

  <!-- Đuôi xòe nan quạt phía sau -->
  <g>
    <path d="M27 34 L12 18 C10 21 12 25 16 26 Z" fill="#E37015"/>
    <path d="M27 34 L16 13 C14 16 17 20 21 21 Z" fill="#FBBB5A"/>
    <path d="M27 34 L22 10 C24 8 28 8 29 11 Z" fill="#BA3A21"/>
    <path d="M27 34 L32 10 C34 8 38 10 37 13 Z" fill="#B06023"/>
    <path d="M27 34 L38 13 C41 16 41 20 37 22 Z" fill="#E37015"/>
    <path d="M27 34 L42 18 C44 21 42 25 38 26 Z" fill="#FBBB5A"/>
  </g>

  <!-- Gà tây phóng to nhẹ (scale 1.08), đính sparkle vàng trên đầu và phát sáng rực rỡ -->
  <g transform="translate(27 30) scale(1.08) translate(-27 -30)" filter="url(#turkey-glow-sel)">
    <ellipse cx="27" cy="32" rx="13" ry="11" fill="#BA3A21"/>
    <ellipse cx="27" cy="35" rx="8" ry="6.5" fill="#FFE3B0"/>
    <circle cx="27" cy="23" r="7.5" fill="#BA3A21"/>

    <polygon points="25,24 29,24 27,28" fill="#FBBB5A"/>
    <path d="M28 25 C30 25 31 28 29 30 C28 31 27 29 27 27 Z" fill="#8E2A18"/>

    <circle cx="23.5" cy="22" r="1.5" fill="#2B0A01"/>
    <circle cx="23" cy="21.5" r="0.5" fill="#FFFFFF"/>
    <circle cx="30.5" cy="22" r="1.5" fill="#2B0A01"/>
    <circle cx="30" cy="21.5" r="0.5" fill="#FFFFFF"/>

    <!-- Sparkle vàng nhỏ trên đầu gà tây -->
    <polygon points="27,11 28,13.5 30.5,13.5 28.5,15 29.5,17.5 27,16 24.5,17.5 25.5,15 23.5,13.5 26,13.5" fill="#FBBB5A"/>
  </g>
</svg>