<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch màu tan sẫm #BFA27E -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#917554"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#BFA27E"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#AD8F6C"/>

  <!-- Vài chiếc lá khô ở các góc -->
  <path d="M30 30 Q38 28 40 38 Q30 36 30 30 Z" fill="#BA3A21" opacity="0.65"/>
  <path d="M142 32 Q150 30 152 40 Q142 38 142 32 Z" fill="#E37015" opacity="0.65"/>
  <path d="M32 144 Q40 142 42 152 Q32 150 32 144 Z" fill="#E37015" opacity="0.65"/>
  <path d="M144 142 Q152 140 154 150 Q144 148 144 142 Z" fill="#BA3A21" opacity="0.65"/>

  <!-- Dây thừng hàng hải dày bắt chéo (Crossed thick ropes) -->
  <line x1="24" y1="24" x2="152" y2="152" stroke="#FFE3B0" stroke-width="11" stroke-dasharray="14 6" stroke-linecap="round"/>
  <line x1="152" y1="24" x2="24" y2="152" stroke="#DDBB7D" stroke-width="11" stroke-dasharray="14 6" stroke-linecap="round"/>

  <!-- Bóng tròn sau ổ khóa -->
  <circle cx="88" cy="94" r="32" fill="#2B0A01" opacity="0.65"/>

  <!-- Ổ khóa đồng brass chunky ở trung tâm với lỗ khóa nâu sâu -->
  <g transform="translate(88 88)">
    <!-- Quai khóa thép sáng màu #E8C98A -->
    <path d="M-18 -8 V-24 A18 18 0 0 1 18 -24 V-8" fill="none" stroke="#E8C98A" stroke-width="9" stroke-linecap="round"/>
    <!-- Thân khóa đồng #C98A2B -->
    <rect x="-28" y="-8" width="56" height="46" rx="9" fill="#C98A2B"/>
    <!-- Băng đáy tối màu #8A5A1C -->
    <path d="M-28 17 Q-28 38 -9 38 L9 38 Q28 38 28 17 L28 12 L-28 12 Z" fill="#8A5A1C"/>
    <!-- Lỗ khóa màu Deep Brown #2B0A01 -->
    <circle cx="0" cy="11" r="5" fill="#2B0A01"/>
    <polygon points="-3,12 3,12 2,24 -2,24" fill="#2B0A01"/>
  </g>
</svg>