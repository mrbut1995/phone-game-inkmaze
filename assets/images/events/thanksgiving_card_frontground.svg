<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn 340x504 (rx=28) -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Nền bàn tiệc gỗ ấm áp (Vùng an toàn cho chữ) -->
    <linearGradient id="thanksgivingTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A230F"/>
      <stop offset="0.25" stop-color="#36170A"/>
      <stop offset="0.7" stop-color="#240D05"/>
      <stop offset="1" stop-color="#140602"/>
    </linearGradient>

    <!-- Đổ bóng mặt bàn -->
    <radialGradient id="tableShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#140602" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#140602" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- 1. Mảng mặt bàn tiệc gỗ phía dưới (y: 224/242 -> 504) -->
    <path d="M 0 242 Q 85 224 170 240 T 340 234 L 340 504 L 0 504 Z" fill="url(#thanksgivingTable)"/>

    <!-- 2. Viền gờ nẹp bàn gỗ đón ánh nắng vàng óng ngăn cách -->
    <path d="M 0 242 Q 85 224 170 240 T 340 234" fill="none" stroke="#FFA726" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 0 247 Q 85 229 170 245 T 340 239" fill="none" stroke="#8D4316" stroke-opacity="0.45" stroke-width="1.8"/>

    <!-- 3. Cụm nông sản thu hoạch (bí ngô, bắp ngô, táo đỏ) góc phải mép bàn -->
    <g transform="translate(285, 230)">
      <ellipse cx="0" cy="12" rx="42" ry="10" fill="url(#tableShadow)"/>
      <!-- Quả bí ngô -->
      <g transform="translate(-10, -18) scale(0.85)">
        <path d="M -2 -22 C -2 -32 5 -36 10 -36 C 8 -30 4 -26 3 -22 Z" fill="#4B6B22"/>
        <ellipse cx="-16" cy="2" rx="14" ry="22" fill="#E65100" stroke="#7A2E00" stroke-width="2"/>
        <ellipse cx="16" cy="2" rx="14" ry="22" fill="#E65100" stroke="#7A2E00" stroke-width="2"/>
        <ellipse cx="0" cy="2" rx="16" ry="24" fill="#FF8A1F" stroke="#7A2E00" stroke-width="2"/>
      </g>
      <!-- Bắp ngô nướng -->
      <g transform="translate(24, 0) rotate(18) scale(0.85)">
        <path d="M -8 8 Q -18 -6 -10 -18 Q -4 -8 0 6 Z" fill="#689F38"/>
        <path d="M 8 8 Q 18 -6 10 -18 Q 4 -8 0 6 Z" fill="#7CB342"/>
        <ellipse cx="0" cy="-8" rx="8" ry="20" fill="#FFCA28" stroke="#D48800" stroke-width="1.2"/>
        <path d="M -5 -20 L 5 -20 M -6 -12 L 6 -12 M -6 -4 L 6 -4 M -5 4 L 5 4 M 0 -26 L 0 6" 
              stroke="#B26A00" stroke-width="1.2" opacity="0.6"/>
      </g>
      <!-- Quả táo đỏ -->
      <g transform="translate(-38, 2)">
        <circle cx="0" cy="0" r="9.5" fill="#D32F2F" stroke="#4A1408" stroke-width="1.2"/>
        <ellipse cx="-3" cy="-3" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.45" transform="rotate(-25 -3 -3)"/>
        <path d="M 0 -8 Q 3 -12 6 -11" stroke="#3E2723" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Hạt dẻ rơi cạnh mép bàn bên trái -->
    <g transform="translate(22, 246) scale(0.8)">
      <ellipse cx="0" cy="5" rx="5" ry="7" fill="#8D5220"/>
      <path d="M -6 1 Q 0 -3 6 1 L 5 3 Q 0 0 -5 3 Z" fill="#4E2B08"/>
    </g>
  </g>
</svg>