<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn 340x504 (rx=28) -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Màu mực tím đen nửa dưới (Vùng an toàn cho chữ) -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1257"/>
      <stop offset="1" stop-color="#150827"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- 1. Mảng sàn tiệc mực tím đen phía dưới (y: 228/242 -> 504) -->
    <path d="M 0 242 Q 170 228 340 242 L 340 504 L 0 504 Z" fill="url(#floor)"/>

    <!-- 2. Phần viền cong tím sáng ngăn cách -->
    <path d="M 0 242 Q 170 228 340 242" fill="none" stroke="#B58CFF" stroke-opacity="0.55" stroke-width="3"/>

    <!-- 3. Hai hộp quà đặt trên mặt sàn hai bên -->
    <!-- Hộp quà bên trái -->
    <rect x="14" y="210" width="40" height="30" rx="3" fill="#FF5FA2" stroke="#00000022" stroke-width="1.2"/>
    <rect x="30.5" y="210" width="7" height="30" fill="#FFC83D"/>
    <rect x="14" y="222" width="40" height="6" fill="#FFC83D"/>
    <path d="M 34 210 Q 22 194 20 206 Z M 34 210 Q 46 194 48 206 Z" fill="#FFC83D"/>

    <!-- Hộp quà bên phải -->
    <rect x="286" y="212" width="40" height="30" rx="3" fill="#4DD8E8" stroke="#00000022" stroke-width="1.2"/>
    <rect x="302.5" y="212" width="7" height="30" fill="#FFFFFF"/>
    <rect x="286" y="224" width="40" height="6" fill="#FFFFFF"/>
    <path d="M 306 212 Q 294 196 292 208 Z M 306 212 Q 318 196 320 208 Z" fill="#FFFFFF"/>
  </g>
</svg>