<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn 340x504 -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Hào quang mặt trời thu chiều tà -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8D6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFD67A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF9E42" stop-opacity="0"/>
    </radialGradient>

    <!-- Đồi xa mờ sương -->
    <linearGradient id="distantHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D76E2D"/>
      <stop offset="1" stop-color="#8F3011"/>
    </linearGradient>

    <!-- Thân cây gỗ mùa thu -->
    <linearGradient id="treeTrunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D1D0D"/>
      <stop offset="0.6" stop-color="#5E3119"/>
      <stop offset="1" stop-color="#7D4626"/>
    </linearGradient>

    <!-- Mẫu lá phong 5 thùy chi tiết -->
    <g id="maple_leaf_detailed">
      <path d="M 0 -16 
               C 1 -12, 3 -12, 6 -14 C 5 -10, 8 -8, 12 -11 C 10 -6, 11 -4, 14 -3 
               C 11 0, 11 2, 12 7 C 8 5, 7 6, 5 10 C 3 7, 2 7, 0 9 
               C -2 7, -3 7, -5 10 C -7 6, -8 5, -12 7 C -11 2, -11 0, -14 -3 
               C -11 -4, -10 -6, -12 -11 C -8 -8, -5 -10, -6 -14 C -3 -12, -1 -12, 0 -16 Z" 
            stroke="#000000" stroke-opacity="0.15" stroke-width="0.8"/>
      <line x1="0" y1="-12" x2="0" y2="10" stroke="#000000" stroke-opacity="0.25" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="7" y2="-6" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="-7" y2="-6" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8"/>
      <line x1="0" y1="3" x2="8" y2="3" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8"/>
      <line x1="0" y1="3" x2="-8" y2="3" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8"/>
      <line x1="0" y1="9" x2="0" y2="18" stroke="#4A220D" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- 1. MẶT TRỜI THU & HÀO QUANG ẤM ÁP -->
    <circle cx="245" cy="140" r="95" fill="url(#sunGlow)"/>
    <circle cx="245" cy="140" r="42" fill="#FFF2C6"/>

    <!-- Đàn nhạn di cư về phương Nam -->
    <g stroke="#61260E" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M 38 72 Q 45 64 52 72 M 52 72 Q 59 64 66 72"/>
      <path d="M 76 86 Q 82 79 88 86 M 88 86 Q 94 79 100 86"/>
      <path d="M 112 102 Q 117 96 122 102 M 122 102 Q 127 96 132 102"/>
      <path d="M 52 108 Q 57 103 62 108 M 62 108 Q 67 103 72 108"/>
    </g>

    <!-- Dãy đồi xa nhấp nhô -->
    <path d="M 0 185 Q 85 150 180 175 T 340 165 L 340 260 L 0 260 Z" fill="url(#distantHills)" opacity="0.6"/>
    <path d="M 0 206 Q 95 180 200 198 T 340 190 L 340 260 L 0 260 Z" fill="#993813"/>

    <!-- 2. RỪNG CÂY LÁ PHONG CHI TIẾT ĐA TẦNG -->
    <!-- Rừng cây xa -->
    <g opacity="0.85">
      <path d="M 12 180 Q 28 155 46 180 Q 48 200 14 204 Z" fill="#B33E15"/>
      <path d="M 125 178 Q 148 150 172 178 Q 170 200 128 204 Z" fill="#D45B1C"/>
      <path d="M 230 174 Q 252 145 276 174 Q 272 196 232 198 Z" fill="#B84218"/>
    </g>

    <!-- Cụm cây phong 1 (Góc trái) -->
    <g transform="translate(24, 150)">
      <path d="M 16 90 L 16 48 L 4 32 M 16 52 L 28 36" stroke="url(#treeTrunk)" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="8" cy="36" r="16" fill="#A82810"/>
      <circle cx="28" cy="38" r="15" fill="#B83214"/>
      <circle cx="16" cy="24" r="21" fill="#E6581B"/>
      <circle cx="3" cy="22" r="13" fill="#D94A14"/>
      <circle cx="30" cy="24" r="13" fill="#E06A22"/>
      <circle cx="18" cy="12" r="13" fill="#F7A222"/>
      <circle cx="9" cy="14" r="9" fill="#F5B838"/>
    </g>

    <!-- Cụm cây phong 2 (Cây lớn chính diện & góc phải) -->
    <g transform="translate(196, 134)">
      <path d="M 32 108 L 32 50 L 14 30 M 32 58 L 52 38 M 32 72 L 44 62" stroke="url(#treeTrunk)" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="12" cy="42" r="19" fill="#99230E"/>
      <circle cx="50" cy="44" r="20" fill="#B32F12"/>
      <circle cx="32" cy="32" r="26" fill="#D94313"/>
      <circle cx="8" cy="25" r="17" fill="#E8611C"/>
      <circle cx="54" cy="28" r="18" fill="#EB7223"/>
      <circle cx="32" cy="14" r="20" fill="#F59E1B"/>
      <circle cx="20" cy="8" r="14" fill="#F7BA2C"/>
      <circle cx="44" cy="10" r="14" fill="#F7BA2C"/>
    </g>

    <!-- Cụm cây phụ góc phải ngoài cùng -->
    <g transform="translate(290, 160)">
      <path d="M 12 80 L 12 40 L 4 28 M 12 45 L 20 32" stroke="url(#treeTrunk)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="10" cy="32" r="16" fill="#B83214"/>
      <circle cx="6" cy="18" r="15" fill="#E65E1E"/>
      <circle cx="18" cy="20" r="13" fill="#F5A827"/>
    </g>

    <!-- 3. LÁ PHONG BAY TRONG GIÓ (7 LÁ TRÊN CAO) -->
    <g transform="translate(56, 102) rotate(-25) scale(0.75)" fill="#D93814">
      <use href="#maple_leaf_detailed"/>
    </g>
    <g transform="translate(132, 92) rotate(35) scale(0.65)" fill="#F5A827">
      <use href="#maple_leaf_detailed"/>
    </g>
    <g transform="translate(178, 130) rotate(-15) scale(0.85)" fill="#E85E1A">
      <use href="#maple_leaf_detailed"/>
    </g>
    <g transform="translate(284, 88) rotate(48) scale(0.6)" fill="#B0250E">
      <use href="#maple_leaf_detailed"/>
    </g>
    <g transform="translate(112, 162) rotate(-40) scale(0.7)" fill="#F7BA2C">
      <use href="#maple_leaf_detailed"/>
    </g>
    <g transform="translate(242, 198) rotate(22) scale(0.6)" fill="#D94313">
      <use href="#maple_leaf_detailed"/>
    </g>
    <g transform="translate(74, 186) rotate(60) scale(0.45)" fill="#F5A827">
      <use href="#maple_leaf_detailed"/>
    </g>
  </g>
</svg>