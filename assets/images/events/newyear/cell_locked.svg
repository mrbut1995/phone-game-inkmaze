<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch màu tan sẫm #C7A47B -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#99754C"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#C7A47B"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#B59065"/>

  <!-- Đồng xu vàng nhỏ ở 2 góc -->
  <circle cx="32" cy="32" r="6" fill="#FEB415"/>
  <rect x="30" y="30" width="4" height="4" fill="#630811"/>

  <circle cx="144" cy="144" r="6" fill="#FEB415"/>
  <rect x="142" y="142" width="4" height="4" fill="#630811"/>

  <!-- Nút thắt cát tường đỏ ở trung tâm (Chinese Knot in Festival Red) -->
  <g transform="translate(88 82)">
    <!-- Các vòng lượn của nút thắt -->
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#AE1A16" transform="rotate(45)"/>
    <rect x="-13" y="-13" width="26" height="26" rx="6" fill="#8E1410" transform="rotate(45)"/>
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#FEB415" transform="rotate(45)"/>

    <!-- 2 dải tua rua đỏ buông xuống dưới -->
    <line x1="-6" y1="22" x2="-6" y2="52" stroke="#AE1A16" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="22" x2="6" y2="52" stroke="#AE1A16" stroke-width="4" stroke-linecap="round"/>
    <rect x="-8" y="32" width="4" height="3" fill="#FEB415"/>
    <rect x="4" y="32" width="4" height="3" fill="#FEB415"/>
  </g>

  <!-- Bóng tròn sau ổ khóa -->
  <circle cx="88" cy="94" r="32" fill="#2E0408" opacity="0.65"/>

  <!-- Ổ khóa vàng nhỏ treo từ nút thắt -->
  <g transform="translate(88 88)">
    <!-- Quai khóa thép màu Light Gold #FCD667 -->
    <path d="M-18 -8 V-24 A18 18 0 0 1 18 -24 V-8" fill="none" stroke="#FCD667" stroke-width="9" stroke-linecap="round"/>
    <!-- Thân khóa Gold #FEB415 -->
    <rect x="-28" y="-8" width="56" height="46" rx="9" fill="#FEB415"/>
    <!-- Băng đáy tối màu #C98A0C -->
    <path d="M-28 17 Q-28 38 -9 38 L9 38 Q28 38 28 17 L28 12 L-28 12 Z" fill="#C98A0C"/>
    <!-- Lỗ khóa màu Deep Maroon #630811 -->
    <circle cx="0" cy="11" r="5" fill="#630811"/>
    <polygon points="-3,12 3,12 2,24 -2,24" fill="#630811"/>
  </g>
</svg>