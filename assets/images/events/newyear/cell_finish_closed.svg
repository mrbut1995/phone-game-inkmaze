<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#D9BA7E"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#FFE9B0"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFF4D4"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#FAD78E"/>

  <!-- Đĩa trung tâm màu xám maroon desaturated #543E44 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#291A1E"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#543E44"/>

  <!-- Hũ tài lộc bị niêm phong kín -->
  <g fill="#422E34">
    <ellipse cx="88" cy="116" rx="24" ry="7"/>
    <circle cx="88" cy="104" r="26"/>
    <ellipse cx="88" cy="83" rx="24" ry="6"/>
  </g>

  <!-- Vải niêm phong miệng hũ màu xám đỏ -->
  <path d="M66 82 Q88 78 110 82 L112 90 Q88 94 64 90 Z" fill="#75525B"/>

  <!-- 2 dải giấy đỏ niêm phong bắt chéo (Crossed red paper strips) -->
  <line x1="72" y1="76" x2="104" y2="96" stroke="#8E1410" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="104" y1="76" x2="72" y2="96" stroke="#AE1A16" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Ổ khóa vàng nhỏ niêm phong ở giữa -->
  <g transform="translate(88 86)">
    <path d="M-5 -3 V-8 A5 5 0 0 1 5 -8 V-3" fill="none" stroke="#FCD667" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-7" y="-3" width="14" height="11" rx="2.5" fill="#FEB415"/>
    <circle cx="0" cy="2" r="1.3" fill="#630811"/>
  </g>
</svg>