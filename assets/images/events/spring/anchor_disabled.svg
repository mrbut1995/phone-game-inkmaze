<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <!-- 2 chân tăm nhỏ màu xám -->
  <line x1="24" y1="40" x2="24" y2="46" stroke="#687A72" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="30" y1="40" x2="30" y2="46" stroke="#687A72" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Chim sẻ màu xám xanh #A8B8B0, mắt nhắm buồn ngủ, không phát sáng -->
  <g>
    <path d="M25 15 Q27 10 30 11 Q28 15 26 16 Z" fill="#A8B8B0"/>
    <path d="M28 14 Q32 10 34 13 Q31 16 29 16 Z" fill="#A8B8B0"/>

    <ellipse cx="27" cy="28" rx="14" ry="13" fill="#A8B8B0"/>

    <!-- Mỏ nhạt -->
    <polygon points="38,26 43,28 38,30" fill="#889890"/>

    <!-- Mắt nhắm ngủ lười biếng -->
    <path d="M31.5 24 Q33.5 26 35.5 24" fill="none" stroke="#5D1F34" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Cánh xám nhạt -->
    <ellipse cx="21" cy="29" rx="6.5" ry="4.5" fill="#BFCEC7" transform="rotate(-15 21 29)"/>
  </g>
</svg>