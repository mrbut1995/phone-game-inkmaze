<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505 508" width="505" height="508">
  <defs>
    <!-- Đổ bóng màu maroon mềm dưới khung -->
    <filter id="spring-board-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#240713" flood-opacity="0.75"/>
    </filter>
    <filter id="spring-sparkle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Bóng đổ toàn khung -->
  <g filter="url(#spring-board-shadow)">
    <!-- Viền mỏng Soft Pink #F1A5BF -->
    <rect x="15" y="14" width="475" height="478" rx="26" fill="#F1A5BF"/>
    <!-- Thân khung màu Deep Maroon #5D1F34 -->
    <rect x="17.5" y="16.5" width="470" height="473" rx="24" fill="#5D1F34"/>
    <!-- Gờ sáng trên đỉnh tạo độ dày khối giấy gốm sứ -->
    <path d="M42 16.5 Q17.5 16.5 17.5 41 L17.5 46 Q17.5 22 42 22 L463 22 Q487.5 22 487.5 46 L487.5 41 Q487.5 16.5 463 16.5 Z" fill="#782944"/>
  </g>

  <!-- LÒNG BÀN CỜ 5x5: Very-deep-maroon #3E1224 (440x440 chuẩn vuông, ~87% chiều rộng) -->
  <rect x="32.5" y="38" width="440" height="440" rx="14" fill="#240713"/>
  <rect x="32.5" y="38" width="440" height="440" rx="14" fill="#3E1224"/>
  <!-- Vát bóng chìm mép trong -->
  <rect x="32.5" y="38" width="440" height="5" fill="#18040B" opacity="0.7"/>

  <!-- SPARKLE VÀNG Ở ĐỈNH GIỮA (SUNNY YELLOW #FFDC74) -->
  <g filter="url(#spring-sparkle-glow)">
    <polygon points="252.5,10 256,19 265,19 257.5,25 260.5,34 252.5,28.5 244.5,34 247.5,25 240,19 249,19" fill="#FFDC74"/>
    <circle cx="252.5" cy="23" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- CÀNH HOA ANH ĐÀO VÀ CHÚ CHIM VÀNG GÓC TRÊN TRÁI -->
  <g transform="translate(24 16)">
    <!-- Cành hoa màu Deep Maroon uốn lượn -->
    <path d="M4 8 Q24 22 48 20 Q70 18 92 30" fill="none" stroke="#711B3E" stroke-width="3" stroke-linecap="round"/>
    <path d="M48 20 Q56 12 70 10" fill="none" stroke="#711B3E" stroke-width="2" stroke-linecap="round"/>

    <!-- Lá xanh nhỏ Leaf Green #7DBF81 -->
    <path d="M26 14 Q32 10 34 14 Q30 18 26 14 Z" fill="#7DBF81"/>
    <path d="M68 22 Q72 16 76 20 Q74 24 68 22 Z" fill="#7DBF81"/>
    <path d="M84 22 Q88 18 92 22 Q90 26 84 22 Z" fill="#7DBF81"/>

    <!-- Các bông hoa anh đào 5 cánh hồng Soft Pink / Hot Pink -->
    <!-- Bông 1 -->
    <g transform="translate(18 10)">
      <circle cx="-2.5" cy="-2" r="2.5" fill="#F1A5BF"/><circle cx="2.5" cy="-2" r="2.5" fill="#F1A5BF"/>
      <circle cx="-3.5" cy="2.5" r="2.5" fill="#F1A5BF"/><circle cx="3.5" cy="2.5" r="2.5" fill="#F1A5BF"/>
      <circle cx="0" cy="4" r="2.5" fill="#F1A5BF"/>
      <circle cx="0" cy="1" r="1.3" fill="#FFDC74"/>
    </g>
    <!-- Bông 2 (Hot Pink) -->
    <g transform="translate(42 22)">
      <circle cx="-2.5" cy="-2" r="2.5" fill="#E9729A"/><circle cx="2.5" cy="-2" r="2.5" fill="#E9729A"/>
      <circle cx="-3.5" cy="2.5" r="2.5" fill="#E9729A"/><circle cx="3.5" cy="2.5" r="2.5" fill="#E9729A"/>
      <circle cx="0" cy="4" r="2.5" fill="#E9729A"/>
      <circle cx="0" cy="1" r="1.3" fill="#FFDC74"/>
    </g>
    <!-- Bông 3 -->
    <g transform="translate(90 32)">
      <circle cx="-2.5" cy="-2" r="2.5" fill="#F1A5BF"/><circle cx="2.5" cy="-2" r="2.5" fill="#F1A5BF"/>
      <circle cx="-3.5" cy="2.5" r="2.5" fill="#F1A5BF"/><circle cx="3.5" cy="2.5" r="2.5" fill="#F1A5BF"/>
      <circle cx="0" cy="4" r="2.5" fill="#F1A5BF"/>
      <circle cx="0" cy="1" r="1.3" fill="#FFDC74"/>
    </g>

    <!-- Chú chim vàng nhỏ đậu trên cành (Tiny yellow bird) -->
    <g transform="translate(64 2)">
      <ellipse cx="6" cy="7" rx="5.5" ry="4.5" fill="#FFDC74"/>
      <circle cx="9" cy="5" r="3.5" fill="#FFDC74"/>
      <polygon points="12,5 14.5,6 12,7" fill="#E9729A"/>
      <circle cx="10" cy="4.5" r="0.9" fill="#5D1F34"/>
      <ellipse cx="4" cy="7.5" rx="2.5" ry="1.6" fill="#FFEAA8"/>
      <!-- Chân chim bám cành -->
      <line x1="5" y1="11" x2="5" y2="13" stroke="#711B3E" stroke-width="1"/>
      <line x1="8" y1="11" x2="8" y2="13" stroke="#711B3E" stroke-width="1"/>
    </g>
  </g>

  <!-- CÀNH HOA ANH ĐÀO GÓC TRÊN PHẢI -->
  <g transform="translate(481 16) scale(-1 1)">
    <path d="M4 8 Q24 22 48 20 Q70 18 92 30" fill="none" stroke="#711B3E" stroke-width="3" stroke-linecap="round"/>
    <path d="M48 20 Q56 12 70 10" fill="none" stroke="#711B3E" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 14 Q32 10 34 14 Q30 18 26 14 Z" fill="#7DBF81"/>
    <path d="M68 22 Q72 16 76 20 Q74 24 68 22 Z" fill="#7DBF81"/>
    <g transform="translate(18 10)">
      <circle cx="-2.5" cy="-2" r="2.5" fill="#F1A5BF"/><circle cx="2.5" cy="-2" r="2.5" fill="#F1A5BF"/>
      <circle cx="-3.5" cy="2.5" r="2.5" fill="#F1A5BF"/><circle cx="3.5" cy="2.5" r="2.5" fill="#F1A5BF"/>
      <circle cx="0" cy="4" r="2.5" fill="#F1A5BF"/>
      <circle cx="0" cy="1" r="1.3" fill="#FFDC74"/>
    </g>
    <g transform="translate(42 22)">
      <circle cx="-2.5" cy="-2" r="2.5" fill="#E9729A"/><circle cx="2.5" cy="-2" r="2.5" fill="#E9729A"/>
      <circle cx="-3.5" cy="2.5" r="2.5" fill="#E9729A"/><circle cx="3.5" cy="2.5" r="2.5" fill="#E9729A"/>
      <circle cx="0" cy="4" r="2.5" fill="#E9729A"/>
      <circle cx="0" cy="1" r="1.3" fill="#FFDC74"/>
    </g>
    <g transform="translate(70 8)">
      <circle cx="-2" cy="-1.5" r="2" fill="#F1A5BF"/><circle cx="2" cy="-1.5" r="2" fill="#F1A5BF"/>
      <circle cx="-2.5" cy="2" r="2" fill="#F1A5BF"/><circle cx="2.5" cy="2" r="2" fill="#F1A5BF"/>
      <circle cx="0" cy="3" r="2" fill="#F1A5BF"/>
      <circle cx="0" cy="0.8" r="1" fill="#FFDC74"/>
    </g>
  </g>

  <!-- THẢM CỎ XANH VÀ HOA TULIP DỌC CẠNH ĐÁY -->
  <g fill="#7DBF81">
    <rect x="35" y="482" width="435" height="8" rx="2"/>
    <!-- Cụm cỏ nhọn nhấp nhô -->
    <polygon points="50,482 54,472 58,482 62,470 66,482"/>
    <polygon points="120,482 124,473 128,482 133,468 138,482"/>
    <polygon points="200,482 205,471 210,482 215,469 220,482"/>
    <polygon points="285,482 290,470 295,482 300,468 305,482"/>
    <polygon points="370,482 374,473 378,482 383,471 388,482"/>
    <polygon points="440,482 444,472 448,482 452,470 456,482"/>
  </g>

  <!-- CÁC HOA TULIP HỒNG VÀ VÀNG ĐỨNG XEN KẼ DỌC CỎ -->
  <!-- Tulip hồng trái -->
  <g transform="translate(72 468)">
    <path d="M0 6 L0 14" stroke="#7DBF81" stroke-width="2"/>
    <path d="M-4 6 C-6 0 6 0 4 6 C4 9 -4 9 -4 6 Z" fill="#E9729A"/>
  </g>
  <!-- Tulip vàng trái -->
  <g transform="translate(150 466)">
    <path d="M0 6 L0 16" stroke="#7DBF81" stroke-width="2"/>
    <path d="M-4 6 C-6 0 6 0 4 6 C4 9 -4 9 -4 6 Z" fill="#FFDC74"/>
  </g>
  <!-- Tulip hồng giữa -->
  <g transform="translate(240 467)">
    <path d="M0 6 L0 15" stroke="#7DBF81" stroke-width="2"/>
    <path d="M-4 6 C-6 0 6 0 4 6 C4 9 -4 9 -4 6 Z" fill="#F1A5BF"/>
  </g>
  <!-- Tulip vàng phải -->
  <g transform="translate(330 466)">
    <path d="M0 6 L0 16" stroke="#7DBF81" stroke-width="2"/>
    <path d="M-4 6 C-6 0 6 0 4 6 C4 9 -4 9 -4 6 Z" fill="#FFDC74"/>
  </g>
  <!-- Tulip hồng phải -->
  <g transform="translate(415 468)">
    <path d="M0 6 L0 14" stroke="#7DBF81" stroke-width="2"/>
    <path d="M-4 6 C-6 0 6 0 4 6 C4 9 -4 9 -4 6 Z" fill="#E9729A"/>
  </g>

  <!-- BƯỚM NHỎ XINH Ở GÓC DƯỚI PHẢI (BUTTERFLY) -->
  <g transform="translate(452 452) rotate(-15)">
    <!-- Cánh bướm hồng Hot Pink #E9729A & Soft Pink -->
    <ellipse cx="-4" cy="-4" rx="4.5" ry="3.5" fill="#E9729A" transform="rotate(-30 -4 -4)"/>
    <ellipse cx="4" cy="-4" rx="4.5" ry="3.5" fill="#E9729A" transform="rotate(30 4 -4)"/>
    <ellipse cx="-3" cy="2" rx="3.5" ry="2.5" fill="#F1A5BF" transform="rotate(20 -3 2)"/>
    <ellipse cx="3" cy="2" rx="3.5" ry="2.5" fill="#F1A5BF" transform="rotate(-20 3 2)"/>
    <circle cx="0" cy="-1" r="1.3" fill="#5D1F34"/>
  </g>
</svg>