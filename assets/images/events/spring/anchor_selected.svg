<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="bird-glow-sel" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#FFDC74" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Vòng bo viền nét đứt màu Hot Pink #E9729A -->
  <rect x="4.5" y="4.5" width="45" height="45" rx="10" fill="none" stroke="#E9729A" stroke-width="2.5" stroke-dasharray="5 3.5"/>

  <!-- 2 chân tăm nhỏ -->
  <line x1="24" y1="40" x2="24" y2="46" stroke="#711B3E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="30" y1="40" x2="30" y2="46" stroke="#711B3E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Chim sẻ phóng to nhẹ (scale 1.08), cài bông hoa đào nhỏ trên đầu và phát sáng rực rỡ -->
  <g transform="translate(27 28) scale(1.08) translate(-27 -28)" filter="url(#bird-glow-sel)">
    <path d="M25 15 Q27 10 30 11 Q28 15 26 16 Z" fill="#FFDC74"/>
    <path d="M28 14 Q32 10 34 13 Q31 16 29 16 Z" fill="#FFDC74"/>

    <ellipse cx="27" cy="28" rx="14" ry="13" fill="#FFDC74"/>

    <polygon points="38,26 44,28 38,30" fill="#E9729A"/>

    <circle cx="33" cy="24" r="1.8" fill="#5D1F34"/>
    <circle cx="33.5" cy="23.5" r="0.6" fill="#FFFFFF"/>

    <ellipse cx="29" cy="28" rx="2.2" ry="1.4" fill="#F1A5BF" opacity="0.7"/>

    <ellipse cx="21" cy="29" rx="6.5" ry="4.5" fill="#FFEAA8" transform="rotate(-15 21 29)"/>

    <!-- Bông hoa đào hồng nhỏ cài trên đầu chim (Tiny pink blossom) -->
    <g transform="translate(24 14)">
      <circle cx="-2" cy="-1.5" r="1.8" fill="#E9729A"/><circle cx="2" cy="-1.5" r="1.8" fill="#E9729A"/>
      <circle cx="-2.5" cy="2" r="1.8" fill="#E9729A"/><circle cx="2.5" cy="2" r="1.8" fill="#E9729A"/>
      <circle cx="0" cy="2.8" r="1.8" fill="#E9729A"/>
      <circle cx="0" cy="0.6" r="1" fill="#FFDC74"/>
    </g>
  </g>
</svg>