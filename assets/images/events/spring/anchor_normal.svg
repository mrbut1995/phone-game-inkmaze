<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="bird-warm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FFDC74" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 2 chân tăm nhỏ -->
  <line x1="24" y1="40" x2="24" y2="46" stroke="#711B3E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="30" y1="40" x2="30" y2="46" stroke="#711B3E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Chim sẻ nhỏ phát sáng ấm mềm -->
  <g filter="url(#bird-warm-glow)">
    <!-- Chỏm lông tơ trên đỉnh đầu -->
    <path d="M25 15 Q27 10 30 11 Q28 15 26 16 Z" fill="#FFDC74"/>
    <path d="M28 14 Q32 10 34 13 Q31 16 29 16 Z" fill="#FFDC74"/>

    <!-- Thân chim mập tròn Sunny Yellow #FFDC74 -->
    <ellipse cx="27" cy="28" rx="14" ry="13" fill="#FFDC74"/>

    <!-- Mỏ cam nhỏ nhọn quay sang phải -->
    <polygon points="38,26 44,28 38,30" fill="#E9729A"/>

    <!-- Mắt tròn màu Dark Maroon #5D1F34 có đốm sáng trắng -->
    <circle cx="33" cy="24" r="1.8" fill="#5D1F34"/>
    <circle cx="33.5" cy="23.5" r="0.6" fill="#FFFFFF"/>

    <!-- Má hồng phớt mềm mại -->
    <ellipse cx="29" cy="28" rx="2.2" ry="1.4" fill="#F1A5BF" opacity="0.6"/>

    <!-- Cánh nhỏ xinh màu vàng nhạt hơn trên thân -->
    <ellipse cx="21" cy="29" rx="6.5" ry="4.5" fill="#FFEAA8" transform="rotate(-15 21 29)"/>
  </g>
</svg>