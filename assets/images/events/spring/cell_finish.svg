<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="sakura-tree-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Gạch nền -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#DEB8C8"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#FBE0EA"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFF2F7"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#F4CFDD"/>

  <!-- Đĩa tròn trung tâm Leaf Green #7DBF81 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#4B8550"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#7DBF81"/>

  <!-- Vầng sáng vàng ấm sau tán cây (Sunny Yellow glow) -->
  <circle cx="88" cy="74" r="32" fill="#FFDC74" opacity="0.38" filter="url(#sakura-tree-glow)"/>

  <!-- CÂY HOA ANH ĐÀO NỞ RỘ (CHERRY BLOSSOM TREE IN FULL BLOOM) -->
  <g>
    <!-- Gốc và thân cây màu Maroon #711B3E với nhánh chạc vươn lên -->
    <path d="M84 126 L86 96 L76 80 L80 78 L88 92 L96 78 L100 80 L90 96 L92 126 Z" fill="#5D1F34"/>

    <!-- Tán hoa tròn bồng bềnh màu hồng phấn Soft Pink #F1A5BF -->
    <circle cx="88" cy="70" r="26" fill="#F1A5BF"/>
    <circle cx="72" cy="72" r="18" fill="#F1A5BF"/>
    <circle cx="104" cy="72" r="18" fill="#F1A5BF"/>
    <circle cx="88" cy="56" r="18" fill="#F1A5BF"/>

    <!-- Các đóa hoa anh đào 5 cánh nở rực rỡ điểm xuyết trên tán (Hot Pink) -->
    <g transform="translate(88 64)">
      <circle cx="-2.5" cy="-2" r="2.5" fill="#E9729A"/><circle cx="2.5" cy="-2" r="2.5" fill="#E9729A"/>
      <circle cx="-3.5" cy="2.5" r="2.5" fill="#E9729A"/><circle cx="3.5" cy="2.5" r="2.5" fill="#E9729A"/>
      <circle cx="0" cy="4" r="2.5" fill="#E9729A"/>
      <circle cx="0" cy="1" r="1.3" fill="#FFDC74"/>
    </g>
    <g transform="translate(74 74)">
      <circle cx="-2" cy="-1.5" r="2" fill="#E9729A"/><circle cx="2" cy="-1.5" r="2" fill="#E9729A"/>
      <circle cx="-2.5" cy="2" r="2" fill="#E9729A"/><circle cx="2.5" cy="2" r="2" fill="#E9729A"/>
      <circle cx="0" cy="3" r="2" fill="#E9729A"/>
      <circle cx="0" cy="0.8" r="1" fill="#FFDC74"/>
    </g>
    <g transform="translate(102 74)">
      <circle cx="-2" cy="-1.5" r="2" fill="#E9729A"/><circle cx="2" cy="-1.5" r="2" fill="#E9729A"/>
      <circle cx="-2.5" cy="2" r="2" fill="#E9729A"/><circle cx="2.5" cy="2" r="2" fill="#E9729A"/>
      <circle cx="0" cy="3" r="2" fill="#E9729A"/>
      <circle cx="0" cy="0.8" r="1" fill="#FFDC74"/>
    </g>
  </g>

  <!-- Cánh hoa rơi lả tả & tia lấp lánh (Falling petals & sparkles) -->
  <path d="M60 96 C64 92 68 98 62 102 C58 104 56 98 60 96 Z" fill="#E9729A"/>
  <path d="M116 102 C120 98 124 104 118 108 C114 110 112 104 116 102 Z" fill="#F1A5BF"/>
  <polygon points="112,50 113.5,53 116.5,53 114,55 115,58 112,56 109,58 110,55 107.5,53 110.5,53" fill="#FFDC74"/>
</svg>