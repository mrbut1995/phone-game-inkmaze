<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền Blush -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#DEB8C8"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#FBE0EA"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFF2F7"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#F4CFDD"/>

  <!-- Đĩa tròn trung tâm Sunny Yellow #FFDC74 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#D4A730"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#FFDC74"/>
  <path d="M54 33 Q36 33 36 51 L36 54 Q36 36 54 36 L122 36 Q140 36 140 54 L140 51 Q140 33 122 33 Z" fill="#FFEAA8"/>

  <!-- ĐÔI ỦNG ĐI MƯA MÀU VÀNG CHẤM BI MAROON (POLKA-DOT RAIN BOOTS) -->
  <!-- Ủng phía sau (chân phải) -->
  <g transform="translate(90 68)">
    <rect x="0" y="0" width="18" height="32" rx="4" fill="#D9A63A"/>
    <path d="M0 24 L24 24 Q30 24 30 36 L0 36 Z" fill="#D9A63A"/>
    <rect x="-2" y="0" width="22" height="6" rx="2" fill="#5D1F34"/>
  </g>

  <!-- Ủng phía trước (chân trái) màu Sunny Yellow rực rỡ -->
  <g transform="translate(68 76)">
    <!-- Ống ủng -->
    <rect x="0" y="0" width="20" height="34" rx="4" fill="#FFDC74"/>
    <!-- Mũi & đế ủng -->
    <path d="M0 26 L26 26 Q34 26 34 38 L0 38 Z" fill="#FFDC74"/>
    <!-- Cổ ủng nẹp màu Deep Maroon -->
    <rect x="-2" y="0" width="24" height="6" rx="2" fill="#5D1F34"/>
    <!-- Đế ủng răng cưa dày dặn -->
    <rect x="0" y="36" width="34" height="4" rx="1" fill="#711B3E"/>

    <!-- Các chấm bi màu Deep Maroon #5D1F34 -->
    <circle cx="6" cy="12" r="2.2" fill="#5D1F34"/>
    <circle cx="14" cy="14" r="2.2" fill="#5D1F34"/>
    <circle cx="8" cy="22" r="2.2" fill="#5D1F34"/>
    <circle cx="16" cy="24" r="2.2" fill="#5D1F34"/>
    <circle cx="24" cy="32" r="2.2" fill="#5D1F34"/>
  </g>

  <!-- Bụi cỏ xanh và đóa hoa tulip hồng nhỏ bên cạnh -->
  <g transform="translate(112 104)">
    <!-- Cỏ Leaf Green -->
    <polygon points="0,18 4,8 8,18 12,6 16,18" fill="#7DBF81"/>
    <!-- Hoa tulip hồng xinh -->
    <path d="M22 18 L22 8" stroke="#7DBF81" stroke-width="2"/>
    <path d="M18 8 C16 2 28 2 26 8 C26 11 18 11 18 8 Z" fill="#E9729A"/>
  </g>
</svg>