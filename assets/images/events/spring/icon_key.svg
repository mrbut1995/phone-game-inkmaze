<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="key-spring-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 2 tia lấp lánh màu trắng (Sparkles) -->
  <path d="M135 38 Q135 48 125 48 Q135 48 135 58 Q135 48 145 48 Q135 48 135 38 Z" fill="#FFFFFF"/>
  <path d="M38 125 Q38 133 30 133 Q38 133 38 141 Q38 133 46 133 Q38 133 38 125 Z" fill="#FFFFFF"/>

  <!-- Chìa khóa vàng xoay nghiêng 40 độ từ tâm -->
  <g transform="translate(88 88) rotate(-40) translate(-88 -88)" filter="url(#key-spring-glow)">
    <!-- Chuôi chìa khóa: Hoa Anh Đào 5 cánh (Cherry Blossom Bow) -->
    <g>
      <!-- 5 cánh hoa màu Hot Pink #E9729A -->
      <circle cx="88" cy="22" r="14" fill="#E9729A"/>
      <circle cx="110" cy="38" r="14" fill="#E9729A"/>
      <circle cx="102" cy="64" r="14" fill="#E9729A"/>
      <circle cx="74" cy="64" r="14" fill="#E9729A"/>
      <circle cx="66" cy="38" r="14" fill="#E9729A"/>

      <!-- Tâm hoa vàng Sunny Yellow #FFDC74 -->
      <circle cx="88" cy="46" r="12" fill="#FFDC74"/>
      <!-- Lỗ tròn tâm chìa khóa -->
      <circle cx="88" cy="46" r="6" fill="#5D1F34"/>
      <circle cx="88" cy="46" r="3" fill="#FFDC74"/>
    </g>

    <!-- Thân chìa khóa vàng với vát bóng vàng sẫm #E0B840 -->
    <rect x="83.5" y="68" width="9" height="76" rx="4" fill="#E0B840"/>
    <rect x="83.5" y="68" width="4.5" height="76" rx="2" fill="#FFDC74"/>

    <!-- Răng chìa khóa (Bit) góc cạnh sắc nét, xinh xắn -->
    <path d="M92 112 L110 112 Q113 112 113 115 L113 122 Q113 125 110 125 L92 125 Z" fill="#E0B840"/>
    <path d="M92 112 L110 112 Q113 112 113 115 L113 118 L92 118 Z" fill="#FFDC74"/>

    <path d="M92 130 L106 130 Q109 130 109 133 L109 140 Q109 143 106 143 L92 143 Z" fill="#E0B840"/>
    <path d="M92 130 L106 130 Q109 130 109 133 L109 136 L92 136 Z" fill="#FFDC74"/>

    <!-- Chóp đáy chuôi chìa tròn xoe -->
    <circle cx="88" cy="148" r="5" fill="#E0B840"/>
    <circle cx="88" cy="147" r="3" fill="#FFDC74"/>
  </g>
</svg>