    <circle cx="33" cy="24" r="1.8" fill="#5D1F34"/>
    <circle cx="33.5" cy="23.5" r="0.6" fill="#FFFFFF"/>

    <ellipse cx="29" cy="28" rx="2.2" ry="1.4" fill="#F1A5BF" opacity="0.6"/>

