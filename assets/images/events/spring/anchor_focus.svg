  <!-- 2 chân tăm nhỏ -->
  <line x1="24" y1="40" x2="24" y2="46" stroke="#711B3E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="30" y1="40" x2="30" y2="46" stroke="#711B3E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Chim sẻ phát sáng mềm êm dịu -->
