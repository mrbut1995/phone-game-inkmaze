      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#7DBF81" flood-opacity="0.75"/>
    </filter>
  </defs>
  <!-- Vòng vuông bo góc nét đứt màu Leaf Green #7DBF81 -->
