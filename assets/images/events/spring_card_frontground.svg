<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn 340x504 (rx=28) -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Đồng cỏ mùa xuân tiền cảnh (Nền tương phản cho Text & UI) -->
    <linearGradient id="springMeadowSoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3BA557"/>
      <stop offset="0.25" stop-color="#288741"/>
      <stop offset="0.7" stop-color="#1B6430"/>
      <stop offset="1" stop-color="#10421E"/>
    </linearGradient>

    <!-- Đổ bóng mặt cỏ -->
    <radialGradient id="grassShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#10421E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#10421E" stop-opacity="0"/>
    </radialGradient>

    <!-- Mẫu hoa tulip 3D -->
    <g id="spring_tulip">
      <path d="M 0 0 C -10 -4, -12 -22, 0 -26 C 12 -22, 10 -4, 0 0 Z" fill="#FF4081" stroke="#C2185B" stroke-width="1"/>
      <path d="M 0 0 C -4 -4, -5 -18, 0 -22 C 5 -18, 4 -4, 0 0 Z" fill="#FF80AB"/>
      <line x1="0" y1="0" x2="0" y2="28" stroke="#2E7D32" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M 0 16 Q 8 8 14 12" stroke="#2E7D32" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- 1. Mảng đồng cỏ mùa xuân phía dưới (y: 218/242 -> 504) -->
    <path d="M 0 242 Q 85 218 175 238 T 340 230 L 340 504 L 0 504 Z" fill="url(#springMeadowSoil)"/>

    <!-- 2. Viền mép đồi cỏ sáng rực ánh xuân ngăn cách hai vùng -->
    <path d="M 0 242 Q 85 218 175 238 T 340 230" fill="none" stroke="#D1F8B8" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 0 247 Q 85 223 175 243 T 340 235" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.8"/>

    <!-- 3. Hoa tulip & cúc họa mi nép gọn mép bờ đồi góc phải -->
    <ellipse cx="305" cy="245" rx="32" ry="8" fill="url(#grassShadow)"/>
    <g transform="translate(280, 238) scale(0.95)"><use href="#spring_tulip"/></g>
    <g transform="translate(302, 234) scale(1.05)">
      <path d="M 0 0 C -10 -4, -12 -22, 0 -26 C 12 -22, 10 -4, 0 0 Z" fill="#FFC107" stroke="#FFA000" stroke-width="1"/>
      <path d="M 0 0 C -4 -4, -5 -18, 0 -22 C 5 -18, 4 -4, 0 0 Z" fill="#FFE082"/>
      <line x1="0" y1="0" x2="0" y2="28" stroke="#2E7D32" stroke-width="2.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(322, 236) scale(0.9)"><use href="#spring_tulip"/></g>

    <!-- Hoa cúc họa mi ven mép phải -->
    <g transform="translate(268, 246) scale(0.8)">
      <ellipse cx="0" cy="-6" rx="2.4" ry="5.5" fill="#FFFFFF"/>
      <ellipse cx="4.2" cy="-4.2" rx="2.4" ry="5.5" fill="#FFFFFF" transform="rotate(45 4.2 -4.2)"/>
      <ellipse cx="6" cy="0" rx="2.4" ry="5.5" fill="#FFFFFF" transform="rotate(90 6 0)"/>
      <ellipse cx="4.2" cy="4.2" rx="2.4" ry="5.5" fill="#FFFFFF" transform="rotate(135 4.2 4.2)"/>
      <ellipse cx="0" cy="6" rx="2.4" ry="5.5" fill="#FFFFFF"/>
      <ellipse cx="-4.2" cy="4.2" rx="2.4" ry="5.5" fill="#FFFFFF" transform="rotate(225 -4.2 4.2)"/>
      <ellipse cx="-6" cy="0" rx="2.4" ry="5.5" fill="#FFFFFF" transform="rotate(270 -6 0)"/>
      <ellipse cx="-4.2" cy="-4.2" rx="2.4" ry="5.5" fill="#FFFFFF" transform="rotate(315 -4.2 -4.2)"/>
      <circle cx="0" cy="0" r="3" fill="#FFCA28"/>
    </g>

    <!-- Bụi cỏ xanh non góc trái -->
    <path d="M 12 242 Q 16 228 20 242 Q 24 224 28 243 Z" fill="#2E7D32"/>
  </g>
</svg>