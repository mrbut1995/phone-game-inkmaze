<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch màu dusty beige sẫm #D4CBB6 -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#A89E88"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#D4CBB6"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#C2B8A1"/>

  <!-- Dây leo xanh bắt chéo với lá và hoa cúc nhỏ (Crossed green vines) -->
  <line x1="24" y1="24" x2="152" y2="152" stroke="#2F7A4A" stroke-width="10" stroke-linecap="round"/>
  <line x1="152" y1="24" x2="24" y2="152" stroke="#1E5C35" stroke-width="10" stroke-linecap="round"/>

  <!-- Các lá nhỏ và hoa cúc đính trên dây leo -->
  <g transform="translate(48 44)">
    <circle cx="0" cy="0" r="1.8" fill="#FDE07A"/>
    <circle cx="0" cy="-3" r="1.2" fill="#FEF7E4"/>
    <circle cx="0" cy="3" r="1.2" fill="#FEF7E4"/>
    <circle cx="-3" cy="0" r="1.2" fill="#FEF7E4"/>
    <circle cx="3" cy="0" r="1.2" fill="#FEF7E4"/>
  </g>
  <path d="M128 44 Q136 38 140 46 Q132 50 128 44 Z" fill="#2F7A4A"/>
  <g transform="translate(128 128)">
    <circle cx="0" cy="0" r="1.8" fill="#FDE07A"/>
    <circle cx="0" cy="-3" r="1.2" fill="#FEF7E4"/>
    <circle cx="0" cy="3" r="1.2" fill="#FEF7E4"/>
    <circle cx="-3" cy="0" r="1.2" fill="#FEF7E4"/>
    <circle cx="3" cy="0" r="1.2" fill="#FEF7E4"/>
  </g>
  <path d="M44 128 Q36 136 40 144 Q48 138 44 128 Z" fill="#2F7A4A"/>

  <!-- Bóng tròn sau ổ khóa -->
  <circle cx="88" cy="94" r="32" fill="#0C3320" opacity="0.45"/>

  <!-- Ổ khóa Lavender ở trung tâm với lỗ khóa vàng -->
  <g transform="translate(88 88)">
    <!-- Quai khóa thép màu pastel pink #F5B1C8 -->
    <path d="M-18 -8 V-24 A18 18 0 0 1 18 -24 V-8" fill="none" stroke="#F5B1C8" stroke-width="9" stroke-linecap="round"/>
    <!-- Thân khóa Lavender #C6B3EB -->
    <rect x="-28" y="-8" width="56" height="46" rx="9" fill="#C6B3EB"/>
    <!-- Băng đáy tối màu #9A85CC -->
    <path d="M-28 17 Q-28 38 -9 38 L9 38 Q28 38 28 17 L28 12 L-28 12 Z" fill="#9A85CC"/>
    <!-- Lỗ khóa vàng Butter Yellow #FDE07A -->
    <circle cx="0" cy="11" r="5" fill="#FDE07A"/>
    <polygon points="-3,12 3,12 2,24 -2,24" fill="#FDE07A"/>
  </g>
</svg>