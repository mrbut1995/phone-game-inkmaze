<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Thảm đất nghĩa địa tiền cảnh (Nền tương phản tốt cho UI) -->
    <linearGradient id="hlwStageFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F0738"/>
      <stop offset="0.25" stop-color="#140426"/>
      <stop offset="0.65" stop-color="#0B0217"/>
      <stop offset="1" stop-color="#04000A"/>
    </linearGradient>

    <!-- Ánh lửa nến bập bùng trong quả bí ngô -->
    <radialGradient id="fgCandleFire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF9C4"/>
      <stop offset="0.45" stop-color="#FFD54F"/>
      <stop offset="0.8" stop-color="#FF6D00"/>
      <stop offset="1" stop-color="#D84315"/>
    </radialGradient>

    <!-- Hào quang bé ma phát sáng -->
    <radialGradient id="fgGhostAura" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#E8DDFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#B39DDB" stop-opacity="0"/>
    </radialGradient>

    <!-- Đổ bóng mặt đất mềm mại -->
    <radialGradient id="fgHlwShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#05000C" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#05000C" stop-opacity="0"/>
    </radialGradient>

    <!-- Dơi lớn cận cảnh -->
    <g id="fg_big_bat">
      <path d="M 0 0 C -8 -14 -24 -12 -35 3 C -27 -3 -20 0 -16 7 C -11 2 -7 3 0 11 C 7 3 11 2 16 7 C 20 0 27 -3 35 3 C 24 -12 8 -14 0 0 Z" 
            fill="#10031E" stroke="#2D0B4A" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- THẢM ĐẤT NGHĨA ĐỊA TIỀN CẢNH (Seamless chu kỳ 540px: x=0 (y=610) và x=1080 (y=610)) -->
  <path d="M 0 610 
           Q 135 570 270 605 T 540 610 
           Q 675 570 810 605 T 1080 610 
           L 1080 960 L 0 960 Z" 
        fill="url(#hlwStageFloor)"/>

  <!-- Viền mép đồi dạ quang ma mị rực cam và tím neon -->
  <path d="M 0 610 Q 135 570 270 605 T 540 610 Q 675 570 810 605 T 1080 610" 
        fill="none" stroke="#FF7A00" stroke-width="6" stroke-linecap="round"/>
  <path d="M 0 616 Q 135 576 270 611 T 540 616 Q 675 576 810 611 T 1080 616" 
        fill="none" stroke="#B388FF" stroke-opacity="0.5" stroke-width="2.5"/>

  <!-- ==================== CÁC VẬT THỂ TIỀN CẢNH ==================== -->

  <!-- 1. QUẢ BÍ NGÔ JACK-O'-LANTERN 3D KHỔNG LỒ RỰC CHÁY (Bên trái, x ≈ 130) -->
  <g transform="translate(130, 520)">
    <!-- Đổ bóng đáy bí ngô -->
    <ellipse cx="25" cy="120" rx="58" ry="16" fill="url(#fgHlwShadow)"/>

    <!-- Cuống bí ngô gồ ghề màu xanh rêu -->
    <path d="M 22 20 C 22 5 32 0 40 0 C 38 7 32 12 30 20 Z" fill="#4B6B22" stroke="#243310" stroke-width="2"/>

    <!-- Thân bí ngô múi 3D căng tròn nổi khối -->
    <ellipse cx="-8" cy="55" rx="28" ry="42" fill="#D35400" stroke="#662200" stroke-width="3"/>
    <ellipse cx="58" cy="55" rx="28" ry="42" fill="#D35400" stroke="#662200" stroke-width="3"/>
    <ellipse cx="6" cy="55" rx="28" ry="45" fill="#E65100" stroke="#662200" stroke-width="3"/>
    <ellipse cx="44" cy="55" rx="28" ry="45" fill="#E65100" stroke="#662200" stroke-width="3"/>
    <ellipse cx="25" cy="55" rx="28" ry="47" fill="#FF7A00" stroke="#662200" stroke-width="3"/>

    <!-- HỐC MẮT & NỤ CƯỜI RĂNG CƯA KHẮC RỰC LỬA -->
    <polygon points="0,42 16,42 8,28" fill="url(#fgCandleFire)" stroke="#4A1400" stroke-width="1.5"/>
    <polygon points="50,42 34,42 42,28" fill="url(#fgCandleFire)" stroke="#4A1400" stroke-width="1.5"/>
    <polygon points="21,50 29,50 25,41" fill="url(#fgCandleFire)" stroke="#4A1400" stroke-width="1"/>
    <path d="M -2 68 L 8 78 L 15 70 L 25 80 L 35 70 L 42 78 L 52 68 L 46 84 Q 25 98 4 84 Z" 
          fill="url(#fgCandleFire)" stroke="#4A1400" stroke-width="2"/>

    <!-- Quả bí ngô con nép cạnh bên -->
    <g transform="translate(-40, 25) scale(0.65)">
      <ellipse cx="0" cy="55" rx="28" ry="42" fill="#D35400" stroke="#662200" stroke-width="3"/>
      <ellipse cx="0" cy="55" rx="26" ry="45" fill="#FF7A00" stroke="#662200" stroke-width="3"/>
      <polygon points="-12,42 -2,42 -7,30" fill="url(#fgCandleFire)"/>
      <polygon points="12,42 2,42 7,30" fill="url(#fgCandleFire)"/>
      <path d="M -12 65 L -4 74 L 4 65 L 12 74 Q 0 88 -12 65 Z" fill="url(#fgCandleFire)"/>
    </g>
  </g>

  <!-- 2. BÉ MA BAY DẠ QUANG MA MỊ (Bay lơ lửng, x = 250, y = 430) -->
  <g transform="translate(250, 430) rotate(-8)">
    <ellipse cx="0" cy="20" rx="42" ry="46" fill="url(#fgGhostAura)"/>
    <path d="M -28 35 C -30 0 -28 -28 0 -28 C 28 -28 30 0 28 35 C 19 25 10 35 0 25 C -10 35 -19 25 -28 35 Z" 
          fill="#FFFFFF" stroke="#D1C4E9" stroke-width="2.5"/>
    <!-- Mắt to ngạc nhiên & miệng chữ o -->
    <ellipse cx="-10" cy="-6" rx="4.5" ry="7" fill="#1B042F"/><circle cx="-11.5" cy="-8.5" r="2" fill="#FFFFFF"/>
    <ellipse cx="10" cy="-6" rx="4.5" ry="7" fill="#1B042F"/><circle cx="8.5" cy="-8.5" r="2" fill="#FFFFFF"/>
    <ellipse cx="0" cy="9" rx="5.5" ry="7.5" fill="#1B042F"/>
    <circle cx="-18" cy="3" r="5" fill="#D1C4E9" opacity="0.6"/>
    <circle cx="18" cy="3" r="5" fill="#D1C4E9" opacity="0.6"/>
  </g>

  <!-- 3. CÂY CỔ THỤ KHÔ MA QUÁI & BÍ NGÔ THỨ HAI (Bên phải, x ≈ 880) -->
  <g transform="translate(860, 390)">
    <!-- Thân cây cổ thụ vặn xoắn gồ ghề -->
    <path d="M 25 240 C 40 160 30 90 -5 10" stroke="#120321" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M 20 130 Q 75 80 120 50" stroke="#120321" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 60 95 Q 105 40 140 20" stroke="#120321" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 5 60 Q -35 20 -70 5" stroke="#120321" stroke-width="9" fill="none" stroke-linecap="round"/>

    <!-- Quả bí ngô phát sáng dưới gốc cây -->
    <g transform="translate(50, 160) scale(0.85)">
      <ellipse cx="25" cy="55" rx="28" ry="47" fill="#FF7A00" stroke="#662200" stroke-width="3"/>
      <ellipse cx="-6" cy="55" rx="26" ry="42" fill="#D35400" stroke="#662200" stroke-width="3"/>
      <ellipse cx="56" cy="55" rx="26" ry="42" fill="#D35400" stroke="#662200" stroke-width="3"/>
      <polygon points="0,42 16,42 8,28" fill="url(#fgCandleFire)"/>
      <polygon points="50,42 34,42 42,28" fill="url(#fgCandleFire)"/>
      <path d="M 0 68 L 10 78 L 20 70 L 30 80 L 40 70 L 50 78 Q 25 96 0 68 Z" fill="url(#fgCandleFire)"/>
    </g>

    <!-- Bé ma thứ hai bay cạnh cành cây -->
    <g transform="translate(-50, 40) rotate(10) scale(0.75)">
      <ellipse cx="0" cy="15" rx="38" ry="42" fill="url(#fgGhostAura)"/>
      <path d="M -26 32 C -28 0 -26 -26 0 -26 C 26 -26 28 0 26 32 C 18 23 9 32 0 23 C -9 32 -18 23 -26 32 Z" fill="#FFFFFF"/>
      <ellipse cx="-8" cy="-5" rx="4" ry="6" fill="#1B042F"/>
      <ellipse cx="8" cy="-5" rx="4" ry="6" fill="#1B042F"/>
      <ellipse cx="0" cy="8" rx="5" ry="6.5" fill="#1B042F"/>
    </g>
  </g>

  <!-- 4. ĐÀN DƠI TIỀN CẢNH BAY CẬN MÁY QUAY -->
  <g>
    <g transform="translate(460, 480) rotate(-15) scale(1.15)"><use href="#fg_big_bat"/></g>
    <g transform="translate(540, 430) rotate(20) scale(0.9)"><use href="#fg_big_bat"/></g>
    <g transform="translate(1000, 480) rotate(-15) scale(1.15)"><use href="#fg_big_bat"/></g>
    <g transform="translate(1060, 430) rotate(20) scale(0.9)"><use href="#fg_big_bat"/></g>
  </g>

  <!-- ĐỐM LỬA MA TRƠI VÀ BỤI SÁNG PHÁT QUANG TIỀN CẢNH -->
  <g fill="#FFAB00">
    <circle cx="210" cy="560" r="2.5" opacity="0.95"/>
    <circle cx="280" cy="520" r="2" opacity="0.85"/>
    <circle cx="340" cy="580" r="3" opacity="0.9"/>
    <circle cx="750" cy="560" r="2.5" opacity="0.95"/>
    <circle cx="820" cy="520" r="2" opacity="0.85"/>
  </g>
</svg>