<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Thảm đất ngọc bích đen tiền cảnh (Nền tương phản tốt cho UI) -->
    <linearGradient id="msnStageFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2024"/>
      <stop offset="0.25" stop-color="#061518"/>
      <stop offset="0.65" stop-color="#030C0E"/>
      <stop offset="1" stop-color="#010506"/>
    </linearGradient>

    <!-- Ánh lửa đèn bão xanh ngọc dạ quang -->
    <radialGradient id="fgLanternTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#7CF2C0"/>
      <stop offset="0.8" stop-color="#26A69A"/>
      <stop offset="1" stop-color="#004D40" stop-opacity="0"/>
    </radialGradient>

    <!-- Đổ bóng mặt đất mềm mại -->
    <radialGradient id="fgMsnShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#010607" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#010607" stop-opacity="0"/>
    </radialGradient>

    <!-- Dơi lớn cận cảnh -->
    <g id="fg_msn_bat">
      <path d="M 0 0 C -8 -14 -24 -12 -35 3 C -27 -3 -20 0 -16 7 C -11 2 -7 3 0 11 C 7 3 11 2 16 7 C 20 0 27 -3 35 3 C 24 -12 8 -14 0 0 Z" 
            fill="#030A0D" stroke="#092226" stroke-width="1.2"/>
    </g>

    <!-- MẪU ĐÈN BÃO TREO CỔNG PHÁT SÁNG -->
    <g id="fg_street_lantern">
      <line x1="0" y1="-25" x2="0" y2="0" stroke="#051013" stroke-width="3"/>
      <!-- Khung đèn lồng sắt -->
      <polygon points="-10,0 10,0 14,24 -14,24" fill="#040C0E" stroke="#092226" stroke-width="1.5"/>
      <!-- Hào quang phát sáng -->
      <circle cx="0" cy="12" r="28" fill="url(#fgLanternTeal)"/>
      <circle cx="0" cy="12" r="6" fill="#FFFFFF"/>
      <polygon points="-14,24 14,24 8,30 -8,30" fill="#040C0E"/>
    </g>
  </defs>

  <!-- THẢM ĐẤT SỎI BIỆT THỰ TIỀN CẢNH (Seamless chu kỳ 540px: x=0 (y=610) và x=1080 (y=610)) -->
  <path d="M 0 610 
           Q 135 570 270 605 T 540 610 
           Q 675 570 810 605 T 1080 610 
           L 1080 960 L 0 960 Z" 
        fill="url(#msnStageFloor)"/>

  <!-- Viền mép đồi dạ quang xanh ngọc bích sắc nét -->
  <path d="M 0 610 Q 135 570 270 605 T 540 610 Q 675 570 810 605 T 1080 610" 
        fill="none" stroke="#5BD99A" stroke-width="6" stroke-linecap="round"/>
  <path d="M 0 616 Q 135 576 270 611 T 540 616 Q 675 576 810 611 T 1080 616" 
        fill="none" stroke="#BFFFDC" stroke-opacity="0.45" stroke-width="2.5"/>

  <!-- ==================== CÁC VẬT THỂ TIỀN CẢNH ==================== -->

  <!-- 1. TRỤ CỔNG ĐÁ GOTHIC & HOA VĂN CỔNG SẮT (Bên trái, x ≈ 120) -->
  <g transform="translate(110, 410)">
    <!-- Đổ bóng trụ cổng -->
    <ellipse cx="25" cy="245" rx="50" ry="15" fill="url(#fgMsnShadow)"/>

    <!-- Trụ đá rêu phong cổ kính -->
    <rect x="0" y="40" width="50" height="205" fill="#040E10" stroke="#092025" stroke-width="2"/>
    <polygon points="-8,40 25,10 58,40" fill="#040E10" stroke="#092025" stroke-width="2"/>
    <circle cx="25" cy="8" r="4.5" fill="#040E10"/>
    <rect x="-6" y="235" width="62" height="18" fill="#030A0C"/>

    <!-- ĐÈN BÃO TREO BÊN TRỤ ĐÁ HẮT SÁNG DẠ QUANG -->
    <g transform="translate(-15, 75)"><use href="#fg_street_lantern"/></g>

    <!-- CỔNG SẮT GOTHIC HOA VĂN UỐN LƯỢN VƯƠN CAO -->
    <g stroke="#030A0C" stroke-linecap="round" fill="none">
      <line x1="50" y1="90" x2="160" y2="105" stroke-width="4.5"/>
      <line x1="50" y1="180" x2="160" y2="195" stroke-width="4.5"/>
      <!-- Các thanh chông nhọn vươn cao -->
      <line x1="70" y1="65" x2="70" y2="225" stroke-width="3.5"/>
      <polygon points="70,55 66,66 74,66" fill="#030A0C"/>
      <line x1="100" y1="60" x2="100" y2="230" stroke-width="3.5"/>
      <polygon points="100,50 96,61 104,61" fill="#030A0C"/>
      <line x1="130" y1="65" x2="130" y2="235" stroke-width="3.5"/>
      <polygon points="130,55 126,66 134,66" fill="#030A0C"/>
    </g>
  </g>

  <!-- 2. CÂY CỔ THỤ CÀNH KHÔ QUỶ QUYỆT (Bên phải, x ≈ 860) -->
  <g transform="translate(860, 360)">
    <ellipse cx="30" cy="290" rx="60" ry="16" fill="url(#fgMsnShadow)"/>
    <!-- Thân cây cổ thụ vặn xoắn đen kịt -->
    <path d="M 25 290 C 45 200 30 110 -10 20" stroke="#03090B" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M 20 160 Q 85 100 135 70" stroke="#03090B" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 70 120 Q 120 60 160 35" stroke="#03090B" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 5 80 Q -40 30 -80 15" stroke="#03090B" stroke-width="9" fill="none" stroke-linecap="round"/>

    <!-- TRỤ CỔNG ĐÁ THỨ HAI KÈM ĐÈN TREO -->
    <g transform="translate(-140, 90)">
      <rect x="0" y="40" width="50" height="175" fill="#040E10" stroke="#092025" stroke-width="2"/>
      <polygon points="-8,40 25,10 58,40" fill="#040E10" stroke="#092025" stroke-width="2"/>
      <g transform="translate(65, 75)"><use href="#fg_street_lantern"/></g>
    </g>
  </g>

  <!-- 3. ĐÀN DƠI TIỀN CẢNH BAY CẬN MÁY QUAY -->
  <g>
    <g transform="translate(440, 460) rotate(-15) scale(1.15)"><use href="#fg_msn_bat"/></g>
    <g transform="translate(520, 420) rotate(20) scale(0.9)"><use href="#fg_msn_bat"/></g>
    <g transform="translate(980, 460) rotate(-15) scale(1.15)"><use href="#fg_msn_bat"/></g>
    <g transform="translate(1040, 420) rotate(20) scale(0.9)"><use href="#fg_msn_bat"/></g>
  </g>

  <!-- ĐỐM LỬA MA TRƠI XANH DẠ QUANG TIỀN CẢNH (Will-o'-the-wisps) -->
  <g fill="#7CF2C0">
    <circle cx="280" cy="540" r="3" opacity="0.95"/>
    <circle cx="340" cy="510" r="2.2" opacity="0.85"/>
    <circle cx="480" cy="550" r="2.8" opacity="0.9"/>
    <circle cx="680" cy="530" r="3" opacity="0.95"/>
    <circle cx="740" cy="560" r="2.5" opacity="0.85"/>
  </g>
</svg>