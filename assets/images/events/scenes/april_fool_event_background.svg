<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Bầu trời kẹo ngọt carnival chuyển sắc 4 nấc -->
    <linearGradient id="aprilSkyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9C4"/>
      <stop offset="0.35" stop-color="#FFD1EB"/>
      <stop offset="0.7" stop-color="#E1BEE7"/>
      <stop offset="1" stop-color="#CE93D8"/>
    </linearGradient>

    <!-- Hào quang mặt trời vui nhộn -->
    <radialGradient id="sunAprilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFDE7" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFF176" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>

    <!-- Dãy đồi xa mờ sương tím pastel -->
    <linearGradient id="aprilDistantHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BA68C8"/>
      <stop offset="1" stop-color="#7B1FA2"/>
    </linearGradient>
  </defs>

  <!-- Nền trời kẹo ngọt bao phủ toàn canvas -->
  <rect width="1080" height="960" fill="url(#aprilSkyGrad)"/>

  <!-- ==================== MẶT TRỜI HỀ TINH NGHỊCH ==================== -->
  <g transform="translate(360, 200)">
    <!-- Hào quang tròn -->
    <circle cx="0" cy="0" r="110" fill="url(#sunAprilGlow)"/>
    <circle cx="0" cy="0" r="45" fill="#FFE082" stroke="#3B0A45" stroke-width="2.5"/>
    <!-- Mắt nháy tinh quái & mắt cười -->
    <path d="M -22 -10 A 8 8 0 0 1 -6 -10" fill="none" stroke="#3B0A45" stroke-width="3" stroke-linecap="round"/>
    <circle cx="14" cy="-10" r="5" fill="#3B0A45"/>
    <circle cx="16" cy="-12" r="1.8" fill="#FFFFFF"/>
    <!-- Mũi cà chua đỏ tròn -->
    <circle cx="0" cy="2" r="9" fill="#FF1744"/>
    <ellipse cx="-2.5" cy="-0.5" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.75"/>
    <!-- Miệng cười le lưỡi -->
    <path d="M -20 12 Q 0 32 20 12" fill="#3B0A45"/>
    <path d="M -8 20 Q 0 32 8 20 Z" fill="#FF4081"/>
    <!-- Tia nắng lượn sóng xoắn ốc -->
    <g stroke="#FFCA28" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M 0 -52 Q 6 -62 0 -72"/>
      <path d="M 37 -37 Q 48 -44 49 -56"/>
      <path d="M 52 0 Q 62 6 72 0"/>
      <path d="M 37 37 Q 44 48 56 49"/>
      <path d="M 0 52 Q -6 62 0 72"/>
      <path d="M -37 37 Q -48 44 -49 56"/>
      <path d="M -52 0 Q -62 -6 -72 0"/>
      <path d="M -37 -37 Q -44 -48 -56 -49"/>
    </g>
  </g>

  <!-- ==================== KHINH KHÍ CẦU & MÂY KẸO BÔNG ==================== -->
  <!-- Khinh khí cầu hình cá tháng tư (Poisson d'Avril) -->
  <g transform="translate(220, 260) scale(0.85)">
    <!-- Quả cầu sọc carnival -->
    <ellipse cx="0" cy="0" rx="26" ry="32" fill="#00BCD4" stroke="#3B0A45" stroke-width="2"/>
    <path d="M -12 -28 Q 0 0 -12 28" stroke="#FF4081" stroke-width="6" fill="none"/>
    <path d="M 12 -28 Q 0 0 12 28" stroke="#FFEB3B" stroke-width="6" fill="none"/>
    <!-- Giỏ treo -->
    <line x1="-10" y1="32" x2="-6" y2="44" stroke="#3B0A45" stroke-width="1.5"/>
    <line x1="10" y1="32" x2="6" y2="44" stroke="#3B0A45" stroke-width="1.5"/>
    <rect x="-8" y="44" width="16" height="12" rx="2" fill="#FF9800" stroke="#3B0A45" stroke-width="1.5"/>
  </g>

  <!-- Khinh khí cầu nhỏ lặp bên phải (x = 760) -->
  <g transform="translate(760, 240) scale(0.7)">
    <ellipse cx="0" cy="0" rx="26" ry="32" fill="#E91E63" stroke="#3B0A45" stroke-width="2"/>
    <path d="M -12 -28 Q 0 0 -12 28" stroke="#00BCD4" stroke-width="6" fill="none"/>
    <path d="M 12 -28 Q 0 0 12 28" stroke="#FFEB3B" stroke-width="6" fill="none"/>
    <line x1="-10" y1="32" x2="-6" y2="44" stroke="#3B0A45" stroke-width="1.5"/>
    <line x1="10" y1="32" x2="6" y2="44" stroke="#3B0A45" stroke-width="1.5"/>
    <rect x="-8" y="44" width="16" height="12" rx="2" fill="#7C3AED" stroke="#3B0A45" stroke-width="1.5"/>
  </g>

  <!-- Mây bồng bềnh pastel -->
  <g fill="#FFFFFF" fill-opacity="0.9">
    <g transform="translate(130, 150) scale(1.15)">
      <ellipse cx="0" cy="0" rx="36" ry="16"/><circle cx="-16" cy="-9" r="15"/><circle cx="10" cy="-14" r="18"/><circle cx="28" cy="-5" r="13"/>
    </g>
    <g transform="translate(670, 140) scale(1.15)">
      <ellipse cx="0" cy="0" rx="36" ry="16"/><circle cx="-16" cy="-9" r="15"/><circle cx="10" cy="-14" r="18"/><circle cx="28" cy="-5" r="13"/>
    </g>
    <g transform="translate(940, 210) scale(0.75)" fill-opacity="0.75">
      <ellipse cx="0" cy="0" rx="32" ry="12"/><circle cx="-13" cy="-7" r="13"/><circle cx="8" cy="-9" r="15"/>
    </g>
  </g>

  <!-- ==================== ĐƯỜNG CHÂN TRỜI CARNIVAL ==================== -->
  <!-- Vòng đu quay khổng lồ & rạp xiếc xa xăm (Khớp tại x=0 và x=1080 ở y=510) -->
  <path d="M 0 510 
           Q 80 470 160 495 Q 240 520 320 485 Q 430 450 540 510 
           Q 620 470 700 495 Q 780 520 860 485 Q 970 450 1080 510 
           L 1080 580 L 0 580 Z" 
        fill="url(#aprilDistantHills)" opacity="0.6"/>

  <!-- Bóng vòng đu quay Ferris Wheel xa xa (x = 440 & x = 980) -->
  <g transform="translate(440, 460) scale(0.65)" stroke="#6A1B9A" stroke-width="2" fill="none" opacity="0.75">
    <circle cx="0" cy="0" r="42"/>
    <line x1="-42" y1="0" x2="42" y2="0"/><line x1="0" y1="-42" x2="0" y2="42"/>
    <line x1="-30" y1="-30" x2="30" y2="30"/><line x1="-30" y1="30" x2="30" y2="-30"/>
    <polygon points="0,0 -18,55 18,55" fill="#6A1B9A"/>
  </g>
  <g transform="translate(980, 460) scale(0.65)" stroke="#6A1B9A" stroke-width="2" fill="none" opacity="0.75">
    <circle cx="0" cy="0" r="42"/>
    <line x1="-42" y1="0" x2="42" y2="0"/><line x1="0" y1="-42" x2="0" y2="42"/>
    <line x1="-30" y1="-30" x2="30" y2="30"/><line x1="-30" y1="30" x2="30" y2="-30"/>
    <polygon points="0,0 -18,55 18,55" fill="#6A1B9A"/>
  </g>
</svg>