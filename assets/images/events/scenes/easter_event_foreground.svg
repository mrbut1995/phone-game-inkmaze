<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Thảm cỏ tiền cảnh xanh mướt (Nền tương phản tốt cho UI/nhân vật) -->
    <linearGradient id="easterFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA85B"/>
      <stop offset="0.2" stop-color="#2D8A46"/>
      <stop offset="0.65" stop-color="#1B6430"/>
      <stop offset="1" stop-color="#10401E"/>
    </linearGradient>

    <!-- Đổ bóng mặt đất mềm mại -->
    <radialGradient id="fgGrassShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0E381A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0E381A" stop-opacity="0"/>
    </radialGradient>

    <!-- Khối cầu 3D trứng Phục Sinh -->
    <radialGradient id="egg3DShade" cx="35%" cy="30%" r="65%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Mẫu hoa cúc họa mi tiền cảnh -->
    <g id="fg_daisy">
      <ellipse cx="0" cy="-8" rx="3.2" ry="7.5" fill="#FFFFFF"/>
      <ellipse cx="5.6" cy="-5.6" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(45 5.6 -5.6)"/>
      <ellipse cx="8" cy="0" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(90 8 0)"/>
      <ellipse cx="5.6" cy="5.6" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(135 5.6 5.6)"/>
      <ellipse cx="0" cy="8" rx="3.2" ry="7.5" fill="#FFFFFF"/>
      <ellipse cx="-5.6" cy="5.6" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(225 -5.6 5.6)"/>
      <ellipse cx="-8" cy="0" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(270 -8 0)"/>
      <ellipse cx="-5.6" cy="-5.6" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(315 -5.6 -5.6)"/>
      <circle cx="0" cy="0" r="4.2" fill="#FFCA28"/>
      <circle cx="0" cy="0" r="2" fill="#FFA000"/>
    </g>

    <!-- Mẫu củ cà rốt cam xinh xắn -->
    <g id="carrot">
      <!-- Củ cà rốt -->
      <path d="M 0 0 C 4 8, 5 24, 0 34 C -5 24, -4 8, 0 0 Z" fill="#FF7043" stroke="#D84315" stroke-width="1"/>
      <line x1="-2" y1="10" x2="2" y2="10" stroke="#BF360C" stroke-width="1"/>
      <line x1="-3" y1="18" x2="1" y2="18" stroke="#BF360C" stroke-width="1"/>
      <line x1="-1" y1="26" x2="2" y2="26" stroke="#BF360C" stroke-width="1"/>
      <!-- Cuống lá xanh -->
      <path d="M 0 0 Q -4 -8 -8 -10 Q -4 -5 0 0 Z" fill="#4CAF50"/>
      <path d="M 0 0 Q 0 -10 2 -13 Q 2 -6 0 0 Z" fill="#66BB6A"/>
      <path d="M 0 0 Q 4 -8 8 -10 Q 4 -5 0 0 Z" fill="#4CAF50"/>
    </g>
  </defs>

  <!-- THẢM ĐỒI CỎ TIỀN CẢNH (Uốn lượn tuần hoàn chu kỳ 540px: x=0 (y=610) và x=1080 (y=610)) -->
  <path d="M 0 610 
           Q 135 570 270 605 T 540 610 
           Q 675 570 810 605 T 1080 610 
           L 1080 960 L 0 960 Z" 
        fill="url(#easterFloor)"/>

  <!-- Viền mép cỏ sáng rực ánh xuân -->
  <path d="M 0 610 Q 135 570 270 605 T 540 610 Q 675 570 810 605 T 1080 610" 
        fill="none" stroke="#B8F2A6" stroke-width="6" stroke-linecap="round"/>
  <path d="M 0 616 Q 135 576 270 611 T 540 616 Q 675 576 810 611 T 1080 616" 
        fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>

  <!-- ==================== CÁC VẬT THỂ TIỀN CẢNH ==================== -->

  <!-- 1. CHÚ THỎ NÉP SAU QUẢ TRỨNG LỚN (Bên trái, x ≈ 130) -->
  <g transform="translate(130, 480)">
    <!-- Bóng đổ -->
    <ellipse cx="20" cy="150" rx="55" ry="16" fill="url(#fgGrassShadow)"/>

    <!-- Chú thỏ trắng nhô đầu lên sau trứng -->
    <g transform="translate(20, 10)">
      <!-- Tai thỏ dài -->
      <g transform="rotate(-15 -10 -20)">
        <ellipse cx="-10" cy="-20" rx="11" ry="36" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="2"/>
        <ellipse cx="-10" cy="-18" rx="5.5" ry="25" fill="#FFB7CE"/>
      </g>
      <g transform="rotate(18 20 -25)">
        <ellipse cx="20" cy="-25" rx="11" ry="36" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="2"/>
        <ellipse cx="20" cy="-23" rx="5.5" ry="25" fill="#FFB7CE"/>
      </g>
      <!-- Đầu thỏ -->
      <ellipse cx="5" cy="20" rx="32" ry="28" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="2"/>
      <!-- Mắt anime long lanh -->
      <ellipse cx="-6" cy="16" rx="4" ry="5.5" fill="#36222F"/><circle cx="-7.5" cy="14" r="1.6" fill="#FFFFFF"/>
      <ellipse cx="16" cy="16" rx="4" ry="5.5" fill="#36222F"/><circle cx="14.5" cy="14" r="1.6" fill="#FFFFFF"/>
      <!-- Mũi hồng & má ửng -->
      <ellipse cx="5" cy="25" rx="4.5" ry="3" fill="#FF85A1"/>
      <circle cx="-13" cy="27" r="6.5" fill="#FFB7CE" opacity="0.65"/>
      <circle cx="23" cy="27" r="6.5" fill="#FFB7CE" opacity="0.65"/>
      <!-- Bàn chân trước vịn lên đỉnh trứng -->
      <ellipse cx="-12" cy="55" rx="9" ry="12" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="1.8"/>
      <ellipse cx="22" cy="55" rx="9" ry="12" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="1.8"/>
    </g>

    <!-- Quả trứng Phục Sinh khổng lồ (Hồng & Zig-zag vàng kim) -->
    <g transform="translate(25, 75)">
      <clipPath id="fgEggClip1">
        <ellipse cx="0" cy="10" rx="38" ry="50"/>
      </clipPath>
      <ellipse cx="0" cy="10" rx="38" ry="50" fill="#FF85A1"/>
      <g clip-path="url(#fgEggClip1)">
        <rect x="-45" y="-20" width="90" height="15" fill="#FFF0F5"/>
        <path d="M -42 12 L -26 0 L -10 12 L 6 0 L 22 12 L 38 0 L 54 12" stroke="#FFD166" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M -42 24 L -26 12 L -10 24 L 6 12 L 22 24 L 38 12 L 54 24" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <circle cx="-20" cy="40" r="5" fill="#48CAE4"/>
        <circle cx="0" cy="40" r="5" fill="#FFD166"/>
        <circle cx="20" cy="40" r="5" fill="#48CAE4"/>
        <ellipse cx="0" cy="10" rx="38" ry="50" fill="url(#egg3DShade)"/>
        <ellipse cx="-14" cy="-10" rx="9" ry="17" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 -14 -10)"/>
      </g>
      <ellipse cx="0" cy="10" rx="38" ry="50" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 2. QUẢ TRỨNG XANH CYAN & TÍM PASTEL Ở GIỮA (x ≈ 420 - 520) -->
  <g transform="translate(420, 560)">
    <!-- Trứng xanh Cyan (x = 0) -->
    <ellipse cx="0" cy="50" rx="34" ry="10" fill="url(#fgGrassShadow)"/>
    <g>
      <clipPath id="fgEggClip2"><ellipse cx="0" cy="10" rx="30" ry="40"/></clipPath>
      <ellipse cx="0" cy="10" rx="30" ry="40" fill="#48CAE4"/>
      <g clip-path="url(#fgEggClip2)">
        <circle cx="-12" cy="-10" r="6" fill="#FFF3A6"/>
        <circle cx="12" cy="-14" r="6" fill="#FFFFFF"/>
        <circle cx="-4" cy="8" r="6.5" fill="#FF85A1"/>
        <circle cx="-16" cy="28" r="6" fill="#FFFFFF"/>
        <circle cx="14" cy="24" r="6" fill="#FFF3A6"/>
        <ellipse cx="0" cy="10" rx="30" ry="40" fill="url(#egg3DShade)"/>
        <ellipse cx="-10" cy="-6" rx="7" ry="13" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 -10 -6)"/>
      </g>
      <ellipse cx="0" cy="10" rx="30" ry="40" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="1.2"/>
    </g>

    <!-- Trứng tím hoa cà nghiêng cạnh bên (x = 55) -->
    <g transform="translate(55, 15) rotate(15)">
      <clipPath id="fgEggClip3"><ellipse cx="0" cy="10" rx="26" ry="34"/></clipPath>
      <ellipse cx="0" cy="10" rx="26" ry="34" fill="#BDB2FF"/>
      <g clip-path="url(#fgEggClip3)">
        <rect x="-35" y="-5" width="70" height="12" fill="#FFC6FF"/>
        <rect x="-35" y="16" width="70" height="12" fill="#FDFFB6"/>
        <ellipse cx="0" cy="10" rx="26" ry="34" fill="url(#egg3DShade)"/>
        <ellipse cx="-8" cy="-4" rx="6" ry="11" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 -8 -4)"/>
      </g>
      <ellipse cx="0" cy="10" rx="26" ry="34" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="1.2"/>
    </g>
  </g>

  <!-- 3. CHÚ THỎ THỨ HAI ÔM CÀ RỐT (Bên phải, x ≈ 880) -->
  <g transform="translate(860, 490)">
    <ellipse cx="30" cy="140" rx="48" ry="14" fill="url(#fgGrassShadow)"/>

    <!-- Thân thỏ mập mạp -->
    <ellipse cx="30" cy="105" rx="38" ry="32" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="2"/>

    <!-- Đôi tai thỏ -->
    <g transform="rotate(-10 18 10)">
      <ellipse cx="18" cy="10" rx="10" ry="35" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="2"/>
      <ellipse cx="18" cy="12" rx="5" ry="24" fill="#FFB7CE"/>
    </g>
    <g transform="rotate(20 48 8)">
      <ellipse cx="48" cy="8" rx="10" ry="35" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="2"/>
      <ellipse cx="48" cy="10" rx="5" ry="24" fill="#FFB7CE"/>
    </g>

    <!-- Đầu thỏ -->
    <ellipse cx="30" cy="55" rx="32" ry="27" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="2"/>
    <!-- Mắt, mũi, má hồng -->
    <ellipse cx="18" cy="50" rx="4" ry="5.5" fill="#36222F"/><circle cx="16.5" cy="48" r="1.6" fill="#FFFFFF"/>
    <ellipse cx="42" cy="50" rx="4" ry="5.5" fill="#36222F"/><circle cx="40.5" cy="48" r="1.6" fill="#FFFFFF"/>
    <ellipse cx="30" cy="60" rx="4.5" ry="3" fill="#FF85A1"/>
    <circle cx="10" cy="62" r="6.5" fill="#FFB7CE" opacity="0.65"/>
    <circle cx="50" cy="62" r="6.5" fill="#FFB7CE" opacity="0.65"/>

    <!-- Thỏ ôm củ cà rốt to -->
    <g transform="translate(30, 95) rotate(-25)"><use href="#carrot"/></g>

    <!-- Bàn chân trước ôm cà rốt -->
    <ellipse cx="18" cy="98" rx="9" ry="11" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="1.8"/>
    <ellipse cx="45" cy="98" rx="9" ry="11" fill="#FFFFFF" stroke="#F0D3E2" stroke-width="1.8"/>
  </g>

  <!-- 4. THẢM HOA CÚC HỌA MI & BƯỚM XUÂN RỰC RỠ TRÊN ĐỒI -->
  <g>
    <!-- Bụi hoa cúc bên trái -->
    <g transform="translate(60, 630) scale(1.1)"><use href="#fg_daisy"/></g>
    <g transform="translate(240, 625) scale(0.95)"><use href="#fg_daisy"/></g>
    <g transform="translate(350, 640) scale(1.2)"><use href="#fg_daisy"/></g>

    <!-- Bụi hoa cúc lặp bên phải -->
    <g transform="translate(600, 630) scale(1.1)"><use href="#fg_daisy"/></g>
    <g transform="translate(780, 625) scale(0.95)"><use href="#fg_daisy"/></g>
    <g transform="translate(1000, 640) scale(1.2)"><use href="#fg_daisy"/></g>

    <!-- Cánh bướm xuân lộng lẫy dập dờn -->
    <g transform="translate(310, 520) scale(1.1)">
      <ellipse cx="-8" cy="-5" rx="9" ry="11" fill="#FF85A1" transform="rotate(-25 -8 -5)"/>
      <ellipse cx="8" cy="-5" rx="9" ry="11" fill="#FF85A1" transform="rotate(25 8 -5)"/>
      <ellipse cx="-6" cy="7" rx="6" ry="7.5" fill="#FFD166" transform="rotate(20 -6 7)"/>
      <ellipse cx="6" cy="7" rx="6" ry="7.5" fill="#FFD166" transform="rotate(-20 6 7)"/>
      <circle cx="0" cy="1" r="2.5" fill="#4A154B"/>
    </g>

    <g transform="translate(750, 530) scale(1.1)">
      <ellipse cx="-8" cy="-5" rx="9" ry="11" fill="#48CAE4" transform="rotate(-25 -8 -5)"/>
      <ellipse cx="8" cy="-5" rx="9" ry="11" fill="#48CAE4" transform="rotate(25 8 -5)"/>
      <ellipse cx="-6" cy="7" rx="6" ry="7.5" fill="#FFB7CE" transform="rotate(20 -6 7)"/>
      <ellipse cx="6" cy="7" rx="6" ry="7.5" fill="#FFB7CE" transform="rotate(-20 6 7)"/>
      <circle cx="0" cy="1" r="2.5" fill="#4A154B"/>
    </g>
  </g>
</svg>