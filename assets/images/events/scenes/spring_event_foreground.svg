<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Thảm cỏ mùa xuân xanh tươi tiền cảnh (Nền tương phản tốt cho UI) -->
    <linearGradient id="spStageFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3BA557"/>
      <stop offset="0.2" stop-color="#288741"/>
      <stop offset="0.65" stop-color="#19612E"/>
      <stop offset="1" stop-color="#0E3A1A"/>
    </linearGradient>

    <!-- Cành gỗ anh đào cổ thụ -->
    <linearGradient id="fgSakuraWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8D5341"/>
      <stop offset="0.5" stop-color="#6E3A2A"/>
      <stop offset="1" stop-color="#461E13"/>
    </linearGradient>

    <!-- Đổ bóng mặt cỏ mềm mại -->
    <radialGradient id="spGrassShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0E381A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0E381A" stop-opacity="0"/>
    </radialGradient>

    <!-- MẪU BÔNG HOA ANH ĐÀO TIỀN CẢNH SẮC NÉT -->
    <g id="fg_sakura_blossom">
      <circle cx="0" cy="-9" r="6.8" fill="#FFB7CE"/>
      <circle cx="8.5" cy="-2.5" r="6.8" fill="#FFB7CE"/>
      <circle cx="5.2" cy="7.8" r="6.8" fill="#FFB7CE"/>
      <circle cx="-5.2" cy="7.8" r="6.8" fill="#FFB7CE"/>
      <circle cx="-8.5" cy="-2.5" r="6.8" fill="#FFB7CE"/>
      <!-- Lớp cánh phớt trắng -->
      <circle cx="0" cy="-7" r="4.2" fill="#FFE4ED"/>
      <circle cx="6.8" cy="-2" r="4.2" fill="#FFE4ED"/>
      <circle cx="4.2" cy="6" r="4.2" fill="#FFE4ED"/>
      <circle cx="-4.2" cy="6" r="4.2" fill="#FFE4ED"/>
      <circle cx="-6.8" cy="-2" r="4.2" fill="#FFE4ED"/>
      <!-- Nhụy hoa -->
      <circle cx="0" cy="0" r="3.8" fill="#FFD54F"/>
      <circle cx="0" cy="0" r="1.8" fill="#E65100"/>
    </g>

    <!-- MẪU HOA TULIP NỞ RỰC RỠ -->
    <g id="fg_tulip_flower">
      <path d="M 0 0 C -14 -6, -16 -30, 0 -36 C 16 -30, 14 -6, 0 0 Z" fill="#FF4081" stroke="#C2185B" stroke-width="1.5"/>
      <path d="M 0 0 C -6 -6, -8 -25, 0 -30 C 8 -25, 6 -6, 0 0 Z" fill="#FF80AB"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#2E7D32" stroke-width="3.8" stroke-linecap="round"/>
      <path d="M 0 20 Q 12 10 20 15" stroke="#2E7D32" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- MẪU HOA CÚC HỌA MI TIỀN CẢNH -->
    <g id="fg_sp_daisy">
      <ellipse cx="0" cy="-8" rx="3.2" ry="7.5" fill="#FFFFFF"/>
      <ellipse cx="5.6" cy="-5.6" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(45 5.6 -5.6)"/>
      <ellipse cx="8" cy="0" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(90 8 0)"/>
      <ellipse cx="5.6" cy="5.6" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(135 5.6 5.6)"/>
      <ellipse cx="0" cy="8" rx="3.2" ry="7.5" fill="#FFFFFF"/>
      <ellipse cx="-5.6" cy="5.6" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(225 -5.6 5.6)"/>
      <ellipse cx="-8" cy="0" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(270 -8 0)"/>
      <ellipse cx="-5.6" cy="-5.6" rx="3.2" ry="7.5" fill="#FFFFFF" transform="rotate(315 -5.6 -5.6)"/>
      <circle cx="0" cy="0" r="4.2" fill="#FFCA28"/>
      <circle cx="0" cy="0" r="2" fill="#FFA000"/>
    </g>
  </defs>

  <!-- THẢM ĐỒI CỎ MÙA XUÂN TIỀN CẢNH (Seamless chu kỳ 540px: x=0 (y=610) và x=1080 (y=610)) -->
  <path d="M 0 610 
           Q 135 570 270 605 T 540 610 
           Q 675 570 810 605 T 1080 610 
           L 1080 960 L 0 960 Z" 
        fill="url(#spStageFloor)"/>

  <!-- Viền mép cỏ sáng rực ánh xuân đón nắng -->
  <path d="M 0 610 Q 135 570 270 605 T 540 610 Q 675 570 810 605 T 1080 610" 
        fill="none" stroke="#D1F8B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 0 616 Q 135 576 270 611 T 540 616 Q 675 576 810 611 T 1080 616" 
        fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>

  <!-- ==================== CÁC VẬT THỂ TIỀN CẢNH ==================== -->

  <!-- 1. CÀNH ĐẠI THỤ HOA ANH ĐÀO VƯƠN XUỐNG TỪ TRÊN (Bên trái, x ≈ 0 - 320) -->
  <g transform="translate(60, 100)">
    <!-- Cành cổ thụ uốn cong từ trên mép rủ xuống -->
    <path d="M -80 0 Q 60 50 140 120 Q 200 170 240 220" 
          stroke="url(#fgSakuraWood)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 60 50 Q 120 20 180 50" stroke="url(#fgSakuraWood)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 140 120 Q 170 80 210 90" stroke="url(#fgSakuraWood)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 180 150 Q 220 180 260 170" stroke="url(#fgSakuraWood)" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Các chùm hoa anh đào nở rộ trên cành -->
    <g transform="translate(80, 55) scale(1.3)"><use href="#fg_sakura_blossom"/></g>
    <g transform="translate(145, 120) scale(1.4)"><use href="#fg_sakura_blossom"/></g>
    <g transform="translate(205, 175) scale(1.35)"><use href="#fg_sakura_blossom"/></g>
    <g transform="translate(245, 220) scale(1.2)"><use href="#fg_sakura_blossom"/></g>
    <g transform="translate(175, 48) scale(1.15)"><use href="#fg_sakura_blossom"/></g>
    <g transform="translate(210, 90) scale(1.2)"><use href="#fg_sakura_blossom"/></g>
    <g transform="translate(260, 170) scale(1.1)"><use href="#fg_sakura_blossom"/></g>

    <!-- Nụ hoa e ấp -->
    <circle cx="250" cy="140" r="4.5" fill="#FF4081"/>
    <circle cx="270" cy="230" r="4.5" fill="#FF4081"/>
  </g>

  <!-- 2. THẢM HOA TULIP & HOA CÚC NỞ RỘ TRÊN ĐỒI (Bên trái, x ≈ 180 - 320) -->
  <g transform="translate(220, 600)">
    <ellipse cx="20" cy="40" rx="45" ry="12" fill="url(#spGrassShadow)"/>
    <g transform="translate(0, 10)"><use href="#fg_tulip_flower"/></g>
    <!-- Tulip vàng -->
    <g transform="translate(28, 5) scale(1.05)">
      <path d="M 0 0 C -14 -6, -16 -30, 0 -36 C 16 -30, 14 -6, 0 0 Z" fill="#FFC107" stroke="#FFA000" stroke-width="1.5"/>
      <path d="M 0 0 C -6 -6, -8 -25, 0 -30 C 8 -25, 6 -6, 0 0 Z" fill="#FFE082"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#2E7D32" stroke-width="3.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(-25, 20) scale(0.9)"><use href="#fg_tulip_flower"/></g>
    <g transform="translate(48, 25) scale(0.85)"><use href="#fg_sp_daisy"/></g>
  </g>

  <!-- 3. CÀNH HOA ANH ĐÀO VƯƠN XUỐNG THỨ HAI (Bên phải, x ≈ 600 - 900) -->
  <g transform="translate(600, 100)">
    <path d="M -80 0 Q 60 50 140 120 Q 200 170 240 220" 
          stroke="url(#fgSakuraWood)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 60 50 Q 120 20 180 50" stroke="url(#fgSakuraWood)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 140 120 Q 170 80 210 90" stroke="url(#fgSakuraWood)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g transform="translate(80, 55) scale(1.3)"><use href="#fg_sakura_blossom"/></g>
    <g transform="translate(145, 120) scale(1.4)"><use href="#fg_sakura_blossom"/></g>
    <g transform="translate(205, 175) scale(1.35)"><use href="#fg_sakura_blossom"/></g>
    <g transform="translate(245, 220) scale(1.2)"><use href="#fg_sakura_blossom"/></g>
  </g>

  <!-- 4. THẢM HOA TULIP & CÚC HỌA MI LẶP CHU KỲ BÊN PHẢI (x ≈ 760) -->
  <g transform="translate(760, 600)">
    <ellipse cx="20" cy="40" rx="45" ry="12" fill="url(#spGrassShadow)"/>
    <g transform="translate(0, 10)"><use href="#fg_tulip_flower"/></g>
    <g transform="translate(28, 5) scale(1.05)">
      <path d="M 0 0 C -14 -6, -16 -30, 0 -36 C 16 -30, 14 -6, 0 0 Z" fill="#FFC107" stroke="#FFA000" stroke-width="1.5"/>
      <path d="M 0 0 C -6 -6, -8 -25, 0 -30 C 8 -25, 6 -6, 0 0 Z" fill="#FFE082"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#2E7D32" stroke-width="3.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(-25, 20) scale(0.9)"><use href="#fg_tulip_flower"/></g>
    <g transform="translate(48, 25) scale(0.85)"><use href="#fg_sp_daisy"/></g>
  </g>

  <!-- 5. BƯỚM XUÂN 3D DẬP DỜN & MƯA CÁNH HOA RƠI CẬN CẢNH -->
  <g>
    <!-- Đôi bướm xuân lộng lẫy -->
    <g transform="translate(380, 510) scale(1.15)">
      <ellipse cx="-9" cy="-5" rx="10" ry="12" fill="#FF85A1" transform="rotate(-25 -9 -5)"/>
      <ellipse cx="9" cy="-5" rx="10" ry="12" fill="#FF85A1" transform="rotate(25 9 -5)"/>
      <ellipse cx="-7" cy="8" rx="6.5" ry="8" fill="#FFD166" transform="rotate(20 -7 8)"/>
      <ellipse cx="7" cy="8" rx="6.5" ry="8" fill="#FFD166" transform="rotate(-20 7 8)"/>
      <circle cx="0" cy="1" r="2.6" fill="#3D1A24"/>
    </g>

    <g transform="translate(920, 510) scale(1.15)">
      <ellipse cx="-9" cy="-5" rx="10" ry="12" fill="#FF85A1" transform="rotate(-25 -9 -5)"/>
      <ellipse cx="9" cy="-5" rx="10" ry="12" fill="#FF85A1" transform="rotate(25 9 -5)"/>
      <ellipse cx="-7" cy="8" rx="6.5" ry="8" fill="#FFD166" transform="rotate(20 -7 8)"/>
      <ellipse cx="7" cy="8" rx="6.5" ry="8" fill="#FFD166" transform="rotate(-20 7 8)"/>
      <circle cx="0" cy="1" r="2.6" fill="#3D1A24"/>
    </g>

    <!-- Cánh hoa anh đào rơi cận cảnh xoay tít trong gió -->
    <ellipse cx="140" cy="420" rx="7" ry="4" fill="#FFB7CE" transform="rotate(35 140 420)"/>
    <ellipse cx="280" cy="380" rx="6.5" ry="3.8" fill="#FFB7CE" transform="rotate(-25 280 380)"/>
    <ellipse cx="440" cy="460" rx="7.2" ry="4.2" fill="#FFB7CE" transform="rotate(45 440 460)"/>
    <ellipse cx="500" cy="390" rx="6.8" ry="4" fill="#FFB7CE" transform="rotate(15 500 390)"/>

    <ellipse cx="680" cy="420" rx="7" ry="4" fill="#FFB7CE" transform="rotate(35 680 420)"/>
    <ellipse cx="820" cy="380" rx="6.5" ry="3.8" fill="#FFB7CE" transform="rotate(-25 820 380)"/>
    <ellipse cx="980" cy="460" rx="7.2" ry="4.2" fill="#FFB7CE" transform="rotate(45 980 460)"/>
  </g>
</svg>