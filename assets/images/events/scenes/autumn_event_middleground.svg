<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Triền đồi mùa thu tầng trung -->
    <linearGradient id="autumnMidHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C5531B"/>
      <stop offset="0.6" stop-color="#88320F"/>
      <stop offset="1" stop-color="#541B08"/>
    </linearGradient>

    <!-- Mẫu lá phong nhỏ bay trong gió -->
    <g id="mg_maple_leaf">
      <path d="M 0 -10 C 1 -7, 2 -7, 4 -9 C 3 -6, 5 -5, 8 -7 C 7 -4, 7 -2, 9 -2 
               C 7 0, 7 1, 8 4 C 5 3, 4 4, 3 6 C 2 4, 1 4, 0 5 
               C -1 4, -2 4, -3 6 C -4 4, -5 3, -8 4 C -7 1, -7 0, -9 -2 
               C -7 -2, -7 -4, -8 -7 C -5 -5, -3 -6, -4 -9 C -2 -7, -1 -7, 0 -10 Z" 
            stroke="#000000" stroke-opacity="0.15" stroke-width="0.5"/>
      <line x1="0" y1="5" x2="0" y2="10" stroke="#3A1707" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- TRIỀN ĐỒI THU TẦNG TRUNG (Seamless: x=0 (y=535) và x=1080 (y=535)) -->
  <path d="M 0 535 
           Q 135 490 270 520 T 540 535 
           Q 675 490 810 520 T 1080 535 
           L 1080 680 L 0 680 Z" 
        fill="url(#autumnMidHills)"/>

  <!-- RẶNG CÂY RỪNG THU TRÊN ĐỈNH ĐỒI (Tạo nhịp điệu phong cảnh thiên nhiên) -->
  <g opacity="0.9">
    <!-- Cụm cây 1 (x ≈ 80 - 220) -->
    <g transform="translate(100, 480)">
      <circle cx="0" cy="20" r="24" fill="#94260D"/>
      <circle cx="28" cy="14" r="28" fill="#D94B16"/>
      <circle cx="56" cy="18" r="22" fill="#F5A21D"/>
      <circle cx="80" cy="24" r="18" fill="#BF3913"/>
      <circle cx="26" cy="2" r="18" fill="#F7B72A"/>
    </g>

    <!-- Cụm cây 2 (x ≈ 350 - 460) -->
    <g transform="translate(360, 475)">
      <circle cx="0" cy="22" r="20" fill="#E05B19"/>
      <circle cx="25" cy="12" r="26" fill="#F7A720"/>
      <circle cx="54" cy="18" r="22" fill="#B32F12"/>
      <circle cx="24" cy="0" r="16" fill="#FCD04B"/>
    </g>

    <!-- Cụm cây 3 (Lặp đối ứng chu kỳ tại x ≈ 640 - 760) -->
    <g transform="translate(640, 480)">
      <circle cx="0" cy="20" r="24" fill="#94260D"/>
      <circle cx="28" cy="14" r="28" fill="#D94B16"/>
      <circle cx="56" cy="18" r="22" fill="#F5A21D"/>
      <circle cx="80" cy="24" r="18" fill="#BF3913"/>
      <circle cx="26" cy="2" r="18" fill="#F7B72A"/>
    </g>

    <!-- Cụm cây 4 (x ≈ 900 - 1000) -->
    <g transform="translate(900, 475)">
      <circle cx="0" cy="22" r="20" fill="#E05B19"/>
      <circle cx="25" cy="12" r="26" fill="#F7A720"/>
      <circle cx="54" cy="18" r="22" fill="#B32F12"/>
      <circle cx="24" cy="0" r="16" fill="#FCD04B"/>
    </g>
  </g>

  <!-- HÀNG RÀO GỖ NÔNG TRẠI MÙA THU (Rustic Wooden Fence) -->
  <g stroke="#421E0B" stroke-linecap="round" opacity="0.85">
    <!-- Thanh rào ngang -->
    <line x1="220" y1="550" x2="330" y2="542" stroke-width="3"/>
    <line x1="220" y1="560" x2="330" y2="552" stroke-width="3"/>
    <!-- Cọc rào đứng -->
    <line x1="230" y1="540" x2="230" y2="568" stroke-width="4"/>
    <line x1="265" y1="538" x2="265" y2="565" stroke-width="4"/>
    <line x1="300" y1="535" x2="300" y2="562" stroke-width="4"/>

    <!-- Cụm rào lặp bên phải -->
    <line x1="760" y1="550" x2="870" y2="542" stroke-width="3"/>
    <line x1="760" y1="560" x2="870" y2="552" stroke-width="3"/>
    <line x1="770" y1="540" x2="770" y2="568" stroke-width="4"/>
    <line x1="805" y1="538" x2="805" y2="565" stroke-width="4"/>
    <line x1="840" y1="535" x2="840" y2="562" stroke-width="4"/>
  </g>

  <!-- LÁ PHONG TẦNG TRUNG BAY THEO GIÓ CHIỀU -->
  <g>
    <g transform="translate(190, 450) rotate(35) scale(0.9)" fill="#D94313"><use href="#mg_maple_leaf"/></g>
    <g transform="translate(310, 430) rotate(-20) scale(0.75)" fill="#F5A827"><use href="#mg_maple_leaf"/></g>
    <g transform="translate(480, 470) rotate(50) scale(0.85)" fill="#E85E1A"><use href="#mg_maple_leaf"/></g>
    <g transform="translate(730, 450) rotate(35) scale(0.9)" fill="#D94313"><use href="#mg_maple_leaf"/></g>
    <g transform="translate(850, 430) rotate(-20) scale(0.75)" fill="#F5A827"><use href="#mg_maple_leaf"/></g>
    <g transform="translate(1020, 470) rotate(50) scale(0.85)" fill="#E85E1A"><use href="#mg_maple_leaf"/></g>
  </g>
</svg>