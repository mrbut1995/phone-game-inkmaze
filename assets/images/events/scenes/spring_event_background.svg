<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Bầu trời ban mai mùa xuân 4 nấc chuyển màu dịu mát -->
    <linearGradient id="spSkyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B2E2FF"/>
      <stop offset="0.35" stop-color="#DAF5D0"/>
      <stop offset="0.7" stop-color="#FFFAD5"/>
      <stop offset="1" stop-color="#D6F4B8"/>
    </linearGradient>

    <!-- Ánh nắng xuân ấm áp -->
    <radialGradient id="spSunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFEE6" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFF3A6" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFF3A6" stop-opacity="0"/>
    </radialGradient>

    <!-- Dãy núi biếc xa xăm mờ trong sương xuân -->
    <linearGradient id="spDistantHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ECFA1"/>
      <stop offset="1" stop-color="#4AA874"/>
    </linearGradient>
  </defs>

  <!-- Nền trời mùa xuân bao phủ toàn canvas -->
  <rect width="1080" height="960" fill="url(#spSkyGrad)"/>

  <!-- ==================== CẦU VỒNG PASTEL VẮT NGANG TRỜI ==================== -->
  <g opacity="0.38" fill="none" stroke-linecap="round">
    <!-- Cầu vồng 1 (x = 0..540) -->
    <path d="M 0 400 Q 270 140 540 400" stroke="#FF8FA3" stroke-width="7"/>
    <path d="M 0 407 Q 270 147 540 407" stroke="#FFD166" stroke-width="7"/>
    <path d="M 0 414 Q 270 154 540 414" stroke="#FFF275" stroke-width="7"/>
    <path d="M 0 421 Q 270 161 540 421" stroke="#06D6A0" stroke-width="7"/>
    <path d="M 0 428 Q 270 168 540 428" stroke="#118AB2" stroke-width="7"/>

    <!-- Cầu vồng lặp chu kỳ đối ứng bên phải (x = 540..1080) -->
    <path d="M 540 400 Q 810 140 1080 400" stroke="#FF8FA3" stroke-width="7"/>
    <path d="M 540 407 Q 810 147 1080 407" stroke="#FFD166" stroke-width="7"/>
    <path d="M 540 414 Q 810 154 1080 414" stroke="#FFF275" stroke-width="7"/>
    <path d="M 540 421 Q 810 161 1080 421" stroke="#06D6A0" stroke-width="7"/>
    <path d="M 540 428 Q 810 168 1080 428" stroke="#118AB2" stroke-width="7"/>
  </g>

  <!-- ==================== MẶT TRỜI XUÂN ẤM ÁP ==================== -->
  <!-- Mặt trời 1 (x = 360, y = 200) -->
  <circle cx="360" cy="200" r="115" fill="url(#spSunAura)"/>
  <circle cx="360" cy="200" r="42" fill="#FFF275"/>

  <!-- Mặt trời lặp chu kỳ đối ứng bên phải (x = 900) -->
  <circle cx="900" cy="200" r="115" fill="url(#spSunAura)"/>
  <circle cx="900" cy="200" r="42" fill="#FFF275"/>

  <!-- Những đám mây trắng xốp bồng bềnh -->
  <g fill="#FFFFFF" fill-opacity="0.92">
    <g transform="translate(150, 160) scale(1.15)">
      <ellipse cx="0" cy="0" rx="36" ry="16"/><circle cx="-16" cy="-9" r="15"/><circle cx="10" cy="-14" r="18"/><circle cx="28" cy="-5" r="13"/>
    </g>
    <g transform="translate(690, 150) scale(1.15)">
      <ellipse cx="0" cy="0" rx="36" ry="16"/><circle cx="-16" cy="-9" r="15"/><circle cx="10" cy="-14" r="18"/><circle cx="28" cy="-5" r="13"/>
    </g>
    <g transform="translate(460, 240) scale(0.75)" fill-opacity="0.75">
      <ellipse cx="0" cy="0" rx="32" ry="12"/><circle cx="-13" cy="-7" r="13"/><circle cx="8" cy="-9" r="15"/>
    </g>
    <g transform="translate(1000, 230) scale(0.75)" fill-opacity="0.75">
      <ellipse cx="0" cy="0" rx="32" ry="12"/><circle cx="-13" cy="-7" r="13"/><circle cx="8" cy="-9" r="15"/>
    </g>
  </g>

  <!-- Đàn chim én mùa xuân chao liệng đón gió -->
  <g stroke="#234E35" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M 230 230 Q 238 220 246 230 M 246 230 Q 254 220 262 230"/>
    <path d="M 268 245 Q 275 238 282 245 M 282 245 Q 289 238 296 245"/>
    <path d="M 302 262 Q 308 255 314 262 M 314 262 Q 320 255 326 262"/>
    <path d="M 770 220 Q 778 210 786 220 M 786 220 Q 794 210 802 220"/>
    <path d="M 808 235 Q 815 228 822 235 M 822 235 Q 829 228 836 235"/>
  </g>

  <!-- ĐƯỜNG CHÂN TRỜI: DÃY NÚI BIẾC XA XĂM -->
  <!-- Seamless: Khớp nối tại x=0 và x=1080 ở y=510 -->
  <path d="M 0 510 
           Q 90 465 180 490 Q 260 515 340 480 Q 440 450 540 510 
           Q 630 465 720 490 Q 800 515 880 480 Q 980 450 1080 510 
           L 1080 580 L 0 580 Z" 
        fill="url(#spDistantHills)" opacity="0.65"/>
</svg>