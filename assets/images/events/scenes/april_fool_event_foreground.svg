<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Thảm sàn diễn rạp xiếc kẹo ngọt tiền cảnh -->
    <linearGradient id="circusStageFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF69B4"/>
      <stop offset="0.25" stop-color="#E040A0"/>
      <stop offset="0.65" stop-color="#B01275"/>
      <stop offset="1" stop-color="#6A0045"/>
    </linearGradient>

    <!-- Chuông vàng kim loại 3D sắc nét -->
    <radialGradient id="fgBellGold" cx="35%" cy="30%" r="65%">
      <stop offset="0" stop-color="#FFFDE7"/>
      <stop offset="0.4" stop-color="#FFD54F"/>
      <stop offset="0.8" stop-color="#FF9800"/>
      <stop offset="1" stop-color="#C66900"/>
    </radialGradient>

    <!-- Đổ bóng mặt đất mềm mại -->
    <radialGradient id="stageShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3B0A45" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#3B0A45" stop-opacity="0"/>
    </radialGradient>

    <!-- Mẫu quả chuông lắc lư lớn -->
    <g id="fg_gold_bell">
      <circle cx="0" cy="0" r="14" fill="url(#fgBellGold)" stroke="#3B0A45" stroke-width="1.8"/>
      <ellipse cx="-4" cy="-4" rx="4.5" ry="2.5" fill="#FFFFFF" opacity="0.75"/>
      <path d="M -8 5 L 8 5 M 0 5 L 0 12" stroke="#7A3F00" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="5" r="2.2" fill="#7A3F00"/>
    </g>

    <!-- Mẫu gậy tung hứng carnival (Juggling Pin) -->
    <g id="juggling_pin">
      <ellipse cx="0" cy="0" rx="9" ry="22" fill="#00BCD4" stroke="#3B0A45" stroke-width="1.8"/>
      <rect x="-9" y="-6" width="18" height="12" fill="#FFEB3B"/>
      <path d="M -5 18 L -3 38 L 3 38 L 5 18 Z" fill="#FFFFFF" stroke="#3B0A45" stroke-width="1.5"/>
      <circle cx="0" cy="42" r="4.5" fill="#E91E63" stroke="#3B0A45" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- THẢM SÀN DIỄN LỄ HỘI TIỀN CẢNH (Seamless chu kỳ 540px: x=0 (y=610) và x=1080 (y=610)) -->
  <path d="M 0 610 
           Q 135 570 270 605 T 540 610 
           Q 675 570 810 605 T 1080 610 
           L 1080 960 L 0 960 Z" 
        fill="url(#circusStageFloor)"/>

  <!-- Viền kép uốn lượn phong cách carnival ngăn cách mép sân khấu -->
  <path d="M 0 610 Q 135 570 270 605 T 540 610 Q 675 570 810 605 T 1080 610" 
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M 0 616 Q 135 576 270 611 T 540 616 Q 675 576 810 611 T 1080 616" 
        fill="none" stroke="#FFD54F" stroke-opacity="0.65" stroke-width="2.5"/>

  <!-- ==================== CÁC VẬT THỂ TIỀN CẢNH ==================== -->

  <!-- 1. HỘP BẤT NGỜ (JACK-IN-THE-BOX) & MŨ HỀ KHỔNG LỒ (Bên trái, x ≈ 130) -->
  <g transform="translate(130, 450)">
    <!-- Đổ bóng đáy hộp -->
    <ellipse cx="25" cy="180" rx="55" ry="16" fill="url(#stageShadow)"/>

    <!-- Chiếc hộp lò xo quà tặng rực rỡ -->
    <rect x="-15" y="105" width="80" height="75" rx="6" fill="#7C3AED" stroke="#3B0A45" stroke-width="3"/>
    <!-- Nơ sọc vàng quanh hộp -->
    <rect x="20" y="105" width="10" height="75" fill="#FFD54F"/>
    <rect x="-15" y="137" width="80" height="11" fill="#FFD54F"/>
    <!-- Tay quay hộp nhạc (Crank) -->
    <line x1="65" y1="142" x2="85" y2="142" stroke="#3B0A45" stroke-width="4" stroke-linecap="round"/>
    <circle cx="85" cy="142" r="5" fill="#E91E63"/>

    <!-- Lò xo thép bật tung (Spring coil) -->
    <path d="M 25 105 Q 45 92 25 80 Q 5 68 25 56 Q 45 44 25 32 Q 5 20 25 8" 
          stroke="#00BCD4" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- CHIẾC MŨ HỀ BA NGỌN 3D KHỔNG LỒ GẮN ĐỈNH LÒ XO -->
    <g transform="translate(25, -20) rotate(-10)">
      <!-- Ngọn trái (Hồng cánh sen) -->
      <path d="M -45 35 C -85 20 -125 -15 -110 -45 C -80 -10 -45 15 -12 35 Z" 
            fill="#E91E63" stroke="#3B0A45" stroke-width="3.5" stroke-linejoin="round"/>
      <g transform="translate(-112, -45)"><use href="#fg_gold_bell"/></g>

      <!-- Ngọn giữa (Tím hoàng gia) -->
      <path d="M -26 35 C -30 -30 -12 -80 0 -90 C 12 -80 30 -30 26 35 Z" 
            fill="#7C3AED" stroke="#3B0A45" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="0,-72 12,-50 0,-28 -12,-50" fill="#FFD54F"/>
      <g transform="translate(0, -90)"><use href="#fg_gold_bell"/></g>

      <!-- Ngọn phải (Xanh ngọc năng động) -->
      <path d="M 12 35 C 45 15 80 -10 110 -45 C 125 -15 85 20 45 35 Z" 
            fill="#00BCD4" stroke="#3B0A45" stroke-width="3.5" stroke-linejoin="round"/>
      <g transform="translate(112, -45)"><use href="#fg_gold_bell"/></g>

      <!-- Vành đai mũ viền quả trám -->
      <rect x="-65" y="30" width="130" height="26" rx="13" fill="#3B0A45"/>
      <g fill="#FFD54F">
        <polygon points="-45,43 -35,34 -25,43 -35,52"/>
        <polygon points="-10,43 0,34 10,43 0,52"/>
        <polygon points="25,43 35,34 45,43 35,52"/>
      </g>
    </g>
  </g>

  <!-- 2. GẬY TUNG HỨNG & MẶT CƯỜI HỀ Ở GIỮA (x ≈ 420 - 520) -->
  <g transform="translate(420, 560)">
    <!-- Mặt nạ cười hề vàng rực -->
    <g transform="translate(40, -10)">
      <circle r="36" fill="#FFE082" stroke="#3B0A45" stroke-width="3"/>
      <path d="M -18 -8 A 6 6 0 0 1 -4 -8" fill="none" stroke="#3B0A45" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="14" cy="-8" r="4.5" fill="#3B0A45"/><circle cx="16" cy="-10" r="1.5" fill="#FFFFFF"/>
      <circle cx="0" cy="3" r="9" fill="#FF1744"/>
      <path d="M -20 12 Q 0 32 20 12" fill="#3B0A45"/>
      <path d="M -8 20 Q 0 32 8 20 Z" fill="#FF4081"/>
    </g>
    <!-- Gậy tung hứng chéo nhau -->
    <g transform="translate(10, 40) rotate(-35)"><use href="#juggling_pin"/></g>
    <g transform="translate(80, 40) rotate(35)"><use href="#juggling_pin"/></g>
  </g>

  <!-- 3. CỤM HỘP LÒ XO VÀ MŨ HỀ THỨ HAI (Bên phải, x ≈ 880) -->
  <g transform="translate(880, 480) scale(0.9)">
    <ellipse cx="25" cy="180" rx="50" ry="15" fill="url(#stageShadow)"/>
    <rect x="-10" y="110" width="75" height="70" rx="6" fill="#E91E63" stroke="#3B0A45" stroke-width="3"/>
    <rect x="22" y="110" width="10" height="70" fill="#00BCD4"/>
    <path d="M 25 110 Q 45 96 25 84 Q 5 72 25 60 Q 45 48 25 36" stroke="#FFD54F" stroke-width="6.5" fill="none"/>
    
    <!-- Mũ hề ngọn kép -->
    <g transform="translate(25, 20) rotate(15)">
      <path d="M -30 25 C -65 10 -95 -15 -85 -40 C -60 -10 -30 10 -5 25 Z" fill="#7C3AED" stroke="#3B0A45" stroke-width="3"/>
      <g transform="translate(-86, -40)"><use href="#fg_gold_bell"/></g>
      <path d="M 5 25 C 30 10 60 -10 85 -40 C 95 -15 65 10 30 25 Z" fill="#00BCD4" stroke="#3B0A45" stroke-width="3"/>
      <g transform="translate(86, -40)"><use href="#fg_gold_bell"/></g>
      <rect x="-45" y="20" width="90" height="20" rx="10" fill="#3B0A45"/>
    </g>
  </g>

  <!-- 4. MƯA PHÁO GIẤY CONFETTI & RUY-BĂNG RƠI RỘN RÃ -->
  <g>
    <!-- Mảnh pháo giấy xoay tròn nhiều góc độ -->
    <rect x="70" y="520" width="16" height="16" rx="3" fill="#FFEB3B" stroke="#3B0A45" stroke-width="1.2" transform="rotate(25 78 528)"/>
    <rect x="280" y="500" width="18" height="18" rx="3" fill="#E91E63" stroke="#3B0A45" stroke-width="1.2" transform="rotate(45 289 509)"/>
    <circle cx="340" cy="540" r="8" fill="#00BCD4"/>
    <polygon points="210,480 226,488 214,502" fill="#7C3AED"/>
    
    <rect x="610" y="520" width="16" height="16" rx="3" fill="#FFEB3B" stroke="#3B0A45" stroke-width="1.2" transform="rotate(25 618 528)"/>
    <rect x="820" y="500" width="18" height="18" rx="3" fill="#E91E63" stroke="#3B0A45" stroke-width="1.2" transform="rotate(45 829 509)"/>
    <circle cx="880" cy="540" r="8" fill="#00BCD4"/>
    <polygon points="750,480 766,488 754,502" fill="#7C3AED"/>

    <!-- Ngôi sao lấp lánh (Sparkles) -->
    <path d="M 170 380 Q 170 388 178 388 Q 170 388 170 396 Q 170 388 162 388 Q 170 388 170 380 Z" fill="#FFFFFF"/>
    <path d="M 710 380 Q 710 388 718 388 Q 710 388 710 396 Q 710 388 702 388 Q 710 388 710 380 Z" fill="#FFFFFF"/>
  </g>
</svg>