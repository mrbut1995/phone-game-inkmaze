<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1AC3DF"/>
      <stop offset="0.45" stop-color="#0E98BD"/>
      <stop offset="1" stop-color="#066986"/>
    </linearGradient>
  </defs>

  <!-- Vùng biển bắt đầu từ đường chân trời y=440 đến bờ cát y=640 (vùng trên y=440 là trong suốt) -->
  <rect x="0" y="440" width="1080" height="200" fill="url(#seaGrad)"/>

  <!-- Các dải sóng nhấp nhô tuần hoàn chu kỳ 270px (Seamless 100%) -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <!-- Sóng xa (mảnh) -->
    <path d="M 0 465 Q 67.5 458 135 465 T 270 465 T 405 465 T 540 465 T 675 465 T 810 465 T 945 465 T 1080 465" 
          stroke-width="1.8" stroke-opacity="0.65"/>
    <!-- Sóng trung -->
    <path d="M 0 500 Q 67.5 492 135 500 T 270 500 T 405 500 T 540 500 T 675 500 T 810 500 T 945 500 T 1080 500" 
          stroke-width="2.4" stroke-opacity="0.5"/>
    <!-- Sóng gần -->
    <path d="M 0 545 Q 67.5 536 135 545 T 270 545 T 405 545 T 540 545 T 675 545 T 810 545 T 945 545 T 1080 545" 
          stroke-width="3" stroke-opacity="0.45"/>
  </g>

  <!-- Thuyền buồm 1: Thuyền đôi buồm trắng & cam (x ≈ 280) -->
  <g transform="translate(260, 420)">
    <ellipse cx="28" cy="45" rx="22" ry="4" fill="#045A77" opacity="0.6"/>
    <path d="M 8 34 L 48 34 C 44 41, 38 45, 33 45 L 17 45 C 12 45, 10 41, 8 34 Z" fill="#FFFFFF" stroke="#085577" stroke-width="1"/>
    <path d="M 11 38 L 45 38 C 43 42, 38 44, 33 44 L 18 44 C 13 44, 12 42, 11 38 Z" fill="#0A77A5"/>
    <line x1="28" y1="6" x2="28" y2="35" stroke="#4A341E" stroke-width="2"/>
    <path d="M 28 6 Q 38 18 46 32 L 28 31 Z" fill="#FFFDF5"/>
    <path d="M 28 6 Q 34 18 36 31 L 28 31 Z" fill="#DECAB0" opacity="0.45"/>
    <path d="M 26 10 Q 18 21 10 32 L 26 31 Z" fill="#FF5E57"/>
    <polygon points="28,4 20,6.5 28,9" fill="#FFA900"/>
  </g>

  <!-- Thuyền buồm 2: Thuyền nhỏ cự ly xa (x ≈ 820) -->
  <g transform="translate(800, 440) scale(0.75)">
    <ellipse cx="28" cy="45" rx="18" ry="3.5" fill="#045A77" opacity="0.5"/>
    <path d="M 10 34 L 46 34 C 43 40, 38 44, 33 44 L 18 44 C 13 44, 11 40, 10 34 Z" fill="#FFFFFF"/>
    <line x1="28" y1="8" x2="28" y2="35" stroke="#4A341E" stroke-width="1.8"/>
    <path d="M 28 8 Q 38 20 44 32 L 28 31 Z" fill="#FFF8E7"/>
    <path d="M 26 12 Q 18 22 12 32 L 26 31 Z" fill="#20B5E0"/>
  </g>

  <!-- Phao tiêu đỏ trắng neo xa -->
  <g transform="translate(620, 495)">
    <ellipse cx="0" cy="5" rx="9" ry="3" fill="#045A77" opacity="0.5"/>
    <circle cx="0" cy="0" r="7" fill="#FF5A5F" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#0E86AC"/>
  </g>
</svg>