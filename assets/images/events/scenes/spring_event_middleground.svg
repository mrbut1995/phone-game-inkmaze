<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Triền đồi cỏ mùa xuân tầng trung -->
    <linearGradient id="spMidHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ED478"/>
      <stop offset="0.45" stop-color="#42AF53"/>
      <stop offset="1" stop-color="#248535"/>
    </linearGradient>

    <!-- Con suối mùa xuân lấp lánh -->
    <linearGradient id="springStream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80DEEA"/>
      <stop offset="1" stop-color="#00ACC1"/>
    </linearGradient>

    <!-- MẪU CÂY HOA ANH ĐÀO NỞ RỘ TRUNG CẢNH -->
    <g id="mg_sakura_tree">
      <path d="M 0 50 L 0 15 M 0 25 L -10 10 M 0 20 L 10 8" stroke="#5D3A20" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-14" cy="0" r="20" fill="#FFB7CE" opacity="0.9"/>
      <circle cx="14" cy="0" r="20" fill="#FF85A1" opacity="0.9"/>
      <circle cx="0" cy="-14" r="22" fill="#FFAEC0" opacity="0.95"/>
      <circle cx="0" cy="-6" r="15" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </defs>

  <!-- ĐỒI CỎ MÙA XUÂN TẦNG TRUNG (Seamless: x=0 (y=530) và x=1080 (y=530)) -->
  <path d="M 0 530 
           Q 135 480 270 515 T 540 530 
           Q 675 480 810 515 T 1080 530 
           L 1080 670 L 0 670 Z" 
        fill="url(#spMidHills)"/>

  <!-- ==================== SUỐI XUÂN UỐN LƯỢN QUA THUNG LŨNG ==================== -->
  <path d="M 380 520 Q 420 570 460 670 L 400 670 Q 370 570 340 520 Z" fill="url springStream" fill="#80DEEA" opacity="0.6"/>
  <path d="M 920 520 Q 960 570 1000 670 L 940 670 Q 910 570 880 520 Z" fill="#80DEEA" opacity="0.6"/>

  <!-- ==================== RẶNG CÂY ANH ĐÀO HỒNG PHẤN TRUNG CẢNH ==================== -->
  <g transform="translate(130, 485)"><use href="#mg_sakura_tree"/></g>
  <g transform="translate(250, 495) scale(0.8)"><use href="#mg_sakura_tree"/></g>
  <g transform="translate(480, 500) scale(0.85)"><use href="#mg_sakura_tree"/></g>

  <g transform="translate(670, 485)"><use href="#mg_sakura_tree"/></g>
  <g transform="translate(790, 495) scale(0.8)"><use href="#mg_sakura_tree"/></g>
  <g transform="translate(1020, 500) scale(0.85)"><use href="#mg_sakura_tree"/></g>

  <!-- HÀNG RÀO GỖ TRẮNG ĐỒNG QUÊ (Picket Fence) -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.92">
    <!-- Cụm rào 1 (x ≈ 180 - 280) -->
    <line x1="180" y1="540" x2="280" y2="535" stroke-width="2.5"/>
    <line x1="180" y1="548" x2="280" y2="543" stroke-width="2.5"/>
    <line x1="190" y1="532" x2="190" y2="556" stroke-width="3.5"/>
    <line x1="215" y1="530" x2="215" y2="554" stroke-width="3.5"/>
    <line x1="240" y1="528" x2="240" y2="552" stroke-width="3.5"/>
    <line x1="265" y1="527" x2="265" y2="551" stroke-width="3.5"/>

    <!-- Cụm rào 2 (Lặp chu kỳ bên phải, x ≈ 720 - 820) -->
    <line x1="720" y1="540" x2="820" y2="535" stroke-width="2.5"/>
    <line x1="720" y1="548" x2="820" y2="543" stroke-width="2.5"/>
    <line x1="730" y1="532" x2="730" y2="556" stroke-width="3.5"/>
    <line x1="755" y1="530" x2="755" y2="554" stroke-width="3.5"/>
    <line x1="780" y1="528" x2="780" y2="552" stroke-width="3.5"/>
    <line x1="805" y1="527" x2="805" y2="551" stroke-width="3.5"/>
  </g>

  <!-- CÁNH HOA ANH ĐÀO VÀ BƯỚM XUÂN BAY TRONG GIÓ -->
  <g fill="#FFB7CE">
    <ellipse cx="310" cy="460" rx="4.5" ry="2.6" transform="rotate(30 310 460)"/>
    <ellipse cx="350" cy="485" rx="4.5" ry="2.6" transform="rotate(-20 350 485)"/>
    <ellipse cx="490" cy="470" rx="4.2" ry="2.5" transform="rotate(45 490 470)"/>
    <ellipse cx="850" cy="460" rx="4.5" ry="2.6" transform="rotate(30 850 460)"/>
    <ellipse cx="890" cy="485" rx="4.5" ry="2.6" transform="rotate(-20 890 485)"/>
    <ellipse cx="1030" cy="470" rx="4.2" ry="2.5" transform="rotate(45 1030 470)"/>
  </g>
</svg>