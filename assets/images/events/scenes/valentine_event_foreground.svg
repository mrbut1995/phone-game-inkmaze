<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Sàn hoa viên nhung đỏ rượu vang tiền cảnh (Nền tương phản tốt cho UI) -->
    <linearGradient id="valStageFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A0A2B"/>
      <stop offset="0.25" stop-color="#34051E"/>
      <stop offset="0.65" stop-color="#1E0211"/>
      <stop offset="1" stop-color="#0E0108"/>
    </linearGradient>

    <!-- Trái tim Ruby 3D sắc nét -->
    <radialGradient id="fgRubyHeart" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FF8EB3"/>
      <stop offset="0.4" stop-color="#E91E63"/>
      <stop offset="0.8" stop-color="#AD1457"/>
      <stop offset="1" stop-color="#6A0030"/>
    </radialGradient>

    <!-- Mũi tên Cupid mạ vàng hoàng gia -->
    <linearGradient id="fgCupidGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9D2"/>
      <stop offset="0.35" stop-color="#FFD54F"/>
      <stop offset="0.7" stop-color="#FFA000"/>
      <stop offset="1" stop-color="#C67D00"/>
    </linearGradient>

    <!-- Đổ bóng mặt đất -->
    <radialGradient id="valFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#100108" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#100108" stop-opacity="0"/>
    </radialGradient>

    <!-- MẪU BÔNG HOA HỒNG NHUNG ĐỎ TIỀN CẢNH -->
    <g id="fg_red_rose">
      <circle cx="0" cy="0" r="16" fill="#AD1457"/>
      <path d="M -12 -6 C -10 -16 10 -16 12 -6 C 14 6 -2 16 -12 -6 Z" fill="#D81B60"/>
      <path d="M -8 -4 C -6 -12 6 -12 8 -4 C 10 4 -2 12 -8 -4 Z" fill="#E91E63"/>
      <path d="M -4 -2 C -2 -8 4 -8 4 -2 C 6 2 -1 6 -4 -2 Z" fill="#FF4081"/>
      <!-- Đài lá xanh -->
      <path d="M -12 12 Q -22 16 -18 8" stroke="#2E7D32" stroke-width="2.5" fill="none"/>
      <path d="M 12 12 Q 22 16 18 8" stroke="#2E7D32" stroke-width="2.5" fill="none"/>
    </g>

    <!-- MẪU CÁNH HOA HỒNG RƠI TIỀN CẢNH -->
    <g id="fg_rose_petal">
      <path d="M 0 -8 C 6 -8 10 -3 8 4 C 6 9 0 11 -4 8 C -8 4 -6 -8 0 -8 Z" fill="#E91E63"/>
      <path d="M -1 -5 C 2 -5 4 -1 3 3 C 2 6 -1 7 -3 5 Z" fill="#FF80AB" opacity="0.65"/>
    </g>
  </defs>

  <!-- THẢM HOA VIÊN NHUNG ĐỎ TIỀN CẢNH (Seamless chu kỳ 540px: x=0 (y=610) và x=1080 (y=610)) -->
  <path d="M 0 610 
           Q 135 570 270 605 T 540 610 
           Q 675 570 810 605 T 1080 610 
           L 1080 960 L 0 960 Z" 
        fill="url(#valStageFloor)"/>

  <!-- Dải viền ren lụa mắt ngọc quý tộc đón ánh hoàng hôn -->
  <path d="M 0 610 Q 135 570 270 605 T 540 610 Q 675 570 810 605 T 1080 610" 
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M 0 616 Q 135 576 270 611 T 540 616 Q 675 576 810 611 T 1080 616" 
        fill="none" stroke="#FF8EB3" stroke-opacity="0.6" stroke-width="2.5"/>

  <!-- ==================== CÁC VẬT THỂ TIỀN CẢNH ==================== -->

  <!-- 1. TRÁI TIM RUBY 3D KHỔNG LỒ & MŨI TÊN CUPID (Bên trái, x ≈ 130) -->
  <g transform="translate(130, 480)">
    <ellipse cx="0" cy="140" rx="68" ry="18" fill="url(#valFloorShadow)"/>

    <!-- Khối trái tim Ruby 3D -->
    <path d="M 0 54 C -72 -14, -58 -82, -25 -82 C -5 -82, 0 -62, 0 -50 C 0 -62, 5 -82, 25 -82 C 58 -82, 72 -14, 0 54 Z" 
          fill="url(#fgRubyHeart)" stroke="#FFFFFF" stroke-width="3.5"/>
    <!-- Vệt sáng phản quang thủy tinh -->
    <ellipse cx="-25" cy="-50" rx="11" ry="20" fill="#FFFFFF" opacity="0.55" transform="rotate(-28 -25 -50)"/>
    <circle cx="-14" cy="-64" r="4.5" fill="#FFFFFF" opacity="0.8"/>

    <!-- MŨI TÊN THẦN CUPID MẠ VÀNG XUYÊN QUA -->
    <line x1="-155" y1="80" x2="155" y2="-75" stroke="url(#fgCupidGold)" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(155, -75) rotate(-26)">
      <polygon points="24,0 -3,-12 5,0 -3,12" fill="url(#fgCupidGold)" stroke="#8D5B00" stroke-width="1.5"/>
    </g>
    <!-- Lông vũ đuôi tên -->
    <g transform="translate(-155, 80) rotate(-26)">
      <path d="M 0 0 L -22 -14 L -32 -11 L -19 0 L -32 11 L -22 14 Z" fill="#FFFFFF" stroke="#FFB6D0" stroke-width="1.5"/>
      <path d="M -19 0 L -41 -14 L -49 -11 L -36 0 L -49 11 L -41 14 Z" fill="#FFFFFF" stroke="#FFB6D0" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 2. KHÓM HOA HỒNG NHUNG ĐỎ & PHONG THƯ DẤU SÁP Ở GIỮA (x ≈ 420 - 540) -->
  <g transform="translate(420, 580)">
    <!-- Phong thư tình dấu sáp đỏ -->
    <g transform="translate(20, 10) rotate(12)">
      <rect x="-35" y="-24" width="70" height="48" rx="4" fill="#FFF5F8" stroke="#F8BBD0" stroke-width="2"/>
      <path d="M -35 -24 L 0 6 L 35 -24" fill="none" stroke="#F8BBD0" stroke-width="2"/>
      <circle cx="0" cy="6" r="9" fill="#D81B60"/>
    </g>
    <!-- Bụi hoa hồng nhung đỏ -->
    <g transform="translate(85, -10)"><use href="#fg_red_rose"/></g>
    <g transform="translate(60, 25) scale(0.85)"><use href="#fg_red_rose"/></g>
  </g>

  <!-- 3. TRÁI TIM THỨ HAI & KHÓM HOA HỒNG (Bên phải, x ≈ 880) -->
  <g transform="translate(860, 480)">
    <ellipse cx="0" cy="140" rx="68" ry="18" fill="url(#valFloorShadow)"/>
    <path d="M 0 54 C -72 -14, -58 -82, -25 -82 C -5 -82, 0 -62, 0 -50 C 0 -62, 5 -82, 25 -82 C 58 -82, 72 -14, 0 54 Z" 
          fill="url(#fgRubyHeart)" stroke="#FFFFFF" stroke-width="3.5"/>
    <ellipse cx="-25" cy="-50" rx="11" ry="20" fill="#FFFFFF" opacity="0.55" transform="rotate(-28 -25 -50)"/>
    
    <line x1="-155" y1="80" x2="155" y2="-75" stroke="url(#fgCupidGold)" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(155, -75) rotate(-26)"><polygon points="24,0 -3,-12 5,0 -3,12" fill="url(#fgCupidGold)"/></g>
    <g transform="translate(-155, 80) rotate(-26)"><path d="M 0 0 L -22 -14 L -32 -11 L -19 0 L -32 11 L -22 14 Z" fill="#FFFFFF"/></g>

    <g transform="translate(100, 35)"><use href="#fg_red_rose"/></g>
  </g>

  <!-- 4. MƯA CÁNH HOA HỒNG RƠI CHAO LIỆNG CẬN CẢNH -->
  <g>
    <g transform="translate(240, 430) rotate(35) scale(1.25)"><use href="#fg_rose_petal"/></g>
    <g transform="translate(340, 470) rotate(-25) scale(1.1)"><use href="#fg_rose_petal"/></g>
    <g transform="translate(560, 490) rotate(50) scale(1.2)"><use href="#fg_rose_petal"/></g>
    <g transform="translate(760, 440) rotate(-40) scale(1.15)"><use href="#fg_rose_petal"/></g>
    <g transform="translate(980, 460) rotate(30) scale(1.25)"><use href="#fg_rose_petal"/></g>
  </g>
</svg>