<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Thảm đất sa mạc lăng mộ tiền cảnh (Nền tương phản tốt cho UI) -->
    <linearGradient id="tombFloorSoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D1D09"/>
      <stop offset="0.2" stop-color="#2B1204"/>
      <stop offset="0.65" stop-color="#1B0A02"/>
      <stop offset="1" stop-color="#0E0501"/>
    </linearGradient>

    <!-- Vàng kim loại Ai Cập lộng lẫy -->
    <linearGradient id="fgEgyptGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5C2"/>
      <stop offset="0.35" stop-color="#FFD54F"/>
      <stop offset="0.7" stop-color="#D49424"/>
      <stop offset="1" stop-color="#8C5807"/>
    </linearGradient>

    <!-- Cột đá sa thạch sa mạc -->
    <linearGradient id="templePillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#542B10"/>
      <stop offset="0.5" stop-color="#8A4A1E"/>
      <stop offset="1" stop-color="#B8662E"/>
    </linearGradient>

    <!-- Hào quang ngọn đuốc bập bùng -->
    <radialGradient id="torchFlameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE082" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#FF6D00" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#DD2C00" stop-opacity="0"/>
    </radialGradient>

    <!-- Đổ bóng mặt đất mềm mại -->
    <radialGradient id="fgTombShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Mẫu ngọn đuốc thám hiểm rực cháy -->
    <g id="expedition_torch">
      <!-- Cán đuốc gỗ cắm đất -->
      <polygon points="-5,140 5,140 7,0 -7,0" fill="#421E0A" stroke="#240D02" stroke-width="1.5"/>
      <rect x="-9" y="-6" width="18" height="12" rx="3" fill="#D49424" stroke="#421E0A" stroke-width="1.5"/>
      <!-- Hào quang lửa -->
      <circle cx="0" cy="-25" r="45" fill="url(#torchFlameGlow)"/>
      <!-- Ngọn lửa chính -->
      <path d="M 0 0 C 14 -12 18 -32 6 -48 C 2 -32 -6 -28 -2 -14 C -8 -20 -8 -36 -14 -42 C -20 -28 -14 -12 0 0 Z" 
            fill="#FFAB00"/>
      <path d="M 0 -6 C 8 -16 10 -28 3 -38 C 0 -28 -4 -24 -2 -14 C -6 -18 -6 -28 -10 -32 C -14 -22 -8 -12 0 -6 Z" 
            fill="#FFF176"/>
    </g>

    <!-- Mẫu bọ hung Scarab thiêng liêng đính ngọc lam Lapis Lazuli -->
    <g id="fg_scarab_amulet">
      <ellipse cx="0" cy="0" rx="14" ry="18" fill="url(#fgEgyptGold)"/>
      <!-- Lưng cánh ngọc lam -->
      <ellipse cx="0" cy="3" rx="10" ry="13" fill="#1565C0"/>
      <line x1="0" y1="-10" x2="0" y2="16" stroke="url(#fgEgyptGold)" stroke-width="1.8"/>
      <circle cx="0" cy="-11" r="6" fill="url(#fgEgyptGold)"/>
      <!-- Chân bọ hung vàng -->
      <path d="M -14 0 L -22 -6 M 14 0 L 22 -6 M -13 8 L -20 14 M 13 8 L 20 14 M -12 -8 L -18 -16 M 12 -8 L 18 -16" 
            stroke="url(#fgEgyptGold)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- THẢM ĐẤT SA MẠC LĂNG MỘ TIỀN CẢNH (Seamless: x=0 (y=610) và x=1080 (y=610)) -->
  <path d="M 0 610 
           Q 135 570 270 605 T 540 610 
           Q 675 570 810 605 T 1080 610 
           L 1080 960 L 0 960 Z" 
        fill="url(#tombFloorSoil)"/>

  <!-- Viền gờ cồn cát mạ vàng kim loại sắc nét đón ánh trăng -->
  <path d="M 0 610 Q 135 570 270 605 T 540 610 Q 675 570 810 605 T 1080 610" 
        fill="none" stroke="url(#fgEgyptGold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 0 616 Q 135 576 270 611 T 540 616 Q 675 576 810 611 T 1080 616" 
        fill="none" stroke="#FFD54F" stroke-opacity="0.4" stroke-width="2"/>

  <!-- ==================== CÁC VẬT THỂ TIỀN CẢNH ==================== -->

  <!-- 1. CỘT ĐÁ ĐỀN THỜ AI CẬP CỔ ĐẠI & ĐUỐC LỬA (Bên trái, x ≈ 110) -->
  <g transform="translate(100, 360)">
    <!-- Đổ bóng chân cột -->
    <ellipse cx="25" cy="305" rx="55" ry="16" fill="url(#fgTombShadow)"/>

    <!-- Thân cột đền Karnak chạm khắc rãnh đá -->
    <rect x="0" y="50" width="50" height="255" fill="url(#templePillar)" stroke="#301404" stroke-width="2"/>
    <line x1="12" y1="50" x2="12" y2="305" stroke="#3D1805" stroke-width="2"/>
    <line x1="25" y1="50" x2="25" y2="305" stroke="#3D1805" stroke-width="2"/>
    <line x1="38" y1="50" x2="38" y2="305" stroke="#3D1805" stroke-width="2"/>
    <!-- Chân cột đá -->
    <rect x="-8" y="295" width="66" height="20" rx="3" fill="#6B330F" stroke="#301404" stroke-width="2"/>
    <!-- Đỉnh cột hoa sen papyrus -->
    <polygon points="-12,50 62,50 50,20 0,20" fill="url(#templePillar)" stroke="#301404" stroke-width="2"/>
    <rect x="-15" y="10" width="80" height="15" rx="2" fill="url(#templePillar)" stroke="#301404" stroke-width="2"/>

    <!-- CÂY ĐUỐC THÁM HIỂM CẮM CẠNH CỘT ĐÁ (x = 75) -->
    <g transform="translate(75, 140)"><use href="#expedition_torch"/></g>
  </g>

  <!-- 2. QUYỀN TRƯỢNG ANKH MẠ VÀNG KHỔNG LỒ (x ≈ 230) -->
  <g transform="translate(230, 480) scale(1.15)">
    <!-- Đổ bóng Ankh -->
    <ellipse cx="0" cy="140" rx="28" ry="8" fill="url(#fgTombShadow)"/>
    <!-- Cán trượng Ankh cắm vào cát -->
    <line x1="0" y1="40" x2="0" y2="140" stroke="url(#fgEgyptGold)" stroke-width="8" stroke-linecap="round"/>
    <!-- Thân vòng Ankh vàng -->
    <path d="M 0 -10 C 18 -10, 30 4, 30 22 C 30 40, 10 50, 10 65 L -10 65 C -10 50, -30 40, -30 22 C -30 4, -18 -10, 0 -10 Z" 
          fill="url(#fgEgyptGold)" stroke="#522C02" stroke-width="2.5"/>
    <ellipse cx="0" cy="22" rx="14" ry="18" fill="#2E1204"/>
    <rect x="-38" y="65" width="76" height="15" rx="3" fill="url(#fgEgyptGold)" stroke="#522C02" stroke-width="2"/>
    <!-- Viên ngọc lam Lapis Lazuli lớn khảm tâm Ankh -->
    <circle cx="0" cy="72" r="6" fill="#1E88E5" stroke="#0D47A1" stroke-width="1.5"/>
    <circle cx="-1.5" cy="70" r="1.8" fill="#E3F2FD"/>
  </g>

  <!-- 3. BỌ HUNG SCARAB & ĐỒNG TIỀN VÀNG RƠI TRÊN CÁT (x ≈ 420 - 520) -->
  <g transform="translate(420, 630)">
    <!-- Bọ hung hộ mệnh Scarab -->
    <g transform="translate(40, -10) scale(1.1)"><use href="#fg_scarab_amulet"/></g>
    <!-- Các đồng xu vàng cổ Ai Cập vương vãi -->
    <circle cx="10" cy="15" r="7" fill="url(#fgEgyptGold)" stroke="#7A4204" stroke-width="1"/>
    <circle cx="22" cy="22" r="6" fill="url(#fgEgyptGold)" stroke="#7A4204" stroke-width="1"/>
    <circle cx="95" cy="18" r="7.5" fill="url(#fgEgyptGold)" stroke="#7A4204" stroke-width="1"/>
  </g>

  <!-- 4. CỘT ĐÁ & ĐUỐC THỨ HAI (Bên phải, x ≈ 900) -->
  <g transform="translate(900, 380)">
    <ellipse cx="25" cy="285" rx="55" ry="16" fill="url(#fgTombShadow)"/>
    <rect x="0" y="50" width="50" height="235" fill="url(#templePillar)" stroke="#301404" stroke-width="2"/>
    <line x1="15" y1="50" x2="15" y2="285" stroke="#3D1805" stroke-width="2"/>
    <line x1="35" y1="50" x2="35" y2="285" stroke="#3D1805" stroke-width="2"/>
    <rect x="-8" y="275" width="66" height="20" rx="3" fill="#6B330F" stroke="#301404" stroke-width="2"/>
    <polygon points="-12,50 62,50 50,20 0,20" fill="url(#templePillar)" stroke="#301404" stroke-width="2"/>

    <!-- Đuốc lửa bên phải (x = -25) -->
    <g transform="translate(-25, 120)"><use href="#expedition_torch"/></g>
  </g>

  <!-- 5. BỌ HUNG & XU VÀNG LẶP CHU KỲ BÊN PHẢI (x ≈ 760 & x ≈ 980) -->
  <g transform="translate(760, 640)">
    <g transform="scale(0.95)"><use href="#fg_scarab_amulet"/></g>
    <circle cx="-25" cy="10" r="7" fill="url(#fgEgyptGold)" stroke="#7A4204" stroke-width="1"/>
  </g>
  <g transform="translate(980, 650)">
    <circle cx="10" cy="5" r="7" fill="url(#fgEgyptGold)" stroke="#7A4204" stroke-width="1"/>
    <circle cx="25" cy="12" r="6" fill="url(#fgEgyptGold)" stroke="#7A4204" stroke-width="1"/>
  </g>

  <!-- TÀN TRO ĐUỐC & BỤI CÁT VÀNG PHẢN CHIẾU CUỘN THEO GIÓ TIỀN CẢNH -->
  <g fill="#FFA000">
    <circle cx="170" cy="460" r="2.2" opacity="0.9"/>
    <circle cx="185" cy="430" r="1.8" opacity="0.95"/>
    <circle cx="210" cy="450" r="2.5" opacity="0.8"/>
    <circle cx="870" cy="460" r="2.2" opacity="0.9"/>
    <circle cx="890" cy="430" r="1.8" opacity="0.95"/>
    <circle cx="920" cy="450" r="2.5" opacity="0.8"/>
  </g>
</svg>