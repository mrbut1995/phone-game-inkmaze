<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <linearGradient id="sandBeach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DD"/>
      <stop offset="0.18" stop-color="#FDEBBB"/>
      <stop offset="0.6" stop-color="#F7D790"/>
      <stop offset="1" stop-color="#E9BD6B"/>
    </linearGradient>

    <radialGradient id="sandShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9C712B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9C712B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="palmWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E2E14"/>
      <stop offset="0.5" stop-color="#845327"/>
      <stop offset="1" stop-color="#B07945"/>
    </linearGradient>

    <radialGradient id="ballShading" cx="35%" cy="30%" r="65%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Mép nước trong cạn lấn lên cát (Seamless y=595 tại x=0 và x=1080) -->
  <path d="M 0 595 
           Q 135 565 270 595 T 540 595 
           Q 675 565 810 595 T 1080 595 
           L 1080 640 L 0 640 Z" 
        fill="#5CE5F8" opacity="0.4"/>

  <!-- BÃI CÁT VÀNG (Uốn lượn tuần hoàn chu kỳ 540px: x=0 (y=605) và x=1080 (y=605)) -->
  <path d="M 0 605 
           Q 135 572 270 605 T 540 605 
           Q 675 572 810 605 T 1080 605 
           L 1080 960 L 0 960 Z" 
        fill="url(#sandBeach)"/>

  <!-- Dải bọt sóng trắng cuộn tròn vỗ bờ -->
  <path d="M 0 605 Q 135 572 270 605 T 540 605 Q 675 572 810 605 T 1080 605" 
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M 0 611 Q 135 578 270 611 T 540 611 Q 675 578 810 611 T 1080 611" 
        fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.5" stroke-dasharray="12 8"/>

  <!-- ==================== CÁC VẬT THỂ TIỀN CẢNH ==================== -->

  <!-- 1. CÂY CỌ DỪA LỚN VƯƠN CAO (Bên trái, x ≈ 100) -->
  <g transform="translate(100, 390)">
    <ellipse cx="24" cy="275" rx="34" ry="10" fill="url(#sandShadow)"/>
    <path d="M 24 275 C 42 220 38 150 10 70" stroke="url(#palmWood)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <g stroke="#321B0A" stroke-width="2" opacity="0.5">
      <line x1="20" y1="250" x2="31" y2="253"/>
      <line x1="23" y1="225" x2="34" y2="228"/>
      <line x1="24" y1="200" x2="35" y2="202"/>
      <line x1="23" y1="170" x2="34" y2="171"/>
      <line x1="20" y1="140" x2="30" y2="140"/>
      <line x1="14" y1="105" x2="24" y2="103"/>
    </g>
    <!-- Quả dừa -->
    <g transform="translate(8, 70)">
      <circle cx="-6" cy="5" r="7" fill="#583A1B"/>
      <circle cx="5" cy="8" r="6.5" fill="#754E28"/>
      <circle cx="3" cy="0" r="6.8" fill="#8F6236"/>
      <circle cx="4" cy="-2" r="2" fill="#D3A274" opacity="0.8"/>
    </g>
    <!-- Tán lá dừa nhiệt đới xòe rộng -->
    <path d="M 8 70 Q -40 50 -85 70 Q -40 70 8 70 Z" fill="#18642E"/>
    <path d="M 8 70 Q -10 10 -40 -20 Q -10 20 8 70 Z" fill="#1C7737"/>
    <path d="M 8 70 Q 40 8 80 -10 Q 50 30 8 70 Z" fill="#20873F"/>
    <path d="M 8 70 Q -60 30 -110 95 Q -55 65 8 70 Z" fill="#2BAC4D"/>
    <path d="M 8 70 Q -58 38 -108 93" stroke="#8FE73A" stroke-width="1.8" fill="none" opacity="0.7"/>
    <path d="M 8 70 Q 60 40 100 85 Q 60 65 8 70 Z" fill="#32BF56"/>
    <path d="M 8 70 Q 25 90 35 130 Q 20 100 8 70 Z" fill="#249744"/>
  </g>

  <!-- 2. Ô DÙ BÃI BIỂN 3D & KHĂN TẮM (x ≈ 420) -->
  <g transform="translate(420, 520)">
    <ellipse cx="64" cy="180" rx="48" ry="14" fill="url(#sandShadow)"/>
    <!-- Thảm trải bãi biển -->
    <polygon points="10,185 85,170 95,195 20,210" fill="#20BFD6" stroke="#FFFFFF" stroke-width="1.5"/>
    <polygon points="12,189 87,174 91,184 16,199" fill="#FFF275"/>
    <!-- Cán dù bằng gỗ xiên nghiêng -->
    <line x1="48" y1="178" x2="64" y2="72" stroke="#5E3B1E" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="178" x2="66" y2="72" stroke="#9C6B3D" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Tán dù 3D phối màu San Hô & Trắng -->
    <g>
      <path d="M 64 36 Q 38 56 16 85 Q 28 87 38 87 Q 52 60 64 36 Z" fill="#EFE8D6"/>
      <path d="M 64 36 Q 52 60 38 87 Q 50 91 60 91 Q 65 60 64 36 Z" fill="#FF5050"/>
      <path d="M 64 36 Q 65 60 60 91 Q 72 93 84 91 Q 79 60 64 36 Z" fill="#FFFFFF"/>
      <path d="M 64 36 Q 79 60 84 91 Q 96 90 106 86 Q 89 58 64 36 Z" fill="#FF6363"/>
      <path d="M 64 36 Q 89 58 106 86 Q 114 83 118 80 Q 98 54 64 36 Z" fill="#FFF1DC"/>
      <circle cx="64" cy="35" r="5" fill="#FFE27A" stroke="#C9981E" stroke-width="1.2"/>
    </g>
  </g>

  <!-- 3. BÓNG BÃI BIỂN 3D CHI TIẾT (x ≈ 680) -->
  <g transform="translate(680, 680)">
    <ellipse cx="20" cy="28" rx="20" ry="7" fill="url(#sandShadow)"/>
    <g>
      <clipPath id="ballSphere">
        <circle cx="20" cy="16" r="16"/>
      </clipPath>
      <circle cx="20" cy="16" r="16" fill="#FFFFFF"/>
      <g clip-path="url(#ballSphere)">
        <path d="M 20 0 C 10 4, 7 22, 11 32 L 20 16 Z" fill="#FF4747"/>
        <path d="M 20 0 C 26 3, 33 10, 35 19 L 20 16 Z" fill="#FFC83B"/>
        <path d="M 35 19 C 36 26, 29 32, 20 32 L 20 16 Z" fill="#1CA5FD"/>
        <ellipse cx="20" cy="4" rx="5" ry="2.2" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="20" cy="16" r="16" fill="url(#ballShading)"/>
        <ellipse cx="15" cy="10" rx="4.5" ry="2.5" fill="#FFFFFF" opacity="0.65" transform="rotate(-30 15 10)"/>
      </g>
      <circle cx="20" cy="16" r="16" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>
    </g>
  </g>

  <!-- 4. CÂY CỌ DỪA THỨ HAI (Bên phải, x ≈ 960) -->
  <g transform="translate(960, 420)">
    <ellipse cx="22" cy="255" rx="30" ry="9" fill="url(#sandShadow)"/>
    <path d="M 22 255 C 8 200 12 140 38 65" stroke="url(#palmWood)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <g stroke="#321B0A" stroke-width="1.8" opacity="0.5">
      <line x1="16" y1="230" x2="26" y2="233"/>
      <line x1="12" y1="200" x2="22" y2="203"/>
      <line x1="13" y1="170" x2="23" y2="171"/>
      <line x1="18" y1="130" x2="28" y2="129"/>
      <line x1="26" y1="95" x2="36" y2="92"/>
    </g>
    <path d="M 38 65 Q 90 40 130 65 Q 90 65 38 65 Z" fill="#18642E"/>
    <path d="M 38 65 Q -10 20 -60 5 Z" stroke="#259E47" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 38 65 Q 100 25 150 90 Q 95 60 38 65 Z" fill="#2DB04F"/>
    <path d="M 38 65 Q -20 40 -70 85 Q -30 60 38 65 Z" fill="#32BF56"/>
    <circle cx="34" cy="68" r="6" fill="#754E28"/>
    <circle cx="42" cy="71" r="5.5" fill="#8F6236"/>
  </g>

  <!-- 5. SAO BIỂN & VỎ SÒ TRÊN BÃI CÁT -->
  <polygon points="340,710 342,718 350,719 344,724 345,732 339,727 333,731 335,723 329,718 337,717" 
           fill="#FF8C38" stroke="#DE5D10" stroke-width="1"/>
  <path d="M 780 635 C 785 630, 795 632, 796 638 C 794 644, 784 645, 780 635 Z" 
        fill="#FFF4E0" stroke="#D1B072" stroke-width="1.2"/>
</svg>