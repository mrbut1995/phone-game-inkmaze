<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Thảm đất rừng mùa thu ấm áp (Nền tương phản tốt cho UI/nhân vật) -->
    <linearGradient id="forestFloorSoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1A0B"/>
      <stop offset="0.2" stop-color="#2B1206"/>
      <stop offset="0.6" stop-color="#1E0A03"/>
      <stop offset="1" stop-color="#120501"/>
    </linearGradient>

    <!-- Thân gỗ cây phong -->
    <linearGradient id="treeBark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36180A"/>
      <stop offset="0.5" stop-color="#582C15"/>
      <stop offset="1" stop-color="#7A4222"/>
    </linearGradient>

    <!-- Đổ bóng trên mặt đất -->
    <radialGradient id="soilShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Lá phong tiền cảnh 5 thùy sắc nét, chi tiết cao -->
    <g id="fg_maple_leaf">
      <path d="M 0 -18 
               C 1 -13, 3 -13, 7 -15 C 6 -11, 9 -9, 13 -12 C 11 -7, 12 -5, 15 -4 
               C 12 -1, 12 1, 13 6 C 9 4, 8 5, 6 9 C 4 6, 3 6, 0 8 
               C -3 6, -4 6, -6 9 C -8 5, -9 4, -13 6 C -12 1, -12 -1, -15 -4 
               C -12 -5, -11 -7, -13 -12 C -9 -9, -6 -11, -7 -15 C -3 -13, -1 -13, 0 -18 Z" 
            stroke="#000000" stroke-opacity="0.2" stroke-width="0.8"/>
      <!-- Gân lá nổi khối -->
      <line x1="0" y1="-14" x2="0" y2="8" stroke="#000000" stroke-opacity="0.25" stroke-width="1.2"/>
      <line x1="0" y1="-2" x2="8" y2="-8" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8"/>
      <line x1="0" y1="-2" x2="-8" y2="-8" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8"/>
      <line x1="0" y1="2" x2="9" y2="2" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8"/>
      <line x1="0" y1="2" x2="-9" y2="2" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8"/>
      <line x1="0" y1="8" x2="0" y2="17" stroke="#421C0B" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- THẢM ĐẤT RỪNG TIỀN CẢNH (Uốn lượn tuần hoàn chu kỳ 540px: x=0 (y=610) và x=1080 (y=610)) -->
  <path d="M 0 610 
           Q 135 575 270 605 T 540 610 
           Q 675 575 810 605 T 1080 610 
           L 1080 960 L 0 960 Z" 
        fill="url(#forestFloorSoil)"/>

  <!-- Viền mép đồi cỏ thu vàng rực ánh chiều -->
  <path d="M 0 610 Q 135 575 270 605 T 540 610 Q 675 575 810 605 T 1080 610" 
        fill="none" stroke="#753512" stroke-width="5" stroke-linecap="round"/>
  <path d="M 0 611 Q 135 576 270 606 T 540 611 Q 675 576 810 606 T 1080 611" 
        fill="none" stroke="#F59E1B" stroke-opacity="0.75" stroke-width="1.8"/>

  <!-- ==================== CÁC VẬT THỂ TIỀN CẢNH ==================== -->

  <!-- 1. CÂY PHONG CỔ THỤ LỚN VƯƠN CAO (Bên trái, x ≈ 120) -->
  <g transform="translate(110, 360)">
    <!-- Bóng chân cây trên nền đất -->
    <ellipse cx="36" cy="310" rx="42" ry="12" fill="url(#soilShadow)"/>
    <!-- Thân cây cổ thụ với các cành nhánh tự nhiên -->
    <path d="M 36 310 C 50 240 45 160 20 60" stroke="url(#treeBark)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 28 170 Q -10 120 -50 90" stroke="url(#treeBark)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 24 130 Q 65 90 90 70" stroke="url(#treeBark)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 20 80 Q -15 40 -30 10" stroke="url(#treeBark)" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- Tán lá phong phân tầng đa sắc rực rỡ -->
    <!-- Tầng 1: Đỏ mận thẫm đáy -->
    <circle cx="-50" cy="80" r="34" fill="#99200B"/>
    <circle cx="85" cy="65" r="32" fill="#A82810"/>
    <circle cx="20" cy="50" r="42" fill="#B83214"/>
    <!-- Tầng 2: Cam cháy nổi bật -->
    <circle cx="-25" cy="20" r="36" fill="#D94313"/>
    <circle cx="55" cy="25" r="35" fill="#E6581B"/>
    <circle cx="15" cy="0" r="45" fill="#F06A1D"/>
    <!-- Tầng 3: Vàng hổ phách hứng nắng đỉnh -->
    <circle cx="-10" cy="-30" r="32" fill="#F7A222"/>
    <circle cx="35" cy="-25" r="30" fill="#F7B72C"/>
    <circle cx="10" cy="-50" r="28" fill="#FCD04B"/>
  </g>

  <!-- 2. CÂY PHONG CỔ THỤ THỨ HAI (Bên phải, x ≈ 920) -->
  <g transform="translate(900, 380)">
    <ellipse cx="34" cy="290" rx="38" ry="11" fill="url(#soilShadow)"/>
    <path d="M 34 290 C 20 220 25 150 50 60" stroke="url(#treeBark)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 30 160 Q 70 120 105 95" stroke="url(#treeBark)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 36 120 Q -5 80 -30 60" stroke="url(#treeBark)" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- Tán lá phong đỏ - vàng cân bằng bố cục -->
    <circle cx="-25" cy="60" r="30" fill="#A82810"/>
    <circle cx="100" cy="90" r="32" fill="#B83214"/>
    <circle cx="45" cy="50" r="40" fill="#D94313"/>
    <circle cx="10" cy="20" r="35" fill="#E6581B"/>
    <circle cx="75" cy="30" r="34" fill="#F06A1D"/>
    <circle cx="40" cy="-15" r="38" fill="#F7A222"/>
    <circle cx="35" cy="-45" r="26" fill="#FCD04B"/>
  </g>

  <!-- 3. CÁC CỤM NẤM RỪNG CHẤM BI 3D TRÊN NỀN ĐẤT (Mushrooms) -->
  <!-- Cụm nấm 1 (Góc trái, x ≈ 260) -->
  <g transform="translate(260, 620)">
    <!-- Nấm lớn -->
    <path d="M -5 20 L -3 5 Q 0 2 3 5 L 5 20 Z" fill="#F3E5D0"/>
    <path d="M -18 6 Q 0 -14 18 6 C 13 9, -13 9, -18 6 Z" fill="#D93814"/>
    <circle cx="-8" cy="-1" r="2.4" fill="#FFFFFF"/>
    <circle cx="3" cy="-6" r="2.2" fill="#FFFFFF"/>
    <circle cx="9" cy="0" r="1.8" fill="#FFFFFF"/>
    <!-- Nấm con cạnh bên -->
    <g transform="translate(18, 6) scale(0.65)">
      <path d="M -5 20 L -3 5 Q 0 2 3 5 L 5 20 Z" fill="#F3E5D0"/>
      <path d="M -16 6 Q 0 -12 16 6 C 12 8, -12 8, -16 6 Z" fill="#E65E1E"/>
      <circle cx="-3" cy="-3" r="2" fill="#FFFFFF"/>
      <circle cx="5" cy="0" r="1.8" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Cụm nấm 2 (Lặp bên phải, x ≈ 800) -->
  <g transform="translate(800, 625)">
    <path d="M -5 20 L -3 5 Q 0 2 3 5 L 5 20 Z" fill="#F3E5D0"/>
    <path d="M -18 6 Q 0 -14 18 6 C 13 9, -13 9, -18 6 Z" fill="#D93814"/>
    <circle cx="-8" cy="-1" r="2.4" fill="#FFFFFF"/>
    <circle cx="3" cy="-6" r="2.2" fill="#FFFFFF"/>
    <circle cx="9" cy="0" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- 4. QUẢ SỒI RỤNG (Acorns) VÀ LÁ PHONG TĨNH TRÊN ĐẤT -->
  <!-- Quả sồi tại x ≈ 340 -->
  <g transform="translate(340, 650) rotate(-15) scale(1.1)">
    <ellipse cx="0" cy="7" rx="6" ry="8" fill="#8F5425"/>
    <path d="M -7.5 3 Q 0 -2 7.5 3 L 6 6 Q 0 2 -6 6 Z" fill="#522E13"/>
    <line x1="0" y1="-1" x2="0" y2="-5" stroke="#522E13" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Quả sồi tại x ≈ 880 -->
  <g transform="translate(880, 645) rotate(20) scale(1.1)">
    <ellipse cx="0" cy="7" rx="6" ry="8" fill="#8F5425"/>
    <path d="M -7.5 3 Q 0 -2 7.5 3 L 6 6 Q 0 2 -6 6 Z" fill="#522E13"/>
    <line x1="0" y1="-1" x2="0" y2="-5" stroke="#522E13" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 5. LÁ PHONG TIỀN CẢNH BAY TRONG GIÓ (Chao lượn lớn & sắc nét) -->
  <g>
    <!-- Nhóm lá bên trái -->
    <g transform="translate(180, 480) rotate(-25) scale(1.2)" fill="#D93814"><use href="#fg_maple_leaf"/></g>
    <g transform="translate(290, 430) rotate(42) scale(0.95)" fill="#F5A827"><use href="#fg_maple_leaf"/></g>
    <g transform="translate(420, 520) rotate(-18) scale(1.1)" fill="#E85E1A"><use href="#fg_maple_leaf"/></g>
    <g transform="translate(220, 610) rotate(65) scale(0.85)" fill="#B0250E"><use href="#fg_maple_leaf"/></g>
    
    <!-- Nhóm lá lặp bên phải -->
    <g transform="translate(720, 480) rotate(-25) scale(1.2)" fill="#D93814"><use href="#fg_maple_leaf"/></g>
    <g transform="translate(830, 430) rotate(42) scale(0.95)" fill="#F5A827"><use href="#fg_maple_leaf"/></g>
    <g transform="translate(960, 520) rotate(-18) scale(1.1)" fill="#E85E1A"><use href="#fg_maple_leaf"/></g>
    <g transform="translate(760, 610) rotate(65) scale(0.85)" fill="#B0250E"><use href="#fg_maple_leaf"/></g>

    <!-- Lá phong rụng tĩnh trên mặt đất -->
    <g transform="translate(490, 660) rotate(80) scale(0.75)" fill="#C73612"><use href="#fg_maple_leaf"/></g>
    <g transform="translate(1030, 660) rotate(80) scale(0.75)" fill="#C73612"><use href="#fg_maple_leaf"/></g>
  </g>
</svg>