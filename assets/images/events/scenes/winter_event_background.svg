<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Bầu trời mùa đông băng giá chuyển sắc 4 nấc -->
    <linearGradient id="winSkyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2F2FE"/>
      <stop offset="0.35" stop-color="#A2D2F7"/>
      <stop offset="0.7" stop-color="#6DAAE2"/>
      <stop offset="1" stop-color="#4683C0"/>
    </linearGradient>

    <!-- Quầng vầng dương mùa đông dịu mát -->
    <radialGradient id="winSunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#E5F3FD" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#A5D4F8" stop-opacity="0"/>
    </radialGradient>

    <!-- Dãy núi tuyết xa xăm chân trời -->
    <linearGradient id="winDistantPeaks" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C5E3F9"/>
      <stop offset="0.6" stop-color="#7EAEDB"/>
      <stop offset="1" stop-color="#4B7EA9"/>
    </linearGradient>
  </defs>

  <!-- Nền trời mùa đông bao phủ toàn canvas -->
  <rect width="1080" height="960" fill="url(#winSkyGrad)"/>

  <!-- ==================== VẦNG DƯƠNG MÙA ĐÔNG DỊU MÁT ==================== -->
  <!-- Mặt trời 1 (x = 360, y = 200) -->
  <circle cx="360" cy="200" r="115" fill="url(#winSunAura)"/>
  <circle cx="360" cy="200" r="42" fill="#FFFFFF"/>

  <!-- Mặt trời lặp chu kỳ đối ứng bên phải (x = 900) -->
  <circle cx="900" cy="200" r="115" fill="url(#winSunAura)"/>
  <circle cx="900" cy="200" r="42" fill="#FFFFFF"/>

  <!-- Mây băng tuyết trắng mờ trôi lững lờ (Chu kỳ 540px) -->
  <g fill="#FFFFFF" fill-opacity="0.9">
    <g transform="translate(150, 160) scale(1.15)">
      <ellipse cx="0" cy="0" rx="36" ry="16"/><circle cx="-16" cy="-9" r="15"/><circle cx="10" cy="-14" r="18"/><circle cx="28" cy="-5" r="13"/>
    </g>
    <g transform="translate(690, 150) scale(1.15)">
      <ellipse cx="0" cy="0" rx="36" ry="16"/><circle cx="-16" cy="-9" r="15"/><circle cx="10" cy="-14" r="18"/><circle cx="28" cy="-5" r="13"/>
    </g>
    <g transform="translate(460, 240) scale(0.75)" fill-opacity="0.75">
      <ellipse cx="0" cy="0" rx="32" ry="12"/><circle cx="-13" cy="-7" r="13"/><circle cx="8" cy="-9" r="15"/>
    </g>
    <g transform="translate(1000, 230) scale(0.75)" fill-opacity="0.75">
      <ellipse cx="0" cy="0" rx="32" ry="12"/><circle cx="-13" cy="-7" r="13"/><circle cx="8" cy="-9" r="15"/>
    </g>
  </g>

  <!-- Bụi tuyết rơi li ti phủ khắp bầu trời xa -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="60" cy="140" r="2.2"/><circle cx="180" cy="90" r="2.8"/><circle cx="270" cy="120" r="2.5"/><circle cx="330" cy="70" r="2"/>
    <circle cx="480" cy="110" r="2.6"/><circle cx="510" cy="180" r="2.2"/><circle cx="600" cy="140" r="2.2"/><circle cx="720" cy="90" r="2.8"/>
    <circle cx="810" cy="120" r="2.5"/><circle cx="870" cy="70" r="2"/><circle cx="1020" cy="110" r="2.6"/>
  </g>

  <!-- ĐƯỜNG CHÂN TRỜI: DÃY NÚI TUYẾT XA MỜ SƯƠNG -->
  <!-- Seamless: Khớp nối tại x=0 và x=1080 ở y=510 -->
  <path d="M 0 510 
           L 40 510 L 80 470 L 120 510 L 180 510 
           L 220 440 L 260 410 L 300 440 L 340 510 L 410 510 
           L 440 480 L 480 510 L 540 510 
           L 580 510 L 620 470 L 660 510 L 720 510 
           L 760 440 L 800 410 L 840 440 L 880 510 L 950 510 
           L 980 480 L 1020 510 L 1080 510 
           L 1080 580 L 0 580 Z" 
        fill="url(#winDistantPeaks)" opacity="0.75"/>
</svg>