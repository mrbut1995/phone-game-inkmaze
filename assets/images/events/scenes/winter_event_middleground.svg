<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <defs>
    <!-- Đồi tuyết tầng trung -->
    <linearGradient id="winMidHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E1F0FB"/>
      <stop offset="0.45" stop-color="#A5CEEF"/>
      <stop offset="1" stop-color="#6097C2"/>
    </linearGradient>

    <!-- Mặt núi tuyết đón nắng -->
    <linearGradient id="pyrPeakLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E8F4FD"/>
      <stop offset="1" stop-color="#CBE3F7"/>
    </linearGradient>

    <!-- Mặt núi tuyết đổ bóng xanh băng -->
    <linearGradient id="pyrPeakShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8BBDE3"/>
      <stop offset="0.6" stop-color="#5B8FB8"/>
      <stop offset="1" stop-color="#36658C"/>
    </linearGradient>

    <!-- MẪU NHÀ GỖ MÙA ĐÔNG ẤM ÁP (ALPINE CABIN) -->
    <g id="alpine_cabin">
      <!-- Thân nhà gỗ nâu -->
      <rect x="-35" y="10" width="70" height="40" fill="#5D4037" stroke="#3E2723" stroke-width="1.8"/>
      <!-- Mái dốc phủ tuyết dày -->
      <polygon points="-42,10 42,10 0,-18" fill="#4E342E"/>
      <polygon points="-45,8 45,8 0,-24" fill="#FFFFFF"/>
      <!-- Ống khói và làn khói trắng bay -->
      <rect x="18" y="-14" width="10" height="20" fill="#795548"/>
      <path d="M 23 -14 Q 28 -28 20 -38 Q 26 -48 18 -58" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
      <!-- Cửa sổ sáng đèn vàng ấm cúng -->
      <rect x="-24" y="22" width="16" height="18" rx="3" fill="#FFD54F" stroke="#FFA000" stroke-width="1.5"/>
      <line x1="-16" y1="22" x2="-16" y2="40" stroke="#5D4037" stroke-width="1.2"/>
      <!-- Cửa ra vào -->
      <rect x="6" y="24" width="16" height="26" fill="#3E2723"/>
    </g>

    <!-- MẪU CÂY THÔNG PHỦ TUYẾT TRUNG CẢNH -->
    <g id="mg_snowy_pine">
      <rect x="-4" y="20" width="8" height="25" fill="#4E342E"/>
      <polygon points="0,-25 -24,5 24,5" fill="#1B4D3E"/>
      <path d="M -24 5 Q 0 -4 24 5 Q 14 -1 0 -1 Q -14 -1 -24 5 Z" fill="#FFFFFF"/>
      <polygon points="0,-45 -18,-15 18,-15" fill="#1B4D3E"/>
      <path d="M -18 -15 Q 0 -24 18 -15 Q 10 -20 0 -20 Q -10 -20 -18 -15 Z" fill="#FFFFFF"/>
      <polygon points="0,-60 -12,-35 12,-35" fill="#1B4D3E"/>
      <polygon points="0,-64 -4,-54 4,-54" fill="#FFFFFF"/>
    </g>
  </defs>

  <!-- ĐỒI TUYẾT VÀ HỒ BĂNG TẦNG TRUNG (Seamless: x=0 (y=530) và x=1080 (y=530)) -->
  <path d="M 0 530 
           Q 135 480 270 515 T 540 530 
           Q 675 480 810 515 T 1080 530 
           L 1080 670 L 0 670 Z" 
        fill="url(#winMidHills)"/>

  <!-- ==================== CÁC ĐỈNH NÚI TUYẾT ALPINE 3D SẮC NÉT ==================== -->
  <!-- Núi 1 (x ≈ 150) -->
  <g transform="translate(150, 420)">
    <polygon points="60,-40 -20,70 70,70" fill="url(#pyrPeakLit)"/>
    <polygon points="60,-40 70,70 140,70" fill="url(#pyrPeakShadow)"/>
    <polygon points="60,-40 40,-5 68,-5" fill="#FFFFFF"/>
  </g>
  <!-- Núi 2 (x ≈ 690, đối ứng chu kỳ 540px) -->
  <g transform="translate(690, 420)">
    <polygon points="60,-40 -20,70 70,70" fill="url(#pyrPeakLit)"/>
    <polygon points="60,-40 70,70 140,70" fill="url(#pyrPeakShadow)"/>
    <polygon points="60,-40 40,-5 68,-5" fill="#FFFFFF"/>
  </g>

  <!-- ==================== NGÔI NHÀ GỖ MÙA ĐÔNG ẤM CÚNG ==================== -->
  <!-- Nhà gỗ 1 (x ≈ 380) -->
  <g transform="translate(380, 500) scale(0.9)"><use href="#alpine_cabin"/></g>
  <!-- Nhà gỗ 2 (x ≈ 920) -->
  <g transform="translate(920, 500) scale(0.9)"><use href="#alpine_cabin"/></g>

  <!-- RỪNG THÔNG TRUNG CẢNH NÉP BÊN SƯỜN NÚI -->
  <g transform="translate(80, 495) scale(0.85)"><use href="#mg_snowy_pine"/></g>
  <g transform="translate(290, 505) scale(0.75)"><use href="#mg_snowy_pine"/></g>
  <g transform="translate(470, 510) scale(0.8)"><use href="#mg_snowy_pine"/></g>

  <g transform="translate(620, 495) scale(0.85)"><use href="#mg_snowy_pine"/></g>
  <g transform="translate(830, 505) scale(0.75)"><use href="#mg_snowy_pine"/></g>
  <g transform="translate(1010, 510) scale(0.8)"><use href="#mg_snowy_pine"/></g>
</svg>