<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="pumpkin-warm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FF8722" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Cuống xoăn tím xanh trên đỉnh -->
  <path d="M27 15 Q30 11 34 12" fill="none" stroke="#4C2E74" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Thân bí ngô phát sáng ấm mềm -->
  <g filter="url(#pumpkin-warm-glow)">
    <!-- Thân bí tròn mập Pumpkin Orange #FF8722 -->
    <ellipse cx="27" cy="30" rx="17" ry="14" fill="#FF8722"/>
    <!-- Múi gờ tối tạo chiều sâu các rãnh bí -->
    <ellipse cx="27" cy="30" rx="11" ry="14" fill="#E8710D"/>
    <ellipse cx="27" cy="30" rx="5.5" ry="14" fill="#FF8722"/>

    <!-- 2 mắt tam giác phát sáng Moon Cream #FBE5A9 -->
    <polygon points="20,26 23,22 24.5,26" fill="#FBE5A9"/>
    <polygon points="34,26 31,22 29.5,26" fill="#FBE5A9"/>

    <!-- Miệng cười khoét răng cưa phát sáng rực rỡ từ bên trong -->
    <path d="M19 30 Q27 40 35 30 C33 34 31 32 30 35 C28 32 26 32 24 35 C23 32 21 34 19 30 Z" fill="#FBE5A9"/>
  </g>
</svg>