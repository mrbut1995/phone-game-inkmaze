<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="cream-glow-sel" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#FBE5A9" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Khung vuông bo góc nét đứt màu Moon Cream -->
