<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="170" height="252">
  <defs>
    <!-- Pattern lưới ô ly mờ trên nền đá tối -->
    <pattern id="gd" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.06"/>
    </pattern>

    <!-- Pattern gạch đá (hàng so le) -->
    <pattern id="bricks" width="72" height="36" patternUnits="userSpaceOnUse">
      <rect width="72" height="36" fill="none"/>
      <path d="M 0 0 H 72 M 0 18 H 72 M 0 36 H 72" stroke="#0B0806" stroke-width="2" opacity="0.55"/>
      <path d="M 36 0 V 18 M 0 18 V 36 M 72 18 V 36" stroke="#0B0806" stroke-width="2" opacity="0.55"/>
    </pattern>

    <!-- Gradient hầm ngục: nâu đất tối dần xuống đáy -->
    <linearGradient id="bg_dungeon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1E12"/>
      <stop offset="0.55" stop-color="#1F160D"/>
      <stop offset="1" stop-color="#0E0A06"/>
    </linearGradient>

    <!-- Ánh sáng cổng vòm có bậc thang -->
    <radialGradient id="arch_glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- ClipPath bo góc chuẩn card 340x504 -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>
  </defs>

  <!-- Container bọc clipPath theo form của Card sự kiện -->
  <g clip-path="url(#cardClip)">
    <!-- 1. Lớp nền gradient & texture ô ly -->
    <rect width="340" height="504" fill="url(#bg_dungeon)"/>
    <rect width="340" height="504" fill="url(#bricks)"/>
    <rect width="340" height="504" fill="url(#gd)"/>

    <!-- 2. Nhóm chi tiết artwork: Cổng vòm phát sáng + 2 đuốc + sàn đá -->
    <g transform="translate(0,-40)">
      <!-- Vòm cửa hầm ngục -->
      <path d="M 118 300 L 118 210 A 52 52 0 0 1 222 210 L 222 300 Z" fill="#070402"/>
      <path d="M 126 300 L 126 212 A 44 44 0 0 1 214 212 L 214 300 Z" fill="#1A1108"/>
      <!-- Ánh sáng phát ra từ trong cổng -->
      <ellipse cx="170" cy="250" rx="120" ry="120" fill="url(#arch_glow)"/>
      <path d="M 136 300 L 136 214 A 34 34 0 0 1 204 214 L 204 300 Z" fill="#FFC857" opacity="0.35"/>
      <!-- Bậc thang trong cổng -->
      <path d="M 136 300 H 204 V 286 H 136 Z" fill="#FFE9B0" opacity="0.55"/>
      <path d="M 144 286 H 196 V 272 H 144 Z" fill="#FFE9B0" opacity="0.42"/>
      <path d="M 152 272 H 188 V 258 H 152 Z" fill="#FFE9B0" opacity="0.3"/>
      <!-- Khối đá quanh cổng -->
      <path d="M 96 300 L 96 206 A 74 74 0 0 1 244 206 L 244 300" fill="none" stroke="#3A2A18" stroke-width="12" stroke-linejoin="round"/>
      <path d="M 96 206 A 74 74 0 0 1 244 206" fill="none" stroke="#4C3821" stroke-width="6"/>

      <!-- Đuốc trái -->
      <g transform="translate(70,232)">
        <rect x="-4" y="0" width="8" height="46" rx="3" fill="#3A2A18"/>
        <path d="M 0 -22 Q 14 -6 0 6 Q -14 -6 0 -22 Z" fill="#FF8A1F"/>
        <path d="M 0 -14 Q 7 -4 0 3 Q -7 -4 0 -14 Z" fill="#FFE082"/>
        <circle cx="0" cy="-6" r="26" fill="#F59E0B" opacity="0.18"/>
      </g>
      <!-- Đuốc phải -->
      <g transform="translate(270,232)">
        <rect x="-4" y="0" width="8" height="46" rx="3" fill="#3A2A18"/>
        <path d="M 0 -22 Q 14 -6 0 6 Q -14 -6 0 -22 Z" fill="#FF8A1F"/>
        <path d="M 0 -14 Q 7 -4 0 3 Q -7 -4 0 -14 Z" fill="#FFE082"/>
        <circle cx="0" cy="-6" r="26" fill="#F59E0B" opacity="0.18"/>
      </g>

      <!-- Sàn đá dưới chân cổng -->
      <path d="M 0 330 L 340 330 L 340 504 L 0 504 Z" fill="#0B0806" opacity="0.85"/>
      <path d="M 0 330 H 340" stroke="#3A2A18" stroke-width="4"/>
      <path d="M 30 330 L 20 504 M 100 330 L 96 504 M 170 330 L 170 504 M 240 330 L 244 504 M 310 330 L 320 504"
        stroke="#241811" stroke-width="3" opacity="0.9"/>
    </g>
  </g>

  <!-- Viền sáng ngoài card đặc trưng -->
  <rect x="1.5" y="1.5" width="337" height="501" rx="27" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="3"/>
</svg>
