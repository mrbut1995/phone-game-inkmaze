<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 504" width="340" height="504">
  <defs>
    <!-- Khung bo góc chuẩn 340x504 -->
    <clipPath id="cardClip">
      <rect width="340" height="504" rx="28"/>
    </clipPath>

    <!-- Hào quang tình yêu ấm áp -->
    <radialGradient id="loveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF0F5" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFB6D0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E91E63" stop-opacity="0"/>
    </radialGradient>

    <!-- Trái tim Ruby 3D căng mọng -->
    <radialGradient id="rubyHeart" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FF8EB3"/>
      <stop offset="0.4" stop-color="#E91E63"/>
      <stop offset="0.8" stop-color="#AD1457"/>
      <stop offset="1" stop-color="#6A0030"/>
    </radialGradient>

    <!-- Mũi tên Cupid mạ vàng kim loại -->
    <linearGradient id="cupidGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9D2"/>
      <stop offset="0.35" stop-color="#FFD54F"/>
      <stop offset="0.7" stop-color="#FFA000"/>
      <stop offset="1" stop-color="#C67D00"/>
    </linearGradient>

    <!-- Mẫu trái tim nhỏ bay bổng -->
    <g id="mini_floating_heart">
      <path d="M 0 4 C -6 -2, -5 -8, -2 -8 C -1 -8, 0 -6, 0 -5 C 0 -6, 1 -8, 2 -8 C 5 -8, 6 -2, 0 4 Z"/>
    </g>

    <!-- Mẫu cánh hoa hồng rơi -->
    <g id="rose_petal">
      <path d="M 0 -6 C 4 -6, 7 -2, 6 3 C 5 7, 0 8, -3 6 C -6 3, -4 -6, 0 -6 Z" fill="#E91E63" opacity="0.85"/>
      <path d="M -1 -4 C 1 -4, 3 -1, 2 2 C 1 4, -1 5, -2 4 Z" fill="#FF80AB" opacity="0.6"/>
    </g>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- 1. QUẦNG SÁNG & ĐỐM SAO LẤP LÁNH -->
    <circle cx="170" cy="138" r="125" fill="url(#loveGlow)"/>

    <g fill="#FFFFFF" opacity="0.9">
      <path d="M 45 75 Q 45 80 49 80 Q 45 80 45 85 Q 45 80 41 80 Q 45 80 45 75 Z"/>
      <path d="M 295 70 Q 295 75 299 75 Q 295 75 295 80 Q 295 75 291 75 Q 295 75 295 70 Z"/>
      <path d="M 125 55 Q 125 59 128 59 Q 125 59 125 63 Q 125 59 122 59 Q 125 59 125 55 Z"/>
      <circle cx="85" cy="100" r="1.6"/><circle cx="255" cy="85" r="1.8"/>
    </g>

    <!-- Trái tim nhỏ bay bổng -->
    <g transform="translate(32, 110) rotate(-18) scale(1.1)" fill="#FFFFFF" opacity="0.75"><use href="#mini_floating_heart"/></g>
    <g transform="translate(65, 80) rotate(15) scale(0.85)" fill="#FFD1E3" opacity="0.8"><use href="#mini_floating_heart"/></g>
    <g transform="translate(105, 175) rotate(-22) scale(0.9)" fill="#FFFFFF" opacity="0.65"><use href="#mini_floating_heart"/></g>
    <g transform="translate(285, 115) rotate(20) scale(1.15)" fill="#FFFFFF" opacity="0.8"><use href="#mini_floating_heart"/></g>
    <g transform="translate(240, 75) rotate(-12) scale(0.95)" fill="#FFD1E3" opacity="0.85"><use href="#mini_floating_heart"/></g>

    <!-- 2. TRÁI TIM RUBY 3D & MŨI TÊN THẦN CUPID -->
    <g transform="translate(170, 138)">
      <path d="M 0 38 C -52 -10, -42 -58, -18 -58 C -4 -58, 0 -44, 0 -36 C 0 -44, 4 -58, 18 -58 C 42 -58, 52 -10, 0 38 Z" 
            fill="#3B0620" opacity="0.45" transform="translate(0, 10) scale(1.05)"/>
      <path d="M 0 38 C -52 -10, -42 -58, -18 -58 C -4 -58, 0 -44, 0 -36 C 0 -44, 4 -58, 18 -58 C 42 -58, 52 -10, 0 38 Z" 
            fill="url(#rubyHeart)" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5"/>
      <ellipse cx="-18" cy="-35" rx="8" ry="14" fill="#FFFFFF" opacity="0.5" transform="rotate(-28 -18 -35)"/>
      <circle cx="-10" cy="-45" r="3.2" fill="#FFFFFF" opacity="0.75"/>

      <!-- Mũi tên Cupid -->
      <line x1="-115" y1="58" x2="115" y2="-54" stroke="url(#cupidGold)" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-115" y1="57" x2="115" y2="-55" stroke="#FFF9D2" stroke-width="1.8" stroke-linecap="round"/>

      <g transform="translate(115, -54) rotate(-26)">
        <polygon points="18,0 -2,-9 4,0 -2,9" fill="url(#cupidGold)" stroke="#9E6200" stroke-width="1"/>
        <polygon points="12,0 0,-4 3,0 0,4" fill="#FFFFFF" opacity="0.75"/>
      </g>
      <g transform="translate(-115, 58) rotate(-26)">
        <path d="M 0 0 L -16 -10 L -24 -8 L -14 0 L -24 8 L -16 10 Z" fill="#FFFFFF" stroke="#FFB6D0" stroke-width="1.2"/>
        <path d="M -14 0 L -30 -10 L -36 -8 L -26 0 L -36 8 L -30 10 Z" fill="#FFFFFF" stroke="#FFB6D0" stroke-width="1.2"/>
      </g>
    </g>

    <!-- 3. PHONG THƯ TÌNH & MƯA CÁNH HOA HỒNG -->
    <g transform="translate(272, 190) rotate(12)">
      <ellipse cx="0" cy="18" rx="32" ry="8" fill="#2E0419" opacity="0.35"/>
      <rect x="-30" y="-20" width="60" height="40" rx="4" fill="#FFF5F8" stroke="#F8BBD0" stroke-width="1.8"/>
      <path d="M -30 -20 L 0 5 L 30 -20" fill="none" stroke="#F8BBD0" stroke-width="1.8"/>
      <circle cx="0" cy="5" r="7.5" fill="#D81B60" stroke="#880E4F" stroke-width="1"/>
      <path transform="translate(0, 4) scale(0.65)" d="M 0 4 C -6 -2, -5 -8, -2 -8 C -1 -8, 0 -6, 0 -5 C 0 -6, 1 -8, 2 -8 C 5 -8, 6 -2, 0 4 Z" fill="#FFFFFF"/>
    </g>

    <g transform="translate(52, 155) rotate(-14) scale(0.85)">
      <rect x="-24" y="-16" width="48" height="32" rx="3" fill="#FFEBF2" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M -24 -16 L 0 3 L 24 -16" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <circle cx="0" cy="3" r="5" fill="#FF4081"/>
    </g>

    <g transform="translate(130, 205) rotate(25) scale(1.1)"><use href="#rose_petal"/></g>
    <g transform="translate(205, 185) rotate(-35) scale(1.2)"><use href="#rose_petal"/></g>
    <g transform="translate(85, 185) rotate(45) scale(0.95)"><use href="#rose_petal"/></g>
    <g transform="translate(315, 135) rotate(-15) scale(1.05)"><use href="#rose_petal"/></g>
  </g>
</svg>