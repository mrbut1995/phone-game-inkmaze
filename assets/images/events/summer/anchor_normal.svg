<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="starfish-warm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FEC748" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Sao biển san hô phát sáng ấm mềm -->
  <g filter="url(#starfish-warm-glow)">
    <!-- Thân sao biển 5 cánh mập tròn màu Coral #FF6A56 -->
    <path d="M27 12 C29 12 30 18 33 21 C36 24 41 23 42 25 C43 27 38 31 37 34 C36 37 38 42 36 43 C34 44 30 40 27 40 C24 40 20 44 18 43 C16 42 18 37 17 34 C16 31 11 27 12 25 C13 23 18 24 21 21 C24 18 25 12 27 12 Z" fill="#FF6A56"/>

    <!-- Các chấm tròn san hô sáng màu (#FFA394) dọc theo các cánh sao -->
    <circle cx="27" cy="16" r="1.1" fill="#FFA394"/>
    <circle cx="36" cy="24" r="1.1" fill="#FFA394"/>
    <circle cx="33" cy="37" r="1.1" fill="#FFA394"/>
    <circle cx="21" cy="37" r="1.1" fill="#FFA394"/>
    <circle cx="18" cy="24" r="1.1" fill="#FFA394"/>

    <!-- 2 mắt tròn màu Dark Navy #083B4E -->
    <circle cx="23.5" cy="27" r="1.4" fill="#083B4E"/>
    <circle cx="30.5" cy="27" r="1.4" fill="#083B4E"/>

    <!-- Miệng cười chúm chím -->
    <path d="M25.5 30 Q27 31.5 28.5 30" fill="none" stroke="#083B4E" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Má hồng phớt nhẹ -->
    <ellipse cx="20" cy="29" rx="1.6" ry="1" fill="#FDF3DA" opacity="0.6"/>
    <ellipse cx="34" cy="29" rx="1.6" ry="1" fill="#FDF3DA" opacity="0.6"/>
  </g>
</svg>