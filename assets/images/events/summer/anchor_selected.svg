    <circle cx="36" cy="24" r="1.1" fill="#FFA394"/>
    <circle cx="33" cy="37" r="1.1" fill="#FFA394"/>
    <circle cx="21" cy="37" r="1.1" fill="#FFA394"/>
    <circle cx="18" cy="24" r="1.1" fill="#FFA394"/>

    <circle cx="23.5" cy="27" r="1.4" fill="#083B4E"/>
    <circle cx="30.5" cy="27" r="1.4" fill="#083B4E"/>

    <path d="M25.5 30 Q27 31.5 28.5 30" fill="none" stroke="#083B4E" stroke-width="1.1" stroke-linecap="round"/>

