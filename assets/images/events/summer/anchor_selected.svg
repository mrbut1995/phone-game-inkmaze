    <path d="M27 12 C29 12 30 18 33 21 C36 24 41 23 42 25 C43 27 38 31 37 34 C36 37 38 42 36 43 C34 44 30 40 27 40 C24 40 20 44 18 43 C16 42 18 37 17 34 C16 31 11 27 12 25 C13 23 18 24 21 21 C24 18 25 12 27 12 Z" fill="#FF6A56"/>

