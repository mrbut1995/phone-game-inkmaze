      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#FEC748" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Khung bo góc nét đứt màu Sunny Yellow #FEC748 -->
