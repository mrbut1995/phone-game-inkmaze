<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#DECAA0"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#FDF3DA"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFFDF8"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#F4E2B9"/>

  <!-- Đĩa trung tâm màu xám xanh desaturated #648491 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#2E444E"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#648491"/>

  <!-- Rương đóng nắp màu xám xanh chìm tối -->
  <g>
    <!-- Nắp vòm rương đóng -->
    <path d="M58 82 Q88 64 118 82 Z" fill="#4B626C"/>
    <!-- Thân rương -->
    <rect x="58" y="82" width="60" height="38" rx="5" fill="#3A4D55"/>
    <path d="M58 82 L70 82 L70 120 L58 120 Z" fill="#5A717B"/>
    <path d="M106 82 L118 82 L118 120 L106 120 Z" fill="#5A717B"/>
  </g>

  <!-- Dây thừng dày quấn quanh rương (Thick rope) -->
  <line x1="68" y1="74" x2="108" y2="114" stroke="#D1BE99" stroke-width="4.5" stroke-dasharray="6 3" stroke-linecap="round"/>
  <line x1="108" y1="74" x2="68" y2="114" stroke="#BAA780" stroke-width="4.5" stroke-dasharray="6 3" stroke-linecap="round"/>

  <!-- Ổ khóa nhỏ màu Navy ở mặt trước -->
  <g transform="translate(88 94)">
    <path d="M-5 -3 V-8 A5 5 0 0 1 5 -8 V-3" fill="none" stroke="#209FC2" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-7" y="-3" width="14" height="11" rx="2.5" fill="#083B4E"/>
    <circle cx="0" cy="2" r="1.3" fill="#FEC748"/>
