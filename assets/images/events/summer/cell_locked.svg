<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch màu beige sẫm #D8C69F -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#A8946E"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#D8C69F"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#C4B18A"/>

  <!-- Vỏ sò nhỏ ở các góc -->
  <path d="M30 30 C27 22 37 22 34 30 Z" fill="#FDF3DA" opacity="0.8"/>
  <path d="M142 32 C139 24 149 24 146 32 Z" fill="#FDF3DA" opacity="0.8"/>
  <path d="M32 144 C29 136 39 136 36 144 Z" fill="#FDF3DA" opacity="0.8"/>
  <path d="M144 142 C141 134 151 134 148 142 Z" fill="#FDF3DA" opacity="0.8"/>

  <!-- Dây thừng hàng hải dày bắt chéo (Crossed thick nautical ropes) -->
  <line x1="24" y1="24" x2="152" y2="152" stroke="#E3D3B0" stroke-width="11" stroke-dasharray="14 6" stroke-linecap="round"/>
  <line x1="152" y1="24" x2="24" y2="152" stroke="#C4B08A" stroke-width="11" stroke-dasharray="14 6" stroke-linecap="round"/>

  <!-- Bóng tròn sau ổ khóa -->
  <circle cx="88" cy="94" r="32" fill="#083B4E" opacity="0.6"/>

  <!-- Ổ khóa Navy chunky ở trung tâm với lỗ khóa vàng -->
  <g transform="translate(88 88)">
    <!-- Quai khóa thép màu Ocean Blue #209FC2 -->
    <path d="M-18 -8 V-24 A18 18 0 0 1 18 -24 V-8" fill="none" stroke="#209FC2" stroke-width="9" stroke-linecap="round"/>
    <!-- Thân khóa Navy #083B4E -->
    <rect x="-28" y="-8" width="56" height="46" rx="9" fill="#083B4E"/>
    <!-- Băng đáy tối màu #052B3A -->
    <path d="M-28 17 Q-28 38 -9 38 L9 38 Q28 38 28 17 L28 12 L-28 12 Z" fill="#052B3A"/>
    <!-- Lỗ khóa vàng Sunny Yellow #FEC748 -->
    <circle cx="0" cy="11" r="5" fill="#FEC748"/>
    <polygon points="-3,12 3,12 2,24 -2,24" fill="#FEC748"/>
  </g>
</svg>