<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="heart-pink-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FF578B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 2 cánh thiên thần nhỏ màu trắng 2 bên (Tiny white angel wings) -->
  <g fill="#FDEDF0">
    <!-- Cánh trái -->
    <path d="M15 22 C8 20 6 24 10 27 C7 28 8 32 13 30 C14 28 15 25 15 22 Z"/>
    <!-- Cánh phải -->
    <path d="M39 22 C46 20 48 24 44 27 C47 28 46 32 41 30 C40 28 39 25 39 22 Z"/>
  </g>

  <!-- Trái tim phát sáng hồng ấm mềm -->
  <g filter="url(#heart-pink-glow)">
    <!-- Thân trái tim mập tròn màu Hot Pink #FF578B -->
    <path d="M27 38 C22 34 14 27 14 20 C14 14 18 11 23 11 C25.5 11 27 13 27 14 C27 13 28.5 11 31 11 C36 11 40 14 40 20 C40 27 32 34 27 38 Z" fill="#FF578B"/>

    <!-- Vệt bóng sáng trắng trên góc trên trái (Lighter highlight) -->
    <ellipse cx="20" cy="15" rx="3.5" ry="2" fill="#FFFFFF" opacity="0.65" transform="rotate(-30 20 15)"/>

    <!-- 2 mắt tròn màu Dark Wine #2A0412 có đốm sáng trắng -->
    <circle cx="23" cy="22" r="1.5" fill="#2A0412"/>
    <circle cx="23.5" cy="21.5" r="0.5" fill="#FFFFFF"/>
    <circle cx="31" cy="22" r="1.5" fill="#2A0412"/>
    <circle cx="31.5" cy="21.5" r="0.5" fill="#FFFFFF"/>

    <!-- Miệng cười chúm chím -->
    <path d="M25.5 25.5 Q27 27 28.5 25.5" fill="none" stroke="#2A0412" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Má hồng phớt nhẹ -->
    <ellipse cx="19" cy="24.5" rx="2" ry="1.2" fill="#FEC8D6" opacity="0.75"/>
    <ellipse cx="35" cy="24.5" rx="2" ry="1.2" fill="#FEC8D6" opacity="0.75"/>
  </g>
</svg>