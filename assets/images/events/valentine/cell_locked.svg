<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch màu dusty mauve sẫm #B88F9E -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#8C6674"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#B88F9E"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#A67E8D"/>

  <!-- Bông hoa hồng cuộn cánh nhỏ ở góc trên phải (Swirled rose in corner) -->
  <g transform="translate(142 32)">
    <circle cx="0" cy="0" r="10" fill="#FF578B"/>
    <path d="M-5 -4 Q0 -8 5 -4 Q8 2 3 6 Q-4 7 -6 2 Q-7 -1 -2 -4 Q2 -5 4 -1 Q4 3 1 4" fill="none" stroke="#C01742" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Dây ruy băng hồng xoăn bắt chéo thắt nơ ở tâm (Crossed curly pink ribbons) -->
  <line x1="24" y1="24" x2="152" y2="152" stroke="#FEC8D6" stroke-width="11" stroke-linecap="round"/>
  <line x1="152" y1="24" x2="24" y2="152" stroke="#FF578B" stroke-width="11" stroke-linecap="round"/>

  <!-- Bóng tròn sau ổ khóa -->
  <circle cx="88" cy="94" r="32" fill="#2A0412" opacity="0.6"/>

  <!-- Ổ khóa Crimson chunky ở trung tâm với lỗ khóa trái tim -->
  <g transform="translate(88 88)">
    <!-- Quai khóa thép màu Light Pink #FEC8D6 -->
    <path d="M-18 -8 V-24 A18 18 0 0 1 18 -24 V-8" fill="none" stroke="#FEC8D6" stroke-width="9" stroke-linecap="round"/>
    <!-- Thân khóa Crimson #C01742 -->
    <rect x="-28" y="-8" width="56" height="46" rx="9" fill="#C01742"/>
    <!-- Băng đáy tối màu #8A1030 -->
    <path d="M-28 17 Q-28 38 -9 38 L9 38 Q28 38 28 17 L28 12 L-28 12 Z" fill="#8A1030"/>

    <!-- Lỗ khóa hình trái tim nhỏ màu Light Pink #FEC8D6 -->
    <g transform="translate(0 12) scale(0.9)">
      <path d="M0 6 C-3 4 -6 1 -6 -2 C-6 -4 -4 -6 -2 -6 C0 -6 0 -4 0 -3 C0 -4 0 -6 2 -6 C4 -6 6 -4 6 -2 C6 1 3 4 0 6 Z" fill="#FEC8D6"/>
    </g>
  </g>
</svg>