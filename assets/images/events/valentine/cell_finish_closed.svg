<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#E8BCC8"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#FDEDF0"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFFFFF"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#F7CAD8"/>

  <!-- Đĩa trung tâm màu xám tím desaturated #5E4650 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#332128"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#5E4650"/>

  <!-- Hộp socola màu xám mờ bị khóa kín -->
  <g transform="translate(88 88)">
    <path d="M0 29 C-14 19 -32 5 -32 -11 C-32 -23 -20 -29 -10 -29 C-4 -29 0 -25 0 -23 C0 -25 4 -29 10 -29 C20 -29 32 -23 32 -11 C32 5 14 19 0 29 Z" fill="#755E67"/>
  </g>

  <!-- Dây ruy băng xích bắt chéo khóa chặt (Crossed chain ribbon) -->
  <line x1="66" y1="72" x2="110" y2="104" stroke="#9E8790" stroke-width="4.5" stroke-dasharray="6 3" stroke-linecap="round"/>
  <line x1="110" y1="72" x2="66" y2="104" stroke="#87727B" stroke-width="4.5" stroke-dasharray="6 3" stroke-linecap="round"/>

  <!-- Ổ khóa nhỏ màu xám ở mặt trước hộp -->
  <g transform="translate(88 88)">
    <path d="M-5 -3 V-8 A5 5 0 0 1 5 -8 V-3" fill="none" stroke="#D1C5CA" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-7" y="-3" width="14" height="11" rx="2.5" fill="#5E4B53"/>
    <circle cx="0" cy="2" r="1.3" fill="#2A0412"/>
  </g>
</svg>