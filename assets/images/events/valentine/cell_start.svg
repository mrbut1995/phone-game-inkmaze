<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền Blush White -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#E8BCC8"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#FDEDF0"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFFFFF"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#F7CAD8"/>

  <!-- Đĩa tròn trung tâm Crimson #C01742 -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#7A1233"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#C01742"/>
  <path d="M54 33 Q36 33 36 51 L36 54 Q36 36 54 36 L122 36 Q140 36 140 54 L140 51 Q140 33 122 33 Z" fill="#DB2E5B"/>

  <!-- BỨC THƯ TÌNH (LOVE-LETTER ENVELOPE) MÀU BLUSH WHITE -->
  <g transform="translate(88 92) rotate(-8) translate(-88 -92)">
    <!-- Thân phong bì -->
    <rect x="58" y="70" width="60" height="42" rx="4" fill="#FDEDF0"/>
    <!-- Nếp gấp sau -->
    <polygon points="58,70 118,70 88,94" fill="#FEC8D6"/>
    <!-- Vạt phong bì mở hé hình chữ V -->
    <polygon points="58,112 88,90 118,112" fill="#F7CAD8"/>

    <!-- Con dấu sáp hình trái tim màu Crimson #C01742 niêm phong thư -->
    <g transform="translate(88 88) scale(0.85)">
      <circle cx="0" cy="0" r="8" fill="#C01742"/>
      <path d="M0 5 C-3 3 -5 1 -5 -2 C-5 -4 -3 -5 -1 -5 C0 -5 0 -4 0 -3 C0 -4 0 -5 1 -5 C3 -5 5 -4 5 -2 C5 1 3 3 0 5 Z" fill="#FDEDF0"/>
    </g>
  </g>

  <!-- Trái tim hồng nhỏ bay lơ lửng phía trên bức thư (Floating pink heart) -->
  <g transform="translate(108 58) scale(0.75)">
    <path d="M0 8 C-4 5 -8 2 -8 -2 C-8 -5 -5 -7 -2 -7 C0 -7 0 -5 0 -4 C0 -5 0 -7 2 -7 C5 -7 8 -5 8 -2 C8 2 4 5 0 8 Z" fill="#FF578B"/>
  </g>
</svg>