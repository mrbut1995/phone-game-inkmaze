<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <defs>
    <filter id="key-val-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 2 tia lấp lánh màu trắng (White sparkles) -->
  <path d="M135 38 Q135 48 125 48 Q135 48 135 58 Q135 48 145 48 Q135 48 135 38 Z" fill="#FFFFFF"/>
  <path d="M38 125 Q38 133 30 133 Q38 133 38 141 Q38 133 46 133 Q38 133 38 125 Z" fill="#FFFFFF"/>

  <!-- Chìa khóa xoay nghiêng 40 độ từ tâm -->
  <g transform="translate(88 88) rotate(-40) translate(-88 -88)" filter="url(#key-val-glow)">
    <!-- Chuôi chìa khóa: Trái tim đỏ Crimson #C01742 (Heart Bow) -->
    <g>
      <!-- Khối trái tim đỏ thắm -->
      <path d="M88 64 C70 50 48 34 48 18 C48 4 60 -2 72 -2 C80 -2 88 4 88 8 C88 4 96 -2 104 -2 C116 -2 128 4 128 18 C128 34 106 50 88 64 Z" fill="#C01742"/>

      <!-- Vệt sáng phản chiếu góc trên trái (Lighter highlight) -->
      <ellipse cx="66" cy="10" rx="8" ry="4" fill="#FF578B" transform="rotate(-30 66 10)"/>

      <!-- Lỗ tròn tâm chuôi chìa khóa -->
      <circle cx="88" cy="24" r="8" fill="#2A0412"/>
      <circle cx="88" cy="24" r="4" fill="#FEC8D6"/>
    </g>

    <!-- Thân chìa khóa màu Light Pink #FEC8D6 với vát bóng Rose Pink #F16194 -->
    <rect x="83.5" y="66" width="9" height="78" rx="4" fill="#F16194"/>
    <rect x="83.5" y="66" width="4.5" height="78" rx="2" fill="#FEC8D6"/>

    <!-- Răng chìa khóa (Bit) hình khối cắt giấy ngọt ngào -->
    <path d="M92 112 L110 112 Q113 112 113 115 L113 122 Q113 125 110 125 L92 125 Z" fill="#F16194"/>
    <path d="M92 112 L110 112 Q113 112 113 115 L113 118 L92 118 Z" fill="#FEC8D6"/>

    <path d="M92 130 L106 130 Q109 130 109 133 L109 140 Q109 143 106 143 L92 143 Z" fill="#F16194"/>
    <path d="M92 130 L106 130 Q109 130 109 133 L109 136 L92 136 Z" fill="#FEC8D6"/>

    <!-- Chóp đáy chuôi chìa tròn xoe -->
    <circle cx="88" cy="149" r="5" fill="#F16194"/>
    <circle cx="88" cy="148" r="3" fill="#FEC8D6"/>
  </g>
</svg>