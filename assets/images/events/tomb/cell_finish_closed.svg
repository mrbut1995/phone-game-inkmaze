    <path d="M-5 -3 V-8 A5 5 0 0 1 5 -8 V-3" fill="none" stroke="#F5D98A" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-7" y="-3" width="14" height="11" rx="2.5" fill="#E5A92E"/>
    <circle cx="0" cy="2" r="1.3" fill="#3B200B"/>
  </g>
