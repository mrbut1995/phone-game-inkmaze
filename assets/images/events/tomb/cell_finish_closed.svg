<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="88" height="88">
  <!-- Gạch nền -->
  <rect x="4" y="8" width="168" height="164" rx="14" fill="#CCA056"/>
  <rect x="4" y="4" width="168" height="164" rx="14" fill="#F8D98E"/>
  <path d="M18 4 Q4 4 4 18 L4 22 Q4 8 18 8 L158 8 Q172 8 172 22 L172 18 Q172 4 158 4 Z" fill="#FFF0C8"/>
  <rect x="16" y="16" width="144" height="140" rx="10" fill="#E8A959"/>

  <!-- Đĩa trung tâm màu xám nâu desaturated #73614F -->
  <rect x="36" y="36" width="104" height="104" rx="20" fill="#423427"/>
  <rect x="36" y="33" width="104" height="104" rx="20" fill="#73614F"/>

  <!-- Kim tự tháp lạnh màu xám đá -->
  <g>
    <polygon points="88,48 126,118 88,118" fill="#998776"/>
    <polygon points="88,48 50,118 88,118" fill="#756454"/>
  </g>

  <!-- Phiến đá tảng niêm phong cửa kim tự tháp (Heavy stone slab) -->
