<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="27" height="27">
  <defs>
    <filter id="scarab-warm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FEC84C" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 6 chân nhỏ uốn cong chìa ra 2 bên -->
  <g fill="none" stroke="#276B68" stroke-width="1.8" stroke-linecap="round">
    <!-- Cặp chân trước vươn lên -->
    <path d="M21 20 Q15 15 17 11"/>
    <path d="M33 20 Q39 15 37 11"/>
    <!-- Cặp chân giữa chìa ngang -->
    <path d="M19 28 Q12 28 13 33"/>
    <path d="M35 28 Q42 28 41 33"/>
    <!-- Cặp chân sau duỗi xuống -->
    <path d="M20 36 Q14 41 18 45"/>
    <path d="M34 36 Q40 41 36 45"/>
  </g>

  <!-- Bọ hung phát sáng ấm mềm -->
  <g filter="url(#scarab-warm-glow)">
    <!-- Đầu & ngực bọ hung màu Deep Turquoise #276B68 -->
    <!-- Răng cưa trán đầu bọ hung (Clypeus) -->
    <path d="M24 16 L25 13 L27 15 L29 13 L30 16 Z" fill="#276B68"/>
    <ellipse cx="27" cy="18" rx="5.5" ry="3.5" fill="#276B68"/>

    <!-- 2 mắt tròn đen có đốm sáng nhỏ -->
    <circle cx="23.5" cy="18" r="1.3" fill="#3B200B"/>
    <circle cx="23.2" cy="17.6" r="0.4" fill="#FFFFFF"/>
    <circle cx="30.5" cy="18" r="1.3" fill="#3B200B"/>
    <circle cx="30.2" cy="17.6" r="0.4" fill="#FFFFFF"/>

    <!-- Thân mai bọ hung tròn trịa màu Turquoise #38938E -->
    <ellipse cx="27" cy="30" rx="12" ry="11" fill="#38938E"/>

    <!-- Rãnh chia đôi 2 cánh giữa lưng -->
    <line x1="27" y1="19" x2="27" y2="41" stroke="#276B68" stroke-width="1.5"/>

    <!-- Các đốm vàng nhỏ trên mai bọ hung (Golden dots) -->
    <circle cx="21" cy="26" r="1.2" fill="#FEC84C"/>
    <circle cx="33" cy="26" r="1.2" fill="#FEC84C"/>
    <circle cx="23" cy="34" r="1.2" fill="#FEC84C"/>
    <circle cx="31" cy="34" r="1.2" fill="#FEC84C"/>
  </g>
</svg>