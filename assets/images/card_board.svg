<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1020" width="1020" height="1020">
  <defs>
    <filter id="cardShadowBig" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1E1610" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E1610" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Khung bảng 980x980 bo góc rx=28 -->
  <rect x="20" y="15" width="980" height="980" rx="28" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="6" filter="url(#cardShadowBig)"/>

  <!-- Highlight mỏng cạnh trên-trái -->
  <line x1="48" y1="18" x2="972" y2="18" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>
  <line x1="23" y1="48" x2="23" y2="945" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>
</svg>