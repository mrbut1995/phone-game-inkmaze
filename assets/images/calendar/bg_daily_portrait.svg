<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1560" width="360" height="780">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F4FD"/>
      <stop offset="45%" stop-color="#EDF6F9"/>
      <stop offset="100%" stop-color="#D6EAF5"/>
    </linearGradient>
    <!-- Subtle dot grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#A8CEE4" opacity="0.35"/>
    </pattern>
    <!-- Very light lines -->
    <pattern id="lineGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="32" x2="32" y2="32" stroke="#8BB5CD" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Base gradient fill -->
  <rect width="720" height="1560" fill="url(#bgGrad)"/>
  <!-- Dot grid overlay -->
  <rect width="720" height="1560" fill="url(#dotGrid)"/>
  <!-- Top corner ink smudge decorations -->
  <ellipse cx="0" cy="0" rx="120" ry="100" fill="#3D83AE" opacity="0.06"/>
  <ellipse cx="720" cy="1560" rx="140" ry="110" fill="#4A90C8" opacity="0.05"/>
  <!-- Top decorative stripe -->
  <rect x="0" y="0" width="720" height="4" fill="#3D83AE" opacity="0.18"/>
  <!-- Bottom decorative stripe -->
  <rect x="0" y="1556" width="720" height="4" fill="#3D83AE" opacity="0.18"/>
</svg>
