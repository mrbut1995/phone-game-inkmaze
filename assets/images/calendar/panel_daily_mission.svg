<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 276" width="484" height="276" fill="none">
  <defs>
    <linearGradient id="missionPaperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6ED"/>
    </linearGradient>
    <linearGradient id="missionHeaderPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#EFF5F9"/>
    </linearGradient>
    <linearGradient id="missionFooterPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF5F9"/>
      <stop offset="100%" stop-color="#FAF6ED"/>
    </linearGradient>
    <filter id="missionShadow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E384D" flood-opacity="0.14"/>
    </filter>
    <clipPath id="missionClip">
      <rect width="484" height="276" rx="16"/>
    </clipPath>
  </defs>

  <g filter="url(#missionShadow)">
    <g clip-path="url(#missionClip)">
      <!-- Main Paper Card Background -->
      <rect width="484" height="276" fill="url(#missionPaperGrad)"/>

      <!-- Header area: y: 0 to 34 (patch_margin_top = 34) -->
      <rect x="0" y="0" width="484" height="34" fill="url(#missionHeaderPaper)"/>
      <line x1="0" y1="34" x2="484" y2="34" stroke="#BDD5E4" stroke-width="1.5"/>

      <!-- Footer area: y: 238 to 276 (patch_margin_bottom = 38) -->
      <rect x="0" y="238" width="484" height="38" fill="url(#missionFooterPaper)"/>
      <line x1="16" y1="238" x2="468" y2="238" stroke="#D3E2EC" stroke-width="1.2" stroke-dasharray="4 3"/>

      <!-- Notebook ruled lines in content body -->
      <line x1="20" y1="84" x2="464" y2="84" stroke="#E8EEF3" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="20" y1="134" x2="464" y2="134" stroke="#E8EEF3" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="20" y1="184" x2="464" y2="184" stroke="#E8EEF3" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Subtle red vertical margin line -->
      <line x1="28" y1="34" x2="28" y2="238" stroke="#E57373" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- Outer Paper Border: Delicate ink stroke -->
    <rect x="1" y="1" width="482" height="274" rx="15" stroke="#3266B1" stroke-width="2" stroke-opacity="0.85"/>
  </g>
</svg>