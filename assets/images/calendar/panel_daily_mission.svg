<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="490" height="280">
  <defs>
    <!-- Mẫu lưới ô ly tập vở -->
    <pattern id="dlgCleanGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#90BBD4" stroke-width="0.85" opacity="0.6" />
    </pattern>

    
    <clipPath id="dlgCleanClip">
      <rect x="0" y="0" width="490" height="280" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#dlgCleanClip)">
    <!-- 1. Nền giấy chính -->
    <rect x="0" y="0" width="490" height="280" fill="#FAF5EB" />

    <!-- 2. Lưới ô ly Body (y: 60 -> 500) -->
    <rect x="0" y="60" width="490" height="220" fill="url(#dlgCleanGrid)" />

    <!-- 3. Header Section (y: 0 -> 60) -->
    <rect x="0" y="0" width="490" height="30" fill="#F4EEDF" />
    <line x1="0" y1="60" x2="980" y2="60" stroke="#3D83AE" stroke-width="2.5" />

    <!-- 4. Footer / Bottom Section (y: 500 -> 560) -->
    <rect x="0" y="500" width="490" height="30" fill="#F4EEDF" />
    <line x1="0" y1="500" x2="980" y2="500" stroke="#3D83AE" stroke-width="2" stroke-dasharray="7 4" />
  </g>

  <!-- Viền khung ngoài (thụt lùi 1.5px để stroke 3px không bị lẹm viền mép) -->
  <rect x="1.5" y="1.5" width="488.5" height="278.5" rx="21" fill="none" stroke="#3D83AE" stroke-width="3" />
</svg>