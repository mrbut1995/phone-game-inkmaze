<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540">
  <defs>
    <filter id="dlgCleanShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#182E3E" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#182E3E" flood-opacity="0.10" />
    </filter>

    <pattern id="dlgCleanGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#90BBD4" stroke-width="0.85" opacity="0.6" />
    </pattern>

    <clipPath id="dlgCleanClip">
      <rect x="20" y="16" width="980" height="490" rx="22" />
    </clipPath>
  </defs>

  <g filter="url(#dlgCleanShadow)">
    <g clip-path="url(#dlgCleanClip)">
      <!-- 1. Nền giấy chính -->
      <rect x="20" y="16" width="980" height="490" fill="#FAF5EB" />

      <!-- 2. Lưới ô ly Body -->
      <rect x="20" y="86" width="980" height="344" fill="url(#dlgCleanGrid)" />

      <!-- 3. Header Section (y: 16 -> 86) -->
      <rect x="20" y="16" width="980" height="70" fill="#F4EEDF" />
      <line x1="20" y1="86" x2="1000" y2="86" stroke="#3D83AE" stroke-width="2.5" />

      <!-- 4. LỀ ĐỎ PHÂN TÁCH: Bên trái là Cột Status (rộng 130px), bên phải là Content + Button -->
      <line x1="150" y1="86" x2="150" y2="430" stroke="#D84444" stroke-width="2.8" />

      <!-- Vạch phân cách các hàng nhiệm vụ -->
      <line x1="20" y1="200" x2="1000" y2="200" stroke="#8FB9D2" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
      <line x1="20" y1="315" x2="1000" y2="315" stroke="#8FB9D2" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>

      <!-- 5. Footer Section (y: 430 -> 506) -->
      <rect x="20" y="430" width="980" height="76" fill="#F4EEDF" />
      <line x1="20" y1="430" x2="1000" y2="430" stroke="#3D83AE" stroke-width="2" stroke-dasharray="7 4" />
    </g>

    <!-- Viền khung ngoài -->
    <rect x="20" y="16" width="980" height="490" rx="22" fill="none" stroke="#3D83AE" stroke-width="3" />
  </g>
</svg>