<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 592" width="1020" height="592">
  <defs>
    <filter id="dlgCleanShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#182E3E" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#182E3E" flood-opacity="0.10" />
    </filter>

    <pattern id="dlgCleanGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#90BBD4" stroke-width="0.85" opacity="0.6" />
    </pattern>

    <clipPath id="dlgCleanClip">
      <rect x="20" y="16" width="980" height="560" rx="22" />
    </clipPath>
  </defs>

  <g filter="url(#dlgCleanShadow)">
    <g clip-path="url(#dlgCleanClip)">
      <!-- 1. Nền giấy chính (980 x 560: đã kéo dài thêm 1 hàng nhiệm vụ) -->
      <rect x="20" y="16" width="980" height="560" fill="#FAF5EB" />

      <!-- 2. Lưới ô ly Body (y: 76 -> 516) -->
      <rect x="20" y="76" width="980" height="440" fill="url(#dlgCleanGrid)" />

      <!-- 2b. Hàng CHẾ ĐỘ ĐẶC BIỆT: phủ hồng nhạt để tách khỏi 3 hàng maze thường -->
      <rect x="20" y="406" width="980" height="110" fill="#D84444" fill-opacity="0.07" />

      <!-- 3. Header Section (y: 16 -> 76) -->
      <rect x="20" y="16" width="980" height="60" fill="#F4EEDF" />
      <line x1="20" y1="76" x2="1000" y2="76" stroke="#3D83AE" stroke-width="2.5" />

      <!-- 4. LỀ ĐỎ PHÂN TÁCH: trái = cột Status (rộng 130px), phải = Content + Button -->
      <line x1="150" y1="76" x2="150" y2="516" stroke="#D84444" stroke-width="2.8" />

      <!-- Vạch phân cách 4 hàng nhiệm vụ -->
      <line x1="20" y1="186" x2="1000" y2="186" stroke="#8FB9D2" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
      <line x1="20" y1="296" x2="1000" y2="296" stroke="#8FB9D2" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
      <line x1="20" y1="406" x2="1000" y2="406" stroke="#8FB9D2" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>

      <!-- 5. Footer Section (y: 516 -> 576) -->
      <rect x="20" y="516" width="980" height="60" fill="#F4EEDF" />
      <line x1="20" y1="516" x2="1000" y2="516" stroke="#3D83AE" stroke-width="2" stroke-dasharray="7 4" />
    </g>

    <!-- Viền khung ngoài -->
    <rect x="20" y="16" width="980" height="560" rx="22" fill="none" stroke="#3D83AE" stroke-width="3" />
  </g>
</svg>