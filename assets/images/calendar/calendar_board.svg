<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 505" width="510" height="505" fill="none">
  <defs>
    <linearGradient id="calPaperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6ED"/>
    </linearGradient>
    <linearGradient id="calHeaderPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#EFF5F9"/>
    </linearGradient>
    <filter id="calShadow" x="-4%" y="-3%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E384D" flood-opacity="0.14"/>
    </filter>
    <clipPath id="calClip">
      <rect width="510" height="505" rx="16"/>
    </clipPath>
  </defs>

  <g filter="url(#calShadow)">
    <g clip-path="url(#calClip)">
      <!-- Main Paper Background -->
      <rect width="510" height="505" fill="url(#calPaperGrad)"/>

      <!-- Header background area (Month + Day-of-week header) -->
      <rect x="0" y="0" width="510" height="81" fill="url(#calHeaderPaper)"/>

      <!-- Perforated / Dashed line separating Month navigation and Day titles -->
      <line x1="20" y1="56" x2="490" y2="56" stroke="#D3E2EC" stroke-width="1.2" stroke-dasharray="4 3"/>

      <!-- Bottom border of header area at y=81 -->
      <line x1="0" y1="81" x2="510" y2="81" stroke="#BDD5E4" stroke-width="1.5"/>

      <!-- Subtle notebook grid horizontal lines -->
      <line x1="28" y1="145" x2="485" y2="145" stroke="#E6EEF4" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="28" y1="210" x2="485" y2="210" stroke="#E6EEF4" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="28" y1="275" x2="485" y2="275" stroke="#E6EEF4" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="28" y1="340" x2="485" y2="340" stroke="#E6EEF4" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="28" y1="405" x2="485" y2="405" stroke="#E6EEF4" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Delicate red vertical margin line (notebook aesthetic) -->
      <line x1="28" y1="81" x2="28" y2="490" stroke="#E57373" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- Outer Paper Border: Delicate ink stroke -->
    <rect x="1" y="1" width="508" height="503" rx="15" stroke="#3266B1" stroke-width="2" stroke-opacity="0.85"/>
  </g>
</svg>