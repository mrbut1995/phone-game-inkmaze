<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="64" height="64">
  <defs>
    
    <filter id="loadingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2575A7" flood-opacity="0.3" />
    </filter>
  </defs>

  
  <circle cx="64" cy="64" r="46" fill="none" stroke="#8FB9D2" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 12" opacity="0.35" />

  
  <g filter="url(#loadingGlow)">
    <circle cx="64" cy="64" r="46" fill="none" stroke="#3D83AE" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 18 28 18" stroke-dashoffset="0">
      
      <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  
  <circle cx="64" cy="64" r="3.5" fill="#3D83AE" opacity="0.7" />
</svg>