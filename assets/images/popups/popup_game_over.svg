<svg xmlns="http://www.w3.org/2000/svg" viewBox="17 14 896 1185" width="448" height="592.5">
  <defs>
    <filter id="failAssetShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#301A1A" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#301A1A" flood-opacity="0.10"/>
    </filter>

    <filter id="clipAssetShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- MẢNH GIẤY NHÁP HỎNG (y: 40 -> 1160) -->
  <g transform="translate(40, 40)" filter="url(#failAssetShadow)">
    <rect width="425" height="560" rx="18" fill="#FDFBF7"/>

    <!-- Lưới kẻ ngang xám mờ -->
    <g stroke="#BAC7CF" stroke-width="1" opacity="0.4">
      <line x1="60" y1="200" x2="790" y2="200"/><line x1="60" y1="270" x2="790" y2="270"/>
      <line x1="60" y1="340" x2="790" y2="340"/><line x1="60" y1="410" x2="790" y2="410"/>
      <line x1="60" y1="480" x2="790" y2="480"/><line x1="60" y1="550" x2="790" y2="550"/>
      <line x1="60" y1="620" x2="790" y2="620"/><line x1="60" y1="690" x2="790" y2="690"/>
      <line x1="60" y1="760" x2="790" y2="760"/><line x1="60" y1="830" x2="790" y2="830"/>
      <line x1="60" y1="900" x2="790" y2="900"/><line x1="60" y1="970" x2="790" y2="970"/>
    </g>

    <!-- Lề đỏ nét đứt -->
    <line x1="75" y1="0" x2="75" y2="1120" stroke="#D84444" stroke-width="2.5" stroke-dasharray="6 4"/>
    <!-- Viền đỏ quanh mép giấy -->
    <rect width="425" height="560" rx="18" fill="none" stroke="#D84444" stroke-width="3"/>
  </g>

  <!-- GHIM KẸP GIẤY KIM LOẠI Ở GÓC TRÊN TRÁI (x: 140, y: 25) -->
  <g transform="translate(140, 25)" filter="url(#clipAssetShadow)">
    <path d="M 0 45 L 0 10 A 12 12 0 0 1 24 10 L 24 55 A 18 18 0 0 1 -12 55 L -12 18" 
          fill="none" stroke="#7A8F9B" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>