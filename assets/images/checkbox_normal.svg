<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Đổ bóng giấy -->
    <filter id="cb-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E384D" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1E384D" flood-opacity="0.08" />
    </filter>
  </defs>

  <g filter="url(#cb-shadow)">
    <!-- Nền giấy kem -->
    <rect x="7" y="7" width="34" height="34" rx="8" fill="#FAF5EB" />
    <!-- Viền mực xanh -->
    <rect x="7" y="7" width="34" height="34" rx="8" fill="none" stroke="#3D83AE" stroke-width="2.2" />
  </g>
</svg>