<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -28 80 84" width="80" height="84">
  <defs>
    <!-- Gradient tia năng lượng kéo vật thể -->
    <linearGradient id="beamEnergy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#00ff88" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#00e676" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.0" />
    </linearGradient>

    <!-- Kim loại thân trên đĩa bay (Ánh bạc pha tím không gian) -->
    <linearGradient id="hullTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Đáy đĩa bay (Đổ bóng tối khối kim loại) -->
    <linearGradient id="hullBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vòm kính ngọc lam trong suốt -->
    <linearGradient id="glassDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- ================= 1. CHÙM TIA TRACTOR BEAM NĂNG LƯỢNG ================= -->
  <g id="tractor_beam">
    <!-- Cột sáng chính -->
    <polygon points="-9,6 9,6 26,48 -26,48" fill="url(#beamEnergy)" />
    
    <!-- Các vòng quét năng lượng (Pulse Energy Rings) -->
    <ellipse cx="0" cy="20" rx="14" ry="3.5" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.65" stroke-dasharray="4,2" />
    <ellipse cx="0" cy="34" rx="20" ry="4.5" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.45" />
    <ellipse cx="0" cy="45" rx="25" ry="5.5" fill="none" stroke="#34d399" stroke-width="1" opacity="0.3" />

    <!-- Lõi phát tia plasma đáy đĩa -->
    <ellipse cx="0" cy="6" rx="9" ry="2.5" fill="#a7f3d0" />
  </g>

  <!-- ================= 2. ĐÁY ĐĨA BAY (BỘ TẢN NHIỆT & GỜ DƯỚI) ================= -->
  <ellipse cx="0" cy="4" rx="21" ry="7" fill="url(#hullBottom)" stroke="#334155" stroke-width="1" />
  <ellipse cx="0" cy="2.5" rx="25.5" ry="8.5" fill="#1e293b" />

  <!-- ================= 3. THÂN CHÍNH ĐĨA BAY (SAUCER BODY) ================= -->
  <!-- Vành kim loại chính (Hitbox R=22) -->
  <ellipse cx="0" cy="-0.5" rx="27" ry="9" fill="url(#hullTop)" stroke="#f8fafc" stroke-width="0.8" />
  
  <!-- Rãnh năng lượng Neon viền đĩa -->
  <path d="M -26,0 C -20,6 20,6 26,0 C 20,4 -20,4 -26,0 Z" fill="#00f5d4" opacity="0.85" />

  <!-- ================= 4. PHI HÀNH GIA & BUỒNG LÁI (PILOT & COCKPIT) ================= -->
  <!-- Đáy sàn buồng lái -->
  <ellipse cx="0" cy="-6" rx="13" ry="5" fill="#0f172a" />
  
  <!-- CHÚ ALIEN BÊN TRONG -->
  <g id="alien_pilot">
    <!-- Cổ áo vũ trụ -->
    <path d="M -4,-4 Q 0,-3 4,-4 L 3,-2 L -3,-2 Z" fill="#6366f1" />
    <!-- Đầu Alien quả lê màu xanh lá -->
    <ellipse cx="0" cy="-8.5" rx="4.5" ry="5" fill="#4ade80" />
    <!-- Đôi mắt to màu đen huyền bí đặc trưng -->
    <ellipse cx="-2.2" cy="-8.5" rx="1.6" ry="2.3" fill="#0f172a" transform="rotate(-10 -2.2 -8.5)" />
    <ellipse cx="2.2" cy="-8.5" rx="1.6" ry="2.3" fill="#0f172a" transform="rotate(10 2.2 -8.5)" />
    <!-- Chấm sáng phản chiếu trong mắt Alien -->
    <circle cx="-2.5" cy="-9.2" r="0.6" fill="#ffffff" />
    <circle cx="1.9" cy="-9.2" r="0.6" fill="#ffffff" />
  </g>

  <!-- VÒM THỦY TINH BẢO VỆ (GLASS DOME) -->
  <path d="M -12,-6 C -12,-17 12,-17 12,-6 C 12,-2 -12,-2 -12,-6 Z" fill="url(#glassDome)" stroke="#bae6fd" stroke-width="0.8" />

  <!-- Vệt ánh sáng lóa trên kính vòm -->
  <path d="M -8,-14 C -4,-17 4,-17 7,-14 C 4,-15.5 -4,-15.5 -8,-14 Z" fill="#ffffff" opacity="0.8" />
  <ellipse cx="-6" cy="-10" rx="1.8" ry="3.2" fill="#ffffff" opacity="0.5" transform="rotate(-25 -6 -10)" />

  <!-- ĂNG-TEN ĐỈNH VÒM PHÁT TÍN HIỆU -->
  <line x1="0" y1="-16" x2="0" y2="-21" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" />
  <!-- Quả cầu phát sóng radar (Hồng Neon) -->
  <circle cx="0" cy="-22" r="2.8" fill="#f43f5e" />
  <circle cx="0" cy="-22" r="4.5" fill="#fb7185" opacity="0.35" />
  <circle cx="-0.8" cy="-22.8" r="0.8" fill="#ffffff" />

  <!-- ================= 5. HỆ THỐNG ĐÈN LED QUANH VÀNH ĐĨA ================= -->
  <!-- Đèn sau (nhỏ hơn, mờ hơn tạo chiều sâu không gian) -->
  <ellipse cx="-13" cy="-4" rx="1.8" ry="1.2" fill="#eab308" opacity="0.6" />
  <ellipse cx="13" cy="-4" rx="1.8" ry="1.2" fill="#ec4899" opacity="0.6" />

  <!-- Đèn trước mặt (Phát sáng rực rỡ kèm vòng hào quang) -->
  <!-- Đèn trái ngoài cùng -->
  <circle cx="-21" cy="1" r="3.2" fill="#ec4899" opacity="0.3" />
  <circle cx="-21" cy="1" r="2.2" fill="#f472b6" />
  <circle cx="-21" cy="1" r="1.1" fill="#ffffff" />

  <!-- Đèn giữa trái -->
  <circle cx="-10.5" cy="4" r="3.5" fill="#eab308" opacity="0.35" />
  <circle cx="-10.5" cy="4" r="2.4" fill="#facc15" />
  <circle cx="-10.5" cy="4" r="1.1" fill="#ffffff" />

  <!-- Đèn giữa phải -->
  <circle cx="10.5" cy="4" r="3.5" fill="#ec4899" opacity="0.35" />
  <circle cx="10.5" cy="4" r="2.4" fill="#f472b6" />
  <circle cx="10.5" cy="4" r="1.1" fill="#ffffff" />

  <!-- Đèn phải ngoài cùng -->
  <circle cx="21" cy="1" r="3.2" fill="#eab308" opacity="0.3" />
  <circle cx="21" cy="1" r="2.2" fill="#facc15" />
  <circle cx="21" cy="1" r="1.1" fill="#ffffff" />
</svg>