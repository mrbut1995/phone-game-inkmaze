<svg xmlns="http://www.w3.org/2000/svg" viewBox="-195 -6 390 36" width="390" height="36">
  <defs>
    <!-- Quầng sáng từ trường quanh dây cao thế -->
    <linearGradient id="magneticCorona" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Gradient thép xoắn của cáp chịu lực -->
    <linearGradient id="cableSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- 1. QUẦNG TỪ TRƯỜNG NĂNG LƯỢNG MỜ QUANH DÂY -->
  <path d="M -190,0 Q 0,44 190,0" fill="none" stroke="url(#magneticCorona)" stroke-width="6.0" stroke-linecap="round" />

  <!-- 2. DÂY CÁP PHỤ PHÍA TRÊN (DÂY CHỐNG SÉT QUANG) -->
  <path d="M -190,-2.5 Q 0,39 190,-2.5" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />

  <!-- 3. DÂY CÁP CHÍNH (MAIN TRANSMISSION LINE - VÕNG 22px) -->
  <!-- Lớp bóng tối phía dưới -->
  <path d="M -190,0.8 Q 0,44.8 190,0.8" fill="none" stroke="#020617" stroke-width="3.2" stroke-linecap="round" />
  <!-- Lõi cáp kim loại bện xoắn -->
  <path d="M -190,0 Q 0,44 190,0" fill="none" stroke="url(#cableSteel)" stroke-width="2.6" stroke-linecap="round" />
  <!-- Vệt kim loại phản quang tạo hiệu ứng cáp xoắn tròn -->
  <path d="M -190,-0.4 Q 0,43.6 190,-0.4" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="6,2" stroke-linecap="round" />

  <!-- 4. CÁC QUẢ TẠ / KHUNG CHỐNG RUNG (DAMPER CLIPS) TRÊN DÂY -->
  <!-- Quả tạ bên trái x = -95, y = 16.5 -->
  <g transform="translate(-95, 16.5)">
    <rect x="-1" y="-1" width="2" height="4.5" fill="#475569" />
    <ellipse cx="-3" cy="3.5" rx="2" ry="1.5" fill="#0f172a" />
    <ellipse cx="3" cy="3.5" rx="2" ry="1.5" fill="#0f172a" />
  </g>
  <!-- Khung kẹp giữ ở giữa đáy võng x = 0, y = 22 -->
  <g transform="translate(0, 22)">
    <rect x="-2" y="-2" width="4" height="4" rx="0.8" fill="#64748b" stroke="#0f172a" stroke-width="0.6" />
    <circle cx="0" cy="0" r="1.1" fill="#38bdf8" />
  </g>
  <!-- Quả tạ bên phải x = 95, y = 16.5 -->
  <g transform="translate(95, 16.5)">
    <rect x="-1" y="-1" width="2" height="4.5" fill="#475569" />
    <ellipse cx="-3" cy="3.5" rx="2" ry="1.5" fill="#0f172a" />
    <ellipse cx="3" cy="3.5" rx="2" ry="1.5" fill="#0f172a" />
  </g>

  <!-- 5. VÒNG NÉO CÁP HAI ĐẦU CỘT -->
  <circle cx="-190" cy="0" r="2.8" fill="#334155" stroke="#0f172a" stroke-width="0.8" />
  <circle cx="190" cy="0" r="2.8" fill="#334155" stroke="#0f172a" stroke-width="0.8" />
</svg>