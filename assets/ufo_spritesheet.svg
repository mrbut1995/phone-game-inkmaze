<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 84" width="480" height="84">
  <defs>
    <!-- Khung thân UFO Pro cơ sở -->
    <g id="ufo_chassis">
      <!-- Đáy -->
      <ellipse cx="0" cy="4" rx="21" ry="7" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <ellipse cx="0" cy="2.5" rx="25.5" ry="8.5" fill="#1e293b" />
      <!-- Thân kim loại bo cong -->
      <ellipse cx="0" cy="-0.5" rx="27" ry="9" fill="#94a3b8" stroke="#f8fafc" stroke-width="0.7" />
      <path d="M -26,0 C -20,5 20,5 26,0 C 20,3.5 -20,3.5 -26,0 Z" fill="#00f5d4" opacity="0.85" />
      <!-- Sàn buồng lái -->
      <ellipse cx="0" cy="-6" rx="13" ry="5" fill="#0f172a" />
      <!-- Alien -->
      <path d="M -4,-4 Q 0,-3 4,-4 L 3,-2 L -3,-2 Z" fill="#6366f1" />
      <ellipse cx="0" cy="-8.5" rx="4.5" ry="5" fill="#4ade80" />
      <ellipse cx="-2.2" cy="-8.5" rx="1.6" ry="2.2" fill="#0f172a" transform="rotate(-10 -2.2 -8.5)" />
      <ellipse cx="2.2" cy="-8.5" rx="1.6" ry="2.2" fill="#0f172a" transform="rotate(10 2.2 -8.5)" />
      <circle cx="-2.5" cy="-9.2" r="0.6" fill="#ffffff" />
      <circle cx="1.9" cy="-9.2" r="0.6" fill="#ffffff" />
      <!-- Kính buồng lái -->
      <path d="M -12,-6 C -12,-17 12,-17 12,-6 C 12,-2 -12,-2 -12,-6 Z" fill="#0284c7" fill-opacity="0.8" stroke="#bae6fd" stroke-width="0.8" />
      <path d="M -8,-14 C -4,-17 4,-17 7,-14 C 4,-15.5 -4,-15.5 -8,-14 Z" fill="#ffffff" opacity="0.8" />
      <!-- Ăng-ten -->
      <line x1="0" y1="-16" x2="0" y2="-21" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- Đèn Vàng Neon -->
    <g id="light_y">
      <circle cx="0" cy="0" r="3.2" fill="#eab308" opacity="0.4" />
      <circle cx="0" cy="0" r="2.2" fill="#facc15" />
      <circle cx="0" cy="0" r="1.0" fill="#ffffff" />
    </g>
    <!-- Đèn Hồng Neon -->
    <g id="light_p">
      <circle cx="0" cy="0" r="3.2" fill="#ec4899" opacity="0.4" />
      <circle cx="0" cy="0" r="2.2" fill="#f472b6" />
      <circle cx="0" cy="0" r="1.0" fill="#ffffff" />
    </g>

    <linearGradient id="beamA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- ==================== FRAME 0 ==================== -->
  <g id="f0" transform="translate(40, 28)">
    <polygon points="-9,6 9,6 26,48 -26,48" fill="url(#beamA)" />
    <ellipse cx="0" cy="20" rx="14" ry="3.5" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.6" />
    <ellipse cx="0" cy="35" rx="20" ry="4.5" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.4" />
    <use href="#ufo_chassis" />
    <circle cx="0" cy="-22" r="2.8" fill="#f43f5e" /><circle cx="0" cy="-22" r="4.5" fill="#fb7185" opacity="0.4" />
    <!-- Vị trí 6 đèn (0°) -->
    <use href="#light_p" x="-21" y="0.8" />
    <use href="#light_y" x="-10.5" y="4.2" />
    <use href="#light_p" x="10.5" y="4.2" />
    <use href="#light_y" x="21" y="0.8" />
    <circle cx="-11" cy="-4" r="1.5" fill="#eab308" opacity="0.5" />
    <circle cx="11" cy="-4" r="1.5" fill="#ec4899" opacity="0.5" />
  </g>

  <!-- ==================== FRAME 1 ==================== -->
  <g id="f1" transform="translate(120, 28)">
    <polygon points="-9,6 9,6 26,48 -26,48" fill="url(#beamA)" />
    <ellipse cx="0" cy="23" rx="15" ry="3.8" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.6" />
    <ellipse cx="0" cy="38" rx="21" ry="4.8" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.35" />
    <use href="#ufo_chassis" />
    <circle cx="0" cy="-22" r="2.5" fill="#f43f5e" /><circle cx="0" cy="-22" r="3.5" fill="#fb7185" opacity="0.3" />
    <!-- Vị trí 6 đèn (20°) -->
    <use href="#light_p" x="-19.5" y="-1.0" />
    <use href="#light_y" x="-14.5" y="3.2" />
    <use href="#light_p" x="4.2" y="4.8" />
    <use href="#light_y" x="20" y="2.2" />
    <circle cx="-3.5" cy="-4.5" r="1.5" fill="#eab308" opacity="0.5" />
    <circle cx="16" cy="-3.0" r="1.5" fill="#ec4899" opacity="0.5" />
  </g>

  <!-- ==================== FRAME 2 ==================== -->
  <g id="f2" transform="translate(200, 28)">
    <polygon points="-9,6 9,6 26,48 -26,48" fill="url(#beamA)" />
    <ellipse cx="0" cy="26" rx="16.5" ry="4" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.55" />
    <ellipse cx="0" cy="41" rx="22" ry="5" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.3" />
    <use href="#ufo_chassis" />
    <circle cx="0" cy="-22" r="3.0" fill="#f43f5e" /><circle cx="0" cy="-22" r="5.0" fill="#fb7185" opacity="0.5" />
    <!-- Vị trí 6 đèn (40°) -->
    <use href="#light_y" x="-17.5" y="2.0" />
    <use href="#light_p" x="-4.2" y="4.8" />
    <use href="#light_y" x="14.5" y="3.2" />
    <use href="#light_p" x="21" y="-0.8" />
    <circle cx="3.5" cy="-4.5" r="1.5" fill="#eab308" opacity="0.5" />
    <circle cx="-16" cy="-3.0" r="1.5" fill="#ec4899" opacity="0.5" />
  </g>

  <!-- ==================== FRAME 3 ==================== -->
  <g id="f3" transform="translate(280, 28)">
    <polygon points="-9,6 9,6 26,48 -26,48" fill="url(#beamA)" />
    <ellipse cx="0" cy="20" rx="14" ry="3.5" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.6" />
    <ellipse cx="0" cy="35" rx="20" ry="4.5" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.4" />
    <use href="#ufo_chassis" />
    <circle cx="0" cy="-22" r="2.8" fill="#f43f5e" /><circle cx="0" cy="-22" r="4.5" fill="#fb7185" opacity="0.4" />
    <!-- Vị trí 6 đèn (60° - đảo màu vàng/hồng) -->
    <use href="#light_y" x="-21" y="0.8" />
    <use href="#light_p" x="-10.5" y="4.2" />
    <use href="#light_y" x="10.5" y="4.2" />
    <use href="#light_p" x="21" y="0.8" />
    <circle cx="-11" cy="-4" r="1.5" fill="#ec4899" opacity="0.5" />
    <circle cx="11" cy="-4" r="1.5" fill="#eab308" opacity="0.5" />
  </g>

  <!-- ==================== FRAME 4 ==================== -->
  <g id="f4" transform="translate(360, 28)">
    <polygon points="-9,6 9,6 26,48 -26,48" fill="url(#beamA)" />
    <ellipse cx="0" cy="23" rx="15" ry="3.8" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.6" />
    <ellipse cx="0" cy="38" rx="21" ry="4.8" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.35" />
    <use href="#ufo_chassis" />
    <circle cx="0" cy="-22" r="2.5" fill="#f43f5e" /><circle cx="0" cy="-22" r="3.5" fill="#fb7185" opacity="0.3" />
    <!-- Vị trí 6 đèn (80°) -->
    <use href="#light_y" x="-19.5" y="-1.0" />
    <use href="#light_p" x="-14.5" y="3.2" />
    <use href="#light_y" x="4.2" y="4.8" />
    <use href="#light_p" x="20" y="2.2" />
    <circle cx="-3.5" cy="-4.5" r="1.5" fill="#ec4899" opacity="0.5" />
    <circle cx="16" cy="-3.0" r="1.5" fill="#eab308" opacity="0.5" />
  </g>

  <!-- ==================== FRAME 5 ==================== -->
  <g id="f5" transform="translate(440, 28)">
    <polygon points="-9,6 9,6 26,48 -26,48" fill="url(#beamA)" />
    <ellipse cx="0" cy="26" rx="16.5" ry="4" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.55" />
    <ellipse cx="0" cy="41" rx="22" ry="5" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.3" />
    <use href="#ufo_chassis" />
    <circle cx="0" cy="-22" r="3.0" fill="#f43f5e" /><circle cx="0" cy="-22" r="5.0" fill="#fb7185" opacity="0.5" />
    <!-- Vị trí 6 đèn (100°) -->
    <use href="#light_p" x="-17.5" y="2.0" />
    <use href="#light_y" x="-4.2" y="4.8" />
    <use href="#light_p" x="14.5" y="3.2" />
    <use href="#light_y" x="21" y="-0.8" />
    <circle cx="3.5" cy="-4.5" r="1.5" fill="#ec4899" opacity="0.5" />
    <circle cx="-16" cy="-3.0" r="1.5" fill="#eab308" opacity="0.5" />
  </g>
</svg>