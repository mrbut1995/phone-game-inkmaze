<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 130" width="1080" height="130">
  <defs>
    <!-- Khung nền và HUD góc cố định cho 1 ô (180x130) -->
    <g id="cell_boundary">
      <rect x="1" y="1" width="178" height="128" rx="10" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4" />
      <path d="M 5,13 L 5,5 L 13,5 M 175,13 L 175,5 L 167,5 M 5,117 L 5,125 L 13,125 M 175,117 L 175,125 L 167,125" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.7" />
      <!-- Dải gió ngang trôi nhẹ -->
      <path d="M 10,25 Q 50,18 90,26 T 170,22" fill="none" stroke="#e0f2fe" stroke-width="1.2" opacity="0.3" stroke-dasharray="8,5" />
      <path d="M 10,105 Q 90,112 170,105" fill="none" stroke="#e0f2fe" stroke-width="1.2" opacity="0.3" stroke-dasharray="10,6" />
    </g>

    <!-- Cấu trúc lốc xoáy vector động -->
    <g id="vortex_core">
      <ellipse cx="0" cy="0" rx="9" ry="5.5" fill="#38bdf8" opacity="0.35" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.85" />
      
      <!-- Dải xoáy 1 -->
      <path d="M 0,-18 C 16,-18 28,-10 28,0 C 28,9 15,16 0,16 C -12,16 -21,9 -21,1 C -21,-6 -13,-11 -2,-11 C 6,-11 12,-6 12,0 C 12,4 7,8 1,8 C -4,8 -7,5 -7,1" 
            fill="none" stroke="#e0f7ff" stroke-width="2.2" stroke-linecap="round" />
      
      <!-- Dải xoáy 2 -->
      <path d="M 0,18 C -16,18 -28,10 -28,0 C -28,-9 -15,-16 0,-16 C 12,-16 21,-9 21,-1 C 21,6 13,11 2,11 C -6,11 -12,6 -12,0 C -12,-4 -7,-8 -1,-8 C 4,-8 7,-5 7,-1" 
            fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" />

      <!-- Bụi gió bay ngoài rìa -->
      <circle cx="-15" cy="11" r="1.2" fill="#ffffff" opacity="0.8" />
      <circle cx="15" cy="-11" r="1.2" fill="#ffffff" opacity="0.8" />
    </g>
  </defs>

  <!-- ==================== FRAME 0 (Xoay 0°) ==================== -->
  <g id="frame_0" transform="translate(0, 0)">
    <use href="#cell_boundary" />
    <g transform="translate(45, 65) rotate(0)"><use href="#vortex_core" /></g>
    <g transform="translate(135, 65) rotate(0)"><use href="#vortex_core" /></g>
  </g>

  <!-- ==================== FRAME 1 (Xoay 30°) ==================== -->
  <g id="frame_1" transform="translate(180, 0)">
    <use href="#cell_boundary" />
    <g transform="translate(45, 65) rotate(30)"><use href="#vortex_core" /></g>
    <g transform="translate(135, 65) rotate(30)"><use href="#vortex_core" /></g>
  </g>

  <!-- ==================== FRAME 2 (Xoay 60°) ==================== -->
  <g id="frame_2" transform="translate(360, 0)">
    <use href="#cell_boundary" />
    <g transform="translate(45, 65) rotate(60)"><use href="#vortex_core" /></g>
    <g transform="translate(135, 65) rotate(60)"><use href="#vortex_core" /></g>
  </g>

  <!-- ==================== FRAME 3 (Xoay 90°) ==================== -->
  <g id="frame_3" transform="translate(540, 0)">
    <use href="#cell_boundary" />
    <g transform="translate(45, 65) rotate(90)"><use href="#vortex_core" /></g>
    <g transform="translate(135, 65) rotate(90)"><use href="#vortex_core" /></g>
  </g>

  <!-- ==================== FRAME 4 (Xoay 120°) ==================== -->
  <g id="frame_4" transform="translate(720, 0)">
    <use href="#cell_boundary" />
    <g transform="translate(45, 65) rotate(120)"><use href="#vortex_core" /></g>
    <g transform="translate(135, 65) rotate(120)"><use href="#vortex_core" /></g>
  </g>

  <!-- ==================== FRAME 5 (Xoay 150° - Chuẩn bị lặp mượt về 0°) ==================== -->
  <g id="frame_5" transform="translate(900, 0)">
    <use href="#cell_boundary" />
    <g transform="translate(45, 65) rotate(150)"><use href="#vortex_core" /></g>
    <g transform="translate(135, 65) rotate(150)"><use href="#vortex_core" /></g>
  </g>
</svg>