<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48" width="48" height="48">
  <defs>
    <linearGradient id="warnBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Khung quét Radar định vị mục tiêu -->
  <circle cx="0" cy="0" r="22" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8,4" />
  <circle cx="0" cy="0" r="18" fill="none" stroke="#fca5a5" stroke-width="0.8" opacity="0.4" />

  <!-- Dấu ngắm bắn 4 góc (Crosshair Brackets) -->
  <path d="M -22,-6 L -22,-22 L -6,-22 M 22,-6 L 22,-22 L 6,-22 M -22,6 L -22,22 L -6,22 M 22,6 L 22,22 L 6,22" stroke="#ef4444" stroke-width="2" fill="none" />

  <!-- Huy hiệu kim cương cảnh báo -->
  <polygon points="0,-16 16,0 0,16 -16,0" fill="url(#warnBadge)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Mũi tên cảnh báo nhọn hướng thẳng lên trời -->
  <polygon points="0,-10 -6,-1 -2,-1 -2,8 2,8 2,-1 6,-1" fill="#facc15" stroke="#78350f" stroke-width="0.8" />
</svg>