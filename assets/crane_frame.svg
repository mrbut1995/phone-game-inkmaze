<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -38 260 160" width="260" height="160">
  <defs>
    <!-- Vàng công trình Caterpillar đổ bóng kim loại -->
    <linearGradient id="craneYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Thép giàn tháp xám đen -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Khối đối trọng bê tông nặng -->
    <linearGradient id="concreteBlock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Kính buồng lái cabin -->
    <linearGradient id="cabGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- ================= 1. TRỤ THÁP THẲNG ĐỨNG (TOWER MAST: y = -20 đến 120) ================= -->
  <g id="tower_mast">
    <!-- Hai thanh giàn đứng chính -->
    <rect x="-10" y="-20" width="4" height="140" fill="url(#craneYellow)" stroke="#b45309" stroke-width="0.7" />
    <rect x="-2" y="-20" width="4" height="140" fill="url(#craneYellow)" stroke="#b45309" stroke-width="0.7" />
    <!-- Giàn thép đan chéo chữ X chịu lực bên trong trụ -->
    <g stroke="#475569" stroke-width="1.4">
      <line x1="-10" y1="-10" x2="-2" y2="10" /><line x1="-2" y1="-10" x2="-10" y2="10" />
      <line x1="-10" y1="10" x2="-2" y2="30" /><line x1="-2" y1="10" x2="-10" y2="30" />
      <line x1="-10" y1="30" x2="-2" y2="50" /><line x1="-2" y1="30" x2="-10" y2="50" />
      <line x1="-10" y1="50" x2="-2" y2="70" /><line x1="-2" y1="50" x2="-10" y2="70" />
      <line x1="-10" y1="70" x2="-2" y2="90" /><line x1="-2" y1="70" x2="-10" y2="90" />
      <line x1="-10" y1="90" x2="-2" y2="110" /><line x1="-2" y1="90" x2="-10" y2="110" />
    </g>
    <!-- Thanh ngang giằng trụ -->
    <line x1="-10" y1="-20" x2="-2" y2="-20" stroke="#b45309" stroke-width="2" />
    <line x1="-10" y1="20" x2="-2" y2="20" stroke="#b45309" stroke-width="2" />
    <line x1="-10" y1="60" x2="-2" y2="60" stroke="#b45309" stroke-width="2" />
    <line x1="-10" y1="100" x2="-2" y2="100" stroke="#b45309" stroke-width="2" />
  </g>

  <!-- ================= 2. ĐỈNH CHÓP THÁP (TOWER APEX: y = -35) ================= -->
  <polygon points="-6,-34 -12,-18 0,-18" fill="url(#craneYellow)" stroke="#b45309" stroke-width="0.8" />
  <!-- Đèn báo hiệu hàng không màu đỏ chớp đỉnh tháp -->
  <circle cx="-6" cy="-35" r="2.2" fill="#ef4444" />
  <circle cx="-6" cy="-35" r="4.0" fill="#f87171" opacity="0.4" />

  <!-- Dây cáp căng chịu lực từ đỉnh tháp ra mũi cần và đuôi cần -->
  <line x1="-6" y1="-34" x2="200" y2="0" stroke="#334155" stroke-width="1.4" opacity="0.85" />
  <line x1="-6" y1="-34" x2="-40" y2="-8" stroke="#334155" stroke-width="1.6" opacity="0.85" />

  <!-- ================= 3. CẦN CẨU ĐỐI TRỌNG PHÍA SAU (COUNTER-JIB: x = -45 đến 0) ================= -->
  <g id="counter_jib">
    <!-- Giàn cần đuôi -->
    <polygon points="0,-10 -42,-8 -42,2 0,2" fill="url(#craneYellow)" stroke="#b45309" stroke-width="0.8" />
    <!-- Khối bê tông dằn đối trọng (Counterweight) -->
    <rect x="-42" y="-6" width="24" height="15" rx="1.5" fill="url(#concreteBlock)" stroke="#1e293b" stroke-width="1" />
    <!-- Vạch sọc vàng đen cảnh báo an toàn trên đối trọng -->
    <g>
      <rect x="-42" y="5" width="24" height="4" fill="#facc15" />
      <path d="M -40,9 L -37,5 M -34,9 L -31,5 M -28,9 L -25,5 M -22,9 L -19,5" stroke="#0f172a" stroke-width="1.8" />
    </g>
  </g>

  <!-- ================= 4. CẦN CẨU NGANG CHÍNH (JIB BOOM: dài 200px) ================= -->
  <g id="main_jib">
    <!-- Dầm ray trượt chính bên dưới (Rail for Trolley) -->
    <rect x="0" y="-1.5" width="202" height="4" rx="0.5" fill="url(#craneYellow)" stroke="#b45309" stroke-width="0.8" />
    <!-- Dầm vát chéo phía trên thuôn dần về mũi -->
    <line x1="0" y1="-14" x2="200" y2="0" stroke="#d97706" stroke-width="3" stroke-linecap="round" />

    <!-- Hệ thống giàn thép tam giác đan chéo (Truss Webbing) dọc 200px -->
    <g stroke="#334155" stroke-width="1.2">
      <!-- Đan chéo từng khoang 25px -->
      <line x1="0" y1="0" x2="25" y2="-12" /><line x1="25" y1="0" x2="25" y2="-12" />
      <line x1="25" y1="0" x2="50" y2="-10.5" /><line x1="50" y1="0" x2="50" y2="-10.5" />
      <line x1="50" y1="0" x2="75" y2="-9" /><line x1="75" y1="0" x2="75" y2="-9" />
      <line x1="75" y1="0" x2="100" y2="-7.5" /><line x1="100" y1="0" x2="100" y2="-7.5" />
      <line x1="100" y1="0" x2="125" y2="-6" /><line x1="125" y1="0" x2="125" y2="-6" />
      <line x1="125" y1="0" x2="150" y2="-4.5" /><line x1="150" y1="0" x2="150" y2="-4.5" />
      <line x1="150" y1="0" x2="175" y2="-3" /><line x1="175" y1="0" x2="175" y2="-3" />
      <line x1="175" y1="0" x2="200" y2="0" />
    </g>

    <!-- Điểm gắn puly dẫn hướng ở đầu chóp cần cẩu x = 200 -->
    <circle cx="200" cy="0" r="2.5" fill="#475569" />
  </g>

  <!-- ================= 5. BUỒNG LÁI CABIN TRÊN CAO (OPERATOR CAB) ================= -->
  <g id="cabin" transform="translate(4, -8)">
    <rect x="0" y="0" width="13" height="15" rx="1.5" fill="#f8fafc" stroke="#334155" stroke-width="0.8" />
    <!-- Kính cabin quan sát vát chéo -->
    <path d="M 2,2 L 9,2 L 11,8 L 11,13 L 2,13 Z" fill="url(#cabGlass)" stroke="#0284c7" stroke-width="0.5" />
    <path d="M 4,4 L 8,4 L 9,8" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.8" />
    <!-- Sàn thao tác cabin -->
    <rect x="-2" y="15" width="17" height="2" fill="#334155" />
  </g>
</svg>