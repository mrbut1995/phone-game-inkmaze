<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 64" width="384" height="64">
  <defs>
    <!-- Quầng mờ cơ bản -->
    <radialGradient id="spkHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00f5d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- ==================== FRAME 0: ĐIỂM CHẠM TÍCH ĐIỆN ==================== -->
  <g id="f0" transform="translate(32, 32)">
    <circle cx="0" cy="0" r="9" fill="url(#spkHalo)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <path d="M -8,0 L -3,-3 L 3,2 L 8,-1" fill="none" stroke="#00f5d4" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="4" cy="-7" r="0.9" fill="#ffffff" />
  </g>

  <!-- ==================== FRAME 1: PHÓNG TIA SÉT ĐẦU TIÊN ==================== -->
  <g id="f1" transform="translate(96, 32)">
    <circle cx="0" cy="0" r="16" fill="url(#spkHalo)" />
    <path d="M -16,1 L -9,-4 L -2,3 L 6,-3 L 15,2" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -16,1 L -9,-4 L -2,3 L 6,-3 L 15,2" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <path d="M -2,3 L 3,11 L 8,14" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="-10" cy="-11" r="1.2" fill="#ffffff" />
    <circle cx="12" cy="9" r="1.1" fill="#00f5d4" />
  </g>

  <!-- ==================== FRAME 2: NỔ HỒ QUANG CỰC ĐẠI (PEAK DISCHARGE) ==================== -->
  <g id="f2" transform="translate(160, 32)">
    <circle cx="0" cy="0" r="24" fill="url(#spkHalo)" />
    <!-- Nhánh chính -->
    <path d="M -24,2 L -14,-5 L -5,4 L 2,-3 L 10,5 L 18,-4 L 25,1" fill="none" stroke="#00f5d4" stroke-width="3.5" stroke-linecap="round" />
    <path d="M -24,2 L -14,-5 L -5,4 L 2,-3 L 10,5 L 18,-4 L 25,1" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- Nhánh vọt lên -->
    <path d="M -5,4 L -8,-13 L -4,-19" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
    <!-- Nhánh phụ phóng xuống -->
    <path d="M 2,-3 L 8,12 L 14,18" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" />
    <!-- Tàn lửa văng mạnh -->
    <circle cx="-16" cy="14" r="1.4" fill="#ffffff" />
    <circle cx="18" cy="-14" r="1.4" fill="#ffffff" />
    <circle cx="0" cy="20" r="1.1" fill="#00f5d4" />
  </g>

  <!-- ==================== FRAME 3: ĐỨT ĐOẠN & PHÂN TÁN ==================== -->
  <g id="f3" transform="translate(224, 32)">
    <circle cx="0" cy="0" r="18" fill="url(#spkHalo)" opacity="0.8" />
    <path d="M -20,-1 L -12,4 L -3,-2 L 7,3 L 14,-3 L 22,2" fill="none" stroke="#00f5d4" stroke-width="2.6" stroke-linecap="round" />
    <path d="M -20,-1 L -12,4 L -3,-2 L 7,3 L 14,-3 L 22,2" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 7,3 L 12,-11 L 18,-15" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="-14" cy="-12" r="1.2" fill="#00f5d4" />
    <circle cx="15" cy="15" r="1.3" fill="#ffffff" />
    <circle cx="-6" cy="17" r="1.0" fill="#a7f3d0" />
  </g>

  <!-- ==================== FRAME 4: TÀN LỬA RƠI & TIA YẾU ==================== -->
  <g id="f4" transform="translate(288, 32)">
    <circle cx="0" cy="0" r="11" fill="url(#spkHalo)" opacity="0.5" />
    <path d="M -12,-2 L -5,2 L 4,-3 L 11,1" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" />
    <path d="M -12,-2 L -5,2 L 4,-3 L 11,1" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" />
    <circle cx="-18" cy="8" r="1.2" fill="#00f5d4" />
    <circle cx="17" cy="-7" r="1.1" fill="#00f5d4" />
    <circle cx="6" cy="13" r="1.0" fill="#a7f3d0" />
  </g>

  <!-- ==================== FRAME 5: TẮT DẦN (CHỈ CÒN KHÓI PLASMA) ==================== -->
  <g id="f5" transform="translate(352, 32)">
    <circle cx="0" cy="0" r="5" fill="#38bdf8" opacity="0.3" />
    <circle cx="-8" cy="4" r="0.9" fill="#00f5d4" opacity="0.6" />
    <circle cx="10" cy="-3" r="0.8" fill="#ffffff" opacity="0.7" />
  </g>
</svg>