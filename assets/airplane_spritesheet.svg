<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 44" width="288" height="44">
  <defs>
    <!-- Thân máy bay cơ sở -->
    <g id="plane_chassis">
      <polygon points="4,2 1,18 -8,16 -2,2" fill="#991b1b" />
      <polygon points="-18,-4 -28,-16 -22,-16 -12,-4" fill="#b91c1c" />
      <polygon points="-19,-5 -27,-15 -24,-15 -14,-5" fill="#ef4444" />
      <path d="M 30,0 C 24,-5 14,-6 -22,-5 L -26,-2 L -26,2 L -22,5 C 14,6 24,5 30,0 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.8" />
      <path d="M 22,0 L -22,0 L -24,2 L 20,2 Z" fill="#ffffff" />
      <path d="M 12,-4 C 18,-4 22,-2 23,0 L 12,0 Z" fill="#0284c7" stroke="#bae6fd" stroke-width="0.8" />
      <polygon points="6,-2 3,-18 -6,-16 0,-2" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.8" />
    </g>

    <linearGradient id="fireJet" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#ff3300" opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- FRAME 0: ĐÈN BẬT SÁNG, LỬA DÀI -->
  <g id="f0" transform="translate(36, 22)">
    <path d="M -26,0 Q -38,-5 -48,0 Q -38,5 -26,0 Z" fill="url(#fireJet)" />
    <ellipse cx="-32" cy="0" rx="4" ry="1.5" fill="#ffffff" />
    <use href="#plane_chassis" />
    <!-- Đèn cánh BẬT -->
    <circle cx="3" cy="-18" r="2.8" fill="#22c55e" /><circle cx="3" cy="-18" r="4.5" fill="#4ade80" opacity="0.4" />
    <circle cx="1" cy="18" r="2.8" fill="#ef4444" /><circle cx="1" cy="18" r="4.5" fill="#f87171" opacity="0.4" />
  </g>

  <!-- FRAME 1: ĐÈN BẬT, LỬA CO NHẸ -->
  <g id="f1" transform="translate(108, 22)">
    <path d="M -26,0 Q -35,-4 -44,0 Q -35,4 -26,0 Z" fill="url(#fireJet)" />
    <ellipse cx="-30" cy="0" rx="3.5" ry="1.3" fill="#ffffff" />
    <use href="#plane_chassis" />
    <circle cx="3" cy="-18" r="2.5" fill="#22c55e" />
    <circle cx="1" cy="18" r="2.5" fill="#ef4444" />
  </g>

  <!-- FRAME 2: ĐÈN TẮT (BLINK OFF), LỬA PHỒNG -->
  <g id="f2" transform="translate(180, 22)">
    <path d="M -26,0 Q -39,-5.5 -50,0 Q -39,5.5 -26,0 Z" fill="url(#fireJet)" />
    <ellipse cx="-33" cy="0" rx="4.2" ry="1.6" fill="#ffffff" />
    <use href="#plane_chassis" />
    <!-- Đèn cánh TẮT (mờ) -->
    <circle cx="3" cy="-18" r="1.8" fill="#14532d" opacity="0.7" />
    <circle cx="1" cy="18" r="1.8" fill="#7f1d1d" opacity="0.7" />
  </g>

  <!-- FRAME 3: ĐÈN TẮT, LỬA VỪA -->
  <g id="f3" transform="translate(252, 22)">
    <path d="M -26,0 Q -36,-4 -45,0 Q -36,4 -26,0 Z" fill="url(#fireJet)" />
    <ellipse cx="-31" cy="0" rx="3.5" ry="1.4" fill="#ffffff" />
    <use href="#plane_chassis" />
    <circle cx="3" cy="-18" r="1.8" fill="#14532d" opacity="0.7" />
    <circle cx="1" cy="18" r="1.8" fill="#7f1d1d" opacity="0.7" />
  </g>
</svg>