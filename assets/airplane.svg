<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -22 72 44" width="72" height="44">
  <defs>
    <!-- Gradient thân đỏ thể thao bóng bẩy -->
    <linearGradient id="planeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="30%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Gradient kính buồng lái phản quang -->
    <linearGradient id="cockpitGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gradient lửa phản lực đuôi -->
    <linearGradient id="jetPlume" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f5d4" />
      <stop offset="70%" stop-color="#ff9900" opacity="0.8" />
      <stop offset="100%" stop-color="#ff0055" opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- 1. LỬA PHẢN LỰC ĐUÔI (JET AFTERBURNER) -->
  <path d="M -26,0 Q -38,-5 -48,0 Q -38,5 -26,0 Z" fill="url(#jetPlume)" />
  <ellipse cx="-32" cy="0" rx="4" ry="1.5" fill="#ffffff" />

  <!-- 2. CÁNH DƯỚI (LOWER WING) -->
  <polygon points="4,2 1,18 -8,16 -2,2" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.7" />
  <!-- Đèn chóp cánh dưới (Đỏ) -->
  <circle cx="1" cy="18" r="2.5" fill="#ef4444" />
  <circle cx="1" cy="18" r="4.0" fill="#f87171" opacity="0.4" />
  <circle cx="0.5" cy="17.5" r="0.8" fill="#ffffff" />

  <!-- 3. ĐUÔI ĐỨNG MÁY BAY (VERTICAL STABILIZER) -->
  <polygon points="-18,-4 -28,-16 -22,-16 -12,-4" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.8" />
  <polygon points="-19,-5 -27,-15 -24,-15 -14,-5" fill="#ef4444" />

  <!-- 4. THÂN CHÍNH MÁY BAY (FUSELAGE) -->
  <path d="M 30,0 C 24,-5 14,-6 -22,-5 L -26,-2 L -26,2 L -22,5 C 14,6 24,5 30,0 Z" 
        fill="url(#planeRed)" stroke="#7f1d1d" stroke-width="0.8" />

  <!-- Sọc trắng trang trí thể thao khí động học -->
  <path d="M 22,0 L -22,0 L -24,2 L 20,2 Z" fill="#ffffff" opacity="0.95" />

  <!-- 5. KÍNH BUỒNG LÁI (COCKPIT CANOPY) -->
  <path d="M 12,-4 C 18,-4 22,-2 23,0 L 12,0 Z" fill="url(#cockpitGlass)" stroke="#bae6fd" stroke-width="0.8" />
  <!-- Vệt sáng lóa trên kính -->
  <path d="M 15,-3 Q 19,-2 20,-1" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" />

  <!-- 6. CÁNH TRÊN (UPPER WING) -->
  <polygon points="6,-2 3,-18 -6,-16 0,-2" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.8" />
  <polygon points="5,-3 2.5,-16.5 -4.5,-15 0.5,-3" fill="#ef4444" />
  <!-- Đèn chóp cánh trên (Xanh lục) -->
  <circle cx="3" cy="-18" r="2.5" fill="#22c55e" />
  <circle cx="3" cy="-18" r="4.0" fill="#4ade80" opacity="0.4" />
  <circle cx="2.5" cy="-18.5" r="0.8" fill="#ffffff" />
</svg>