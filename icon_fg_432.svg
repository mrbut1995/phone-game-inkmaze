<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <filter id="pencilShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1E2830" flood-opacity="0.35"/>
    </filter>
    <filter id="cardBoardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2D2115" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Đưa nội dung vào tâm 216,216 với tỉ lệ an toàn -->
  <g transform="translate(216, 216) scale(2.25) translate(-64, -64)">
    <!-- Bàn cờ 3x3 -->
    <g filter="url(#cardBoardShadow)">
      <rect x="21" y="21" width="86" height="86" rx="18" fill="#FFFDF8" stroke="#3D779B" stroke-width="2.5"/>
      <g stroke="#8FB9D2" stroke-width="1.6" opacity="0.65">
        <line x1="49.6" y1="21" x2="49.6" y2="107"/>
        <line x1="78.3" y1="21" x2="78.3" y2="107"/>
        <line x1="21" y1="49.6" x2="107" y2="49.6"/>
        <line x1="21" y1="78.3" x2="107" y2="78.3"/>
      </g>
    </g>

    <!-- Số trong ô -->
    <g font-family="'Segoe UI', Roboto, sans-serif" font-weight="950" text-anchor="middle" dominant-baseline="central" fill="#1E3F57">
      <text x="35.5" y="35.5" font-size="25">1</text>
      <text x="64" y="35.5" font-size="25">2</text>
      <text x="35.5" y="64" font-size="25">3</text>
      <text x="92.5" y="92.5" font-size="25" fill="#D84444">4</text>
    </g>

    <!-- Mũi tên mê cung -->
    <g stroke="#1D4B6E" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 64 L 35.5 64 L 35.5 92.5 L 64 92.5 L 64 64 L 102 64 L 115 64" fill="none" stroke-width="4.5"/>
      <polygon points="112,57 123,64 112,71" fill="#1D4B6E" stroke="none"/>
    </g>
    <path d="M 12 64 L 35.5 64 L 35.5 92.5 L 64 92.5 L 64 64 L 102 64" fill="none" stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bút chì vàng -->
    <g transform="translate(64, 26) rotate(-45)" filter="url(#pencilShadow)">
      <rect x="-8" y="-36" width="16" height="34" rx="2.5" fill="#F59E0B"/>
      <rect x="-2.5" y="-36" width="5" height="34" fill="#D97706"/>
      <polygon points="-8,-2 8,-2 0,12" fill="#FDE68A"/>
      <polygon points="-3,7 3,7 0,12" fill="#1E283A"/>
    </g>
  </g>
</svg>