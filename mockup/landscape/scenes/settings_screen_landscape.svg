<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="settingsBgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.55"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.18"/>
    </pattern>

    <filter id="settingsSheetShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2D2115" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2D2115" flood-opacity="0.10"/>
    </filter>

    <filter id="clipShadowSettings" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.25"/>
    </filter>

    <filter id="thumbShadowSettings" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.2"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#FAF5EB"/>
  <rect width="1920" height="1080" fill="url(#settingsBgGrid)"/>
  <line x1="80" y1="0" x2="80" y2="1080" stroke="#D84444" stroke-width="3" opacity="0.85"/>

  <!-- ================= TỜ GIẤY CÀI ĐẶT NGANG (1820 x 980 px) ================= -->
  <g transform="translate(50, 50)">
    <g filter="url(#settingsSheetShadow)">
      <rect width="1820" height="980" rx="28" fill="#FFFDF8"/>

      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="80" r="9"/><circle cx="28" cy="200" r="9"/><circle cx="28" cy="320" r="9"/>
        <circle cx="28" cy="440" r="9"/><circle cx="28" cy="560" r="9"/><circle cx="28" cy="680" r="9"/>
        <circle cx="28" cy="800" r="9"/><circle cx="28" cy="920" r="9"/>
      </g>

      <g stroke="#8FB9D2" stroke-width="1" opacity="0.28">
        <line x1="88" y1="100" x2="1760" y2="100"/><line x1="88" y1="200" x2="1760" y2="200"/>
        <line x1="88" y1="300" x2="1760" y2="300"/><line x1="88" y1="400" x2="1760" y2="400"/>
        <line x1="88" y1="500" x2="1760" y2="500"/><line x1="88" y1="600" x2="1760" y2="600"/>
        <line x1="88" y1="700" x2="1760" y2="700"/><line x1="88" y1="800" x2="1760" y2="800"/>
        <line x1="88" y1="900" x2="1760" y2="900"/>
      </g>

      <line x1="88" y1="0" x2="88" y2="980" stroke="#D84444" stroke-width="2.5" opacity="0.85"/>
      <rect width="1820" height="980" rx="28" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    </g>

    <g transform="translate(800, -22)">
      <rect width="220" height="48" rx="4" fill="#E8DFCA" fill-opacity="0.85" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" 
            stroke="#B5A98F" stroke-width="1.2" opacity="0.35"/>
    </g>
    <g transform="translate(130, -18)" filter="url(#clipShadowSettings)">
      <path d="M 0 50 L 0 12 A 12 12 0 0 1 24 12 L 24 60 A 18 18 0 0 1 -12 60 L -12 18" fill="none" stroke="#7A8F9B" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Header Back & Tiêu đề -->
    <g transform="translate(80, 75)">
      <g filter="url(#uiShadow)" style="cursor: pointer;">
        <rect width="75" height="75" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
        <path d="M45 25 L27 37 L45 50" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <text x="870" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="40" font-weight="950" fill="#224C6D">CÀI ĐẶT HỆ THỐNG</text>
    </g>

    <!-- ================= CỘT TRÁI (W: 840px, x: 80): ÂM THANH & ĐIỀU KHIỂN ================= -->
    <!-- MỤC 1: ÂM THANH -->
    <g transform="translate(80, 170)">
      <rect width="140" height="30" rx="6" fill="#F4EFE6" stroke="#D1E2ED" stroke-width="1.2"/>
      <text x="70" y="20" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#3D83AE" letter-spacing="1.5">ÂM THANH</text>

      <!-- Nhạc nền BGM -->
      <g transform="translate(0, 50)">
        <text x="0" y="24" font-family="sans-serif" font-size="22" font-weight="800" fill="#224C6D">🎵 Nhạc nền (BGM)</text>
        <g transform="translate(240, 16)">
          <rect width="450" height="14" rx="7" fill="#EAE4D5" stroke="#90BBD4" stroke-width="1"/>
          <rect width="315" height="14" rx="7" fill="#3D83AE"/>
          <g transform="translate(315, 7)" filter="url(#thumbShadowSettings)" style="cursor: pointer;">
            <circle cx="0" cy="0" r="15" fill="#FAF5EB" stroke="#3D83AE" stroke-width="2.5"/>
            <circle cx="0" cy="0" r="4.5" fill="#D84444"/>
          </g>
        </g>
        <text x="760" y="26" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#3D83AE">70%</text>
      </g>

      <!-- Hiệu ứng SFX -->
      <g transform="translate(0, 120)">
        <text x="0" y="24" font-family="sans-serif" font-size="22" font-weight="800" fill="#224C6D">🔔 Hiệu ứng (SFX)</text>
        <g transform="translate(240, 16)">
          <rect width="450" height="14" rx="7" fill="#EAE4D5" stroke="#90BBD4" stroke-width="1"/>
          <rect width="382" height="14" rx="7" fill="#3D83AE"/>
          <g transform="translate(382, 7)" filter="url(#thumbShadowSettings)" style="cursor: pointer;">
            <circle cx="0" cy="0" r="15" fill="#FAF5EB" stroke="#3D83AE" stroke-width="2.5"/>
            <circle cx="0" cy="0" r="4.5" fill="#D84444"/>
          </g>
        </g>
        <text x="760" y="26" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#3D83AE">85%</text>
      </g>
    </g>

    <line x1="80" y1="350" x2="860" y2="350" stroke="#8FB9D2" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- MỤC 2: BÀN CỜ & ĐIỀU KHIỂN -->
    <g transform="translate(80, 375)">
      <rect width="220" height="30" rx="6" fill="#F4EFE6" stroke="#D1E2ED" stroke-width="1.2"/>
      <text x="110" y="20" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#3D83AE" letter-spacing="1.5">BÀN CỜ &amp; ĐIỀU KHIỂN</text>

      <!-- Tùy chọn 1: Rung haptic -->
      <g transform="translate(0, 48)" style="cursor: pointer;">
        <rect width="40" height="40" rx="8" fill="#FAF5EB" stroke="#3D83AE" stroke-width="2.2"/>
        <path d="M 8 20 L 16 28 L 32 12" fill="none" stroke="#D84444" stroke-width="3.5" stroke-linecap="round"/>
        <text x="56" y="26" font-family="sans-serif" font-size="22" font-weight="800" fill="#224C6D">Rung xúc giác khi đâm tường (Haptic)</text>
        <text x="56" y="52" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Rung phản hồi cảnh báo khi bước vào tường ẩn</text>
      </g>

      <!-- Tùy chọn 2: Tự gạch cạnh an toàn -->
      <g transform="translate(0, 130)" style="cursor: pointer;">
        <rect width="40" height="40" rx="8" fill="#FAF5EB" stroke="#3D83AE" stroke-width="2.2"/>
        <path d="M 8 20 L 16 28 L 32 12" fill="none" stroke="#D84444" stroke-width="3.5" stroke-linecap="round"/>
        <text x="56" y="26" font-family="sans-serif" font-size="22" font-weight="800" fill="#224C6D">Tự động gạch cạnh an toàn</text>
        <text x="56" y="52" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Hỗ trợ tự loại trừ cạnh khi ô có số 0</text>
      </g>

      <!-- Tùy chọn 3: Vệt dạ quang -->
      <g transform="translate(0, 212)" style="cursor: pointer;">
        <rect width="40" height="40" rx="8" fill="#FAF5EB" stroke="#3D83AE" stroke-width="2.2"/>
        <path d="M 8 20 L 16 28 L 32 12" fill="none" stroke="#D84444" stroke-width="3.5" stroke-linecap="round"/>
        <text x="56" y="26" font-family="sans-serif" font-size="22" font-weight="800" fill="#224C6D">Hiển thị vệt dạ quang phát sáng</text>
        <text x="56" y="52" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Làm nổi bật vệt đường đi đã vẽ từ điểm S</text>
      </g>
    </g>

    <!-- Vạch phân tách 2 cột dọc giữa tờ giấy -->
    <line x1="910" y1="160" x2="910" y2="880" stroke="#8FB9D2" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>

    <!-- ================= CỘT PHẢI (W: 840px, x: 960): NGÔN NGỮ & THAO TÁC ================= -->
    <!-- MỤC 3: NGÔN NGỮ & ĐỒNG BỘ -->
    <g transform="translate(960, 170)">
      <rect width="200" height="30" rx="6" fill="#F4EFE6" stroke="#D1E2ED" stroke-width="1.2"/>
      <text x="100" y="20" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#3D83AE" letter-spacing="1.5">NGÔN NGỮ &amp; LƯU TRỮ</text>

      <!-- Dropdown chọn ngôn ngữ -->
      <g transform="translate(0, 48)">
        <text x="0" y="24" font-family="sans-serif" font-size="22" font-weight="800" fill="#224C6D">🌐 Ngôn ngữ hiển thị</text>
        <g transform="translate(420, 0)" style="cursor: pointer;">
          <rect width="360" height="54" rx="14" fill="#FEFDFA" stroke="#3D83AE" stroke-width="2.5"/>
          <text x="25" y="34" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#224C6D">Tiếng Việt (VN)</text>
          <path d="M 315 22 L 325 32 L 335 22" fill="none" stroke="#3D83AE" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Cloud Sync -->
      <g transform="translate(0, 125)">
        <text x="0" y="24" font-family="sans-serif" font-size="22" font-weight="800" fill="#224C6D">☁️ Lưu trữ đám mây</text>
        <text x="0" y="52" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Google Play Games • Đồng bộ dữ liệu</text>
        <g transform="translate(600, 10)">
          <rect width="180" height="42" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8"/>
          <text x="90" y="27" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#2E7D32">ĐÃ KẾT NỐI ✔</text>
        </g>
      </g>

      <!-- Mã Player ID -->
      <g transform="translate(0, 205)">
        <text x="0" y="24" font-family="sans-serif" font-size="20" font-weight="700" fill="#718B9E">Mã người chơi (Player ID):</text>
        <text x="780" y="24" text-anchor="end" font-family="'Courier New', monospace" font-size="20" font-weight="800" fill="#3D83AE">#NM-8924-VN</text>
      </g>
    </g>

    <line x1="960" y1="420" x2="1740" y2="420" stroke="#8FB9D2" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- MỤC 4: HỖ TRỢ & NÚT THAO TÁC -->
    <g transform="translate(960, 440)">
      <!-- Xem lại hướng dẫn -->
      <g transform="translate(0, 0)" filter="url(#uiShadow)" style="cursor: pointer;">
        <rect width="780" height="85" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
        <text x="45" y="50" font-size="28">📖</text>
        <text x="95" y="51" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#224C6D">Xem lại hướng dẫn &amp; 9 bộ luật chơi</text>
        <text x="740" y="51" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="900" fill="#3D83AE">›</text>
      </g>

      <!-- Khôi phục mặc định -->
      <g transform="translate(0, 110)" filter="url(#uiShadow)" style="cursor: pointer;">
        <rect width="780" height="85" rx="18" fill="#FEFDFA" stroke="#D84444" stroke-width="2.2"/>
        <text x="45" y="50" font-size="28">⟲</text>
        <text x="95" y="51" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#D84444">Khôi phục cài đặt mặc định</text>
        <text x="740" y="51" text-anchor="end" font-family="sans-serif" font-size="24" font-weight="900" fill="#D84444">›</text>
      </g>
    </g>

    <!-- Footer Phiên Bản -->
    <g transform="translate(960, 720)">
      <text x="0" y="30" font-family="sans-serif" font-size="18" font-style="italic" font-weight="600" fill="#718B9E">
        ~ Number Maze: Logic Puzzle &amp; Hidden Walls ~
      </text>
      <g transform="translate(620, 0) rotate(-6)">
        <rect width="160" height="50" rx="8" fill="#D84444" fill-opacity="0.08" stroke="#D84444" stroke-width="2.5" stroke-dasharray="6 3"/>
        <text x="80" y="33" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#D84444">VER 1.0.0</text>
      </g>
    </g>
  </g>

  <rect x="840" y="1062" width="240" height="6" rx="3" fill="#1E2830" opacity="0.3"/>
</svg>