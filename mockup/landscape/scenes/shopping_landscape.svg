<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="notebookGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.2"/>
    </pattern>

    <filter id="cardShadow" x="-10%" y="-15%" width="125%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E1610" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E1610" flood-opacity="0.08"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <!-- Đồng xu vàng -->
    <g id="coin-icon">
      <circle cx="16" cy="16" r="15" fill="#FBBF24" stroke="#D97706" stroke-width="2.5"/>
      <circle cx="16" cy="16" r="11" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="16" y="21" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="950" fill="#78350F">C</text>
    </g>

    <!-- Nét bút doodle thử nghiệm phát sáng trên bàn nháp -->
    <filter id="inkGlowShop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#FAF5EB"/>
  <rect width="1920" height="1080" fill="url(#notebookGrid)"/>
  <line x1="80" y1="0" x2="80" y2="1080" stroke="#D84444" stroke-width="3" opacity="0.85"/>

  <!-- ================= CỘT TRÁI (W: 680px, x: 60): BÀN NHÁP THỬ BÚT & QUẢNG CÁO ================= -->
  <!-- 1. Header & Ví Xu -->
  <g transform="translate(60, 50)">
    <g filter="url(#uiShadow)" style="cursor: pointer;">
      <rect width="75" height="75" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <path d="M45 25 L27 37 L45 50" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <g transform="translate(95, 0)" filter="url(#uiShadow)">
      <rect width="280" height="75" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <text x="140" y="48" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#163A58">CỬA HÀNG</text>
    </g>

    <g transform="translate(390, 0)" filter="url(#uiShadow)">
      <rect width="290" height="75" rx="20" fill="#FEFDFA" stroke="#F59E0B" stroke-width="3"/>
      <line x1="18" y1="0" x2="18" y2="75" stroke="#F59E0B" stroke-width="2.5"/>
      <g transform="translate(30, 22)"><use href="#coin-icon"/></g>
      <text x="160" y="48" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="34" font-weight="950" fill="#B45309">1,250</text>
      <circle cx="245" cy="38" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
      <text x="245" y="44" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#B45309">+</text>
    </g>
  </g>

  <!-- 2. Bàn Nháp Thử Bút Tương Tác (680 x 540 px tại y: 150) -->
  <g transform="translate(60, 150)" filter="url(#cardShadow)">
    <rect width="680" height="540" rx="26" fill="#FFFDF8" stroke="#3D83AE" stroke-width="3"/>
    <line x1="24" y1="0" x2="24" y2="540" stroke="#D84444" stroke-width="3"/>

    <!-- Tiêu đề Bàn Nháp -->
    <g transform="translate(45, 25)">
      <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="950" fill="#224C6D">📝 BÀN NHÁP THỬ BÚT</text>
      <text x="0" y="44" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Vẽ thử ngón tay để cảm nhận vệt mực &amp; hiệu ứng phát sáng</text>
    </g>

    <!-- Vùng vẽ nét thử nghiệm tự do -->
    <g transform="translate(50, 90)">
      <rect width="580" height="240" rx="18" fill="#F4F8FA" stroke="#D1E2ED" stroke-width="1.5"/>
      <!-- Nét vẽ thử màu tím hoa cà -->
      <path d="M 40 180 Q 120 40 220 140 T 400 80 T 540 160" fill="none" stroke="#7C3AED" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#inkGlowShop)"/>
      <path d="M 40 180 Q 120 40 220 140 T 400 80 T 540 160" fill="none" stroke="#E9D5FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="290" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" font-style="italic" fill="#9CA3AF">~ Nét mực tím hoa cà mịn màng, không đứt đoạn ~</text>
    </g>

    <!-- Thẻ Xem Trước Sản Phẩm Đang Chọn -->
    <g transform="translate(50, 360)">
      <rect width="580" height="150" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.2"/>
      <g transform="translate(25, 22)">
        <circle cx="50" cy="50" r="38" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
        <text x="50" y="58" text-anchor="middle" font-size="34">✒️</text>

        <g transform="translate(115, 20)">
          <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="950" fill="#224C6D">Mực Tím Hoa Cà</text>
          <text x="0" y="44" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Vệt mực thơ mộng của tuổi học trò</text>
        </g>

        <!-- Nút Dùng Thử -->
        <g transform="translate(400, 25)" style="cursor: pointer;">
          <rect width="130" height="52" rx="14" fill="#3D83AE" stroke="#256286" stroke-width="2"/>
          <text x="65" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">DÙNG THỬ ✓</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 3. Banner Quảng Cáo Tiếp Sức (680 x 180 px tại y: 720) -->
  <g transform="translate(60, 720)" filter="url(#uiShadow)">
    <rect width="680" height="180" rx="24" fill="#FEFDFA" stroke="#D84444" stroke-width="3"/>
    <line x1="24" y1="0" x2="24" y2="180" stroke="#D84444" stroke-width="3"/>

    <g transform="translate(45, 30)">
      <rect width="60" height="60" rx="14" fill="#FEE2E2" stroke="#D84444" stroke-width="2"/>
      <text x="30" y="42" text-anchor="middle" font-size="32">🎁</text>

      <g transform="translate(85, 10)">
        <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="950" fill="#163A58">GÓC TIẾP SỨC HỌC TẬP</text>
        <text x="0" y="46" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Xem bài giảng ngắn nhận ngay 50 Xu Mực</text>
      </g>

      <!-- Nút nhận xu -->
      <g transform="translate(430, 45)" style="cursor: pointer;">
        <rect width="165" height="56" rx="16" fill="#D84444" stroke="#991B1B" stroke-width="2.5"/>
        <text x="82" y="35" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">+50 XU ▶</text>
      </g>
    </g>
  </g>

  <!-- ================= CỘT PHẢI (W: 1100px, x: 780): TABS & LƯỚI SẢN PHẨM ================= -->
  <!-- 4 Tabs Danh Mục -->
  <g transform="translate(780, 50)">
    <!-- Tab 1: BÚT & MỰC (ACTIVE) -->
    <g transform="translate(0, 0)" style="cursor: pointer;">
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 234 0 A 16 16 0 0 1 250 16 L 250 60 L 0 60 Z" fill="#3D83AE" stroke="#235A7D" stroke-width="3"/>
      <text x="125" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="950" fill="#FFFFFF">✒️ BÚT &amp; MỰC</text>
    </g>
    <!-- Tab 2: GIẤY VỞ -->
    <g transform="translate(265, 5)" style="cursor: pointer;">
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 234 0 A 16 16 0 0 1 250 16 L 250 55 L 0 55 Z" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
      <text x="125" y="35" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#224C6D">📜 GIẤY VỞ</text>
    </g>
    <!-- Tab 3: DỤNG CỤ -->
    <g transform="translate(530, 5)" style="cursor: pointer;">
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 234 0 A 16 16 0 0 1 250 16 L 250 55 L 0 55 Z" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
      <text x="125" y="35" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#224C6D">🎒 DỤNG CỤ</text>
    </g>
    <!-- Tab 4: NẠP XU -->
    <g transform="translate(795, 5)" style="cursor: pointer;">
      <path d="M 0 16 A 16 16 0 0 1 16 0 L 234 0 A 16 16 0 0 1 250 16 L 250 55 L 0 55 Z" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
      <text x="125" y="35" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#224C6D">🪙 NẠP XU</text>
    </g>
  </g>

  <!-- LƯỚI 3 CỘT x 2 HÀNG (6 THẺ SẢN PHẨM, mỗi thẻ: 340 x 360 px) -->
  <!-- ===== HÀNG 1 ===== -->
  <!-- Thẻ 1: Mực Xanh Học Trò (Đang dùng) -->
  <g transform="translate(780, 150)" filter="url(#cardShadow)">
    <rect width="340" height="360" rx="22" fill="#FEFDFA" stroke="#10B981" stroke-width="3"/>
    <circle cx="170" cy="120" r="60" fill="#E8F5E9" stroke="#10B981" stroke-width="2"/>
    <text x="170" y="135" text-anchor="middle" font-size="54">🖋️</text>

    <text x="170" y="235" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#224C6D">Mực Xanh Học Trò</text>
    <text x="170" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Vệt mực truyền thống</text>

    <!-- Nút Đang Dùng -->
    <g transform="translate(70, 290)">
      <rect width="200" height="46" rx="14" fill="#065F46"/>
      <text x="100" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="950" fill="#FFFFFF">✓ ĐANG DÙNG</text>
    </g>
  </g>

  <!-- Thẻ 2: Mực Tím Hoa Cà (Sử dụng) -->
  <g transform="translate(1145, 150)" filter="url(#cardShadow)">
    <rect width="340" height="360" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <circle cx="170" cy="120" r="60" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="170" y="135" text-anchor="middle" font-size="54">✒️</text>

    <text x="170" y="235" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#224C6D">Mực Tím Hoa Cà</text>
    <text x="170" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Thơ mộng tuổi học trò</text>

    <g transform="translate(70, 290)" style="cursor: pointer;">
      <rect width="200" height="46" rx="14" fill="#3D83AE" stroke="#256286" stroke-width="2"/>
      <text x="100" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">SỬ DỤNG</text>
    </g>
  </g>

  <!-- Thẻ 3: Bút Chì Gỗ 2B (Mua 350 Xu) -->
  <g transform="translate(1510, 150)" filter="url(#cardShadow)">
    <rect width="340" height="360" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <circle cx="170" cy="120" r="60" fill="#FAF5EB" stroke="#C4843A" stroke-width="2"/>
    <text x="170" y="135" text-anchor="middle" font-size="54">✏️</text>

    <text x="170" y="235" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#224C6D">Bút Chì Gỗ 2B</text>
    <text x="170" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Nét chì phác thảo mộc mạc</text>

    <g transform="translate(70, 290)" style="cursor: pointer;">
      <rect width="200" height="46" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="100" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#92400E">🪙 350 XU</text>
    </g>
  </g>

  <!-- ===== HÀNG 2 ===== -->
  <!-- Thẻ 4: Bút Đỏ Giáo Viên (Mua 500 Xu) -->
  <g transform="translate(780, 540)" filter="url(#cardShadow)">
    <rect width="340" height="360" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <circle cx="170" cy="120" r="60" fill="#FEE2E2" stroke="#D84444" stroke-width="2"/>
    <text x="170" y="135" text-anchor="middle" font-size="54">🖍️</text>

    <text x="170" y="235" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#224C6D">Bút Đỏ Giáo Viên</text>
    <text x="170" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Nét bút đỏ sắc sảo</text>

    <g transform="translate(70, 290)" style="cursor: pointer;">
      <rect width="200" height="46" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="100" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#92400E">🪙 500 XU</text>
    </g>
  </g>

  <!-- Thẻ 5: Bút Nhớ Dạ Quang (Mua 650 Xu) -->
  <g transform="translate(1145, 540)" filter="url(#cardShadow)">
    <rect width="340" height="360" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <circle cx="170" cy="120" r="60" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>
    <text x="170" y="135" text-anchor="middle" font-size="54">🖌️</text>

    <text x="170" y="235" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#224C6D">Bút Nhớ Dạ Quang</text>
    <text x="170" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Đường vẽ dạ quang rực rỡ</text>

    <g transform="translate(70, 290)" style="cursor: pointer;">
      <rect width="200" height="46" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="100" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#92400E">🪙 650 XU</text>
    </g>
  </g>

  <!-- Thẻ 6: Mực Nhũ Hoàng Gia (VIP - Mua 1,200 Xu) -->
  <g transform="translate(1510, 540)" filter="url(#cardShadow)">
    <rect width="340" height="360" rx="22" fill="#FFFDF8" stroke="#F59E0B" stroke-width="3.5"/>
    <rect x="230" y="16" width="90" height="26" rx="6" fill="#FEE2E2"/>
    <text x="275" y="34" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#B91C1C">VIP GOLD</text>

    <circle cx="170" cy="120" r="60" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="170" y="135" text-anchor="middle" font-size="54">✨</text>

    <text x="170" y="235" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#224C6D">Mực Nhũ Hoàng Gia</text>
    <text x="170" y="265" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#D97706">Lấp lánh ánh kim cao cấp</text>

    <g transform="translate(70, 290)" style="cursor: pointer;">
      <rect width="200" height="46" rx="14" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <text x="100" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#FFFFFF">🪙 1,200 XU</text>
    </g>
  </g>

  <!-- Chân trang -->
  <rect x="840" y="1062" width="240" height="6" rx="3" fill="#1E2830" opacity="0.3"/>
</svg>