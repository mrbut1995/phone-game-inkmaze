<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="achieveBgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.55"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.18"/>
    </pattern>

    <filter id="achieveSheetShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2D2115" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2D2115" flood-opacity="0.10"/>
    </filter>

    <filter id="clipShadowAchieve" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.25"/>
    </filter>

    <filter id="cardShadowAchieve" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2830" flood-opacity="0.10"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#FAF5EB"/>
  <rect width="1920" height="1080" fill="url(#achieveBgGrid)"/>
  <line x1="80" y1="0" x2="80" y2="1080" stroke="#D84444" stroke-width="3" opacity="0.85"/>

  <!-- ================= TỜ GIẤY THÀNH TỰU NGANG (1820 x 980 px) ================= -->
  <g transform="translate(50, 50)">
    <g filter="url(#achieveSheetShadow)">
      <rect width="1820" height="980" rx="28" fill="#FFFDF8"/>

      <!-- Hàng lỗ bấm ghim mép trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="80" r="9"/><circle cx="28" cy="200" r="9"/><circle cx="28" cy="320" r="9"/>
        <circle cx="28" cy="440" r="9"/><circle cx="28" cy="560" r="9"/><circle cx="28" cy="680" r="9"/>
        <circle cx="28" cy="800" r="9"/><circle cx="28" cy="920" r="9"/>
      </g>

      <!-- Dòng kẻ mờ sổ tay -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.28">
        <line x1="88" y1="100" x2="1760" y2="100"/><line x1="88" y1="200" x2="1760" y2="200"/>
        <line x1="88" y1="300" x2="1760" y2="300"/><line x1="88" y1="400" x2="1760" y2="400"/>
        <line x1="88" y1="500" x2="1760" y2="500"/><line x1="88" y1="600" x2="1760" y2="600"/>
        <line x1="88" y1="700" x2="1760" y2="700"/><line x1="88" y1="800" x2="1760" y2="800"/>
        <line x1="88" y1="900" x2="1760" y2="900"/>
      </g>

      <line x1="88" y1="0" x2="88" y2="980" stroke="#D84444" stroke-width="2.5" opacity="0.85"/>
      <rect width="1820" height="980" rx="28" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    </g>

    <!-- Băng dính Washi Tape -->
    <g transform="translate(800, -22)">
      <rect width="220" height="48" rx="4" fill="#E8DFCA" fill-opacity="0.85" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" 
            stroke="#B5A98F" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- Ghim kẹp kim loại góc trên trái -->
    <g transform="translate(130, -18)" filter="url(#clipShadowAchieve)">
      <path d="M 0 50 L 0 12 A 12 12 0 0 1 24 12 L 24 60 A 18 18 0 0 1 -12 60 L -12 18" 
            fill="none" stroke="#7A8F9B" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- ================= CỘT TRÁI (W: 650px, x: 90) ================= -->
    <!-- 1. Header Back & Tiêu đề -->
    <g transform="translate(90, 85)">
      <g filter="url(#uiShadow)" style="cursor: pointer;">
        <rect width="75" height="75" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
        <path d="M45 25 L27 37 L45 50" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <text x="365" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="950" fill="#224C6D">SỔ TAY THÀNH TỰU</text>
    </g>

    <!-- 2. Thẻ Tổng Quan Tiến Độ Danh Hiệu (630 x 200 px) -->
    <g transform="translate(90, 175)" filter="url(#cardShadowAchieve)">
      <rect width="630" height="200" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
      <line x1="24" y1="0" x2="24" y2="200" stroke="#D84444" stroke-width="2.5"/>

      <text x="55" y="115" font-size="52">🏆</text>

      <g transform="translate(130, 48)">
        <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#224C6D">TIẾN ĐỘ THU THẬP DANH HIỆU</text>
        <g transform="translate(0, 38)">
          <rect width="400" height="14" rx="7" fill="#EAE4D5" stroke="#90BBD4" stroke-width="1"/>
          <rect width="288" height="14" rx="7" fill="#3D83AE"/>
          <text x="415" y="12" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="950" fill="#3D83AE">72%</text>
        </g>
        <text x="0" y="88" font-family="sans-serif" font-size="16" font-weight="700" fill="#718B9E">
          Đã mở: 18 / 25 Danh hiệu • Điểm: 1,450 AP
        </text>
      </g>
    </g>

    <!-- 3. Lưới 2x2 Tabs Phân Loại (Mỗi tab 305 x 58 px) -->
    <g transform="translate(90, 395)">
      <!-- Tab 1: TẤT CẢ (ACTIVE) -->
      <g transform="translate(0, 0)" style="cursor: pointer;">
        <rect width="305" height="58" rx="14" fill="#3D83AE" stroke="#256286" stroke-width="2.5"/>
        <text x="152" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">TẤT CẢ (25)</text>
      </g>
      <!-- Tab 2: MÀN CHƠI -->
      <g transform="translate(325, 0)" style="cursor: pointer;">
        <rect width="305" height="58" rx="14" fill="#FEFDFA" stroke="#8FB9D2" stroke-width="2"/>
        <text x="152" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#718B9E">MÀN CHƠI</text>
      </g>
      <!-- Tab 3: DUNGEON -->
      <g transform="translate(0, 73)" style="cursor: pointer;">
        <rect width="305" height="58" rx="14" fill="#FEFDFA" stroke="#8FB9D2" stroke-width="2"/>
        <text x="152" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#718B9E">DUNGEON</text>
      </g>
      <!-- Tab 4: DAILY -->
      <g transform="translate(325, 73)" style="cursor: pointer;">
        <rect width="305" height="58" rx="14" fill="#FEFDFA" stroke="#8FB9D2" stroke-width="2"/>
        <text x="152" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#718B9E">DAILY</text>
      </g>
    </g>

    <!-- 4. Lời nhắc & Con dấu đỏ 18/25 Badges -->
    <g transform="translate(90, 680)">
      <text x="315" y="24" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" font-weight="600" fill="#718B9E">
        ~ Ghi nhận từng bước chân khám phá mê cung ~
      </text>

      <g transform="translate(225, 60) rotate(-5)">
        <rect width="180" height="55" rx="8" fill="#D84444" fill-opacity="0.08" stroke="#D84444" stroke-width="2.5" stroke-dasharray="6 3"/>
        <text x="90" y="35" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="950" fill="#D84444">18/25 BADGES</text>
      </g>
    </g>

    <!-- ================= CỘT PHẢI: 4 THẺ THÀNH TỰU (W: 1050px, x: 770) ================= -->
    <!-- THẺ 1: CLAIMED (ĐÃ ĐẠT) -->
    <g transform="translate(770, 85)" filter="url(#cardShadowAchieve)">
      <rect width="1050" height="205" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
      <line x1="22" y1="0" x2="22" y2="205" stroke="#2E7D32" stroke-width="3.5"/>

      <circle cx="75" cy="102" r="38" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
      <text x="75" y="117" text-anchor="middle" font-size="40">🎯</text>

      <g transform="translate(135, 48)">
        <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#224C6D">Nhà Thám Hiểm Tập Sự</text>
        <text x="0" y="52" font-family="sans-serif" font-size="17" font-weight="600" fill="#718B9E">Vượt qua 10 màn chơi đầu tiên trong Play Mode</text>
        <g transform="translate(0, 72)">
          <rect width="450" height="12" rx="6" fill="#EAE4D5"/>
          <rect width="450" height="12" rx="6" fill="#2E7D32"/>
          <text x="0" y="34" font-family="sans-serif" font-size="15" font-weight="900" fill="#2E7D32">Tiến độ: 10 / 10 Màn (Hoàn thành)</text>
        </g>
      </g>

      <g transform="translate(870, 65) rotate(-6)">
        <rect width="140" height="78" rx="10" fill="#D84444" fill-opacity="0.08" stroke="#D84444" stroke-width="2.8" stroke-dasharray="6 3"/>
        <text x="70" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="950" fill="#D84444">ĐÃ ĐẠT</text>
        <text x="70" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#D84444">+50 💵</text>
      </g>
    </g>

    <!-- THẺ 2: CLAIMABLE (SẴN SÀNG NHẬN) -->
    <g transform="translate(770, 305)" filter="url(#cardShadowAchieve)">
      <rect width="1050" height="205" rx="22" fill="#FFFDF8" stroke="#F59E0B" stroke-width="3"/>
      <line x1="22" y1="0" x2="22" y2="205" stroke="#F59E0B" stroke-width="3.5"/>

      <circle cx="75" cy="102" r="38" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="75" y="117" text-anchor="middle" font-size="40">💣</text>

      <g transform="translate(135, 48)">
        <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#224C6D">Chuyên Gia Gỡ Mìn</text>
        <text x="0" y="52" font-family="sans-serif" font-size="17" font-weight="600" fill="#718B9E">Đánh dấu chính xác 30 ô mìn bằng Anchor tường</text>
        <g transform="translate(0, 72)">
          <rect width="450" height="12" rx="6" fill="#EAE4D5"/>
          <rect width="450" height="12" rx="6" fill="#F59E0B"/>
          <text x="0" y="34" font-family="sans-serif" font-size="15" font-weight="900" fill="#D97706">Tiến độ: 30 / 30 Ô mìn</text>
        </g>
      </g>

      <!-- Nút Claim thưởng -->
      <g transform="translate(835, 75)" style="cursor: pointer;">
        <rect width="180" height="56" rx="14" fill="#3D83AE" stroke="#256286" stroke-width="2.5"/>
        <text x="90" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#FFFFFF">NHẬN +100 💵</text>
      </g>
    </g>

    <!-- THẺ 3: IN PROGRESS (ĐANG TIẾN HÀNH) -->
    <g transform="translate(770, 525)" filter="url(#cardShadowAchieve)">
      <rect width="1050" height="205" rx="22" fill="#FEFDFA" stroke="#D1E2ED" stroke-width="2"/>
      <line x1="22" y1="0" x2="22" y2="205" stroke="#3D83AE" stroke-width="3"/>

      <circle cx="75" cy="102" r="38" fill="#F0F7FB" stroke="#8FB9D2" stroke-width="1.8"/>
      <text x="75" y="117" text-anchor="middle" font-size="40">🏰</text>

      <g transform="translate(135, 48)">
        <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#224C6D">Kẻ Chinh Phục Ngục Tối</text>
        <text x="0" y="52" font-family="sans-serif" font-size="17" font-weight="600" fill="#718B9E">Tiến sâu tới Tầng 15 trong Dungeon Mode</text>
        <g transform="translate(0, 72)">
          <rect width="450" height="12" rx="6" fill="#EAE4D5"/>
          <rect width="360" height="12" rx="6" fill="#3D83AE"/>
          <text x="0" y="34" font-family="sans-serif" font-size="15" font-weight="900" fill="#3D83AE">Tiến độ: 12 / 15 Tầng (80%)</text>
        </g>
      </g>

      <g transform="translate(865, 80)">
        <rect width="145" height="46" rx="10" fill="#FAF5EB" stroke="#8FB9D2" stroke-width="1.5"/>
        <text x="72" y="29" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#718B9E">Thưởng: +150 💵</text>
      </g>
    </g>

    <!-- THẺ 4: LOCKED (THÀNH TỰU ẨN) -->
    <g transform="translate(770, 745)" opacity="0.68">
      <rect width="1050" height="195" rx="22" fill="#F4EFE6" stroke="#BAC7CF" stroke-width="2"/>
      <line x1="22" y1="0" x2="22" y2="195" stroke="#BAC7CF" stroke-width="2.5" stroke-dasharray="5 3"/>

      <g transform="translate(75, 95)">
        <circle cx="0" cy="0" r="34" fill="#EAE4D7"/>
        <path d="M -8 -2 L -8 -12 A 8 8 0 0 1 8 -12 L 8 -2" fill="none" stroke="#7A8F9B" stroke-width="3" stroke-linecap="round"/>
        <rect x="-13" y="-2" width="26" height="20" rx="5" fill="#DFDCD5" stroke="#7A8F9B" stroke-width="2.5"/>
        <circle cx="0" cy="7" r="2" fill="#7A8F9B"/>
      </g>

      <g transform="translate(135, 42)">
        <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#7A8F9B">Thành Tựu Ẩn • Chưa Khám Phá</text>
        <text x="0" y="50" font-family="sans-serif" font-size="17" font-weight="600" fill="#A1B1BC">Hoàn thành ván đấu 7×7 mà không dùng bất kỳ gợi ý nào</text>
        <text x="0" y="80" font-family="sans-serif" font-size="15" font-weight="700" fill="#A1B1BC">Tiến độ: ??? / ???</text>
      </g>

      <g transform="translate(865, 75)">
        <rect width="145" height="46" rx="10" fill="#EFECE6" stroke="#BAC7CF" stroke-width="1.2"/>
        <text x="72" y="29" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#A1B1BC">🔒 KHÓA</text>
      </g>
    </g>
  </g>

  <rect x="840" y="1062" width="240" height="6" rx="3" fill="#1E2830" opacity="0.3"/>
</svg>