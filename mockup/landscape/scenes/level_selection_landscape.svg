<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Lưới vở học sinh 40px -->
    <pattern id="notebookGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.2"/>
    </pattern>

    <!-- Đổ bóng Card Level & Thẻ UI -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1E1610" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E1610" flood-opacity="0.08"/>
    </filter>

    <filter id="focusShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#C4843A" flood-opacity="0.30"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <!-- Khuôn cắt bo góc thẻ Level ngang (360 x 265, rx=24) -->
    <clipPath id="levelCardClipLandscape">
      <rect width="360" height="265" rx="24"/>
    </clipPath>

    <!-- Biểu tượng Ngôi sao vàng, rỗng & khóa -->
    <g id="star-full">
      <path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" 
            fill="#FBBF24" stroke="#D97706" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 24 8 L 28 16.5 L 37 17.8" fill="none" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    </g>

    <g id="star-none">
      <path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" 
            fill="#FAF5EB" fill-opacity="0.7" stroke="#8FB9D2" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="3" fill="#8FB9D2" opacity="0.3"/>
    </g>

    <g id="star-locked">
      <path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" 
            fill="none" stroke="#A7B9C3" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Ổ khóa vẽ nét mực -->
    <g id="lock-icon-level">
      <g stroke="#7A8F9B" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -16 -6 L -16 -22 A 16 16 0 0 1 16 -22 L 16 -6" stroke-width="4"/>
        <rect x="-24" y="-6" width="48" height="38" rx="8" fill="#DFDCD5" stroke-width="3.5"/>
        <circle cx="0" cy="9" r="3.5" fill="#7A8F9B"/>
        <line x1="0" y1="12" x2="0" y2="20" stroke-width="3"/>
      </g>
    </g>
  </defs>

  <!-- Nền vở ô ly & lề đỏ -->
  <rect width="1920" height="1080" fill="#FAF5EB"/>
  <rect width="1920" height="1080" fill="url(#notebookGrid)"/>
  <line x1="80" y1="0" x2="80" y2="1080" stroke="#D84444" stroke-width="3" opacity="0.85"/>

  <!-- ================= CỘT TRÁI (W: 580px, x: 60) ================= -->
  <!-- 1. Header Back & Tiêu đề -->
  <g transform="translate(60, 50)">
    <g filter="url(#uiShadow)" style="cursor: pointer;">
      <rect width="75" height="75" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <path d="M45 25 L27 37 L45 50" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(95, 0)" filter="url(#uiShadow)">
      <rect width="465" height="75" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <text x="232" y="48" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="950" fill="#244E6E">CHỌN MÀN CHƠI</text>
    </g>
  </g>

  <!-- 2. Thẻ Tổng Sao Tích Lũy (560 x 95 px) -->
  <g transform="translate(60, 145)" filter="url(#uiShadow)">
    <rect width="560" height="95" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <line x1="20" y1="0" x2="20" y2="95" stroke="#F59E0B" stroke-width="3"/>

    <g transform="translate(48, 24) scale(1.15)"><use href="#star-full"/></g>
    <text x="140" y="58" font-family="'Segoe UI', monospace" font-size="44" font-weight="950" fill="#224C6D">
      28 <tspan font-size="24" fill="#718B9E">/ 45 SAO</tspan>
    </text>
    <rect x="390" y="28" width="140" height="38" rx="10" fill="#FEF3C7"/>
    <text x="460" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#92400E">ĐẠT 62%</text>
  </g>

  <!-- 3. Banner Thông Tin Chương (560 x 230 px) -->
  <g transform="translate(60, 260)" filter="url(#uiShadow)">
    <rect width="560" height="230" rx="24" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <line x1="24" y1="0" x2="24" y2="230" stroke="#D84444" stroke-width="3.5"/>

    <g transform="translate(45, 30)">
      <rect width="130" height="26" rx="6" fill="#EBF3F8"/>
      <text x="65" y="18" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#256286">KÍCH THƯỚC 7×7</text>

      <text x="0" y="60" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#244E6E">CHƯƠNG 1: NHẬP MÔN</text>
      <text x="0" y="90" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Bàn cờ 7×7 • Độ khó: Dễ</text>

      <!-- Slider tiến độ -->
      <g transform="translate(0, 115)">
        <rect width="360" height="14" rx="7" fill="#EAE4D5" stroke="#90BBD4" stroke-width="1.2"/>
        <rect width="234" height="14" rx="7" fill="#3D83AE"/>
        <text x="385" y="12" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="950" fill="#3D83AE">65%</text>
      </g>

      <!-- Nút Đổi Chương -->
      <g transform="translate(300, 142)" style="cursor: pointer;">
        <rect width="180" height="42" rx="12" fill="#FAF5EB" stroke="#6EA0C8" stroke-width="2"/>
        <text x="90" y="27" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#3D83AE">ĐỔI CHƯƠNG ›</text>
      </g>
    </g>
  </g>

  <!-- 4. Nút Tiếp Tục Chơi Màn 07 Cột Trái (560 x 150 px) -->
  <g transform="translate(60, 840)" filter="url(#uiShadow)" style="cursor: pointer;">
    <rect width="560" height="150" rx="26" fill="#3D83AE" stroke="#215477" stroke-width="4"/>
    <line x1="32" y1="0" x2="32" y2="150" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
    <polygon points="65,60 65,90 90,75" fill="#FAF5EB"/>

    <g transform="translate(115, 52)">
      <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="950" fill="#FFFFFF">TIẾP TỤC MÀN 07</text>
      <text x="0" y="56" font-family="sans-serif" font-size="18" font-weight="700" fill="#BAE6FD">CHƯƠNG 1: NHẬP MÔN ›</text>
    </g>
  </g>

  <!-- ================= CỘT PHẢI: LƯỚI 3x3 THẺ LEVEL (W: 1200px, x: 680) ================= -->
  <!-- Mỗi thẻ: 360 x 265 px, khoảng cách x: 390px, y: 295px -->

  <!-- ===== HÀNG 1: MÀN 01, 02, 03 (3 SAO ĐẦY ĐỦ) ===== -->
  <!-- MÀN 01 -->
  <g transform="translate(680, 50)" filter="url(#cardShadow)">
    <g clip-path="url(#levelCardClipLandscape)">
      <rect width="360" height="265" fill="#FEFDFA"/>
      <line x1="36" y1="0" x2="36" y2="265" stroke="#D84444" stroke-width="2.5"/>
    </g>
    <rect width="360" height="265" rx="24" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#7898AE" letter-spacing="1">MÀN</text>
    <text x="180" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="76" font-weight="950" fill="#224C6D">01</text>
    <line x1="110" y1="172" x2="250" y2="172" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.6"/>
    <g transform="translate(95, 195)">
      <g transform="translate(0, 4) scale(0.85)"><use href="#star-full"/></g>
      <g transform="translate(60, -4) scale(1.05)"><use href="#star-full"/></g>
      <g transform="translate(130, 4) scale(0.85)"><use href="#star-full"/></g>
    </g>
  </g>

  <!-- MÀN 02 -->
  <g transform="translate(1070, 50)" filter="url(#cardShadow)">
    <g clip-path="url(#levelCardClipLandscape)">
      <rect width="360" height="265" fill="#FEFDFA"/>
      <line x1="36" y1="0" x2="36" y2="265" stroke="#D84444" stroke-width="2.5"/>
    </g>
    <rect width="360" height="265" rx="24" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#7898AE" letter-spacing="1">MÀN</text>
    <text x="180" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="76" font-weight="950" fill="#224C6D">02</text>
    <line x1="110" y1="172" x2="250" y2="172" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.6"/>
    <g transform="translate(95, 195)">
      <g transform="translate(0, 4) scale(0.85)"><use href="#star-full"/></g>
      <g transform="translate(60, -4) scale(1.05)"><use href="#star-full"/></g>
      <g transform="translate(130, 4) scale(0.85)"><use href="#star-full"/></g>
    </g>
  </g>

  <!-- MÀN 03 -->
  <g transform="translate(1460, 50)" filter="url(#cardShadow)">
    <g clip-path="url(#levelCardClipLandscape)">
      <rect width="360" height="265" fill="#FEFDFA"/>
      <line x1="36" y1="0" x2="36" y2="265" stroke="#D84444" stroke-width="2.5"/>
    </g>
    <rect width="360" height="265" rx="24" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#7898AE" letter-spacing="1">MÀN</text>
    <text x="180" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="76" font-weight="950" fill="#224C6D">03</text>
    <line x1="110" y1="172" x2="250" y2="172" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.6"/>
    <g transform="translate(95, 195)">
      <g transform="translate(0, 4) scale(0.85)"><use href="#star-full"/></g>
      <g transform="translate(60, -4) scale(1.05)"><use href="#star-full"/></g>
      <g transform="translate(130, 4) scale(0.85)"><use href="#star-full"/></g>
    </g>
  </g>

  <!-- ===== HÀNG 2: MÀN 04 (2 SAO), MÀN 05 (3 SAO), MÀN 06 (2 SAO) ===== -->
  <!-- MÀN 04 -->
  <g transform="translate(680, 345)" filter="url(#cardShadow)">
    <g clip-path="url(#levelCardClipLandscape)">
      <rect width="360" height="265" fill="#FEFDFA"/>
      <line x1="36" y1="0" x2="36" y2="265" stroke="#D84444" stroke-width="2.5"/>
    </g>
    <rect width="360" height="265" rx="24" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#7898AE" letter-spacing="1">MÀN</text>
    <text x="180" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="76" font-weight="950" fill="#224C6D">04</text>
    <line x1="110" y1="172" x2="250" y2="172" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.6"/>
    <g transform="translate(95, 195)">
      <g transform="translate(0, 4) scale(0.85)"><use href="#star-full"/></g>
      <g transform="translate(60, -4) scale(1.05)"><use href="#star-full"/></g>
      <g transform="translate(130, 4) scale(0.85)"><use href="#star-none"/></g>
    </g>
  </g>

  <!-- MÀN 05 -->
  <g transform="translate(1070, 345)" filter="url(#cardShadow)">
    <g clip-path="url(#levelCardClipLandscape)">
      <rect width="360" height="265" fill="#FEFDFA"/>
      <line x1="36" y1="0" x2="36" y2="265" stroke="#D84444" stroke-width="2.5"/>
    </g>
    <rect width="360" height="265" rx="24" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#7898AE" letter-spacing="1">MÀN</text>
    <text x="180" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="76" font-weight="950" fill="#224C6D">05</text>
    <line x1="110" y1="172" x2="250" y2="172" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.6"/>
    <g transform="translate(95, 195)">
      <g transform="translate(0, 4) scale(0.85)"><use href="#star-full"/></g>
      <g transform="translate(60, -4) scale(1.05)"><use href="#star-full"/></g>
      <g transform="translate(130, 4) scale(0.85)"><use href="#star-full"/></g>
    </g>
  </g>

  <!-- MÀN 06 -->
  <g transform="translate(1460, 345)" filter="url(#cardShadow)">
    <g clip-path="url(#levelCardClipLandscape)">
      <rect width="360" height="265" fill="#FEFDFA"/>
      <line x1="36" y1="0" x2="36" y2="265" stroke="#D84444" stroke-width="2.5"/>
    </g>
    <rect width="360" height="265" rx="24" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#7898AE" letter-spacing="1">MÀN</text>
    <text x="180" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="76" font-weight="950" fill="#224C6D">06</text>
    <line x1="110" y1="172" x2="250" y2="172" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.6"/>
    <g transform="translate(95, 195)">
      <g transform="translate(0, 4) scale(0.85)"><use href="#star-full"/></g>
      <g transform="translate(60, -4) scale(1.05)"><use href="#star-full"/></g>
      <g transform="translate(130, 4) scale(0.85)"><use href="#star-none"/></g>
    </g>
  </g>

  <!-- ===== HÀNG 3: MÀN 07 (FOCUS MÀN MỚI), MÀN 08, 09 (KHÓA) ===== -->
  <!-- MÀN 07 (FOCUS / NEW) -->
  <g transform="translate(680, 640)" filter="url(#focusShadow)" style="cursor: pointer;">
    <!-- Hào quang viền nét đứt vàng cam -->
    <rect x="-6" y="-6" width="372" height="277" rx="28" fill="none" stroke="#C4843A" stroke-width="3.5" stroke-dasharray="8 6"/>

    <g clip-path="url(#levelCardClipLandscape)">
      <rect width="360" height="265" fill="#FFFDF8"/>
      <line x1="36" y1="0" x2="36" y2="265" stroke="#D84444" stroke-width="3"/>
    </g>
    <rect width="360" height="265" rx="24" fill="none" stroke="#C4843A" stroke-width="4"/>

    <!-- Nhãn NEW đỏ góc phải -->
    <path d="M 285 0 L 336 0 A 24 24 0 0 1 360 24 L 360 48 Z" fill="#D84444"/>
    <text x="330" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">NEW</text>

    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#C4843A" letter-spacing="1">MÀN TIẾP</text>
    <text x="180" y="138" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="82" font-weight="950" fill="#C4843A">07</text>
    <line x1="110" y1="172" x2="250" y2="172" stroke="#C4843A" stroke-width="2" stroke-dasharray="5 4"/>
    <g transform="translate(95, 195)">
      <g transform="translate(0, 4) scale(0.85)"><use href="#star-none"/></g>
      <g transform="translate(60, -4) scale(1.05)"><use href="#star-none"/></g>
      <g transform="translate(130, 4) scale(0.85)"><use href="#star-none"/></g>
    </g>
  </g>

  <!-- MÀN 08 (BỊ KHÓA) -->
  <g transform="translate(1070, 640)" opacity="0.85">
    <rect width="360" height="265" rx="24" fill="#EFECE6"/>
    <line x1="36" y1="0" x2="36" y2="265" stroke="#D19E9E" stroke-width="2" stroke-dasharray="5 4"/>
    <rect width="360" height="265" rx="24" fill="none" stroke="#A7B9C3" stroke-width="2.5"/>

    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#A7B9C3" letter-spacing="1">MÀN</text>
    <text x="180" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="56" font-weight="950" fill="#A7B9C3" opacity="0.6">08</text>

    <!-- Ổ khóa -->
    <g transform="translate(180, 162) scale(0.95)"><use href="#lock-icon-level"/></g>
    <g transform="translate(95, 205)" opacity="0.45">
      <g transform="translate(0, 4) scale(0.85)"><use href="#star-locked"/></g>
      <g transform="translate(60, -4) scale(1.05)"><use href="#star-locked"/></g>
      <g transform="translate(130, 4) scale(0.85)"><use href="#star-locked"/></g>
    </g>
  </g>

  <!-- MÀN 09 (BỊ KHÓA) -->
  <g transform="translate(1460, 640)" opacity="0.85">
    <rect width="360" height="265" rx="24" fill="#EFECE6"/>
    <line x1="36" y1="0" x2="36" y2="265" stroke="#D19E9E" stroke-width="2" stroke-dasharray="5 4"/>
    <rect width="360" height="265" rx="24" fill="none" stroke="#A7B9C3" stroke-width="2.5"/>

    <text x="180" y="48" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#A7B9C3" letter-spacing="1">MÀN</text>
    <text x="180" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="56" font-weight="950" fill="#A7B9C3" opacity="0.6">09</text>

    <g transform="translate(180, 162) scale(0.95)"><use href="#lock-icon-level"/></g>
    <g transform="translate(95, 205)" opacity="0.45">
      <g transform="translate(0, 4) scale(0.85)"><use href="#star-locked"/></g>
      <g transform="translate(60, -4) scale(1.05)"><use href="#star-locked"/></g>
      <g transform="translate(130, 4) scale(0.85)"><use href="#star-locked"/></g>
    </g>
  </g>

  <!-- Phân trang Dots dưới lưới -->
  <g transform="translate(1250, 955)">
    <rect x="-38" y="-6" width="34" height="12" rx="6" fill="#3D83AE"/>
    <circle cx="14" cy="0" r="6" fill="#8FB9D2" opacity="0.6"/>
    <circle cx="42" cy="0" r="6" fill="#8FB9D2" opacity="0.6"/>
  </g>

  <!-- Android Home Gesture Bar -->
  <rect x="840" y="1062" width="240" height="6" rx="3" fill="#1E2830" opacity="0.3"/>
</svg>