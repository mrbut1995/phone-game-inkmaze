<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Lưới vở học sinh 40px -->
    <pattern id="mainNotebookGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.55"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.18"/>
    </pattern>

    <filter id="mainSheetShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2D2115" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2D2115" flood-opacity="0.08"/>
    </filter>

    <filter id="stickerShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.10"/>
    </filter>

    <filter id="clipShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Nền bàn & lề đỏ trang vở -->
  <rect width="1920" height="1080" fill="#FAF5EB"/>
  <rect width="1920" height="1080" fill="url(#mainNotebookGrid)"/>
  <line x1="80" y1="0" x2="80" y2="1080" stroke="#D84444" stroke-width="3" opacity="0.85"/>

  <!-- ================= TỜ GIẤY SHEET MENU NGANG (1820 x 980 px) ================= -->
  <g transform="translate(50, 50)">
    <!-- Thân tờ giấy lớn -->
    <g filter="url(#mainSheetShadow)">
      <rect width="1820" height="980" rx="28" fill="#FFFDF8"/>

      <!-- Hàng 8 lỗ bấm sổ còng bên lề trái -->
      <g fill="#EAE3D2" opacity="0.8">
        <circle cx="28" cy="80" r="9"/><circle cx="28" cy="200" r="9"/><circle cx="28" cy="320" r="9"/>
        <circle cx="28" cy="440" r="9"/><circle cx="28" cy="560" r="9"/><circle cx="28" cy="680" r="9"/>
        <circle cx="28" cy="800" r="9"/><circle cx="28" cy="920" r="9"/>
      </g>

      <!-- Các dòng kẻ ngang xanh nhạt trang vở -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.25">
        <line x1="88" y1="100" x2="1760" y2="100"/><line x1="88" y1="200" x2="1760" y2="200"/>
        <line x1="88" y1="300" x2="1760" y2="300"/><line x1="88" y1="400" x2="1760" y2="400"/>
        <line x1="88" y1="500" x2="1760" y2="500"/><line x1="88" y1="600" x2="1760" y2="600"/>
        <line x1="88" y1="700" x2="1760" y2="700"/><line x1="88" y1="800" x2="1760" y2="800"/>
        <line x1="88" y1="900" x2="1760" y2="900"/>
      </g>

      <!-- Đường lề đỏ trên tờ giấy -->
      <line x1="88" y1="0" x2="88" y2="980" stroke="#D84444" stroke-width="2.8" opacity="0.85"/>
      <!-- Viền mực xanh bao quanh tờ giấy -->
      <rect width="1820" height="980" rx="28" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    </g>

    <!-- Dải băng dính Washi Tape trên đỉnh giữa -->
    <g transform="translate(800, -22)">
      <rect width="220" height="48" rx="4" fill="#E8DFCA" fill-opacity="0.88" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" 
            stroke="#B5A98F" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- Ghim kẹp giấy kim loại góc trên trái -->
    <g transform="translate(130, -18)" filter="url(#clipShadow)">
      <path d="M 0 55 L 0 12 A 12 12 0 0 1 24 12 L 24 66 A 18 18 0 0 1 -12 66 L -12 18" 
            fill="none" stroke="#7A8F9B" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- ================= CỘT TRÁI (W: 650px, x: 90) ================= -->

    <!-- 1. KHỐI LOGO HERO GAME (Chiều cao tối ưu 335px) -->
    <g transform="translate(90, 85)" filter="url(#stickerShadow)">
      <rect width="650" height="335" rx="24" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
      <line x1="24" y1="0" x2="24" y2="335" stroke="#3D83AE" stroke-width="2.5"/>

      <!-- Icon Mê Cung Doodle 4x4 -->
      <g transform="translate(275, 30)" stroke="#236794" stroke-linecap="round">
        <rect x="0" y="0" width="100" height="100" rx="18" fill="#F4F8FA" stroke-width="2.8"/>
        <g stroke-width="1.2" opacity="0.45">
          <line x1="25" y1="0" x2="25" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="75" y1="0" x2="75" y2="100"/>
          <line x1="0" y1="25" x2="100" y2="25"/><line x1="0" y1="50" x2="100" y2="50"/><line x1="0" y1="75" x2="100" y2="75"/>
        </g>
        <path d="M 15 82 L 15 50 L 50 50 L 50 18 L 85 18" fill="none" stroke="#163A58" stroke-width="5" stroke-linejoin="round"/>
      </g>

      <!-- Tên game "Ink Maze" -->
      <text x="325" y="195" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="950" fill="#163A58" letter-spacing="1">Ink Maze</text>

      <!-- Nhãn thể loại -->
      <rect x="220" y="218" width="210" height="30" rx="8" fill="#F2EFE8" stroke="#D8E2E8" stroke-width="1.2"/>
      <text x="325" y="238" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#486D87" letter-spacing="2">LOGIC &amp; PUZZLE</text>

      <text x="325" y="280" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#718B9E">Mê Cung Suy Luận • Vở Ô Ly</text>
    </g>

    <!-- 2. THẺ HỒ SƠ NGƯỜI CHƠI (AVATAR + KHUNG VIỀN BÁNH RĂNG VÀNG - MỞ PROFILER) -->
    <g transform="translate(90, 445)" filter="url(#stickerShadow)" style="cursor: pointer;">
      <rect width="650" height="210" rx="22" fill="#FEFDFA" stroke="#256C96" stroke-width="3"/>
      <line x1="24" y1="0" x2="24" y2="210" stroke="#256C96" stroke-width="3"/>

      <!-- AVATAR & KHUNG VIỀN BÁNH RĂNG VÀNG -->
      <g transform="translate(100, 105)">
        <!-- Viền Khung Bánh Răng Vàng -->
        <circle cx="0" cy="0" r="48" fill="#FFFDF8" stroke="#F59E0B" stroke-width="4.5" stroke-dasharray="12 4"/>
        <circle cx="0" cy="0" r="38" fill="#E0F2FE"/>

        <!-- Doodle Nhân vật Mực -->
        <g stroke="#163A58" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-18, -20)">
          <circle cx="18" cy="12" r="10" fill="#FEFDFA"/>
          <path d="M 6 36 C 6 24 11 22 18 22 C 25 22 30 24 30 36 Z" fill="#FEFDFA"/>
          <path d="M 15 12 L 17 12 M 20 12 L 22 12"/>
          <path d="M 16 16 Q 18 18 20 16"/>
          <path d="M 26 10 L 33 3" stroke="#D84444" stroke-width="2.2"/>
        </g>

        <!-- Badge Cấp độ LV.28 -->
        <g transform="translate(0, 42)">
          <rect x="-28" y="-10" width="56" height="20" rx="6" fill="#256C96" stroke="#FFFFFF" stroke-width="1.8"/>
          <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="950" fill="#FFFFFF">LV. 28</text>
        </g>

        <!-- Badge icon cây bút nhỏ chỉnh sửa -->
        <g transform="translate(28, 28)">
          <circle cx="8" cy="8" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
          <path d="M 4 12 L 11 5 M 9 4 L 12 7" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Thông tin Người chơi & EXP -->
      <g transform="translate(195, 42)">
        <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#163A58">MazeWalker #1024</text>
        
        <rect x="0" y="36" width="165" height="24" rx="6" fill="#FEF3C7"/>
        <text x="82" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#B45309">BẬC THẦY TƯ DUY</text>

        <!-- Thanh EXP -->
        <g transform="translate(0, 85)">
          <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#718B9E">EXP TIẾN TRÌNH</text>
          <text x="400" y="0" text-anchor="end" font-family="'Segoe UI', monospace" font-size="12" font-weight="900" fill="#256C96">3,850 / 5,000</text>
          <rect y="8" width="400" height="10" rx="5" fill="#E2E8F0"/>
          <rect y="8" width="308" height="10" rx="5" fill="#256C96"/>
        </g>

        <text x="0" y="128" font-family="sans-serif" font-size="14" font-weight="700" fill="#256C96">Chạm để xem hồ sơ &amp; đổi diện mạo ›</text>
      </g>
    </g>

    <!-- 3. NÚT SỔ TAY DANH HIỆU LỚN -->
    <g transform="translate(90, 680)" filter="url(#stickerShadow)" style="cursor: pointer;">
      <rect width="650" height="175" rx="22" fill="#FEFDFA" stroke="#F59E0B" stroke-width="3"/>
      <line x1="24" y1="0" x2="24" y2="175" stroke="#F59E0B" stroke-width="3"/>

      <!-- Huy chương ruy băng cam vàng -->
      <g transform="translate(100, 88)">
        <polygon points="-24,16 -30,48 -14,40 0,48 -4,16" fill="#D97706"/>
        <polygon points="24,16 30,48 14,40 0,48 4,16" fill="#B45309"/>
        <circle cx="0" cy="0" r="38" fill="#FFFDF8" stroke="#D97706" stroke-width="3.5"/>
        <circle cx="0" cy="0" r="32" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2"/>
        <text y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#78350F">🏆</text>
      </g>

      <g transform="translate(195, 48)">
        <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#224C6D">SỔ TAY DANH HIỆU</text>
        <text x="0" y="54" font-family="'Segoe UI', monospace" font-size="34" font-weight="950" fill="#D97706">1 / 28 <tspan font-size="18" fill="#718B9E">ĐÃ MỞ</tspan></text>
        <text x="0" y="86" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Thu thập huân chương &amp; phần thưởng AP ›</text>
      </g>
    </g>

    <!-- 4. CON DẤU PHIÊN BẢN VER 1.0.0 -->
    <g transform="translate(325, 885) rotate(-3)" opacity="0.9">
      <rect width="180" height="50" rx="8" fill="none" stroke="#D84444" stroke-width="2.5" stroke-dasharray="7 3"/>
      <text x="90" y="32" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="18" font-weight="950" fill="#D84444" letter-spacing="2">VER 1.0.0</text>
    </g>

    <!-- ================= CỘT PHẢI (W: 1040px, x: 780) ================= -->
    <!-- THẺ 1: PLAY • CHỌN MÀN -->
    <g transform="translate(780, 85)" filter="url(#stickerShadow)" style="cursor: pointer;">
      <rect width="1040" height="205" rx="24" fill="#256C96" stroke="#164663" stroke-width="3.5"/>
      <line x1="36" y1="0" x2="36" y2="205" stroke="#FAF5EB" stroke-width="3" opacity="0.55"/>

      <rect x="52" y="18" width="160" height="30" rx="8" fill="#FBBF24"/>
      <text x="132" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#78350F" letter-spacing="1">CHẾ ĐỘ CHÍNH</text>

      <g transform="translate(60, 68)">
        <circle cx="44" cy="44" r="42" fill="#1B4F6F"/>
        <polygon points="36,26 36,62 64,44" fill="#FAF5EB"/>
      </g>

      <g transform="translate(180, 88)">
        <text x="0" y="8" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="950" fill="#FFFFFF" letter-spacing="1">PLAY • CHỌN MÀN</text>
        <text x="0" y="42" font-family="sans-serif" font-size="19" font-weight="600" fill="#BAE6FD">Chinh phục từng cấp độ câu đố kinh điển</text>
        <text x="0" y="72" font-family="sans-serif" font-size="17" font-weight="600" fill="#BAE6FD">Tự do chọn màn • Đua thời gian phá giải</text>
      </g>

      <g transform="translate(820, 140)">
        <rect width="180" height="36" rx="8" fill="#18425C"/>
        <text x="90" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#FDE68A">MÀN HIỆN TẠI: (0)</text>
      </g>
      <path d="M 980 95 L 1000 95 M 992 87 L 1002 95 L 992 103" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- THẺ 2: DUNGEON MODE -->
    <g transform="translate(780, 315)" filter="url(#stickerShadow)" style="cursor: pointer;">
      <rect width="1040" height="195" rx="24" fill="#FEFDFA" stroke="#F59E0B" stroke-width="3.5"/>
      <line x1="36" y1="0" x2="36" y2="195" stroke="#F59E0B" stroke-width="3"/>

      <rect x="52" y="18" width="160" height="28" rx="7" fill="#FEF3C7"/>
      <text x="132" y="37" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#B45309" letter-spacing="1">CHẾ ĐỘ VÔ TẬN</text>

      <g transform="translate(60, 62)">
        <circle cx="44" cy="44" r="40" fill="#FFFDF8" stroke="#FDE68A" stroke-width="2"/>
        <g stroke="#163A58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(20, 22)">
          <path d="M 4 38 L 4 12 L 12 12 L 12 20 L 20 20 L 20 12 L 28 12 L 28 20 L 36 20 L 36 12 L 44 12 L 44 38 Z"/>
          <path d="M 18 38 L 18 27 A 6 6 0 0 1 30 27 L 30 38"/>
        </g>
      </g>

      <g transform="translate(180, 85)">
        <text x="0" y="8" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#163A58">DUNGEON MODE</text>
        <text x="0" y="40" font-family="sans-serif" font-size="19" font-weight="600" fill="#718B9E">Chinh phục từng tầng ngục tối hiểm trở</text>
        <text x="0" y="68" font-family="sans-serif" font-size="17" font-weight="600" fill="#9CA3AF">Bảo toàn số bước chân để tiến xa nhất</text>
      </g>

      <g transform="translate(820, 135)">
        <rect width="180" height="36" rx="8" fill="#FEF3C7"/>
        <text x="90" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#B45309">KỶ LỤC: TẦNG (0)</text>
      </g>
      <path d="M 980 90 L 1000 90 M 992 82 L 1002 90 L 992 98" stroke="#D97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- THẺ 3: DAILY CHALLENGE -->
    <g transform="translate(780, 535)" filter="url(#stickerShadow)" style="cursor: pointer;">
      <rect width="1040" height="195" rx="24" fill="#FEFDFA" stroke="#D84444" stroke-width="3.5"/>
      <line x1="36" y1="0" x2="36" y2="195" stroke="#D84444" stroke-width="3"/>

      <rect x="52" y="18" width="170" height="28" rx="7" fill="#FEE2E2"/>
      <text x="137" y="37" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#B91C1C" letter-spacing="1">MỖI NGÀY 1 CÂU ĐỐ</text>

      <g transform="translate(60, 62)">
        <circle cx="44" cy="44" r="40" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
        <g stroke="#163A58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(22, 22)">
          <rect x="2" y="8" width="40" height="34" rx="6"/>
          <line x1="2" y1="18" x2="42" y2="18"/>
          <line x1="12" y1="2" x2="12" y2="8"/><line x1="32" y1="2" x2="32" y2="8"/>
          <rect x="14" y="24" width="8" height="8" rx="1.5" fill="#D84444" stroke="#D84444"/>
        </g>
      </g>

      <g transform="translate(180, 85)">
        <text x="0" y="8" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#163A58">DAILY CHALLENGE</text>
        <text x="0" y="40" font-family="sans-serif" font-size="19" font-weight="600" fill="#718B9E">Thử thách xoay vòng mỗi ngày</text>
        <text x="0" y="68" font-family="sans-serif" font-size="17" font-weight="600" fill="#9CA3AF">Tích lũy xu thưởng &amp; duy trì chuỗi Streak</text>
      </g>

      <g transform="translate(820, 135)">
        <rect width="180" height="36" rx="8" fill="#FEE2E2"/>
        <text x="90" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#B91C1C">STREAK: (0) NGÀY</text>
      </g>
      <path d="M 980 90 L 1000 90 M 992 82 L 1002 90 L 992 98" stroke="#D84444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- HÀNG 3 NÚT CÔNG CỤ (XẾP HẠNG · CỬA HÀNG · CÀI ĐẶT) -->
    <g transform="translate(780, 760)">
      <!-- NÚT 1: XẾP HẠNG -->
      <g transform="translate(0, 0)" filter="url(#stickerShadow)" style="cursor: pointer;">
        <rect width="325" height="140" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.8"/>
        <g stroke="#163A58" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(142, 28)">
          <path d="M 4 2 L 32 2 L 32 16 C 32 24 24 30 18 30 C 12 30 4 24 4 16 Z"/>
          <path d="M 4 8 L -2 8 C -5 8 -7 11 -7 14 C -7 18 -4 21 0 21 L 5 21"/>
          <path d="M 32 8 L 38 8 C 41 8 43 11 43 14 C 43 18 40 21 36 21 L 31 21"/>
          <line x1="18" y1="30" x2="18" y2="38"/><line x1="8" y1="38" x2="28" y2="38"/>
        </g>
        <text x="162" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#163A58">XẾP HẠNG</text>
      </g>

      <!-- NÚT 2: CỬA HÀNG -->
      <g transform="translate(358, 0)" filter="url(#stickerShadow)" style="cursor: pointer;">
        <rect width="325" height="140" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.8"/>
        <g stroke="#163A58" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(140, 26)">
          <path d="M 2 16 L 8 4 L 34 4 L 40 16 Z"/>
          <path d="M 2 16 C 2 20 6 22 10 20 C 14 22 18 20 21 20 C 24 20 28 22 32 20 C 36 22 40 20 40 16"/>
          <rect x="6" y="20" width="30" height="20" rx="2"/>
          <circle cx="21" cy="27" r="3" fill="#163A58"/>
          <path d="M 14 36 C 14 32 17 31 21 31 C 25 31 28 32 28 36"/>
        </g>
        <text x="162" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#163A58">CỬA HÀNG</text>
      </g>

      <!-- NÚT 3: CÀI ĐẶT -->
      <g transform="translate(715, 0)" filter="url(#stickerShadow)" style="cursor: pointer;">
        <rect width="325" height="140" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.8"/>
        <g stroke="#163A58" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(142, 26)">
          <circle cx="20" cy="20" r="8"/>
          <line x1="20" y1="4" x2="20" y2="8"/><line x1="20" y1="32" x2="20" y2="36"/>
          <line x1="4" y1="20" x2="8" y2="20"/><line x1="32" y1="20" x2="36" y2="20"/>
          <line x1="8" y1="8" x2="12" y2="12"/><line x1="28" y1="28" x2="32" y2="32"/>
          <line x1="8" y1="32" x2="12" y2="28"/><line x1="28" y1="12" x2="32" y2="8"/>
        </g>
        <text x="162" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#163A58">CÀI ĐẶT</text>
      </g>
    </g>
  </g>

  <!-- Thanh điều hướng Android Home -->
  <rect x="840" y="1062" width="240" height="6" rx="3" fill="#1E2830" opacity="0.3"/>
</svg>