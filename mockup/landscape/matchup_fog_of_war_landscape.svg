<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="notebookGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.2"/>
    </pattern>

    <filter id="boardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1A2430" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A2430" flood-opacity="0.10"/>
    </filter>
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
    <filter id="glowActive" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
    <filter id="pathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2575A7" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="dungeonDeepVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C4B59" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#1B2834" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0A1118" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="dungeonUpperLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#3C4B59" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1B2834" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Hạt nhiễu sương mù che mờ ô cờ -->
    <pattern id="fogNoise" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#7A8F9B" opacity="0.35"/>
      <circle cx="15" cy="15" r="1.8" fill="#7A8F9B" opacity="0.35"/>
    </pattern>

    <clipPath id="boardClip"><rect width="960" height="960" rx="30"/></clipPath>

    <g id="anchor">
      <g stroke="#1E283A" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-16" x2="0" y2="-5"/><line x1="0" y1="5" x2="0" y2="16"/>
        <line x1="-16" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="16" y2="0"/>
      </g>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="#FAF5EB"/>
  <rect width="1920" height="1080" fill="url(#notebookGrid)"/>
  <line x1="80" y1="0" x2="80" y2="1080" stroke="#D84444" stroke-width="3" opacity="0.85"/>

  <!-- ================= 1. BÀN CỜ FOG OF WAR (x: 60, y: 60) ================= -->
  <g transform="translate(60, 60)">
    <g clip-path="url(#boardClip)">
      <rect width="960" height="960" fill="#FEFDFA"/>
      <line x1="44" y1="0" x2="44" y2="960" stroke="#D84444" stroke-width="3"/>
    </g>
    <rect width="960" height="960" rx="30" fill="none" stroke="#6EA0C8" stroke-width="6" filter="url(#boardShadow)"/>
    <line x1="40" y1="3" x2="920" y2="3" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>

    <g id="grid-maze" transform="translate(50, 50)">
      <!-- Lưới cơ sở 5x5 -->
      <g fill="#CEE0EC" fill-opacity="0.12" stroke="#BACEDC" stroke-width="1.5">
        <rect x="0" y="0" width="172" height="172"/><rect x="172" y="0" width="172" height="172"/><rect x="344" y="0" width="172" height="172"/><rect x="516" y="0" width="172" height="172"/><rect x="688" y="0" width="172" height="172"/>
        <rect x="0" y="172" width="172" height="172"/><rect x="172" y="172" width="172" height="172"/><rect x="344" y="172" width="172" height="172"/><rect x="516" y="172" width="172" height="172"/><rect x="688" y="172" width="172" height="172"/>
        <rect x="0" y="344" width="172" height="172"/><rect x="172" y="344" width="172" height="172"/><rect x="344" y="344" width="172" height="172"/><rect x="516" y="344" width="172" height="172"/><rect x="688" y="344" width="172" height="172"/>
        <rect x="0" y="516" width="172" height="172"/><rect x="172" y="516" width="172" height="172"/><rect x="344" y="516" width="172" height="172"/><rect x="516" y="516" width="172" height="172"/><rect x="688" y="516" width="172" height="172"/>
        <rect x="0" y="688" width="172" height="172"/><rect x="172" y="688" width="172" height="172"/><rect x="344" y="688" width="172" height="172"/><rect x="516" y="688" width="172" height="172"/><rect x="688" y="688" width="172" height="172"/>
      </g>

      <!-- Cầu thang Start [4,0] & Hố thang Finish [0,4] -->
      <svg x="0" y="688" width="172" height="172" viewBox="0 0 130 130">
        <rect width="130" height="130" fill="#FAF5EB"/><rect x="14" y="14" width="102" height="102" rx="6" fill="#EAE3D2" stroke="#1E283A" stroke-width="3"/>
        <rect x="18" y="18" width="94" height="94" fill="url(#dungeonUpperLight)"/>
        <g stroke="#1E283A" stroke-linecap="round"><line x1="14" y1="18" x2="116" y2="18" stroke-width="3.2"/><polygon points="40,46 90,46 96,59 34,59" fill="#E2D5C0"/><polygon points="28,96 102,96 108,110 22,110" fill="#F7F1E6"/></g>
        <rect x="1" y="1" width="128" height="128" fill="none" stroke="#6285B0" stroke-width="2"/>
      </svg>
      <svg x="688" y="0" width="172" height="172" viewBox="0 0 130 130">
        <rect width="130" height="130" fill="#FAF5EB"/><rect x="14" y="14" width="102" height="102" rx="6" fill="#EAE3D2" stroke="#1E283A" stroke-width="3"/>
        <rect x="18" y="18" width="94" height="94" fill="url(#dungeonDeepVoid)"/>
        <g stroke="#1E283A" stroke-linecap="round"><polygon points="18,18 112,18 106,34 24,34" fill="#F7F1E6"/><polygon points="36,98 94,98 88,106 42,106" fill="#807260"/></g>
        <rect x="1" y="1" width="128" height="128" fill="none" stroke="#6285B0" stroke-width="2"/>
      </svg>

      <!-- Đường vẽ từ Start [4,0] đến [2,2] -->
      <path d="M 86 774 L 86 602 L 86 430 L 258 430 L 430 430" fill="none" stroke="#2575A7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#pathGlow)"/>
      <path d="M 86 774 L 86 602 L 86 430 L 258 430 L 430 430" fill="none" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Con số manh mối CHỈ HIỆN RÕ trong vùng sáng quanh người chơi [2,2] -->
      <g font-family="'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="#2A4860" text-anchor="middle" dominant-baseline="central">
        <text x="258" y="258">2</text><text x="430" y="258">1</text><text x="602" y="258">2</text>
        <text x="258" y="430" opacity="0.4">1</text><text x="430" y="430" opacity="0.4">3</text><text x="602" y="430">2</text>
        <text x="258" y="602">3</text><text x="430" y="602">0</text><text x="602" y="602">2</text>
      </g>

      <!-- Con trỏ người chơi tại tâm (430, 430) -->
      <circle cx="430" cy="430" r="22" fill="#2575A7"/><circle cx="430" cy="430" r="14" fill="#FFFFFF"/><circle cx="430" cy="430" r="7" fill="#2575A7"/>

      <!-- Tường chắn trong tầm nhìn -->
      <line x1="352" y1="344" x2="508" y2="344" stroke="#1E283A" stroke-width="11" stroke-linecap="round"/>
      <line x1="516" y1="352" x2="516" y2="508" stroke="#C4843A" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 7"/>

      <!-- ================= LAYER SƯƠNG MÙ CHE PHỦ (FOG LAYER) ================= -->
      <g id="fog-layer">
        <!-- Hàng 0 phía trên -->
        <rect x="0" y="0" width="860" height="172" fill="#E4EAEF" fill-opacity="0.88"/><rect x="0" y="0" width="860" height="172" fill="url(#fogNoise)"/>
        <!-- Cột trái [1,0], [2,0], [3,0] -->
        <rect x="0" y="172" width="172" height="516" fill="#E4EAEF" fill-opacity="0.88"/><rect x="0" y="172" width="172" height="516" fill="url(#fogNoise)"/>
        <!-- Cột phải [1,4], [2,4], [3,4] -->
        <rect x="688" y="172" width="172" height="516" fill="#E4EAEF" fill-opacity="0.88"/><rect x="688" y="172" width="172" height="516" fill="url(#fogNoise)"/>
        <!-- Hàng 4 phía dưới -->
        <rect x="172" y="688" width="688" height="172" fill="#E4EAEF" fill-opacity="0.88"/><rect x="172" y="688" width="688" height="172" fill="url(#fogNoise)"/>

        <!-- Sương mỏng che nhẹ ô Start & Finish -->
        <rect x="0" y="688" width="172" height="172" fill="#E4EAEF" fill-opacity="0.55"/>
        <text x="86" y="774" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#5A7385">SƯƠNG MÙ</text>

        <rect x="688" y="0" width="172" height="172" fill="#E4EAEF" fill-opacity="0.6"/>
        <text x="774" y="86" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#5A7385">ĐÍCH ẨN</text>

        <!-- Dấu hỏi chấm "?" bí ẩn trong sương mù -->
        <g font-family="'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#9FB3C0" text-anchor="middle" dominant-baseline="central">
          <text x="86" y="86">?</text><text x="258" y="86">?</text><text x="430" y="86">?</text><text x="602" y="86">?</text>
          <text x="86" y="258">?</text><text x="774" y="258">?</text>
          <text x="86" y="430">?</text><text x="774" y="430">?</text>
          <text x="86" y="602">?</text><text x="774" y="602">?</text>
          <text x="258" y="774">?</text><text x="430" y="774">?</text><text x="602" y="774">?</text><text x="774" y="774">?</text>
        </g>
      </g>

      <!-- Anchors sắc nét trong vùng sáng -->
      <use href="#anchor" x="172" y="172"/><use href="#anchor" x="344" y="172"/><use href="#anchor" x="516" y="172"/><use href="#anchor" x="688" y="172"/>
      <use href="#anchor" x="172" y="344"/><use href="#anchor" x="344" y="344"/><use href="#anchor" x="516" y="344"/><use href="#anchor" x="688" y="344"/>
      <use href="#anchor" x="172" y="516"/><use href="#anchor" x="344" y="516"/><use href="#anchor" x="516" y="516"/><use href="#anchor" x="688" y="516"/>
      <use href="#anchor" x="172" y="688"/><use href="#anchor" x="344" y="688"/><use href="#anchor" x="516" y="688"/><use href="#anchor" x="688" y="688"/>
    </g>
  </g>

  <!-- ================= 2. SIDEBAR PHẢI (x: 1050, w: 810) ================= -->
  <!-- Header Top -->
  <g transform="translate(1050, 60)" filter="url(#uiShadow)">
    <rect width="810" height="75" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <line x1="20" y1="0" x2="20" y2="75" stroke="#5A6D7C" stroke-width="3"/>
    <g transform="translate(32, 12)">
      <rect width="50" height="50" rx="14" fill="#FAF5EB" stroke="#6EA0C8" stroke-width="2"/>
      <line x1="17" y1="16" x2="17" y2="34" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="33" y1="16" x2="33" y2="34" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(405, 25)" text-anchor="middle">
      <text y="0" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#5A6D7C" letter-spacing="2">DAILY CHALLENGE · ĐẶC BIỆT</text>
      <text y="30" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="950" fill="#224C6D">FOG OF WAR MAZE 🌫️</text>
    </g>
    <g transform="translate(728, 12)">
      <rect width="50" height="50" rx="14" fill="#FAF5EB" stroke="#6EA0C8" stroke-width="2"/>
      <path d="M 35 18 A 11 11 0 1 0 37 31" fill="none" stroke="#3D83AE" stroke-width="3" stroke-linecap="round"/>
      <polyline points="29,14 36,17 34,24" fill="none" stroke="#3D83AE" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- HUD: Timer & Bảng Sinh Tồn Sương Mù (y: 150, h: 195) -->
  <g transform="translate(1050, 150)" filter="url(#uiShadow)">
    <!-- Thẻ Timer (220px) -->
    <g transform="translate(0, 0)">
      <rect width="220" height="195" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <line x1="18" y1="0" x2="18" y2="195" stroke="#3D83AE" stroke-width="2.5"/>
      <text x="32" y="42" font-family="-apple-system, sans-serif" font-size="17" font-weight="900" fill="#718B9E">⏱️ THỜI GIAN</text>
      <text x="110" y="115" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="48" font-weight="950" fill="#224C6D">00:41</text>
      <rect x="30" y="145" width="160" height="28" rx="8" fill="#F0F7FB"/>
      <text x="110" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#3D83AE">ĐANG DÒ ĐƯỜNG</text>
    </g>

    <!-- Thẻ Sinh Tồn FOG SURVIVAL (570px) -->
    <g transform="translate(240, 0)">
      <rect width="570" height="195" rx="22" fill="#FEFDFA" stroke="#5A6D7C" stroke-width="3"/>
      <line x1="20" y1="0" x2="20" y2="195" stroke="#5A6D7C" stroke-width="3"/>

      <!-- Cột Lượt Thử Lại -->
      <g transform="translate(36, 26)">
        <text x="0" y="16" font-family="sans-serif" font-size="16" font-weight="950" fill="#D84444">❤️ LƯỢT THỬ LẠI</text>
        <text x="0" y="78" font-family="'Segoe UI', sans-serif" font-size="52" font-weight="950" fill="#D84444">2 <tspan font-size="28" fill="#8FA0AC">/ 3</tspan></text>
        <text x="0" y="125" font-family="sans-serif" font-size="13" font-weight="800" fill="#2E7D32">CÒN 2 LẦN VỀ S</text>
      </g>

      <!-- Vạch ngăn cách dọc -->
      <line x1="225" y1="18" x2="225" y2="175" stroke="#E2EBF1" stroke-width="2"/>

      <!-- Cột Tầm Nhìn & Cảnh Báo -->
      <g transform="translate(245, 20)">
        <g transform="translate(0, 0)">
          <rect width="295" height="38" rx="8" fill="#F4F7F9" stroke="#CFD9E0" stroke-width="1.2"/>
          <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#224C6D">👁️ TẦM NHÌN: BÁN KÍNH 1 Ô</text>
        </g>
        <text x="4" y="65" font-family="sans-serif" font-size="13" font-weight="700" fill="#5A6D7C">Sương mù che lại ô đã đi qua</text>

        <!-- Thẻ Cảnh báo đâm tường -->
        <g transform="translate(0, 85)">
          <rect width="295" height="48" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
          <circle cx="20" cy="24" r="10" fill="#D84444"/>
          <text x="20" y="29" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">!</text>
          <text x="38" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#B91C1C">ĐÂM TƯỜNG: VỀ LẠI S</text>
          <text x="38" y="38" font-family="sans-serif" font-size="11" font-weight="700" fill="#7F1D1D">Trừ 1 lượt thử (hết là thua)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Tip Banner -->
  <g transform="translate(1050, 360)" filter="url(#uiShadow)">
    <rect width="810" height="75" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <line x1="20" y1="0" x2="20" y2="75" stroke="#5A6D7C" stroke-width="3.5"/>
    <text x="42" y="44" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#244E6E">
      💡 <tspan font-weight="900" fill="#5A6D7C">Chiến thuật:</tspan> Sương mù chỉ tan quanh bạn 1 ô — đâm tường vô hình sẽ bị đưa về S và trừ 1 lượt thử!
    </text>
  </g>

  <!-- Nút Action Hero: Vẽ Đường -->
  <g transform="translate(1050, 455)" filter="url(#glowActive)" style="cursor: pointer;">
    <rect width="810" height="235" rx="26" fill="#3D83AE" stroke="#215477" stroke-width="4"/>
    <line x1="36" y1="0" x2="36" y2="235" stroke="#FAF5EB" stroke-width="3.5" opacity="0.65"/>
    <g transform="translate(68, 75)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 15 5 L 50 40 L 20 70 L 5 70 L 5 55 Z"/><path d="M 38 28 L 47 37"/>
    </g>
    <text x="180" y="105" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="950" fill="#FFFFFF">VẼ ĐƯỜNG</text>
    <text x="180" y="152" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#BAE6FD">
      Dò từng bước cẩn trọng trong sương • Luôn quan sát manh mối số ô kế bên
    </text>
    <rect x="670" y="90" width="100" height="55" rx="16" fill="#0284C7" stroke="#BAE6FD" stroke-width="2"/>
    <text x="720" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#FFFFFF">ACTIVE</text>
  </g>

  <!-- Hàng nút phụ -->
  <g transform="translate(1050, 715)" filter="url(#uiShadow)">
    <g transform="translate(0, 0)" style="cursor: pointer;">
      <rect width="460" height="165" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3.5"/>
      <line x1="24" y1="0" x2="24" y2="165" stroke="#C4843A" stroke-width="3.5"/>
      <rect x="48" y="48" width="46" height="68" rx="8" fill="none" stroke="#C4843A" stroke-width="4"/>
      <text x="120" y="78" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#224C6D">GHI NHỚ</text>
      <text x="120" y="118" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#718B9E">Cắm cờ tường phát hiện</text>
    </g>

    <g transform="translate(480, 0)" style="cursor: pointer;">
      <rect width="155" height="165" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <g transform="translate(48, 30)">
        <path d="M 33 20 L 18 32 L 33 44" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 20 32 H 38 C 50 32 58 38 58 48 C 58 58 50 64 38 64 H 26" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <text x="77" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#718B9E">UNDO</text>
    </g>

    <g transform="translate(655, 0)" style="cursor: pointer;">
      <rect width="155" height="165" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <g transform="translate(50, 32)">
        <circle cx="28" cy="26" r="22" fill="none" stroke="#F59E0B" stroke-width="4"/>
        <line x1="20" y1="56" x2="36" y2="56" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="77" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#F59E0B">GỢI Ý</text>
    </g>
  </g>

  <!-- Footer Bảng Tình Trạng Thử Thách -->
  <g transform="translate(1050, 930)">
    <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#718B9E">ĐỘ CHE PHỦ SƯƠNG MÙ: 64%</text>
    <text x="810" y="24" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#5A6D7C">ĐÃ MỞ 9 / 25 Ô</text>
    <rect y="36" width="810" height="12" rx="6" fill="#E2EBF1"/><rect y="36" width="310" height="12" rx="6" fill="#5A6D7C"/>
  </g>

  <rect x="840" y="1062" width="240" height="6" rx="3" fill="#1E2830" opacity="0.3"/>
</svg>