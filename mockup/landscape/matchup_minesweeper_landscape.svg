<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Lưới vở học sinh 40px -->
    <pattern id="notebookGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.2"/>
    </pattern>

    <!-- Đổ bóng UI & Board -->
    <filter id="boardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1A2430" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A2430" flood-opacity="0.10"/>
    </filter>
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
    <filter id="heroShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#D84444" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.12"/>
    </filter>
    <filter id="glowActive" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
    <filter id="pathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2575A7" flood-opacity="0.5"/>
    </filter>

    <clipPath id="boardClip"><rect width="960" height="960" rx="30"/></clipPath>

    <!-- Điểm neo giao điểm (Anchor) -->
    <g id="anchor">
      <g stroke="#1E283A" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-16" x2="0" y2="-5"/><line x1="0" y1="5" x2="0" y2="16"/>
        <line x1="-16" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="16" y2="0"/>
      </g>
    </g>

    <!-- Sticker Quả Bom Cổ Điển -->
    <g id="bombSticker">
      <circle cx="0" cy="4" r="26" fill="#2B3646" stroke="#1E283A" stroke-width="3.5"/>
      <circle cx="-9" cy="-5" r="7" fill="#5A6C82" opacity="0.85"/>
      <!-- Gai quả bom -->
      <g stroke="#1E283A" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-30" x2="0" y2="-38"/><line x1="0" y1="38" x2="0" y2="46"/>
        <line x1="-30" y1="4" x2="-38" y2="4"/><line x1="34" y1="4" x2="42" y2="4"/>
        <line x1="-20" y1="-14" x2="-26" y2="-20"/><line x1="22" y1="-14" x2="28" y2="-20"/>
        <line x1="-20" y1="26" x2="-26" y2="32"/><line x1="22" y1="26" x2="28" y2="32"/>
      </g>
      <!-- Ngòi nổ & Tia lửa -->
      <path d="M 7 -26 Q 18 -36 12 -45" fill="none" stroke="#1E283A" stroke-width="3.2"/>
      <g stroke="#D84444" stroke-width="3.5" stroke-linecap="round">
        <line x1="12" y1="-45" x2="6" y2="-52"/><line x1="12" y1="-45" x2="22" y2="-50"/>
        <line x1="12" y1="-45" x2="16" y2="-38"/>
      </g>
    </g>
  </defs>

  <!-- Nền giấy vở & lề đỏ -->
  <rect width="1920" height="1080" fill="#FAF5EB"/>
  <rect width="1920" height="1080" fill="url(#notebookGrid)"/>
  <line x1="80" y1="0" x2="80" y2="1080" stroke="#D84444" stroke-width="3" opacity="0.85"/>

  <!-- ================= 1. BÀN CỜ MINESWEEPER (x: 60, y: 60) ================= -->
  <g transform="translate(60, 60)">
    <g clip-path="url(#boardClip)">
      <rect width="960" height="960" fill="#FEFDFA"/>
      <line x1="44" y1="0" x2="44" y2="960" stroke="#D84444" stroke-width="3"/>
    </g>
    <rect width="960" height="960" rx="30" fill="none" stroke="#6EA0C8" stroke-width="6" filter="url(#boardShadow)"/>
    <line x1="40" y1="3" x2="920" y2="3" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>

    <!-- Lưới 5x5 (Padding 50px, mỗi ô 172x172) -->
    <g id="grid-maze" transform="translate(50, 50)">
      <!-- Lớp nền ô -->
      <g fill="#CEE0EC" fill-opacity="0.12" stroke="#BACEDC" stroke-width="1.5">
        <rect x="0" y="0" width="172" height="172"/><rect x="172" y="0" width="172" height="172"/><rect x="344" y="0" width="172" height="172"/><rect x="516" y="0" width="172" height="172"/><rect x="688" y="0" width="172" height="172"/>
        <rect x="0" y="172" width="172" height="172"/><rect x="172" y="172" width="172" height="172"/><rect x="344" y="172" width="172" height="172"/><rect x="516" y="172" width="172" height="172"/><rect x="688" y="172" width="172" height="172"/>
        <rect x="0" y="344" width="172" height="172"/><rect x="172" y="344" width="172" height="172"/><rect x="344" y="344" width="172" height="172"/><rect x="516" y="344" width="172" height="172"/><rect x="688" y="344" width="172" height="172"/>
        <rect x="0" y="516" width="172" height="172"/><rect x="172" y="516" width="172" height="172"/><rect x="344" y="516" width="172" height="172"/><rect x="516" y="516" width="172" height="172"/><rect x="688" y="516" width="172" height="172"/>
        <rect x="0" y="688" width="172" height="172"/><rect x="172" y="688" width="172" height="172"/><rect x="344" y="688" width="172" height="172"/><rect x="516" y="688" width="172" height="172"/><rect x="688" y="688" width="172" height="172"/>
      </g>

      <!-- Vùng 3x3 hoạt động nổi bật ở trung tâm -->
      <rect x="172" y="172" width="516" height="516" rx="16" fill="none" stroke="#6EA0C8" stroke-width="2.5" stroke-dasharray="8 6"/>

      <!-- Ô START [1, 1] -->
      <g transform="translate(218, 218)">
        <rect width="80" height="80" rx="14" fill="#E7F0F7" stroke="#3D83AE" stroke-width="3.5"/>
        <text x="40" y="56" font-family="'Segoe UI', sans-serif" font-size="52" font-weight="950" fill="#3D83AE" text-anchor="middle">S</text>
      </g>

      <!-- Ô FINISH [3, 3] -->
      <g transform="translate(562, 562)">
        <rect width="80" height="80" rx="14" fill="#E7F0F7" stroke="#3D83AE" stroke-width="3.5"/>
        <text x="40" y="56" font-family="'Segoe UI', sans-serif" font-size="52" font-weight="950" fill="#3D83AE" text-anchor="middle">F</text>
      </g>

      <!-- Đường vẽ người chơi đang đi -->
      <polyline points="258,258 258,430 430,430 602,430 602,602" 
                fill="none" stroke="#2575A7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" filter="url(#pathGlow)"/>
      <polyline points="258,258 258,430 430,430 602,430 602,602" 
                fill="none" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Con số đếm mìn lân cận trên các ô (Font 58px) -->
      <g font-family="'Segoe UI', sans-serif" font-size="58" font-weight="950" fill="#224C6D" text-anchor="middle" dominant-baseline="central">
        <text x="430" y="258">2</text>
        <text x="258" y="430">1</text>
        <text x="430" y="430">3</text>
        <text x="602" y="430">1</text>
        <text x="258" y="602">1</text>
        <text x="430" y="602">2</text>
      </g>

      <!-- QUẢ BOM NỔ TẠI Ô [1, 2] (DẪM TRÚNG MÌN -> THUA) -->
      <g transform="translate(430, 258) scale(1.15)">
        <use href="#bombSticker"/>
      </g>

      <!-- Điểm Neo (Anchors) -->
      <use href="#anchor" x="172" y="172"/><use href="#anchor" x="344" y="172"/><use href="#anchor" x="516" y="172"/><use href="#anchor" x="688" y="172"/>
      <use href="#anchor" x="172" y="344"/><use href="#anchor" x="344" y="344"/><use href="#anchor" x="516" y="344"/><use href="#anchor" x="688" y="344"/>
      <use href="#anchor" x="172" y="516"/><use href="#anchor" x="344" y="516"/><use href="#anchor" x="516" y="516"/><use href="#anchor" x="688" y="516"/>
      <use href="#anchor" x="172" y="688"/><use href="#anchor" x="344" y="688"/><use href="#anchor" x="516" y="688"/><use href="#anchor" x="688" y="688"/>
    </g>

    <!-- Pin Chú thích số 3 trên ô bom -->
    <g transform="translate(530, 270)" filter="url(#uiShadow)">
      <circle r="16" fill="#D84444"/>
      <text y="7" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
    </g>
  </g>

  <!-- ================= 2. SIDEBAR PHẢI (x: 1050, w: 810) ================= -->
  <!-- Header Top -->
  <g transform="translate(1050, 60)" filter="url(#uiShadow)">
    <rect width="810" height="75" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <line x1="20" y1="0" x2="20" y2="75" stroke="#D84444" stroke-width="3"/>
    <g transform="translate(32, 12)">
      <rect width="50" height="50" rx="14" fill="#FAF5EB" stroke="#6EA0C8" stroke-width="2"/>
      <line x1="17" y1="16" x2="17" y2="34" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="33" y1="16" x2="33" y2="34" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(405, 25)" text-anchor="middle">
      <text y="0" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#D84444" letter-spacing="2">DAILY CHALLENGE · MODE MINESWEEPER</text>
      <text y="30" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="950" fill="#224C6D">💣 MINESWEEPER MAZE</text>
    </g>
    <g transform="translate(728, 12)">
      <rect width="50" height="50" rx="14" fill="#FAF5EB" stroke="#6EA0C8" stroke-width="2"/>
      <path d="M 35 18 A 11 11 0 1 0 37 31" fill="none" stroke="#3D83AE" stroke-width="3" stroke-linecap="round"/>
      <polyline points="29,14 36,17 34,24" fill="none" stroke="#3D83AE" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- HUD: Timer Trái & Thẻ Bom Còn Lại To Bản Phải (y: 150, h: 195) -->
  <g transform="translate(1050, 150)">
    <!-- Thẻ 1: Thời gian (240px) -->
    <g transform="translate(0, 0)" filter="url(#uiShadow)">
      <rect width="240" height="195" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <line x1="18" y1="0" x2="18" y2="195" stroke="#3D83AE" stroke-width="2.5"/>
      <text x="32" y="42" font-family="-apple-system, sans-serif" font-size="17" font-weight="900" fill="#718B9E">⏱️ THỜI GIAN</text>
      <text x="120" y="118" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="48" font-weight="950" fill="#224C6D">00:37</text>
      <text x="120" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#8FA0AC">card_time_slip.svg</text>

      <!-- Pin chú thích 1 -->
      <g transform="translate(215, 25)" filter="url(#uiShadow)">
        <circle r="14" fill="#D84444"/>
        <text y="5" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
      </g>
    </g>

    <!-- Thẻ 2: BOM CÒN LẠI (550px, Viền đỏ đậm) -->
    <g transform="translate(260, 0)" filter="url(#heroShadow)">
      <rect width="550" height="195" rx="24" fill="#FEFDFA" stroke="#D84444" stroke-width="4"/>
      <line x1="22" y1="0" x2="22" y2="195" stroke="#D84444" stroke-width="3.5"/>
      
      <g transform="translate(42, 28)">
        <text x="0" y="16" font-family="sans-serif" font-size="20" font-weight="950" fill="#D84444" letter-spacing="1">BOM CÒN LẠI</text>
        <text x="0" y="96" font-family="'Segoe UI', sans-serif" font-size="80" font-weight="950" fill="#D84444">2/3</text>
        <text x="0" y="134" font-family="sans-serif" font-size="14" font-weight="700" fill="#8FA0AC">Đã xác định 1 quả mìn</text>
      </g>

      <!-- Sticker Quả Bom nổi bật bên trong thẻ -->
      <g transform="translate(435, 105) scale(1.35)">
        <use href="#bombSticker"/>
      </g>

      <!-- Pin chú thích 2 -->
      <g transform="translate(525, 25)" filter="url(#uiShadow)">
        <circle r="14" fill="#D84444"/>
        <text y="5" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
      </g>
    </g>
  </g>

  <!-- Tip Banner -->
  <g transform="translate(1050, 360)" filter="url(#uiShadow)">
    <rect width="810" height="75" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <line x1="20" y1="0" x2="20" y2="75" stroke="#F59E0B" stroke-width="3.5"/>
    <text x="42" y="44" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#244E6E">
      💡 <tspan font-weight="900" fill="#D84444">Luật mìn:</tspan> Số trên ô = số mìn trong 8 ô lân cận — dẫm phải mìn là THUA NGAY!
    </text>
  </g>

  <!-- Nút Action Hero: Vẽ Đường -->
  <g transform="translate(1050, 455)" filter="url(#glowActive)" style="cursor: pointer;">
    <rect width="810" height="235" rx="26" fill="#3D83AE" stroke="#215477" stroke-width="4"/>
    <line x1="36" y1="0" x2="36" y2="235" stroke="#FAF5EB" stroke-width="3.5" opacity="0.65"/>
    <g transform="translate(68, 75)">
      <polygon points="10,12 58,45 10,78" fill="#FFFFFF"/>
      <path d="M 58 45 L 85 45" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="195" y="105" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="950" fill="#FFFFFF">VẼ ĐƯỜNG</text>
    <text x="195" y="152" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#BAE6FD">
      Dò tìm tuyến đường an toàn từ ô [S] đến ô [F]
    </text>
    <rect x="670" y="90" width="100" height="55" rx="16" fill="#0284C7" stroke="#BAE6FD" stroke-width="2"/>
    <text x="720" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#FFFFFF">BẬT</text>
  </g>

  <!-- Hàng nút phụ: Ghi Nhớ (Cắm Cờ) + Undo + Hint -->
  <g transform="translate(1050, 715)" filter="url(#uiShadow)">
    <g transform="translate(0, 0)" style="cursor: pointer;">
      <rect width="460" height="165" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3.5"/>
      <line x1="24" y1="0" x2="24" y2="165" stroke="#D84444" stroke-width="3.5"/>
      <rect x="48" y="48" width="46" height="68" rx="8" fill="none" stroke="#D84444" stroke-width="4"/>
      <text x="120" y="78" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#224C6D">GHI NHỚ</text>
      <text x="120" y="118" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#718B9E">Cắm cờ đánh dấu ô có bom</text>
    </g>

    <g transform="translate(480, 0)" style="cursor: pointer;">
      <rect width="155" height="165" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <g transform="translate(48, 30)">
        <path d="M 33 20 L 18 32 L 33 44" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 20 32 H 38 C 50 32 58 38 58 48 C 58 58 50 64 38 64 H 26" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <text x="77" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#718B9E">UNDO</text>
    </g>

    <g transform="translate(655, 0)" style="cursor: pointer;">
      <rect width="155" height="165" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <g transform="translate(50, 32)">
        <circle cx="28" cy="26" r="22" fill="none" stroke="#E0A32A" stroke-width="4"/>
        <line x1="28" y1="14" x2="28" y2="38" stroke="#E0A32A" stroke-width="3"/>
        <line x1="16" y1="26" x2="40" y2="26" stroke="#E0A32A" stroke-width="3"/>
      </g>
      <text x="77" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#E0A32A">HINT</text>
    </g>
  </g>

  <!-- Bảng Chú giải Kỹ thuật (Footer) -->
  <g transform="translate(1050, 915)" filter="url(#uiShadow)">
    <rect width="810" height="120" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2"/>
    <line x1="18" y1="0" x2="18" y2="120" stroke="#3D83AE" stroke-width="2.5"/>
    <g transform="translate(32, 16)">
      <g transform="translate(0, 6)"><circle r="12" fill="#3D83AE"/><text y="5" font-family="sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text></g>
      <text x="22" y="12" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#224C6D">Thẻ THỜI GIAN 250×138 (card_time_slip.svg)</text>

      <g transform="translate(0, 36)"><circle r="12" fill="#3D83AE"/><text y="5" font-family="sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text></g>
      <text x="22" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#224C6D">Thẻ BOM CÒN LẠI 440×158 (card_bomb.svg + sticker icon_bomb.svg)</text>

      <g transform="translate(0, 66)"><circle r="12" fill="#3D83AE"/><text y="5" font-family="sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text></g>
      <text x="22" y="72" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#224C6D">Số = số mìn 8 ô lân cận · đạp mìn = THUA NGAY + hiện icon Bomb</text>
    </g>
    <text x="790" y="105" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#718B9E">mode_id: minesweeper · minesweep_hud.tscn</text>
  </g>

  <rect x="840" y="1062" width="240" height="6" rx="3" fill="#1E2830" opacity="0.3"/>
</svg>