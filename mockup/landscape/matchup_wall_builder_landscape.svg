<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Lưới vở học sinh 40px -->
    <pattern id="notebookGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.2"/>
    </pattern>

    <!-- Bộ lọc đổ bóng UI & Bàn cờ -->
    <filter id="boardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1A2430" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A2430" flood-opacity="0.10"/>
    </filter>
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
    <filter id="glowSubmit" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15803D" flood-opacity="0.35"/>
    </filter>
    <filter id="glowDraw" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>

    <clipPath id="boardClip"><rect width="960" height="960" rx="30"/></clipPath>

    <!-- Điểm neo giao điểm (Anchor) -->
    <g id="anchor">
      <g stroke="#1E283A" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-16" x2="0" y2="-5"/><line x1="0" y1="5" x2="0" y2="16"/>
        <line x1="-16" y1="0" x2="-5" y2="0"/><line x1="5" y1="0" x2="16" y2="0"/>
      </g>
    </g>
  </defs>

  <!-- Nền giấy vở & lề đỏ -->
  <rect width="1920" height="1080" fill="#FAF5EB"/>
  <rect width="1920" height="1080" fill="url(#notebookGrid)"/>
  <line x1="80" y1="0" x2="80" y2="1080" stroke="#D84444" stroke-width="3" opacity="0.85"/>

  <!-- ================= 1. BÀN CỜ 25 Ô ĐỒNG NHẤT (x: 60, y: 60) ================= -->
  <g transform="translate(60, 60)">
    <g clip-path="url(#boardClip)">
      <rect width="960" height="960" fill="#FEFDFA"/>
      <line x1="44" y1="0" x2="44" y2="960" stroke="#D84444" stroke-width="3"/>
    </g>
    <!-- Viền ngoài = Tường cố định viền ngoài dày 8px màu đen -->
    <rect width="960" height="960" rx="30" fill="none" stroke="#1E283A" stroke-width="8" filter="url(#boardShadow)"/>
    <line x1="40" y1="3" x2="920" y2="3" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>

    <!-- LƯỚI 5x5 CELL (Padding 50px, mỗi ô 172 x 172 px) -->
    <g id="grid-maze" transform="translate(50, 50)">

      <!-- Lớp 1: Nền 25 ô vuông phẳng đồng nhất (Không có ô cầu thang S/F) -->
      <g fill="#CEE0EC" fill-opacity="0.12" stroke="#BACEDC" stroke-width="1.5">
        <rect x="0" y="0" width="172" height="172"/><rect x="172" y="0" width="172" height="172"/><rect x="344" y="0" width="172" height="172"/><rect x="516" y="0" width="172" height="172"/><rect x="688" y="0" width="172" height="172"/>
        <rect x="0" y="172" width="172" height="172"/><rect x="172" y="172" width="172" height="172"/><rect x="344" y="172" width="172" height="172"/><rect x="516" y="172" width="172" height="172"/><rect x="688" y="172" width="172" height="172"/>
        <rect x="0" y="344" width="172" height="172"/><rect x="172" y="344" width="172" height="172"/><rect x="344" y="344" width="172" height="172"/><rect x="516" y="344" width="172" height="172"/><rect x="688" y="344" width="172" height="172"/>
        <rect x="0" y="516" width="172" height="172"/><rect x="172" y="516" width="172" height="172"/><rect x="344" y="516" width="172" height="172"/><rect x="516" y="516" width="172" height="172"/><rect x="688" y="516" width="172" height="172"/>
        <rect x="0" y="688" width="172" height="172"/><rect x="172" y="688" width="172" height="172"/><rect x="344" y="688" width="172" height="172"/><rect x="516" y="688" width="172" height="172"/><rect x="688" y="688" width="172" height="172"/>
      </g>

      <!-- Highlight các ô đã đủ tường (xanh lục nhạt) và ô đang tư duy (vàng nhạt) -->
      <rect x="0"   y="0"   width="172" height="172" fill="#E8F5E9" fill-opacity="0.4"/>
      <rect x="688" y="344" width="172" height="172" fill="#E8F5E9" fill-opacity="0.4"/>
      <rect x="344" y="344" width="172" height="172" fill="#FFF8E1" fill-opacity="0.45"/>

      <!-- CON SỐ TRÊN TOÀN BỘ 25 Ô (KỂ CẢ SỐ 0 THEO GDD §5.13) -->
      <g font-family="'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="#2A4860" text-anchor="middle" dominant-baseline="central">
        <!-- Hàng 0 -->
        <text x="86"  y="86">1</text><text x="258" y="86">2</text><text x="430" y="86">1</text><text x="602" y="86">2</text><text x="774" y="86">1</text>
        <!-- Hàng 1 -->
        <text x="86"  y="258">2</text><text x="258" y="258">3</text><text x="430" y="258">2</text><text x="602" y="258">1</text><text x="774" y="258">2</text>
        <!-- Hàng 2 (Số 0 hiển thị rõ nét) -->
        <text x="86"  y="430" fill="#718B9E">0</text><text x="258" y="430">2</text><text x="430" y="430" fill="#2575A7">1</text><text x="602" y="430">3</text><text x="774" y="430">1</text>
        <!-- Hàng 3 -->
        <text x="86"  y="602">2</text><text x="258" y="602">1</text><text x="430" y="602">3</text><text x="602" y="602">2</text><text x="774" y="602">2</text>
        <!-- Hàng 4 (Số 0) -->
        <text x="86"  y="774">1</text><text x="258" y="774">2</text><text x="430" y="774" fill="#718B9E">0</text><text x="602" y="774">2</text><text x="774" y="774">1</text>
      </g>

      <!-- 14 ĐOẠN TƯỜNG ĐÃ DỰNG (Màu đen đặc dày 11px chuẩn giữa các Anchor) -->
      <g stroke="#1E283A" stroke-width="11" stroke-linecap="round">
        <line x1="172" y1="8"   x2="172" y2="164"/>
        <line x1="180" y1="172" x2="336" y2="172"/>
        <line x1="344" y1="8"   x2="344" y2="164"/>
        <line x1="524" y1="172" x2="680" y2="172"/>
        <line x1="688" y1="8"   x2="688" y2="164"/>

        <line x1="172" y1="180" x2="172" y2="336"/>
        <line x1="344" y1="180" x2="344" y2="336"/>
        <line x1="180" y1="344" x2="336" y2="344"/>
        <line x1="524" y1="344" x2="680" y2="344"/>

        <line x1="516" y1="352" x2="516" y2="508"/>
        <line x1="688" y1="352" x2="688" y2="508"/>

        <line x1="352" y1="516" x2="508" y2="516"/>
        <line x1="344" y1="524" x2="344" y2="680"/>
        <line x1="524" y1="688" x2="680" y2="688"/>
      </g>

      <!-- ĐOẠN TƯỜNG THỨ 15 ĐANG ĐƯỢC CHẠM KÉO NỐI (Màu cam hổ phách nét đứt) -->
      <line x1="524" y1="516" x2="680" y2="516" stroke="#C4843A" stroke-width="9" stroke-linecap="round" stroke-dasharray="10 6"/>
      <circle cx="602" cy="516" r="10" fill="#C4843A"/>
      <circle cx="602" cy="516" r="4.5" fill="#FFFFFF"/>

      <!-- MA TRẬN 36 ANCHOR (6x6) -->
      <use href="#anchor" x="0" y="0"/><use href="#anchor" x="172" y="0"/><use href="#anchor" x="344" y="0"/><use href="#anchor" x="516" y="0"/><use href="#anchor" x="688" y="0"/><use href="#anchor" x="860" y="0"/>
      <use href="#anchor" x="0" y="172"/><use href="#anchor" x="172" y="172"/><use href="#anchor" x="344" y="172"/><use href="#anchor" x="516" y="172"/><use href="#anchor" x="688" y="172"/><use href="#anchor" x="860" y="172"/>
      <use href="#anchor" x="0" y="344"/><use href="#anchor" x="172" y="344"/><use href="#anchor" x="344" y="344"/><use href="#anchor" x="516" y="344"/><use href="#anchor" x="688" y="344"/><use href="#anchor" x="860" y="344"/>
      
      <!-- Anchor đang chạm nối tại Hàng 3 -->
      <use href="#anchor" x="0" y="516"/><use href="#anchor" x="172" y="516"/><use href="#anchor" x="344" y="516"/>
      <g transform="translate(516, 516)">
        <circle cx="0" cy="0" r="24" fill="#C4843A" fill-opacity="0.22"/>
        <use href="#anchor" x="0" y="0"/>
      </g>
      <g transform="translate(688, 516)">
        <circle cx="0" cy="0" r="24" fill="#C4843A" fill-opacity="0.22"/>
        <circle cx="0" cy="0" r="24" fill="none" stroke="#C4843A" stroke-width="2" stroke-dasharray="4 3"/>
        <use href="#anchor" x="0" y="0"/>
      </g>
      <use href="#anchor" x="860" y="516"/>

      <use href="#anchor" x="0" y="688"/><use href="#anchor" x="172" y="688"/><use href="#anchor" x="344" y="688"/><use href="#anchor" x="516" y="688"/><use href="#anchor" x="688" y="688"/><use href="#anchor" x="860" y="688"/>
      <use href="#anchor" x="0" y="860"/><use href="#anchor" x="172" y="860"/><use href="#anchor" x="344" y="860"/><use href="#anchor" x="516" y="860"/><use href="#anchor" x="688" y="860"/><use href="#anchor" x="860" y="860"/>
    </g>
  </g>

  <!-- ================= 2. SIDEBAR PHẢI (x: 1050, w: 810) ================= -->
  <!-- Header Top -->
  <g transform="translate(1050, 60)" filter="url(#uiShadow)">
    <rect width="810" height="75" rx="20" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <line x1="20" y1="0" x2="20" y2="75" stroke="#2E7D32" stroke-width="3.5"/>
    <g transform="translate(32, 12)">
      <rect width="50" height="50" rx="14" fill="#FAF5EB" stroke="#6EA0C8" stroke-width="2"/>
      <line x1="17" y1="16" x2="17" y2="34" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="33" y1="16" x2="33" y2="34" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(405, 25)" text-anchor="middle">
      <text y="0" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#2E7D32" letter-spacing="2">DAILY CHALLENGE · ĐẶC BIỆT</text>
      <text y="30" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="950" fill="#224C6D">🧱 XÂY TƯỜNG (WALL BUILDER)</text>
    </g>
    <g transform="translate(728, 12)">
      <rect width="50" height="50" rx="14" fill="#FAF5EB" stroke="#6EA0C8" stroke-width="2"/>
      <path d="M 35 18 A 11 11 0 1 0 37 31" fill="none" stroke="#3D83AE" stroke-width="3" stroke-linecap="round"/>
      <polyline points="29,14 36,17 34,24" fill="none" stroke="#3D83AE" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- HUD: Timer Trái & Bảng Tiến Độ Dựng Tường + Lượt Gửi Phải (y: 150, h: 185) -->
  <g transform="translate(1050, 150)" filter="url(#uiShadow)">
    <!-- Thẻ 1: Thời gian (240px) -->
    <g transform="translate(0, 0)">
      <rect width="240" height="185" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <line x1="18" y1="0" x2="18" y2="185" stroke="#3D83AE" stroke-width="2.5"/>
      <text x="32" y="42" font-family="-apple-system, sans-serif" font-size="17" font-weight="900" fill="#718B9E">⏱️ THỜI GIAN</text>
      <text x="120" y="112" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="48" font-weight="950" fill="#224C6D">01:15</text>
      <rect x="42" y="138" width="156" height="26" rx="8" fill="#F0F7FB"/>
      <text x="120" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#3D83AE">ĐANG SUY LUẬN</text>
    </g>

    <!-- Thẻ 2: Tiến độ dựng tường & Lượt gửi (550px) -->
    <g transform="translate(260, 0)">
      <rect width="550" height="185" rx="22" fill="#FEFDFA" stroke="#2E7D32" stroke-width="3"/>
      <line x1="20" y1="0" x2="20" y2="185" stroke="#2E7D32" stroke-width="3"/>

      <!-- Cột Đoạn tường đã dựng -->
      <g transform="translate(36, 24)">
        <text x="0" y="16" font-family="sans-serif" font-size="15" font-weight="900" fill="#2E7D32" letter-spacing="0.5">🧱 ĐÃ DỰNG</text>
        <text x="0" y="74" font-family="'Segoe UI', sans-serif" font-size="48" font-weight="950" fill="#224C6D">14<tspan font-size="24" fill="#8FA0AC"> / 18 ĐOẠN</tspan></text>
        <text x="0" y="115" font-family="sans-serif" font-size="13" font-weight="900" fill="#D84444">CÒN THIẾU 4 ĐOẠN</text>
      </g>

      <!-- Vạch phân tách dọc -->
      <line x1="225" y1="18" x2="225" y2="165" stroke="#E2EBF1" stroke-width="2"/>

      <!-- Cột Lượt gửi & Slider -->
      <g transform="translate(245, 20)">
        <g transform="translate(0, 0)">
          <rect width="280" height="34" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
          <text x="12" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#D84444">❤️ LƯỢT GỬI: 3 / 3 LẦN</text>
        </g>

        <!-- Slider tiến độ (14/18 = 77%) -->
        <g transform="translate(0, 52)">
          <rect width="280" height="14" rx="7" fill="#EAE4D5" stroke="#90BBD4" stroke-width="1"/>
          <rect width="216" height="14" rx="7" fill="#22C55E"/>
        </g>
        <text x="0" y="95" font-family="sans-serif" font-size="13" font-weight="700" fill="#5A6D7C">Nối đủ tường rồi bấm GỬI</text>
        <text x="0" y="118" font-family="sans-serif" font-size="12" font-weight="900" fill="#D84444">⚠️ Mỗi lần gửi sai trừ 1 lượt</text>
      </g>
    </g>
  </g>

  <!-- Tip Banner -->
  <g transform="translate(1050, 350)" filter="url(#uiShadow)">
    <rect width="810" height="75" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <line x1="20" y1="0" x2="20" y2="75" stroke="#F59E0B" stroke-width="3.5"/>
    <text x="42" y="44" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#244E6E">
      💡 <tspan font-weight="900" fill="#2E7D32">Luật chơi:</tspan> Nối đủ và đúng các đoạn tường quanh ô theo số rồi bấm GỬI! Ô số 0 không có tường.
    </text>
  </g>

  <!-- CỤM CÔNG CỤ: 2 NÚT TO SONG SONG (VẼ TƯỜNG & GỬI BÀI) (y: 440, h: 210) -->
  <g transform="translate(1050, 440)">
    <!-- NÚT 1: VẼ TƯỜNG (395px, Màu xanh dương) -->
    <g transform="translate(0, 0)" filter="url(#glowDraw)" style="cursor: pointer;">
      <rect width="395" height="210" rx="26" fill="#3D83AE" stroke="#215477" stroke-width="4"/>
      <line x1="32" y1="0" x2="32" y2="210" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
      <g transform="translate(56, 52)" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round">
        <rect x="0" y="4" width="42" height="34" rx="6" stroke-width="3.2"/>
        <line x1="0" y1="21" x2="42" y2="21"/>
        <line x1="21" y1="4" x2="21" y2="21"/>
      </g>
      <text x="125" y="80" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#FFFFFF">VẼ TƯỜNG</text>
      <text x="56" y="145" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#BAE6FD">
        Chạm kéo giữa 2 Anchor lân cận
      </text>
      <rect x="290" y="55" width="80" height="42" rx="12" fill="#0284C7" stroke="#BAE6FD" stroke-width="1.8"/>
      <text x="330" y="82" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#FFFFFF">BẬT</text>
    </g>

    <!-- NÚT 2: GỬI BÀI (395px, Màu xanh lục nổi bật) -->
    <g transform="translate(415, 0)" filter="url(#glowSubmit)" style="cursor: pointer;">
      <rect width="395" height="210" rx="26" fill="#15803D" stroke="#0F5127" stroke-width="4"/>
      <line x1="32" y1="0" x2="32" y2="210" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
      <g transform="translate(56, 50)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="19" stroke-width="3.2"/>
        <path d="M 12 20 L 18 26 L 29 14"/>
      </g>
      <text x="125" y="80" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="950" fill="#FFFFFF" letter-spacing="1">GỬI BÀI</text>
      <text x="56" y="145" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#DCFCE7">
        Kiểm tra độ chính xác toàn bàn
      </text>
      <rect x="290" y="55" width="80" height="42" rx="12" fill="#22C55E" stroke="#DCFCE7" stroke-width="1.8"/>
      <text x="330" y="82" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#FFFFFF">3 LẦN</text>
    </g>
  </g>

  <!-- HÀNG NÚT PHỤ: UNDO (395px) & HINT (395px) (y: 670, h: 140) -->
  <g transform="translate(1050, 670)" filter="url(#uiShadow)">
    <g transform="translate(0, 0)" style="cursor: pointer;">
      <rect width="395" height="140" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <g transform="translate(48, 48)">
        <path d="M 33 20 L 18 32 L 33 44" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M 20 32 H 38 C 50 32 58 38 58 48 C 58 58 50 64 38 64 H 26" fill="none" stroke="#3D83AE" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <text x="130" y="68" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#224C6D">HOÀN TÁC (UNDO)</text>
      <text x="130" y="100" font-family="sans-serif" font-size="16" font-weight="700" fill="#718B9E">Xóa đoạn tường vừa nối</text>
    </g>

    <g transform="translate(415, 0)" style="cursor: pointer;">
      <rect width="395" height="140" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      <g transform="translate(48, 45)">
        <circle cx="28" cy="26" r="22" fill="none" stroke="#F59E0B" stroke-width="4"/>
        <line x1="20" y1="56" x2="36" y2="56" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="130" y="68" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#F59E0B">GỢI Ý (HINT)</text>
      <text x="130" y="100" font-family="sans-serif" font-size="16" font-weight="700" fill="#718B9E">Khóa 1 đoạn tường chuẩn</text>
    </g>
  </g>

  <!-- BẢNG THÔNG TIN KỸ THUẬT (FOOTER) (y: 830, h: 205) -->
  <g transform="translate(1050, 830)" filter="url(#uiShadow)">
    <rect width="810" height="205" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <line x1="20" y1="0" x2="20" y2="205" stroke="#2E7D32" stroke-width="3"/>

    <g transform="translate(40, 24)">
      <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="950" fill="#224C6D">
        📋 ĐẶC TẢ CƠ CHẾ XÂY TƯỜNG (GDD §5.13)
      </text>
      <text x="0" y="48" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#5A6D7C">
        • Không có Start/Finish — mục tiêu là tái hiện mạng lưới tường phân chia mê cung gốc.
      </text>
      <text x="0" y="76" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#5A6D7C">
        • Số trên ô = số đoạn tường bao quanh; ô số 0 không được có bất kỳ tường nào bao quanh.
      </text>
      <text x="0" y="104" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#5A6D7C">
        • Người chơi có tối đa 3 lần bấm [GỬI BÀI] để kiểm tra toàn bàn.
      </text>
      <text x="0" y="152" font-family="monospace" font-size="13" font-weight="700" fill="#718B9E">
        SCENE: scenes/wall_builder_hud.tscn (WallBuilderHUD) · mode_id = wall_builder
      </text>
    </g>
  </g>

  <rect x="840" y="1062" width="240" height="6" rx="3" fill="#1E2830" opacity="0.3"/>
</svg>