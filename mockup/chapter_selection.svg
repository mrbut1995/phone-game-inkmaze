        <!-- 28/45 sao = 62% (236px) -->
        <rect width="236" height="14" rx="7" fill="#D97706"/>
        
        <text x="0" y="38" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="900" fill="#718B9E">
          ⭐ 28 / 45 Sao
        </text>
        <rect x="135" y="20" width="145" height="26" rx="6" fill="#FEE2E2"/>
        <text x="207" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#B91C1C">
          CÒN THIẾU 17 ⭐
        </text>
      </g>
    </g>

    <!-- NÚT KHÓA / YÊU CẦU SAO -->
    <g transform="translate(710, 100)">
