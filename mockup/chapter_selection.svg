        <rect width="355" height="14" rx="7" fill="#3D83AE"/>
        <text x="0" y="38" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#224C6D">
          ⭐ 28 / 30 Sao <tspan font-weight="600" fill="#718B9E">(9/10 Màn)</tspan>
        </text>
      </g>
    </g>

    <!-- NÚT VÀO CHƠI TIẾP -->
    <g transform="translate(730, 105)" filter="url(#uiShadow)" style="cursor: pointer;">
      <rect width="200" height="85" rx="20" fill="#3D83AE" stroke="#235A7D" stroke-width="3"/>
      <text x="100" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#FFFFFF">VÀO CHƠI</text>
      <text x="100" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#BAE6FD">Màn 07 ›</text>
    </g>
  </g>

  <!-- ================= CHƯƠNG 2 (ĐỦ SAO MỞ KHÓA - FOCUS HIGHLIGHT) ================= -->
  <g transform="translate(55, 595)" filter="url(#focusShadow)">
    <!-- Viền nét đứt hào quang bao quanh -->
    <rect x="-6" y="-6" width="982" height="297" rx="28" fill="none" stroke="#C4843A" stroke-width="3.5" stroke-dasharray="8 6"/>

    <g clip-path="url(#chapterCardClip)">
      <rect width="970" height="285" fill="#FFFDF8"/>
      <path d="M 0 70 L 970 70 M 0 140 L 970 140 M 0 210 L 970 210" stroke="#8FB9D2" stroke-width="1" opacity="0.4"/>
      <line x1="42" y1="0" x2="42" y2="285" stroke="#D84444" stroke-width="3.5"/>
    </g>
    <rect width="970" height="285" rx="24" fill="none" stroke="#C4843A" stroke-width="4"/>

    <!-- Nhãn góc: SẴN SÀNG MỞ KHÓA -->
    <path d="M 780 0 L 945 0 A 24 24 0 0 1 970 24 L 970 46 L 760 46 Z" fill="#D97706"/>
    <text x="865" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="1">ĐÃ ĐỦ ĐIỀU KIỆN</text>

    <!-- Doodle Mê cung 7x7 -->
    <g transform="translate(68, 48)" stroke="#C4843A" stroke-linecap="round">
      <rect x="0" y="0" width="180" height="180" rx="16" fill="#FEF3C7" fill-opacity="0.3" stroke-width="2.5"/>
      <g stroke-width="1" opacity="0.35">
        <line x1="26" y1="0" x2="26" y2="180"/><line x1="52" y1="0" x2="52" y2="180"/>
        <line x1="78" y1="0" x2="78" y2="180"/><line x1="104" y1="0" x2="104" y2="180"/>
        <line x1="130" y1="0" x2="130" y2="180"/><line x1="156" y1="0" x2="156" y2="180"/>
        <line x1="0" y1="26" x2="180" y2="26"/><line x1="0" y1="52" x2="180" y2="52"/>
        <line x1="0" y1="78" x2="180" y2="78"/><line x1="0" y1="104" x2="180" y2="104"/>
        <line x1="0" y1="130" x2="180" y2="130"/><line x1="0" y1="156" x2="180" y2="156"/>
      </g>
      <!-- Đường quanh co -->
      <path d="M 13 167 L 13 117 L 65 117 L 65 65 L 117 65 L 117 13 L 167 13" fill="none" stroke="#D97706" stroke-width="6" stroke-linejoin="round"/>
      <text x="13" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#2E7D32" stroke="none">S</text>
      <text x="167" y="18" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#D84444" stroke="none">F</text>
    </g>

    <!-- THÔNG TIN CHƯƠNG -->
    <g transform="translate(280, 50)">
      <rect width="125" height="28" rx="7" fill="#FEF3C7"/>
      <text x="62" y="19" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#92400E">KÍCH THƯỚC 7×7</text>

      <text x="0" y="62" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#224C6D">CHƯƠNG 2: SUY LUẬN</text>
      <text x="0" y="96" font-family="sans-serif" font-size="18" font-weight="600" fill="#718B9E">Mê cung rộng hơn với mật độ tường tăng cao</text>

      <!-- YÊU CẦU MỞ KHÓA: ĐÃ ĐỦ SAO -->
      <g transform="translate(0, 125)">
        <rect width="240" height="34" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
        <text x="12" y="23" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#15803D">
          ✓ ĐÃ ĐỦ: 28 / 25 SAO
        </text>
      </g>
    </g>

    <!-- NÚT MỞ KHÓA BẰNG SAO -->
    <g transform="translate(710, 95)" filter="url(#uiShadow)" style="cursor: pointer;">
      <rect width="225" height="95" rx="22" fill="#D97706" stroke="#92400E" stroke-width="3.5"/>
      <g transform="translate(22, 28) scale(0.9)"><use href="#star-full"/></g>
      <text x="135" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#FFFFFF">MỞ KHÓA</text>
      <text x="135" y="70" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="900" fill="#FEF3C7">CẦN 25 ⭐</text>
    </g>
