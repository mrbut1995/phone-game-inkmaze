      <text x="62" y="19" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#718B9E">KÍCH THƯỚC 8×8</text>

      <text x="0" y="62" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#718B9E">CHƯƠNG 3: BẪY ẨN</text>
