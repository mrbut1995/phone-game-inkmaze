        <line x1="30" y1="0" x2="30" y2="180"/><line x1="60" y1="0" x2="60" y2="180"/>
        <line x1="90" y1="0" x2="90" y2="180"/><line x1="120" y1="0" x2="120" y2="180"/>
        <line x1="150" y1="0" x2="150" y2="180"/>
        <line x1="0" y1="30" x2="180" y2="30"/><line x1="0" y1="60" x2="180" y2="60"/>
        <line x1="0" y1="90" x2="180" y2="90"/><line x1="0" y1="120" x2="180" y2="120"/>
        <line x1="0" y1="150" x2="180" y2="150"/>
      </g>
      <!-- Ổ khóa lớn ở giữa -->
