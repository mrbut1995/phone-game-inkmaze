  <!-- ================= CHƯƠNG 4 (BẬC THẦY - KHÓA SÂU) ================= -->
  <g transform="translate(55, 1225)" opacity="0.75">
    <g clip-path="url(#chapterCardClip)">
      <rect width="970" height="285" fill="#EFECE6"/>
      <line x1="42" y1="0" x2="42" y2="285" stroke="#C5A8A8" stroke-width="2.5" stroke-dasharray="6 4"/>
    </g>
    <rect width="970" height="285" rx="24" fill="none" stroke="#A7B9C3" stroke-width="2.5"/>

    <!-- Doodle Mê cung 9x9 Khóa -->
    <g transform="translate(68, 48)">
      <rect x="0" y="0" width="180" height="180" rx="16" fill="#E4E0D7" stroke="#A7B9C3" stroke-width="2"/>
      <g transform="translate(90, 95) scale(1.3)"><use href="#lock-icon"/></g>
    </g>

    <!-- THÔNG TIN CHƯƠNG -->
    <g transform="translate(280, 50)">
      <rect width="125" height="28" rx="7" fill="#E2DDD5"/>
      <text x="62" y="19" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#718B9E">KÍCH THƯỚC 9×9</text>

      <text x="0" y="62" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#718B9E">CHƯƠNG 4: BẬC THẦY</text>
      <text x="0" y="96" font-family="sans-serif" font-size="18" font-weight="600" fill="#8C9CA8">Mê cung khổng lồ dành cho cao thủ suy luận</text>

      <!-- YÊU CẦU: 70 SAO -->
      <g transform="translate(0, 120)">
