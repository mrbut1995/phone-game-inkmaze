        <rect width="152" height="14" rx="7" fill="#8FB9D2"/>
        <text x="0" y="38" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="900" fill="#718B9E">
          ⭐ 28 / 70 Sao <tspan font-size="14" fill="#A7B9C3">• Mở sau Chương 3</tspan>
