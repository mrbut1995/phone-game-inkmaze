      <g transform="translate(50, 42) scale(0.9)"><use href="#lock-icon"/></g>
      <text x="135" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#718B9E">CẦN 45 ⭐</text>
      <text x="135" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#8C9CA8">Chưa đủ sao</text>
