    <!-- THÔNG TIN CHƯƠNG -->
    <g transform="translate(280, 50)">
      <rect width="125" height="28" rx="7" fill="#EBF3F8"/>
      <text x="62" y="19" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#256286">KÍCH THƯỚC 5×5</text>

      <text x="0" y="62" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#224C6D">CHƯƠNG 1: NHẬP MÔN</text>
      <text x="0" y="96" font-family="sans-serif" font-size="18" font-weight="600" fill="#718B9E">Làm quen với các quy luật bước &amp; tường</text>

