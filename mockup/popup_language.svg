<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Lưới vở mờ nền -->
    <pattern id="langGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
    </pattern>

    <!-- Đổ bóng nổi của mảnh giấy chọn ngôn ngữ -->
    <filter id="langPaperShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#1E2830" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1E2830" flood-opacity="0.12"/>
    </filter>

    <filter id="clipShadowLang" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- LỚP NỀN TRANG VỞ VỚI ĐỘ MỜ DỊU TỰ NHIÊN -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#langGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.38"/>

  <!-- ================= MẢNH GIẤY CHỌN NGÔN NGỮ (780 x 1120 px) ================= -->
  <!-- Đặt tại x=150, y=400 -->
  <g transform="translate(150, 400)">

    <!-- THÂN GIẤY TRẮNG NGÀ -->
    <g filter="url(#langPaperShadow)">
      <rect width="780" height="1120" rx="22" fill="#FFFDF8"/>

      <!-- Hàng lỗ bấm ghim sổ tay mép trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="24" cy="80" r="7"/><circle cx="24" cy="180" r="7"/><circle cx="24" cy="280" r="7"/>
        <circle cx="24" cy="380" r="7"/><circle cx="24" cy="480" r="7"/><circle cx="24" cy="580" r="7"/>
        <circle cx="24" cy="680" r="7"/><circle cx="24" cy="780" r="7"/><circle cx="24" cy="880" r="7"/>
        <circle cx="24" cy="980" r="7"/><circle cx="24" cy="1080" r="7"/>
      </g>

      <!-- Đường kẻ lề đỏ -->
      <line x1="75" y1="0" x2="75" y2="1120" stroke="#D84444" stroke-width="2.5" opacity="0.85"/>
      <rect width="780" height="1120" rx="22" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    </g>

    <!-- BĂNG DÍNH WASHI TAPE Ở ĐỈNH GIỮA -->
    <g transform="translate(280, -22)">
      <rect width="220" height="48" rx="4" fill="#E8DFCA" fill-opacity="0.85" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" 
            stroke="#B5A98F" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- GHIM KẸP GIẤY KIM LOẠI Ở GÓC TRÊN TRÁI -->
    <g transform="translate(95, -18)" filter="url(#clipShadowLang)">
      <path d="M 0 50 L 0 12 A 12 12 0 0 1 24 12 L 24 60 A 18 18 0 0 1 -12 60 L -12 18" 
            fill="none" stroke="#7A8F9B" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- TIÊU ĐỀ POPUP -->
    <g transform="translate(110, 80)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#224C6D">CHỌN NGÔN NGỮ</text>
      <text x="0" y="32" font-family="sans-serif" font-size="18" font-weight="700" fill="#718B9E">Select your preferred language</text>
    </g>

    <line x1="110" y1="140" x2="710" y2="140" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- ================= DANH SÁCH 6 NGÔN NGỮ (> 2 NGÔN NGỮ) ================= -->
    <g transform="translate(110, 170)">

      <!-- 1. TIẾNG VIỆT (ĐANG CHỌN - ACTIVE) -->
      <g transform="translate(0, 0)" style="cursor: pointer;">
        <rect width="600" height="90" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
        <text x="30" y="44" font-size="30">🇻🇳</text>
        <text x="80" y="42" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#2E7D32">Tiếng Việt</text>
        <text x="80" y="68" font-family="sans-serif" font-size="15" font-weight="700" fill="#4B6A82">Mặc định hệ thống</text>
        <!-- Dấu tick mực đỏ xác nhận -->
        <path d="M 530 45 L 542 57 L 565 33" fill="none" stroke="#D84444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- 2. ENGLISH (US) -->
      <g transform="translate(0, 110)" style="cursor: pointer;">
        <rect width="600" height="90" rx="16" fill="#FEFDFA" stroke="#D1E2ED" stroke-width="2"/>
        <text x="30" y="44" font-size="30">🇺🇸</text>
        <text x="80" y="42" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#224C6D">English</text>
        <text x="80" y="68" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">United States</text>
      </g>

      <!-- 3. 日本語 (JAPANESE) -->
      <g transform="translate(0, 220)" style="cursor: pointer;">
        <rect width="600" height="90" rx="16" fill="#FEFDFA" stroke="#D1E2ED" stroke-width="2"/>
        <text x="30" y="44" font-size="30">🇯🇵</text>
        <text x="80" y="42" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#224C6D">日本語</text>
        <text x="80" y="68" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Japanese</text>
      </g>

      <!-- 4. 한국어 (KOREAN) -->
      <g transform="translate(0, 330)" style="cursor: pointer;">
        <rect width="600" height="90" rx="16" fill="#FEFDFA" stroke="#D1E2ED" stroke-width="2"/>
        <text x="30" y="44" font-size="30">🇰🇷</text>
        <text x="80" y="42" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#224C6D">한국어</text>
        <text x="80" y="68" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Korean</text>
      </g>

      <!-- 5. 中文 (CHINESE) -->
      <g transform="translate(0, 440)" style="cursor: pointer;">
        <rect width="600" height="90" rx="16" fill="#FEFDFA" stroke="#D1E2ED" stroke-width="2"/>
        <text x="30" y="44" font-size="30">🇨🇳</text>
        <text x="80" y="42" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#224C6D">简体中文</text>
        <text x="80" y="68" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">Simplified Chinese</text>
      </g>

      <!-- 6. FRANÇAIS (FRENCH) -->
      <g transform="translate(0, 550)" style="cursor: pointer;">
        <rect width="600" height="90" rx="16" fill="#FEFDFA" stroke="#D1E2ED" stroke-width="2"/>
        <text x="30" y="44" font-size="30">🇫🇷</text>
        <text x="80" y="42" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#224C6D">Français</text>
        <text x="80" y="68" font-family="sans-serif" font-size="15" font-weight="600" fill="#718B9E">French</text>
      </g>
    </g>

    <!-- ================= NÚT XÁC NHẬN & ĐÓNG DƯỚI ĐÁY ================= -->
    <g transform="translate(110, 920)">
      <!-- Nút Đóng -->
      <g transform="translate(0, 0)" style="cursor: pointer;">
        <rect width="180" height="96" rx="16" fill="#FEFDFA" stroke="#BAC7CF" stroke-width="2.5"/>
        <text x="90" y="58" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#718B9E">HỦY BỎ</text>
      </g>

      <!-- Nút Áp Dụng (Xanh mực học sinh) -->
      <g transform="translate(210, 0)" style="cursor: pointer;">
        <rect width="390" height="96" rx="18" fill="#3D83AE" stroke="#256286" stroke-width="3.5"/>
        <line x1="32" y1="0" x2="32" y2="96" stroke="#FAF5EB" stroke-width="2.5" opacity="0.6"/>
        <text x="215" y="58" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="1">ÁP DỤNG ✔</text>
      </g>
    </g>

    <text x="410" y="1065" text-anchor="middle" font-family="sans-serif" font-size="17" font-style="italic" fill="#718B9E">
      ~ Ngôn ngữ sẽ được cập nhật ngay lập tức cho toàn bộ màn chơi ~
    </text>
  </g>
</svg>