<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300">
  <defs>
    <filter id="levelCardShadowActive" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E1610" flood-opacity="0.22"/>
    </filter>
    <clipPath id="activeClip">
      <rect x="15" y="15" width="190" height="270" rx="24" />
    </clipPath>
  </defs>

  <g filter="url(#levelCardShadowActive)">
    <!-- Thân Card -->
    <g clip-path="url(#activeClip)">
      <rect x="15" y="15" width="190" height="270" fill="#FEFDFA"/>
      <!-- Lưới ngang mờ -->
      <path d="M 15 90 L 205 90 M 15 150 L 205 150 M 15 210 L 205 210" stroke="#8FB9D2" stroke-width="1" opacity="0.3"/>
      <!-- Lề đỏ -->
      <line x1="46" y1="15" x2="46" y2="285" stroke="#D84444" stroke-width="2.5"/>
    </g>
    <!-- Viền ngoài mực xanh -->
    <rect x="15" y="15" width="190" height="270" rx="24" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    <line x1="38" y1="17" x2="182" y2="17" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>

    <!-- NHÃN LEVEL TRÊN CÙNG -->
    <text x="110" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#7898AE" letter-spacing="1.5">LEVEL</text>

    <!-- SỐ MÀN CHƠI (VIẾT TAY ĐẬM ĐÀ) -->
    <text x="110" y="145" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#224C6D">07</text>

    <!-- VẠCH NGĂN CÁCH TRƯỚC HÀNG SAO -->
    <line x1="60" y1="190" x2="160" y2="190" stroke="#8FB9D2" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- CỤM 3 NGÔI SAO ĐÁNH GIÁ (ĐẠT 2/3 SAO) -->
    <g transform="translate(110, 235)">
      <!-- Sao trái: Đạt (Highlight) -->
      <g transform="translate(-46, -18) scale(0.75)">
        <path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" 
              fill="#FBBF24" stroke="#D97706" stroke-width="3" stroke-linejoin="round"/>
      </g>

      <!-- Sao giữa: Đạt (Highlight - to hơn một chút) -->
      <g transform="translate(-20, -22) scale(0.85)">
        <path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" 
              fill="#FBBF24" stroke="#D97706" stroke-width="3" stroke-linejoin="round"/>
      </g>

      <!-- Sao phải: Chưa đạt (Empty) -->
      <g transform="translate(10, -18) scale(0.75)">
        <path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" 
              fill="#FAF5EB" stroke="#8FB9D2" stroke-width="2.8" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>