      <line x1="-10" y1="-12" x2="11" y2="-12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="0" x2="11" y2="0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="12" x2="11" y2="12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1080" height="1920" fill="#FAF5EB"/>
