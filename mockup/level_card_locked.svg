<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300">
  <defs>
    <clipPath id="lockedClip">
      <rect x="15" y="15" width="190" height="270" rx="24" />
    </clipPath>
  </defs>

  <g>
    <!-- Thân card mờ phẳng không bóng nổi -->
    <g clip-path="url(#lockedClip)">
      <rect x="15" y="15" width="190" height="270" fill="#EFECE6"/>
      <line x1="46" y1="15" x2="46" y2="285" stroke="#D19E9E" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
    <rect x="15" y="15" width="190" height="270" rx="24" fill="none" stroke="#A7B9C3" stroke-width="2.5"/>

    <!-- ICON Ổ KHÓA NÉT VẼ TỐI GIẢN Ở TÂM -->
    <g transform="translate(110, 135)" stroke="#7A8F9B" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Vòng quai khóa -->
      <path d="M -16 -8 L -16 -24 A 16 16 0 0 1 16 -24 L 16 -8" stroke-width="4.5"/>
      <!-- Thân ổ khóa -->
      <rect x="-24" y="-8" width="48" height="40" rx="8" fill="#DFDCD5" stroke-width="4"/>
      <!-- Lỗ khóa -->
      <circle cx="0" cy="8" r="3.5" fill="#7A8F9B"/>
      <line x1="0" y1="11" x2="0" y2="20" stroke-width="3"/>
    </g>

    <!-- Dãy 3 sao xám mờ đáy thẻ -->
    <g transform="translate(110, 235)" opacity="0.4">
      <g transform="translate(-46, -18) scale(0.75)"><path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" fill="none" stroke="#7A8F9B" stroke-width="3"/></g>
      <g transform="translate(-20, -22) scale(0.85)"><path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" fill="none" stroke="#7A8F9B" stroke-width="3"/></g>
      <g transform="translate(10, -18) scale(0.75)"><path d="M 24 4 L 29.8 16.3 L 43 17.9 L 33.3 26.9 L 35.8 40 L 24 33.4 L 12.2 40 L 14.7 26.9 L 5 17.9 L 18.2 16.3 Z" fill="none" stroke="#7A8F9B" stroke-width="3"/></g>
    </g>
  </g>
</svg>