<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <filter id="paperSlipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A120B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1A120B" flood-opacity="0.15"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <filter id="submitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#16A34A" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- NỀN MỜ PHÍA SAU -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.55"/>

  <!-- TỜ GIẤY HƯỚNG DẪN (920 x 1480 px tại x=80, y=200) -->
  <g transform="translate(80, 200)">
    <!-- THÂN GIẤY CHÍNH -->
    <g filter="url(#paperSlipShadow)">
      <rect width="920" height="1480" rx="26" fill="#FFFDF9"/>
      <!-- Lỗ bấm sổ còng bên lề trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="120" r="8"/><circle cx="28" cy="240" r="8"/><circle cx="28" cy="360" r="8"/>
        <circle cx="28" cy="480" r="8"/><circle cx="28" cy="600" r="8"/><circle cx="28" cy="720" r="8"/>
        <circle cx="28" cy="840" r="8"/><circle cx="28" cy="960" r="8"/><circle cx="28" cy="1080" r="8"/>
        <circle cx="28" cy="1200" r="8"/><circle cx="28" cy="1320" r="8"/><circle cx="28" cy="1440" r="8"/>
      </g>
      <!-- Dòng kẻ ngang mờ -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.35">
        <line x1="80" y1="210" x2="860" y2="210"/><line x1="80" y1="770" x2="860" y2="770"/>
        <line x1="80" y1="850" x2="860" y2="850"/><line x1="80" y1="930" x2="860" y2="930"/>
        <line x1="80" y1="1010" x2="860" y2="1010"/><line x1="80" y1="1090" x2="860" y2="1090"/>
        <line x1="80" y1="1170" x2="860" y2="1170"/><line x1="80" y1="1250" x2="860" y2="1250"/>
      </g>
      <line x1="80" y1="0" x2="80" y2="1480" stroke="#D84444" stroke-width="3" opacity="0.85"/>
      <rect width="920" height="1480" rx="26" fill="none" stroke="#2E7D32" stroke-width="3.5"/>
    </g>

    <!-- WASHI TAPE -->
    <g transform="translate(350, -22)">
      <rect width="220" height="46" rx="4" fill="#E8DFCA" fill-opacity="0.9" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" stroke="#B5A98F" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- NÚT ĐÓNG NHANH "✕" -->
    <g transform="translate(830, 24)" style="cursor: pointer;">
      <circle cx="28" cy="28" r="24" fill="#F4EFE6" stroke="#BACEDC" stroke-width="2"/>
      <path d="M 18 18 L 38 38 M 38 18 L 18 38" stroke="#224C6D" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- HEADER POPUP -->
    <g transform="translate(110, 48)">
      <rect width="210" height="30" rx="8" fill="#DCFCE7"/>
      <text x="105" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#15803D" letter-spacing="1">WALL BUILDER • XÂY TƯỜNG 🧱</text>
      <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="950" fill="#224C6D">Nút Gửi Bài &amp; 3 Lượt Nộp ❤️</text>
    </g>

    <!-- ================= THANH TAB: TAB 2 ĐANG ACTIVE ================= -->
    <g transform="translate(105, 142)">
      <rect x="0" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="122" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">① NỐI TƯỜNG THEO SỐ</text>

      <rect x="255" y="0" width="245" height="48" rx="14" fill="#2E7D32"/>
      <text x="377" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">② NÚT GỬI &amp; 3 LƯỢT ❤️</text>

      <rect x="510" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="632" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">③ BÍ QUYẾT &amp; GỢI Ý</text>
    </g>

    <!-- ================= KHUNG HÌNH MINH HỌA NÚT GỬI & 3 LƯỢT CHƠI ================= -->
    <g transform="translate(105, 210)" filter="url(#uiShadow)">
      <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#2E7D32" stroke-width="3"/>

      <!-- NỬA TRÁI: DỰNG ĐỦ TƯỜNG ➔ BẤM NÚT GỬI -->
      <g transform="translate(45, 30)">
        <rect width="310" height="395" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
        <rect x="15" y="16" width="185" height="28" rx="8" fill="#DCFCE7"/>
        <text x="107" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#15803D">✓ DỰNG ĐỦ ➔ BẤM GỬI</text>

        <!-- Thẻ trạng thái đã đủ tường -->
        <g transform="translate(30, 65)">
          <rect width="250" height="70" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
          <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="900" fill="#166534">TIẾN ĐỘ TƯỜNG</text>
          <text x="20" y="56" font-family="'Segoe UI', monospace" font-size="28" font-weight="950" fill="#15803D">18 / 18 ĐOẠN</text>
          <rect x="150" y="22" width="85" height="26" rx="6" fill="#DCFCE7"/>
          <text x="192" y="39" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#15803D">ĐÃ ĐỦ ✓</text>
        </g>

        <!-- Nút Gửi Bài mô phỏng sáng rực -->
        <g transform="translate(30, 160)" filter="url(#submitGlow)">
          <rect width="250" height="90" rx="20" fill="#2E7D32" stroke="#1B5E20" stroke-width="3"/>
          <g transform="translate(25, 26)" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="18" r="16"/>
            <path d="M 11 18 L 16 23 L 26 12"/>
          </g>
          <text x="145" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#FFFFFF">GỬI BÀI</text>
          <text x="145" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#DCFCE7">Kiểm tra kết quả</text>
        </g>

        <text x="155" y="295" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#15803D">KHỚP MỌI SỐ = THẮNG!</text>
        <text x="155" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#166534">Cấu hình tường thỏa mãn</text>
        <text x="155" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#15803D">toàn bộ con số là hoàn thành.</text>
      </g>

      <!-- NỬA PHẢI: PHẠT KHI NỘP SAI (3 LƯỢT ❤️) -->
      <g transform="translate(400, 30)">
        <rect width="310" height="395" rx="18" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
        <rect x="20" y="16" width="175" height="28" rx="8" fill="#FEE2E2"/>
        <text x="107" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#B91C1C">❤️ CHỈ CÓ 3 LƯỢT NỘP</text>

        <!-- Minh họa 3 quả tim (2 quả còn, 1 quả vỡ) -->
        <g transform="translate(40, 75)">
          <!-- Tim 1: Còn -->
          <text x="35" y="45" text-anchor="middle" font-size="44">❤️</text>
          <!-- Tim 2: Còn -->
          <text x="115" y="45" text-anchor="middle" font-size="44">❤️</text>
          <!-- Tim 3: Mất lượt -->
          <text x="195" y="45" text-anchor="middle" font-size="44" opacity="0.3">💔</text>
        </g>

        <!-- Thẻ báo lỗi sai lệch -->
        <g transform="translate(30, 160)">
          <rect width="250" height="85" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
          <text x="125" y="34" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#DC2626">CHƯA KHỚP 2 ĐOẠN!</text>
          <text x="125" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#B91C1C">BỊ TRỪ -1 LƯỢT GỬI</text>
          <text x="125" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#7F1D1D">(Còn lại 2/3 lượt)</text>
        </g>

        <text x="155" y="295" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#B91C1C">HẾT 3 LƯỢT = THUA!</text>
        <text x="155" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#7F1D1D">Game chỉ báo số đoạn bị sai,</text>
        <text x="155" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#DC2626">KHÔNG chỉ ra vị trí sai!</text>
      </g>

      <!-- DẢI GHI CHÚ CHÂN HÌNH -->
      <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
      <text x="377" y="475" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#224C6D">
        💡 Bạn chỉ có 3 lượt gửi bài: Đừng bấm Gửi cầu may, hãy rà soát thật kỹ từng ô!
      </text>
    </g>

    <!-- NỘI DUNG CHI TIẾT DẠNG THẺ -->
    <g transform="translate(105, 755)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="900" fill="#2E7D32" letter-spacing="1.5">QUY TẮC CHẤM ĐIỂM &amp; LƯỢT GỬI</text>

      <!-- Ý 1 -->
      <g transform="translate(0, 42)">
        <rect width="755" height="76" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#16A34A"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">1</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#15803D">Dựng Đủ Số Đoạn Tường Trước Khi Nộp:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#166534">Theo dõi thanh đếm trên HUD. Khi đạt đủ số đoạn tường quy định, nút Gửi sẽ sẵn sàng.</text>
      </g>

      <!-- Ý 2 -->
      <g transform="translate(0, 130)">
        <rect width="755" height="76" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#DC2626"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">2</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#B91C1C">Chỉ Có 3 Lần Gửi Bài (❤️ 3/3):</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#7F1D1D">Mỗi lần nộp mà cấu hình tường chưa khớp với số ô, bạn sẽ bị trừ 1 lượt chơi và rung bàn cờ.</text>
      </g>

      <!-- Ý 3 -->
      <g transform="translate(0, 218)">
        <rect width="755" height="76" rx="14" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#EA580C"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">3</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#9A3412">Hết 3 Lượt Gửi = Thua Cuộc:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#7C2D12">Nếu cạn cả 3 lượt gửi mà vẫn chưa đúng, bạn phải xem quảng cáo Hồi Sinh để nhận thêm +1 lượt.</text>
      </g>
    </g>

    <!-- ĐIỀU KHIỂN PAGING SLIDE -->
    <g transform="translate(105, 1100)">
      <g transform="translate(0, 0)">
        <!-- Nút lùi: BẬT (về Trang 1) -->
        <g style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#2E7D32" stroke-width="2.5"/>
          <path d="M 30 18 L 20 26 L 30 34" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Dots: Dot 2 active -->
        <g transform="translate(80, 16)">
          <circle cx="9" cy="9" r="8" fill="#D1E2ED"/>
          <rect x="27" y="0" width="38" height="18" rx="9" fill="#2E7D32"/>
          <circle cx="86" cy="9" r="8" fill="#D1E2ED"/>
        </g>

        <!-- Nút tiến: BẬT (sang Trang 3) -->
        <g transform="translate(200, 0)" style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#2E7D32" stroke-width="2.5"/>
          <path d="M 22 18 L 32 26 L 22 34" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <text x="755" y="34" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#2E7D32">TRANG 2 / 3</text>
      </g>

      <!-- Nút hành động chính: TIẾP THEO SANG TRANG 3 -->
      <g transform="translate(0, 80)" style="cursor: pointer;" filter="url(#uiShadow)">
        <rect width="755" height="100" rx="22" fill="#2E7D32" stroke="#1B5E20" stroke-width="3.5"/>
        <line x1="42" y1="0" x2="42" y2="100" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
        <text x="397" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="950" fill="#FFFFFF" letter-spacing="1">
          TIẾP THEO: BÍ QUYẾT Ô SỐ 0 &amp; GỢI Ý (3/3) ›
        </text>
      </g>

      <text x="377" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#718B9E" style="cursor: pointer;">
        Bỏ qua hướng dẫn &amp; Vào xây tường ngay
      </text>
    </g>
  </g>

  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>