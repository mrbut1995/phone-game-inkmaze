<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <filter id="paperSlipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A120B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1A120B" flood-opacity="0.15"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <filter id="pathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2575A7" flood-opacity="0.45"/>
    </filter>

    <!-- Anchor dấu chữ thập -->
    <g id="anchor-cross">
      <g stroke="#1E283A" stroke-width="3.5" stroke-linecap="round">
        <line x1="0" y1="-14" x2="0" y2="-4"/>
        <line x1="0" y1="4"   x2="0" y2="14"/>
        <line x1="-14" y1="0" x2="-4" y2="0"/>
        <line x1="4"   y1="0" x2="14"  y2="0"/>
      </g>
    </g>
  </defs>

  <!-- NỀN MỜ MÀN CHƠI PHÍA SAU -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.55"/>

  <!-- TỜ GIẤY HƯỚNG DẪN (920 x 1480 px tại x=80, y=200) -->
  <g transform="translate(80, 200)">
    <!-- THÂN GIẤY -->
    <g filter="url(#paperSlipShadow)">
      <rect width="920" height="1480" rx="26" fill="#FFFDF9"/>
      <!-- Lỗ bấm sổ còng -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="120" r="8"/><circle cx="28" cy="240" r="8"/><circle cx="28" cy="360" r="8"/>
        <circle cx="28" cy="480" r="8"/><circle cx="28" cy="600" r="8"/><circle cx="28" cy="720" r="8"/>
        <circle cx="28" cy="840" r="8"/><circle cx="28" cy="960" r="8"/><circle cx="28" cy="1080" r="8"/>
        <circle cx="28" cy="1200" r="8"/><circle cx="28" cy="1320" r="8"/><circle cx="28" cy="1440" r="8"/>
      </g>
      <!-- Dòng kẻ ngang mờ -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.35">
        <line x1="80" y1="210" x2="860" y2="210"/><line x1="80" y1="770" x2="860" y2="770"/>
        <line x1="80" y1="850" x2="860" y2="850"/><line x1="80" y1="930" x2="860" y2="930"/>
        <line x1="80" y1="1010" x2="860" y2="1010"/><line x1="80" y1="1090" x2="860" y2="1090"/>
        <line x1="80" y1="1170" x2="860" y2="1170"/><line x1="80" y1="1250" x2="860" y2="1250"/>
      </g>
      <line x1="80" y1="0" x2="80" y2="1480" stroke="#D84444" stroke-width="3" opacity="0.85"/>
      <rect width="920" height="1480" rx="26" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    </g>

    <!-- WASHI TAPE TRÊN ĐỈNH -->
    <g transform="translate(350, -22)">
      <rect width="220" height="46" rx="4" fill="#E8DFCA" fill-opacity="0.9" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" stroke="#B5A98F" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- NÚT ĐÓNG NHANH "✕" -->
    <g transform="translate(830, 24)" style="cursor: pointer;">
      <circle cx="28" cy="28" r="24" fill="#F4EFE6" stroke="#BACEDC" stroke-width="2"/>
      <path d="M 18 18 L 38 38 M 38 18 L 18 38" stroke="#224C6D" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- HEADER POPUP -->
    <g transform="translate(110, 48)">
      <rect width="180" height="30" rx="8" fill="#FEE2E2"/>
      <text x="90" y="21" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#B91C1C" letter-spacing="1">HƯỚNG DẪN CHƠI</text>
      <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="950" fill="#224C6D">Manh Mối Con Số</text>
    </g>

    <!-- THANH TAB: TAB 2 ĐANG ACTIVE -->
    <g transform="translate(105, 142)">
      <rect x="0" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="122" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#718B9E">① BẮT ĐẦU &amp; ĐÍCH</text>

      <rect x="255" y="0" width="245" height="48" rx="14" fill="#3D83AE"/>
      <text x="377" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">② MANH MỐI SỐ</text>

      <rect x="510" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="632" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#718B9E">③ CÔNG CỤ</text>
    </g>

    <!-- KHUNG HÌNH MINH HỌA (755 x 510 px tại x=105, y=210) -->
    <g transform="translate(105, 210)" filter="url(#uiShadow)">
      <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>

      <!-- NỬA TRÁI: Ô SỐ 0 AN TOÀN TUYỆT ĐỐI -->
      <g transform="translate(45, 45)">
        <rect width="310" height="380" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.5"/>
        <rect x="25" y="18" width="160" height="28" rx="8" fill="#DCFCE7"/>
        <text x="105" y="37" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#15803D">✓ Ô SỐ 0 = AN TOÀN</text>

        <!-- Ô cờ lớn có số 0 -->
        <g transform="translate(75, 75)">
          <rect width="160" height="160" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2.5"/>
          <text x="80" y="80" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="76" font-weight="950" fill="#16A34A">0</text>
          
          <!-- 4 mũi tên xanh tỏa ra 4 hướng tự do -->
          <g stroke="#16A34A" stroke-width="4" stroke-linecap="round" fill="#16A34A">
            <line x1="80" y1="20" x2="80" y2="-15"/><polygon points="74,-15 86,-15 80,-25"/>
            <line x1="80" y1="140" x2="80" y2="175"/><polygon points="74,175 86,175 80,185"/>
            <line x1="20" y1="80" x2="-15" y2="80"/><polygon points="-15,74 -15,86 -25,80"/>
            <line x1="140" y1="80" x2="175" y2="80"/><polygon points="175,74 175,86 185,80"/>
          </g>
        </g>
        <text x="155" y="305" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#15803D">KHÔNG CÓ TƯỜNG</text>
        <text x="155" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4B7E9F">Tự do đi qua theo mọi hướng</text>
      </g>

      <!-- NỬA PHẢI: Ô SỐ 3 BỊ CHẶN 3 TƯỜNG (CẢNH BÁO) -->
      <g transform="translate(400, 45)">
        <rect width="310" height="380" rx="18" fill="#FEF2F2" stroke="#FECACA" stroke-width="2.5"/>
        <rect x="25" y="18" width="160" height="28" rx="8" fill="#FEE2E2"/>
        <text x="105" y="37" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#B91C1C">⚠️ Ô SỐ 3 = 3 TƯỜNG</text>

        <!-- Ô cờ lớn có số 3 bị 3 cạnh tường đen bao quanh -->
        <g transform="translate(75, 75)">
          <rect width="160" height="160" rx="14" fill="#FFFFFF" stroke="#FECACA" stroke-width="2.5"/>
          <text x="80" y="80" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="76" font-weight="950" fill="#DC2626">3</text>

          <!-- 3 Tường dày bao quanh: Trên, Trái, Dưới -->
          <line x1="0" y1="0" x2="160" y2="0" stroke="#1E283A" stroke-width="12" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="160" stroke="#1E283A" stroke-width="12" stroke-linecap="round"/>
          <line x1="0" y1="160" x2="160" y2="160" stroke="#1E283A" stroke-width="12" stroke-linecap="round"/>

          <!-- 4 Anchor góc -->
          <use href="#anchor-cross" x="0" y="0"/><use href="#anchor-cross" x="160" y="0"/>
          <use href="#anchor-cross" x="0" y="160"/><use href="#anchor-cross" x="160" y="160"/>

          <!-- Chỉ có 1 lối thoát bên Phải (mũi tên xanh) -->
          <line x1="100" y1="80" x2="185" y2="80" stroke="#2575A7" stroke-width="5" stroke-linecap="round"/>
          <polygon points="185,73 185,87 197,80" fill="#2575A7"/>
        </g>
        <text x="155" y="305" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#B91C1C">BỊ BỊT KÍN 3 MẶT</text>
        <text x="155" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#7F1D1D">Chỉ có 1 cạnh duy nhất để thoát</text>
      </g>

      <!-- DẢI GHI CHÚ CHÂN HÌNH -->
      <rect x="20" y="448" width="715" height="42" rx="10" fill="#F4EFE6"/>
      <text x="377" y="474" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#224C6D">
        💡 Suy luận như Dò Mìn: Dùng con số để xác định khe nào có Tường Vô Hình
      </text>
    </g>

    <!-- NỘI DUNG CHI TIẾT DẠNG THẺ -->
    <g transform="translate(105, 755)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="900" fill="#3D83AE" letter-spacing="1.5">QUY TẮC CON SỐ</text>

      <!-- Ý 1 -->
      <g transform="translate(0, 42)">
        <rect width="755" height="76" rx="14" fill="#F0F7FB" stroke="#D1E2ED" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#3D83AE"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">1</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#224C6D">Ý Nghĩa Con Số (0 đến 3):</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#5A7385">Con số thể hiện số cạnh trong bảng là tường vô hình của ô đó.</text>
      </g>

      <!-- Ý 2 -->
      <g transform="translate(0, 130)">
        <rect width="755" height="76" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#16A34A"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">2</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#15803D">Ưu Tiên Đi Qua Ô Số 0:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#166534">Ô số 0 không có bất kỳ tường nào, là lối đi thông suốt an toàn nhất.</text>
      </g>

      <!-- Ý 3 -->
      <g transform="translate(0, 218)">
        <rect width="755" height="76" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#D84444"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">3</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#B91C1C">Cẩn Thận Ô Số 2 &amp; Số 3:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#7F1D1D">Có nhiều tường bao quanh, cần so sánh với các ô bên cạnh để tránh đâm tường!</text>
      </g>
    </g>

    <!-- ĐIỀU KHIỂN PAGING SLIDE -->
    <g transform="translate(105, 1100)">
      <!-- Thanh chỉ báo trang -->
      <g transform="translate(0, 0)">
        <!-- Nút lùi trang: BẬT (về Trang 1) -->
        <g style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#3D83AE" stroke-width="2.5"/>
          <path d="M 30 18 L 20 26 L 30 34" fill="none" stroke="#3D83AE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Dots: Dot 2 active -->
        <g transform="translate(80, 16)">
          <circle cx="9" cy="9" r="8" fill="#D1E2ED"/>
          <rect x="27" y="0" width="38" height="18" rx="9" fill="#3D83AE"/>
          <circle cx="86" cy="9" r="8" fill="#D1E2ED"/>
        </g>

        <!-- Nút tiến trang: BẬT (sang Trang 3) -->
        <g transform="translate(200, 0)" style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#3D83AE" stroke-width="2.5"/>
          <path d="M 22 18 L 32 26 L 22 34" fill="none" stroke="#3D83AE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <text x="755" y="34" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#3D83AE">TRANG 2 / 3</text>
      </g>

      <!-- Nút hành động chính: TIẾP THEO SANG TRANG 3 -->
      <g transform="translate(0, 80)" style="cursor: pointer;" filter="url(#uiShadow)">
        <rect width="755" height="100" rx="22" fill="#3D83AE" stroke="#256286" stroke-width="3.5"/>
        <line x1="42" y1="0" x2="42" y2="100" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
        <text x="397" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#FFFFFF" letter-spacing="1">
          TIẾP THEO: CÁC CÔNG CỤ HỖ TRỢ (3/3) ›
        </text>
      </g>

      <text x="377" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#718B9E" style="cursor: pointer;">
        Bỏ qua hướng dẫn &amp; Vào chơi ngay
      </text>
    </g>
  </g>
  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>