<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <filter id="paperSlipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A120B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1A120B" flood-opacity="0.15"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- NỀN MỜ PHÍA SAU -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.55"/>

  <!-- TỜ GIẤY HƯỚNG DẪN (920 x 1480 px tại x=80, y=200) -->
  <g transform="translate(80, 200)">
    <!-- THÂN GIẤY CHÍNH -->
    <g filter="url(#paperSlipShadow)">
      <rect width="920" height="1480" rx="26" fill="#FFFDF9"/>
      <!-- Lỗ bấm sổ còng bên lề trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="120" r="8"/><circle cx="28" cy="240" r="8"/><circle cx="28" cy="360" r="8"/>
        <circle cx="28" cy="480" r="8"/><circle cx="28" cy="600" r="8"/><circle cx="28" cy="720" r="8"/>
        <circle cx="28" cy="840" r="8"/><circle cx="28" cy="960" r="8"/><circle cx="28" cy="1080" r="8"/>
        <circle cx="28" cy="1200" r="8"/><circle cx="28" cy="1320" r="8"/><circle cx="28" cy="1440" r="8"/>
      </g>
      <!-- Dòng kẻ ngang mờ -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.35">
        <line x1="80" y1="210" x2="860" y2="210"/><line x1="80" y1="770" x2="860" y2="770"/>
        <line x1="80" y1="850" x2="860" y2="850"/><line x1="80" y1="930" x2="860" y2="930"/>
        <line x1="80" y1="1010" x2="860" y2="1010"/><line x1="80" y1="1090" x2="860" y2="1090"/>
        <line x1="80" y1="1170" x2="860" y2="1170"/><line x1="80" y1="1250" x2="860" y2="1250"/>
      </g>
      <line x1="80" y1="0" x2="80" y2="1480" stroke="#D84444" stroke-width="3" opacity="0.85"/>
      <rect width="920" height="1480" rx="26" fill="none" stroke="#256286" stroke-width="3.5"/>
    </g>

    <!-- WASHI TAPE -->
    <g transform="translate(350, -22)">
      <rect width="220" height="46" rx="4" fill="#E8DFCA" fill-opacity="0.9" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" stroke="#B5A98F" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- NÚT ĐÓNG NHANH "✕" -->
    <g transform="translate(830, 24)" style="cursor: pointer;">
      <circle cx="28" cy="28" r="24" fill="#F4EFE6" stroke="#BACEDC" stroke-width="2"/>
      <path d="M 18 18 L 38 38 M 38 18 L 18 38" stroke="#224C6D" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- HEADER POPUP -->
    <g transform="translate(110, 48)">
      <rect width="210" height="30" rx="8" fill="#E0F2FE"/>
      <text x="105" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#0369A1" letter-spacing="1">SUM PATH • TOÁN ĐỐ ➕</text>
      <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="950" fill="#224C6D">Toán Tử &amp; Ô Điểm 1 Lần</text>
    </g>

    <!-- ================= THANH TAB: TAB 2 ĐANG ACTIVE ================= -->
    <g transform="translate(105, 142)">
      <rect x="0" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="122" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">① CỘNG TỔNG &amp; MỤC TIÊU</text>

      <rect x="255" y="0" width="245" height="48" rx="14" fill="#256286"/>
      <text x="377" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">② TOÁN TỬ &amp; Ô 1 LẦN</text>

      <rect x="510" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="632" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">③ BÍ QUYẾT TÍNH &amp; UNDO</text>
    </g>

    <!-- ================= KHUNG HÌNH MINH HỌA SO SÁNH 2 NỘI DUNG ================= -->
    <g transform="translate(105, 210)" filter="url(#uiShadow)">
      <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#256286" stroke-width="3"/>

      <!-- NỬA TRÁI: 3 DẠNG TOÁN TỬ MỤC TIÊU -->
      <g transform="translate(45, 30)">
        <rect width="310" height="395" rx="18" fill="#F0F7FB" stroke="#B8D7EA" stroke-width="2"/>
        <rect x="20" y="16" width="175" height="28" rx="8" fill="#EBF3F8"/>
        <text x="107" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#256286">3 DẠNG TOÁN TỬ HUD</text>

        <!-- 3 Dòng toán tử trực quan -->
        <g transform="translate(25, 65)">
          <!-- Dạng 1: Dấu = -->
          <g transform="translate(0, 0)">
            <rect width="260" height="68" rx="12" fill="#FFFFFF" stroke="#D84444" stroke-width="2"/>
            <circle cx="35" cy="34" r="20" fill="#FEF2F2" stroke="#D84444" stroke-width="2"/>
            <text x="35" y="42" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#D84444">=</text>
            <text x="72" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#163A58">BẰNG CHÍNH XÁC</text>
            <text x="72" y="52" font-family="sans-serif" font-size="13" font-weight="700" fill="#D84444">Ví dụ: Tổng = 50</text>
          </g>

          <!-- Dạng 2: Dấu < -->
          <g transform="translate(0, 80)">
            <rect width="260" height="68" rx="12" fill="#FFFFFF" stroke="#256286" stroke-width="2"/>
            <circle cx="35" cy="34" r="20" fill="#F0F7FB" stroke="#256286" stroke-width="2"/>
            <text x="35" y="42" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#256286">&lt;</text>
            <text x="72" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#163A58">NHỎ HƠN MỨC TRẦN</text>
            <text x="72" y="52" font-family="sans-serif" font-size="13" font-weight="700" fill="#256286">Ví dụ: Tổng &lt; 35</text>
          </g>

          <!-- Dạng 3: Dấu > -->
          <g transform="translate(0, 160)">
            <rect width="260" height="68" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
            <circle cx="35" cy="34" r="20" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
            <text x="35" y="42" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#16A34A">&gt;</text>
            <text x="72" y="30" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#163A58">LỚN HƠN MỨC SÀN</text>
            <text x="72" y="52" font-family="sans-serif" font-size="13" font-weight="700" fill="#16A34A">Ví dụ: Tổng &gt; 40</text>
          </g>
        </g>

        <text x="155" y="335" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#163A58">KIỂM TRA KỸ TOÁN TỬ</text>
        <text x="155" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#718B9E">trên bảng HUD trước khi vẽ!</text>
      </g>

      <!-- NỬA PHẢI: MỖI Ô CHỈ CỘNG ĐÚNG 1 LẦN -->
      <g transform="translate(400, 30)">
        <rect width="310" height="395" rx="18" fill="#FFFDF8" stroke="#F59E0B" stroke-width="2"/>
        <rect x="20" y="16" width="185" height="28" rx="8" fill="#FEF3C7"/>
        <text x="112" y="35" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#B45309">⚠️ MỖI Ô CHỈ CỘNG 1 LẦN</text>

        <!-- Minh họa đường đi cắt qua ô cũ -->
        <g transform="translate(65, 65)">
          <rect width="180" height="180" rx="14" fill="#FFFFFF" stroke="#BACEDC" stroke-width="2"/>
          <line x1="90" y1="0" x2="90" y2="180" stroke="#BACEDC" stroke-width="1.5"/>
          <line x1="0" y1="90" x2="180" y2="90" stroke="#BACEDC" stroke-width="1.5"/>

          <!-- Ô [0,0] mang số 8 (đã đi qua) -->
          <rect x="0" y="0" width="90" height="90" rx="8" fill="#E0F2FE" fill-opacity="0.6"/>
          <text x="45" y="45" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="950" fill="#256286">8</text>
          
          <text x="135" y="45" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#718B9E">2</text>
          <text x="45" y="135" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#718B9E">5</text>
          <text x="135" y="135" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#718B9E">3</text>

          <!-- Vòng quay lại ô [0,0] bị chặn cộng điểm -->
          <path d="M 45 45 L 135 45 L 135 135 L 45 135 L 45 45" 
                fill="none" stroke="#D84444" stroke-width="6" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Huy hiệu cấm cộng thêm đè lên ô [0,0] -->
          <rect x="6" y="28" width="78" height="32" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
          <text x="45" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#B91C1C">+0 ĐIỂM</text>
        </g>

        <text x="155" y="285" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#B45309">KHÔNG THỂ ĐI VÒNG CÀY ĐIỂM</text>
        <text x="155" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#78350F">Quay lại ô cũ sẽ không cộng thêm.</text>
        <text x="155" y="334" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#B91C1C">Điểm chỉ tính ở lần bước đầu tiên!</text>
      </g>

      <!-- DẢI GHI CHÚ CHÂN HÌNH -->
      <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
      <text x="377" y="475" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#224C6D">
        💡 Luôn nhìn toán tử trên HUD: Có màn yêu cầu = 50, nhưng có màn chỉ yêu cầu &lt; 30!
      </text>
    </g>

    <!-- NỘI DUNG CHI TIẾT DẠNG THẺ -->
    <g transform="translate(105, 755)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="900" fill="#256286" letter-spacing="1.5">QUY TẮC MỤC TIÊU &amp; ĐIỂM Ô</text>

      <!-- Ý 1 -->
      <g transform="translate(0, 42)">
        <rect width="755" height="76" rx="14" fill="#F0F7FB" stroke="#D1E2ED" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#256286"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">1</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#163A58">Để Ý Ký Hiệu Toán Tử (=, &lt;, &gt;):</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#5A7385">Với dấu =, tổng phải khớp tuyệt đối. Với dấu &lt; hoặc &gt;, chỉ cần tổng nằm trong khoảng hợp lệ.</text>
      </g>

      <!-- Ý 2 -->
      <g transform="translate(0, 130)">
        <rect width="755" height="76" rx="14" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#EA580C"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">2</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#9A3412">Mỗi Ô Chỉ Tính Điểm Một Lần:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#7C2D12">Bạn có thể vẽ đường giao cắt ô cũ để chuyển hướng, nhưng điểm ô đó sẽ không được cộng thêm.</text>
      </g>

      <!-- Ý 3 -->
      <g transform="translate(0, 218)">
        <rect width="755" height="76" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#DC2626"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">3</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#B91C1C">Về Đích Sai Mục Tiêu = Thất Bại:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#7F1D1D">Dù bạn chạm được hố thang F nhưng tổng điểm không thỏa mãn phép tính thì màn chơi chưa kết thúc!</text>
      </g>
    </g>

    <!-- ĐIỀU KHIỂN PAGING SLIDE -->
    <g transform="translate(105, 1100)">
      <g transform="translate(0, 0)">
        <!-- Nút lùi: BẬT (về Trang 1) -->
        <g style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#256286" stroke-width="2.5"/>
          <path d="M 30 18 L 20 26 L 30 34" fill="none" stroke="#256286" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Dots: Dot 2 active -->
        <g transform="translate(80, 16)">
          <circle cx="9" cy="9" r="8" fill="#D1E2ED"/>
          <rect x="27" y="0" width="38" height="18" rx="9" fill="#256286"/>
          <circle cx="86" cy="9" r="8" fill="#D1E2ED"/>
        </g>

        <!-- Nút tiến: BẬT (sang Trang 3) -->
        <g transform="translate(200, 0)" style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#256286" stroke-width="2.5"/>
          <path d="M 22 18 L 32 26 L 22 34" fill="none" stroke="#256286" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <text x="755" y="34" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#256286">TRANG 2 / 3</text>
      </g>

      <!-- Nút hành động chính: TIẾP THEO SANG TRANG 3 -->
      <g transform="translate(0, 80)" style="cursor: pointer;" filter="url(#uiShadow)">
        <rect width="755" height="100" rx="22" fill="#256286" stroke="#164663" stroke-width="3.5"/>
        <line x1="42" y1="0" x2="42" y2="100" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
        <text x="397" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="950" fill="#FFFFFF" letter-spacing="1">
          TIẾP THEO: CHIẾN THUẬT &amp; UNDO (3/3) ›
        </text>
      </g>

      <text x="377" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#718B9E" style="cursor: pointer;">
        Bỏ qua hướng dẫn &amp; Vào cộng điểm ngay
      </text>
    </g>
  </g>

  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>