<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Lưới vở nền gốc -->
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <!-- Đổ bóng nổi của tờ giấy popup -->
    <filter id="paperSlipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A120B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1A120B" flood-opacity="0.15"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <!-- Dấu neo chữ thập Anchor -->
    <g id="anchor-cross">
      <g stroke="#1E283A" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-14" x2="0" y2="-4"/>
        <line x1="0" y1="4"   x2="0" y2="14"/>
        <line x1="-14" y1="0" x2="-4" y2="0"/>
        <line x1="4"   y1="0" x2="14"  y2="0"/>
      </g>
    </g>
  </defs>

  <!-- NỀN MỜ PHÍA SAU -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.55"/>

  <!-- TỜ GIẤY HƯỚNG DẪN (920 x 1480 px tại x=80, y=200) -->
  <g transform="translate(80, 200)">
    <!-- THÂN GIẤY CHÍNH -->
    <g filter="url(#paperSlipShadow)">
      <rect width="920" height="1480" rx="26" fill="#FFFDF9"/>
      <!-- Lỗ bấm sổ còng bên lề trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="120" r="8"/><circle cx="28" cy="240" r="8"/><circle cx="28" cy="360" r="8"/>
        <circle cx="28" cy="480" r="8"/><circle cx="28" cy="600" r="8"/><circle cx="28" cy="720" r="8"/>
        <circle cx="28" cy="840" r="8"/><circle cx="28" cy="960" r="8"/><circle cx="28" cy="1080" r="8"/>
        <circle cx="28" cy="1200" r="8"/><circle cx="28" cy="1320" r="8"/><circle cx="28" cy="1440" r="8"/>
      </g>
      <!-- Dòng kẻ ngang mờ -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.35">
        <line x1="80" y1="210" x2="860" y2="210"/><line x1="80" y1="770" x2="860" y2="770"/>
        <line x1="80" y1="850" x2="860" y2="850"/><line x1="80" y1="930" x2="860" y2="930"/>
        <line x1="80" y1="1010" x2="860" y2="1010"/><line x1="80" y1="1090" x2="860" y2="1090"/>
        <line x1="80" y1="1170" x2="860" y2="1170"/><line x1="80" y1="1250" x2="860" y2="1250"/>
      </g>
      <line x1="80" y1="0" x2="80" y2="1480" stroke="#D84444" stroke-width="3" opacity="0.85"/>
      <rect width="920" height="1480" rx="26" fill="none" stroke="#2E7D32" stroke-width="3.5"/>
    </g>

    <!-- WASHI TAPE -->
    <g transform="translate(350, -22)">
      <rect width="220" height="46" rx="4" fill="#E8DFCA" fill-opacity="0.9" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" stroke="#B5A98F" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- NÚT ĐÓNG NHANH "✕" -->
    <g transform="translate(830, 24)" style="cursor: pointer;">
      <circle cx="28" cy="28" r="24" fill="#F4EFE6" stroke="#BACEDC" stroke-width="2"/>
      <path d="M 18 18 L 38 38 M 38 18 L 18 38" stroke="#224C6D" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- HEADER POPUP -->
    <g transform="translate(110, 48)">
      <rect width="210" height="30" rx="8" fill="#DCFCE7"/>
      <text x="105" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#15803D" letter-spacing="1">WALL BUILDER • XÂY TƯỜNG 🧱</text>
      <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="950" fill="#224C6D">Đóng Vai Thợ Xây Mê Cung</text>
    </g>

    <!-- ================= 3. THANH TAB TIẾN TRÌNH SLIDE (3 TRANG) ================= -->
    <g transform="translate(105, 142)">
      <!-- Tab 1: ĐANG XEM (Active - Xanh Lá Thợ Xây) -->
      <rect x="0" y="0" width="245" height="48" rx="14" fill="#2E7D32"/>
      <text x="122" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">① NỐI TƯỜNG THEO SỐ</text>

      <!-- Tab 2: Nút gửi & 3 lượt -->
      <rect x="255" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="377" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">② NÚT GỬI &amp; 3 LƯỢT ❤️</text>

      <!-- Tab 3: Bí quyết & Gợi ý -->
      <rect x="510" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="632" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">③ BÍ QUYẾT &amp; GỢI Ý</text>
    </g>

    <!-- ================= 4. KHUNG MINH HỌA THAO TÁC KÉO NỐI ANCHOR ================= -->
    <g transform="translate(105, 210)" filter="url(#uiShadow)">
      <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#2E7D32" stroke-width="3"/>

      <!-- MÔ PHỎNG TIẾN ĐỘ TƯỜNG Ở ĐỈNH KHUNG -->
      <g transform="translate(35, 18)">
        <rect width="685" height="66" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
        <text x="20" y="40" font-family="sans-serif" font-size="13" font-weight="900" fill="#15803D">TỔNG TƯỜNG CẦN DỰNG:</text>
        <text x="195" y="44" font-family="'Segoe UI', monospace" font-size="34" font-weight="950" fill="#14532D">03 <tspan font-size="18" fill="#718B9E">/ 05 ĐOẠN</tspan></text>
        
        <rect x="420" y="15" width="245" height="36" rx="8" fill="#DCFCE7"/>
        <text x="542" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#15803D">
          KÉO NỐI 2 ĐIỂM NEO (+)
        </text>
      </g>

      <!-- LƯỚI MINI 3x3 CELL (HIỆN RÕ SỐ TRÊN MỌI Ô, KHÔNG CÓ S/F) -->
      <g transform="translate(182, 105)">
        <!-- Viền ngoài là tường dày cố định -->
        <rect x="0" y="0" width="390" height="390" fill="#F4F8FA" stroke="#1E283A" stroke-width="6"/>

        <!-- Lớp lưới ô mỏng -->
        <g stroke="#BACEDC" stroke-width="1.5">
          <line x1="130" y1="0" x2="130" y2="390"/>
          <line x1="260" y1="0" x2="260" y2="390"/>
          <line x1="0" y1="130" x2="390" y2="130"/>
          <line x1="0" y1="260" x2="390" y2="260"/>
        </g>

        <!-- Con số trên mọi ô (kể cả số 0) -->
        <g font-family="'Segoe UI', sans-serif" font-size="44" font-weight="950" fill="#2A4860" text-anchor="middle" dominant-baseline="central">
          <text x="65" y="65">1</text>
          <text x="195" y="65">2</text>
          <text x="325" y="65">1</text>

          <text x="65" y="195">0</text>
          <!-- Ô giữa có số 2 đang được xây tường xung quanh -->
          <text x="195" y="195" fill="#15803D">2</text>
          <text x="325" y="195">2</text>

          <text x="65" y="325">2</text>
          <text x="195" y="325">1</text>
          <text x="325" y="325">1</text>
        </g>

        <!-- CÁC ĐOẠN TƯỜNG ĐÃ DỰNG (NÉT ĐEN DÀY) -->
        <!-- Đoạn 1: Dọc tại x=260, y=0..130 -->
        <line x1="260" y1="6" x2="260" y2="124" stroke="#1E283A" stroke-width="11" stroke-linecap="round"/>
        <!-- Đoạn 2: Ngang tại y=260, x=0..130 -->
        <line x1="6" y1="260" x2="124" y2="260" stroke="#1E283A" stroke-width="11" stroke-linecap="round"/>

        <!-- ĐOẠN TƯỜNG ĐANG ĐƯỢC KÉO NỐI GIỮA (130,130) VÀ (260,130) -->
        <line x1="136" y1="130" x2="254" y2="130" stroke="#C4843A" stroke-width="9" stroke-linecap="round" stroke-dasharray="10 6"/>
        
        <!-- Bàn tay mô phỏng thao tác kéo nối giữa 2 anchor -->
        <circle cx="195" cy="130" r="14" fill="#C4843A"/>
        <circle cx="195" cy="130" r="6" fill="#FFFFFF"/>

        <!-- CÁC ĐIỂM NEO ANCHOR (+) TẠI GIAO ĐIỂM -->
        <!-- Hàng 0 -->
        <use href="#anchor-cross" x="0" y="0"/><use href="#anchor-cross" x="130" y="0"/><use href="#anchor-cross" x="260" y="0"/><use href="#anchor-cross" x="390" y="0"/>
        <!-- Hàng 1 -->
        <use href="#anchor-cross" x="0" y="130"/>
        <!-- 2 Anchor đang kéo -->
        <g transform="translate(130, 130)">
          <circle cx="0" cy="0" r="18" fill="#C4843A" fill-opacity="0.25"/>
          <use href="#anchor-cross" x="0" y="0"/>
        </g>
        <g transform="translate(260, 130)">
          <circle cx="0" cy="0" r="18" fill="#C4843A" fill-opacity="0.25"/>
          <use href="#anchor-cross" x="0" y="0"/>
        </g>
        <use href="#anchor-cross" x="390" y="130"/>
        <!-- Hàng 2 -->
        <use href="#anchor-cross" x="0" y="260"/><use href="#anchor-cross" x="130" y="260"/><use href="#anchor-cross" x="260" y="260"/><use href="#anchor-cross" x="390" y="260"/>
        <!-- Hàng 3 -->
        <use href="#anchor-cross" x="0" y="390"/><use href="#anchor-cross" x="130" y="390"/><use href="#anchor-cross" x="260" y="390"/><use href="#anchor-cross" x="390" y="390"/>
      </g>

      <!-- CALLOUT BÊN TRÁI: KHÔNG CÓ NHÂN VẬT -->
      <g transform="translate(16, 205)">
        <rect width="155" height="110" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
        <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="900" fill="#15803D">VAI TRÒ MỚI</text>
        <text x="14" y="52" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#166534">THỢ XÂY MÊ CUNG</text>
        <text x="14" y="74" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#15803D">KHÔNG CÓ S/F</text>
        <text x="14" y="96" font-family="sans-serif" font-size="11" font-weight="700" fill="#14532D">Không có di chuyển!</text>
      </g>

      <!-- CALLOUT BÊN PHẢI: KÉO NỐI ANCHOR -->
      <g transform="translate(585, 205)">
        <rect width="155" height="110" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
        <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="900" fill="#C2410C">THAO TÁC CHÍNH</text>
        <text x="14" y="52" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#9A3412">NỐI 2 ANCHOR</text>
        <text x="14" y="74" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#EA580C">BẬT / TẮT TƯỜNG</text>
        <text x="14" y="96" font-family="sans-serif" font-size="11" font-weight="800" fill="#C2410C">Kéo để dựng vách!</text>
      </g>

      <!-- DẢI GHI CHÚ CHÂN HÌNH -->
      <rect x="20" y="450" width="715" height="42" rx="10" fill="#F4EFE6"/>
      <text x="377" y="476" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#224C6D">
        💡 Ô giữa mang số 2 ➔ Bạn cần kéo nối đúng 2 đoạn tường ở các cạnh của nó!
      </text>
    </g>

    <!-- ================= 5. NỘI DUNG CHI TIẾT DẠNG THẺ ================= -->
    <g transform="translate(105, 755)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="900" fill="#2E7D32" letter-spacing="1.5">QUY TẮC XÂY TƯỜNG CƠ BẢN</text>

      <!-- Ý 1 -->
      <g transform="translate(0, 42)">
        <rect width="755" height="76" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#16A34A"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">1</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#15803D">Chế Độ Duy Nhất Tự Xây Tường:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#166534">Không có nhân vật di chuyển, không có S và F. Bạn chính là người phục dựng lại mê cung.</text>
      </g>

      <!-- Ý 2 -->
      <g transform="translate(0, 130)">
        <rect width="755" height="76" rx="14" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#EA580C"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">2</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#9A3412">Kéo Giữa 2 Điểm Neo (Anchor) Để Tạo Tường:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#7C2D12">Chạm và kéo từ dấu cộng (+) này sang dấu cộng kề bên để bật hoặc tắt 1 đoạn tường.</text>
      </g>

      <!-- Ý 3 -->
      <g transform="translate(0, 218)">
        <rect width="755" height="76" rx="14" fill="#F0F7FB" stroke="#D1E2ED" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#256286"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">3</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#163A58">Số Trên Ô Là Số Tường Quanh Ô:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#5A7385">Chỉ đếm các cạnh bên trong board (viền ngoài board là tường cố định, không vẽ được và không tính).</text>
      </g>
    </g>

    <!-- ================= 6. ĐIỀU KHIỂN PAGING SLIDE ================= -->
    <g transform="translate(105, 1100)">
      <g transform="translate(0, 0)">
        <!-- Nút lùi: mờ ở trang 1 -->
        <g opacity="0.35">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
          <path d="M 30 18 L 20 26 L 30 34" fill="none" stroke="#224C6D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Dots phân trang -->
        <g transform="translate(80, 16)">
          <rect x="0" y="0" width="38" height="18" rx="9" fill="#2E7D32"/>
          <circle cx="58" cy="9" r="8" fill="#D1E2ED"/>
          <circle cx="86" cy="9" r="8" fill="#D1E2ED"/>
        </g>

        <!-- Nút tiến trang -->
        <g transform="translate(200, 0)" style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#2E7D32" stroke-width="2.5"/>
          <path d="M 22 18 L 32 26 L 22 34" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <text x="755" y="34" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#2E7D32">
          TRANG 1 / 3
        </text>
      </g>

      <!-- Nút hành động chính: TIẾP THEO SANG TRANG 2 -->
      <g transform="translate(0, 80)" style="cursor: pointer;" filter="url(#uiShadow)">
        <rect width="755" height="100" rx="22" fill="#2E7D32" stroke="#1B5E20" stroke-width="3.5"/>
        <line x1="42" y1="0" x2="42" y2="100" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
        <text x="397" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="950" fill="#FFFFFF" letter-spacing="1">
          TIẾP THEO: NÚT GỬI &amp; 3 LƯỢT ❤️ (2/3) ›
        </text>
      </g>

      <text x="377" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#718B9E" style="cursor: pointer;">
        Bỏ qua hướng dẫn &amp; Vào xây tường ngay
      </text>
    </g>
  </g>

  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>