<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -10 785 535" width="785" height="535">
  <defs>
    <!-- Đổ bóng nổi -->
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <!-- Hiệu ứng phát sáng hồi mực -->
    <filter id="inkRestoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#256286" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ================= PANEL CON MINH HỌA GUIDELINE (TRANG 3) ================= -->
  <g filter="url(#uiShadow)">
    <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#1D4E72" stroke-width="3"/>

    <!-- 1. PHẦN TRÊN: SƠ ĐỒ ĐƯỜNG NGẮN VS ĐƯỜNG VÒNG (ĐÃ XÓA CHỮ) -->
    <g transform="translate(45, 30)">
      <rect width="665" height="195" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
      <rect x="25" y="16" width="220" height="28" rx="8" fill="#DCFCE7"/>

      <!-- Sơ đồ trực quan -->
      <g transform="translate(40, 60)">
        <!-- Nút Start (S) -->
        <circle cx="30" cy="45" r="22" fill="#2E7D32"/>
        <text x="30" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">S</text>

        <!-- Tuyến ngắn (nét xanh thẳng) -->
        <path d="M 52 45 L 230 45" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>
        <!-- Nút Finish (F) -->
        <circle cx="250" cy="45" r="22" fill="#D97706"/>
        <text x="250" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">F</text>
        
        <rect x="75" y="15" width="130" height="24" rx="6" fill="#DCFCE7"/>

        <!-- Tuyến vòng (nét đỏ uốn lượn đứt đoạn) -->
        <path d="M 30 67 Q 140 120 250 67" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 4" fill="none"/>
        <rect x="80" y="105" width="120" height="24" rx="6" fill="#FEE2E2"/>
      </g>
    </g>

    <!-- 2. PHẦN DƯỚI: KHỐI NÚT UNDO HỒI MỰC (ĐÃ XÓA CHỮ) -->
    <g transform="translate(45, 245)">
      <rect width="665" height="190" rx="18" fill="#F0F7FB" stroke="#3D83AE" stroke-width="2.2"/>
      
      <!-- Nút Undo lớn phát sáng -->
      <g transform="translate(40, 30)" filter="url(#inkRestoreGlow)">
        <rect width="110" height="130" rx="18" fill="#1D4E72" stroke="#12334C" stroke-width="3"/>
        <path d="M 62 42 L 44 55 L 62 68" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 46 55 H 64 C 74 55 80 60 80 68 C 80 77 72 82 60 82 H 50" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- Khung nhãn bên cạnh -->
      <g transform="translate(180, 35)">
        <rect width="200" height="28" rx="8" fill="#E0F2FE"/>
      </g>
    </g>

    <!-- 3. DẢI NỀN GHI CHÚ CHÂN HÌNH (ĐÃ XÓA CHỮ) -->
    <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
  </g>
</svg>