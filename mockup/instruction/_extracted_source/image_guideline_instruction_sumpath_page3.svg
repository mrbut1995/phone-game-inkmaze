<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -10 785 535" width="785" height="535">
  <defs>
    <!-- Đổ bóng nổi cho panel -->
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <!-- Hiệu ứng phát sáng nút Undo -->
    <filter id="undoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#256286" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ================= PANEL CON MINH HỌA GUIDELINE (TRANG 3) ================= -->
  <g filter="url(#uiShadow)">
    <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#256286" stroke-width="3"/>

    <!-- 1. PHẦN TRÊN: SƠ ĐỒ CHIẾN THUẬT PHỐI HỢP SỐ (ĐÃ XÓA CHỮ) -->
    <g transform="translate(45, 30)">
      <rect width="665" height="195" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
      <rect x="25" y="16" width="230" height="28" rx="8" fill="#DCFCE7"/>

      <!-- Sơ đồ các khối số -->
      <g transform="translate(30, 60)">
        <!-- Cụm số lớn -->
        <g transform="translate(0, 0)">
          <rect width="130" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
        </g>

        <text x="155" y="38" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#15803D">➔</text>

        <!-- Cụm số nhỏ -->
        <g transform="translate(180, 0)">
          <rect width="130" height="60" rx="10" fill="#E0F2FE" stroke="#256286" stroke-width="1.8"/>
        </g>

        <text x="335" y="38" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#15803D">=</text>

        <!-- Mục tiêu -->
        <g transform="translate(360, 0)">
          <rect width="105" height="60" rx="10" fill="#FEF2F2" stroke="#D84444" stroke-width="2"/>
        </g>
      </g>
    </g>

    <!-- 2. PHẦN DƯỚI: KHỐI NÚT UNDO TRỪ NGƯỢC ĐIỂM (ĐÃ XÓA CHỮ) -->
    <g transform="translate(45, 245)">
      <rect width="665" height="190" rx="18" fill="#F0F7FB" stroke="#B8D7EA" stroke-width="2.2"/>
      
      <!-- Nút Undo lớn phát sáng -->
      <g transform="translate(40, 30)" filter="url(#undoGlow)">
        <rect width="110" height="130" rx="18" fill="#256286" stroke="#164663" stroke-width="3"/>
        <path d="M 62 42 L 44 55 L 62 68" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 46 55 H 64 C 74 55 80 60 80 68 C 80 77 72 82 60 82 H 50" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- Khung nhãn bên cạnh -->
      <g transform="translate(180, 35)">
        <rect width="215" height="28" rx="8" fill="#DCFCE7"/>
      </g>
    </g>

    <!-- 3. DẢI NỀN GHI CHÚ CHÂN HÌNH (ĐÃ XÓA CHỮ) -->
    <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
  </g>
</svg>