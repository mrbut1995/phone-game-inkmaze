<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -10 785 535" width="785" height="535">
  <defs>
    <!-- Đổ bóng nổi cho panel -->
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <!-- Hiệu ứng phát sáng nút Gợi Ý -->
    <filter id="hintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ================= PANEL CON MINH HỌA GUIDELINE (TRANG 3) ================= -->
  <g filter="url(#uiShadow)">
    <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#DC2626" stroke-width="3"/>

    <!-- 1. PHẦN TRÊN: SƠ ĐỒ PHÓNG THẲNG QUA Ô 0 (ĐÃ XÓA CHỮ) -->
    <g transform="translate(45, 30)">
      <rect width="665" height="195" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
      <rect x="25" y="16" width="220" height="28" rx="8" fill="#DCFCE7"/>

      <!-- Sơ đồ lướt nhanh -->
      <g transform="translate(40, 60)">
        <!-- Nút Start (S) -->
        <circle cx="30" cy="45" r="22" fill="#2E7D32"/>
        <text x="30" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">S</text>

        <!-- Ô số 0 an toàn (GIỮ NGUYÊN SỐ 0 TRONG Ô) -->
        <rect x="110" y="20" width="50" height="50" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
        <text x="135" y="45" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#15803D">0</text>

        <!-- Nút Finish (F) -->
        <circle cx="250" cy="45" r="22" fill="#D97706"/>
        <text x="250" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">F</text>
        
        <!-- Đường vẽ tốc độ phóng thẳng -->
        <path d="M 52 45 L 110 45 M 160 45 L 228 45" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>

        <rect x="75" y="95" width="160" height="26" rx="6" fill="#DCFCE7"/>
      </g>
    </g>

    <!-- 2. PHẦN DƯỚI: KHỐI GỢI Ý & HOÀN TÁC (ĐÃ XÓA CHỮ) -->
    <g transform="translate(45, 245)">
      <!-- Khối Gợi Ý -->
      <g transform="translate(0, 0)">
        <rect width="320" height="180" rx="18" fill="#FEFCE8" stroke="#FEF08A" stroke-width="2"/>
        
        <g transform="translate(25, 20)" filter="url(#hintGlow)">
          <rect width="48" height="48" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
          <path d="M 24 12 C 18 12 15 17 19 24 L 29 24 C 33 17 30 12 24 12 Z" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
          <line x1="21" y1="29" x2="27" y2="29" stroke="#F59E0B" stroke-width="2.2"/>
        </g>
      </g>

      <!-- Khối Hoàn Tác -->
      <g transform="translate(345, 0)">
        <rect width="320" height="180" rx="18" fill="#F0F7FB" stroke="#B8D7EA" stroke-width="2"/>
        
        <g transform="translate(25, 20)">
          <rect width="48" height="48" rx="12" fill="#FFFFFF" stroke="#3D83AE" stroke-width="2"/>
          <path d="M 30 18 L 20 25 L 30 32" fill="none" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 22 25 H 32 C 37 25 40 28 40 33 C 40 38 36 40 30 40 H 26" fill="none" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- 3. DẢI NỀN GHI CHÚ CHÂN HÌNH (ĐÃ XÓA CHỮ) -->
    <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
  </g>
</svg>