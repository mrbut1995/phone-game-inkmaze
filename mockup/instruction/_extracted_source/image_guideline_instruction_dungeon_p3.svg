<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -10 785 535" width="785" height="535">
  <defs>
    <!-- Đổ bóng cho toàn bộ panel -->
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <!-- Ký hiệu điểm neo Anchor góc ô lưới -->
    <g id="anchor-cross">
      <g stroke="#1E283A" stroke-width="3.5" stroke-linecap="round">
        <line x1="0" y1="-14" x2="0" y2="-4"/>
        <line x1="0" y1="4"   x2="0" y2="14"/>
        <line x1="-14" y1="0" x2="-4" y2="0"/>
        <line x1="4"   y1="0" x2="14"  y2="0"/>
      </g>
    </g>
  </defs>

  <!-- ================= PANEL CON MINH HỌA GUIDELINE (TRANG 3) ================= -->
  <g filter="url(#uiShadow)">
    <!-- Khung nền viền vàng cam bo góc -->
    <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#F59E0B" stroke-width="3"/>

    <!-- 1. NỬA TRÁI: TẦNG ĐẦU CÒN TƯỜNG GỢI Ý (ĐÃ XÓA CHỮ) -->
    <g transform="translate(45, 35)">
      <rect width="310" height="395" rx="18" fill="#F0F7FB" stroke="#B8D7EA" stroke-width="2"/>
      <!-- Khung nhãn badge nhỏ phía trên -->
      <rect x="20" y="16" width="165" height="28" rx="8" fill="#EBF3F8"/>

      <!-- Lưới mini 2x2 có tường sẵn màu đen dày -->
      <g transform="translate(65, 65)">
        <rect width="180" height="180" rx="12" fill="#FFFFFF" stroke="#BACEDC" stroke-width="2"/>
        <line x1="90" y1="0" x2="90" y2="180" stroke="#BACEDC" stroke-width="1.5"/>
        <line x1="0" y1="90" x2="180" y2="90" stroke="#BACEDC" stroke-width="1.5"/>
        
        <!-- CÁC ĐOẠN TƯỜNG SẴN THẤY ĐƯỢC (NÉT ĐEN ĐẬM) -->
        <line x1="90" y1="0" x2="90" y2="90" stroke="#1E283A" stroke-width="10" stroke-linecap="round"/>
        <line x1="0" y1="90" x2="90" y2="90" stroke="#1E283A" stroke-width="10" stroke-linecap="round"/>

        <!-- GIỮ NGUYÊN CON SỐ TRONG GRID TRÁI -->
        <g font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#224C6D" text-anchor="middle" dominant-baseline="central">
          <text x="45" y="45">2</text>
          <text x="135" y="45">1</text>
          <text x="45" y="135">1</text>
          <text x="135" y="135">0</text>
        </g>
      </g>
    </g>

    <!-- 2. NỬA PHẢI: TẦNG SÂU 100% TƯỜNG VÔ HÌNH (ĐÃ XÓA CHỮ) -->
    <g transform="translate(400, 35)">
      <rect width="310" height="395" rx="18" fill="#FFFDF8" stroke="#F59E0B" stroke-width="2.5"/>
      <!-- Khung nhãn badge nhỏ phía trên -->
      <rect x="20" y="16" width="165" height="28" rx="8" fill="#FEF3C7"/>

      <!-- Lưới mini 2x2 nối Anchor bằng nét cam Ghi Nhớ -->
      <g transform="translate(65, 65)">
        <rect width="180" height="180" rx="12" fill="#FFFFFF" stroke="#BACEDC" stroke-width="2"/>
        <line x1="90" y1="0" x2="90" y2="180" stroke="#BACEDC" stroke-width="1.5"/>
        <line x1="0" y1="90" x2="180" y2="90" stroke="#BACEDC" stroke-width="1.5"/>

        <!-- Các Anchor chữ thập ở giao điểm -->
        <use href="#anchor-cross" x="90" y="0"/>
        <use href="#anchor-cross" x="90" y="90"/>
        <use href="#anchor-cross" x="0" y="90"/>

        <!-- ĐƯỜNG TƯỜNG GHI NHỚ CAM NÉT ĐỨT TỰ NỐI -->
        <line x1="90" y1="0" x2="90" y2="90" stroke="#D97706" stroke-width="8" stroke-dasharray="8 5" stroke-linecap="round"/>

        <!-- GIỮ NGUYÊN CON SỐ TRONG GRID PHẢI -->
        <g font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#224C6D" text-anchor="middle" dominant-baseline="central">
          <text x="45" y="45">2</text>
          <text x="135" y="45">1</text>
          <text x="45" y="135">1</text>
          <text x="135" y="135">0</text>
        </g>
      </g>
    </g>

    <!-- 3. DẢI NỀN GHI CHÚ CHÂN HÌNH (ĐÃ XÓA CHỮ) -->
    <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
  </g>
</svg>