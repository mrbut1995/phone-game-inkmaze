<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -10 785 535" width="785" height="535">
  <defs>
    <!-- Bộ lọc đổ bóng cho panel và các thành phần -->
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <filter id="pathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2575A7" flood-opacity="0.45"/>
    </filter>

    <!-- Gradient hố thang Đích -->
    <linearGradient id="dungeonDeepVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C4B59" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#1B2834" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0A1118" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Gradient hố thang Bắt đầu -->
    <linearGradient id="dungeonUpperLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#3C4B59" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1B2834" stop-opacity="0.75"/>
    </linearGradient>

    <!-- TÀI NGUYÊN: CẦU THANG BẮT ĐẦU (START) -->
    <g id="stair-start">
      <rect width="130" height="130" fill="#FAF5EB"/>
      <rect x="8" y="8" width="114" height="114" rx="8" fill="#EAE3D2" stroke="#1E283A" stroke-width="3"/>
      <rect x="12" y="12" width="106" height="106" fill="url(#dungeonUpperLight)"/>
      <g stroke="#1E283A" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="14" x2="122" y2="14" stroke-width="3"/>
        <polygon points="42,14 88,14 86,22 44,22" fill="#FFFBE8" stroke-width="1.8"/>
        <polygon points="44,22 86,22 90,36 40,36" fill="#D5C7B2" stroke-width="2.2"/>
        <rect x="40" y="36" width="50" height="10" fill="#9C8D78" stroke-width="2.2"/>
        <polygon points="40,46 90,46 96,62 34,62" fill="#E2D5C0" stroke-width="2.5"/>
        <rect x="34" y="62" width="62" height="12" fill="#BFAF9B" stroke-width="2.5"/>
        <polygon points="34,74 96,74 102,90 28,90" fill="#EDE4D4" stroke-width="2.5"/>
        <rect x="28" y="90" width="74" height="12" fill="#CBBFAA" stroke-width="2.5"/>
        <polygon points="28,102 102,102 108,116 22,116" fill="#F7F1E6" stroke-width="2.5"/>
        <rect x="22" y="116" width="86" height="6" fill="#DCD1BF" stroke-width="2.5"/>
      </g>
      <rect x="1" y="1" width="128" height="128" rx="8" fill="none" stroke="#2575A7" stroke-width="2.5"/>
    </g>

    <!-- TÀI NGUYÊN: CẦU THANG KẾT THÚC (FINISH) -->
    <g id="stair-finish">
      <rect width="130" height="130" fill="#FAF5EB"/>
      <rect x="8" y="8" width="114" height="114" rx="8" fill="#EAE3D2" stroke="#1E283A" stroke-width="3"/>
      <rect x="12" y="12" width="106" height="106" fill="url(#dungeonDeepVoid)"/>
      <g stroke="#1E283A" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="14" x2="122" y2="14" stroke-width="3"/>
        <polygon points="16,14 114,14 106,32 24,32" fill="#F7F1E6" stroke-width="2.5"/>
        <rect x="24" y="32" width="82" height="12" fill="#CBBFAA" stroke-width="2.5"/>
        <polygon points="24,44 106,44 98,60 32,60" fill="#E2D5C0" stroke-width="2.5"/>
        <rect x="32" y="60" width="66" height="12" fill="#A49580" stroke-width="2.5"/>
        <polygon points="32,72 98,72 90,86 40,86" fill="#BFAF9B" stroke-width="2.5"/>
        <rect x="40" y="86" width="50" height="12" fill="#756755" stroke-width="2.5"/>
        <polygon points="40,98 90,98 84,108 46,108" fill="#807260" stroke-width="2.2"/>
        <rect x="46" y="108" width="38" height="8" fill="#42382C" stroke-width="2.2"/>
        <polygon points="46,116 84,116 80,120 50,120" fill="#0A1118" stroke-width="1.5"/>
      </g>
      <rect x="1" y="1" width="128" height="128" rx="8" fill="none" stroke="#D84444" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- ================= PANEL CON MINH HỌA GUIDELINE ================= -->
  <g filter="url(#uiShadow)">
    <!-- Khung nền viền cam bo góc -->
    <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#F59E0B" stroke-width="3"/>

    <!-- 1. CÁC THẺ HUD TRÊN ĐỈNH (ĐÃ XÓA CHỮ) -->
    <g transform="translate(25, 25)">
      <!-- Thẻ Bước còn lại -->
      <rect width="280" height="74" rx="14" fill="#FEF2F2" stroke="#D84444" stroke-width="2.2"/>
      <!-- Thẻ Tầng hiện tại -->
      <rect x="295" width="210" height="74" rx="14" fill="#F0F7FB" stroke="#6EA0C8" stroke-width="2"/>
      <!-- Thẻ Thời gian -->
      <rect x="520" width="185" height="74" rx="14" fill="#FEFDFA" stroke="#BACEDC" stroke-width="2"/>
    </g>

    <!-- 2. LƯỚI MINI 3x3 CELL MÔ PHỎNG (GIỮ NGUYÊN CON SỐ & ĐƯỜNG ĐI) -->
    <g transform="translate(225, 125)">
      <g fill="#F4F8FA" stroke="#BACEDC" stroke-width="2">
        <!-- Hàng 0 -->
        <rect x="0" y="0" width="100" height="100"/>
        <rect x="100" y="0" width="100" height="100"/>
        <!-- Cầu thang đích tại [0,2] -->
        <g transform="translate(200, 0) scale(0.77)">
          <use href="#stair-finish"/>
        </g>

        <!-- Hàng 1 -->
        <rect x="0" y="100" width="100" height="100"/>
        <rect x="100" y="100" width="100" height="100"/>
        <rect x="200" y="100" width="100" height="100"/>

        <!-- Hàng 2 -->
        <!-- Cầu thang bắt đầu tại [2,0] -->
        <g transform="translate(0, 200) scale(0.77)">
          <use href="#stair-start"/>
        </g>
        <rect x="100" y="200" width="100" height="100"/>
        <rect x="200" y="200" width="100" height="100"/>
      </g>

      <!-- GIỮ NGUYÊN CÁC CON SỐ TRONG GRID -->
      <g font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#2A4860" text-anchor="middle" dominant-baseline="central">
        <text x="50" y="50">1</text>
        <text x="150" y="50">2</text>
        <text x="50" y="150">2</text>
        <text x="150" y="150">0</text>
        <text x="250" y="150">1</text>
        <text x="150" y="250">1</text>
        <text x="250" y="250">2</text>
      </g>

      <!-- ĐƯỜNG VẼ PHÁT SÁNG NỐI START -> FINISH -->
      <path d="M 50 250 L 50 150 L 150 150 L 150 50 L 250 50" 
            fill="none" stroke="#2575A7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#pathGlow)"/>
      <path d="M 50 250 L 50 150 L 150 150 L 150 50 L 250 50" 
            fill="none" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 3. KHUNG CALLOUT TRÁI & PHẢI (ĐÃ XÓA CHỮ) -->
    <rect x="25" y="230" width="175" height="85" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.8"/>
    <rect x="555" y="215" width="175" height="100" rx="14" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/>

    <!-- 4. DẢI NỀN GHI CHÚ CHÂN HÌNH (ĐÃ XÓA CHỮ) -->
    <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
  </g>
</svg>