<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <filter id="paperSlipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A120B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1A120B" flood-opacity="0.15"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <g id="bomb-icon">
      <circle cx="0" cy="4" r="26" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
      <ellipse cx="-8" cy="-4" rx="6" ry="3" fill="#94A3B8" opacity="0.6"/>
      <rect x="-6" y="-28" width="12" height="8" rx="2" fill="#64748B" stroke="#0F172A" stroke-width="2"/>
      <path d="M 0 -28 Q 12 -38 18 -32" fill="none" stroke="#D97706" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="21" cy="-33" r="5" fill="#EF4444"/>
      <circle cx="21" cy="-33" r="2.5" fill="#FDE047"/>
    </g>
  </defs>

  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.55"/>

  <!-- TỜ GIẤY HƯỚNG DẪN (920 x 1480 px tại x=80, y=200) -->
  <g transform="translate(80, 200)">
    <g filter="url(#paperSlipShadow)">
      <rect width="920" height="1480" rx="26" fill="#FFFDF9"/>
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="120" r="8"/><circle cx="28" cy="240" r="8"/><circle cx="28" cy="360" r="8"/>
        <circle cx="28" cy="480" r="8"/><circle cx="28" cy="600" r="8"/><circle cx="28" cy="720" r="8"/>
        <circle cx="28" cy="840" r="8"/><circle cx="28" cy="960" r="8"/><circle cx="28" cy="1080" r="8"/>
        <circle cx="28" cy="1200" r="8"/><circle cx="28" cy="1320" r="8"/><circle cx="28" cy="1440" r="8"/>
      </g>
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.35">
        <line x1="80" y1="210" x2="860" y2="210"/><line x1="80" y1="770" x2="860" y2="770"/>
        <line x1="80" y1="850" x2="860" y2="850"/><line x1="80" y1="930" x2="860" y2="930"/>
        <line x1="80" y1="1010" x2="860" y2="1010"/><line x1="80" y1="1090" x2="860" y2="1090"/>
        <line x1="80" y1="1170" x2="860" y2="1170"/><line x1="80" y1="1250" x2="860" y2="1250"/>
      </g>
      <line x1="80" y1="0" x2="80" y2="1480" stroke="#D84444" stroke-width="3" opacity="0.85"/>
      <rect width="920" height="1480" rx="26" fill="none" stroke="#D84444" stroke-width="3.5"/>
    </g>

    <!-- WASHI TAPE -->
    <g transform="translate(350, -22)">
      <rect width="220" height="46" rx="4" fill="#E8DFCA" fill-opacity="0.9" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" stroke="#B5A98F" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- NÚT ĐÓNG NHANH "✕" -->
    <g transform="translate(830, 24)" style="cursor: pointer;">
      <circle cx="28" cy="28" r="24" fill="#F4EFE6" stroke="#BACEDC" stroke-width="2"/>
      <path d="M 18 18 L 38 38 M 38 18 L 18 38" stroke="#224C6D" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- HEADER POPUP -->
    <g transform="translate(110, 48)">
      <rect width="210" height="30" rx="8" fill="#FEE2E2"/>
      <text x="105" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#B91C1C" letter-spacing="1">MINESWEEPER MAZE 💣</text>
      <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="950" fill="#224C6D">Công Cụ &amp; HUD Đếm Bom</text>
    </g>

    <!-- THANH TAB: TAB 3 ĐANG ACTIVE -->
    <g transform="translate(105, 142)">
      <rect x="0" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="122" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#718B9E">① LUẬT 8 Ô BOM</text>

      <rect x="255" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="377" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#718B9E">② ĐẠP BOM &amp; VÙNG 0</text>

      <rect x="510" y="0" width="245" height="48" rx="14" fill="#D84444"/>
      <text x="632" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">③ CÔNG CỤ DÒ BOM</text>
    </g>

    <!-- KHUNG HÌNH MINH HỌA (755 x 510 px tại x=105, y=210) -->
    <g transform="translate(105, 210)" filter="url(#uiShadow)">
      <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#D84444" stroke-width="3"/>

      <!-- PHẦN 1: MÔ PHỎNG THẺ HUD "BOM CÒN LẠI" -->
      <g transform="translate(45, 30)">
        <rect width="665" height="185" rx="18" fill="#FFFDF8" stroke="#D84444" stroke-width="2.5"/>
        <line x1="20" y1="0" x2="20" y2="185" stroke="#D84444" stroke-width="2.5"/>

        <!-- Bên trong thẻ HUD Bom -->
        <g transform="translate(40, 20)">
          <!-- Cột số lượng -->
          <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="900" fill="#D84444">💣 BOM CÒN LẠI TRÊN BÀN</text>
          <text x="0" y="85" font-family="'Segoe UI', monospace" font-size="64" font-weight="950" fill="#B91C1C">03<tspan font-size="34" fill="#8FA0AC"> / 05</tspan></text>
          <text x="0" y="125" font-family="sans-serif" font-size="14" font-weight="800" fill="#718B9E">Đã phát hiện 2 quả • Còn 3 quả ẩn giấu</text>

          <!-- Sticker bom bên phải thẻ HUD -->
          <g transform="translate(460, 45) scale(1.5)"><use href="#bomb-icon"/></g>
        </g>
      </g>

      <!-- PHẦN 2: CẮM CỜ GHI NHỚ VÀ HOÀN TÁC -->
      <g transform="translate(45, 245)">
        <!-- Khối cắm cờ đánh dấu ô -->
        <g transform="translate(0, 0)">
          <rect width="320" height="180" rx="18" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
          <g transform="translate(25, 20)">
            <rect width="48" height="48" rx="12" fill="#FFFFFF" stroke="#D84444" stroke-width="2"/>
            <!-- Cờ đỏ cắm -->
            <path d="M 18 10 L 36 18 L 18 26 Z" fill="#DC2626"/>
            <line x1="18" y1="8" x2="18" y2="38" stroke="#1E283A" stroke-width="3" stroke-linecap="round"/>
          </g>

          <text x="88" y="44" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="950" fill="#991B1B">CẮM CỜ KHÓA Ô</text>
          <text x="88" y="66" font-family="sans-serif" font-size="13" font-weight="800" fill="#D84444">Chống bấm nhầm</text>
          <text x="25" y="110" font-family="sans-serif" font-size="14" font-weight="600" fill="#7F1D1D">Dùng nút Ghi Nhớ để cắm cờ</text>
          <text x="25" y="132" font-family="sans-serif" font-size="14" font-weight="600" fill="#7F1D1D">vào ô bạn nghi là có bom.</text>
          <text x="25" y="154" font-family="sans-serif" font-size="13" font-weight="800" fill="#B91C1C">Ô cắm cờ sẽ bị khóa an toàn!</text>
        </g>

        <!-- Khối Undo Hoàn tác -->
        <g transform="translate(345, 0)">
          <rect width="320" height="180" rx="18" fill="#F0F7FB" stroke="#B8D7EA" stroke-width="2"/>
          <g transform="translate(25, 20)">
            <rect width="48" height="48" rx="12" fill="#FFFFFF" stroke="#3D83AE" stroke-width="2"/>
            <path d="M 30 18 L 20 25 L 30 32" fill="none" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 22 25 H 32 C 37 25 40 28 40 33 C 40 38 36 40 30 40 H 26" fill="none" stroke="#3D83AE" stroke-width="3.5" stroke-linecap="round"/>
          </g>

          <text x="88" y="44" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="950" fill="#163A58">HOÀN TÁC</text>
          <text x="88" y="66" font-family="sans-serif" font-size="13" font-weight="800" fill="#3D83AE">Lùi 1 bước an toàn</text>
          <text x="25" y="110" font-family="sans-serif" font-size="14" font-weight="600" fill="#5A7385">Lỡ bước nhầm ô nguy hiểm?</text>
          <text x="25" y="132" font-family="sans-serif" font-size="14" font-weight="600" fill="#5A7385">Bấm Undo để lùi lại ngay lập tức</text>
          <text x="25" y="154" font-family="sans-serif" font-size="13" font-weight="800" fill="#256286">trước khi dẫn đến sai lầm.</text>
        </g>
      </g>

      <!-- DẢI CHÂN HÌNH -->
      <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
      <text x="377" y="475" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#224C6D">
        💡 Luôn để mắt tới thẻ HUD Bom để biết mình đã cô lập hết bom trên bàn chưa!
      </text>
    </g>

    <!-- NỘI DUNG CHI TIẾT DẠNG THẺ -->
    <g transform="translate(105, 755)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="900" fill="#D84444" letter-spacing="1.5">BÍ QUYẾT PHÁ ĐẢO</text>

      <!-- Ý 1 -->
      <g transform="translate(0, 42)">
        <rect width="755" height="76" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#D84444"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">1</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#B91C1C">Cắm Cờ Trước Khi Vẽ Đường:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#7F1D1D">Khi phát hiện ô chắc chắn có bom, hãy cắm cờ khóa ô lại ngay để tránh tay quẹt trúng.</text>
      </g>

      <!-- Ý 2 -->
      <g transform="translate(0, 130)">
        <rect width="755" height="76" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#16A34A"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">2</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#15803D">Kiểm Tra Tổng Số Bom Trên HUD:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#166534">Đối chiếu số cờ đã cắm với số bom còn lại trên HUD để đảm bảo không bỏ sót quả nào.</text>
      </g>

      <!-- Ý 3 -->
      <g transform="translate(0, 218)">
        <rect width="755" height="76" rx="14" fill="#F0F7FB" stroke="#D1E2ED" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#3D83AE"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">3</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#224C6D">Hồi Sinh Rút Lại Bước Lỗi:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#5A7385">Nếu lỡ đạp trúng bom, bạn có thể hồi sinh để quay lại ô ngay trước đó và thử hướng khác.</text>
      </g>
    </g>

    <!-- ĐIỀU KHIỂN PAGING SLIDE & NÚT HOÀN TẤT -->
    <g transform="translate(105, 1100)">
      <g transform="translate(0, 0)">
        <!-- Nút lùi: BẬT (về Trang 2) -->
        <g style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#D84444" stroke-width="2.5"/>
          <path d="M 30 18 L 20 26 L 30 34" fill="none" stroke="#D84444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Dots: Dot 3 active -->
        <g transform="translate(80, 16)">
          <circle cx="9" cy="9" r="8" fill="#D1E2ED"/>
          <circle cx="37" cy="9" r="8" fill="#D1E2ED"/>
          <rect x="55" y="0" width="38" height="18" rx="9" fill="#D84444"/>
        </g>

        <!-- Nút tiến: Mờ vì đã là trang cuối -->
        <g transform="translate(200, 0)" opacity="0.35">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#BACEDC" stroke-width="2.5"/>
          <path d="M 22 18 L 32 26 L 22 34" fill="none" stroke="#718B9E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <text x="755" y="34" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#D84444">TRANG 3 / 3</text>
      </g>

      <!-- NÚT HÀNH ĐỘNG CUỐI CÙNG: ĐÃ HIỂU • BẮT ĐẦU DÒ MÌN -->
      <g transform="translate(0, 80)" style="cursor: pointer;" filter="url(#uiShadow)">
        <rect width="755" height="100" rx="22" fill="#B91C1C" stroke="#7F1D1D" stroke-width="3.5"/>
        <line x1="42" y1="0" x2="42" y2="100" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
        
        <text x="397" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#FFFFFF" letter-spacing="1">
          ĐÃ HIỂU • BẮT ĐẦU DÒ MÌN 💣
        </text>
      </g>

      <text x="377" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#D84444" style="cursor: pointer;">
        ↺ Xem lại từ đầu (Trang 1)
      </text>
    </g>
  </g>

  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>