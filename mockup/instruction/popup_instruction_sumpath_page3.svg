<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <filter id="paperSlipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A120B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1A120B" flood-opacity="0.15"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <filter id="undoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#256286" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.55"/>

  <!-- TỜ GIẤY HƯỚNG DẪN (920 x 1480 px tại x=80, y=200) -->
  <g transform="translate(80, 200)">
    <g filter="url(#paperSlipShadow)">
      <rect width="920" height="1480" rx="26" fill="#FFFDF9"/>
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="120" r="8"/><circle cx="28" cy="240" r="8"/><circle cx="28" cy="360" r="8"/>
        <circle cx="28" cy="480" r="8"/><circle cx="28" cy="600" r="8"/><circle cx="28" cy="720" r="8"/>
        <circle cx="28" cy="840" r="8"/><circle cx="28" cy="960" r="8"/><circle cx="28" cy="1080" r="8"/>
        <circle cx="28" cy="1200" r="8"/><circle cx="28" cy="1320" r="8"/><circle cx="28" cy="1440" r="8"/>
      </g>
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.35">
        <line x1="80" y1="210" x2="860" y2="210"/><line x1="80" y1="770" x2="860" y2="770"/>
        <line x1="80" y1="850" x2="860" y2="850"/><line x1="80" y1="930" x2="860" y2="930"/>
        <line x1="80" y1="1010" x2="860" y2="1010"/><line x1="80" y1="1090" x2="860" y2="1090"/>
        <line x1="80" y1="1170" x2="860" y2="1170"/><line x1="80" y1="1250" x2="860" y2="1250"/>
      </g>
      <line x1="80" y1="0" x2="80" y2="1480" stroke="#D84444" stroke-width="3" opacity="0.85"/>
      <rect width="920" height="1480" rx="26" fill="none" stroke="#256286" stroke-width="3.5"/>
    </g>

    <!-- WASHI TAPE -->
    <g transform="translate(350, -22)">
      <rect width="220" height="46" rx="4" fill="#E8DFCA" fill-opacity="0.9" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" stroke="#B5A98F" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- NÚT ĐÓNG NHANH "✕" -->
    <g transform="translate(830, 24)" style="cursor: pointer;">
      <circle cx="28" cy="28" r="24" fill="#F4EFE6" stroke="#BACEDC" stroke-width="2"/>
      <path d="M 18 18 L 38 38 M 38 18 L 18 38" stroke="#224C6D" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- HEADER POPUP -->
    <g transform="translate(110, 48)">
      <rect width="210" height="30" rx="8" fill="#E0F2FE"/>
      <text x="105" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#0369A1" letter-spacing="1">SUM PATH • TOÁN ĐỐ ➕</text>
      <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="950" fill="#224C6D">Chiến Thuật &amp; Undo Sửa Sai</text>
    </g>

    <!-- THANH TAB: TAB 3 ĐANG ACTIVE -->
    <g transform="translate(105, 142)">
      <rect x="0" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="122" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">① CỘNG TỔNG &amp; MỤC TIÊU</text>

      <rect x="255" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="377" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">② TOÁN TỬ &amp; Ô 1 LẦN</text>

      <rect x="510" y="0" width="245" height="48" rx="14" fill="#256286"/>
      <text x="632" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">③ BÍ QUYẾT TÍNH &amp; UNDO</text>
    </g>

    <!-- KHUNG HÌNH MINH HỌA (755 x 510 px tại x=105, y=210) -->
    <g transform="translate(105, 210)" filter="url(#uiShadow)">
      <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#256286" stroke-width="3"/>

      <!-- PHẦN 1: CHIẾN THUẬT PHỐI HỢP SỐ LỚN & SỐ NHỎ -->
      <g transform="translate(45, 30)">
        <rect width="665" height="195" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
        <rect x="25" y="16" width="230" height="28" rx="8" fill="#DCFCE7"/>
        <text x="140" y="35" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#15803D">✓ CHIẾN THUẬT: SỐ LỚN &amp; SỐ NHỎ</text>

        <!-- Sơ đồ phối hợp số -->
        <g transform="translate(30, 60)">
          <!-- Cụm số lớn -->
          <g transform="translate(0, 0)">
            <rect width="130" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
            <text x="65" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="950" fill="#166534">Ô 7, 8, 9</text>
            <text x="65" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#15803D">Dồn điểm cực nhanh</text>
          </g>

          <text x="155" y="35" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#15803D">➔</text>

          <!-- Cụm số nhỏ -->
          <g transform="translate(180, 0)">
            <rect width="130" height="60" rx="10" fill="#E0F2FE" stroke="#256286" stroke-width="1.8"/>
            <text x="65" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="950" fill="#163A58">Ô 1, 2, 3</text>
            <text x="65" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#256286">Tinh chỉnh vừa khít</text>
          </g>

          <text x="335" y="35" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#15803D">=</text>

          <!-- Mục tiêu -->
          <g transform="translate(360, 0)">
            <rect width="105" height="60" rx="10" fill="#FEF2F2" stroke="#D84444" stroke-width="2"/>
            <text x="52" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="950" fill="#B91C1C">50 ĐIỂM</text>
            <text x="52" y="48" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#D84444">HOÀN HẢO ✓</text>
          </g>
        </g>

        <!-- Giải thích -->
        <g transform="translate(30, 140)">
          <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#14532D">
            • Khi mục tiêu còn xa: Ưu tiên gom các ô số to. Khi gần chạm mốc: Rẽ qua ô số nhỏ để chốt hạ!
          </text>
        </g>
      </g>

      <!-- PHẦN 2: NÚT HOÀN TÁC (UNDO) TRỪ NGƯỢC ĐIỂM -->
      <g transform="translate(45, 245)">
        <rect width="665" height="190" rx="18" fill="#F0F7FB" stroke="#B8D7EA" stroke-width="2.2"/>
        
        <!-- Nút Undo lớn phát sáng -->
        <g transform="translate(40, 30)" filter="url(#undoGlow)">
          <rect width="110" height="130" rx="18" fill="#256286" stroke="#164663" stroke-width="3"/>
          <path d="M 62 42 L 44 55 L 62 68" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 46 55 H 64 C 74 55 80 60 80 68 C 80 77 72 82 60 82 H 50" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
          <text x="55" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="950" fill="#BAE6FD">UNDO</text>
        </g>

        <!-- Giải thích tính năng trừ ngược điểm -->
        <g transform="translate(180, 35)">
          <rect width="215" height="28" rx="8" fill="#DCFCE7"/>
          <text x="107" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#15803D">TRỪ NGƯỢC ĐIỂM SỐ</text>

          <text x="0" y="62" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="950" fill="#163A58">LỠ CỘNG LỐ ĐIỂM? SỬA NGAY!</text>
          <text x="0" y="92" font-family="sans-serif" font-size="15" font-weight="600" fill="#5A7385">Bấm Undo lùi lại 1 bước, điểm số của ô đó</text>
          <text x="0" y="116" font-family="sans-serif" font-size="15" font-weight="600" fill="#5A7385">sẽ được trừ ngược ra khỏi Tổng Hiện Tại để bạn chọn nhánh khác.</text>
        </g>
      </g>

      <!-- DẢI CHÂN HÌNH -->
      <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
      <text x="377" y="475" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#224C6D">
        💡 Luôn có ít nhất 1 nghiệm đúng! Hãy tận dụng Undo để thử nghiệm các hướng tính toán.
      </text>
    </g>

    <!-- NỘI DUNG CHI TIẾT DẠNG THẺ -->
    <g transform="translate(105, 755)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="900" fill="#256286" letter-spacing="1.5">BÍ QUYẾT TÍNH TOÁN</text>

      <!-- Ý 1 -->
      <g transform="translate(0, 42)">
        <rect width="755" height="76" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#16A34A"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">1</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#15803D">Bản Cờ Luôn Có Ít Nhất 1 Nghiệm Đúng:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#166534">Mỗi màn đều đảm bảo có ít nhất một đường đi hoàn hảo thỏa mãn đúng toán tử mục tiêu.</text>
      </g>

      <!-- Ý 2 -->
      <g transform="translate(0, 130)">
        <rect width="755" height="76" rx="14" fill="#F0F7FB" stroke="#D1E2ED" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#256286"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">2</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#163A58">Dùng Undo Để Thu Hồi Điểm Lố:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#5A7385">Nếu lỡ bước vào ô số to khiến tổng vượt quá mục tiêu, chỉ cần Undo lùi lại để trừ điểm ra.</text>
      </g>

      <!-- Ý 3 -->
      <g transform="translate(0, 218)">
        <rect width="755" height="76" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#D97706"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">3</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#92400E">Đua Tốc Độ Phá Giải:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#78350F">Game không giới hạn số bước — người nhẩm tính nhanh và về đích sớm nhất sẽ đạt hạng cao!</text>
      </g>
    </g>

    <!-- ĐIỀU KHIỂN PAGING SLIDE & NÚT BẮT ĐẦU CHƠI -->
    <g transform="translate(105, 1100)">
      <g transform="translate(0, 0)">
        <!-- Nút lùi: BẬT (về Trang 2) -->
        <g style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#256286" stroke-width="2.5"/>
          <path d="M 30 18 L 20 26 L 30 34" fill="none" stroke="#256286" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Dots: Dot 3 active -->
        <g transform="translate(80, 16)">
          <circle cx="9" cy="9" r="8" fill="#D1E2ED"/>
          <circle cx="37" cy="9" r="8" fill="#D1E2ED"/>
          <rect x="55" y="0" width="38" height="18" rx="9" fill="#256286"/>
        </g>

        <!-- Nút tiến: Mờ vì đã là trang cuối -->
        <g transform="translate(200, 0)" opacity="0.35">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#BACEDC" stroke-width="2.5"/>
          <path d="M 22 18 L 32 26 L 22 34" fill="none" stroke="#718B9E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <text x="755" y="34" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#256286">TRANG 3 / 3</text>
      </g>

      <!-- NÚT HÀNH ĐỘNG CUỐI CÙNG: ĐÃ HIỂU • BẮT ĐẦU CỘNG ĐIỂM (XANH NAVY TOÁN HỌC) -->
      <g transform="translate(0, 80)" style="cursor: pointer;" filter="url(#uiShadow)">
        <rect width="755" height="100" rx="22" fill="#256286" stroke="#164663" stroke-width="3.5"/>
        <line x1="42" y1="0" x2="42" y2="100" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
        
        <text x="397" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#FFFFFF" letter-spacing="1">
          ĐÃ HIỂU • BẮT ĐẦU CỘNG ĐIỂM ➕
        </text>
      </g>

      <text x="377" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#256286" style="cursor: pointer;">
        ↺ Xem lại từ đầu (Trang 1)
      </text>
    </g>
  </g>

  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>