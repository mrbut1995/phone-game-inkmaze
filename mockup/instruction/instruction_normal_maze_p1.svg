<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Lưới vở nền gốc phía dưới -->
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <!-- Đổ bóng nổi của tờ giấy popup -->
    <filter id="paperSlipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A120B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1A120B" flood-opacity="0.15"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <filter id="pathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2575A7" flood-opacity="0.45"/>
    </filter>

    <!-- Gradient hố sâu của Cầu Thang Đích (Finish) -->
    <linearGradient id="dungeonDeepVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C4B59" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#1B2834" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0A1118" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Gradient ánh sáng từ tầng trên rọi xuống của Cầu Thang Bắt Đầu (Start) -->
    <linearGradient id="dungeonUpperLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#3C4B59" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1B2834" stop-opacity="0.75"/>
    </linearGradient>

    <!-- TÀI NGUYÊN: CẦU THANG START (BẮT ĐẦU) VIEWBOX 130x130 -->
    <g id="stair-start">
      <rect width="130" height="130" fill="#FAF5EB"/>
      <rect x="8" y="8" width="114" height="114" rx="8" fill="#EAE3D2" stroke="#1E283A" stroke-width="3"/>
      <rect x="12" y="12" width="106" height="106" fill="url(#dungeonUpperLight)"/>
      <g stroke="#1E283A" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="14" x2="122" y2="14" stroke-width="3"/>
        <polygon points="42,14 88,14 86,22 44,22" fill="#FFFBE8" stroke-width="1.8"/>
        <!-- Bậc 1 -->
        <polygon points="44,22 86,22 90,36 40,36" fill="#D5C7B2" stroke-width="2.2"/>
        <rect x="40" y="36" width="50" height="10" fill="#9C8D78" stroke-width="2.2"/>
        <!-- Bậc 2 -->
        <polygon points="40,46 90,46 96,62 34,62" fill="#E2D5C0" stroke-width="2.5"/>
        <rect x="34" y="62" width="62" height="12" fill="#BFAF9B" stroke-width="2.5"/>
        <!-- Bậc 3 -->
        <polygon points="34,74 96,74 102,90 28,90" fill="#EDE4D4" stroke-width="2.5"/>
        <rect x="28" y="90" width="74" height="12" fill="#CBBFAA" stroke-width="2.5"/>
        <!-- Bậc 4 -->
        <polygon points="28,102 102,102 108,116 22,116" fill="#F7F1E6" stroke-width="2.5"/>
        <rect x="22" y="116" width="86" height="6" fill="#DCD1BF" stroke-width="2.5"/>
      </g>
      <rect x="1" y="1" width="128" height="128" rx="8" fill="none" stroke="#2575A7" stroke-width="2.5"/>
    </g>

    <!-- TÀI NGUYÊN: CẦU THANG FINISH (ĐÍCH ĐẾN) VIEWBOX 130x130 -->
    <g id="stair-finish">
      <rect width="130" height="130" fill="#FAF5EB"/>
      <rect x="8" y="8" width="114" height="114" rx="8" fill="#EAE3D2" stroke="#1E283A" stroke-width="3"/>
      <rect x="12" y="12" width="106" height="106" fill="url(#dungeonDeepVoid)"/>
      <g stroke="#1E283A" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="14" x2="122" y2="14" stroke-width="3"/>
        <!-- Bậc 1 -->
        <polygon points="16,14 114,14 106,32 24,32" fill="#F7F1E6" stroke-width="2.5"/>
        <rect x="24" y="32" width="82" height="12" fill="#CBBFAA" stroke-width="2.5"/>
        <!-- Bậc 2 -->
        <polygon points="24,44 106,44 98,60 32,60" fill="#E2D5C0" stroke-width="2.5"/>
        <rect x="32" y="60" width="66" height="12" fill="#A49580" stroke-width="2.5"/>
        <!-- Bậc 3 -->
        <polygon points="32,72 98,72 90,86 40,86" fill="#BFAF9B" stroke-width="2.5"/>
        <rect x="40" y="86" width="50" height="12" fill="#756755" stroke-width="2.5"/>
        <!-- Bậc 4 & Hố đen -->
        <polygon points="40,98 90,98 84,108 46,108" fill="#807260" stroke-width="2.2"/>
        <rect x="46" y="108" width="38" height="8" fill="#42382C" stroke-width="2.2"/>
        <polygon points="46,116 84,116 80,120 50,120" fill="#0A1118" stroke-width="1.5"/>
      </g>
      <rect x="1" y="1" width="128" height="128" rx="8" fill="none" stroke="#D84444" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- ================= 1. NỀN MÀN CHƠI PHÍA SAU ================= -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>

  <!-- Top bar nền mờ -->
  <g transform="translate(50, 85)" filter="url(#uiShadow)">
    <rect width="70" height="70" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <rect x="24" y="22" width="8" height="26" rx="3" fill="#3D83AE"/>
    <rect x="38" y="22" width="8" height="26" rx="3" fill="#3D83AE"/>
  </g>
  <text x="540" y="115" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#D84444" letter-spacing="2">PLAY MODE • CHƯƠNG 1</text>
  <text x="540" y="152" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="900" fill="#224C6D">MÀN 04</text>

  <!-- LỚP PHỦ MỜ TỐI DIU NHẸ (BACKDROP OVERLAY) -->
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.55"/>

  <!-- ================= 2. POPUP HƯỚNG DẪN DẠNG SLIDE VỞ HỌC TRÒ ================= -->
  <!-- Kích thước: 920 x 1480 px tại x=80, y=200 -->
  <g transform="translate(80, 200)">

    <!-- TỜ GIẤY CHÍNH CÓ ĐỔ BÓNG NỔI -->
    <g filter="url(#paperSlipShadow)">
      <rect width="920" height="1480" rx="26" fill="#FFFDF9"/>

      <!-- Hàng lỗ bấm sổ còng bên lề trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="120" r="8"/><circle cx="28" cy="240" r="8"/><circle cx="28" cy="360" r="8"/>
        <circle cx="28" cy="480" r="8"/><circle cx="28" cy="600" r="8"/><circle cx="28" cy="720" r="8"/>
        <circle cx="28" cy="840" r="8"/><circle cx="28" cy="960" r="8"/><circle cx="28" cy="1080" r="8"/>
        <circle cx="28" cy="1200" r="8"/><circle cx="28" cy="1320" r="8"/><circle cx="28" cy="1440" r="8"/>
      </g>

      <!-- Các dòng kẻ ngang xanh nhạt của trang vở -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.35">
        <line x1="80" y1="210" x2="860" y2="210"/><line x1="80" y1="290" x2="860" y2="290"/>
        <line x1="80" y1="770" x2="860" y2="770"/><line x1="80" y1="850" x2="860" y2="850"/>
        <line x1="80" y1="930" x2="860" y2="930"/><line x1="80" y1="1010" x2="860" y2="1010"/>
        <line x1="80" y1="1090" x2="860" y2="1090"/><line x1="80" y1="1170" x2="860" y2="1170"/>
        <line x1="80" y1="1250" x2="860" y2="1250"/>
      </g>

      <!-- Đường lề đỏ vở -->
      <line x1="80" y1="0" x2="80" y2="1480" stroke="#D84444" stroke-width="3" opacity="0.85"/>
      <!-- Viền xanh mực sổ -->
      <rect width="920" height="1480" rx="26" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    </g>

    <!-- BĂNG DÍNH WASHI TAPE ĐÍNH TRÊN ĐỈNH GIỮA -->
    <g transform="translate(350, -22)">
      <rect width="220" height="46" rx="4" fill="#E8DFCA" fill-opacity="0.9" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48" stroke="#B5A98F" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- NÚT ĐÓNG NHANH "✕" Ở GÓC TRÊN PHẢI -->
    <g transform="translate(830, 24)" style="cursor: pointer;">
      <circle cx="28" cy="28" r="24" fill="#F4EFE6" stroke="#BACEDC" stroke-width="2"/>
      <path d="M 18 18 L 38 38 M 38 18 L 18 38" stroke="#224C6D" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- HEADER POPUP: TIÊU ĐỀ & CHẾ ĐỘ -->
    <g transform="translate(110, 48)">
      <rect width="180" height="30" rx="8" fill="#FEE2E2"/>
      <text x="90" y="21" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#B91C1C" letter-spacing="1">HƯỚNG DẪN CHƠI</text>
      <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="950" fill="#224C6D">Cách Vượt Mê Cung</text>
    </g>

    <!-- ================= 3. THANH TAB TIẾN TRÌNH SLIDE (PAGING CAROUSEL TABS) ================= -->
    <g transform="translate(105, 142)">
      <!-- Tab 1: ĐANG XEM (Active) -->
      <rect x="0" y="0" width="245" height="48" rx="14" fill="#3D83AE"/>
      <text x="122" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">① BẮT ĐẦU &amp; ĐÍCH</text>

      <!-- Tab 2: Con số manh mối -->
      <rect x="255" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="377" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#718B9E">② MANH MỐI SỐ</text>

      <!-- Tab 3: Công cụ hỗ trợ -->
      <rect x="510" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="632" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#718B9E">③ CÔNG CỤ</text>
    </g>

    <!-- ================= 4. KHUNG MINH HỌA TRỰC QUAN CẦU THANG S & F ================= -->
    <!-- Khung 755 x 520 px tại (105, 210) -->
    <g transform="translate(105, 210)" filter="url(#uiShadow)">
      <!-- Thẻ nền minh họa màu giấy sạch -->
      <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
      
      <!-- LƯỚI MINI DEMO 3x3 CELL (Mỗi cell 130x130 px, căn giữa khung) -->
      <g transform="translate(182, 45)">
        <!-- Nền các ô lưới -->
        <g fill="#F4F8FA" stroke="#BACEDC" stroke-width="2">
          <!-- Hàng 0 -->
          <rect x="0" y="0" width="130" height="130"/>
          <rect x="130" y="0" width="130" height="130"/>
          <!-- Hàng 0, Cột 2: CẦU THANG FINISH (ĐÍCH ĐẾN) -->
          <g transform="translate(260, 0)"><use href="#stair-finish"/></g>

          <!-- Hàng 1 -->
          <rect x="0" y="130" width="130" height="130"/>
          <rect x="130" y="130" width="130" height="130"/>
          <rect x="260" y="130" width="130" height="130"/>

          <!-- Hàng 2: Hàng 2, Cột 0: CẦU THANG START (XUẤT PHÁT) -->
          <g transform="translate(0, 260)"><use href="#stair-start"/></g>
          <rect x="130" y="260" width="130" height="130"/>
          <rect x="260" y="260" width="130" height="130"/>
        </g>

        <!-- Con số minh họa trên các ô trống -->
        <g font-family="'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="#2A4860" text-anchor="middle" dominant-baseline="central">
          <text x="65" y="65">1</text>
          <text x="195" y="65">2</text>
          <text x="65" y="195">2</text>
          <text x="195" y="195">1</text>
          <text x="325" y="195">3</text>
          <text x="195" y="325">0</text>
          <text x="325" y="325">2</text>
        </g>

        <!-- ĐƯỜNG VẼ NÉT MỰC TỪ CẦU THANG START TỚI Ô TRUNG TÂM -->
        <!-- Start: [2,0] (65, 325) -> [1,0] (65, 195) -> [1,1] (195, 195) -->
        <path d="M 65 325 L 65 195 L 195 195" 
              fill="none" stroke="#2575A7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#pathGlow)"/>
        <path d="M 65 325 L 65 195 L 195 195" 
              fill="none" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Đầu bút hiện tại tại (195, 195) -->
        <circle cx="195" cy="195" r="18" fill="#2575A7"/>
        <circle cx="195" cy="195" r="11" fill="#FFFFFF"/>
        <circle cx="195" cy="195" r="5.5" fill="#2575A7"/>

        <!-- MŨI TÊN DẪN ĐƯỜNG DỰ KIẾN TỚI HỐ ĐÍCH (NÉT ĐỨT) -->
        <path d="M 195 195 L 195 65 L 325 65" 
              fill="none" stroke="#D84444" stroke-width="5" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- CHÚ THÍCH CẦU THANG XUẤT PHÁT (START CALLOUT) -->
      <g transform="translate(16, 320)">
        <rect width="150" height="66" rx="12" fill="#E8F4EC" stroke="#2E7D32" stroke-width="2"/>
        <text x="75" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#2E7D32">XUẤT PHÁT</text>
        <text x="75" y="48" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="950" fill="#14532D">Cầu thang rọi sáng</text>
        <!-- Mũi tên chỉ vào ô Start -->
        <path d="M 152 33 L 175 33" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- CHÚ THÍCH HỐ THANG VỀ ĐÍCH (FINISH CALLOUT) -->
      <g transform="translate(585, 75)">
        <rect width="150" height="66" rx="12" fill="#FEF2F2" stroke="#D84444" stroke-width="2"/>
        <text x="75" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#D84444">HỐ ĐÍCH (F)</text>
        <text x="75" y="48" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="950" fill="#991B1B">Thang xuống sâu</text>
        <!-- Mũi tên chỉ vào ô Finish -->
        <path d="M 0 33 L -18 33" stroke="#D84444" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- BIỂU TƯỢNG BÀN TAY CHỈ DẪN VUỐT VẼ NÉT MỰC (DRAG GESTURE) -->
      <g transform="translate(377, 240)">
        <circle cx="25" cy="25" r="28" fill="#3D83AE" fill-opacity="0.2"/>
        <circle cx="25" cy="25" r="16" fill="#3D83AE" fill-opacity="0.35"/>
        <path d="M 12 18 L 30 18 L 38 28 L 32 36 L 20 36 Z" fill="#FEFDFA" stroke="#224C6D" stroke-width="2"/>
        <text x="42" y="55" font-family="sans-serif" font-size="13" font-weight="900" fill="#3D83AE">KÉO NỐI TÂM Ô</text>
      </g>

      <!-- DẢI GHI CHÚ CHÂN HÌNH MINH HỌA -->
      <rect x="20" y="450" width="715" height="42" rx="10" fill="#F4EFE6"/>
      <text x="377" y="476" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#224C6D">
        💡 Bắt đầu từ Cầu Thang Trên Lầu ➔ Đi theo đường an toàn ➔ Xuống Hố Thang Đích
      </text>
    </g>

    <!-- ================= 5. NỘI DUNG HƯỚNG DẪN (DẠNG THẺ GẠCH ĐẦU DÒNG DỄ ĐỌC) ================= -->
    <g transform="translate(105, 755)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="900" fill="#3D83AE" letter-spacing="1.5">QUY TẮC CẦN NHỚ</text>

      <!-- Ý 1: Bắt đầu và kết thúc -->
      <g transform="translate(0, 42)">
        <rect width="755" height="76" rx="14" fill="#F0F7FB" stroke="#D1E2ED" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#3D83AE"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">1</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#224C6D">
          Nối Cầu Thang Xuất Phát tới Hố Đích:
        </text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#5A7385">
          Đặt ngón tay vào tâm ô Cầu Thang S, kéo liên tục qua các ô để vẽ đường.
        </text>
      </g>

      <!-- Ý 2: Cảnh báo tường vô hình -->
      <g transform="translate(0, 130)">
        <rect width="755" height="76" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#D84444"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">2</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#B91C1C">
          Cảnh giác Tường Vô Hình:
        </text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#7F1D1D">
          Đâm phải tường ẩn giữa 2 ô sẽ bị Game Over ngay lập tức!
        </text>
      </g>

      <!-- Ý 3: Đọc con số -->
      <g transform="translate(0, 218)">
        <rect width="755" height="76" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#16A34A"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">3</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#14532D">
          Dựa vào manh mối các con số:
        </text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#166534">
          Con số trên ô cho biết số cạnh xung quanh có tường (xem tiếp ở Trang 2).
        </text>
      </g>
    </g>

    <!-- ================= 6. BỘ ĐIỀU KHIỂN PAGING SLIDE & NÚT TIẾP THEO ================= -->
    <g transform="translate(105, 1100)">
      
      <!-- HÀNG CHỈ BÁO PHÂN TRANG (DOTS + SỐ TRANG) -->
      <g transform="translate(0, 0)">
        <!-- Nút Lùi trang (Vô hiệu hóa ở Trang 1) -->
        <g opacity="0.35">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
          <path d="M 30 18 L 20 26 L 30 34" fill="none" stroke="#224C6D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Dải Chấm Trượt (Slide Indicator Dots) -->
        <g transform="translate(80, 16)">
          <!-- Dot 1: Active (Dạng thanh nhộng dài) -->
          <rect x="0" y="0" width="38" height="18" rx="9" fill="#3D83AE"/>
          <!-- Dot 2: Inactive -->
          <circle cx="58" cy="9" r="8" fill="#D1E2ED"/>
          <!-- Dot 3: Inactive -->
          <circle cx="86" cy="9" r="8" fill="#D1E2ED"/>
        </g>

        <!-- Nút Tiến trang kế tiếp -->
        <g transform="translate(200, 0)" style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#3D83AE" stroke-width="2.5"/>
          <path d="M 22 18 L 32 26 L 22 34" fill="none" stroke="#3D83AE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Nhãn chữ góc phải: "TRANG 1 / 3" -->
        <text x="755" y="34" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#3D83AE">
          TRANG 1 / 3
        </text>
      </g>

      <!-- NÚT HÀNH ĐỘNG CHÍNH TIẾP TỤC SLIDE -->
      <g transform="translate(0, 80)" style="cursor: pointer;" filter="url(#uiShadow)">
        <rect width="755" height="100" rx="22" fill="#3D83AE" stroke="#256286" stroke-width="3.5"/>
        <line x1="42" y1="0" x2="42" y2="100" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
        
