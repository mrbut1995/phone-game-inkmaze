<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="bgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.15"/>
    </pattern>

    <filter id="paperSlipShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A120B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1A120B" flood-opacity="0.15"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <filter id="lightHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.45"/>
    </filter>

    <filter id="clashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#DC2626" flood-opacity="0.6"/>
    </filter>

    <!-- Gradient hố sâu của Cầu Thang Đích Finish -->
    <linearGradient id="dungeonDeepVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C4B59" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#1B2834" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0A1118" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Gradient ánh sáng của Cầu Thang Xuất Phát Start -->
    <linearGradient id="dungeonUpperLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#3C4B59" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1B2834" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Cầu thang Start -->
    <g id="stair-start">
      <rect width="130" height="130" fill="#FAF5EB"/>
      <rect x="8" y="8" width="114" height="114" rx="8" fill="#EAE3D2" stroke="#1E283A" stroke-width="3"/>
      <rect x="12" y="12" width="106" height="106" fill="url(#dungeonUpperLight)"/>
      <g stroke="#1E283A" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="14" x2="122" y2="14" stroke-width="3"/>
        <polygon points="42,14 88,14 86,22 44,22" fill="#FFFBE8" stroke-width="1.8"/>
        <polygon points="44,22 86,22 90,36 40,36" fill="#D5C7B2" stroke-width="2.2"/>
        <rect x="40" y="36" width="50" height="10" fill="#9C8D78" stroke-width="2.2"/>
        <polygon points="40,46 90,46 96,62 34,62" fill="#E2D5C0" stroke-width="2.5"/>
        <rect x="34" y="62" width="62" height="12" fill="#BFAF9B" stroke-width="2.5"/>
        <polygon points="34,74 96,74 102,90 28,90" fill="#EDE4D4" stroke-width="2.5"/>
        <rect x="28" y="90" width="74" height="12" fill="#CBBFAA" stroke-width="2.5"/>
        <polygon points="28,102 102,102 108,116 22,116" fill="#F7F1E6" stroke-width="2.5"/>
        <rect x="22" y="116" width="86" height="6" fill="#DCD1BF" stroke-width="2.5"/>
      </g>
      <rect x="1" y="1" width="128" height="128" rx="8" fill="none" stroke="#2575A7" stroke-width="2.5"/>
    </g>

    <!-- Cầu thang Finish -->
    <g id="stair-finish">
      <rect width="130" height="130" fill="#FAF5EB"/>
      <rect x="8" y="8" width="114" height="114" rx="8" fill="#EAE3D2" stroke="#1E283A" stroke-width="3"/>
      <rect x="12" y="12" width="106" height="106" fill="url(#dungeonDeepVoid)"/>
      <g stroke="#1E283A" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="14" x2="122" y2="14" stroke-width="3"/>
        <polygon points="16,14 114,14 106,32 24,32" fill="#F7F1E6" stroke-width="2.5"/>
        <rect x="24" y="32" width="82" height="12" fill="#CBBFAA" stroke-width="2.5"/>
        <polygon points="24,44 106,44 98,60 32,60" fill="#E2D5C0" stroke-width="2.5"/>
        <rect x="32" y="60" width="66" height="12" fill="#A49580" stroke-width="2.5"/>
        <polygon points="32,72 98,72 90,86 40,86" fill="#BFAF9B" stroke-width="2.5"/>
        <rect x="40" y="86" width="50" height="12" fill="#756755" stroke-width="2.5"/>
        <polygon points="40,98 90,98 84,108 46,108" fill="#807260" stroke-width="2.2"/>
        <rect x="46" y="108" width="38" height="8" fill="#42382C" stroke-width="2.2"/>
        <polygon points="46,116 84,116 80,120 50,120" fill="#0A1118" stroke-width="1.5"/>
      </g>
      <rect x="1" y="1" width="128" height="128" rx="8" fill="none" stroke="#D84444" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- NỀN MỜ PHÍA SAU -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#bgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>
  <rect width="1080" height="1920" fill="#1C2D3A" fill-opacity="0.55"/>

  <!-- TỜ GIẤY HƯỚNG DẪN (920 x 1480 px tại x=80, y=200) -->
  <g transform="translate(80, 200)">
    <!-- THÂN GIẤY CHÍNH -->
    <g filter="url(#paperSlipShadow)">
      <rect width="920" height="1480" rx="26" fill="#FFFDF9"/>
      <!-- Lỗ bấm sổ còng bên lề trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="28" cy="120" r="8"/><circle cx="28" cy="240" r="8"/><circle cx="28" cy="360" r="8"/>
        <circle cx="28" cy="480" r="8"/><circle cx="28" cy="600" r="8"/><circle cx="28" cy="720" r="8"/>
        <circle cx="28" cy="840" r="8"/><circle cx="28" cy="960" r="8"/><circle cx="28" cy="1080" r="8"/>
        <circle cx="28" cy="1200" r="8"/><circle cx="28" cy="1320" r="8"/><circle cx="28" cy="1440" r="8"/>
      </g>
      <!-- Dòng kẻ ngang mờ -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.35">
        <line x1="80" y1="210" x2="860" y2="210"/><line x1="80" y1="770" x2="860" y2="770"/>
        <line x1="80" y1="850" x2="860" y2="850"/><line x1="80" y1="930" x2="860" y2="930"/>
        <line x1="80" y1="1010" x2="860" y2="1010"/><line x1="80" y1="1090" x2="860" y2="1090"/>
        <line x1="80" y1="1170" x2="860" y2="1170"/><line x1="80" y1="1250" x2="860" y2="1250"/>
      </g>
      <line x1="80" y1="0" x2="80" y2="1480" stroke="#D84444" stroke-width="3" opacity="0.85"/>
      <rect width="920" height="1480" rx="26" fill="none" stroke="#334155" stroke-width="3.5"/>
    </g>

    <!-- WASHI TAPE -->
    <g transform="translate(350, -22)">
      <rect width="220" height="46" rx="4" fill="#E8DFCA" fill-opacity="0.9" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" stroke="#B5A98F" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- NÚT ĐÓNG NHANH "✕" -->
    <g transform="translate(830, 24)" style="cursor: pointer;">
      <circle cx="28" cy="28" r="24" fill="#F4EFE6" stroke="#BACEDC" stroke-width="2"/>
      <path d="M 18 18 L 38 38 M 38 18 L 18 38" stroke="#224C6D" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- HEADER POPUP -->
    <g transform="translate(110, 48)">
      <rect width="220" height="30" rx="8" fill="#F1F5F9"/>
      <text x="110" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#334155" letter-spacing="1">FOG OF WAR • SƯƠNG MÙ 🌫️</text>
      <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="950" fill="#1E293B">Dò Đường Theo Bước Chân</text>
    </g>

    <!-- ================= THANH TAB: TAB 2 ĐANG ACTIVE ================= -->
    <g transform="translate(105, 142)">
      <rect x="0" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="122" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">① TẦM NHÌN BÁN KÍNH 1</text>

      <rect x="255" y="0" width="245" height="48" rx="14" fill="#334155"/>
      <text x="377" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">② DÒ ĐƯỜNG TỪNG BƯỚC</text>

      <rect x="510" y="0" width="245" height="48" rx="14" fill="#F0F7FB" stroke="#BACEDC" stroke-width="1.5"/>
      <text x="632" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#718B9E">③ GHI NHỚ &amp; BÍ QUYẾT</text>
    </g>

    <!-- ================= KHUNG HÌNH MINH HỌA QUẦNG SÁNG DI CHUYỂN ================= -->
    <g transform="translate(105, 210)" filter="url(#uiShadow)">
      <rect width="755" height="510" rx="22" fill="#FEFDFA" stroke="#334155" stroke-width="3"/>

      <!-- LƯỚI MINI 3x3 CELL (MÔ PHỎNG BƯỚC ĐI TỚI ĐÂU SÁNG TỚI ĐÓ) -->
      <g transform="translate(182, 35)">
        <g stroke="#BACEDC" stroke-width="2">
          <!-- HÀNG 0 -->
          <!-- Ô [0,0]: Sương mù xa -->
          <rect x="0" y="0" width="130" height="130" fill="#CBD5E1" fill-opacity="0.45"/>

          <!-- Ô [0,1]: Vừa lọt vào quầng sáng mới! (Lộ ra số 3) -->
          <rect x="130" y="0" width="130" height="130" fill="#FFFFFF"/>
          <text x="195" y="65" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="950" fill="#0C4A6E">3</text>

          <!-- Ô [0,2]: Hố thang Finish (đã sáng rõ vì ở gần) -->
          <g transform="translate(260, 0)"><use href="#stair-finish"/></g>

          <!-- HÀNG 1 -->
          <!-- Ô [1,0]: Bắt đầu mờ dần vì nhân vật đi xa -->
          <rect x="0" y="130" width="130" height="130" fill="#E2E8F0" fill-opacity="0.6"/>
          <text x="65" y="195" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#94A3B8" opacity="0.4">1</text>

          <!-- Ô [1,1]: Ô đã đi qua -->
          <rect x="130" y="130" width="130" height="130" fill="#F0F9FF"/>
          <text x="195" y="195" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="40" font-weight="900" fill="#0284C7" opacity="0.5">0</text>

          <!-- Ô [1,2]: VỊ TRÍ MỚI CỦA NHÂN VẬT (TÂM QUẦNG SÁNG MỚI) -->
          <rect x="260" y="130" width="130" height="130" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2.5"/>
          <text x="325" y="195" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="950" fill="#0369A1">2</text>

          <!-- HÀNG 2 -->
          <!-- Ô [2,0]: Cầu thang Start (đã chìm vào sương mù phía sau) -->
          <g transform="translate(0, 260)" opacity="0.35"><use href="#stair-start"/></g>

          <!-- Ô [2,1]: Ô đã đi qua -->
          <rect x="130" y="260" width="130" height="130" fill="#E2E8F0" fill-opacity="0.6"/>

          <!-- Ô [2,2]: TRONG TẦM NHÌN MỚI (LỘ RA SỐ 1) -->
          <rect x="260" y="260" width="130" height="130" fill="#FFFFFF"/>
          <text x="325" y="325" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="950" fill="#0C4A6E">1</text>
        </g>

        <!-- QUẦNG SÁNG MỚI TẬP TRUNG TẠI [1,2] -->
        <circle cx="325" cy="195" r="145" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 6" filter="url(#lightHalo)"/>

        <!-- ĐƯỜNG VẼ TỪ START TIẾN VÀO VỊ TRÍ MỚI -->
        <path d="M 65 325 L 65 195 L 195 195 L 325 195" 
              fill="none" stroke="#0284C7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Đầu bút tại ô [1,2] -->
        <circle cx="325" cy="195" r="16" fill="#0284C7"/>
        <circle cx="325" cy="195" r="7" fill="#FFFFFF"/>

        <!-- BỨC TƯỜNG VÔ HÌNH CHẶN LỐI LÊN HỐ THANG [0,2] -->
        <line x1="260" y1="130" x2="390" y2="130" stroke="#1E283A" stroke-width="12" stroke-linecap="round"/>

        <!-- HIỆU ỨNG TIA LỬA NẾU BƯỚC THẲNG VÀO TƯỜNG -->
        <g transform="translate(325, 130)" filter="url(#clashGlow)">
          <circle cx="0" cy="0" r="10" fill="#EF4444"/>
          <circle cx="0" cy="0" r="5" fill="#FDE047"/>
        </g>
      </g>

      <!-- CALLOUT BÊN TRÁI: Ô PHÍA SAU MỜ LẠI -->
      <g transform="translate(16, 175)">
        <rect width="155" height="110" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
        <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="900" fill="#475569">Ô ĐÃ BƯỚC QUA</text>
        <text x="14" y="54" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="950" fill="#1E293B">MỜ DẦN ĐI</text>
        <text x="14" y="76" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="950" fill="#64748B">ẨN LẠI SỐ</text>
        <text x="14" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748B">Sương mù phủ lại!</text>
      </g>

      <!-- CALLOUT BÊN PHẢI: CẢNH BÁO TƯỜNG ẨN TRONG SƯƠNG -->
      <g transform="translate(585, 175)">
        <rect width="155" height="110" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
        <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="900" fill="#B91C1C">BẪY TƯỜNG ẨN</text>
        <text x="14" y="54" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="950" fill="#7F1D1D">ĐÂM VÀO TƯỜNG</text>
        <text x="14" y="76" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="950" fill="#DC2626">BỊ PHẠT VỀ S</text>
        <text x="14" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#B91C1C">(Hardcore: Thua ngay)</text>
      </g>

      <!-- DẢI GHI CHÚ CHÂN HÌNH -->
      <rect x="20" y="448" width="715" height="44" rx="10" fill="#F4EFE6"/>
      <text x="377" y="475" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#224C6D">
        💡 Bước tới đâu sương mù mở tới đó — nhưng tuyệt đối không bước bừa vào ô chưa rõ số!
      </text>
    </g>

    <!-- NỘI DUNG CHI TIẾT DẠNG THẺ -->
    <g transform="translate(105, 755)">
      <text x="0" y="24" font-family="sans-serif" font-size="16" font-weight="900" fill="#334155" letter-spacing="1.5">QUY TẮC DI CHUYỂN TRONG SƯƠNG</text>

      <!-- Ý 1 -->
      <g transform="translate(0, 42)">
        <rect width="755" height="76" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#0284C7"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">1</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#0C4A6E">Tầm Nhìn Di Chuyển Theo Từng Bước:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#0369A1">Đặt chân tới ô mới sẽ lập tức hé lộ con số của những ô tiếp giáp phía trước mặt bạn.</text>
      </g>

      <!-- Ý 2 -->
      <g transform="translate(0, 130)">
        <rect width="755" height="76" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#64748B"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">2</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#1E293B">Ô Cũ Phía Sau Sẽ Bị Che Lại:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#475569">Các ô ở xa tầm nhìn sẽ bị sương mù bao phủ trở lại, khiến bạn khó nhìn lại số cũ.</text>
      </g>

      <!-- Ý 3 -->
      <g transform="translate(0, 218)">
        <rect width="755" height="76" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
        <circle cx="36" cy="38" r="16" fill="#DC2626"/>
        <text x="36" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">3</text>
        <text x="68" y="32" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#B91C1C">Nguy Cơ Va Phải Tường Vô Hình:</text>
        <text x="68" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#7F1D1D">Nếu bước liều sang ô chưa sáng, bạn có thể đâm trúng tường ẩn và bị phạt văng về điểm S!</text>
      </g>
    </g>

    <!-- ĐIỀU KHIỂN PAGING SLIDE -->
    <g transform="translate(105, 1100)">
      <g transform="translate(0, 0)">
        <!-- Nút lùi: BẬT (về Trang 1) -->
        <g style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#334155" stroke-width="2.5"/>
          <path d="M 30 18 L 20 26 L 30 34" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Dots: Dot 2 active -->
        <g transform="translate(80, 16)">
          <circle cx="9" cy="9" r="8" fill="#D1E2ED"/>
          <rect x="27" y="0" width="38" height="18" rx="9" fill="#334155"/>
          <circle cx="86" cy="9" r="8" fill="#D1E2ED"/>
        </g>

        <!-- Nút tiến: BẬT (sang Trang 3) -->
        <g transform="translate(200, 0)" style="cursor: pointer;">
          <rect width="52" height="52" rx="14" fill="#FEFDFA" stroke="#334155" stroke-width="2.5"/>
          <path d="M 22 18 L 32 26 L 22 34" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <text x="755" y="34" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#334155">TRANG 2 / 3</text>
      </g>

      <!-- Nút hành động chính: TIẾP THEO SANG TRANG 3 -->
      <g transform="translate(0, 80)" style="cursor: pointer;" filter="url(#uiShadow)">
        <rect width="755" height="100" rx="22" fill="#334155" stroke="#0F172A" stroke-width="3.5"/>
        <line x1="42" y1="0" x2="42" y2="100" stroke="#FAF5EB" stroke-width="3" opacity="0.6"/>
        <text x="397" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="25" font-weight="950" fill="#FFFFFF" letter-spacing="1">
          TIẾP THEO: GHI NHỚ ANCHOR &amp; BÍ QUYẾT (3/3) ›
        </text>
      </g>

      <text x="377" y="222" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#718B9E" style="cursor: pointer;">
        Bỏ qua hướng dẫn &amp; Vào dò đường ngay
      </text>
    </g>
  </g>

  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>