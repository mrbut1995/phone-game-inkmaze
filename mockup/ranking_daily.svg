        <text x="135" y="52" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#224C6D">Hana_Sakura</text>
        <text x="600" y="42" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#D84444">🔥 16 NGÀY</text>
        <text x="600" y="68" text-anchor="end" font-family="sans-serif" font-size="15" font-weight="800" fill="#D97706">⭐ 48 SAO</text>
