<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <pattern id="rankDailyBgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.55"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.18"/>
    </pattern>

    <filter id="rankDailyShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2D2115" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2D2115" flood-opacity="0.10"/>
    </filter>

    <filter id="clipShadowDaily" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.25"/>
    </filter>

    <filter id="dailyRowShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.10"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <!-- Huy chương Vàng Daily -->
    <g id="medal-daily-gold">
      <circle cx="35" cy="35" r="32" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
      <circle cx="35" cy="35" r="25" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="35" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="950" fill="#92400E">1</text>
    </g>
    <!-- Huy chương Bạc Daily -->
    <g id="medal-daily-silver">
      <circle cx="30" cy="30" r="27" fill="#E2E8F0" stroke="#64748B" stroke-width="2.5"/>
      <circle cx="30" cy="30" r="21" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="30" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#334155">2</text>
    </g>
    <!-- Huy chương Đồng Daily -->
    <g id="medal-daily-bronze">
      <circle cx="30" cy="30" r="27" fill="#FBD5A5" stroke="#B45309" stroke-width="2.5"/>
      <circle cx="30" cy="30" r="21" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="30" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#78350F">3</text>
    </g>
  </defs>

  <!-- ================= 1. NỀN VỞ Ô LY ================= -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#rankDailyBgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>

  <!-- ================= 2. STATUS BAR ANDROID ================= -->
  <g fill="#3D5A73" font-family="-apple-system, sans-serif" font-size="28" font-weight="600">
    <text x="60" y="55">09:41</text>
    <g transform="translate(940, 34)" stroke="#3D5A73" stroke-width="3" fill="none">
      <path d="M0 16 A 16 16 0 0 1 24 16" stroke-linecap="round"/>
      <circle cx="12" cy="24" r="2" fill="#3D5A73"/>
    </g>
    <rect x="980" y="36" width="44" height="22" rx="5" fill="none" stroke="#3D5A73" stroke-width="3"/>
    <rect x="984" y="40" width="28" height="14" rx="2" fill="#3D5A73"/>
  </g>

  <!-- ================= 3. TOP HEADER ================= -->
  <g transform="translate(50, 85)" filter="url(#uiShadow)" style="cursor: pointer;">
    <rect width="70" height="70" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <path d="M42 23 L26 35 L42 47" fill="none" stroke="#3D83AE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="500" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="950" fill="#224C6D" letter-spacing="1.5">BẢNG XẾP HẠNG</text>

  <!-- Huy hiệu Lửa Streak góc phải -->
  <g transform="translate(830, 85)" filter="url(#uiShadow)">
