      <rect width="940" height="1570" rx="24" fill="#FFFDF8"/>

      <!-- Hàng lỗ bấm ghim -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="26" cy="100" r="8"/><circle cx="26" cy="220" r="8"/><circle cx="26" cy="340" r="8"/>
        <circle cx="26" cy="460" r="8"/><circle cx="26" cy="580" r="8"/><circle cx="26" cy="700" r="8"/>
        <circle cx="26" cy="820" r="8"/><circle cx="26" cy="940" r="8"/><circle cx="26" cy="1060" r="8"/>
        <circle cx="26" cy="1180" r="8"/><circle cx="26" cy="1300" r="8"/><circle cx="26" cy="1420" r="8"/>
      </g>

      <!-- Dòng kẻ ngang -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.32">
        <line x1="65" y1="230" x2="875" y2="230"/><line x1="65" y1="310" x2="875" y2="310"/>
        <line x1="65" y1="390" x2="875" y2="390"/><line x1="65" y1="470" x2="875" y2="470"/>
        <line x1="65" y1="550" x2="875" y2="550"/><line x1="65" y1="630" x2="875" y2="630"/>
        <line x1="65" y1="710" x2="875" y2="710"/><line x1="65" y1="790" x2="875" y2="790"/>
        <line x1="65" y1="870" x2="875" y2="870"/><line x1="65" y1="950" x2="875" y2="950"/>
        <line x1="65" y1="1030" x2="875" y2="1030"/><line x1="65" y1="1110" x2="875" y2="1110"/>
        <line x1="65" y1="1190" x2="875" y2="1190"/><line x1="65" y1="1270" x2="875" y2="1270"/>
        <line x1="65" y1="1350" x2="875" y2="1350"/><line x1="65" y1="1430" x2="875" y2="1430"/>
