        <text x="105" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#D84444">🔥 21 NGÀY</text>
        <rect x="5" y="125" width="200" height="125" rx="14" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
