<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- 1. Lưới vở học sinh nền 40px -->
    <pattern id="notebookGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.2"/>
    </pattern>

    <!-- 2. Họa tiết giấy nháp mini -->
    <pattern id="doodleGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="20" y2="20" stroke="#8FB9D2" stroke-width="0.8" opacity="0.3"/>
    </pattern>

    <!-- 3. Đổ bóng thẻ sản phẩm & bàn nháp -->
    <filter id="cardShadow" x="-10%" y="-15%" width="125%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E1610" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E1610" flood-opacity="0.08"/>
    </filter>

    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>

    <filter id="previewGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.45"/>
    </filter>

    <!-- Đổ bóng kẹp ghim giấy -->
    <filter id="clipShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.22"/>
    </filter>

    <!-- Icon Đồng Xu Mực 🪙 tái sử dụng -->
    <g id="coin-icon">
      <circle cx="16" cy="16" r="15" fill="#FBBF24" stroke="#D97706" stroke-width="2.5"/>
      <circle cx="16" cy="16" r="11" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="16" y="21" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="950" fill="#78350F">C</text>
    </g>
  </defs>

  <!-- ================= 1. NỀN GIẤY VỞ & LỀ ĐỎ ================= -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#notebookGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>

  <!-- ================= 2. ANDROID STATUS BAR ================= -->
  <g fill="#3D5A73" font-family="-apple-system, sans-serif" font-size="28" font-weight="600">
    <text x="60" y="55">09:41</text>
    <g transform="translate(940, 34)" stroke="#3D5A73" stroke-width="3" fill="none">
      <path d="M0 16 A 16 16 0 0 1 24 16" stroke-linecap="round"/>
      <circle cx="12" cy="24" r="2" fill="#3D5A73"/>
    </g>
    <rect x="980" y="36" width="44" height="22" rx="5" fill="none" stroke="#3D5A73" stroke-width="3"/>
    <rect x="984" y="40" width="28" height="14" rx="2" fill="#3D5A73"/>
  </g>

  <!-- ================= 3. TOP BAR: BACK · TIÊU ĐỀ · VÍ XU ================= -->
  <!-- Nút Quay lại Menu chính -->
  <g transform="translate(50, 85)" filter="url(#uiShadow)" style="cursor: pointer;">
    <rect width="70" height="70" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <path d="M42 23 L26 35 L42 47" fill="none" stroke="#3D83AE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tiêu đề Cửa Hàng -->
  <g transform="translate(480, 105)" text-anchor="middle">
    <text y="0" font-family="sans-serif" font-size="16" font-weight="800" fill="#D84444" letter-spacing="2">TIỆM VĂN PHÒNG PHẨM</text>
    <text y="40" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="950" fill="#163A58" letter-spacing="1">CỬA HÀNG</text>
  </g>

  <!-- Ví Tiền Xu Mực của Người Chơi -->
  <g transform="translate(775, 85)" filter="url(#uiShadow)">
    <rect width="255" height="70" rx="18" fill="#FEFDFA" stroke="#F59E0B" stroke-width="3"/>
    <line x1="16" y1="0" x2="16" y2="70" stroke="#F59E0B" stroke-width="2.5"/>
    <g transform="translate(24, 19)"><use href="#coin-icon"/></g>
    <text x="145" y="46" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="32" font-weight="950" fill="#B45309">1,250</text>
    <!-- Nút cộng thêm xu nhanh -->
    <circle cx="225" cy="35" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="225" y="41" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#B45309">+</text>
  </g>

  <!-- ================= 4. HÀNG 4 TAB NHÃN VỞ (BOOKMARK TABS) ================= -->
  <!-- Tab 1: BÚT & MỰC (Đang chọn - Nổi lên) -->
  <g transform="translate(50, 185)" style="cursor: pointer;">
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 224 0 A 16 16 0 0 1 240 16 L 240 65 L 0 65 Z" fill="#3D83AE" stroke="#235A7D" stroke-width="3"/>
    <line x1="16" y1="0" x2="16" y2="65" stroke="#FAF5EB" stroke-width="2" opacity="0.6"/>
    <text x="120" y="42" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF">✒️ BÚT &amp; MỰC</text>
  </g>

  <!-- Tab 2: GIẤY VỞ -->
  <g transform="translate(298, 195)" style="cursor: pointer;">
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 224 0 A 16 16 0 0 1 240 16 L 240 55 L 0 55 Z" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <text x="120" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#224C6D">📜 GIẤY VỞ</text>
  </g>

  <!-- Tab 3: DỤNG CỤ -->
  <g transform="translate(546, 195)" style="cursor: pointer;">
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 224 0 A 16 16 0 0 1 240 16 L 240 55 L 0 55 Z" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
    <text x="120" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#224C6D">🎒 DỤNG CỤ</text>
  </g>

  <!-- Tab 4: NẠP XU -->
  <g transform="translate(794, 195)" style="cursor: pointer;">
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 220 0 A 16 16 0 0 1 236 16 L 236 55 L 0 55 Z" fill="#FEFDFA" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="118" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#B45309">🪙 NẠP XU</text>
  </g>

  <!-- Vạch đáy nối liền hệ thống tab -->
  <line x1="50" y1="250" x2="1030" y2="250" stroke="#3D83AE" stroke-width="3.5"/>
<g id="page-tools" transform="translate(50, 270)">
  <!-- MỤC 1: GÔM TẨY 4B (GÓI UNDO HOÀN TÁC) -->
  <g transform="translate(0, 0)" filter="url(#cardShadow)">
    <rect width="980" height="180" rx="24" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <line x1="30" y1="0" x2="30" y2="180" stroke="#3D83AE" stroke-width="3"/>
    <g transform="translate(60, 35)">
      <rect width="110" height="110" rx="18" fill="#F0F7FB" stroke="#B8D7EA" stroke-width="2"/>
      <text x="55" y="72" text-anchor="middle" font-size="50">🧼</text>
    </g>
    <text x="200" y="65" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#163A58">Gói Gôm Tẩy 4B (x10 Lượt Undo)</text>
    <text x="200" y="100" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Hoàn tác bước đi sai lầm mà không bị tính lỗi hay trừ cước phí</text>
    <text x="200" y="132" font-family="sans-serif" font-size="15" font-weight="800" fill="#256286">Hiện có trong túi: 05 cái</text>
    <g transform="translate(740, 55)" style="cursor: pointer;">
      <rect width="200" height="70" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
      <text x="100" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#92400E">150 XU</text>
    </g>
  </g>

  <!-- MỤC 2: KÍNH LÚP SOI ĐƯỜNG (GÓI HINT GỢI Ý) -->
  <g transform="translate(0, 210)" filter="url(#cardShadow)">
    <rect width="980" height="180" rx="24" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <line x1="30" y1="0" x2="30" y2="180" stroke="#F59E0B" stroke-width="3"/>
    <g transform="translate(60, 35)">
      <rect width="110" height="110" rx="18" fill="#FEFCE8" stroke="#FEF08A" stroke-width="2"/>
      <text x="55" y="72" text-anchor="middle" font-size="50">🔍</text>
    </g>
    <text x="200" y="65" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="950" fill="#163A58">Kính Lúp Soi Lối (x5 Lượt Gợi Ý)</text>
    <text x="200" y="100" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Vạch trần 1 đoạn đường an toàn tránh đâm vào tường vô hình</text>
    <text x="200" y="132" font-family="sans-serif" font-size="15" font-weight="800" fill="#D97706">Hiện có trong túi: 02 cái</text>
    <g transform="translate(740, 55)" style="cursor: pointer;">
      <rect width="200" height="70" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
      <text x="100" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="950" fill="#92400E">200 XU</text>
    </g>
  </g>
</g>
  <!-- ================= 7. BANNER QUẢNG CÁO TIẾP SỨC / NHẬN XU ================= -->
  <!-- Kích thước 980 x 110 px tại (50, 1540) -->
  <g transform="translate(50, 1545)" filter="url(#uiShadow)" style="cursor: pointer;">
    <rect width="980" height="115" rx="24" fill="#FEFDFA" stroke="#D84444" stroke-width="3"/>
    <line x1="36" y1="0" x2="36" y2="115" stroke="#D84444" stroke-width="3"/>
    
    <!-- Icon quà tặng -->
    <g transform="translate(65, 30)">
      <rect width="55" height="55" rx="14" fill="#FEE2E2" stroke="#D84444" stroke-width="2"/>
      <text x="27" y="38" text-anchor="middle" font-size="30">🎁</text>
    </g>

    <text x="145" y="48" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="950" fill="#163A58">GÓC TIẾP SỨC HỌC TẬP • NHẬN XU MIỄN PHÍ</text>
    <text x="145" y="82" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Xem bài giảng ngắn mỗi ngày để nhận ngay 50 Xu Mực</text>

    <!-- Nút Nhận ngay -->
    <g transform="translate(770, 26)">
      <rect width="180" height="62" rx="16" fill="#D84444" stroke="#991B1B" stroke-width="2.5"/>
      <text x="90" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">+50 XU ▶</text>
    </g>
  </g>

  <!-- DÒNG ĐỀ TỰA CHÂN TRANG -->
  <text x="540" y="1710" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" font-weight="600" fill="#718B9E">
    ~ Bút sắc vẽ đường • Vở sạch luyện trí ~
  </text>

  <!-- ================= 8. ANDROID HOME GESTURE BAR ================= -->
  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>