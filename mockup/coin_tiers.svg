<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300">
  <defs>
    <!-- Đổ bóng mặt đất mềm mại -->
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2D2115" flood-opacity="0.18"/>
    </filter>

    <!-- Hào quang phát sáng lấp lánh cho cấp cao -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>

    <!-- 1. COMPONENT ĐỒNG XU ISOMETRIC TÁI SỬ DỤNG -->
    <g id="iso-coin">
      <!-- Cạnh đáy xu (Độ dày 3D) -->
      <path d="M -26 0 A 26 14 0 0 0 26 0 L 26 8 A 26 14 0 0 1 -26 8 Z" fill="#D97706" stroke="#78350F" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Mặt trên xu -->
      <ellipse cx="0" cy="0" rx="26" ry="14" fill="#FBBF24" stroke="#78350F" stroke-width="2.5"/>
      <!-- Vòng ren trong -->
      <ellipse cx="0" cy="0" rx="20" ry="10.5" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4 2.5"/>
      <!-- Tâm ngôi sao mini -->
      <polygon points="0,-5 1.5,-1.5 5,-1.5 2.2,0.8 3.2,4.5 0,2.2 -3.2,4.5 -2.2,0.8 -5,-1.5 -1.5,-1.5" fill="#B45309"/>
      <!-- Vệt sáng phản chiếu -->
      <path d="M -16 -4 A 18 9 0 0 1 4 -8" fill="none" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Ngôi sao lấp lánh 4 cánh -->
    <g id="glint">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#FFFBE8" stroke="#F59E0B" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- Nền giấy kem nhạt để dễ quan sát -->
  <rect width="920" height="300" rx="24" fill="#FAF5EB" stroke="#8FB9D2" stroke-width="2"/>

  <!-- ========================================================= -->
  <!-- TIER 1: ĐỒNG XU ĐƠN (1 COIN)                               -->
  <!-- ========================================================= -->
  <g id="tier-1-coin" transform="translate(30, 20)">
    <!-- Khung thẻ bao -->
    <rect width="160" height="260" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.2" filter="url(#coinShadow)"/>
    <text x="80" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#718B9E">CẤP 1</text>
    <text x="80" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#224C6D">XU ĐƠN</text>

    <!-- Hình vẽ icon -->
    <g transform="translate(80, 130)">
      <!-- Bóng sàn -->
      <ellipse cx="0" cy="42" rx="34" ry="10" fill="#2D2115" opacity="0.12"/>
      
      <!-- Đồng xu đứng nghiêng lớn -->
      <g transform="scale(1.45)">
        <use href="#iso-coin" y="24"/>
      </g>
      <!-- Ánh lấp lánh -->
      <use href="#glint" x="28" y="-12" transform="scale(0.9)"/>
    </g>

    <rect x="25" y="210" width="110" height="32" rx="8" fill="#F0F7FB"/>
    <text x="80" y="231" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#256286">500 XU</text>
  </g>

  <!-- ========================================================= -->
  <!-- TIER 2: CỌC XU NHỎ (3 COINS STACK)                         -->
  <!-- ========================================================= -->
  <g id="tier-2-stack" transform="translate(205, 20)">
    <rect width="160" height="260" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.2" filter="url(#coinShadow)"/>
    <text x="80" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#718B9E">CẤP 2</text>
    <text x="80" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#224C6D">CỌC XU</text>

    <g transform="translate(80, 120)">
      <ellipse cx="0" cy="46" rx="38" ry="11" fill="#2D2115" opacity="0.15"/>
      <g transform="scale(1.25)">
        <!-- Xu 1 (Dưới cùng) -->
        <use href="#iso-coin" y="26"/>
        <!-- Xu 2 (Giữa) -->
        <use href="#iso-coin" y="14"/>
        <!-- Xu 3 (Trên cùng) -->
        <use href="#iso-coin" y="2"/>
      </g>
      <!-- Tia sáng nhỏ -->
      <use href="#glint" x="32" y="-18" transform="scale(1)"/>
    </g>

    <rect x="25" y="210" width="110" height="32" rx="8" fill="#FEF3C7"/>
    <text x="80" y="231" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#92400E">2,000 XU</text>
  </g>

  <!-- ========================================================= -->
  <!-- TIER 3: ĐỐNG XU NHIỀU CỌC (PILE OF COINS)                  -->
  <!-- ========================================================= -->
  <g id="tier-3-pile" transform="translate(380, 20)">
    <rect width="160" height="260" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.2" filter="url(#coinShadow)"/>
    <text x="80" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#718B9E">CẤP 3</text>
    <text x="80" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#224C6D">ĐỐNG XU</text>

    <g transform="translate(80, 125)">
      <!-- Bóng tổng thể -->
      <ellipse cx="0" cy="44" rx="52" ry="14" fill="#2D2115" opacity="0.18"/>

      <!-- Cọc bên trái (4 xu cao hơn) -->
      <g transform="translate(-18, 0) scale(1.08)">
        <use href="#iso-coin" y="28"/>
        <use href="#iso-coin" y="17"/>
        <use href="#iso-coin" y="6"/>
        <use href="#iso-coin" y="-5"/>
      </g>

      <!-- Cọc bên phải (3 xu thấp hơn) -->
      <g transform="translate(20, 10) scale(1.05)">
        <use href="#iso-coin" y="22"/>
        <use href="#iso-coin" y="11"/>
        <use href="#iso-coin" y="0"/>
      </g>

      <!-- 1 đồng xu rơi nằm nghiêng phía trước -->
      <g transform="translate(0, 36) rotate(-18) scale(1.1)">
        <use href="#iso-coin"/>
      </g>

      <!-- Ánh sao -->
      <use href="#glint" x="-26" y="-22" transform="scale(1.1)"/>
      <use href="#glint" x="34" y="-5" transform="scale(0.8)"/>
    </g>

    <rect x="25" y="210" width="110" height="32" rx="8" fill="#FEF3C7"/>
    <text x="80" y="231" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#92400E">3,500 XU</text>
  </g>

  <!-- ========================================================= -->
  <!-- TIER 4: TÚI TIỀN DÂY RÚT (COIN POUCH / SACK)               -->
  <!-- ========================================================= -->
  <g id="tier-4-pouch" transform="translate(555, 20)">
    <rect width="160" height="260" rx="18" fill="#FEFDFA" stroke="#F59E0B" stroke-width="2.5" filter="url(#coinShadow)"/>
    <text x="80" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#D97706">CẤP 4</text>
    <text x="80" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#B45309">TÚI TIỀN</text>

    <g transform="translate(80, 128)">
      <!-- Bóng túi -->
      <ellipse cx="0" cy="46" rx="46" ry="14" fill="#2D2115" opacity="0.2"/>

      <!-- Xu tràn ở miệng túi phía sau nhú ra -->
      <g transform="translate(0, -18) scale(0.75)">
        <use href="#iso-coin" x="-12" y="0"/>
        <use href="#iso-coin" x="12" y="-4"/>
        <use href="#iso-coin" x="0" y="-8"/>
      </g>

      <!-- THÂN TÚI VẢI DA DÂY RÚT -->
      <!-- Phần bèo nhún miệng túi -->
      <path d="M -24 -24 C -28 -34 -14 -38 -8 -26 C -2 -38 12 -36 12 -26 C 18 -36 28 -32 24 -22 Z" 
            fill="#D97706" stroke="#78350F" stroke-width="2.5" stroke-linejoin="round"/>
      
      <!-- Bụng túi phồng to căng tròn -->
      <path d="M -18 -18 C -44 -10 -46 36 -28 44 C -12 50 12 50 28 44 C 46 36 44 -10 18 -18 Z" 
            fill="#F59E0B" stroke="#78350F" stroke-width="3" stroke-linejoin="round"/>

      <!-- Dây buộc thắt nút màu đỏ nổi bật -->
      <path d="M -20 -18 Q 0 -14 20 -18" fill="none" stroke="#D84444" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Nút thắt nơ & hạt cườm thả -->
      <circle cx="0" cy="-15" r="4" fill="#D84444"/>
      <path d="M 0 -15 Q -10 -8 -12 6" fill="none" stroke="#D84444" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-12" cy="7" r="3" fill="#FBBF24" stroke="#78350F" stroke-width="1"/>
      <path d="M 0 -15 Q 8 -6 10 8" fill="none" stroke="#D84444" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="10" cy="9" r="3" fill="#FBBF24" stroke="#78350F" stroke-width="1"/>

      <!-- Biểu tượng đồng xu vàng đóng dấu ở bụng túi -->
      <circle cx="0" cy="18" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
      <text x="0" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="950" fill="#B45309">$</text>

      <!-- 2 đồng xu tràn rớt cạnh đáy túi -->
      <g transform="translate(-24, 40) rotate(-15) scale(0.85)">
        <use href="#iso-coin"/>
      </g>
      <g transform="translate(24, 42) rotate(20) scale(0.85)">
        <use href="#iso-coin"/>
      </g>

      <!-- Lấp lánh -->
      <use href="#glint" x="-26" y="-12" transform="scale(1.2)" filter="url(#goldGlow)"/>
    </g>

    <rect x="25" y="210" width="110" height="32" rx="8" fill="#F59E0B"/>
    <text x="80" y="231" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="950" fill="#FFFFFF">8,000 XU</text>
  </g>

  <!-- ========================================================= -->
  <!-- TIER 5: RƯƠNG KHO BÁU TRÀN NGẬP XU (TREASURE CHEST)       -->
  <!-- ========================================================= -->
  <g id="tier-5-chest" transform="translate(730, 20)">
    <rect width="160" height="260" rx="18" fill="#FFFDF8" stroke="#D84444" stroke-width="2.8" filter="url(#goldGlow)"/>
    <text x="80" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#D84444">CỰC ĐẠI</text>
    <text x="80" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="950" fill="#78350F">RƯƠNG VÀNG</text>

    <g transform="translate(80, 130)">
      <!-- Bóng đáy rương -->
      <ellipse cx="0" cy="46" rx="56" ry="16" fill="#2D2115" opacity="0.25"/>

      <!-- NẮP RƯƠNG HỎNG LÊN CAO PHÍA SAU -->
      <g transform="translate(0, -26) rotate(-14)">
        <path d="M -44 -10 C -44 -26 44 -26 44 -10 L 40 4 L -40 4 Z" fill="#9A3412" stroke="#451A03" stroke-width="2.8"/>
        <!-- Dải đai sắt nẹp nắp rương -->
        <path d="M -24 -18 C -24 -24 -16 -26 -16 -26 L -16 4 L -24 4 Z" fill="#F59E0B" stroke="#451A03" stroke-width="1.8"/>
        <path d="M 16 -18 C 16 -24 24 -26 24 -26 L 24 4 L 16 4 Z" fill="#F59E0B" stroke="#451A03" stroke-width="1.8"/>
      </g>

      <!-- THÂN RƯƠNG GỖ VIỀN ĐỒNG -->
      <path d="M -44 -6 L 44 -6 L 38 40 L -38 40 Z" fill="#7C2D12" stroke="#451A03" stroke-width="3" stroke-linejoin="round"/>
      <!-- Nẹp góc kim loại vàng đồng -->
      <path d="M -44 -6 L -34 -6 L -30 40 L -38 40 Z" fill="#F59E0B" stroke="#451A03" stroke-width="2"/>
      <path d="M 44 -6 L 34 -6 L 30 40 L 38 40 Z" fill="#F59E0B" stroke="#451A03" stroke-width="2"/>
      <!-- Ổ khóa đồng ở giữa rương -->
      <rect x="-10" y="2" width="20" height="22" rx="4" fill="#FBBF24" stroke="#451A03" stroke-width="2"/>
      <circle cx="0" cy="11" r="2.5" fill="#451A03"/>

      <!-- ĐỐNG TIỀN VÀNG TRÀN RA NGOÀI MẶT TRƯỚC RƯƠNG -->
      <g transform="translate(0, -6)">
        <!-- Đống vàng lồi lõm nhô khỏi miệng rương -->
        <ellipse cx="0" cy="0" rx="38" ry="14" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
        <!-- Hàng loạt đồng xu đè lên nhau tràn ra ngoài -->
        <use href="#iso-coin" x="-18" y="-4" transform="scale(0.85)"/>
        <use href="#iso-coin" x="16" y="-6" transform="scale(0.85)"/>
        <use href="#iso-coin" x="-4" y="2" transform="scale(0.9)"/>
        <use href="#iso-coin" x="18" y="4" transform="scale(0.8)"/>
        <use href="#iso-coin" x="-22" y="8" transform="scale(0.85)"/>
      </g>

      <!-- Xu rơi vung vãi dưới sàn mặt trước -->
      <g transform="translate(-28, 38) rotate(-22) scale(0.9)">
        <use href="#iso-coin"/>
      </g>
      <g transform="translate(24, 38) rotate(18) scale(0.9)">
        <use href="#iso-coin"/>
      </g>
      <g transform="translate(-2, 44) scale(0.95)">
        <use href="#iso-coin"/>
      </g>

      <!-- Chùm tia sáng hào quang VIP -->
      <use href="#glint" x="-34" y="-32" transform="scale(1.4)" filter="url(#goldGlow)"/>
      <use href="#glint" x="32" y="-20" transform="scale(1.2)" filter="url(#goldGlow)"/>
      <use href="#glint" x="0" y="-40" transform="scale(1.5)" filter="url(#goldGlow)"/>
    </g>

    <rect x="20" y="210" width="120" height="32" rx="8" fill="#D84444"/>
    <text x="80" y="231" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="950" fill="#FFFFFF">20,000 XU</text>
  </g>
</svg>