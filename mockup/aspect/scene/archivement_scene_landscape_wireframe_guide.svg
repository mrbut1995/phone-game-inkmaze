  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
      .ratio-spec { font-family: monospace; font-size: 28px; font-weight: 600; fill: #38BDF8; text-anchor: middle; }
      
      .box-screen { fill: #090D16; stroke: #475569; stroke-width: 5; rx: 32px; }
      .box-sheet { fill: #131E32; stroke: #38BDF8; stroke-width: 3.5; rx: 28px; }
      .box-header { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 16px; }
      .box-overview { fill: #1E293B; stroke: #F59E0B; stroke-width: 3; rx: 20px; }
      .box-tab-active { fill: #0284C7; stroke: #38BDF8; stroke-width: 2.5; rx: 14px; }
      .box-tab { fill: #1E293B; stroke: #64748B; stroke-width: 2; rx: 14px; }
      .box-card-achieve { fill: #1E293B; stroke: #6EA0C8; stroke-width: 2.5; rx: 20px; }
      .box-card-claim { fill: #1E293B; stroke: #F59E0B; stroke-width: 3; rx: 20px; }
      .box-card-locked { fill: #0F172A; stroke: #475569; stroke-width: 2; stroke-dasharray: 6 4; rx: 20px; }
      .box-stamp { fill: none; stroke: #EF4444; stroke-width: 2.5; stroke-dasharray: 6 3; rx: 10px; }

      .wire-label { font-family: system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .font-spec { font-family: monospace; font-weight: 700; fill: #FDE047; text-anchor: middle; dominant-baseline: central; }
      .dim-spec { font-family: monospace; font-size: 20px; font-weight: 600; fill: #94A3B8; text-anchor: middle; dominant-baseline: central; }
    </style>
