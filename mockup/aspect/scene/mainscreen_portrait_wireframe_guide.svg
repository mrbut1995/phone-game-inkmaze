      .ratio-spec { font-family: monospace; font-size: 26px; font-weight: 600; fill: #38BDF8; text-anchor: middle; }
      
      .box-screen { fill: #090D16; stroke: #475569; stroke-width: 4; rx: 32px; }
      .box-sheet { fill: #131E32; stroke: #38BDF8; stroke-width: 3.5; rx: 26px; }
      .box-logo { fill: #1E293B; stroke: #64748B; stroke-width: 2.5; rx: 18px; }
      .box-badge { fill: #1E293B; stroke: #F59E0B; stroke-width: 2.5; rx: 18px; }
