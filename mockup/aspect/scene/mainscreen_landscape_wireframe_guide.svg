    <text x="800" y="-18" class="ratio-spec">1600 × 1200 px · Sheet 1500×1100 px (2 Cột)</text>
    <rect width="1600" height="1200" class="box-screen"/>

    <!-- Tờ giấy Menu Sheet ngang -->
    <rect x="50" y="50" width="1500" height="1100" class="box-sheet"/>

    <!-- CỘT TRÁI (W: 550px): Logo Hero + Nút Danh Hiệu + Version -->
