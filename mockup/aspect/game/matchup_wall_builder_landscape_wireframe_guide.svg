    <!-- HUD Row: Timer & Đoạn Tường Rộng Rãi -->
    <rect x="1100" y="155" width="270" height="195" class="box-hud"/>
    <text x="1235" y="210" class="wire-label" font-size="20">⏱ THỜI GIAN (20px)</text>
    <text x="1235" y="280" class="font-spec" font-size="52">01:15 (52px)</text>

    <rect x="1390" y="155" width="690" height="195" class="box-hud"/>
    <text x="1735" y="195" class="wire-label" font-size="24">🧱 ĐÃ DỰNG: 14/18 ĐOẠN (52px)</text>
    <text x="1735" y="245" class="wire-label" font-size="22" fill="#F87171">❤️ LƯỢT GỬI: 3 / 3 LẦN (20px)</text>
    <text x="1735" y="285" class="font-spec" font-size="18">Slider &amp; Tag: 18px</text>
    <rect x="1420" y="315" width="630" height="14" rx="7" fill="#334155"/>
    <rect x="1420" y="315" width="485" height="14" rx="7" fill="#22C55E"/>

    <!-- Tip Banner -->
    <rect x="1100" y="365" width="980" height="80" class="box-tip"/>
    <text x="1590" y="405" class="font-spec" font-size="24">💡 Tip Banner: 24px (Thoáng rộng)</text>

    <!-- Action Tools -->
    <rect x="1100" y="460" width="475" height="240" class="box-action-draw"/>
    <text x="1337" y="555" class="wire-label" font-size="40">VẼ TƯỜNG</text>
    <text x="1337" y="615" class="font-spec" font-size="24">Title: 36px · Sub: 22px</text>

    <rect x="1605" y="460" width="475" height="240" class="box-action-submit"/>
    <text x="1842" y="555" class="wire-label" font-size="40">GỬI BÀI</text>
    <text x="1842" y="615" class="font-spec" font-size="24">Title: 36px · Sub: 22px</text>

    <rect x="1100" y="720" width="475" height="145" class="box-action-sub"/>
    <text x="1337" y="792" class="wire-label" font-size="28">HOÀN TÁC (UNDO: 26px)</text>

    <rect x="1605" y="720" width="475" height="145" class="box-action-sub"/>
    <text x="1842" y="792" class="wire-label" font-size="28">GỢI Ý (HINT: 26px)</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 10. TỈ LỆ 19.5:9 · 2340 x 1080 (NGANG SIÊU RỘNG)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(6180, 120)">
    <text x="1170" y="-55" class="title">10. Tỉ lệ 19.5:9 (Ngang Siêu Rộng)</text>
    <text x="1170" y="-18" class="ratio-spec">2340 × 1080 px · Sidebar 1120px · Cực thoáng</text>
    <rect width="2340" height="1080" class="box-screen" stroke="#38BDF8"/>
    <circle cx="40" cy="540" r="16" fill="#334155"/>

    <!-- Board 960x960 (Lùi vào 100px tránh Notch) -->
    <rect x="100" y="60" width="960" height="960" class="box-board"/>
    <text x="580" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ 25 Ô (960 × 960)</text>
    <text x="580" y="575" class="font-spec" font-size="32">HIỆN TẤT CẢ SỐ (KỂ CẢ SỐ 0): 52px</text>

    <!-- Header -->
    <rect x="1120" y="60" width="1120" height="85" class="box-header"/>
    <text x="1680" y="102" class="wire-label" font-size="32">XÂY TƯỜNG (WALL BUILDER)</text>

    <!-- HUD Row -->
    <rect x="1120" y="160" width="310" height="205" class="box-hud"/>
    <text x="1275" y="215" class="wire-label" font-size="22">⏱ THỜI GIAN (22px)</text>
    <text x="1275" y="290" class="font-spec" font-size="56">01:15 (56px)</text>

    <rect x="1450" y="160" width="790" height="205" class="box-hud"/>
    <text x="1845" y="205" class="wire-label" font-size="26">🧱 ĐÃ DỰNG: 14/18 ĐOẠN (56px)</text>
    <text x="1845" y="260" class="wire-label" font-size="24" fill="#F87171">❤️ LƯỢT GỬI CÒN LẠI: 3 / 3 (22px)</text>
    <text x="1845" y="305" class="font-spec" font-size="20">Slider Tiến Độ: 77% (20px)</text>
    <rect x="1485" y="335" width="720" height="16" rx="8" fill="#334155"/>
    <rect x="1485" y="335" width="555" height="16" rx="8" fill="#22C55E"/>

    <!-- Tip Banner -->
    <rect x="1120" y="380" width="1120" height="85" class="box-tip"/>
    <text x="1680" y="422" class="font-spec" font-size="24">💡 Tip Banner: 24px (Cực thoáng, không che ô)</text>

    <!-- Action Tools -->
    <rect x="1120" y="480" width="540" height="255" class="box-action-draw"/>
    <text x="1390" y="585" class="wire-label" font-size="42">VẼ TƯỜNG</text>
