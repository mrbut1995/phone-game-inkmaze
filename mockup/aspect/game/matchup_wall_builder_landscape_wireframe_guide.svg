<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9400 1500" width="100%" height="100%" style="background-color: #0B1120;">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
      .ratio-spec { font-family: monospace; font-size: 28px; font-weight: 600; fill: #38BDF8; text-anchor: middle; }
      
      .box-screen { fill: #090D16; stroke: #475569; stroke-width: 5; rx: 32px; }
      .box-header { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 16px; }
      .box-hud { fill: #131E32; stroke: #2E7D32; stroke-width: 3; rx: 20px; }
      .box-board { fill: #1E293B; stroke: #F43F5E; stroke-width: 4; stroke-dasharray: 14 10; rx: 24px; }
      .box-tip { fill: #1E293B; stroke: #F59E0B; stroke-width: 3; rx: 16px; }
      .box-action-draw { fill: #0284C7; stroke: #38BDF8; stroke-width: 3; rx: 20px; }
      .box-action-submit { fill: #15803D; stroke: #22C55E; stroke-width: 3.5; rx: 20px; }
      .box-action-sub { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 20px; }

      .wire-label { font-family: system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .font-spec { font-family: monospace; font-weight: 700; fill: #FDE047; text-anchor: middle; dominant-baseline: central; }
      .dim-spec { font-family: monospace; font-size: 20px; font-weight: 600; fill: #94A3B8; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- ========================================================================= -->
  <!-- 7. TỈ LỆ 4:3 · 1600 x 1200 (NGANG - TABLET / IPAD)                        -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 120)">
    <text x="800" y="-55" class="title">7. Tỉ lệ 4:3 (Ngang - Tablet)</text>
    <text x="800" y="-18" class="ratio-spec">1600 × 1200 px · Board Trái (1040×1040) · Cột Phải (420px)</text>
    <rect width="1600" height="1200" class="box-screen"/>

    <!-- Bên Trái: Board 1040x1040 (25 ô đồng nhất, có số cả ô 0) -->
    <rect x="60" y="80" width="1040" height="1040" class="box-board"/>
    <text x="580" y="580" class="wire-label" font-size="42" fill="#F43F5E">BÀN CỜ 25 Ô ĐỒNG NHẤT (1040 × 1040)</text>
    <text x="580" y="640" class="font-spec" font-size="34">HIỆN TẤT CẢ SỐ (KỂ CẢ SỐ 0): 56px</text>

    <!-- Cột Phải: Rộng 420px -->
    <!-- Header -->
    <rect x="1120" y="80" width="420" height="85" class="box-header"/>
    <text x="1330" y="112" class="wire-label" font-size="26">XÂY TƯỜNG (WALL BUILDER)</text>
    <text x="1330" y="142" class="font-spec" font-size="20">Header: 36px | Sub: 18px</text>

    <!-- HUD Timer -->
    <rect x="1120" y="180" width="420" height="105" class="box-hud"/>
    <text x="1330" y="215" class="wire-label" font-size="18">⏱ THỜI GIAN: 01:15</text>
    <text x="1330" y="255" class="font-spec" font-size="42">Clock: 42px</text>

    <!-- HUD Tiến Độ Dựng & Lượt Gửi -->
    <rect x="1120" y="300" width="420" height="190" class="box-hud"/>
    <text x="1330" y="335" class="wire-label" font-size="22">🧱 TIẾN ĐỘ DỰNG TƯỜNG</text>
    <text x="1330" y="390" class="font-spec" font-size="44">14/18 ĐOẠN (44px)</text>
    <text x="1330" y="435" class="wire-label" font-size="18" fill="#F87171">❤️ LƯỢT GỬI: 3 / 3 LẦN (16px)</text>
    <rect x="1145" y="465" width="370" height="12" rx="6" fill="#334155"/>
    <rect x="1145" y="465" width="285" height="12" rx="6" fill="#22C55E"/>

    <!-- Tip Banner -->
    <rect x="1120" y="505" width="420" height="90" class="box-tip"/>
    <text x="1330" y="550" class="font-spec" font-size="20">💡 Nối đủ tường quanh các ô rồi bấm GỬI (20px)</text>

    <!-- Action Tools -->
    <rect x="1120" y="610" width="420" height="180" class="box-action-draw"/>
    <text x="1330" y="680" class="wire-label" font-size="34">VẼ TƯỜNG</text>
    <text x="1330" y="735" class="font-spec" font-size="22">Title: 32px · Sub: 20px</text>

    <rect x="1120" y="805" width="420" height="160" class="box-action-submit"/>
    <text x="1330" y="870" class="wire-label" font-size="36">GỬI BÀI</text>
    <text x="1330" y="920" class="font-spec" font-size="22">Title: 32px · Sub: 20px</text>

    <rect x="1120" y="980" width="200" height="140" class="box-action-sub"/>
    <text x="1220" y="1050" class="wire-label" font-size="24">UNDO (22px)</text>

    <rect x="1340" y="980" width="200" height="140" class="box-action-sub"/>
    <text x="1440" y="1050" class="wire-label" font-size="24">HINT (22px)</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 8. TỈ LỆ 16:9 · 1920 x 1080 (NGANG CHUẨN - BASE)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(1820, 120)">
    <text x="960" y="-55" class="title">8. Tỉ lệ 16:9 (Ngang Chuẩn - Base)</text>
    <text x="960" y="-18" class="ratio-spec">1920 × 1080 px · Board Trái (960×960) · Sidebar Phải (810px)</text>
    <rect width="1920" height="1080" class="box-screen" stroke="#38BDF8"/>

    <!-- Board 960x960 -->
    <rect x="60" y="60" width="960" height="960" class="box-board"/>
    <text x="540" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ 25 Ô (960 × 960)</text>
    <text x="540" y="575" class="font-spec" font-size="32">HIỆN TẤT CẢ SỐ (KỂ CẢ SỐ 0): 52px</text>

    <!-- Header -->
    <rect x="1050" y="60" width="810" height="75" class="box-header"/>
