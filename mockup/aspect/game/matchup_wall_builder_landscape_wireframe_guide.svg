    <!-- Board 960x960 -->
    <rect x="80" y="60" width="960" height="960" class="box-board"/>
    <text x="560" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ 25 Ô (960 × 960)</text>
    <text x="560" y="575" class="font-spec" font-size="32">HIỆN TẤT CẢ SỐ (KỂ CẢ SỐ 0): 52px</text>

