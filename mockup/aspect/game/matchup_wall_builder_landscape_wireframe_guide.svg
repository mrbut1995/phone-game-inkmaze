    <text x="1585" y="235" class="wire-label" font-size="20" fill="#F87171">❤️ LƯỢT GỬI CÒN LẠI: 3 / 3 (18px)</text>
    <text x="1585" y="275" class="font-spec" font-size="16">Slider Tiến Độ: 77% (16px)</text>
    <rect x="1335" y="300" width="500" height="12" rx="6" fill="#334155"/>
