    <!-- Action Tools: 2 Nút Chính To Song Song (395px) + 2 Nút Phụ Dưới (395px) -->
    <rect x="1050" y="440" width="395" height="210" class="box-action-draw"/>
    <text x="1247" y="525" class="wire-label" font-size="36">VẼ TƯỜNG</text>
    <text x="1247" y="585" class="font-spec" font-size="22">Title: 34px · Sub: 20px</text>

    <rect x="1465" y="440" width="395" height="210" class="box-action-submit"/>
    <text x="1662" y="525" class="wire-label" font-size="38">GỬI BÀI</text>
    <text x="1662" y="585" class="font-spec" font-size="22">Title: 34px · Sub: 20px</text>

    <!-- Hàng nút phụ bên dưới -->
    <rect x="1050" y="670" width="395" height="140" class="box-action-sub"/>
    <text x="1247" y="740" class="wire-label" font-size="26">UNDO</text>
    <text x="1247" y="780" class="font-spec" font-size="20">22px</text>

    <rect x="1465" y="670" width="395" height="140" class="box-action-sub"/>
    <text x="1662" y="740" class="wire-label" font-size="26">HINT</text>
    <text x="1662" y="780" class="font-spec" font-size="20">22px</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 9. TỈ LỆ 18:9 · 2160 x 1080 (NGANG DÀI 2:1)                               -->
  <!-- ========================================================================= -->
  <g transform="translate(3880, 120)">
