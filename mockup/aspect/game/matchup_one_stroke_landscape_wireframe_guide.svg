<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9400 1500" width="100%" height="100%" style="background-color: #0B1120;">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
      .ratio-spec { font-family: monospace; font-size: 28px; font-weight: 600; fill: #38BDF8; text-anchor: middle; }
      
      .box-screen { fill: #090D16; stroke: #475569; stroke-width: 5; rx: 32px; }
      .box-header { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 16px; }
      .box-hud { fill: #131E32; stroke: #2575A7; stroke-width: 3; rx: 20px; }
      .box-board { fill: #1E293B; stroke: #F43F5E; stroke-width: 4; stroke-dasharray: 14 10; rx: 24px; }
      .box-tip { fill: #1E293B; stroke: #F59E0B; stroke-width: 3; rx: 16px; }
      .box-action-main { fill: #0284C7; stroke: #38BDF8; stroke-width: 3.5; rx: 22px; }
      .box-action-sub { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 20px; }

      .wire-label { font-family: system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .font-spec { font-family: monospace; font-weight: 700; fill: #FDE047; text-anchor: middle; dominant-baseline: central; }
      .dim-spec { font-family: monospace; font-size: 20px; font-weight: 600; fill: #94A3B8; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- ========================================================================= -->
  <!-- 7. TỈ LỆ 4:3 · 1600 x 1200 (NGANG - TABLET / IPAD)                        -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 120)">
    <text x="800" y="-55" class="title">7. Tỉ lệ 4:3 (Ngang - Tablet)</text>
    <text x="800" y="-18" class="ratio-spec">1600 × 1200 px · Board Trái (1040×1040) · Cột Phải (420px)</text>
    <rect width="1600" height="1200" class="box-screen"/>

    <!-- Bên Trái: Board 1040x1040 (Không số) -->
    <rect x="60" y="80" width="1040" height="1040" class="box-board"/>
    <text x="580" y="580" class="wire-label" font-size="42" fill="#F43F5E">BÀN CỜ ONE STROKE (1040 × 1040)</text>
    <text x="580" y="640" class="font-spec" font-size="32">Tường hiện 100% · KHÔNG CÓ SỐ</text>

    <!-- Cột Phải: Rộng 420px -->
    <!-- Header -->
    <rect x="1120" y="80" width="420" height="90" class="box-header"/>
    <text x="1330" y="115" class="wire-label" font-size="26">MỘT NÉT (ONE STROKE)</text>
    <text x="1330" y="145" class="font-spec" font-size="20">Header: 36px | Sub: 18px</text>

    <!-- HUD Thẻ Thời Gian -->
    <rect x="1120" y="185" width="420" height="120" class="box-hud"/>
    <text x="1330" y="220" class="wire-label" font-size="20">⏱ THỜI GIAN: 00:38</text>
    <text x="1330" y="265" class="font-spec" font-size="44">Clock: 44px</text>

    <!-- HUD Thẻ Phủ Kín -->
    <rect x="1120" y="320" width="420" height="180" class="box-hud"/>
    <text x="1330" y="355" class="wire-label" font-size="22">📐 TIẾN ĐỘ PHỦ KÍN</text>
    <text x="1330" y="410" class="font-spec" font-size="48">13/25 Ô (48px)</text>
    <text x="1330" y="460" class="font-spec" font-size="18">Slider &amp; Tag: 18px</text>

    <!-- Tip Banner -->
    <rect x="1120" y="515" width="420" height="100" class="box-tip"/>
    <text x="1330" y="565" class="font-spec" font-size="20">💡 Phủ kín mọi ô, ô cuối là F (20px)</text>

    <!-- Action Tools: Vẽ Đường Bản To + Undo/Hint Nhỏ Phía Dưới -->
    <rect x="1120" y="635" width="420" height="280" class="box-action-main"/>
    <text x="1330" y="750" class="wire-label" font-size="38">VẼ ĐƯỜNG ĐI</text>
    <text x="1330" y="810" class="font-spec" font-size="22">Title: 34px · Sub: 20px</text>

    <rect x="1120" y="935" width="200" height="185" class="box-action-sub"/>
    <text x="1220" y="1025" class="wire-label" font-size="26">UNDO</text>
    <text x="1220" y="1065" class="font-spec" font-size="20">22px</text>

    <rect x="1340" y="935" width="200" height="185" class="box-action-sub"/>
    <text x="1440" y="1025" class="wire-label" font-size="26">HINT</text>
    <text x="1440" y="1065" class="font-spec" font-size="20">22px</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 8. TỈ LỆ 16:9 · 1920 x 1080 (NGANG CHUẨN - BASE)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(1820, 120)">
    <text x="960" y="-55" class="title">8. Tỉ lệ 16:9 (Ngang Chuẩn - Base)</text>
    <text x="960" y="-18" class="ratio-spec">1920 × 1080 px · Board Trái (960×960) · Sidebar Phải (810px)</text>
    <rect width="1920" height="1080" class="box-screen" stroke="#38BDF8"/>

    <!-- Board 960x960 -->
    <rect x="60" y="60" width="960" height="960" class="box-board"/>
    <text x="540" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ ONE STROKE (960 × 960)</text>
    <text x="540" y="575" class="font-spec" font-size="30">Tường hiện 100% · KHÔNG HIỆN SỐ</text>

    <!-- Header -->
    <rect x="1050" y="60" width="810" height="75" class="box-header"/>
    <text x="1455" y="97" class="wire-label" font-size="28">MỘT NÉT (ONE STROKE)</text>

    <!-- HUD Row: Time Trái (270) - Phủ Kín Phải (520) -->
    <rect x="1050" y="150" width="270" height="180" class="box-hud"/>
    <text x="1185" y="200" class="wire-label" font-size="20">⏱ THỜI GIAN (18px)</text>
    <text x="1185" y="265" class="font-spec" font-size="50">00:38 (50px)</text>

    <rect x="1340" y="150" width="520" height="180" class="box-hud"/>
    <text x="1600" y="195" class="wire-label" font-size="22">📐 ĐÃ PHỦ KÍN 13/25 Ô</text>
    <text x="1600" y="245" class="font-spec" font-size="38">52% (Font: 48px)</text>
    <text x="1600" y="295" class="font-spec" font-size="18">Slider &amp; Lời nhắc luật: 18px</text>

    <!-- Tip Banner -->
    <rect x="1050" y="345" width="810" height="75" class="box-tip"/>
    <text x="1455" y="382" class="font-spec" font-size="22">💡 Vẽ 1 nét phủ kín các ô, không lặp, ô cuối là F! (22px)</text>

    <!-- Action Tools: Vẽ Đường Bản Rộng (560px) + Undo (115px) + Hint (115px) -->
    <rect x="1050" y="435" width="560" height="235" class="box-action-main"/>
    <text x="1330" y="530" class="wire-label" font-size="40">VẼ ĐƯỜNG ĐI</text>
    <text x="1330" y="595" class="font-spec" font-size="24">Title: 36px · Sub: 22px</text>

    <rect x="1630" y="435" width="110" height="235" class="box-action-sub"/>
    <text x="1685" y="540" class="wire-label" font-size="24">UNDO</text>
    <text x="1685" y="585" class="font-spec" font-size="20">20px</text>

    <rect x="1750" y="435" width="110" height="235" class="box-action-sub"/>
    <text x="1805" y="540" class="wire-label" font-size="24">HINT</text>
    <text x="1805" y="585" class="font-spec" font-size="20">20px</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 9. TỈ LỆ 18:9 · 2160 x 1080 (NGANG DÀI 2:1)                               -->
  <!-- ========================================================================= -->
  <g transform="translate(3880, 120)">
    <text x="1080" y="-55" class="title">9. Tỉ lệ 18:9 (Ngang Dài 2:1)</text>
    <text x="1080" y="-18" class="ratio-spec">2160 × 1080 px · Sidebar rộng 980px</text>
    <rect width="2160" height="1080" class="box-screen"/>

    <!-- Board 960x960 -->
    <rect x="80" y="60" width="960" height="960" class="box-board"/>
    <text x="560" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ ONE STROKE (960 × 960)</text>
    <text x="560" y="575" class="font-spec" font-size="30">Tường hiện 100% · KHÔNG CÓ SỐ</text>

    <!-- Header -->
    <rect x="1100" y="60" width="980" height="80" class="box-header"/>
    <text x="1590" y="100" class="wire-label" font-size="30">MỘT NÉT (ONE STROKE)</text>

    <!-- HUD Row: Timer & Phủ Kín Rộng Rãi -->
    <rect x="1100" y="155" width="310" height="190" class="box-hud"/>
    <text x="1255" y="210" class="wire-label" font-size="20">⏱ THỜI GIAN (20px)</text>
    <text x="1255" y="280" class="font-spec" font-size="54">00:38 (54px)</text>

    <rect x="1430" y="155" width="650" height="190" class="box-hud"/>
    <text x="1755" y="205" class="wire-label" font-size="24">📐 ĐÃ PHỦ KÍN 13/25 Ô</text>
    <text x="1755" y="260" class="font-spec" font-size="52">13/25 Ô (52px)</text>
    <text x="1755" y="310" class="font-spec" font-size="20">Progress Bar &amp; Chips: 20px</text>

    <!-- Tip Banner -->
    <rect x="1100" y="360" width="980" height="80" class="box-tip"/>
    <text x="1590" y="400" class="font-spec" font-size="24">💡 Tip Banner: 24px (Thoáng rộng)</text>

    <!-- Action Tools -->
    <rect x="1100" y="455" width="680" height="245" class="box-action-main"/>
    <text x="1440" y="555" class="wire-label" font-size="42">VẼ ĐƯỜNG ĐI</text>
    <text x="1440" y="620" class="font-spec" font-size="24">Title: 38px · Sub: 22px</text>

    <rect x="1805" y="455" width="135" height="245" class="box-action-sub"/>
    <text x="1872" y="560" class="wire-label" font-size="26">UNDO</text>
    <text x="1872" y="605" class="font-spec" font-size="22">22px</text>

    <rect x="1945" y="455" width="135" height="245" class="box-action-sub"/>
    <text x="2012" y="560" class="wire-label" font-size="26">HINT</text>
    <text x="2012" y="605" class="font-spec" font-size="22">22px</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 10. TỈ LỆ 19.5:9 · 2340 x 1080 (NGANG SIÊU RỘNG)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(6180, 120)">
    <text x="1170" y="-55" class="title">10. Tỉ lệ 19.5:9 (Ngang Siêu Rộng)</text>
    <text x="1170" y="-18" class="ratio-spec">2340 × 1080 px · Sidebar 1120px · Khoảng cách thao tác siêu thoáng</text>
    <rect width="2340" height="1080" class="box-screen" stroke="#38BDF8"/>
    <circle cx="40" cy="540" r="16" fill="#334155"/>

    <!-- Board 960x960 (Lùi vào 100px tránh Notch) -->
    <rect x="100" y="60" width="960" height="960" class="box-board"/>
    <text x="580" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ ONE STROKE (960 × 960)</text>
    <text x="580" y="575" class="font-spec" font-size="30">Tường hiện 100% · KHÔNG CÓ SỐ</text>

    <!-- Header -->
    <rect x="1120" y="60" width="1120" height="85" class="box-header"/>
    <text x="1680" y="102" class="wire-label" font-size="32">MỘT NÉT (ONE STROKE)</text>

    <!-- HUD Row -->
    <rect x="1120" y="160" width="340" height="200" class="box-hud"/>
    <text x="1290" y="220" class="wire-label" font-size="22">⏱ THỜI GIAN (22px)</text>
    <text x="1290" y="295" class="font-spec" font-size="56">00:38 (56px)</text>

    <rect x="1485" y="160" width="755" height="200" class="box-hud"/>
    <text x="1862" y="215" class="wire-label" font-size="26">📐 ĐÃ PHỦ KÍN 13/25 Ô</text>
    <text x="1862" y="275" class="font-spec" font-size="56">13/25 Ô (56px)</text>
    <text x="1862" y="325" class="font-spec" font-size="22">Slider Tiến độ &amp; Chip trạng thái: 22px</text>

    <!-- Tip Banner -->
    <rect x="1120" y="380" width="1120" height="85" class="box-tip"/>
    <text x="1680" y="422" class="font-spec" font-size="24">💡 Tip Banner: 24px (Cực thoáng, không che ô)</text>

    <!-- Action Tools -->
    <rect x="1120" y="480" width="780" height="260" class="box-action-main"/>
    <text x="1510" y="585" class="wire-label" font-size="44">VẼ ĐƯỜNG ĐI</text>
    <text x="1510" y="655" class="font-spec" font-size="26">Title: 40px · Sub: 24px</text>

    <rect x="1920" y="480" width="150" height="260" class="box-action-sub"/>
    <text x="1995" y="590" class="wire-label" font-size="28">UNDO</text>
    <text x="1995" y="640" class="font-spec" font-size="24">24px</text>

    <rect x="2090" y="480" width="150" height="260" class="box-action-sub"/>
    <text x="2165" y="590" class="wire-label" font-size="28">HINT</text>
    <text x="2165" y="640" class="font-spec" font-size="24">24px</text>
  </g>
</svg>