    <text x="540" y="1050" class="wire-label" font-size="38" fill="#F43F5E">KHU VỰC BÀN CỜ (980 × 980)</text>
    <text x="540" y="1100" class="font-spec" font-size="32">Cell: 176px | Số Hint: 52px</text>

