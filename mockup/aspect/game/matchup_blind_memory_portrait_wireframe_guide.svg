    <text x="180" y="285" class="wire-label" font-size="22">⏱ THỜI GIAN</text>
    <text x="180" y="345" class="font-spec" font-size="52">01:24 (52px)</text>

    <rect x="330" y="235" width="700" height="160" class="box-hud"/>
    <text x="680" y="295" class="wire-label" font-size="22">🎯 THỬ THÁCH (Thẻ to rõ không bị ép)</text>
    <text x="680" y="345" class="font-spec" font-size="20">Item text: 20px | Badge: 16px</text>

    <!-- Board 980x980 -->
    <rect x="50" y="510" width="980" height="980" class="box-board"/>
    <text x="540" y="980" class="wire-label" font-size="38" fill="#F43F5E">KHU VỰC BÀN CỜ (980 × 980)</text>
    <text x="540" y="1030" class="font-spec" font-size="32">Cell: 176px | Số Hint: 52px</text>

    <!-- Rule Tip Banner -->
    <rect x="50" y="1590" width="980" height="100" class="box-tip"/>
    <text x="540" y="1645" class="font-spec" font-size="24">💡 Tip Banner: 24px (Cao 100px cực thoáng)</text>

    <!-- Action Tools (Thanh nút cao 165px ngón tay bấm rất sướng) -->
    <rect x="50" y="1750" width="360" height="165" class="box-action"/>
    <text x="230" y="1815" class="wire-label" font-size="32">VẼ ĐƯỜNG</text>
    <text x="230" y="1865" class="font-spec" font-size="22">30px · Sub: 18px</text>

    <rect x="430" y="1750" width="360" height="165" class="box-action-sub"/>
    <text x="610" y="1815" class="wire-label" font-size="32">GHI NHỚ</text>
    <text x="610" y="1865" class="font-spec" font-size="22">30px · Sub: 18px</text>

    <rect x="810" y="1750" width="105" height="165" class="box-action-sub"/>
    <text x="862" y="1825" class="wire-label" font-size="22">UNDO</text>
    <text x="862" y="1865" class="font-spec" font-size="18">18px</text>

    <rect x="925" y="1750" width="105" height="165" class="box-action-sub"/>
    <text x="977" y="1825" class="wire-label" font-size="22">HINT</text>
    <text x="977" y="1865" class="font-spec" font-size="18">18px</text>

    <!-- Bottom Inset Space & Bar -->
