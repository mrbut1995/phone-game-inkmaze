    <!-- Header -->
    <rect x="50" y="110" width="980" height="90" class="box-header"/>
    <text x="540" y="142" class="wire-label" font-size="26">HEADER (Top Offset: 110px Safe Area)</text>
    <text x="540" y="175" class="font-spec" font-size="22">Title: 40px | Chapter: 18px</text>

    <!-- HUD -->
