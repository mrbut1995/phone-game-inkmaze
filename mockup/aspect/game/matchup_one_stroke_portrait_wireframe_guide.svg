<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7800 2700" width="100%" height="100%" style="background-color: #0B1120;">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 40px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
      .ratio-spec { font-family: monospace; font-size: 26px; font-weight: 600; fill: #38BDF8; text-anchor: middle; }
      
      .box-screen { fill: #090D16; stroke: #475569; stroke-width: 4; rx: 32px; }
      .box-header { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 16px; }
      .box-hud { fill: #131E32; stroke: #2575A7; stroke-width: 3; rx: 20px; }
      .box-board { fill: #1E293B; stroke: #F43F5E; stroke-width: 4; stroke-dasharray: 14 10; rx: 24px; }
      .box-tip { fill: #1E293B; stroke: #F59E0B; stroke-width: 3; rx: 16px; }
