<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9400 1500" width="100%" height="100%" style="background-color: #0B1120;">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
      .ratio-spec { font-family: monospace; font-size: 28px; font-weight: 600; fill: #38BDF8; text-anchor: middle; }
      
      .box-screen { fill: #090D16; stroke: #475569; stroke-width: 5; rx: 32px; }
      .box-header { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 16px; }
      .box-hud-side { fill: #131E32; stroke: #6EA0C8; stroke-width: 3; rx: 18px; }
      .box-hud-step { fill: #1E293B; stroke: #D84444; stroke-width: 4; rx: 22px; }
      .box-board { fill: #1E293B; stroke: #F43F5E; stroke-width: 4; stroke-dasharray: 14 10; rx: 24px; }
      .box-tip { fill: #1E293B; stroke: #F59E0B; stroke-width: 3; rx: 16px; }
      .box-action { fill: #0284C7; stroke: #38BDF8; stroke-width: 3; rx: 20px; }
      .box-action-sub { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 20px; }

      .wire-label { font-family: system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .font-spec { font-family: monospace; font-weight: 700; fill: #FDE047; text-anchor: middle; dominant-baseline: central; }
      .step-val { font-family: system-ui, sans-serif; font-weight: 900; fill: #EF4444; text-anchor: middle; dominant-baseline: central; }
      .dim-spec { font-family: monospace; font-size: 20px; font-weight: 600; fill: #94A3B8; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- ========================================================================= -->
  <!-- 7. TỈ LỆ 4:3 · 1600 x 1200 (NGANG - TABLET / IPAD)                        -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 120)">
    <text x="800" y="-55" class="title">7. Tỉ lệ 4:3 (Ngang - Tablet)</text>
    <text x="800" y="-18" class="ratio-spec">1600 × 1200 px · Board Trái (1040×1040) · Cột Phải (440px)</text>
    <rect width="1600" height="1200" class="box-screen"/>

    <!-- Bên Trái: Board 1040x1040 -->
    <rect x="60" y="80" width="1040" height="1040" class="box-board"/>
    <text x="580" y="580" class="wire-label" font-size="42" fill="#F43F5E">BÀN CỜ TRÁI (1040 × 1040)</text>
    <text x="580" y="640" class="font-spec" font-size="34">Số manh mối: 56px</text>

    <!-- Cột Phải: Rộng 420px -->
    <!-- Header -->
    <rect x="1120" y="80" width="420" height="90" class="box-header"/>
    <text x="1330" y="125" class="wire-label" font-size="28">DUNGEON MODE (Header: 38px)</text>

    <!-- HUD Step To Nổi Bật (Đặt ưu tiên trên cùng) -->
    <rect x="1120" y="190" width="420" height="160" class="box-hud-step"/>
    <text x="1330" y="235" class="wire-label" font-size="26" fill="#F87171">SỐ BƯỚC (28px)</text>
    <text x="1330" y="300" class="step-val" font-size="74">14 (Font: 74px)</text>

    <!-- HUD Row: Timer & Floor song song -->
    <rect x="1120" y="370" width="200" height="130" class="box-hud-side"/>
    <text x="1220" y="405" class="wire-label" font-size="18">⏱ THỜI GIAN (18px)</text>
    <text x="1220" y="455" class="font-spec" font-size="40">01:24 (40px)</text>

    <rect x="1340" y="370" width="200" height="130" class="box-hud-side"/>
    <text x="1440" y="405" class="wire-label" font-size="18">🏰 TẦNG (18px)</text>
    <text x="1440" y="455" class="font-spec" font-size="46">04 (48px)</text>

    <!-- Tip Banner -->
    <rect x="1120" y="520" width="420" height="100" class="box-tip"/>
    <text x="1330" y="570" class="font-spec" font-size="20">💡 Vạch đường xuống hố thang (20px)</text>

    <!-- Action Tools -->
    <rect x="1120" y="640" width="420" height="190" class="box-action"/>
    <text x="1330" y="715" class="wire-label" font-size="34">VẼ ĐƯỜNG</text>
    <text x="1330" y="770" class="font-spec" font-size="22">Title: 32px · Sub: 20px</text>

    <rect x="1120" y="850" width="420" height="140" class="box-action-sub"/>
    <text x="1330" y="905" class="wire-label" font-size="28">GHI NHỚ</text>
    <text x="1330" y="950" class="font-spec" font-size="20">Title: 26px · Sub: 18px</text>

    <rect x="1120" y="1010" width="200" height="90" class="box-action-sub"/>
    <text x="1220" y="1055" class="wire-label" font-size="22">UNDO (22px)</text>

    <rect x="1340" y="1010" width="200" height="90" class="box-action-sub"/>
    <text x="1440" y="1055" class="wire-label" font-size="22">HINT (22px)</text>
  </g>


  <!-- ========================================================================= -->
