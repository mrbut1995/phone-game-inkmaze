    <text x="1590" y="280" class="step-val" font-size="88">14 (Font: 88px)</text>

    <rect x="1830" y="160" width="250" height="190" class="box-hud-side"/>
    <text x="1955" y="210" class="wire-label" font-size="20">🏰 TẦNG (20px)</text>
    <text x="1955" y="280" class="font-spec" font-size="60">04 (60px)</text>

    <!-- Tip Banner -->
    <rect x="1100" y="380" width="980" height="80" class="box-tip"/>
    <text x="1590" y="420" class="font-spec" font-size="24">💡 Tip Banner: 24px (Thoáng rộng)</text>

    <!-- Action Tools -->
    <rect x="1100" y="485" width="475" height="245" class="box-action"/>
    <text x="1337" y="585" class="wire-label" font-size="40">VẼ ĐƯỜNG</text>
    <text x="1337" y="645" class="font-spec" font-size="24">Title: 36px · Sub: 22px</text>

    <rect x="1605" y="485" width="475" height="245" class="box-action-sub"/>
    <text x="1842" y="585" class="wire-label" font-size="40">GHI NHỚ</text>
    <text x="1842" y="645" class="font-spec" font-size="24">Title: 36px · Sub: 22px</text>

    <rect x="1100" y="755" width="475" height="145" class="box-action-sub"/>
    <text x="1337" y="827" class="wire-label" font-size="28">HOÀN TÁC (UNDO: 26px)</text>

    <rect x="1605" y="755" width="475" height="145" class="box-action-sub"/>
    <text x="1842" y="827" class="wire-label" font-size="28">GỢI Ý (HINT: 26px)</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 10. TỈ LỆ 19.5:9 · 2340 x 1080 (NGANG SIÊU RỘNG)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(6180, 120)">
    <text x="1170" y="-55" class="title">10. Tỉ lệ 19.5:9 (Ngang Siêu Rộng)</text>
    <text x="1170" y="-18" class="ratio-spec">2340 × 1080 px · Sidebar 1180px · Step Count 92px</text>
    <rect width="2340" height="1080" class="box-screen" stroke="#38BDF8"/>
    <circle cx="40" cy="540" r="16" fill="#334155"/>

    <!-- Board 960x960 (Lùi vào 100px tránh Notch) -->
    <rect x="100" y="60" width="960" height="960" class="box-board"/>
    <text x="580" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ TRÁI (960 × 960)</text>
    <text x="580" y="575" class="font-spec" font-size="32">Số manh mối: 52px</text>

    <!-- Header -->
    <rect x="1120" y="60" width="1120" height="85" class="box-header"/>
