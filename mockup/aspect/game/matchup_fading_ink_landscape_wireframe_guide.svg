    <!-- HUD Row -->
    <rect x="1120" y="165" width="280" height="200" class="box-hud-side"/>
    <text x="1260" y="215" class="wire-label" font-size="22">⏱ THỜI GIAN (22px)</text>
    <text x="1260" y="290" class="font-spec" font-size="56">01:24 (56px)</text>

    <rect x="1425" y="150" width="510" height="225" class="box-hud-step"/>
    <text x="1680" y="200" class="wire-label" font-size="28" fill="#F87171">SỐ BƯỚC (32px)</text>
    <text x="1680" y="290" class="step-val" font-size="92">14 (Font: 92px)</text>

    <rect x="1960" y="165" width="280" height="200" class="box-hud-side"/>
    <text x="2100" y="215" class="wire-label" font-size="22">🏰 TẦNG (22px)</text>
    <text x="2100" y="290" class="font-spec" font-size="64">04 (64px)</text>

    <!-- Tip Banner -->
    <rect x="1120" y="395" width="1120" height="85" class="box-tip"/>
    <text x="1680" y="437" class="font-spec" font-size="24">💡 Tip Banner: 24px (Cực thoáng, không che ô)</text>

    <!-- Action Tools -->
    <rect x="1120" y="505" width="540" height="255" class="box-action"/>
    <text x="1390" y="610" class="wire-label" font-size="42">VẼ ĐƯỜNG</text>
