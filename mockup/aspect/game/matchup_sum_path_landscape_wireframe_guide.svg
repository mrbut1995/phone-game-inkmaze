    <text x="1330" y="765" class="font-spec" font-size="22">Title: 32px · Sub: 20px</text>

    <rect x="1120" y="835" width="420" height="135" class="box-action-sub"/>
    <text x="1330" y="885" class="wire-label" font-size="28">GHI NHỚ</text>
    <text x="1330" y="930" class="font-spec" font-size="20">Title: 26px · Sub: 18px</text>

    <rect x="1120" y="985" width="200" height="135" class="box-action-sub"/>
    <text x="1220" y="1055" class="wire-label" font-size="24">UNDO (22px)</text>

    <rect x="1340" y="985" width="200" height="135" class="box-action-sub"/>
    <text x="1440" y="1055" class="wire-label" font-size="24">HINT (22px)</text>
  </g>


