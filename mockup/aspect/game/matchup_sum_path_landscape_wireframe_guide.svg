    <text x="1330" y="255" class="font-spec" font-size="42">Clock: 42px</text>

    <!-- HUD Bảng Tính Hợp Nhất -->
    <rect x="1120" y="305" width="420" height="210" class="box-hud-calc"/>
    <text x="1330" y="335" class="wire-label" font-size="16">🎯 CÂN BẰNG TỔNG ĐIỂM (14px)</text>
    <text x="1220" y="380" class="wire-label" font-size="18">TỔNG: 16 (40px)</text>
    <text x="1330" y="380" class="wire-label" font-size="28" fill="#F43F5E">=</text>
    <text x="1440" y="380" class="wire-label" font-size="18" fill="#F87171">MỤC TIÊU: 50 (40px)</text>
    <text x="1330" y="425" class="font-spec" font-size="18">Chip: CẦN THÊM +34 (14px)</text>
    <rect x="1145" y="465" width="370" height="14" rx="7" fill="#334155"/>
