    <line x1="1620" y1="175" x2="1620" y2="295" stroke="#334155" stroke-width="2"/>
    <text x="1840" y="195" class="dim-spec" font-size="15">ĐÃ TIÊU: -08 BƯỚC</text>
    <text x="1840" y="225" class="font-spec" font-size="14">CƯỚC: 1-2 RẺ | 3-4 ĐẮT</text>
