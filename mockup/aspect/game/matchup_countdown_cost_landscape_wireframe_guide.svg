<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9400 1500" width="100%" height="100%" style="background-color: #0B1120;">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
      .ratio-spec { font-family: monospace; font-size: 28px; font-weight: 600; fill: #38BDF8; text-anchor: middle; }
      
      .box-screen { fill: #090D16; stroke: #475569; stroke-width: 5; rx: 32px; }
      .box-header { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 16px; }
      .box-hud-time { fill: #131E32; stroke: #6EA0C8; stroke-width: 3; rx: 18px; }
      .box-hud-cost { fill: #131E32; stroke: #C2410C; stroke-width: 3; rx: 20px; }
      .box-board { fill: #1E293B; stroke: #F43F5E; stroke-width: 4; stroke-dasharray: 14 10; rx: 24px; }
      .box-tip { fill: #1E293B; stroke: #F59E0B; stroke-width: 3; rx: 16px; }
      .box-action { fill: #C2410C; stroke: #FDBA74; stroke-width: 3; rx: 20px; }
      .box-action-sub { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 20px; }

      .wire-label { font-family: system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .font-spec { font-family: monospace; font-weight: 700; fill: #FDE047; text-anchor: middle; dominant-baseline: central; }
      .dim-spec { font-family: monospace; font-size: 20px; font-weight: 600; fill: #94A3B8; text-anchor: middle; dominant-baseline: central; }
      .tag-cost { font-family: system-ui, sans-serif; font-weight: 900; fill: #EA580C; text-anchor: middle; dominant-baseline: central; }
      .tag-green { font-family: system-ui, sans-serif; font-weight: 900; fill: #22C55E; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- ========================================================================= -->
  <!-- 7. TỈ LỆ 4:3 · 1600 x 1200 (NGANG - TABLET / IPAD)                        -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 120)">
    <text x="800" y="-55" class="title">7. Tỉ lệ 4:3 (Ngang - Tablet)</text>
    <text x="800" y="-18" class="ratio-spec">1600 × 1200 px · Board Trái (1040×1040) · Cột Phải (420px)</text>
    <rect width="1600" height="1200" class="box-screen"/>

    <!-- Bên Trái: Board 1040x1040 -->
    <rect x="60" y="80" width="1040" height="1040" class="box-board"/>
    <text x="580" y="580" class="wire-label" font-size="42" fill="#F43F5E">BÀN CỜ TRÁI (1040 × 1040)</text>
    <text x="580" y="640" class="font-spec" font-size="34">Con số cước phí ô: 56px</text>

    <!-- Cột Phải: Rộng 420px -->
    <!-- Header -->
    <rect x="1120" y="80" width="420" height="90" class="box-header"/>
    <text x="1330" y="112" class="font-spec" font-size="16">DAILY CHALLENGE (16px)</text>
    <text x="1330" y="142" class="wire-label" font-size="24">⏳ COUNTDOWN COST (28px)</text>

    <!-- HUD Row: Timer & Ngân Sách Còn/Đã Tiêu -->
    <rect x="1120" y="185" width="180" height="115" class="box-hud-time"/>
    <text x="1210" y="215" class="wire-label" font-size="16">⏱ THỜI GIAN (16px)</text>
    <text x="1210" y="260" class="font-spec" font-size="40">00:36 (40px)</text>

    <rect x="1315" y="185" width="225" height="115" class="box-hud-cost"/>
    <text x="1427" y="215" class="tag-cost" font-size="14">CÒN / ĐÃ TIÊU</text>
    <text x="1427" y="260" class="font-spec" font-size="36">08/16 <tspan font-size="22" fill="#94A3B8">(-08)</tspan></text>

    <!-- Thẻ Chi Tiết Sổ Thu Chi & Giá Cước Ô -->
    <rect x="1120" y="315" width="420" height="175" class="box-hud-cost"/>
    <text x="1330" y="345" class="tag-cost" font-size="15">🧾 SỔ THEO DÕI NGÂN SÁCH (14px)</text>
    <text x="1330" y="380" class="font-spec" font-size="14">1-2: RẺ | 3-4: ĐẮT (12px)</text>
    <rect x="1135" y="415" width="390" height="50" rx="10" fill="#1E293B" stroke="#EA580C" stroke-width="1.5"/>
    <text x="1330" y="440" class="wire-label" font-size="13">Thanh 16 phân đoạn ngân sách (Cao: 12px)</text>

    <!-- Tip Banner -->
    <rect x="1120" y="505" width="420" height="90" class="box-tip"/>
    <text x="1330" y="550" class="font-spec" font-size="18">💡 Chọn đường cước rẻ để không cạn ngân sách (18px)</text>

    <!-- Action Tools -->
    <rect x="1120" y="610" width="420" height="185" class="box-action"/>
    <text x="1330" y="680" class="wire-label" font-size="34">VẼ ĐƯỜNG</text>
    <text x="1330" y="735" class="font-spec" font-size="20">Title: 32px · Sub: 18px</text>

    <rect x="1120" y="810" width="420" height="135" class="box-action-sub"/>
    <text x="1330" y="865" class="wire-label" font-size="28">GHI NHỚ</text>
    <text x="1330" y="910" class="font-spec" font-size="18">Title: 26px · Sub: 16px</text>

    <rect x="1120" y="960" width="200" height="90" class="box-action-sub"/>
    <text x="1220" y="995" class="wire-label" font-size="18">UNDO (16px)</text>
    <text x="1220" y="1025" class="tag-green" font-size="13">+HOÀN (13px)</text>

    <rect x="1340" y="960" width="200" height="90" class="box-action-sub"/>
    <text x="1440" y="1005" class="wire-label" font-size="20">HINT (18px)</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 8. TỈ LỆ 16:9 · 1920 x 1080 (NGANG CHUẨN - BASE)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(1820, 120)">
