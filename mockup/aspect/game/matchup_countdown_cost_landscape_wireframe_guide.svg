    <text x="1455" y="397" class="font-spec" font-size="22">💡 Mỗi ô là cước phí trừ vào quỹ bước — chọn đường rẻ nhất! (22px)</text>

    <!-- Action Tools -->
    <rect x="1050" y="455" width="810" height="235" class="box-action"/>
    <text x="1455" y="550" class="wire-label" font-size="40">VẼ ĐƯỜNG (CHÍNH)</text>
    <text x="1455" y="615" class="font-spec" font-size="22">Title: 34px · Sub: 20px</text>

    <!-- Hàng nút phụ -->
    <rect x="1050" y="715" width="460" height="165" class="box-action-sub"/>
    <text x="1280" y="780" class="wire-label" font-size="30">GHI NHỚ</text>
    <text x="1280" y="825" class="font-spec" font-size="20">Title: 28px · Sub: 18px</text>

    <rect x="1530" y="715" width="155" height="165" class="box-action-sub"/>
    <text x="1607" y="775" class="wire-label" font-size="22">UNDO (18px)</text>
    <text x="1607" y="815" class="tag-green" font-size="14">+HOÀN (14px)</text>

    <rect x="1705" y="715" width="155" height="165" class="box-action-sub"/>
    <text x="1782" y="795" class="wire-label" font-size="22">HINT (18px)</text>
  </g>


  <!-- ========================================================================= -->
