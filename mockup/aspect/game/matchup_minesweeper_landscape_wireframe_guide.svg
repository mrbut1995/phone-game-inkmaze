    <text x="1170" y="-18" class="ratio-spec">2340 × 1080 px · Sidebar 1120px · Safe Area Lùi Tránh Notch</text>
    <rect width="2340" height="1080" class="box-screen" stroke="#38BDF8"/>
    <circle cx="40" cy="540" r="16" fill="#334155"/>

    <!-- Board 960x960 (Lùi 100px tránh Camera Notch) -->
    <rect x="100" y="60" width="960" height="960" class="box-board"/>
    <text x="580" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ TRÁI (960 × 960)</text>
    <text x="580" y="575" class="font-spec" font-size="32">Số mìn 8 ô lân cận: 60px | Start/Finish: 52px</text>

    <!-- Header -->
    <rect x="1120" y="60" width="1120" height="85" class="box-header"/>
    <text x="1680" y="90" class="font-spec" font-size="18">DAILY CHALLENGE (26px)</text>
    <text x="1680" y="120" class="wire-label" font-size="30">MINESWEEPER MAZE 💣 (42px)</text>

    <!-- HUD -->
    <rect x="1120" y="165" width="310" height="210" class="box-hud-time"/>
    <text x="1275" y="225" class="wire-label" font-size="22">⏱ THỜI GIAN (22px)</text>
    <text x="1275" y="300" class="font-spec" font-size="56">00:37 (56px)</text>

    <rect x="1455" y="165" width="785" height="210" class="box-hud-bomb"/>
    <text x="1720" y="225" class="wire-label" font-size="28" fill="#F87171">BOM CÒN LẠI (32px)</text>
    <text x="1720" y="305" class="bomb-val" font-size="94">2/3 (Font: 94px)</text>
    <circle cx="2110" cy="270" r="60" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    <text x="2110" y="270" class="wire-label" font-size="18">STICKER BOM</text>

    <!-- Tip Banner -->
    <rect x="1120" y="395" width="1120" height="85" class="box-tip"/>
    <text x="1680" y="437" class="font-spec" font-size="24">💡 Tip Banner: 24px (Cực thoáng, không che ô)</text>

    <!-- Action Tools -->
    <rect x="1120" y="505" width="540" height="255" class="box-action"/>
    <text x="1390" y="632" class="wire-label" font-size="44">VẼ ĐƯỜNG (42px)</text>

    <rect x="1685" y="505" width="555" height="255" class="box-action-sub"/>
    <text x="1962" y="632" class="wire-label" font-size="44">GHI NHỚ (42px)</text>

    <rect x="1120" y="785" width="540" height="150" class="box-action-sub"/>
    <text x="1390" y="860" class="wire-label" font-size="30">HOÀN TÁC (UNDO: 28px)</text>

    <rect x="1685" y="785" width="555" height="150" class="box-action-sub"/>
    <text x="1962" y="860" class="wire-label" font-size="30">GỢI Ý (HINT: 28px)</text>
  </g>
</svg>