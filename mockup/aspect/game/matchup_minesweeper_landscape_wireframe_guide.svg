    <!-- Tip Banner -->
    <rect x="1050" y="360" width="810" height="75" class="box-tip"/>
    <text x="1455" y="397" class="font-spec" font-size="22">💡 Số ô = số mìn 8 ô lân cận · đạp mìn = THUA NGAY! (22px)</text>

    <!-- Action Tools -->
    <rect x="1050" y="455" width="810" height="235" class="box-action"/>
    <text x="1455" y="572" class="wire-label" font-size="42">VẼ ĐƯỜNG (40px)</text>

    <!-- Hàng nút phụ -->
    <rect x="1050" y="715" width="460" height="165" class="box-action-sub"/>
    <text x="1280" y="797" class="wire-label" font-size="34">GHI NHỚ (36px)</text>

    <rect x="1530" y="715" width="155" height="165" class="box-action-sub"/>
    <text x="1607" y="797" class="wire-label" font-size="24">UNDO (20px)</text>

    <rect x="1705" y="715" width="155" height="165" class="box-action-sub"/>
    <text x="1782" y="797" class="wire-label" font-size="24">HINT (20px)</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 9. TỈ LỆ 18:9 · 2160 x 1080 (NGANG DÀI 2:1)                               -->
  <!-- ========================================================================= -->
  <g transform="translate(3880, 120)">
