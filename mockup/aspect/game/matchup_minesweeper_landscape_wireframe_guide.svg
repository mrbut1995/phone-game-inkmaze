    <text x="1080" y="-18" class="ratio-spec">2160 × 1080 px · Sidebar rộng 980px</text>
    <rect width="2160" height="1080" class="box-screen"/>

    <!-- Board 960x960 -->
    <rect x="80" y="60" width="960" height="960" class="box-board"/>
    <text x="560" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ TRÁI (960 × 960)</text>
    <text x="560" y="575" class="font-spec" font-size="32">Số mìn 8 ô lân cận: 60px | Start/Finish: 52px</text>

    <!-- Header -->
    <rect x="1100" y="60" width="980" height="80" class="box-header"/>
    <text x="1590" y="88" class="font-spec" font-size="18">DAILY CHALLENGE (24px)</text>
    <text x="1590" y="118" class="wire-label" font-size="28">MINESWEEPER MAZE 💣 (40px)</text>

    <!-- HUD: Timer & Thẻ Bom Rộng Rãi -->
    <rect x="1100" y="155" width="280" height="200" class="box-hud-time"/>
    <text x="1240" y="210" class="wire-label" font-size="22">⏱ THỜI GIAN (20px)</text>
    <text x="1240" y="280" class="font-spec" font-size="52">00:37 (52px)</text>

    <rect x="1400" y="155" width="680" height="200" class="box-hud-bomb"/>
    <text x="1620" y="210" class="wire-label" font-size="26" fill="#F87171">BOM CÒN LẠI (30px)</text>
    <text x="1620" y="285" class="bomb-val" font-size="88">2/3 (Font: 88px)</text>
    <circle cx="1960" cy="255" r="54" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    <text x="1960" y="255" class="wire-label" font-size="18">STICKER BOM</text>

    <!-- Tip Banner -->
    <rect x="1100" y="375" width="980" height="80" class="box-tip"/>
    <text x="1590" y="415" class="font-spec" font-size="24">💡 Tip Banner: 24px (Thoáng rộng)</text>

    <!-- Action Tools -->
    <rect x="1100" y="480" width="475" height="250" class="box-action"/>
    <text x="1337" y="605" class="wire-label" font-size="42">VẼ ĐƯỜNG (40px)</text>

    <rect x="1605" y="480" width="475" height="250" class="box-action-sub"/>
    <text x="1842" y="605" class="wire-label" font-size="42">GHI NHỚ (40px)</text>

    <rect x="1100" y="755" width="475" height="145" class="box-action-sub"/>
    <text x="1337" y="827" class="wire-label" font-size="28">HOÀN TÁC (UNDO: 26px)</text>

    <rect x="1605" y="755" width="475" height="145" class="box-action-sub"/>
    <text x="1842" y="827" class="wire-label" font-size="28">GỢI Ý (HINT: 26px)</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 10. TỈ LỆ 19.5:9 · 2340 x 1080 (NGANG SIÊU RỘNG)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(6180, 120)">
