<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9400 1500" width="100%" height="100%" style="background-color: #0B1120;">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
      .ratio-spec { font-family: monospace; font-size: 28px; font-weight: 600; fill: #38BDF8; text-anchor: middle; }
      
      .box-screen { fill: #090D16; stroke: #475569; stroke-width: 5; rx: 32px; }
      .box-header { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 16px; }
      .box-hud-time { fill: #131E32; stroke: #6EA0C8; stroke-width: 3; rx: 18px; }
      .box-hud-bomb { fill: #1E293B; stroke: #D84444; stroke-width: 4; rx: 22px; }
      .box-board { fill: #1E293B; stroke: #F43F5E; stroke-width: 4; stroke-dasharray: 14 10; rx: 24px; }
      .box-tip { fill: #1E293B; stroke: #F59E0B; stroke-width: 3; rx: 16px; }
      .box-action { fill: #0284C7; stroke: #38BDF8; stroke-width: 3; rx: 20px; }
      .box-action-sub { fill: #1E293B; stroke: #64748B; stroke-width: 3; rx: 20px; }

      .wire-label { font-family: system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .font-spec { font-family: monospace; font-weight: 700; fill: #FDE047; text-anchor: middle; dominant-baseline: central; }
      .dim-spec { font-family: monospace; font-size: 20px; font-weight: 600; fill: #94A3B8; text-anchor: middle; dominant-baseline: central; }
      .bomb-val { font-family: system-ui, sans-serif; font-weight: 950; fill: #EF4444; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- ========================================================================= -->
  <!-- 7. TỈ LỆ 4:3 · 1600 x 1200 (NGANG - TABLET / IPAD)                        -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 120)">
    <text x="800" y="-55" class="title">7. Tỉ lệ 4:3 (Ngang - Tablet)</text>
    <text x="800" y="-18" class="ratio-spec">1600 × 1200 px · Board Trái (1040×1040) · Cột Phải (420px)</text>
    <rect width="1600" height="1200" class="box-screen"/>

    <!-- Bên Trái: Board 1040x1040 -->
    <rect x="60" y="80" width="1040" height="1040" class="box-board"/>
    <text x="580" y="580" class="wire-label" font-size="42" fill="#F43F5E">BÀN CỜ TRÁI (1040 × 1040)</text>
    <text x="580" y="640" class="font-spec" font-size="34">Số mìn 8 ô lân cận: 64px | Start/Finish: 56px</text>

    <!-- Cột Phải: Rộng 420px -->
    <!-- Header -->
    <rect x="1120" y="80" width="420" height="90" class="box-header"/>
    <text x="1330" y="112" class="font-spec" font-size="16">DAILY CHALLENGE (20px)</text>
    <text x="1330" y="142" class="wire-label" font-size="24">MINESWEEPER MAZE 💣 (32px)</text>

    <!-- HUD Thẻ Bom To Nổi Bật (Đặt trên cùng) -->
    <rect x="1120" y="185" width="420" height="165" class="box-hud-bomb"/>
    <text x="1270" y="235" class="wire-label" font-size="24" fill="#F87171">BOM CÒN LẠI (28px)</text>
    <text x="1270" y="300" class="bomb-val" font-size="74">2/3 (Font: 74px)</text>
    <circle cx="1465" cy="268" r="42" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    <text x="1465" y="268" class="wire-label" font-size="16">STICKER</text>

    <!-- HUD Timer (Ngang 420px) -->
    <rect x="1120" y="365" width="420" height="95" class="box-hud-time"/>
    <text x="1230" y="412" class="wire-label" font-size="18">⏱ THỜI GIAN (18px)</text>
    <text x="1390" y="412" class="font-spec" font-size="38">00:37 (44px)</text>

    <!-- Tip Banner -->
    <rect x="1120" y="475" width="420" height="90" class="box-tip"/>
    <text x="1330" y="520" class="font-spec" font-size="18">💡 Đạp mìn = THUA NGAY! (18px)</text>

    <!-- Action Tools -->
    <rect x="1120" y="580" width="420" height="185" class="box-action"/>
    <text x="1330" y="672" class="wire-label" font-size="36">VẼ ĐƯỜNG (36px)</text>

    <rect x="1120" y="780" width="420" height="140" class="box-action-sub"/>
    <text x="1330" y="850" class="wire-label" font-size="32">GHI NHỚ (32px)</text>

    <rect x="1120" y="935" width="200" height="90" class="box-action-sub"/>
    <text x="1220" y="980" class="wire-label" font-size="22">UNDO (20px)</text>

    <rect x="1340" y="935" width="200" height="90" class="box-action-sub"/>
    <text x="1440" y="980" class="wire-label" font-size="22">HINT (20px)</text>
  </g>


  <!-- ========================================================================= -->
  <!-- 8. TỈ LỆ 16:9 · 1920 x 1080 (NGANG CHUẨN - BASE)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(1820, 120)">
    <text x="960" y="-55" class="title">8. Tỉ lệ 16:9 (Ngang Chuẩn - Base)</text>
    <text x="960" y="-18" class="ratio-spec">1920 × 1080 px · Board Trái (960×960) · Sidebar Phải (810px)</text>
    <rect width="1920" height="1080" class="box-screen" stroke="#38BDF8"/>

    <!-- Board 960x960 -->
    <rect x="60" y="60" width="960" height="960" class="box-board"/>
    <text x="540" y="520" class="wire-label" font-size="40" fill="#F43F5E">BÀN CỜ TRÁI (960 × 960)</text>
    <text x="540" y="575" class="font-spec" font-size="32">Số mìn 8 ô lân cận: 60px | Start/Finish: 52px</text>

    <!-- Header -->
    <rect x="1050" y="60" width="810" height="75" class="box-header"/>
    <text x="1455" y="87" class="font-spec" font-size="16">DAILY CHALLENGE (22px)</text>
    <text x="1455" y="115" class="wire-label" font-size="26">MINESWEEPER MAZE 💣 (36px)</text>

    <!-- HUD: Timer Trái (240) & Thẻ Bom Phải (550) Song Song -->
    <rect x="1050" y="150" width="240" height="195" class="box-hud-time"/>
    <text x="1170" y="200" class="wire-label" font-size="20">⏱ THỜI GIAN (18px)</text>
