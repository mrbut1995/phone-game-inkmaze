<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- 1. Lưới vở học sinh nền 40px -->
    <pattern id="achieveBgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FB9D2" stroke-width="1.2" opacity="0.55"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3D83AE" stroke-width="2" opacity="0.18"/>
    </pattern>

    <!-- 2. Đổ bóng tự nhiên cho tờ giấy lớn -->
    <filter id="achieveSheetShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2D2115" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2D2115" flood-opacity="0.10"/>
    </filter>

    <!-- Đổ bóng ghim kim loại -->
    <filter id="clipShadowAchieve" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1E2830" flood-opacity="0.25"/>
    </filter>

    <!-- Đổ bóng thẻ thành tựu & nút bấm -->
    <filter id="cardShadowAchieve" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2830" flood-opacity="0.10"/>
    </filter>

    <!-- Đổ bóng nút Back -->
    <filter id="uiShadow" x="-10%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E2830" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- ================= 1. NỀN TRANG VỞ Ô LY ================= -->
  <rect width="1080" height="1920" fill="#FAF5EB"/>
  <rect width="1080" height="1920" fill="url(#achieveBgGrid)"/>
  <line x1="90" y1="0" x2="90" y2="1920" stroke="#D84444" stroke-width="3.5"/>

  <!-- ================= 2. STATUS BAR ANDROID ================= -->
  <g fill="#3D5A73" font-family="-apple-system, sans-serif" font-size="28" font-weight="600">
    <text x="60" y="55">09:41</text>
    <g transform="translate(940, 34)" stroke="#3D5A73" stroke-width="3" fill="none">
      <path d="M0 16 A 16 16 0 0 1 24 16" stroke-linecap="round"/>
      <circle cx="12" cy="24" r="2" fill="#3D5A73"/>
    </g>
    <rect x="980" y="36" width="44" height="22" rx="5" fill="none" stroke="#3D5A73" stroke-width="3"/>
    <rect x="984" y="40" width="28" height="14" rx="2" fill="#3D5A73"/>
  </g>

  <!-- ================= 3. TOP HEADER ================= -->
  <!-- Nút Back quay về Main Screen -->
  <g transform="translate(50, 85)" filter="url(#uiShadow)" style="cursor: pointer;">
    <rect width="70" height="70" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="3"/>
    <path d="M42 23 L26 35 L42 47" fill="none" stroke="#3D83AE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="540" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="950" fill="#224C6D" letter-spacing="1.5">SỔ TAY THÀNH TỰU</text>

  <!-- ================= 4. MẢNH GIẤY THÀNH TỰU (920 x 1550 px) ================= -->
  <!-- Đặt tại x=80, y=190 -->
  <g transform="translate(80, 190)">

    <!-- TỜ GIẤY CHÍNH CÓ ĐỔ BÓNG NỔI KHỐI -->
    <g filter="url(#achieveSheetShadow)">
      <rect width="920" height="1550" rx="24" fill="#FFFDF8"/>

      <!-- Hàng lỗ bấm ghim mép trái -->
      <g fill="#EAE3D2" opacity="0.65">
        <circle cx="26" cy="100" r="8"/><circle cx="26" cy="220" r="8"/><circle cx="26" cy="340" r="8"/>
        <circle cx="26" cy="460" r="8"/><circle cx="26" cy="580" r="8"/><circle cx="26" cy="700" r="8"/>
        <circle cx="26" cy="820" r="8"/><circle cx="26" cy="940" r="8"/><circle cx="26" cy="1060" r="8"/>
        <circle cx="26" cy="1180" r="8"/><circle cx="26" cy="1300" r="8"/><circle cx="26" cy="1420" r="8"/>
      </g>

      <!-- Dòng kẻ ngang mờ của sổ -->
      <g stroke="#8FB9D2" stroke-width="1" opacity="0.32">
        <line x1="65" y1="160" x2="855" y2="160"/><line x1="65" y1="240" x2="855" y2="240"/>
        <line x1="65" y1="320" x2="855" y2="320"/><line x1="65" y1="400" x2="855" y2="400"/>
        <line x1="65" y1="480" x2="855" y2="480"/><line x1="65" y1="560" x2="855" y2="560"/>
        <line x1="65" y1="640" x2="855" y2="640"/><line x1="65" y1="720" x2="855" y2="720"/>
        <line x1="65" y1="800" x2="855" y2="800"/><line x1="65" y1="880" x2="855" y2="880"/>
        <line x1="65" y1="960" x2="855" y2="960"/><line x1="65" y1="1040" x2="855" y2="1040"/>
        <line x1="65" y1="1120" x2="855" y2="1120"/><line x1="65" y1="1200" x2="855" y2="1200"/>
        <line x1="65" y1="1280" x2="855" y2="1280"/><line x1="65" y1="1360" x2="855" y2="1360"/>
        <line x1="65" y1="1440" x2="855" y2="1440"/>
      </g>

      <!-- Lề đỏ của mảnh giấy -->
      <line x1="75" y1="0" x2="75" y2="1550" stroke="#D84444" stroke-width="2.5" opacity="0.85"/>
      <!-- Viền mực xanh bao quanh -->
      <rect width="920" height="1550" rx="24" fill="none" stroke="#6EA0C8" stroke-width="3.5"/>
    </g>

    <!-- DẢI BĂNG DÍNH WASHI TAPE TRÊN ĐỈNH GIỮA -->
    <g transform="translate(350, -22)">
      <rect width="220" height="48" rx="4" fill="#E8DFCA" fill-opacity="0.85" stroke="#D1C6AE" stroke-width="1.5"/>
      <path d="M 20 0 L 0 20 M 60 0 L 0 60 M 100 0 L 48 48 M 140 0 L 88 48 M 180 0 L 128 48 M 220 0 L 168 48" 
            stroke="#B5A98F" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- GHIM KẸP GIẤY KIM LOẠI Ở GÓC TRÊN TRÁI -->
    <g transform="translate(105, -18)" filter="url(#clipShadowAchieve)">
      <path d="M 0 50 L 0 12 A 12 12 0 0 1 24 12 L 24 60 A 18 18 0 0 1 -12 60 L -12 18" 
            fill="none" stroke="#7A8F9B" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- ================= 5. THẺ TỔNG KẾT TIẾN ĐỘ THÀNH TỰU (OVERVIEW CARD) ================= -->
    <!-- Đặt tại x=110, y=55, kích thước 710 x 120 px -->
    <g transform="translate(110, 55)" filter="url(#cardShadowAchieve)">
      <rect width="710" height="120" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
      <!-- Lề đỏ nhỏ -->
      <line x1="24" y1="0" x2="24" y2="120" stroke="#D84444" stroke-width="2.5"/>

      <!-- Icon Cúp vàng lớn -->
      <text x="50" y="75" font-size="44">🏆</text>

      <!-- Nội dung tiến độ -->
      <g transform="translate(110, 36)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#224C6D">TIẾN ĐỘ THU THẬP DANH HIỆU</text>
        <!-- Thanh Slider Bar đo tiến độ 72% -->
        <g transform="translate(0, 16)">
          <rect width="440" height="14" rx="7" fill="#EAE4D5" stroke="#90BBD4" stroke-width="1"/>
          <rect width="316" height="14" rx="7" fill="#3D83AE"/>
          <text x="455" y="12" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#3D83AE">72%</text>
        </g>
        <text x="0" y="52" font-family="sans-serif" font-size="15" font-weight="700" fill="#718B9E">Đã mở: 18 / 25 Danh hiệu • Điểm: 1,450 AP</text>
      </g>
    </g>

    <!-- ================= 6. HÀNG TAB PHÂN LOẠI (CATEGORY TABS) ================= -->
    <!-- Đặt tại x=110, y=195, gồm 4 tab dán nhãn -->
    <g transform="translate(110, 195)">
      <!-- Tab 1: TẤT CẢ (ACTIVE) -->
      <g transform="translate(0, 0)" style="cursor: pointer;">
        <rect width="170" height="46" rx="12" fill="#3D83AE" stroke="#256286" stroke-width="2"/>
        <text x="85" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">TẤT CẢ (25)</text>
      </g>
      <!-- Tab 2: VƯỢT ẢI -->
      <g transform="translate(180, 0)" style="cursor: pointer;">
        <rect width="170" height="46" rx="12" fill="#FEFDFA" stroke="#8FB9D2" stroke-width="2"/>
        <text x="85" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#718B9E">MÀN CHƠI</text>
      </g>
      <!-- Tab 3: DUNGEON -->
      <g transform="translate(360, 0)" style="cursor: pointer;">
        <rect width="170" height="46" rx="12" fill="#FEFDFA" stroke="#8FB9D2" stroke-width="2"/>
        <text x="85" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#718B9E">DUNGEON</text>
      </g>
      <!-- Tab 4: DAILY -->
      <g transform="translate(540, 0)" style="cursor: pointer;">
        <rect width="170" height="46" rx="12" fill="#FEFDFA" stroke="#8FB9D2" stroke-width="2"/>
        <text x="85" y="29" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#718B9E">DAILY</text>
      </g>
    </g>

    <!-- ================= 7. DANH SÁCH 5 THẺ THÀNH TỰU (ACHIEVEMENT CARDS) ================= -->
    <!-- Kích thước mỗi thẻ: 710 x 170 px, khoảng cách y: 190 px -->

    <!-- THẺ 1: ĐÃ ĐẠT & ĐÃ NHẬN THƯỞNG (CLAIMED) -->
    <g transform="translate(110, 265)" filter="url(#cardShadowAchieve)">
      <rect width="710" height="170" rx="18" fill="#FEFDFA" stroke="#6EA0C8" stroke-width="2.5"/>
      <line x1="22" y1="0" x2="22" y2="170" stroke="#2E7D32" stroke-width="3"/>

      <!-- Icon Huân chương xanh lá -->
      <circle cx="65" cy="85" r="32" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
      <text x="65" y="98" text-anchor="middle" font-size="34">🎯</text>

      <!-- Nội dung Thành tựu -->
      <g transform="translate(115, 38)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#224C6D">Nhà Thám Hiểm Tập Sự</text>
        <text x="0" y="28" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Vượt qua 10 màn chơi đầu tiên trong Play Mode</text>
        <!-- Tiến độ 100% -->
        <g transform="translate(0, 44)">
          <rect width="360" height="10" rx="5" fill="#EAE4D5"/>
          <rect width="360" height="10" rx="5" fill="#2E7D32"/>
          <text x="0" y="30" font-family="sans-serif" font-size="14" font-weight="800" fill="#2E7D32">Tiến độ: 10 / 10 Màn (Hoàn thành)</text>
        </g>
      </g>

      <!-- Dấu mộc mực đỏ: ✔ ĐÃ ĐẠT -->
      <g transform="translate(560, 48) rotate(-8)">
        <rect width="125" height="74" rx="10" fill="#D84444" fill-opacity="0.08" stroke="#D84444" stroke-width="2.8" stroke-dasharray="6 3"/>
        <text x="62" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="950" fill="#D84444">ĐÃ ĐẠT</text>
        <text x="62" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#D84444">+50 💵</text>
      </g>
    </g>

    <!-- THẺ 2: SẴN SÀNG NHẬN THƯỞNG (CLAIMABLE — NỔI BẬT NHẤT) -->
    <g transform="translate(110, 455)" filter="url(#cardShadowAchieve)">
      <rect width="710" height="170" rx="18" fill="#FFFDF8" stroke="#F59E0B" stroke-width="3"/>
      <line x1="22" y1="0" x2="22" y2="170" stroke="#F59E0B" stroke-width="3"/>

      <!-- Icon Bom mìn Minesweeper -->
      <circle cx="65" cy="85" r="32" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="65" y="98" text-anchor="middle" font-size="34">💣</text>

      <g transform="translate(115, 38)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#224C6D">Chuyên Gia Gỡ Mìn</text>
        <text x="0" y="28" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Đánh dấu chính xác 30 ô mìn bằng Anchor tường</text>
        <g transform="translate(0, 44)">
          <rect width="360" height="10" rx="5" fill="#EAE4D5"/>
          <rect width="360" height="10" rx="5" fill="#F59E0B"/>
          <text x="0" y="30" font-family="sans-serif" font-size="14" font-weight="800" fill="#D97706">Tiến độ: 30 / 30 Ô mìn</text>
        </g>
      </g>

      <!-- NÚT BẤM NHẬN THƯỞNG NỔI BẬT (CLAIM BUTTON) -->
      <g transform="translate(520, 60)" style="cursor: pointer;">
        <rect width="165" height="52" rx="14" fill="#3D83AE" stroke="#256286" stroke-width="2.5"/>
        <line x1="16" y1="0" x2="16" y2="52" stroke="#FAF5EB" stroke-width="2" opacity="0.5"/>
        <text x="92" y="33" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">NHẬN +100 💵</text>
      </g>
    </g>

    <!-- THẺ 3: ĐANG TIẾN HÀNH (IN PROGRESS — DUNGEON MODE) -->
    <g transform="translate(110, 645)" filter="url(#cardShadowAchieve)">
      <rect width="710" height="170" rx="18" fill="#FEFDFA" stroke="#D1E2ED" stroke-width="2"/>
      <line x1="22" y1="0" x2="22" y2="170" stroke="#3D83AE" stroke-width="2.5"/>

      <!-- Icon Lâu đài Dungeon -->
      <circle cx="65" cy="85" r="32" fill="#F0F7FB" stroke="#8FB9D2" stroke-width="1.8"/>
      <text x="65" y="98" text-anchor="middle" font-size="34">🏰</text>

      <g transform="translate(115, 38)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#224C6D">Kẻ Chinh Phục Ngục Tối</text>
        <text x="0" y="28" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Tiến sâu tới Tầng 15 trong Dungeon Mode</text>
        <!-- Tiến độ 80% = 288px -->
        <g transform="translate(0, 44)">
          <rect width="360" height="10" rx="5" fill="#EAE4D5"/>
          <rect width="288" height="10" rx="5" fill="#3D83AE"/>
          <text x="0" y="30" font-family="sans-serif" font-size="14" font-weight="800" fill="#3D83AE">Tiến độ: 12 / 15 Tầng (80%)</text>
        </g>
      </g>

      <!-- Huy hiệu phần thưởng chờ nhận -->
      <g transform="translate(545, 65)">
        <rect width="135" height="42" rx="10" fill="#FAF5EB" stroke="#8FB9D2" stroke-width="1.5"/>
        <text x="67" y="27" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#718B9E">Thưởng: +150 💵</text>
      </g>
    </g>

    <!-- THẺ 4: ĐANG TIẾN HÀNH (IN PROGRESS — DAILY STREAK) -->
    <g transform="translate(110, 835)" filter="url(#cardShadowAchieve)">
      <rect width="710" height="170" rx="18" fill="#FEFDFA" stroke="#D1E2ED" stroke-width="2"/>
      <line x1="22" y1="0" x2="22" y2="170" stroke="#D84444" stroke-width="2.5"/>

      <!-- Icon Lửa Streak -->
      <circle cx="65" cy="85" r="32" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.8"/>
      <text x="65" y="98" text-anchor="middle" font-size="34">🔥</text>

      <g transform="translate(115, 38)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#224C6D">Chuỗi Ngày Kỷ Luật</text>
        <text x="0" y="28" font-family="sans-serif" font-size="16" font-weight="600" fill="#718B9E">Duy trì chuỗi chơi 14 ngày trong Daily Challenge</text>
        <!-- Tiến độ 50% = 180px -->
        <g transform="translate(0, 44)">
          <rect width="360" height="10" rx="5" fill="#EAE4D5"/>
          <rect width="180" height="10" rx="5" fill="#D84444"/>
          <text x="0" y="30" font-family="sans-serif" font-size="14" font-weight="800" fill="#D84444">Tiến độ: 7 / 14 Ngày (50%)</text>
        </g>
      </g>

      <g transform="translate(545, 65)">
        <rect width="135" height="42" rx="10" fill="#FAF5EB" stroke="#8FB9D2" stroke-width="1.5"/>
        <text x="67" y="27" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#718B9E">Thưởng: +200 💵</text>
      </g>
    </g>

    <!-- THẺ 5: THÀNH TỰU ẨN BỊ KHÓA (SECRET & LOCKED) -->
    <g transform="translate(110, 1025)" opacity="0.65">
      <rect width="710" height="170" rx="18" fill="#F4EFE6" stroke="#BAC7CF" stroke-width="1.8"/>
      <line x1="22" y1="0" x2="22" y2="170" stroke="#BAC7CF" stroke-width="2.5" stroke-dasharray="5 3"/>

      <!-- Icon Ổ khóa nét vẽ mực -->
      <g transform="translate(65, 85)">
        <circle cx="0" cy="0" r="30" fill="#EAE4D7"/>
        <path d="M -8 -2 L -8 -12 A 8 8 0 0 1 8 -12 L 8 -2" fill="none" stroke="#7A8F9B" stroke-width="3" stroke-linecap="round"/>
        <rect x="-13" y="-2" width="26" height="20" rx="5" fill="#DFDCD5" stroke="#7A8F9B" stroke-width="2.5"/>
        <circle cx="0" cy="7" r="2" fill="#7A8F9B"/>
      </g>

      <g transform="translate(115, 48)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#7A8F9B">Thành Tựu Ẩn • Chưa Khám Phá</text>
        <text x="0" y="28" font-family="sans-serif" font-size="16" font-weight="600" fill="#A1B1BC">Hoàn thành ván đấu 7×7 mà không dùng bất kỳ gợi ý nào</text>
        <text x="0" y="58" font-family="sans-serif" font-size="14" font-weight="700" fill="#A1B1BC">Tiến độ: ??? / ???</text>
      </g>

      <g transform="translate(545, 65)">
        <rect width="135" height="42" rx="10" fill="#EFECE6" stroke="#BAC7CF" stroke-width="1.2"/>
        <text x="67" y="27" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#A1B1BC">🔒 KHÓA</text>
      </g>
    </g>

    <!-- ================= 8. CHÂN TRANG MẢNH GIẤY THÀNH TỰU ================= -->
    <g transform="translate(110, 1315)">
      <text x="355" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-style="italic" font-weight="600" fill="#718B9E">
        ~ Mỗi bước đi chuẩn xác đều ghi dấu vào sổ tay thành tích của bạn ~
      </text>

      <!-- Dấu mộc số lượng huân chương -->
      <g transform="translate(560, 100) rotate(-6)" opacity="0.85">
        <rect width="150" height="46" rx="8" fill="#D84444" fill-opacity="0.08" stroke="#D84444" stroke-width="2.5" stroke-dasharray="6 3"/>
        <text x="75" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#D84444">18/25 BADGES</text>
      </g>
    </g>
  </g>

  <!-- ================= 9. ANDROID HOME GESTURE BAR ================= -->
  <rect x="420" y="1875" width="240" height="8" rx="4" fill="#3D5A73" opacity="0.4"/>
</svg>